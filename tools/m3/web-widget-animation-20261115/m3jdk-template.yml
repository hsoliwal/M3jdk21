else {\n\t\t\t\tdirty.add(r);\n\t\t\t}\n\t\t\trepaint(dy != 0 ? new Rectangle(0, 0, getWidth(), getHeight()) : new Rectangle(damage[0], damage[1], damage[2], damage[3]));\n\t\t}\n\t\tif (model.isAnimating() && !timer.isRunning()) {\n\t\t\ttimer.start();\n\t\t}\n\t}\n\n\t/** Short scroll: moves the retained body plane along the model's axis inside the viewport rect. */\n\tprivate void blit(int dy) {\n\t\tGraphics2D g = body.createGraphics();\n\t\tint o = model.viewOrigin(), len = model.viewLength();\n\t\tif (model.scrollsHorizontally()) {\n\t\t\tg.setClip(o, 0, len, getHeight());\n\t\t\tg.copyArea(o + Math.max(0, -dy), 0, len - Math.abs(dy), getHeight(), dy, 0);\n\t\t} else {\n\t\t\tg.setClip(0, o, getWidth(), len);\n\t\t\tg.copyArea(0, o + Math.max(0, -dy), getWidth(), len - Math.abs(dy), 0, dy);\n\t\t}\n\t\tg.dispose();\n\t}\n\n\t/** One animation frame from the Swing timer (package-visible for the component contract). */\n\tvoid tick() {\n\t\tif (!partVisible || !model.tick(16)) {\n\t\t\ttimer.stop();\n\t\t}\n\t}\n\n\t/** Retained body plane: re-renders only the dirty region (or everything after a resize), then blits the plane. */\n\t@Override\n\tprotected void paintComponent(Graphics g) {\n\t\tint w = Math.max(1, getWidth()), h = Math.max(1, getHeight());\n\t\tif (body == null || body.getWidth() != w || body.getHeight() != h) {\n\t\t\tbody = new java.awt.image.BufferedImage(w, h, java.awt.image.BufferedImage.TYPE_INT_RGB);\n\t\t\tdirtyAll = true;\n\t\t}\n\t\tif (dirtyAll || !dirty.isEmpty()) {\n\t\t\trender(dirtyAll ? new Rectangle(0, 0, w, h) : dirty.intersection(new Rectangle(0, 0, w, h)));\n\t\t}\n\t\tg.drawImage(body, 0, 0, null);\n\t}\n\n\tprivate void render(Rectangle clip) {\n\t\tGraphics2D g2 = body.createGraphics();\n\t\tg2.setRenderingHint(RenderingHints.KEY_ANTIALIASING, RenderingHints.VALUE_ANTIALIAS_ON);\n\t\tg2.setClip(clip);\n\t\tg2.setColor(color(model.theme().slot(0)));\n\t\tg2.fillRect(clip.x, clip.y, clip.width, clip.height);\n\t\tmodel.paint(p