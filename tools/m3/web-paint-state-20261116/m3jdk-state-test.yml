      fileContents: "/*******************************************************************************\n * Copyright (c) 2026 Synexia, Hitesh Soliwal (hsoliwal@gmail.com) and others.\n *\n * This program and the accompanying materials are made available under the\n * terms of the Apache License, Version 2.0, or (at your option) the Eclipse\n * Public License 2.0, which are available at\n * https://www.apache.org/licenses/LICENSE-2.0 and\n * https://www.eclipse.org/legal/epl-2.0/\n *\n * SPDX-License-Identifier: Apache-2.0 OR EPL-2.0\n *\n * Contributors:\n *     Hitesh Soliwal (Synexia) - initial API and implementation\n *******************************************************************************/\npackage jdk.m3.swing.web.model;\n\nimport static jdk.m3.swing.web.model.M3WebStates.*;\nimport java.util.ArrayList;\nimport java.util.Arrays;\nimport java.util.List;\nimport org.junit.jupiter.api.Test;\n\n/** Existing state publication contracts, including the explicitly specified virtual-layout boundary. */\npublic final class M3WebStateGeometryTest {\n private static void need(boolean condition,String message){if(!condition)throw new AssertionError(message);}\n private static M3CardModel card(){M3CardModel m=new M3CardModel();m.layout(360,240);return m;}\n private static List<String> texts(M3WebModel m){M3WebPaint p=new M3WebPaint();m.paint(p);List<String> a=new ArrayList<>();for(int i=0;i<p.count();i++)if(p.get(i,M3WebPaint.F_OP)==M3WebPaint.TEXT)a.add(p.text(p.get(i,M3WebPaint.F_REF)));return a;}\n private static int[] geometry(M3WebModel m){return new int[]{m.itemRect(0,0),m.itemRect(0,1),m.itemRect(0,2),m.itemRect(0,3),m.count()>1?m.itemRect(1,1):-1,m.count()>1?m.itemRect(1,3):-1};}\n private static final class Hook extends M3CardModel {\n  boolean armed,reenter,inside;int layouts;RuntimeException failure;\n  @Override public void layout(int w,int h){\n   if(armed){layouts++;if(failure!=null)throw failure;if(reenter&&!inside){inside=true;try{setState(0,OPEN,false);}finally{inside=false;}}}\n   super.layout(w,h);\n  }\n }\n private static Hook hook(){Hook m=new Hook();m.layout(360,240);m.load(\"A~body;B~body\");m.layout(360,240);m.setState(0,OPEN,false);m.layout(360,240);m.takeDamage(new int[4]);m.layouts=0;return m;}\n @Test public void bodyGeometryIsPublishedBeforeCallback(){M3CardModel m=card();int before=m.generation();int[] calls={0};m.setDelta((i,mask)->{calls[0]++;if(mask==M3WebLanes.D_STATE)need(texts(m).contains(\"Up 12% on last quarter\"),\"OPEN_BODY_STALE_DURING_CALLBACK\");});m.load(\"Quarterly revenue~Up 12% on last quarter\");need(texts(m).contains(\"Quarterly revenue\")&&texts(m).contains(\"Up 12% on last quarter\"),\"OPEN_BODY_MISSING\");need(calls[0]==3&&m.generation()==before+3,\"LOAD_CALLBACK_GENERATION\");}\n @Test public void hiddenGeometryIsPublishedBeforeCallback(){M3CardModel m=card();m.load(\"A~body;B~body\");m.layout(360,240);need(m.itemRect(1,1)>0,\"TWO_ITEM_PRECONDITION\");int before=m.generation();int[] calls={0};m.setDelta((i,mask)->{calls[0]++;need(i==0&&mask==M3WebLanes.D_STATE&&m.itemRect(1,1)==0,\"HIDDEN_GEOMETRY_STALE_DURING_CALLBACK\");});m.setState(0,HIDDEN,true);need(calls[0]==1&&m.generation()==before+1&&m.itemRect(1,1)==0,\"HIDDEN_SINGLE_DELTA\");}\n @Test public void nonLayoutMasksAndNoopKeepOriginalPublication(){Hook m=hook();int[] before=geometry(m);int gen=m.generation();int[] calls={0};m.armed=true;m.setDelta((i,mask)->{calls[0]++;need(i==0&&mask==M3WebLanes.D_STATE,\"ORIGINAL_STATE_DELTA\");});m.setState(0,SELECTED,true);m.setState(0,SELECTED,true);m.setState(0,0,true);m.setState(0,0,false);need(calls[0]==1&&m.generation()==gen+1&&m.layouts==0,\"STYLE_NOOP_CALLBACKS\");need(Arrays.equals(before,geometry(m)),\"STYLE_GEOMETRY_CHANGED\");}\n @Test public void invalidIndexDoesNotMutateOrNotify(){Hook m=hook();int gen=m.generation(),n=m.count();int[] before=m.snapshot();m.armed=true;m.setDelta((i,mask)->{throw new AssertionError(\"INVALID_INDEX_CALLBACK\");});try{m.setState(n,OPEN,true);throw new AssertionError(\"EXPECTED_INDEX_FAILURE\");}catch(IndexOutOfBoundsException e){need(e.getClass()==IndexOutOfBoundsException.class&&e.getMessage().equals(\"item \"+n+\" of \"+n),\"EXACT_INDEX_FAILURE\");}need(m.generation()==gen&&m.layouts==0&&Arrays.equals(before,m.snapshot()),\"INVALID_INDEX_EFFECT\");int[] out={1,2,3,4};need(!m.takeDamage(out)&&Arrays.equals(out,new int[]{1,2,3,4}),\"INVALID_INDEX_DAMAGE\");}\n @Test public void mixedMasksUseChangedBits(){Hook m=hook();m.setState(0,OPEN,true);m.layout(360,240);m.takeDamage(new int[4]);m.armed=true;m.layouts=0;int gen=m.generation();int[] calls={0};m.setDelta((i,mask)->{calls[0]++;need(i==0&&mask==M3WebLanes.D_STATE,\"MIXED_MASK_DELTA\");});m.setState(0,OPEN|SELECTED,true);need(m.layouts==0,\"REQUESTED_UNCHANGED_OPEN_RELAID_OUT\");m.setState(0,HIDDEN|SELECTED,true);need(m.layouts==1&&m.itemRect(1,1)==0&&calls[0]==2&&m.generation()==gen+2,\"CHANGED_HIDDEN_NOT_RELAID_OUT\");}\n @Test public void negativeWidgetIndicesNeverInvokeItemLayout(){for(int index:new int[]{-1,-2,Integer.MIN_VALUE}){Hook m=hook();int[] before=geometry(m);int gen=m.generation();int[] calls={0};m.armed=true;m.setDelta((i,mask)->{calls[0]++;need(i==index&&mask==M3WebLanes.D_STATE,\"EXACT_WIDGET_INDEX\");});m.setState(index,OPEN|HIDDEN,true);need(calls[0]==1&&m.generation()==gen+1&&m.layouts==0&&Arrays.equals(before,geometry(m)),\"WIDGET_BRANCH_CHANGED\");}}\n @Test public void familySetOpenKeepsExistingDeltaTrace(){M3CardModel m=card();m.load(\"A~body;B~body\");m.layout(360,240);List<Integer> masks=new ArrayList<>(),gens=new ArrayList<>();int g=m.generation();m.setDelta((i,mask)->{need(i==0,\"SETOPEN_ITEM\");masks.add(mask);gens.add(m.generation());});m.setOpen(0,false);need(masks.equals(List.of(M3WebLanes.D_STATE,M3WebLanes.D_LAYOUT))&&gens.equals(List.of(g+1,g+2))&&!m.isOpen(0),\"SETOPEN_TRACE\");masks.clear();m.setOpen(0,false);need(masks.equals(List.of(M3WebLanes.D_LAYOUT))&&m.generation()==g+3,\"SETOPEN_NOOP_RELAYOUT\");}\n @Test public void familyDismissKeepsExistingDeltaTrace(){M3CardModel m=card();m.load(\"A~body;B~body\");m.layout(360,240);List<Integer> masks=new ArrayList<>(),gens=new ArrayList<>();int g=m.generation();m.setDelta((i,mask)->{need(i==0,\"DISMISS_ITEM\");masks.add(mask);gens.add(m.generation());});m.dismiss(0);need(masks.equals(List.of(M3WebLanes.D_STATE,M3WebLanes.D_ACTION))&&gens.equals(List.of(g+1,g+2))&&m.itemRect(1,1)==0,\"DISMISS_TRACE\");masks.clear();m.dismiss(0);need(masks.equals(List.of(M3WebLanes.D_ACTION))&&m.generation()==g+3,\"DISMISS_NOOP_RELAYOUT\");}\n @Test public void callbackReentryPublishesCurrentGeometry(){M3CardModel m=card();m.load(\"A~body;B~body\");m.layout(360,240);List<Integer> items=new ArrayList<>(),gens=new ArrayList<>(),heights=new ArrayList<>();int gen=m.generation();boolean[] entered={false};m.setDelta((i,mask)->{need(mask==M3WebLanes.D_STATE,\"REENTRY_MASK\");items.add(i);gens.add(m.generation());heights.add(m.itemRect(0,3));heights.add(m.itemRect(1,1));heights.add(m.itemRect(1,3));if(i==0&&!entered[0]){entered[0]=true;m.setState(1,HIDDEN,true);}});m.setState(0,HIDDEN,true);need(items.equals(List.of(0,1))&&gens.equals(List.of(gen+1,gen+2))&&m.generation()==gen+2,\"CALLBACK_REENTRY_ORDER\");need(heights.size()==6&&heights.get(0)==0&&heights.get(1)==0&&heights.get(2)>0&&heights.get(3)==0&&heights.get(4)==0&&heights.get(5)==0,\"CALLBACK_REENTRY_GEOMETRY\");}\n @Test public void guardedLayoutReentryDoesNotRestoreOuterValue(){Hook m=hook();int[] before=geometry(m);int gen=m.generation();List<Boolean> opens=new ArrayList<>();List<Integer> generations=new ArrayList<>();m.armed=true;m.reenter=true;m.setDelta((i,mask)->{need(i==0&&mask==M3WebLanes.D_STATE,\"LAYOUT_REENTRY_DELTA\");opens.add(m.isOpen(0));generations.add(m.generation());});m.setState(0,OPEN,true);need(m.layouts==2&&!m.isOpen(0)&&opens.equals(List.of(false,false))&&generations.equals(List.of(gen+1,gen+2))&&Arrays.equals(before,geometry(m)),\"EXPLICIT_VIRTUAL_LAYOUT_REENTRY\");}\n @Test public void layoutThrowPreservesIdentityAndRelayoutFailureOrdering(){Hook m=hook();int gen=m.generation();int[] before=geometry(m),calls={0};RuntimeException marker=new IllegalStateException(\"exact layout hook\");m.failure=marker;m.armed=true;m.setDelta((i,mask)->calls[0]++);try{m.setState(0,OPEN,true);throw new AssertionError(\"EXPECTED_LAYOUT_THROW\");}catch(RuntimeException caught){need(caught==marker,\"LAYOUT_THROW_IDENTITY\");}need(m.isOpen(0)&&m.layouts==1&&m.generation()==gen&&calls[0]==0&&Arrays.equals(before,geometry(m)),\"EXPLICIT_POST_MUTATION_PRE_PUBLICATION_FAILURE\");int[] out={1,2,3,4};need(!m.takeDamage(out)&&Arrays.equals(out,new int[]{1,2,3,4}),\"THROW_BEFORE_SUPER_ADDED_DAMAGE\");m.setState(0,OPEN,true);need(m.layouts==1&&m.generation()==gen,\"SAME_STATE_RETRY_NOT_NOOP\");m.failure=null;m.armed=false;m.layout(360,240);need(m.itemRect(0,3)>before[3]&&m.generation()==gen,\"EXPLICIT_LAYOUT_REPAIR_PUBLICATION\");}\n @Test public void callbackThrowKeepsIncrementedGeneration(){Hook m=hook();int gen=m.generation();int[] before=geometry(m),calls={0};RuntimeException marker=new IllegalStateException(\"exact delta\");m.armed=true;m.setDelta((i,mask)->{calls[0]++;need(i==0&&mask==M3WebLanes.D_STATE,\"CALLBACK_THROW_DELTA\");throw marker;});try{m.setState(0,SELECTED,true);throw new AssertionError(\"EXPECTED_CALLBACK_THROW\");}catch(RuntimeException caught){need(caught==marker,\"CALLBACK_THROW_IDENTITY\");}need(calls[0]==1&&m.generation()==gen+1&&m.is(0,SELECTED)&&m.layouts==0&&Arrays.equals(before,geometry(m)),\"CALLBACK_THROW_EFFECT_ORDER\");}\n}\n"
      overwriteExisting: false
