      relativeFileName: "m3/ports/swing-viewport/src/test/java/jdk/m3/swing/web/model/M3WebModelPaintAdmissionTest.java"
      fileContents: "/*******************************************************************************\n * Copyright (c) 2026 Synexia, Hitesh Soliwal (hsoliwal@gmail.com) and others.\n *\n * This program and the accompanying materials are made available under the\n * terms of the Apache License, Version 2.0, or (at your option) the Eclipse\n * Public License 2.0, which are available at\n * https://www.apache.org/licenses/LICENSE-2.0 and\n * https://www.eclipse.org/legal/epl-2.0/\n *\n * SPDX-License-Identifier: Apache-2.0 OR EPL-2.0\n *\n * Contributors:\n *     Hitesh Soliwal (Synexia) - initial API and implementation\n *******************************************************************************/\npackage jdk.m3.swing.web.model;\n\nimport static org.junit.jupiter.api.Assertions.*;\nimport static jdk.m3.swing.web.model.M3WebStates.*;\nimport java.util.Arrays;\nimport org.junit.jupiter.api.Test;\n\n/** Source-level paint admission contract; no native toolkit host is created. */\npublic final class M3WebModelPaintAdmissionTest {\n public static final class Probe extends M3WebModel {\n  int emissions; long visited; boolean failEmit, walkLogical; RuntimeException chosen;\n  Probe(){super(\"visibility-probe\",0,0,RECT,V_DEFAULT);}\n  @Override public int aspects(){return A_D;}\n  @Override public void load(String sample){clear();add(sample);}\n  void loadSample(String sample){load(sample);}\n  @Override protected void doLayout(){if(count>0)setRect(0,0,0,12,12);}\n  @Override protected void emit(M3WebPaint p){\n   emissions++; if(chosen!=null)throw chosen;\n   if(failEmit)throw new IllegalStateException(\"visible emit\");\n   if(walkLogical)for(int i=0;i<count;i++)visited+=flags[i]+1L;\n   p.rect(0,0,10,10,0x123456);\n  }\n  void negativeWidth(){width=-1;}\n  void staleFocus(int index){focus=index;}\n }\n static Probe sample(){Probe m=new Probe();m.loadSample(\"sample\");m.layout(64,32);return m;}\n static void empty(Probe m){M3WebPaint p=new M3WebPaint();m.paint(p);assertEquals(0,p.count());assertEquals(0,m.emissions);}\n @Test public void hiddenWidgetEmitsNoPaint(){Probe m=sample();m.setState(-1,HIDDEN,true);empty(m);}\n @Test public void hiddenClearsPreviousDisplayList(){Probe m=sample();M3WebPaint p=new M3WebPaint();m.paint(p);assertTrue(p.count()>0);m.setState(-1,HIDDEN,true);m.paint(p);assertEquals(0,p.count());assertEquals(1,m.emissions);}\n @Test public void hiddenFocusDoesNotPaint(){Probe m=sample();m.setFocus(0);m.setState(-1,FOCUS|HIDDEN,true);empty(m);}\n @Test public void emptyWidthEmitsNoPaint(){Probe m=sample();m.layout(0,32);empty(m);}\n @Test public void emptyHeightEmitsNoPaint(){Probe m=sample();m.layout(64,0);empty(m);}\n @Test public void emptyBothEmitsNoPaint(){Probe m=sample();m.layout(0,0);empty(m);}\n @Test public void negativeLayoutIsEmpty(){Probe m=sample();m.layout(-1,-17);empty(m);}\n @Test public void negativeProtectedExtentIsEmpty(){Probe m=sample();m.negativeWidth();empty(m);}\n @Test public void visibleKeepsEmissionAndState(){Probe m=sample();m.setFocus(0);m.setState(-1,FOCUS,true);int[] before=m.snapshot();M3WebPaint p=new M3WebPaint();m.paint(p);assertEquals(1,m.emissions);assertEquals(2,p.count());assertArrayEquals(before,m.snapshot());}\n @Test public void disabledVisibleStillPaints(){Probe m=sample();m.setState(-1,DISABLED,true);M3WebPaint p=new M3WebPaint();m.paint(p);assertEquals(1,m.emissions);assertTrue(p.count()>0);}\n @Test public void hiddenRoundTripRetainsModel(){Probe m=sample();m.setState(-1,HIDDEN,true);M3WebPaint p=new M3WebPaint();m.paint(p);assertEquals(0,p.count());m.setState(-1,HIDDEN,false);m.paint(p);assertEquals(1,m.emissions);assertEquals(\"sample\",m.text(0));assertTrue(p.count()>0);}\n @Test public void nullDestinationStillThrows(){Probe m=sample();m.setState(-1,HIDDEN,true);try{m.paint(null);fail(\"null paint\");}catch(NullPointerException expected){}m.layout(0,0);try{m.paint(null);fail(\"empty null paint\");}catch(NullPointerException expected){}}\n @Test public void visibleEmitterFailureStillPropagates(){Probe m=sample();m.failEmit=true;assertThrows(IllegalStateException.class,()->m.paint(new M3WebPaint()));}\n @Test public void hiddenEmitterNotCalledWhenItWouldThrow(){Probe m=sample();m.failEmit=true;m.setState(-1,HIDDEN,true);empty(m);}\n @Test public void millionItemHiddenPaintHasNoLogicalWalk(){Probe m=sample();m.setLogicalCount(1_000_000);m.walkLogical=true;m.setState(-1,HIDDEN,true);m.paint(new M3WebPaint());assertEquals(0,m.emissions);assertEquals(0,m.visited);assertEquals(1_000_000,m.count());}\n @Test public void zeroViewportWithFocusDoesNotPaint(){Probe m=sample();m.setFocus(0);m.setState(-1,FOCUS,true);m.layout(0,0);empty(m);}\n @Test public void otherStateBitsRemainVisible(){for(int bit:new int[]{HOVER,PRESSED,DISABLED,SELECTED,ERROR,FOCUS,CHECKED,OPEN}){Probe m=sample();m.setState(-1,bit,true);m.paint(new M3WebPaint());assertEquals(1,m.emissions,\"bit \"+bit);}}\n @Test public void hiddenLogicalWorkIsBoundedAcrossCounts(){for(int n:new int[]{0,1,1_000_000}){Probe m=sample();m.setLogicalCount(n);m.walkLogical=true;m.setState(-1,HIDDEN,true);m.paint(new M3WebPaint());assertEquals(0,m.emissions);assertEquals(0,m.visited);}}\n public static String visibleTranscript(){Probe m=sample();m.setFocus(0);m.setState(-1,FOCUS,true);M3WebPaint p=new M3WebPaint();m.paint(p);return p.count()+\":\"+p.hash()+\":\"+Arrays.hashCode(m.snapshot());}\n public static long[] hiddenBenchmark(){Probe m=sample();m.setLogicalCount(1_000_000);m.walkLogical=true;m.setState(-1,HIDDEN,true);M3WebPaint p=new M3WebPaint();for(int i=0;i<1000;i++)m.paint(p);long[] ns=new long[7];for(int j=0;j<ns.length;j++){long t=System.nanoTime();for(int i=0;i<10000;i++)m.paint(p);ns[j]=(System.nanoTime()-t)/10000;}if(m.emissions!=0||m.visited!=0)throw new AssertionError(\"hidden benchmark performed model work\");Arrays.sort(ns);return new long[]{ns[3],ns[6]};}\n\n @Test public void invalidFocusAtCountDoesNotEmitFocus(){Probe m=sample();m.staleFocus(m.count());m.setState(-1,FOCUS,true);M3WebPaint p=new M3WebPaint();m.paint(p);assertEquals(1,m.emissions);assertEquals(1,p.count());}\n @Test public void integerMaxFocusDoesNotIndexLanes(){Probe m=sample();m.staleFocus(Integer.MAX_VALUE);m.setState(-1,FOCUS,true);M3WebPaint p=new M3WebPaint();m.paint(p);assertEquals(1,m.emissions);assertEquals(1,p.count());}\n @Test public void hiddenInvalidFocusDoesNoModelWork(){Probe m=sample();m.staleFocus(Integer.MAX_VALUE);m.setLogicalCount(1_000_000);m.walkLogical=true;m.setState(-1,FOCUS|HIDDEN,true);M3WebPaint p=new M3WebPaint();m.paint(p);assertEquals(0,p.count());assertEquals(0,m.emissions);assertEquals(0,m.visited);}\n @Test public void nullResetPrecedesInvalidFocusAndEmission(){Probe m=sample();m.staleFocus(Integer.MAX_VALUE);m.chosen=new IllegalStateException(\"must not emit\");m.setState(-1,HIDDEN,true);m.layout(0,0);assertThrows(NullPointerException.class,()->m.paint(null));assertEquals(0,m.emissions);}\n @Test public void visibleEmitterFailureRetainsIdentity(){Probe m=sample();m.staleFocus(Integer.MAX_VALUE);RuntimeException marker=new IllegalStateException(\"exact visible emitter\");m.chosen=marker;assertSame(marker,assertThrows(RuntimeException.class,()->m.paint(new M3WebPaint())));assertEquals(1,m.emissions);}\n @Test public void layoutScrollClampStillUsesExistingCore(){Probe m=sample();m.setLogicalCount(1000);m.setItemExtent(32);m.layout(64,32);m.scrollTo(10000);assertEquals(10000,m.scrollOffset());assertEquals(32000,m.logicalExtent());m.layout(64,40000);assertEquals(0,m.scrollOffset());assertEquals(1000,m.count());}\n}\n"
      overwriteExisting: false
