  - org.openrewrite.text.FindAndReplace:
      find: "\\A\\Q/*******************************************************************************\n * Copyright (c) 2026 Synexia, Hitesh Soliwal (hsoliwal@gmail.com) and others.\n *\n * This program and the accompanying materials are made available under the\n * terms of the Apache License, Version 2.0, or (at your option) the Eclipse\n * Public License 2.0, which are available at\n * https://www.apache.org/licenses/LICENSE-2.0 and\n * https://www.eclipse.org/legal/epl-2.0/\n *\n * SPDX-License-Identifier: Apache-2.0 OR EPL-2.0\n *\n * Contributors:\n *     Hitesh Soliwal (Synexia) - initial API and implementation\n *******************************************************************************/\n\nimport java.io.IOException;\nimport java.nio.charset.StandardCharsets;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.security.MessageDigest;\nimport java.util.ArrayList;\nimport java.util.HexFormat;\nimport java.util.LinkedHashMap;\nimport java.util.List;\nimport java.util.Map;\nimport java.util.TreeMap;\n\n/**\n * Deterministic template generator of the M3 web widgets (TmOP, Template-First Generation).\n * <p>\n * usage: {@code java M3WebGen.java <gen-dir> <CONCEPTS.tsv> <nebula-m3web-dir|-> <swing-viewport-dir|-> [FAMILY,...]}\n * <br>\n * Reads {@code spec/MEMBERS.tsv} (concept, family, mode, role, shape, variant, sample, existing classes) and the\n * templates under {@code templates/}; writes core, family and member sources for the Nebula bundle and the\n * M3JDK Swing port. No body is written by hand or by a model: a correction is a template change plus a\n * regeneration, and a second run must change nothing (fixed point; {@code GENERATED.tsv} lists every file\n * with its template and SHA-256).\n * </p>\n */\npublic final class M3WebGen {\n\tstatic final String HEADER = \"\"\"\n\t\t\t/*******************************************************************************\n\t\t\t * Copyright (c) 2026 Synexia, Hitesh Soliwal (hsoliwal@gmail.com) and others.\n\t\t\t *\n\t\t\t * This program and the accompanying materials are made available under the\n\t\t\t * terms of the Apache License, Version 2.0, or (at your option) the Eclipse\n\t\t\t * Public License 2.0, which are available at\n\t\t\t * https://www.apache.org/licenses/LICENSE-2.0 and\n\t\t\t * https://www.eclipse.org/legal/epl-2.0/\n\t\t\t *\n\t\t\t * SPDX-License-Identifier: Apache-2.0 OR EPL-2.0\n\t\t\t *\n\t\t\t * Contributors:\n\t\t\t *     Hitesh Soliwal (Synexia) - initial API and implementation\n\t\t\t *******************************************************************************/\n\t\t\t// Generated by M3WebGen from %s; edit the template and regenerate.\n\t\t\t\"\"\";\n\tstatic final String[] CORE = { \"M3WebStates\", \"M3WebTheme\", \"M3WebPaint\", \"M3WebDelta\", \"M3WebApi\", \"M3WebLanes\", \"M3WebView\", \"M3WebModel\", \"M3WebGlyphs\", \"M3WebPixelProbe\" };\n\tfinal Path gen;\n\tfinal Map<String, String> generated = new TreeMap<>();\n\tfinal Map<String, Map<String, String>> concepts = new LinkedHashMap<>();\n\tfinal List<Map<String, String>> members = new ArrayList<>();\n\tint written;\n\n\tM3WebGen(Path gen) {\n\t\tthis.gen = gen;\n\t}\n\n\tpublic static void main(String[] args) throws IOException {\n\t\tM3WebGen g = new M3WebGen(Path.of(args[0]));\n\t\tg.members.addAll(tsv(g.gen.resolve(\"spec/MEMBERS.tsv\")));\n\t\ttsv(Path.of(args[1])).forEach(r -> g.concepts.put(r.get(\"concept\"), r));\n\t\tList<String> only = args.length > 4 ? List.of(args[4].split(\",\")) : List.of();\n\t\tif (!args[2].equals(\"-\")) {\n\t\t\tg.side(new Side(Path.of(args[2]), true), only);\n\t\t}\n\t\tif (!args[3].equals(\"-\")) {\n\t\t\tg.side(new Side(Path.of(args[3]), false), only);\n\t\t}\n\t\tSystem.out.println(\"M3WebGen files=\" + g.generated.size() + \" written=\" + g.written);\n\t}\n\n\t/** Output layout of one toolkit side. */\n\trecord Side(Path root, boolean nebula) {\n\t\tString pkg() { return nebula ? \"org.eclipse.nebula.widgets.m3web.model\" : \"jdk.m3.swing.web.model\"; }\n\t\tString wpkg() { return nebula ? \"org.eclipse.nebula.widgets.m3web\" : \"jdk.m3.swing.web\"; }\n\t\tPath main(String p) { return root.resolve(nebula ? \"org.eclipse.nebula.widgets.m3web/src\" : \"src/main/java\").resolve(p.replace('.', '/')); }\n\t\tPath test(String p) { return root.resolve(nebula ? \"org.eclipse.nebula.widgets.m3web.test/src\" : \"src/test/java\").resolve(p.replace('.', '/')); }\n\t\tPath example(String p) { return root.resolve(nebula ? \"org.eclipse.nebula.widgets.m3web.snippets/src\" : \"examples/web\").resolve(p.replace('.', '/')); }\n\t\tString exists(Map<String, String> m) { return m.get(nebula ? \"nebula_existing\" : \"swing_existing\"); }\n\t}\n\n\tvoid side(Side s, List<String> only) throws IOException {\n\t\tMap<String, String> base = Map.of(\"@PKG@\", s.pkg(), \"@WPKG@\", s.wpkg());\n\t\tfor (String c : CORE) {\n\t\t\temit(\"core/\" + c + \".java.tmpl\", s.main(s.pkg()).resolve(c + \".java\"), base);\n\t\t}\n\t\temit(\"core/M3WebChecks.java.tmpl\", s.test(s.pkg()).resolve(\"M3WebChecks.java\"), base);\n\t\temit((s.nebula() ? \"nebula/\" : \"swing/\") + \"M3WebViewportCore.java.tmpl\", s.main(s.pkg()).resolve(\"M3WebViewportCore.java\"), base);\n\t\tString tk = s.nebula() ? \"nebula/\" : \"swing/\";\n\t\tfor (String c : s.nebula() ? new String[] { \"M3WebCanvas\", \"M3WebCanvasCache\" } : new String[] { \"M3WebComponent\" }) {\n\t\t\temit(tk + c + \".java.tmpl\", s.main(s.wpkg()).resolve(c + \".java\"), base);\n\t\t}\n\t\tif (s.nebula()) {\n\t\t\temit(\"nebula/M3WebCanvasChecks.java.tmpl\", s.test(s.wpkg()).resolve(\"M3WebCanvasChecks.java\"), base);\n\t\t\temit(\"nebula/M3WebTestMain.java.tmpl\", s.test(s.wpkg()).resolve(\"M3WebTestMain.java\"), base);\n\t\t} else {\n\t\t\temit(\"swing/M3WebComponentChecks.java.tmpl\", s.test(s.wpkg()).resolve(\"M3WebComponentChecks.java\"), base);\n\t\t}\n\t\tfor (String fam : families()) {\n\t\t\tif (only.isEmpty() || only.contains(fam)) {\n\t\t\t\tfamily(s, fam, base);\n\t\t\t}\n\t\t}\n\t\tif (only.isEmpty()) {\n\t\t\tprobes(s, base);\n\t\t\tadapters(s, base);\n\t\t}\n\t\tmanifest(s);\n\t}\n\n\t/** Viewport adapters of the widgets each toolkit already ships (spec/ADAPTERS.tsv rows of this side), pattern M3P-ADAPTER-1. */\n\tvoid adapters(Side s, Map<String, String> base) throws IOException {\n\t\tString tk = \"adapter/\" + (s.nebula() ? \"nebula/\" : \"swing/\"), pkg = s.wpkg() + \".adapter\";\n\t\tadapterCore(s, tk, pkg, base);\n\t\tMap<String, StringBuilder> factories = new TreeMap<>();\n\t\tStringBuilder standIns = new StringBuilder();\n\t\tfor (Map<String, String> row : tsv(gen.resolve(\"spec/ADAPTERS.tsv\"))) {\n\t\t\tif (row.get(\"toolkit\").equals(s.nebula() ? \"nebula\" : \"swing\")) {\n\t\t\t\tadapter(s, tk, pkg, row, factories, standIns);\n\t\t\t}\n\t\t}\n\t\tfor (Map.Entry<String, StringBuilder> e : factories.entrySet()) {\n\t\t\tMap<String, String> v = new LinkedHashMap<>(base);\n\t\t\tv.put(\"@FACTORIES@\", e.getValue().toString()); v.put(\"@FAMILY@\", e.getKey()); v.put(\"@FAM@\", e.getKey().toUpperCase());\n\t\t\temit(tk + \"Viewports.java.tmpl\", s.main(pkg).resolve(\"M3\" + e.getKey() + \"Viewports.java\"), v);\n\t\t}\n\t\tstandIns(s, tk, pkg, base, standIns);\n\t}\n\n\t/** The adapter pattern itself: measure, kinds, adapter; the shared contract, fills and kind edges tests. */\n\tvoid adapterCore(Side s, String tk, String pkg, Map<String, String> base) throws IOException {\n\t\tfor (String c : new String[] { \"M3ViewportMeasure\", \"M3ViewportKind\", \"M3ViewportAdapter\" }) {\n\t\t\temit(tk + c + \".java.tmpl\", s.main(pkg).resolve(c + \".java\"), base);\n\t\t}\n\t\tfor (String c : new String[] { \"M3ViewportAdapterChecks\", \"M3ViewportFills\" }) {\n\t\t\temit(tk + c + \".java.tmpl\", s.test(pkg).resolve(c + \".java\"), base);\n\t\t}\n\t\temit(tk + \"KindsTest.tmpl\", s.test(pkg).resolve(s.nebula() ? \"M3ViewportKinds_Test.java\" : \"M3ViewportKindsTest.java\"), base);\n\t}\n\n\t/** Nebula: the factories of widgets in other bundles, bound on stand-in hosts (their own tests are NOT_RUN without the bundle). */\n\tvoid standIns(Side s, String tk, String pkg, Map<String, String> base, StringBuilder calls) throws IOException {\n\t\tif (s.nebula()) {\n\t\t\tMap<String, String> v = new LinkedHashMap<>(base);\n\t\t\tv.put(\"@CALLS@\", calls.toString());\n\t\t\temit(tk + \"FactoriesTest.tmpl\", s.test(pkg).resolve(\"M3ViewportFactories_Test.java\"), v);\n\t\t}\n\t}\n\n\t/** One adapter row: its typed factory (collected per family) and its contract test. */\n\tvoid adapter(Side s, String tk, String pkg, Map<String, String> row, Map<String, StringBuilder> factories, StringBuilder standIns)\n\t\t\tthrows IOException {\n\t\tMap<String, String> m = members.stream().filter(r -> r.get(\"concept\").equals(row.get(\"concept\"))).findFirst().orElseThrow();\n\t\tString fam = pascal(m.get(\"family\").toLowerCase());\n\t\tMap<String, String> v = vars(s, m, fam);\n\t\tv.put(\"@CLASS@\", row.get(\"class\")); v.put(\"@KIND@\", row.get(\"measure\")); v.put(\"@STYLE@\", row.get(\"style\"));\n\t\tv.put(\"@FILL@\", row.get(\"fill\")); v.put(\"@TARGS@\", row.get(\"args\"));\n\t\taspects(v, m.get(\"family\"), row.get(\"measure\"));\n\t\tString[] b = binding(s.nebula(), row.get(\"create\"), row.get(\"class\") + (row.get(\"args\").isEmpty() ? \"\" : \"<?>\"));\n\t\tv.put(\"@PARAM@\", b[0]); v.put(\"@HOSTPARAM@\", b[1]); v.put(\"@HOST@\", b[2]);\n\t\tfactories.computeIfAbsent(fam, k -> new StringBuilder()).append(bind(template(tk + \"Factory.tmpl\"), v));\n\t\tv.put(\"@CREATE@\", bind(template(tk + \"create/\" + row.get(\"create\") + \".tmpl\"), v));\n\t\temit(tk + \"AdapterTest.tmpl\", s.test(pkg).resolve(\"M3\" + v.get(\"@C@\") + (s.nebula() ? \"Viewport_Test.java\" : \"ViewportTest.java\")), v);\n\t\tstandIn(tk, row.get(\"create\"), v, standIns);\n\t}\n\n\t/** Reflect and class rows (Nebula widgets in other bundles) add a stand-in call: K cycles the three AUTO resolutions. */\n\tvoid standIn(String tk, String create, Map<String, String> v, StringBuilder calls) throws IOException {\n\t\tif (create.equals(\"reflect\") || create.equals(\"class\")) {\n\t\t\tv.put(\"@K@\", Long.toString(calls.chars().filter(ch -> ch == 10).count() % 3));\n\t\t\tcalls.append(bind(template(tk + \"standin/\" + create + \".tmpl\"), v));\n\t\t}\n\t}\n\n\t/** Provided aspects = the family's declared aspects that the measure kind can provide. */\n\tvoid aspects(Map<String, String> v, String family, String kind) throws IOException {\n\t\tList<String> planned = List.of(column(\"spec/FAMILIES.tsv\", \"family\", family, \"aspects\").split(\";\"));\n\t\tList<String> kindAspects = List.of(column(\"spec/ADAPTER_KINDS.tsv\", \"kind\", kind, \"aspects\").split(\";\"));\n\t\tList<String> provided = planned.stream().filter(kindAspects::contains).toList();\n\t\tv.put(\"@ASPECTS@\", String.join(\" | \", provided.stream().map(a -> \"M3ViewportAdapter.\" + a).toList()));\n\t\tv.put(\"@ASPECTLIST@\", String.join(\" \", provided)); v.put(\"@PLANNED@\", String.join(\" \", planned));\n\t}\n\n\tString column(String file, String key, String value, String col) throws IOException {\n\t\treturn tsv(gen.resolve(file)).stream().filter(r -> r.get(key).equals(value)).findFirst().orElseThrow().get(col);\n\t}\n\n\t/** {factory parameter type, host parameter, host expression} per create kind of spec/ADAPTERS.tsv. */\n\tstatic String[] binding(boolean nebula, String create, String cls) {\n\t\tString control = nebula ? \"org.eclipse.swt.widgets.Control\" : \"javax.swing.JComponent\";\n\t\tswitch (create) {\n\t\tcase \"control\": case \"shell\": case \"component\": return new String[] { cls, \"\", \"w\" };\n\t\tcase \"reflect\": return new String[] { control, \"\", \"w\" };\n\t\tcase \"root-pane\": return new String[] { \"javax.swing.JRootPane\", \"\", \"w\" };\n\t\tcase \"class\": case \"host\": return new String[] { \"Object\", \", \" + control + \" host\", \"host\" };\n\t\tcase \"layout\": return new String[] { cls, \", \" + (nebula ? \"org.eclipse.swt.widgets.Composite\" : control) + \" host\", \"host\" };\n\t\tdefault: return new String[] { cls, \", \" + control + \" host\", \"host\" };\n\t\t}\n\t}\n\n\t/** Desktop pixel probe over the first Nebula-generated member of every family. */\n\tvoid probes(Side s, Map<String, String> base) throws IOException {\n\t\tStringBuilder b = new StringBuilder();\n\t\tList<String> seen = new ArrayList<>();\n\t\tfor (Map<String, String> m : members) {\n\t\t\tif (s.exists(m).isEmpty() && families().contains(m.get(\"family\"))) {\n\t\t\t\tseen.add(m.get(\"concept\"));\n\t\t\t\tb.append(b.length() == 0 ? \"\" : \",\\n\").append(\"\\t\\t\\tprobe(new M3\").append(pascal(m.get(\"concept\"))).append(s.nebula() ? \"(shell, SWT.NONE), \\\"\" : \"(), \\\"\")\n\t\t\t\t\t\t.append(probeSample(m).replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\", \"\\\\\\\"\")).append(\"\\\", \\\"\").append(m.get(\"family\")).append(\"\\\")\");\n\t\t\t}\n\t\t}\n\t\tMap<String, String> v = new LinkedHashMap<>(base);\n\t\tv.put(\"@PROBES@\", b.toString());\n\t\tif (s.nebula()) {\n\t\t\temit(\"nebula/PixelProbe.tmpl\", s.example(s.wpkg() + \".snippets\").resolve(\"M3WebPixelProbeSnippet.java\"), v);\n\t\t} else {\n\t\t\temit(\"swing/SwingProbe.tmpl\", s.example(s.wpkg() + \".examples\").resolve(\"M3WebSwingProbeExample.java\"), v);\n\t\t}\n\t}\n\n\t/** Probe sample: token renderers are probed text-free (their glyph run would cover the whole token). */\n\tstatic String probeSample(Map<String, String> m) {\n\t\treturn m.get(\"family\").equals(\"TOKEN\") ? \"\" : m.get(\"sample\");\n\t}\n\n\tList<String> families() {\n\t\tList<String> out = new ArrayList<>();\n\t\tfor (Map<String, String> m : members) {\n\t\t\tif (!out.contains(m.get(\"family\")) && Files.exists(gen.resolve(\"templates/family/\" + m.get(\"family\") + \".java.tmpl\"))) {\n\t\t\t\tout.add(m.get(\"family\"));\n\t\t\t}\n\t\t}\n\t\treturn out;\n\t}\n\n\tvoid family(Side s, String fam, Map<String, String> base) throws IOException {\n\t\tString cls = pascal(fam.toLowerCase());\n\t\temit(\"family/\" + fam + \".java.tmpl\", s.main(s.pkg()).resolve(\"M3\" + cls + \"Model.java\"), base);\n\t\temit(\"family/\" + fam + \".api.tmpl\", s.main(s.pkg()).resolve(\"M3\" + cls + \"Api.java\"), base);\n\t\temit(\"checks/\" + fam + \".checks.tmpl\", s.test(s.pkg()).resolve(\"M3\" + cls + \"Checks.java\"), base);\n\t\tmodes(s, fam, cls, base);\n\t\tcanvasModes(s, fam, cls, base);\n\t\tfor (Map<String, String> m : members) {\n\t\t\tif (m.get(\"family\").equals(fam) && s.exists(m).isEmpty()) {\n\t\t\t\tmember(s, m, cls);\n\t\t\t}\n\t\t}\n\t}\n\n\t/** Desktop canvas contract of every family mode (Nebula only: the Swing component contract runs headless per member). */\n\tvoid canvasModes(Side s, String fam, String famClass, Map<String, String> base) throws IOException {\n\t\tif (s.nebula()) {\n\t\t\tMap<String, String> v = new LinkedHashMap<>(base);\n\t\t\tv.put(\"@FAMILY@\", famClass);\n\t\t\tv.put(\"@FAM@\", fam);\n\t\t\temit(\"nebula/CanvasModesTest.tmpl\", s.test(s.wpkg()).resolve(\"M3\" + famClass + \"CanvasModes_Test.java\"), v);\n\t\t}\n\t}\n\n\t/** Placeholders of one member row on one side. */\n\tMap<String, String> vars(Side s, Map<String, String> m, String famClass) {\n\t\tString c = pascal(m.get(\"concept\"));\n\t\tMap<String, String> v = new LinkedHashMap<>();\n\t\tv.put(\"@PKG@\", s.pkg()); v.put(\"@WPKG@\", s.wpkg()); v.put(\"@C@\", c); v.put(\"@CONCEPT@\", m.get(\"concept\"));\n\t\tv.put(\"@METHOD@\", \"member\" + c);\n\t\tv.put(\"@FAMILY@\", famClass); v.put(\"@FAM@\", m.get(\"family\")); v.put(\"@PATTERN@\", \"M3P-\" + m.get(\"family\") + \"-1\");\n\t\tv.put(\"@MODE@\", m.get(\"mode\")); v.put(\"@ROLE@\", m.get(\"role\")); v.put(\"@SHAPE@\", m.get(\"shape\"));\n\t\tv.put(\"@VARIANT@\", m.get(\"variant\")); v.put(\"@SAMPLE@\", m.get(\"sample\").replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\", \"\\\\\\\"\"));\n\t\tMap<String, String> row = concepts.getOrDefault(m.get(\"concept\"), Map.of());\n\t\tString form = html(row.getOrDefault(\"viewport_form\", \"\"));\n\t\tv.put(\"@FORM@\", form.isEmpty() ? \"the family pattern (see CONCEPTS.tsv)\" : form);\n\t\tv.put(\"@SWINGX@\", row.getOrDefault(\"swingx_pattern\", \"\").isEmpty() ? \"none\" : row.get(\"swingx_pattern\").replace(\";\", \", \"));\n\t\treturn v;\n\t}\n\n\t/** Family-model contract of the members this toolkit already ships: their family model still serves the concept. */\n\tvoid modes(Side s, String fam, String famClass, Map<String, String> base) throws IOException {\n\t\tString tk = s.nebula() ? \"nebula/\" : \"swing/\";\n\t\tString tmpl = template(tk + \"ModesCase.tmpl\");\n\t\tStringBuilder b = new StringBuilder();\n\t\tfor (Map<String, String> m : members) {\n\t\t\tif (m.get(\"family\").equals(fam) && !s.exists(m).isEmpty()) {\n\t\t\t\tb.append(bind(tmpl, vars(s, m, famClass)));\n\t\t\t}\n\t\t}\n\t\tMap<String, String> v = new LinkedHashMap<>(base);\n\t\tv.put(\"@CASES@\", b.toString()); v.put(\"@FAMILY@\", famClass); v.put(\"@FAM@\", fam);\n\t\temit(tk + \"ModesTest.tmpl\", s.test(s.pkg()).resolve(\"M3\" + famClass + (s.nebula() ? \"Modes_Test.java\" : \"ModesTest.java\")), v);\n\t}\n\n\tvoid member(Side s, Map<String, String> m, String famClass) throws IOException {\n\t\tString c = pascal(m.get(\"concept\"));\n\t\tMap<String, String> v = vars(s, m, famClass);\n\t\temit(\"member/Api.tmpl\", s.main(s.pkg()).resolve(\"M3\" + c + \"Api.java\"), v);\n\t\temit(\"member/Model.tmpl\", s.main(s.pkg()).resolve(\"M3\" + c + \"Model.java\"), v);\n\t\tString tk = s.nebula() ? \"nebula/\" : \"swing/\";\n\t\temit(tk + \"Widget.tmpl\", s.main(s.wpkg()).resolve(\"M3\" + c + \".java\"), v);\n\t\temit(tk + \"Test.tmpl\", s.nebula() ? s.test(s.pkg()).resolve(\"M3\" + c + \"Model_Test.java\") : s.test(s.wpkg()).resolve(\"M3\" + c + \"Test.java\"), v);\n\t\tif (s.nebula()) {\n\t\t\temit(\"nebula/CanvasTest.tmpl\", s.test(s.wpkg()).resolve(\"M3\" + c + \"_Test.java\"), v);\n\t\t}\n\t\temit(tk + (s.nebula() ? \"Snippet.tmpl\" : \"Example.tmpl\"), s.example(s.wpkg() + (s.nebula() ? \".snippets\" : \".examples\"))\n\t\t\t\t.resolve(\"M3\" + c + (s.nebula() ? \"Snippet.java\" : \"Example.java\")), v);\n\t}\n\n\tString template(String template) throws IOException {\n\t\treturn Files.readString(gen.resolve(\"templates/\" + template), StandardCharsets.UTF_8).replace(\"\\r\\n\", \"\\n\");\n\t}\n\n\tstatic String bind(String body, Map<String, String> vars) {\n\t\tString out = body;\n\t\tfor (Map.Entry<String, String> e : vars.entrySet()) {\n\t\t\tout = out.replace(e.getKey(), e.getValue());\n\t\t}\n\t\treturn out;\n\t}\n\n\tvoid emit(String template, Path out, Map<String, String> vars) throws IOException {\n\t\tString body = bind(template(template), vars);\n\t\tif (body.contains(\"@\") && body.matches(\"(?s).*@[A-Z]+@.*\")) {\n\t\t\tthrow new IllegalStateException(\"unbound placeholder in \" + template + \" -> \" + out);\n\t\t}\n\t\tString text = HEADER.formatted(\"templates/\" + template) + body;\n\t\tFiles.createDirectories(out.getParent());\n\t\tif (!Files.exists(out) || !Files.readString(out, StandardCharsets.UTF_8).equals(text)) {\n\t\t\tFiles.writeString(out, text, StandardCharsets.UTF_8);\n\t\t\twritten++;\n\t\t}\n\t\tgenerated.put(out.toString().replace('\\\\', '/'), template + \"\\t\" + sha256(text));\n\t}\n\n\tvoid manifest(Side s) throws IOException {\n\t\tStringBuilder b = new StringBuilder(\"path\\ttemplate\\tsha256\\n\");\n\t\tString root = s.root().toString().replace('\\\\', '/') + \"/\";\n\t\tgenerated.forEach((p, t) -> {\n\t\t\tif (p.startsWith(root)) {\n\t\t\t\tb.append(p.substring(root.length())).append('\\t').append(t).append('\\n');\n\t\t\t}\n\t\t});\n\t\tPath m = s.root().resolve(s.nebula() ? \"GENERATED.tsv\" : \"webwidgets/GENERATED.tsv\");\n\t\tFiles.createDirectories(m.getParent());\n\t\tFiles.writeString(m, b.toString(), StandardCharsets.UTF_8);\n\t}\n\n\tstatic String pascal(String concept) {\n\t\tStringBuilder b = new StringBuilder();\n\t\tfor (String p