      fileContents: "package @PKG@;\n\nimport static @PKG@.M3WebStates.*;\n\nimport java.util.Arrays;\n\n/**\n * JUnit-agnostic core contract of every M3 web widget model (pattern M3P-CORE-1), shared by the\n * Nebula (JUnit 4) and Swing (JUnit 5) tests: lanes, deltas, damage, keyboard, pointer, RTL, theme,\n * variants and sizes, localisation, removal. Failures throw {@link AssertionError}.\n */\npublic final class M3WebChecks {\n\tprivate M3WebChecks() {\n\t}\n\n\tpublic static void check(boolean ok, String what) {\n\t\tif (!ok) {\n\t\t\tthrow new AssertionError(what);\n\t\t}\n\t}\n\n\t/** Runs the whole core contract on a sample-filled model. */\n\tpublic static void core(M3WebModel m, String sample, String role) {\n\t\tcheck(roleName(m.role()).equals(role), \"role \" + roleName(m.role()) + \" != \" + role);\n\t\tcheck(m.concept() != null && m.accessibleName(-1) != null, \"concept and name\");\n\t\tm.layout(360, 260);\n\t\tpaints(m);\n\t\tdeltas(m);\n\t\tthemes(m);\n\t\tmirror(m);\n\t\tkeys(m);\n\t\tpointer(m);\n\t\tdamage(m);\n\t\tlocalize(m);\n\t\tnullTexts(m);\n\t\tviewport(m);\n\t\tremoval(m);\n\t\tsweep(m, sample);\n\t}\n\n\tprivate static final int[] MODS = { 0, MOD_SHIFT, MOD_CTRL, MOD_ALT, MOD_CTRL | MOD_SHIFT };\n\tprivate static final int[] KEYS = { KEY_HOME, KEY_END, KEY_LEFT, KEY_RIGHT, KEY_UP, KEY_DOWN, KEY_PAGE_UP, KEY_PAGE_DOWN, KEY_TAB,\n\t\t\tKEY_ENTER, KEY_SPACE, KEY_DELETE, KEY_BACKSPACE, KEY_ESCAPE };\n\tprivate static final char[] CHARS = { 'a', 'Z', '7', '0', ' ', '#', '-' };\n\n\t/**\n\t * TOP sweep (pattern M3P-CORE-1): every key and character under every modifier set from both ends of the\n\t * item range, LTR and RTL, open and closed, then a pointer grid with every pointer kind, and the same on an\n\t * empty model. Invariants only: no exception, focus inside the lanes, deterministic paint.\n\t */\n\tstatic void sweep(M3WebModel m, String sample) {\n\t\tcheck(role(\"no-such-role\") == 0 && roleName(-1).equals(roleName(0)) && roleName(1 << 20).equals(roleName(0)), \"role table bounds\");\n\t\tfor (int pass = 0; pass < 8; pass++) {\n\t\t\tm.load(sample);\n\t\t\tm.layout(360, 260);\n\t\t\tm.setRtl((pass & 1) != 0);\n\t\t\tm.setState(-1, OPEN, (pass & 2) != 0);\n\t\t\tm.setState(-1, FOCUS, true);\n\t\t\tsweepKeys(m, (pass & 4) != 0 ? m.count() - 1 : 0);\n\t\t\tsweepPointer(m, MODS[pass % MODS.length]);\n\t\t}\n\t\tm.setRtl(false);\n\t\tedges(m, sample);\n\t\tstale(m, sample);\n\t\tids(m);\n\t\tsweepKeys(m, -1);\n\t\tsweepPointer(m, 0);\n\t\tm.load(sample);\n\t\tprobeEdges();\n\t}\n\n\t/** Lane and view edges: text writes, keyless localisation, lower index bound, filters, extents, theme slots, helpers. */\n\tstatic void edges(M3WebModel m, String sample) {\n\t\tm.load(sample);\n\t\tm.add(null);\n\t\tm.localize(s -> \"x\" + s);\n\t\tcheck(m.text(m.count() - 1) == null, \"a text-less item stays text-less when localised\");\n\t\tm.setText(0, \"edge\");\n\t\tcheck(\"edge\".equals(m.text(0)) && m.itemExtent() > 0, \"text lane write\");\n\t\tm.setFilter(null);\n\t\tm.setFilter(\"e\");\n\t\tcheck(\"e\".equals(m.filter()) && m.logicalCount() <= m.count(), \"filter over text-less items\");\n\t\tm.setFilter(\"\");\n\t\tindexBounds(m);\n\t\tint accent = m.theme().slot(M3WebTheme.ACCENT);\n\t\tm.theme().setSlot(M3WebTheme.ACCENT, 0x1234567);\n\t\tcheck(m.theme().slot(M3WebTheme.ACCENT) == 0x234567, \"slot write masks to RGB\");\n\t\tm.theme().setSlot(M3WebTheme.ACCENT, accent);\n\t\thelpers(m);\n\t}\n\n\tprivate static void indexBounds(M3WebModel m) {\n\t\ttry {\n\t\t\tm.text(-1);\n\t\t\tcheck(false, \"negative index check\");\n\t\t} catch (IndexOutOfBoundsException expected) {\n\t\t\t// ids below 0 are rejected like ids at or beyond the count\n\t\t}\n\t}\n\n\t/** Protected paint helpers: widget-level labels (no item) and sized muted text; snapshot of dark RTL state. */\n\tprivate static void helpers(M3WebModel m) {\n\t\tM3WebPaint p = new M3WebPaint();\n\t\tm.label(p, -1, \"widget\", 0, 0, 40, 20, 0);\n\t\tm.muted(p, \"sized\", 0, 0, 40, 20, 14);\n\t\tcheck(p.count() == 2, \"helper records\");\n\t\tm.setDark(true);\n\t\tm.setRtl(true);\n\t\tcheck(m.snapshot().length > 0, \"dark RTL snapshot\");\n\t\tm.setRtl(false);\n\t\tm.setDark(false);\n\t}\n\n\t/**\n\t * Stale indices after {@link M3WebModel#clear()}: focus, hover and press keep their ids until the next\n\t * interaction; paint, keys and pointer must treat them as absent. Also Enter on a disabled focused item and a\n\t * release on an item disabled while pressed.\n\t */\n\tstatic void stale(M3WebModel m, String sample) {\n\t\tm.load(sample);\n\t\tm.layout(360, 260);\n\t\tif (m.count() > 0) {\n\t\t\tint x = m.itemRect(0, 0) + Math.max(1, m.itemRect(0, 2) / 2), y = m.itemRect(0, 1) + Math.max(1, m.itemRect(0, 3) / 2);\n\t\t\tm.setFocus(0);\n\t\t\tm.setState(0, DISABLED, true);\n\t\t\tcheck(!m.key(KEY_ENTER, 0, 0) || m.focus() >= 0, \"enter on a disabled item activates nothing\");\n\t\t\tm.setState(0, DISABLED, false);\n\t\t\tm.pointer(P_DOWN, x, y, 0);\n\t\t\tm.setState(0, DISABLED, true);\n\t\t\tm.pointer(P_UP, x, y, 0);\n\t\t\tm.pointer(P_MOVE, x, y, 0);\n\t\t\tm.setFocus(0);\n\t\t\tm.setState(-1, FOCUS, true);\n\t\t}\n\t\tm.clear();\n\t\tm.paint(new M3WebPaint());\n\t\tm.pointer(P_MOVE, 1, 1, 0);\n\t\tm.setFocus(-1);\n\t\tm.setState(-1, FOCUS, false);\n\t}\n\n\t/**\n\t * Lane ids stay on their items: removal shifts focus, hover and press ids above the removed item down, drops\n\t * hover and press of the removed item and keeps focus at its position; shrinking the logical count clamps them;\n\t * a text write while localised replaces the key.\n\t */\n\tstatic void ids(M3WebModel m) {\n\t\tm.clear();\n\t\tfor (int i = 0; i < 6; i++) {\n\t\t\tm.add(\"i\" + i);\n\t\t}\n\t\tm.localize(s -> s + \"!\");\n\t\tm.setText(5, \"k5\");\n\t\tm.localize(s -> s + \"?\");\n\t\tcheck(\"k5?\".equals(m.text(5)), \"a localised text write replaces the key\");\n\t\tm.focus = 4;\n\t\tm.hover = 3;\n\t\tm.pressed = 2;\n\t\tm.remove(1);\n\t\tcheck(m.focus == 3 && m.hover == 2 && m.pressed == 1, \"ids above the removed item shift down\");\n\t\tm.remove(2);\n\t\tcheck(m.focus == 2 && m.hover == -1 && m.pressed == 1, \"hover of the removed item goes\");\n\t\tm.remove(1);\n\t\tcheck(m.focus == 1 && m.pressed == -1, \"press of the removed item goes\");\n\t\tm.hover = 2;\n\t\tm.remove(1);\n\t\tcheck(m.focus == 1 && m.hover == 1, \"focus stays at the removed position\");\n\t\tids2(m);\n\t}\n\n\tprivate static void ids2(M3WebModel m) {\n\t\tm.hover = 1;\n\t\tm.pressed = 1;\n\t\tm.setLogicalCount(1);\n\t\tcheck(m.hover == -1 && m.pressed == -1 && m.focus == 0, \"shrinking clamps the ids\");\n\t\tm.hover = 0;\n\t\tm.pressed = 0;\n\t\tm.setLogicalCount(3);\n\t\tcheck(m.hover == 0 && m.pressed == 0 && m.text(2) == null, \"growing keeps the ids and blanks new items\");\n\t\tm.clear();\n\t}\n\n\t/** A press and release at a point. */\n\tpublic static void click(M3WebModel m, int x, int y) {\n\t\tm.pointer(P_DOWN, x, y, 0);\n\t\tm.pointer(P_UP, x, y, 0);\n\t}\n\n\t/** A press and release at the centre of an item. */\n\tpublic static void clickItem(M3WebModel m, int item) {\n\t\tclick(m, m.itemRect(item, 0) + m.itemRect(item, 2) / 2, m.itemRect(item, 1) + m.itemRect(item, 3) / 2);\n\t}\n\n\t/** The pixel probe on crafted display lists: fills crossing every edge, later outlines, text boxes by alignment. */\n\tstatic void probeEdges() {\n\t\tint[][] boxes = { { -20, 100, 30, 30 }, { 100, -20, 30, 30 }, { 340, 100, 40, 30 }, { 100, 240, 30, 40 }, { 0, 0, 360, 260 } };\n\t\tfor (int[] b : boxes) {\n\t\t\tint[] probe = M3WebPixelProbe.probe(crafted(p -> {\n\t\t\t\tp.rect(b[0], b[1], b[2], b[3], 0x336699);\n\t\t\t\tp.roundLine(b[0] + 4, b[1] + 4, b[2] - 8, b[3] - 8, 40, 0x111111);\n\t\t\t\tp.ovalLine(b[0] - 6, b[1] - 6, b[2] + 12, b[3] + 12, 0x222222);\n\t\t\t\tp.text(b[0], b[1], b[2], b[3], 0x333333, 12 | M3WebPaint.CENTER, \"probe\");\n\t\t\t\tp.text(b[0], b[1], b[2], b[3], 0x333333, M3WebPaint.RIGHT, \"r\");\n\t\t\t\tp.text(-300, -300, 10, 10, 0x333333, 0, \"far\");\n\t\t\t}), 360, 260);\n\t\t\tcheck(probe.length == 0 || probe.length == 4, \"probe result shape\");\n\t\t}\n\t\tfor (int[] d : new int[][] { { 150, 0 }, { 0, 120 }, { -150, 0 }, { 0, -120 } }) {\n\t\t\tint[] probe = M3WebPixelProbe.probe(crafted(p -> {\n\t\t\t\tp.rect(150, 120, 60, 60, 0x336699);\n\t\t\t\tp.roundLine(150 + d[0], 120 + d[1], 60, 60, 8, 0x111111);\n\t\t\t\tp.text(150 + d[0], 120 + d[1], 60, 60, 0x333333, 12, \"side\");\n\t\t\t}), 360, 260);\n\t\t\tcheck(probe.length == 4, \"a fill beside later records keeps its probe\");\n\t\t}\n\t}\n\n\t/** A model whose display list is the given records (test-only, for the probe). */\n\tstatic M3WebModel crafted(java.util.function.Consumer<M3WebPaint> records) {\n\t\tM3WebModel m = new M3WebModel(\"crafted\", 0, 0, RECT, 0) {\n\t\t\t@Override\n\t\t\tpublic int aspects() {\n\t\t\t\treturn M3WebView.A_D;\n\t\t\t}\n\n\t\t\t@Override\n\t\t\tpublic void load(String sample) {\n\t\t\t\tadd(sample);\n\t\t\t}\n\n\t\t\t@Override\n\t\t\tprotected void doLayout() {\n\t\t\t\t// the records carry their own geometry\n\t\t\t}\n\n\t\t\t@Override\n\t\t\tprotected void emit(M3WebPaint p) {\n\t\t\t\trecords.accept(p);\n\t\t\t}\n\t\t};\n\t\tm.layout(360, 260);\n\t\treturn m;\n\t}\n\n\tprivate static void sweepKeys(M3WebModel m, int item) {\n\t\tfor (int mod : MODS) {\n\t\t\tm.setFocus(Math.min(item, m.count() - 1));\n\t\t\tfor (int k : KEYS) {\n\t\t\t\tm.key(k, 0, mod);\n\t\t\t\tinvariant(m);\n\t\t\t}\n\t\t\tfor (char c : CHARS) {\n\t\t\t\tm.key(KEY_CHAR, c, mod);\n\t\t\t\tinvariant(m);\n\t\t\t}\n\t\t\tm.tick(16);\n\t\t\tm.tick(2000);\n\t\t}\n\t}\n\n\tprivate static void sweepPointer(M3WebModel m, int mod) {\n\t\tfor (int y = 1; y < 260; y += 23) {\n\t\t\tfor (int x = 1; x < 360; x += 29) {\n\t\t\t\tm.pointer(P_MOVE, x, y, mod);\n\t\t\t\tm.pointer(P_DOWN, x, y, mod);\n\t\t\t\tm.pointer(P_DRAG, x + 9, y + 17, mod);\n\t\t\t\tm.pointer(P_UP, x + 9, y + 17, mod);\n\t\t\t\tinvariant(m);\n\t\t\t}\n\t\t\tm.pointer(P_WHEEL, 5, y % 2 == 0 ? 1 : -1, mod);\n\t\t}\n\t\tm.pointer(P_EXIT, -1, -1, mod);\n\t\tm.tick(2000);\n\t\tinvariant(m);\n\t}\n\n\tprivate static void invariant(M3WebModel m) {\n\t\tcheck(m.focus() >= -1 && m.focus() < Math.max(1, m.count()), \"focus inside the lanes: \" + m.focus() + \" of \" + m.count());\n\t\tM3WebPaint p = new M3WebPaint();\n\t\tm.paint(p);\n\t\tcheck(p.count() >= 0 && m.prefWidth() > 0, \"paints\");\n\t}\n\n\t/** Text-less items (lanes without objects) must paint in every family. */\n\tstatic void nullTexts(M3WebModel m) {\n\t\tint n = m.count();\n\t\tm.add(null);\n\t\tm.add(null, null);\n\t\tpaints(m);\n\t\tm.remove(m.count() - 1);\n\t\tm.remove(m.count() - 1);\n\t\tcheck(m.count() == n, \"null-text items removed\");\n\t}\n\n\t/** Proves the declared viewport aspects (R resident, G logical geometry, D damage, P planes). */\n\tstatic void viewport(M3WebModel m) {\n\t\tint a = m.aspects();\n\t\tcheck((a & M3WebView.A_D) != 0, \"every family declares D\");\n\t\titemDamage(m);\n\t\tif ((a & M3WebView.A_P) != 0) {\n\t\t\tplanes(m);\n\t\t}\n\t\tif ((a & M3WebView.A_R) != 0) {\n\t\t\tresident(m);\n\t\t}\n\t}\n\n\t/** D: an item change damages exactly its rect (plus the 3 px focus ring margin), clipped to the widget. */\n\tstatic void itemDamage(M3WebModel m) {\n\t\tif (m.count() == 0 || m.itemRect(0, 2) == 0) {\n\t\t\treturn;\n\t\t}\n\t\tint[] d = new int[4];\n\t\tm.takeDamage(d);\n\t\tboolean on = !m.is(0, SELECTED);\n\t\tm.setState(0, SELECTED, on);\n\t\tcheck(m.takeDamage(d), \"item change damages\");\n\t\tint x = Math.max(0, m.itemRect(0, 0) - 3), y = Math.max(0, m.itemRect(0, 1) - 3);\n\t\tcheck(d[0] == x && d[1] == y && d[2] <= m.itemRect(0, 2) + 6 && d[3] <= m.itemRect(0, 3) + 6, \"damage equals the item rect\");\n\t\tm.setState(0, SELECTED, !on);\n\t\tm.takeDamage(d);\n\t}\n\n\t/** P: moving a plane damages its old and new bounds only. */\n\tstatic void planes(M3WebModel m) {\n\t\tint[] d = new int[4];\n\t\tm.layout(360, 260);\n\t\tm.takeDamage(d);\n\t\tint w = m.plane(M3WebView.OVERLAY, 2), h = m.plane(M3WebView.OVERLAY, 3);\n\t\tint ox = m.plane(M3WebView.OVERLAY, 4), oy = m.plane(M3WebView.OVERLAY, 5);\n\t\tm.movePlane(M3WebView.OVERLAY, ox + 7, oy + 5);\n\t\tboolean dirty = m.takeDamage(d);\n\t\tcheck(!dirty || (d[2] <= w + 7 && d[3] <= h + 5), \"plane move damages only the plane\");\n\t\tcheck(m.plane(M3WebView.OVERLAY, 4) == ox + 7 && m.plane(M3WebView.OVERLAY, 5) == oy + 5, \"plane offset\");\n\t\tm.movePlane(M3WebView.OVERLAY, ox, oy);\n\t\tm.takeDamage(d);\n\t}\n\n\t/** R + G: 10^6 items, logical extent beyond int, resident window bounded by the viewport, blit on short scroll. */\n\tstatic void resident(M3WebModel m) {\n\t\tm.setLogicalCount(1_000_000);\n\t\tm.setItemExtent(4096);\n\t\tm.layout(360, 260);\n\t\tcheck(m.logicalExtent() > Integer.MAX_VALUE, \"logical extent beyond int\");\n\t\tcheck(m.residentCount() <= 2 + 2 * 2, \"resident window bounded: \" + m.residentCount());\n\t\tm.scrollTo(m.logicalExtent() / 2);\n\t\tcheck(m.window(0) == (int) (m.scrollOffset() / 4096) && m.residentCount() <= 6, \"window follows scroll\");\n\t\tint[] t = new int[2];\n\t\tm.thumb(200, t);\n\t\tcheck(t[0] >= 0 && t[1] >= 8 && t[0] + t[1] <= 200, \"scroll bar projection\");\n\t\tblit(m);\n\t\tm.scrollTo(0);\n\t\tm.setItemExtent(32);\n\t\tm.clear();\n\t}\n\n\tprivate static void blit(M3WebModel m) {\n\t\tint[] d = new int[4];\n\t\tm.setItemExtent(20);\n\t\tm.scrollTo(1000);\n\t\tm.takeBlit();\n\t\tm.takeDamage(d);\n\t\tm.scrollTo(1005);\n\t\tcheck(m.takeBlit() == -5, \"short scroll is a blit\");\n\t\tboolean h = m.scrollsHorizontally();\n\t\tcheck(m.takeDamage(d) && (h ? d[0] == m.width - 5 && d[2] == 5 : d[1] == m.height - 5 && d[3] == 5), \"exposed strip only\");\n\t\tm.scrollTo(1000);\n\t\tcheck(m.takeBlit() == 5, \"blit back\");\n\t\tm.scrollTo(900_000);\n\t\tcheck(m.takeBlit() == 0, \"a long jump repaints instead of blitting\");\n\t}\n\n\tstatic int[] paints(M3WebModel m) {\n\t\tM3WebPaint p = new M3WebPaint();\n\t\tm.paint(p);\n\t\tint h = p.hash();\n\t\tm.paint(p);\n\t\tcheck(h == p.hash(), \"paint is deterministic\");\n\t\tcheck(Arrays.equals(m.snapshot(), m.snapshot()), \"snapshot is deterministic\");\n\t\tcheck(m.prefWidth() > 0 && m.prefHeight() > 0, \"preferred size\");\n\t\treturn new int[] { h, p.count() };\n\t}\n\n\tstatic void deltas(M3WebModel m) {\n\t\tint[] seen = new int[1];\n\t\tm.setDelta((item, mask) -> seen[0]++);\n\t\tint g = m.generation();\n\t\tm.setState(-1, ERROR, true);\n\t\tm.setState(-1, ERROR, true);\n\t\tm.setState(-1, ERROR, false);\n\t\tcheck(seen[0] == 2 && m.generation() == g + 2, \"one delta per real state change\");\n\t\tif (m.count() > 0) {\n\t\t\tm.setState(0, SELECTED | LOADING, true);\n\t\t\tcheck(m.is(0, SELECTED) && m.is(0, LOADING), \"item state bits\");\n\t\t\tm.setState(0, SELECTED | LOADING, false);\n\t\t}\n\t\tm.setDelta(null);\n\t}\n\n\tstatic void themes(M3WebModel m) {\n\t\tM3WebPaint p = new M3WebPaint();\n\t\tint light = paints(m)[0], variant = m.variant(), size = m.size();\n\t\tm.setDark(true);\n\t\tcheck(m.isDark() && m.theme().slot(M3WebTheme.BG) != 0xf7f8fb, \"dark palette\");\n\t\tm.paint(p);\n\t\tm.setDark(false);\n\t\tfor (int v = -1; v <= VARIANTS; v++) {\n\t\t\tfor (int s = SIZE_XS - 1; s <= SIZE_XL + 1; s++) {\n\t\t\t\tm.setVariant(v);\n\t\t\t\tm.setSize(s);\n\t\t\t\tstates(m, p);\n\t\t\t}\n\t\t}\n\t\tm.setVariant(variant);\n\t\tm.setSize(size);\n\t\tcheck(light == paints(m)[0] || m.count() == 0 || m.isAnimating(), \"theme round trip\");\n\t}\n\n\tprivate static void states(M3WebModel m, M3WebPaint p) {\n\t\tint[] bits = { HOVER, PRESSED, DISABLED, SELECTED, ERROR, FOCUS, CHECKED, OPEN };\n\t\tint n = Math.min(2, m.count());\n\t\tboolean[] was = new boolean[n + 1];\n\t\tfor (int bit : bits) {\n\t\t\tfor (int i = -1; i < n; i++) {\n\t\t\t\twas[i + 1] = m.is(i, bit);\n\t\t\t\tm.setState(i, bit, !was[i + 1]);\n\t\t\t}\n\t\t\tm.paint(p);\n\t\t\tfor (int i = -1; i < n; i++) {\n\t\t\t\tm.setState(i, bit, was[i + 1]);\n\t\t\t}\n\t\t}\n\t}\n\n\tstatic void mirror(M3WebModel m) {\n\t\tif (m.count() == 0) {\n\t\t\treturn;\n\t\t}\n\t\tm.scrollTo(0);\n\t\tint x = m.itemRect(0, 0), w = m.itemRect(0, 2);\n\t\tm.setRtl(true);\n\t\tcheck(m.isRtl() && m.itemRect(0, 0) == m.prefWidth() * 0 + rtlX(m, x, w), \"RTL mirrors item 0\");\n\t\tpaints(m);\n\t\tkeys(m);\n\t\tm.setRtl(false);\n\t\tm.scrollTo(0);\n\t\tcheck(m.itemRect(0, 0) == x, \"LTR restored\");\n\t}\n\n\tprivate static int rtlX(M3WebModel m, int x, int w) {\n\t\treturn m.width - x - w;\n\t}\n\n\tstatic void keys(M3WebModel m) {\n\t\tint[] all = { KEY_HOME, KEY_END, KEY_LEFT, KEY_RIGHT, KEY_UP, KEY_DOWN, KEY_PAGE_UP, KEY_PAGE_DOWN, KEY_TAB, KEY_ENTER, KEY_SPACE,\n\t\t\t\tKEY_CHAR, KEY_DELETE, KEY_ESCAPE };\n\t\tm.setState(-1, FOCUS, true);\n\t\tfor (int k : all) {\n\t\t\tm.key(k, k == KEY_CHAR ? '7' : 0, 0);\n\t\t}\n\t\tm.setState(-1, DISABLED, true);\n\t\tcheck(!m.key(KEY_HOME, 0, 0), \"disabled widget ignores keys\");\n\t\tm.pointer(P_DOWN, 1, 1, 0);\n\t\tm.setState(-1, DISABLED, false);\n\t\tm.setState(-1, FOCUS, false);\n\t\tm.setFocus(-1);\n\t}\n\n\tstatic void pointer(M3WebModel m) {\n\t\tm.layout(360, 260);\n\t\tif (m.count() > 0) {\n\t\t\tint x = m.itemRect(0, 0) + m.itemRect(0, 2) / 2, y = m.itemRect(0, 1) + m.itemRect(0, 3) / 2;\n\t\t\tm.pointer(P_MOVE, x, y, 0);\n\t\t\tm.pointer(P_MOVE, x, y, 0);\n\t\t\tm.pointer(P_DOWN, x, y, 0);\n\t\t\tm.pointer(P_DRAG, x + 1, y, 0);\n\t\t\tm.pointer(P_UP, x, y, 0);\n\t\t\tm.pointer(P_DOWN, x, y, 0);\n\t\t\tm.pointer(P_UP, -50, -50, 0);\n\t\t}\n\t\tm.pointer(P_WHEEL, 5, 1, 0);\n\t\tm.pointer(P_EXIT, -1, -1, 0);\n\t\tcheck(m.hitTest(-100, -100) == -1, \"outside hit\");\n\t\tfor (int i = 0; i < 80 && m.tick(16); i++) {\n\t\t\tm.pointer(P_MOVE, 0, 0, 0);\n\t\t}\n\t}\n\n\tstatic void damage(M3WebModel m) {\n\t\tint[] d = new int[4];\n\t\tm.takeDamage(d);\n\t\tcheck(!m.takeDamage(d), \"damage drained\");\n\t\tm.setDark(false);\n\t\tcheck(m.takeDamage(d) && d[2] >= 0 && d[3] >= 0, \"theme change damages\");\n\t}\n\n\tstatic void localize(M3WebModel m) {\n\t\tif (m.count() == 0 || m.text(0) == null) {\n\t\t\treturn;\n\t\t}\n\t\tString t = m.text(0);\n\t\tm.localize(s -> \"x\" + s);\n\t\tcheck((\"x\" + t).equals(m.text(0)), \"localized text\");\n\t\tm.localize(s -> s);\n\t\tcheck(t.equals(m.text(0)), \"keys kept\");\n\t}\n\n\tstatic void removal(M3WebModel m) {\n\t\ttry {\n\t\t\tm.text(m.count());\n\t\t\tcheck(false, \"index check\");\n\t\t} catch (IndexOutOfBoundsException expected) {\n\t\t\t// the lanes reject ids outside [0, count)\n\t\t}\n\t\tif (m.count() > 0) {\n\t\t\tm.setDetail(0, \"detail\");\n\t\t\tcheck(\"detail\".equals(m.detail(0)), \"detail lane\");\n\t\t\tm.remove(m.count() - 1);\n\t\t}\n\t\tm.clear();\n\t\tpaints(m);\n\t\tcheck(m.count() == 0, \"cleared\");\n\t}\n}\n"
