      fileContents: "package @PKG@;\n\nimport java.util.Arrays;\nimport java.util.function.UnaryOperator;\n\n/**\n * Item lanes of an M3 web widget model (pattern M3P-CORE-1, DOOP): flags, value, aux, group and\n * rect lanes are parallel int arrays indexed by item id; texts are the only objects. Every mutation\n * marks the item's rect as damage and fires one delta; nothing is repainted here.\n */\n//FLLDCIM: DOOP — structure of arrays; objects only for text\npublic abstract class M3WebLanes implements M3WebApi {\n\tpublic static final int D_STATE = 1, D_VALUE = 2, D_TEXT = 4, D_LAYOUT = 8, D_THEME = 16, D_ANIM = 32, D_ITEMS = 64, D_ACTION = 128,\n\t\t\tD_LOAD = 256;\n\tprotected final M3WebTheme theme = new M3WebTheme();\n\tprotected int count, widgetFlags, width, height, variant, size = M3WebStates.SIZE_M, focus = -1, hover = -1, pressed = -1;\n\tprotected int[] flags = new int[8], value = new int[8], aux = new int[8], group = new int[8], rects = new int[32];\n\tprotected String[] text = new String[8], detail = new String[8];\n\tprotected boolean rtl;\n\tprivate String[] keys;\n\t/** The toolkit's viewport core (SWT public M3 facades or the M3JDK Swing port), generated per side. */\n\tfinal M3WebViewportCore core = new M3WebViewportCore();\n\tprivate int generation;\n\tprivate M3WebDelta delta;\n\n\t@Override\n\tpublic int add(String label) {\n\t\treturn add(label, null);\n\t}\n\n\t@Override\n\tpublic int add(String label, String det) {\n\t\tif (count == flags.length) {\n\t\t\tgrow(count * 2);\n\t\t}\n\t\ttext[count] = label;\n\t\tif (keys != null) {\n\t\t\tkeys[count] = label;\n\t\t}\n\t\tdetail[count] = det;\n\t\tflags[count] = value[count] = aux[count] = group[count] = 0;\n\t\tcount++;\n\t\trelayout(count - 1, D_ITEMS);\n\t\treturn count - 1;\n\t}\n\n\tprotected void grow(int cap) {\n\t\tflags = Arrays.copyOf(flags, cap); value = Arrays.copyOf(value, cap); aux = Arrays.copyOf(aux, cap);\n\t\tgroup = Arrays.copyOf(group, cap); rects = Arrays.copyOf(rects, cap * 4);\n\t\ttext = Arrays.copyOf(text, cap); detail = Arrays.copyOf(detail, cap);\n\t\tkeys = keys == null ? null : Arrays.copyOf(keys, cap);\n\t}\n\n\t@Override\n\tpublic void remove(int item) {\n\t\tcheck(item);\n\t\tint tail = count - item - 1;\n\t\tfor (int[] lane : new int[][] { flags, value, aux, group }) {\n\t\t\tSystem.arraycopy(lane, item + 1, lane, item, tail);\n\t\t}\n\t\tSystem.arraycopy(text, item + 1, text, item, tail);\n\t\tSystem.arraycopy(detail, item + 1, detail, item, tail);\n\t\tif (keys != null) {\n\t\t\tSystem.arraycopy(keys, item + 1, keys, item, tail);\n\t\t}\n\t\tcount--;\n\t\tfocus = focus > item ? focus - 1 : Math.min(focus, count - 1);\n\t\thover = hover == item ? -1 : hover > item ? hover - 1 : hover;\n\t\tpressed = pressed == item ? -1 : pressed > item ? pressed - 1 : pressed;\n\t\trelayout(item, D_ITEMS);\n\t}\n\n\t/** Empties the lanes of ids {@code [from, to)}: new logical items carry no state, value, text or key. */\n\tprotected void blank(int from, int to) {\n\t\tfor (int[] lane : new int[][] { flags, value, aux, group }) {\n\t\t\tArrays.fill(lane, from, to, 0);\n\t\t}\n\t\tArrays.fill(text, from, to, null);\n\t\tArrays.fill(detail, from, to, null);\n\t\tif (keys != null) {\n\t\t\tArrays.fill(keys, from, to, null);\n\t\t}\n\t}\n\n\t@Override\n\tpublic void clear() {\n\t\tcount = 0;\n\t\tfocus = hover = pressed = -1;\n\t\tkeys = null;\n\t\trelayout(-1, D_ITEMS);\n\t}\n\n\t@Override\n\tpublic int count() {\n\t\treturn count;\n\t}\n\n\t@Override\n\tpublic String text(int item) {\n\t\tcheck(item);\n\t\treturn text[item];\n\t}\n\n\t@Override\n\tpublic void setText(int item, String s) {\n\t\tcheck(item);\n\t\ttext[item] = s;\n\t\tif (keys != null) {\n\t\t\tkeys[item] = s;\n\t\t}\n\t\trelayout(item, D_TEXT);\n\t}\n\n\t@Override\n\tpublic String detail(int item) {\n\t\tcheck(item);\n\t\treturn detail[item];\n\t}\n\n\t@Override\n\tpublic void setDetail(int item, String s) {\n\t\tcheck(item);\n\t\tdetail[item] = s;\n\t\trelayout(item, D_TEXT);\n\t}\n\n\t@Override\n\tpublic int value(int item) {\n\t\tcheck(item);\n\t\treturn value[item];\n\t}\n\n\t@Override\n\tpublic void setValue(int item, int v) {\n\t\tcheck(item);\n\t\tvalue[item] = clampValue(item, v);\n\t\trelayout(item, D_VALUE);\n\t}\n\n\t/** Family hook: bounds a value before it is stored. */\n\tprotected int clampValue(int item, int v) {\n\t\treturn v;\n\t}\n\n\t@Override\n\tpublic int aux(int item) {\n\t\tcheck(item);\n\t\treturn aux[item];\n\t}\n\n\t@Override\n\tpublic void setAux(int item, int v) {\n\t\tcheck(item);\n\t\taux[item] = v;\n\t\trelayout(item, D_VALUE);\n\t}\n\n\t@Override\n\tpublic int group(int item) {\n\t\tcheck(item);\n\t\treturn group[item];\n\t}\n\n\t@Override\n\tpublic void setGroup(int item, int g) {\n\t\tcheck(item);\n\t\tgroup[item] = g;\n\t\trelayout(item, D_LAYOUT);\n\t}\n\n\t@Override\n\tpublic boolean is(int item, int state) {\n\t\treturn ((item < 0 ? widgetFlags : flags[checked(item)]) & state) != 0;\n\t}\n\n\t@Override\n\tpublic void setState(int item, int state, boolean on) {\n\t\tint old = item < 0 ? widgetFlags : flags[checked(item)];\n\t\tint now = on ? old | state : old & ~state;\n\t\tif (now == old) {\n\t\t\treturn;\n\t\t}\n\t\tif (item < 0) {\n\t\t\twidgetFlags = now;\n\t\t\tdamageAll();\n\t\t} else {\n\t\t\tflags[item] = now;\n\t\t\tif (((old ^ now) & (M3WebStates.OPEN | M3WebStates.HIDDEN)) != 0) {\n\t\t\t\tlayout(width, height);\n\t\t\t} else {\n\t\t\t\tdamageItem(item);\n\t\t\t}\n\t\t}\n\t\tfire(item, D_STATE);\n\t}\n\n\t@Override\n\tpublic void localize(UnaryOperator<String> translator) {\n\t\tif (keys == null) {\n\t\t\tkeys = Arrays.copyOf(text, flags.length);\n\t\t}\n\t\tfor (int i = 0; i < count; i++) {\n\t\t\ttext[i] = keys[i] == null ? null : translator.apply(keys[i]);\n\t\t}\n\t\trelayout(-1, D_TEXT);\n\t}\n\n\t@Override\n\tpublic void setDelta(M3WebDelta d) {\n\t\tdelta = d;\n\t}\n\n\t@Override\n\tpublic int generation() {\n\t\treturn generation;\n\t}\n\n\t/** Fires one delta; the generation count