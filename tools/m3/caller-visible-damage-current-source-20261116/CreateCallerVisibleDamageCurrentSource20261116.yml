>\n            <requireProperty><property>m3.caller.mode</property><regex>qualify|apply</regex></requireProperty>\n            <requireFilesDontExist><files><file>${m3.caller.outputRoot}</file></files><message>Use a fresh outputRoot; retained results are never reused.</message></requireFilesDontExist>\n          </rules></configuration>\n        </execution></executions>\n      </plugin>\n      <plugin>\n        <groupId>org.apache.maven.plugins</groupId>\n        <artifactId>maven-antrun-plugin</artifactId>\n        <version>3.2.0</version>\n        <executions><execution>\n          <id>selected-producer-and-result-check</id><phase>test</phase>\n          <goals><goal>run</goal></goals>\n          <configuration><target>\n            <checksum file=\"${m3.caller.receiverRoot}/m3/ports/swing-viewport/webwidgets/GENERATED.tsv\" algorithm=\"SHA-256\" property=\"caller.ledger.before\"/>\n            <condition property=\"caller.ledger.admitted\"><or>\n              <equals arg1=\"${caller.ledger.before}\" arg2=\"1085e4679fb7624127d08d27bf62a07c5daeff7c0482e47c9b1cbd4072406a8e\"/>\n              <equals arg1=\"${caller.ledger.before}\" arg2=\"1fa127392157c86da45ef5cfd44333995c9164f7d2c70e03ad5bd8bacadc385f\"/>\n            </or></condition>\n            <fail unless=\"caller.ledger.admitted\">Unadmitted GENERATED.tsv preimage.</fail>\n            <checksum file=\"${m3.caller.recipeRoot}/resources/manifest-pins.tsv\" algorithm=\"SHA-256\" property=\"caller.manifest.pins.before\"/>\n            <available file=\"${m3.caller.recipeRoot}/validation/selected-producer.jsh\" type=\"file\" property=\"caller.driver.present\"/>\n            <fail unless=\"caller.driver.present\">Missing selected producer driver.</fail>\n            <checksum file=\"${m3.caller.recipeRoot}/bindings.tsv\" algorithm=\"SHA-256\" property=\"caller.bindings.before\"/>\n            <mkdir dir=\"${m3.caller.outputRoot}/maven-controller/tmp\"/>\n            <mkdir dir=\"${m3.caller.outputRoot}/maven-cont