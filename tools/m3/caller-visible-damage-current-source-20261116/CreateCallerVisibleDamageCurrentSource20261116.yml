t <= Integer.MAX_VALUE) {\n\t\t\t// Preserve the existing virtual hook's arguments when padding fits its int contract.\n\t\t\tdamage((int) x, (int) y, (int) paddedWidth, (int) paddedHeight);\n\t\t\treturn;\n\t\t}\n\t\tlong left = Math.max(0L, x), top = Math.max(0L, y);\n\t\tlong right = Math.min((long) width, x + paddedWidth);\n\t\tlong bottom = Math.min((long) height, y + paddedHeight);\n\t\tif (right > left && bottom > top) {\n\t\t\tdamage((int) left, (int) top, (int) (right - left), (int) (bottom - top));\n\t\t}\n\t}\n\n\tprotected void damageAll() {\n\t\tdamage(0, 0, width, height);\n\t}\n\n\t@Override\n\tpublic boolean takeDamage(int[] out) {\n\t\tint savedX = out != null && out.length > 0 ? out[0] : 0;\n\t\tint savedY = out != null && out.length > 1 ? out[1] : 0;\n\t\tint savedWidth = out != null && out.length > 2 ? out[2] : 0;\n\t\tint savedHeight = out != null && out.length > 3 ? out[3] : 0;\n\t\tif (!core.take(out)) {\n\t\t\treturn false;\n\t\t}\n\t\tint left = Math.max(0, out[0]), top = Math.max(0, out[1]);\n\t\tlong right = Math.min((long) width, (long) out[0] + out[2]);\n\t\tlong bottom = Math.min((long) height, (long) out[1] + out[3]);\n\t\tif (right <= left || bottom <= top) {\n\t\t\tout[0] = savedX; out[1] = savedY; out[2] = savedWidth; out[3] = savedHeight;\n\t\t\treturn false;\n\t\t}\n\t\tout[0] = left; out[1] = top;\n\t\tout[2] = (int) (right - left); out[3] = (int) (bottom - top);\n\t\treturn true;\n\t}\n\n\t@Override\n\tpublic int itemRect(int item, int k) {\n\t\treturn rects[checked(item) * 4 + k];\n\t}\n\n\tprotected void setRect(int item, int x, int y, int w, int h) {\n\t\tint b = item * 4;\n\t\trects[b] = x; rects[b + 1] = y; rects[b + 2] = w; rects[b + 3] = h;\n\t}\n\n\tprotected final int checked(int item) {\n\t\tcheck(item);\n\t\treturn item;\n\t}\n\n\tprotected final void check(int item) {\n\t\tif (item < 0 || item >= count) {\n\t\t\tthrow new IndexOutOfBoundsException(\"item \" + item + \" of \" + count);\n\t\t}\n\t}\n\n\t/** Lanes as on