      fileContents: "/*******************************************************************************\n * Copyright (c) 2026 Synexia, Hitesh Soliwal (hsoliwal@gmail.com) and others.\n *\n * This program and the accompanying materials are made available under the\n * terms of the Apache License, Version 2.0, or (at your option) the Eclipse\n * Public License 2.0, which are available at\n * https://www.apache.org/licenses/LICENSE-2.0 and\n * https://www.eclipse.org/legal/epl-2.0/\n *\n * SPDX-License-Identifier: Apache-2.0 OR EPL-2.0\n *\n * Contributors:\n *     Hitesh Soliwal (Synexia) - initial API and implementation\n *******************************************************************************/\npackage jdk.m3.swing.viewport;\n\nimport static org.junit.jupiter.api.Assertions.assertArrayEquals;\nimport static org.junit.jupiter.api.Assertions.assertEquals;\nimport static org.junit.jupiter.api.Assertions.assertFalse;\nimport static org.junit.jupiter.api.Assertions.assertThrows;\nimport static org.junit.jupiter.api.Assertions.assertTrue;\n\nimport org.junit.jupiter.api.Test;\n\n/**\n * Contract of the port's extent, plane and damage core (same answers as the SWT fork's public M3 viewport\n * facades; the Nebula/Swing model differential compares both on every web widget).\n */\nclass M3ViewportCoreApiTest {\n    @Test\n    void extentBeyondIntAndThumb() {\n        assertEquals(4_096_000_000L, M3ViewportExtent.contentExtent(1_000_000, 4096));\n        assertEquals(1, M3ViewportExtent.visibleRows(1_000_000, 4096, 260));\n        assertEquals(0, M3ViewportExtent.visibleRows(0, 20, 260));\n        assertEquals(999_999, M3ViewportExtent.maxTopRow(1_000_000, 4096, 260));\n        int[] t = new int[2];\n        M3ViewportExtent.projectThumb(1_000_000, 4096, 260, 500_000, 200, t, 0);\n        assertTrue(t[0] > 0 && t[1] == 8 && t[0] + t[1] <= 200);\n        M3ViewportExtent.projectThumb(3, 20, 260, 0, 200, t, 0);\n        assertArrayEquals(new int[] { 0, 200 }, t);\n        assertEquals(0, M3ViewportExtent.thumb(0, 20, 100));\n        assertThrows(IllegalArgumentException.class, () -> M3ViewportExtent.contentExtent(-1, 1));\n        assertThrows(IllegalArgumentException.class, () -> M3ViewportExtent.visibleRows(1, 0, 1));\n        assertThrows(IllegalArgumentException.class, () -> M3ViewportExtent.visibleRows(1, 1, -1));\n    }\n\n    @Test\n    void giantRowCountsScaleTheThumb() {\n        long rows = 5_000_000_000L;\n        assertEquals(Integer.MAX_VALUE, M3ViewportExtent.maximum(rows));\n        assertEquals(5, M3ViewportExtent.thumb(rows, 1, 10));\n        int max = Integer.MAX_VALUE - 5;\n        assertEquals(max, M3ViewportExtent.selectionForTopRow(rows, 1, 10, Long.MAX_VALUE));\n        int s = M3ViewportExtent.selectionForTopRow(rows, 1, 10, rows / 2);\n        assertTrue(s > max / 2 - 8 && s < max / 2 + 8, \"scaled selection \" + s);\n        assertEquals(0, M3ViewportExtent.selectionForTopRow(rows, 1, 10, 0));\n    }\n\n    @Test\n    void planeMasks() {\n        M3ViewportPlanes p = new M3ViewportPlanes();\n        assertEquals(0, p.scrollTo(0, 0));\n        int v = p.scrollTo(0, 40);\n        assertTrue((v & M3ViewportPlanes.BODY) != 0 && (v & M3ViewportPlanes.HEADER) == 0);\n        int h = p.scrollTo(30, 40);\n        assertTrue((h & M3ViewportPlanes.HEADER) != 0 && (h & M3ViewportPlanes.FROZEN) == 0);\n        assertEquals(0, p.scrollTo(30, 40));\n        p.initialize(1, 2);\n        assertEquals(1.0, p.originX());\n        assertEquals(2.0, p.originY());\n        assertEquals(63, M3ViewportPlanes.ALL);\n        assertThrows(IllegalArgumentException.class, () -> p.scrollTo(Double.NaN, 0));\n    }\n\n    @Test\n    void damageBoundingBox() {\n        M3ViewportDamage d = new M3ViewportDamage();\n        int[] out = new int[4];\n        assertFalse(d.take(out));\n        d.add(10, 10, 5, 5);\n        d.add(40, 2, 4, 4);\n        d.add(0, 0, 0, 9);\n        assertTrue(!d.isEmpty() && d.addedArea() == 41);\n        assertTrue(d.take(out));\n        assertArrayEquals(new int[] { 10, 2, 34, 13 }, out);\n        assertTrue(d.isEmpty() && d.addedArea() == 0);\n    }\n\n    @Test\n    void damageNeverSilentlyDropsAcceptedEndpointRectangles() {\n        int[][] rectangles = {\n                { Integer.MAX_VALUE - 1, 0, 10, 1 },\n                { 0, Integer.MAX_VALUE - 1, 1, 10 },\n                { Integer.MAX_VALUE - 1, Integer.MAX_VALUE - 1, 10, 10 }\n        };\n        for (int[] rectangle : rectangles) {\n            M3ViewportDamage damage = new M3ViewportDamage();\n            int[] out = new int[4];\n            try {\n                damage.add(rectangle[0], rectangle[1], rectangle[2], rectangle[3]);\n            } catch (IllegalArgumentException rejected) {\n                assertTrue(damage.isEmpty());\n                assertEquals(0L, damage.addedArea());\n                continue;\n            }\n            assertFalse(damage.isEmpty());\n            assertEquals((long) rectangle[2] * rectangle[3], damage.addedArea());\n            assertTrue(damage.take(out));\n            assertArrayEquals(rectangle, out);\n            assertTrue(damage.isEmpty());\n            assertEquals(0L, damage.addedArea());\n        }\n    }\n\n    @Test\n    void damageNeverLosesAcceptedRepresentableUnion() {\n        int[][][] cases = {\n                { { Integer.MAX_VALUE - 1, 0, 10, 1 },\n                  { Integer.MAX_VALUE - 2, 1, 1, 1 },\n                  { Integer.MAX_VALUE - 2, 0, 11, 2 } },\n                { { 0, Integer.MAX_VALUE - 1, 1, 10 },\n                  { 1, Integer.MAX_VALUE - 2, 1, 1 },\n                  { 0, Integer.MAX_VALUE - 2, 2, 11 } }\n        };\n        for (int[][] rectangleCase : cases) {\n            M3ViewportDamage damage = new M3ViewportDamage();\n            int[] out = new int[4];\n            int[] first = rectangleCase[0];\n            int[] second = rectangleCase[1];\n            int[] expected = rectangleCase[2];\n            try {\n                damage.add(first[0], first[1], first[2], first[3]);\n            } catch (IllegalArgumentException rejected) {\n                assertTrue(damage.isEmpty());\n                assertEquals(0L, damage.addedArea());\n                continue;\n            }\n            try {\n                damage.add(second[0], second[1], second[2], second[3]);\n            } catch (IllegalArgumentException rejected) {\n                assertEquals(10L, damage.addedArea());\n                assertTrue(damage.take(out));\n                assertArrayEquals(first, out);\n                continue;\n            }\n            assertEquals(11L, damage.addedArea());\n            assertTrue(damage.take(out));\n            assertArrayEquals(expected, out);\n            assertFalse(damage.take(out));\n            assertArrayEquals(expected, out);\n        }\n    }\n\n    @Test\n    void damageKeepsLargeBoundsWithinSharedSwtDomain() {\n        int limit = 1 << 29;\n        M3ViewportDamage damage = new M3ViewportDamage();\n        int[] out = new int[4];\n        damage.add(-limit, -limit, 1, 1);\n        damage.add(limit, limit, limit, limit);\n        assertEquals(1L + (long) limit * limit, damage.addedArea());\n        assertTrue(damage.take(out));\n        assertArrayEquals(new int[] { -limit, -limit, 3 * limit, 3 * limit }, out);\n    }\n\n    @Test\n    void damageIgnoredDimensionsCannotMutateEmptyOrResidentState() {\n        int[][] ignored = {\n                { Integer.MIN_VALUE, Integer.MAX_VALUE, 0, 1 },\n                { Integer.MAX_VALUE, Integer.MIN_VALUE, 1, 0 },\n                { Integer.MAX_VALUE, Integer.MAX_VALUE, -1, Integer.MAX_VALUE },\n                { Integer.MIN_VALUE, Integer.MIN_VALUE, Integer.MAX_VALUE, -1 },\n                { Integer.MAX_VALUE, Integer.MIN_VALUE, Integer.MIN_VALUE, Integer.MIN_VALUE }\n        };\n        for (boolean resident : new boolean[] { false, true }) {\n            M3ViewportDamage damage = new M3ViewportDamage();\n            if (resident) damage.add(10, 20, 3, 4);\n            for (int[] rectangle : ignored) {\n                damage.add(rectangle[0], rectangle[1], rectangle[2], rectangle[3]);\n                assertEquals(!resident, damage.isEmpty());\n                assertEquals(resident ? 12L : 0L, damage.addedArea());\n            }\n            int[] out = { 9, 8, 7, 6 };\n            assertEquals(resident, damage.take(out));\n            assertArrayEquals(resident ? new int[] { 10, 20, 3, 4 } : new int[] { 9, 8, 7, 6 }, out);\n            assertTrue(damage.isEmpty());\n            assertEquals(0L, damage.addedArea());\n            damage.add(-4, -6, 2, 3);\n            assertEquals(6L, damage.addedArea());\n            assertTrue(damage.take(out));\n            assertArrayEquals(new int[] { -4, -6, 2, 3 }, out);\n            assertTrue(damage.isEmpty());\n            assertEquals(0L, damage.addedArea());\n        }\n    }\n\n    @Test\n    void damageAreaCountsOverlapsAndRetainsJavaLongWrapping() {\n        int side = Integer.MAX_VALUE;\n        java.math.BigInteger singleArea = java.math.BigInteger.valueOf(side).pow(2);\n        M3ViewportDamage damage = new M3ViewportDamage();\n        for (int repeat = 1; repeat <= 3; repeat++) {\n            damage.add(0, 0, side, side);\n            assertEquals(singleArea.multiply(java.math.BigInteger.valueOf(repeat)).longValue(),\n                    damage.addedArea());\n            assertFalse(damage.isEmpty());\n        }\n        assertTrue(damage.addedArea() < 0L);\n        assertFalse(damage.isEmpty());\n        int[] out = new int[4];\n        assertTrue(damage.take(out));\n        assertArrayEquals(new int[] { 0, 0, side, side }, out);\n        assertTrue(damage.isEmpty());\n        assertEquals(0L, damage.addedArea());\n    }\n\n    @Test\n    void damageDrainPreservesPartialOutputFailureAndResetsOnlyAfterSuccess() {\n        M3ViewportDamage empty = new M3ViewportDamage();\n        int[] untouched = { 13, 17, 19 };\n        assertFalse(empty.take(null));\n        assertFalse(empty.take(untouched));\n        assertArrayEquals(new int[] { 13, 17, 19 }, untouched);\n\n        M3ViewportDamage nullOutput = new M3ViewportDamage();\n        nullOutput.add(2, 3, 5, 7);\n        assertThrows(NullPointerException.class, () -> nullOutput.take(null));\n        assertFalse(nullOutput.isEmpty());\n        assertEquals(35L, nullOutput.addedArea());\n        int[] afterNull = new int[4];\n        assertTrue(nullOutput.take(afterNull));\n        assertArrayEquals(new int[] { 2, 3, 5, 7 }, afterNull);\n        assertTrue(nullOutput.isEmpty());\n        assertEquals(0L, nullOutput.addedArea());\n\n        int[] expected = { 2, 3, 5, 7 };\n        for (int length = 0; length < 4; length++) {\n            M3ViewportDamage damage = new M3ViewportDamage();\n            damage.add(2, 3, 5, 7);\n            int[] shortOutput = new int[length];\n            java.util.Arrays.fill(shortOutput, -99);\n            assertThrows(ArrayIndexOutOfBoundsException.class, () -> damage.take(shortOutput));\n            for (int slot = 0; slot < length; slot++) assertEquals(expected[slot], shortOutput[slot]);\n            assertFalse(damage.isEmpty());\n            assertEquals(35L, damage.addedArea());\n            int[] out = { 0, 0, 0, 0, 91 };\n            assertTrue(damage.take(out));\n            assertArrayEquals(new int[] { 2, 3, 5, 7, 91 }, out);\n            assertTrue(damage.isEmpty());\n            assertEquals(0L, damage.addedArea());\n        }\n    }\n\n    @Test\n    void unresidentModelStateDoesNotRequestVisiblePaint() throws Throwable {\n        runCallerDamageContract(\"callerUnresidentDamage\");\n    }\n\n    @Test\n    void outsideModelRectanglesCannotBridgeVisibleDamage() throws Throwable {\n        runCallerDamageContract(\"callerOutsideDamage\");\n    }\n\n    @Test\n    void paddedModelDamageClipsWideArithmeticBeforeNarrowing() throws Throwable {\n        runCallerDamageContract(\"callerPaddedDamage\");\n    }\n\n    @Test\n    void modelDamageDrainPreservesBackendFailuresAndResize() throws Throwable {\n        runCallerDamageContract(\"callerDrainDamage\");\n    }\n\n    private static void runCallerDamageContract(String name) throws Throwable {\n        Class<?> checks = Class.forName(\"jdk.m3.swing.web.model.M3WebChecks\");\n        java.lang.reflect.Method contract = checks.getDeclaredMethod(name);\n        contract.setAccessible(true);\n        try {\n            contract.invoke(null);\n        } catch (java.lang.reflect.InvocationTargetException failure) {\n            throw failure.getCause();\n        }\n    }\n\n    @Test\n    void wideDamageAcceptsEveryPositiveIntSingleton() throws ReflectiveOperationException {\n        int limit = 1 << 29;\n        int[] origins = { Integer.MIN_VALUE, -Integer.MAX_VALUE, -limit, -1, 0, 1,\n                limit, Integer.MAX_VALUE - 1, Integer.MAX_VALUE };\n        int[] extents = { 1, 2, 10, limit, Integer.MAX_VALUE };\n        for (int x : origins) for (int y : origins) for (int width : extents) for (int height : extents) {\n            M3ViewportDamage damage = new M3ViewportDamage();\n            damage.add(x, y, width, height);\n            assertFalse(damage.isEmpty());\n            assertEquals((long) width * height, damage.addedArea());\n            int[] out = { 13, 17, 19, 23, 29 };\n            assertTrue(damage.take(out));\n            assertArrayEquals(new int[] { x, y, width, height, 29 }, out);\n            assertTrue(damage.isEmpty());\n            assertEquals(0L, damage.addedArea());\n        }\n        var wide = M3ViewportDamage.class.getMethod(\"takeWide\", long[].class);\n        assertEquals(boolean.class, wide.getReturnType());\n        assertFalse(java.lang.reflect.Modifier.isStatic(wide.getModifiers()));\n        for (int x : origins) for (int y : origins) for (int width : extents) for (int height : extents) {\n            M3ViewportDamage damage = new M3ViewportDamage();\n            damage.add(x, y, width, height);\n            long[] out = { 13, 17, 19, 23, 29 };\n            assertTrue((Boolean) wide.invoke(damage, (Object) out));\n            assertArrayEquals(new long[] { x, y, width, height, 29 }, out);\n            assertTrue(damage.isEmpty());\n            assertEquals(0L, damage.addedArea());\n        }\n    }\n\n    @Test\n    void wideDamageRetainsOversizedUnionAfterLegacyProjectionFailure() throws ReflectiveOperationException {\n        var wide = M3ViewportDamage.class.getMethod(\"takeWide\", long[].class);\n        int max = Integer.MAX_VALUE;\n        int min = Integer.MIN_VALUE;\n        int[][][] cases = {\n                { { 0, 0, max, 1 }, { max, 0, 1, 1 } },\n                { { 0, 0, 1, max }, { 0, max, 1, 1 } },\n                { { min, 0, max, 1 }, { max, 0, max, 1 } },\n                { { 0, min, 1, max }, { 0, max, 1, max } },\n                { { min, min, max, max }, { max, max, max, max } }\n        };\n        M3ViewportDamage boundary = new M3ViewportDamage();\n        boundary.add(0, 0, max - 1, 1);\n        boundary.add(max - 1, 0, 1, 1);\n        int[] boundaryOut = new int[4];\n        assertTrue(boundary.take(boundaryOut));\n        assertArrayEquals(new int[] { 0, 0, max, 1 }, boundaryOut);\n        for (int[][] rectangles : cases) {\n            M3ViewportDamage damage = new M3ViewportDamage();\n            long area = 0;\n            long x0 = Long.MAX_VALUE, y0 = Long.MAX_VALUE;\n            long x1 = Long.MIN_VALUE, y1 = Long.MIN_VALUE;\n            for (int[] r : rectangles) {\n                damage.add(r[0], r[1], r[2], r[3]);\n                area += (long) r[2] * r[3];\n                x0 = Math.min(x0, r[0]); y0 = Math.min(y0, r[1]);\n                x1 = Math.max(x1, (long) r[0] + r[2]);\n                y1 = Math.max(y1, (long) r[1] + r[3]);\n            }\n            int[] out = { 13, 17, 19, 23, 29 };\n            assertThrows(ArithmeticException.class, () -> damage.take(out));\n            assertArrayEquals(new int[] { 13, 17, 19, 23, 29 }, out);\n            assertThrows(ArithmeticException.class, () -> damage.take(null));\n            for (int length = 0; length < 4; length++) {\n                int[] shortOutput = new int[length];\n                java.util.Arrays.fill(shortOutput, -777);\n                assertThrows(ArithmeticException.class, () -> damage.take(shortOutput));\n                for (int value : shortOutput) assertEquals(-777, value);\n                assertFalse(damage.isEmpty());\n                assertEquals(area, damage.addedArea());\n            }\n            assertFalse(damage.isEmpty());\n            assertEquals(area, damage.addedArea());\n            damage.add(0, 0, 2, 3);\n            area += 6;\n            x0 = Math.min(x0, 0); y0 = Math.min(y0, 0);\n            x1 = Math.max(x1, 2); y1 = Math.max(y1, 3);\n            assertEquals(area, damage.addedArea());\n            long[] exact = { 31, 37, 41, 43, 47 };\n            assertTrue((Boolean) wide.invoke(damage, (Object) exact));\n            assertArrayEquals(new long[] { x0, y0, x1 - x0, y1 - y0, 47 }, exact);\n            assertTrue(damage.isEmpty());\n            assertEquals(0L, damage.addedArea());\n            assertFalse(damage.take(null));\n            assertFalse((Boolean) wide.invoke(damage, (Object) exact));\n            assertArrayEquals(new long[] { x0, y0, x1 - x0, y1 - y0, 47 }, exact);\n        }\n    }\n\n    @Test\n    void wideDamageDrainPreservesNullPartialFailureAndResetOrder() throws ReflectiveOperationException {\n        var wide = M3ViewportDamage.class.getMethod(\"takeWide\", long[].class);\n        M3ViewportDamage empty = new M3ViewportDamage();\n        assertFalse((Boolean) wide.invoke(empty, (Object) null));\n        long[] untouched = { 13, 17, 19 };\n        assertFalse((Boolean) wide.invoke(empty, (Object) untouched));\n        assertArrayEquals(new long[] { 13, 17, 19 }, untouched);\n        int min = Integer.MIN_VALUE, max = Integer.MAX_VALUE;\n        int[][][] cases = {\n                { { 2, 3, 5, 7 } },\n                { { min, min, max, max }, { max, max, max, max } }\n        };\n        for (int[][] rectangles : cases) {\n            long x0 = Long.MAX_VALUE, y0 = Long.MAX_VALUE;\n            long x1 = Long.MIN_VALUE, y1 = Long.MIN_VALUE, area = 0;\n            for (int[] r : rectangles) {\n                x0 = Math.min(x0, r[0]); y0 = Math.min(y0, r[1]);\n                x1 = Math.max(x1, (long) r[0] + r[2]);\n                y1 = Math.max(y1, (long) r[1] + r[3]);\n                area += (long) r[2] * r[3];\n            }\n            M3ViewportDamage nullOutput = new M3ViewportDamage();\n            for (int[] r : rectangles) nullOutput.add(r[0], r[1], r[2], r[3]);\n            var nullFailure = assertThrows(java.lang.reflect.InvocationTargetException.class,\n                    () -> wide.invoke(nullOutput, (Object) null));\n            assertTrue(nullFailure.getCause() instanceof NullPointerException);\n            assertFalse(nullOutput.isEmpty());\n            assertEquals(area, nullOutput.addedArea());\n            long[] nullRecovery = { 13, 17, 19, 23, 29 };\n            assertTrue((Boolean) wide.invoke(nullOutput, (Object) nullRecovery));\n            assertArrayEquals(new long[] { x0, y0, x1 - x0, y1 - y0, 29 }, nullRecovery);\n            long[] expected = { x0, y0, x1 - x0, y1 - y0 };\n            for (int length = 0; length < expected.length; length++) {\n                M3ViewportDamage damage = new M3ViewportDamage();\n                for (int[] r : rectangles) damage.add(r[0], r[1], r[2], r[3]);\n                long[] shortOutput = new long[length];\n                java.util.Arrays.fill(shortOutput, -777);\n                var failure = assertThrows(java.lang.reflect.InvocationTargetException.class,\n                        () -> wide.invoke(damage, (Object) shortOutput));\n                assertTrue(failure.getCause() instanceof ArrayIndexOutOfBoundsException);\n                for (int index = 0; index < length; index++) assertEquals(expected[index], shortOutput[index]);\n                assertFalse(damage.isEmpty());\n                assertEquals(area, damage.addedArea());\n                long[] recovery = { 13, 17, 19, 23, 29 };\n                assertTrue((Boolean) wide.invoke(damage, (Object) recovery));\n                assertArrayEquals(new long[] { x0, y0, x1 - x0, y1 - y0, 29 }, recovery);\n                assertTrue(damage.isEmpty());\n                assertEquals(0L, damage.addedArea());\n            }\n        }\n    }\n\n    @Test\n    void wideDamagePermutationAndWrappedZeroAreaRemainNonempty() throws ReflectiveOperationException {\n        var wide = M3ViewportDamage.class.getMethod(\"takeWide\", long[].class);\n        java.util.Random random = new java.util.Random(20261103L);\n        for (int round = 0; round < 64; round++) {\n            int[][] rectangles = new int[5][4];\n            long x0 = Long.MAX_VALUE, y0 = Long.MAX_VALUE;\n            long x1 = Long.MIN_VALUE, y1 = Long.MIN_VALUE, area = 0;\n            for (int[] r : rectangles) {\n                r[0] = round % 2 == 0 ? random.nextInt(100) - 50 : random.nextInt();\n                r[1] = round % 2 == 0 ? random.nextInt(100) - 50 : random.nextInt();\n                r[2] = round % 2 == 0 ? random.nextInt(128) + 1 : random.nextInt(Integer.MAX_VALUE) + 1;\n                r[3] = round % 2 == 0 ? random.nextInt(128) + 1 : random.nextInt(Integer.MAX_VALUE) + 1;\n                x0 = Math.min(x0, r[0]); y0 = Math.min(y0, r[1]);\n                x1 = Math.max(x1, (long) r[0] + r[2]); y1 = Math.max(y1, (long) r[1] + r[3]);\n                area += (long) r[2] * r[3];\n            }\n            for (boolean reverse : new boolean[] { false, true }) {\n                M3ViewportDamage damage = new M3ViewportDamage();\n                for (int index = 0; index < rectangles.length; index++) {\n                    int[] r = rectangles[reverse ? rectangles.length - 1 - index : index];\n                    damage.add(r[0], r[1], r[2], r[3]);\n                }\n                assertFalse(damage.isEmpty());\n                assertEquals(area, damage.addedArea());\n                int[] small = { 13, 17, 19, 23, 29 };\n                if (x1 - x0 > Integer.MAX_VALUE || y1 - y0 > Integer.MAX_VALUE) {\n                    assertThrows(ArithmeticException.class, () -> damage.take(small));\n                    assertArrayEquals(new int[] { 13, 17, 19, 23, 29 }, small);\n                    assertFalse(damage.isEmpty());\n                    assertEquals(area, damage.addedArea());\n                } else {\n                    assertTrue(damage.take(small));\n                    assertArrayEquals(new int[] { (int) x0, (int) y0, (int) (x1 - x0), (int) (y1 - y0), 29 }, small);\n                    for (int index = 0; index < rectangles.length; index++) {\n                        int[] r = rectangles[reverse ? rectangles.length - 1 - index : index];\n                        damage.add(r[0], r[1], r[2], r[3]);\n                    }\n                }\n                long[] exact = { 31, 37, 41, 43, 47 };\n                assertTrue((Boolean) wide.invoke(damage, (Object) exact));\n                assertArrayEquals(new long[] { x0, y0, x1 - x0, y1 - y0, 47 }, exact);\n                assertTrue(damage.isEmpty());\n                assertEquals(0L, damage.addedArea());\n            }\n        }\n        int min = Integer.MIN_VALUE, max = Integer.MAX_VALUE;\n        int[][] zeroArea = {\n                { min, min, max, max }, { min, max, max, max },\n                { max, min, max, max }, { max, max, max, max },\n                { 0, 0, max, 8 }, { 0, 0, 2, 2 }\n        };\n        for (int a = 0; a < 4; a++) for (int b = 0; b < 4; b++)\n            for (int c = 0; c < 4; c++) for (int d = 0; d < 4; d++) {\n                if (a == b || a == c || a == d || b == c || b == d || c == d) continue;\n                M3ViewportDamage permutation = new M3ViewportDamage();\n                java.math.BigInteger permutationArea = java.math.BigInteger.ZERO;\n                for (int index : new int[] { a, b, c, d }) {\n                    int[] r = zeroArea[index];\n                    permutation.add(r[0], r[1], r[2], r[3]);\n                    permutationArea = permutationArea.add(java.math.BigInteger.valueOf(r[2]).multiply(java.math.BigInteger.valueOf(r[3])));\n                    assertEquals(permutationArea.longValue(), permutation.addedArea());\n                    assertFalse(permutation.isEmpty());\n                }\n                long[] exact = { 31, 37, 41, 43, 47 };\n                assertTrue((Boolean) wide.invoke(permutation, (Object) exact));\n                assertArrayEquals(new long[] { min, min, 6_442_450_942L, 6_442_450_942L, 47 }, exact);\n                assertTrue(permutation.isEmpty());\n            }\n        M3ViewportDamage damage = new M3ViewportDamage();\n        java.math.BigInteger exactArea = java.math.BigInteger.ZERO;\n        for (int[] r : zeroArea) {\n            damage.add(r[0], r[1], r[2], r[3]);\n            exactArea = exactArea.add(java.math.BigInteger.valueOf(r[2]).multiply(java.math.BigInteger.valueOf(r[3])));\n            assertEquals(exactArea.longValue(), damage.addedArea());\n            assertFalse(damage.isEmpty());\n        }\n        assertEquals(java.math.BigInteger.ONE.shiftLeft(64), exactArea);\n        assertEquals(0L, damage.addedArea());\n        int[] small = { 13, 17, 19, 23, 29 };\n        assertThrows(ArithmeticException.class, () -> damage.take(small));\n        assertArrayEquals(new int[] { 13, 17, 19, 23, 29 }, small);\n        assertFalse(damage.isEmpty());\n        long[] exact = { 31, 37, 41, 43, 47 };\n        assertTrue((Boolean) wide.invoke(damage, (Object) exact));\n        assertArrayEquals(new long[] { min, min, 6_442_450_942L, 6_442_450_942L, 47 }, exact);\n        assertTrue(damage.isEmpty());\n        assertEquals(0L, damage.addedArea());\n    }\n}\n"
