      fileContents: "# Current-source caller producer successor\n\nStatus: PREPARED; unmodified Maven/JShell and hosted behavior scopes NOT_RUN.\n\nThis bounded successor rebases caller-visible-damage-20261112 onto M3jdk21@51eba0ac030abdd57b2bd459784301e10f918ee0. The original folder, snapshots and historical failures remain unchanged.\n\nBefore lanes snapshots retain the original weak visible-damage implementation and receive only the existing OPEN/HIDDEN geometry block. After lanes snapshots exactly equal current production. M3WebModel (paint/focus), current M3WebGen (replay/completeness), the remaining fifteen-source context closure and the unchanged approved18 fixture are pinned. The selected emitter handles only M3WebLanes and M3WebChecks; generator main and manifest are never called.\n\nThe metadata recipe updates exactly one current ledger row (lanes legacy-after to current-after), preserving every other byte. The unrelated stale M3WebModel ledger row remains an explicit gap; this is not whole-ledger reconciliation.\n\nRequired qualification: 21 closed bindings; strict17-source before/after compilation; protected API equality; selected two-file emission and same/fresh zero-write replay; exact one-row OpenRewrite update; four ledger refusals; wrong-path refusal; source/ledger drift refusal; actual apply zero Java writes on this current head; one ledger row write then zero replay. Producer sentinel reports callerBehaviour=NOT_RUN until separate behavior execution.\n\nHosted follow-up uses existing source JUnit build, seven caller tests, current437 public suite, and separate unchanged18-method fixture. Preserve actual counts/exits; the historical fixture result is12pass/6fail and does not become PASS by rebinding producer inputs. Wide accumulator API work remains separate.\n\nLocal default-filesystem Maven/JShell remains HOLD under storage controls. A guarded Jimfs/RAM compiler proof must report its narrower scope and cannot substitute for unmodified Maven/JShel