      fileContents: "---\ntype: specs.openrewrite.org/v1beta/recipe\nname: com.synexia.m3.CallerVisibleDamageCurrentSourceLedger20261116\ndisplayName: Record the selected current-source lanes output\ndescription: Update exactly one generated-source ledger row while retaining every other byte.\nrecipeList:\n  - org.openrewrite.text.FindAndReplace:\n      find: \"src/main/java/jdk/m3/swing/web/model/M3WebLanes.java\\tcore/M3WebLanes.java.tmpl\\t70264dc0e1183b6c0dcc82dc998ba027e02f8301072e6b6ae05324ed053805fd\\n\"\n      replace: \"src/main/java/jdk/m3/swing/web/model/M3WebLanes.java\\tcore/M3WebLanes.java.tmpl\\t65d98416b094a5b082e9f66c03aa42037e6dc3fd40417926edb73dae91657e03\\n\"\n      regex: false\n      caseSensitive: true\n      filePattern: m3/ports/swing-viewport/webwidgets/GENERATED.tsv\n"
