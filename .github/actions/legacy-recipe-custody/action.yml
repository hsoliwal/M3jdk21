name: Restore sealed legacy recipe custody
description: >-
  Materialise the legacy recipe paths that m3/release/legacy-recipe-custody-20261030.tsv records as deleted from
  their Synexia seal (hsoliwal/com.synexia ac6518d9a38080c589b3b51cf1f18edeca1b9c41), blob-verified, for the importers
  that still read them. No-op while the legacy paths are tracked.
inputs:
  token:
    description: Read token for hsoliwal/com.synexia
    required: true
  root:
    description: M3jdk21 checkout directory, relative to the workspace
    required: false
    default: .
runs:
  using: composite
  steps:
    - name: Plan legacy recipe custody restore
      id: plan
      shell: bash
      env:
        M3_ROOT: ${{ inputs.root }}
      run: bash "$GITHUB_ACTION_PATH/restore.sh" plan "$M3_ROOT"
    - name: Check out the Synexia legacy recipe custody seal
      if: steps.plan.outputs.needed == 'true'
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: hsoliwal/com.synexia
        ref: ac6518d9a38080c589b3b51cf1f18edeca1b9c41
        token: ${{ inputs.token }}
        path: .legacy-recipe-custody-seal
        fetch-depth: 1
        fetch-tags: false
        lfs: false
        submodules: false
        persist-credentials: false
        sparse-checkout-cone-mode: false
        sparse-checkout: ${{ steps.plan.outputs.paths }}
    - name: Restore and verify legacy recipe custody blobs
      if: steps.plan.outputs.needed == 'true'
      shell: bash
      env:
        M3_ROOT: ${{ inputs.root }}
      run: bash "$GITHUB_ACTION_PATH/restore.sh" restore "$M3_ROOT" "$GITHUB_WORKSPACE/.legacy-recipe-custody-seal"
