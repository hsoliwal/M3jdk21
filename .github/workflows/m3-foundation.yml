name: M3 foundation contracts
on:
  pull_request:
    paths: ['m3/**', 'src/java.base/share/classes/java/lang/String.java', '.github/workflows/m3-foundation.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  number-space-contract:
    name: M3 number-space manifest contract
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      TEMP: ${{ runner.temp }}
      TMP: ${{ runner.temp }}
      TMPDIR: ${{ runner.temp }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/core/src
            /m3/core/test/M3NumberSpaceTest.java
            /m3/core/test/M3NumberSpaceContractTest.java
            /m3/lexicon/synexia-source-manifest.tsv
            /m3/lexicon/synexia-number-target-map.tsv
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile the existing M3 core and run the focused number-space contracts
        shell: bash
        run: |
          set -euo pipefail
          test "$TEMP" = "$RUNNER_TEMP"
          test "$TMP" = "$RUNNER_TEMP"
          printf 'TEMP=%s TMP=%s\n' "$TEMP" "$TMP"
          work="$RUNNER_TEMP/m3-number-space"
          mkdir -p "$work/classes" "$work/tests"
          mapfile -t sources < <(find m3/core/src -name '*.java' -print | LC_ALL=C sort)
          javac --release 21 -Xlint:all,-module -d "$work/classes" "${sources[@]}"
          jar --create --file "$work/com.m3.text.jar" -C "$work/classes" .
          javac --release 21 --module-path "$work/com.m3.text.jar" --add-modules com.m3.text -d "$work/tests" m3/core/test/M3NumberSpaceTest.java m3/core/test/M3NumberSpaceContractTest.java
          (
            cd m3
            java -ea -esa --module-path "$work/com.m3.text.jar" --add-modules com.m3.text -cp "$work/tests" M3NumberSpaceTest
            java -ea -esa --module-path "$work/com.m3.text.jar" --add-modules com.m3.text -cp "$work/tests" M3NumberSpaceContractTest
          )
  foundation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated pinned compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          echo "M3_JDK=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"
      - name: Verify layered source-bound recipes
        run: |
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py --check
          python3 m3/runtime-integration/char-array-copy/recipe/test_recipe.py
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py --reverse
          trap 'python3 m3/runtime-integration/char-array-copy/recipe/apply.py >/dev/null' EXIT
          python3 m3/runtime-integration/recipe/apply.py --check
          python3 m3/runtime-integration/recipe/test_recipe.py
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py
          trap - EXIT
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py --check
      - name: Verify OpenRewrite convergence DAG
        run: |
          java -version
          mvn -version
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml clean verify
      - name: Build and exercise immutable foundation
        run: bash ./m3/build.sh
      - name: Compare pinned Synexia content and range contract
        run: python3 m3/compatibility/check-synexia.py
      - name: Verify two-process read-only image mapping
        run: python3 m3/verify-shared-mapping.py
