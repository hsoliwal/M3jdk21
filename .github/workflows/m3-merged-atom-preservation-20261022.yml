# SPDX-License-Identifier: Apache-2.0
name: M3 merged recipe atom preservation

on:
  pull_request:
    paths:
      - 'm3/file/**'
      - 'm3/collections/**'
      - 'src/jdk.m3.collections/share/classes/jdk/internal/m3/collections/ObservableList.java'
      - 'test/jdk/jdk/m3/collections/ObservableIndexedViewsContract.java'
      - 'm3/tooling/migration-recipes/**'
      - 'm3/docs/m3-m3jdk21-source-successions.tsv'
      - '.github/workflows/**'
  push:
    branches:
      - master
      - m3/restore-merged-atoms-ci-20261022
    paths:
      - 'm3/file/**'
      - 'm3/collections/**'
      - 'src/jdk.m3.collections/share/classes/jdk/internal/m3/collections/ObservableList.java'
      - 'test/jdk/jdk/m3/collections/ObservableIndexedViewsContract.java'
      - 'm3/tooling/migration-recipes/**'
      - 'm3/docs/m3-m3jdk21-source-successions.tsv'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  require-merged-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject new transformation recipe sources in the downstream product
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          M3_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$M3_BASE_SHA"
          git diff --diff-filter=A --name-only "$M3_BASE_SHA" HEAD > "$RUNNER_TEMP/m3-new-paths.txt"
          if grep -E '(^m3/recipes/|^m3/tooling/migration-recipes/|/recipe(s)?/)' "$RUNNER_TEMP/m3-new-paths.txt"; then
            echo 'ERROR: recipe roots (m3/recipes, migration-recipes, */recipe(s)/) take no new sources; add tools under m3/tooling/<lane>/tools/ (standalone, m3/tooling/standalone/M3_REFS.tsv)'
            exit 1
          fi
