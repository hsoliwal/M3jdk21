# SPDX-License-Identifier: Apache-2.0
name: M3 indexed binary sorted set algebra Java and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/qualification/m3jdk21-binary-set-index-navigation-20261018/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongCompositeViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexedSetAlgebraSeekProof.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexedSetAlgebraSeekTest.java'
      - '.github/workflows/m3-binary-set-index-navigation-20261018.yml'
  workflow_dispatch:
jobs:
  source-index-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Seal original source and all canonical generated output templates
        run: |
          set -eu
          Q=m3/collections/qualification/m3jdk21-binary-set-index-navigation-20261018/recipe
          awk -F '\t' '{print $3 "  " $1}' "$Q/manifest.tsv" | sha256sum -c -
          awk -F '\t' -v q="$Q" '{print $3 "  " q "/" $4}' "$Q/manifest.tsv" | sha256sum -c -
          cmp "$Q/M3LongCompositeViews.java.txt" m3/collections/src/main/java/com/m3/collections/M3LongCompositeViews.java
      - name: Strict Java21 real-owner and original custom supplier JDK contracts
        run: |
          set -eu
          PKG=m3/collections/src/main/java/com/m3/collections
          TST=m3/collections/src/test/java/com/m3/collections
          OUT="$RUNNER_TEMP/m3-sorted-index/classes"
          mkdir -p "$OUT"
          javac --release 21 -proc:none -Xlint:all,-serial -Werror \
            -sourcepath m3/collections/src/main/java:m3/collections/src/test/java -d "$OUT" \
            "$PKG/M3LongCompositeViews.java" "$PKG/M3LongTreeSet.java" \
            "$TST/M3IndexedSetAlgebraSeekProof.java" "$TST/M3LongSortedAlgebraSelfTest.java" \
            "$PKG/M3IndexMaskCompactor.java" "$TST/M3IndexMaskCompactorSelfTest.java"
          java -cp "$OUT" com.m3.collections.M3IndexedSetAlgebraSeekProof
          java -cp "$OUT" com.m3.collections.M3LongSortedAlgebraSelfTest
          java -cp "$OUT" com.m3.collections.M3IndexMaskCompactorSelfTest
      - name: Check unchanged existing JNI selector under GCC C17 and JDK21
        run: |
          set -eu
          OUT="$RUNNER_TEMP/m3-sorted-index/classes"
          BIN="$RUNNER_TEMP/m3-sorted-index/native"
          mkdir -p "$BIN"
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$BIN/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$BIN" -cp "$OUT" \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
      - name: Install existing original source-vendored JUnit reactor
        run: >
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Owning original module Java21/JUnit contract proofs
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongSortedAlgebraTest,M3IndexedSetAlgebraSeekTest test
