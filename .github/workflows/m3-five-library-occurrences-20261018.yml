# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 indexed multivalue occurrence Java JNI recipe
on:
  pull_request:
    paths:
      - AGENTS.md
      - src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexedMultiValueMap.java
      - test/jdk/jdk/m3/collections/M3IndexedMultiValueOccurrenceSelfTest.java
      - test/jdk/jdk/m3/collections/M3IndexedMultiValueOccurrenceTest.java
      - test/jdk/jdk/m3/collections/M3IndexedOccurrenceArrayNativeTest.java
      - make/m3/collections/qualification/m3-five-library-occurrences-20261018/**
      - .github/workflows/m3-five-library-occurrences-20261018.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-array-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual canonical OpenRewrite recipe Maven JUnit
        run: |
          set -eu
          mvn -B -ntp -f make/m3/collections/qualification/m3-five-library-occurrences-20261018/recipe/pom.xml verify
      - name: Build M3JDK21 collection module and run real JUnit
        run: |
          set -eu
          # The collections module requires the first-party arrays module.
          # Compile/install the actual owner before running the unchanged JUnit.
          # Reuse the genuine m3-arrays native-linux owner, including its CTest
          # verification. Maven dependency installation alone does not load JNI.
          mvn -B -ntp -f m3/arrays/pom.xml -Pnative-linux -DskipTests install
          ARRAYS="$PWD/m3/arrays/target/m3-arrays-0.1.0-SNAPSHOT.jar"
          ARRAY_NATIVE="$PWD/m3/arrays/target/native/libm3_arrays.so"
          test -s "$ARRAYS"
          test -s "$ARRAY_NATIVE"
          jar --describe-module --file "$ARRAYS" | grep -F 'jdk.m3.arrays'
          # This existing occurrence test allocates required-native Object[].
          # Supply the exact native provider to its forked Surefire JVM.
          mvn -B -ntp -f m3/collections/pom.xml test \
            -Dtest=M3IndexedMultiValueOccurrenceTest,M3IndexedOccurrenceArrayNativeTest \
            -Dsurefire.failIfNoSpecifiedTests=true \
            "-Dm3.arrays.native.path=$ARRAY_NATIVE" \
            "-DargLine=-Xcheck:jni -Dm3.arrays.native.path=$ARRAY_NATIVE"
          # Actual Jupiter XML, not @Test source presence, proves five atoms.
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("m3/collections/target/surefire-reports")
          expected = {
              "jdk.m3.collections.M3IndexedMultiValueOccurrenceTest#differential",
              "jdk.m3.collections.M3IndexedOccurrenceArrayNativeTest#objectAllocationIsNativeAndDetached",
              "jdk.m3.collections.M3IndexedOccurrenceArrayNativeTest#byteAllocationIsNativeAndZeroInitialized",
              "jdk.m3.collections.M3IndexedOccurrenceArrayNativeTest#intAllocationIsNativeAndZeroInitialized",
              "jdk.m3.collections.M3IndexedOccurrenceArrayNativeTest#longAllocationIsNativeAndZeroInitialized",
          }
          observed = set()
          for cls in ("M3IndexedMultiValueOccurrenceTest", "M3IndexedOccurrenceArrayNativeTest"):
              name = "jdk.m3.collections." + cls
              report = root / ("TEST-" + name + ".xml")
              if report.is_symlink() or not report.is_file():
                  raise ValueError("missing or aliased executed Surefire report: " + name)
              suite = ET.parse(report).getroot()
              cases = suite.findall("testcase")
              if suite.tag != "testsuite" or len(cases) != int(suite.get("tests", "-1")):
                  raise ValueError("invalid Surefire test count: " + name)
              if any(int(suite.get(field, "-1")) != 0 for field in ("errors", "failures", "skipped")):
                  raise ValueError("failed or skipped required native test: " + name)
              for case in cases:
                  if any(child.tag in ("error", "failure", "skipped", "flakyFailure", "flakyError",
                                      "rerunFailure", "rerunError") for child in case):
                      raise ValueError("hidden failure or rerun for " + name)
                  identity = case.get("classname", "") + "#" + case.get("name", "")
                  if identity in observed:
                      raise ValueError("duplicated executed JUnit atom")
                  observed.add(identity)
          if observed != expected:
              raise ValueError("missing/extra executed JUnit methods: " + repr(expected ^ observed))
          print("M3_INDEXED_ARRAY_REQUIRED_JNI_SUREFIRE_PASS methods=5 suites=2")
          PY
      - name: Exact real Java21 M3 owner and native-index C17 differential
        run: |
          set -eu
          CLS="$RUNNER_TEMP/m3-multivalue-classes"
          NATIVE="$RUNNER_TEMP/m3-multivalue-native"
          mkdir -p "$CLS" "$NATIVE"
          # Reuse the installed real JPMS dependency; preserve module-info.
          ARRAYS="$PWD/m3/arrays/target/m3-arrays-0.1.0-SNAPSHOT.jar"
          ARRAY_NATIVE="$PWD/m3/arrays/target/native/libm3_arrays.so"
          test -s "$ARRAYS"
          test -s "$ARRAY_NATIVE"
          find m3/collections/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/collections src/jdk.m3.collections/share/classes/jdk/internal/m3/collections -name '*.java' -print | sort > "$RUNNER_TEMP/m3-multivalue-main-sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            --module-path "$ARRAYS" -d "$CLS" @"$RUNNER_TEMP/m3-multivalue-main-sources.txt"
          # Compile the original oracle in the owning module, never drop JPMS.
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            --module-path "$CLS:$ARRAYS" \
            --patch-module jdk.m3.collections=test/jdk \
            -d "$CLS" \
            test/jdk/jdk/m3/collections/M3IndexedMultiValueOccurrenceSelfTest.java
          java -Xcheck:jni "-Dm3.arrays.native.path=$ARRAY_NATIVE" \
            --module-path "$CLS:$ARRAYS" \
            --module jdk.m3.collections/jdk.m3.collections.M3IndexedMultiValueOccurrenceSelfTest
          cc -std=c17 -fPIC -shared -O1 -g -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_compactor.c \
            -o "$NATIVE/libm3_collections_mask.so"
          UBSAN_OPTIONS=halt_on_error=1 java -Xcheck:jni \
            "-Dm3.arrays.native.path=$ARRAY_NATIVE" \
            -Djava.library.path="$NATIVE" \
            --module-path "$CLS:$ARRAYS" \
            --module jdk.m3.collections/jdk.m3.collections.M3IndexedMultiValueOccurrenceSelfTest
