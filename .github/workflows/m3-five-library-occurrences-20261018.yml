# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 indexed multivalue occurrence Java JNI recipe
on:
  pull_request:
    paths:
      - AGENTS.md
      - m3/collections/src/main/java/com/m3/collections/M3IndexedMultiValueMap.java
      - m3/collections/src/test/java/com/m3/collections/M3IndexedMultiValueOccurrenceSelfTest.java
      - m3/collections/src/test/java/com/m3/collections/M3IndexedMultiValueOccurrenceTest.java
      - m3/collections/qualification/m3-five-library-occurrences-20261018/**
      - .github/workflows/m3-five-library-occurrences-20261018.yml
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrated-array-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual canonical OpenRewrite recipe Maven JUnit
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/qualification/m3-five-library-occurrences-20261018/recipe/pom.xml verify
      - name: Build M3JDK21 collection module and run real JUnit
        run: |
          set -eu
          # The collections module requires the first-party arrays module.
          # Compile/install the actual owner before running the unchanged JUnit.
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          ARRAYS="$PWD/m3/arrays/target/m3-arrays-0.1.0-SNAPSHOT.jar"
          test -s "$ARRAYS"
          jar --describe-module --file "$ARRAYS" | grep -F 'com.m3.arrays'
          mvn -B -ntp -f m3/collections/pom.xml test -Dtest=M3IndexedMultiValueOccurrenceTest -Dsurefire.failIfNoSpecifiedTests=true
      - name: Exact real Java21 M3 owner and native-index C17 differential
        run: |
          set -eu
          CLS="$RUNNER_TEMP/m3-multivalue-classes"
          NATIVE="$RUNNER_TEMP/m3-multivalue-native"
          mkdir -p "$CLS" "$NATIVE"
          # Reuse the installed real JPMS dependency; preserve module-info.
          ARRAYS="$PWD/m3/arrays/target/m3-arrays-0.1.0-SNAPSHOT.jar"
          test -s "$ARRAYS"
          find m3/collections/src/main/java -name '*.java' -print | sort > "$RUNNER_TEMP/m3-multivalue-main-sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            --module-path "$ARRAYS" -d "$CLS" @"$RUNNER_TEMP/m3-multivalue-main-sources.txt"
          # Compile the original oracle in the owning module, never drop JPMS.
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            --module-path "$CLS:$ARRAYS" \
            --patch-module com.m3.collections=m3/collections/src/test/java \
            -d "$CLS" \
            m3/collections/src/test/java/com/m3/collections/M3IndexedMultiValueOccurrenceSelfTest.java
          java --module-path "$CLS:$ARRAYS" \
            --module com.m3.collections/com.m3.collections.M3IndexedMultiValueOccurrenceSelfTest
          cc -std=c17 -fPIC -shared -O1 -g -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$NATIVE/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$NATIVE" \
            --module-path "$CLS:$ARRAYS" \
            --module com.m3.collections/com.m3.collections.M3IndexedMultiValueOccurrenceSelfTest
