name: M3 AtomLogic read-only profile custody
# Former triggers (below, as of the move) now start job(s) 'm3-atomlogic-profile-20261017__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     push:
#       branches:
#         - m3/atomlogic-recipe-profile-receiver-20261017
#       paths:
#         - 'm3/pom.xml'
#         - 'm3/tooling/atom-logic-receiver/**'
#         - '.github/workflows/m3-atomlogic-profile-20261017.yml'
#     pull_request:
#       paths:
#         - 'm3/pom.xml'
#         - 'm3/tooling/atom-logic-receiver/**'
#         - '.github/workflows/m3-atomlogic-profile-20261017.yml'
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  profile-custody:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SHA pinned source/refusal and Maven XML oracle
        run: python3 m3/tooling/atom-logic-receiver/recipe.py self-test
      - name: Maven receipt and fixed point (does not execute Synexia SDK)
        run: mvn -B -ntp -f m3/tooling/atom-logic-receiver/pom.xml verify
      - name: Confirm no direct target or JDK source mutation
        run: git diff --exit-code -- m3/pom.xml
