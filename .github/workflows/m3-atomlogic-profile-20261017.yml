name: M3 AtomLogic read-only profile custody
on:
  push:
    branches:
      - m3/atomlogic-recipe-profile-receiver-20261017
    paths:
      - 'm3/pom.xml'
      - 'm3/tooling/atom-logic-receiver/**'
      - '.github/workflows/m3-atomlogic-profile-20261017.yml'
  pull_request:
    paths:
      - 'm3/pom.xml'
      - 'm3/tooling/atom-logic-receiver/**'
      - '.github/workflows/m3-atomlogic-profile-20261017.yml'
jobs:
  profile-custody:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SHA pinned source/refusal and Maven XML oracle
        run: python3 m3/tooling/atom-logic-receiver/recipe.py self-test
      - name: Maven receipt and fixed point (does not execute Synexia SDK)
        run: mvn -B -ntp -f m3/tooling/atom-logic-receiver/pom.xml verify
      - name: Confirm no direct target or JDK source mutation
        run: git diff --exit-code -- m3/pom.xml
