# SPDX-License-Identifier: Apache-2.0
name: M3 Case and Liang Candidate Precompute — Java21 C17 JNI
on:
  pull_request:
    paths:
      - 'm3/lexicon/receiver/**'
      - '.github/workflows/m3-case-liang-precompute-20261103.yml'
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: m3-case-liang-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated-java-c17:
    name: Exact Java21 / test-only C17 JNI differential
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source identity and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          echo 'fe257d0d1f7a6fa96bd25dc64dfaeb122b363313d74ed1b8d40be31b46ecb4df  m3/lexicon/receiver/verify-case-liang-20261103.sh' | sha256sum -c -
          bash -n m3/lexicon/receiver/verify-case-liang-20261103.sh
      - name: Compile Java then C17; test Java and JNI checked/interpreted
        shell: bash
        run: |
          set -euo pipefail
          bash m3/lexicon/receiver/verify-case-liang-20261103.sh
          test -s m3/lexicon/receiver/target/m3-case-liang-precompute-20261103/logs/SHA256SUMS.txt
      - name: Preserve exact Java/C17/JNI receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-case-liang-checked-jni
          if-no-files-found: warn
          path: m3/lexicon/receiver/target/m3-case-liang-precompute-20261103/logs/
  existing-lexicon-maven:
    name: Original M3 lexicon receiver Maven verify
    needs: isolated-java-c17
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute original M3 lexicon receiver proof suite
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/lexicon/receiver/pom.xml clean verify
      - name: Preserve receiver Maven and test receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-case-liang-receiver-maven
          if-no-files-found: warn
          path: |
            m3/lexicon/receiver/target/surefire-reports/
            m3/lexicon/receiver/target/classes/
