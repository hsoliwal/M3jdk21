name: M3 derivative regex candidate Java/JNI
# Former triggers (below, as of the move) now start job(s) 'm3-derivative-regex-port__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/ports/precompute/**'
#         - 'src/java.base/share/classes/jdk/m3/precompute/**'
#         - 'test/jdk/jdk/m3/precompute/**'
#         - '.github/workflows/m3-derivative-regex-port.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  derivative-java-native:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Java derivative and differential tests
        run: |
          mvn -B -ntp -f m3/ports/precompute/pom.xml -Dtest=RegexDerivativeTest,RegexDerivativeEffectsBridgeTest test
      - name: Build C11 and JNI parity
        run: |
          mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative -Dtest=RegexDerivativeTest,RegexDerivativeEffectsBridgeTest test
