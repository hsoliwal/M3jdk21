name: 'Build (windows)'

on:
  workflow_call:
    inputs:
      platform:
        required: true
        type: string
      runs-on:
        required: true
        type: string
      extra-conf-options:
        required: false
        type: string
      make-target:
        required: false
        type: string
        default: 'product-bundles test-bundles'
      debug-levels:
        required: false
        type: string
        default: '[ "debug", "release" ]'
      msvc-toolset-version:
        required: true
        type: string
      msvc-toolset-architecture:
        required: true
        type: string
      configure-arguments:
        required: false
        type: string
      make-arguments:
        required: false
        type: string

env:
  # These are needed to make the MSYS2 bash work properly
  MSYS2_PATH_TYPE: minimal
  CHERE_INVOKING: 1

jobs:
  build-windows:
    name: build
    runs-on: ${{ inputs.runs-on }}
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        debug-level: ${{ fromJSON(inputs.debug-levels) }}
        include:
          - debug-level: debug
            flags: --with-debug-level=fastdebug
            suffix: -debug

    steps:
      - name: 'Checkout the JDK source'
        uses: actions/checkout@v6
        env:
          # Scope Win32 extended-path support to Git checkout of the retained tree.
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'

      - name: 'Get MSYS2'
        uses: ./.github/actions/get-msys2

      - name: 'Get the BootJDK'
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: windows-x64

      - name: 'Get JTReg'
        id: jtreg
        uses: ./.github/actions/get-jtreg

      - name: 'Get GTest'
        id: gtest
        uses: ./.github/actions/get-gtest

      - name: 'Check toolchain installed'
        id: toolchain-check
        run: |
          set +e
          '/c/Program Files/Microsoft Visual Studio/2022/Enterprise/vc/auxiliary/build/vcvars64.bat' -vcvars_ver=${{ inputs.msvc-toolset-version }}
          if [ $? -eq 0 ]; then
            echo "Toolchain is already installed"
            echo "toolchain-installed=true" >> $GITHUB_OUTPUT
          else
            echo "Toolchain is not yet installed"
            echo "toolchain-installed=false" >> $GITHUB_OUTPUT
          fi

      - name: 'Install toolchain and dependencies'
        run: |
          # Run Visual Studio Installer
          '/c/Program Files (x86)/Microsoft Visual Studio/Installer/vs_installer.exe' \
            modify --quiet --installPath 'C:\Program Files\Microsoft Visual Studio\2022\Enterprise' \
            --add Microsoft.VisualStudio.Component.VC.${{ inputs.msvc-toolset-version }}.${{ inputs.msvc-toolset-architecture }}
        if: steps.toolchain-check.outputs.toolchain-installed != 'true'

      # GN and Ninja are build-host tools; both Windows lanes build on an x64
      # host. Use the same pins as Skia's bin/fetch-gn and bin/fetch-ninja (the
      # Linux and macOS provisioning), fetched from the same CIPD packages and
      # verified against their content-addressed SHA-256 instance digests.
      - name: 'Get pinned GN and Ninja for bundled Skia'
        id: skia-tools
        shell: bash
        run: |
          set -euo pipefail
          gn_rev=b2afae122eeb6ce09c52d63f67dc53fc517dbdc8
          gn_sha256=7249f55d6f22b55affa68aaf19d2f597c39946299216e12d78eac6cc1469f8a1
          ninja_version='version:2@1.12.1.chromium.4'
          ninja_sha256=887dc0900b956d218a669bfadc1f8e1285dab34c61320fd27696a41ffd540c68
          skia="$(cygpath -m "$GITHUB_WORKSPACE")/src/jdk.m3.graphics/share/native/libm3graphics/skia"
          test -f "$skia/BUILD.gn"
          grep -qF "rev = '$gn_rev'" "$skia/bin/fetch-gn"
          grep -qF "'ninja_version': '$ninja_version'" "$skia/DEPS"
          cipd=https://chrome-infra-packages.appspot.com/dl
          tmp="$(cygpath -m "$RUNNER_TEMP")/skia-tools"
          mkdir -p "$tmp"
          curl -fsSL --retry 3 -o "$tmp/gn.zip" "$cipd/gn/gn/windows-amd64/+/git_revision:$gn_rev"
          curl -fsSL --retry 3 -o "$tmp/ninja.zip" "$cipd/infra/3pp/tools/ninja/windows-amd64/+/$ninja_version"
          printf '%s  %s\n' "$gn_sha256" "$tmp/gn.zip" "$ninja_sha256" "$tmp/ninja.zip" | sha256sum -c -
          mkdir -p "$skia/bin" "$skia/third_party/ninja"
          unzip -o -q "$tmp/gn.zip" gn.exe -d "$skia/bin"
          unzip -o -q "$tmp/ninja.zip" ninja.exe -d "$skia/third_party/ninja"
          gn="$skia/bin/gn.exe"
          ninja="$skia/third_party/ninja/ninja.exe"
          test -x "$gn"
          test -x "$ninja"
          [[ "$("$gn" --version)" == "2175 (b2afae"* ]]
          "$ninja" --version
          printf 'gn=%s\n' "$gn" >> "$GITHUB_OUTPUT"
          printf 'ninja=%s\n' "$ninja" >> "$GITHUB_OUTPUT"

      - name: 'Configure'
        run: >
          bash configure
          --with-conf-name=${{ inputs.platform }}
          ${{ matrix.flags }}
          --with-version-opt=${GITHUB_ACTOR}-${GITHUB_SHA}
          --with-boot-jdk=${{ steps.bootjdk.outputs.path }}
          --with-jtreg=${{ steps.jtreg.outputs.path }}
          --with-gtest=${{ steps.gtest.outputs.path }}
          --with-msvc-toolset-version=${{ inputs.msvc-toolset-version }}
          --with-skia=bundled
          --with-gn=${{ steps.skia-tools.outputs.gn }}
          --with-ninja=${{ steps.skia-tools.outputs.ninja }}
          --with-jmod-compress=zip-1
          ${{ inputs.extra-conf-options }} ${{ inputs.configure-arguments }} || (
          echo "Dumping config.log:" &&
          cat config.log &&
          exit 1)
        env:
          # We need a minimal PATH on Windows
          # Set PATH to "", so just GITHUB_PATH is included
          PATH: ''
        shell: env /usr/bin/bash --login -eo pipefail {0}

      - name: 'Build'
        id: build
        uses: ./.github/actions/do-build
        with:
          make-target: '${{ inputs.make-target }} ${{ inputs.make-arguments }}'
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'

      - name: 'Upload bundles'
        uses: ./.github/actions/upload-bundles
        with:
          platform: ${{ inputs.platform }}
          debug-suffix: '${{ matrix.suffix }}'
