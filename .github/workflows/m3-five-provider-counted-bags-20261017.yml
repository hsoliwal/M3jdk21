# SPDX-License-Identifier: Apache-2.0
name: M3 five-provider counted bags and typed class map Java JNI
on:
  pull_request:
    paths:
      - "m3/collections/interop/src/main/java/com/m3/collections/interop/M3EclipseBag*.java"
      - "m3/collections/interop/src/main/java/com/m3/collections/interop/M3GuavaClassToInstanceMaps.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3EclipseBag*Test.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3GuavaClassToInstanceMaps*Test.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveProviderBagContractTest.java"
      - "m3/collections/interop/qualification/m3-five-provider-counted-bags-20261017/**"
      - ".github/workflows/m3-five-provider-counted-bags-20261017.yml"
  push:
    branches: [m3/five-provider-counted-class-receiver-20261017]
permissions:
  contents: read
jobs:
  source-recipe-provider-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fail-closed exact source and owner preflight
        shell: bash
        run: |
          set -euxo pipefail
          python3 -S m3/collections/interop/qualification/m3-five-provider-counted-bags-20261017/verify.py
      - name: Actual Maven/OpenRewrite AST emission, fixed point and refusal suite
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/qualification/m3-five-provider-counted-bags-20261017/recipe/pom.xml \
            -Dm3.engine.sources="$PWD/m3/tooling/migration-recipes/src/main/java" test
      - name: Strict actual current core compilation and Maven install
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/core proof/native
          find m3/collections/src/main/java -name '*.java' | sort > proof/core-sources.txt
          javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/core @proof/core-sources.txt
          jar --create --file proof/m3-collections.jar -C proof/core .
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$PWD/proof/m3-collections.jar" -DgroupId=com.m3 \
            -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT \
            -Dpackaging=jar -DgeneratePom=true
      - name: Real five provider dependencies, Eclipse Bag and Guava ClassToInstance contract tests
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            '-Dtest=M3EclipseBagMultimapTest,M3GuavaClassToInstanceMapsTest,M3FiveProviderBagContractTest' test
          python3 -S m3/collections/interop/qualification/m3-five-provider-counted-bags-20261017/verify.py
          git diff --exit-code
      - name: Revalidate unchanged native C17 bulk-index mask JNI
        shell: bash
        run: |
          set -euxo pipefail
          javac --release 21 -proc:none -h proof/native -cp proof/core -d proof/core \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror -pedantic \
            -fPIC -shared -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          javac --release 21 -proc:none -cp proof/core -d proof/core \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/core \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
          git diff --exit-code
      - name: Preserve real results and failed-gate diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-five-provider-counted-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/interop/qualification/m3-five-provider-counted-bags-20261017/recipe/target/surefire-reports/
            m3/collections/interop/target/surefire-reports/
