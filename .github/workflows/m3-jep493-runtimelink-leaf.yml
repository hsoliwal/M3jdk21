name: M3 JEP 493 runtime-link leaf proof

on:
  push:
    branches:
      - "m3/recover-jep493-runtimelink-leaf-20261006"
  pull_request:
    paths:
      - "m3/backports/recipes/jep-493-runtime-image/**"
      - "m3/tooling/migration-recipes/**"
      - "src/jdk.jlink/share/classes/jdk/tools/jlink/internal/JRTArchive.java"
      - "src/jdk.jlink/share/classes/jdk/tools/jlink/internal/LinkableRuntimeImage.java"
      - "src/jdk.jlink/share/classes/jdk/tools/jlink/internal/runtimelink/**"
      - ".github/workflows/m3-jep493-runtimelink-leaf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Diff hygiene
        run: git diff --check
      - name: Prove exact source-sealed leaf and scope
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3Jep493RuntimeLinkLeafRecipeTest,M3RecipeScopeDeclarationTest test

  jlink-compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Install OpenJDK build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
      - name: Configure
        run: |
          set -euo pipefail
          bash configure --with-boot-jdk="$JAVA_HOME"             --with-debug-level=release --with-jvm-variants=server             --disable-warnings-as-errors
      - name: Compile jdk.jlink
        run: |
          set -euo pipefail
          make JOBS=2 jdk.jlink
