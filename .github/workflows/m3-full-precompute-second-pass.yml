# SPDX-License-Identifier: Apache-2.0
name: M3 Full Precompute Second Pass

on:
  pull_request:
    paths:
      - 'm3/ports/precompute/**'
      - 'doc/m3/M3JDK21_PORTING_INVARIANT.md'
      - 'doc/m3/name-mapping.json'
      - 'doc/m3/*precompute*.tsv'
      - 'make/m3/tooling/migration-recipes/src/main/java/jdk/m3/rewrite/backport/M3Jdk21HashPinnedSnapshotRecipe.java'
      - 'make/m3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/backport/M3Jdk21HashPinnedSnapshotRecipeNameTest.java'
      - 'make/m3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/backport/M3FullPrecomputeSecondPassRecipeTest.java'
      - 'make/m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-full-precompute-second-pass.yml'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/**'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text/**'
      - '.github/workflows/m3-full-precompute-second-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diff and mapping syntax
        run: |
          set -euo pipefail
          git diff --check
          python3 -m json.tool doc/m3/name-mapping.json >/dev/null

      - name: Java precompute differential proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml test

      - name: Java JNI and native C parity proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative test

      - name: Install the source-built OpenRewrite/JUnit dependency closure
        run: |
          mvn -B -ntp -f m3/vendor/third_party/pom.xml -pl :rewrite-core,:rewrite-java,:rewrite-java-21,:rewrite-test,:junit-jupiter,junit-platform-launcher-1.10.2 -am -Dmaven.test.skip=true install
          mvn -B -ntp -f m3/m3-import/pure-int-recipe-custody/pom.xml -DskipTests install

      - name: Recipe engine and crate fixed point
        run: |
          mvn -B -ntp -f make/m3/tooling/migration-recipes/pom.xml -Dtest=M3Jdk21HashPinnedSnapshotRecipeNameTest,M3FullPrecomputeSecondPassRecipeTest test
