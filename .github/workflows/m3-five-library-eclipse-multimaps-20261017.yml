# SPDX-License-Identifier: Apache-2.0
name: M3 five-library Eclipse multimap receiver
on:
  pull_request:
    paths:
      - "m3/collections/interop/src/main/java/com/m3/collections/interop/M3Eclipse*Multimap.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3Eclipse*Multimap*Test.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryInteropContractTest.java"
      - "m3/collections/interop/qualification/m3-five-eclipse-multimaps-20261017/**"
      - ".github/workflows/m3-five-library-eclipse-multimaps-20261017.yml"
  push:
    branches: [m3/five-library-eclipse-multimaps-receiver-20261017]
permissions:
  contents: read
jobs:
  recipe-provider-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Exact source and immutable M3 owner receipt
        shell: bash
        run: |
          set -euxo pipefail
          python3 -S m3/collections/interop/qualification/m3-five-eclipse-multimaps-20261017/verify.py
      - name: Actual Maven/OpenRewrite Java-LST recipe and fixed point
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/qualification/m3-five-eclipse-multimaps-20261017/recipe/pom.xml \
            -Dm3.engine.sources="$PWD/m3/tooling/migration-recipes/src/main/java" test
      - name: Compile real current M3 core and install separately built SDK owner
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z \
            | xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Real all-five-library provider interfaces and 6000 Eclipse seeded operations
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3EclipseMultimapTest,M3FiveLibraryInteropContractTest test
          # The compiled class files and Maven dependencies must be actual official
          # provider jars; neither the recipe nor tests create test-only API stubs.
          python3 -S m3/collections/interop/qualification/m3-five-eclipse-multimaps-20261017/verify.py
      - name: Unchanged C17 JNI mask ABI, checked actual native regression
        shell: bash
        run: |
          set -euxo pipefail
          javac --release 21 -proc:none -h proof/native -cp proof/classes \
            -d proof/classes m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror -pedantic -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          javac --release 21 -proc:none -cp proof/classes -d proof/classes \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
          git diff --exit-code
      - name: Retain actual source and proof logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-five-library-eclipse-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            m3/collections/interop/qualification/m3-five-eclipse-multimaps-20261017/recipe/target/surefire-reports/
            m3/collections/interop/target/surefire-reports/
            proof/
