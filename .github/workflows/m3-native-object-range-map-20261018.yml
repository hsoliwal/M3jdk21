name: M3 Native Object RangeMap Java JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectRangeMap.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ObjectRangeMap*'
      - 'm3/collections/qualification/m3-native-object-range-map-20261018/**'
      - '.github/workflows/m3-native-object-range-map-20261018.yml'
  workflow_dispatch:
jobs:
  real-object-m3-java-jni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail closed on noncanonical generated source
        run: python3 m3/collections/qualification/m3-native-object-range-map-20261018/verify.py
      - name: Strict Java21 source compilation against real M3 slot/mask owners
        run: |
          mkdir -p "$RUNNER_TEMP/classes"
          javac --release 21 -proc:none -Xlint:all,-serial,-processing,-module -Werror \
            -sourcepath m3/collections/src/main/java:m3/collections/src/test/java \
            -d "$RUNNER_TEMP/classes" \
            m3/collections/src/main/java/com/m3/collections/M3ObjectRangeMap.java \
            m3/collections/src/main/java/com/m3/collections/M3SlotArrays.java \
            m3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/test/java/com/m3/collections/M3ObjectRangeMapSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3ObjectRangeMapNativeProof.java
      - name: Actual M3 Java owner reference-ranged differential corpus
        run: |
          java -cp "$RUNNER_TEMP/classes" com.m3.collections.M3ObjectRangeMapSelfTest
          java -Xint -cp "$RUNNER_TEMP/classes" com.m3.collections.M3ObjectRangeMapSelfTest
      - name: Compile incumbent C17 full32 state path mask JNI
        run: |
          JDK_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          gcc -std=c17 -fPIC -shared -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JDK_HOME/include" -I"$JDK_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
      - name: Actual JNI 32-bit selection and Java reference identity parity
        run: |
          java -Xcheck:jni -Djava.library.path="$RUNNER_TEMP" -cp "$RUNNER_TEMP/classes" \
            com.m3.collections.M3ObjectRangeMapNativeProof --native
          java -Xcheck:jni -Xint -Djava.library.path="$RUNNER_TEMP" -cp "$RUNNER_TEMP/classes" \
            com.m3.collections.M3ObjectRangeMapNativeProof --native
      - name: Maven owning M3 JUnit compatibility
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3ObjectRangeMapTest test
