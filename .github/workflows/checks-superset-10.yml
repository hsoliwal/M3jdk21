# SPDX-License-Identifier: Apache-2.0
# Checks superset 10: generated by .github/checks-superset/generate.py from filters.json and the member
# workflow files, which stay the source of truth for every member job below. Do not edit by hand: edit the
# member file, then run  python3 .github/checks-superset/generate.py build
name: 'Checks superset 10'

on:
  push:
    paths: [".github/workflows/m3-file-build-impact-20261020.yml", ".github/workflows/m3-file-delta-20261020.yml", ".github/workflows/m3-native-shadow-stream-progress-20261020.yml", ".github/workflows/m3-semantic-census-20261101.yml", ".github/workflows/m3-tooling-atom-jit-gate-20261106.yml", ".github/workflows/m3jdk21-jni-declaration-projection-20261101.yml", ".github/workflows/m3jdk21-jni-export-join-20261101.yml", "m3/file/**", "m3/tooling/atom-census/**", "m3/tooling/atom-jit-gate/**", "src/jdk.m3.collections/**"]
  pull_request:
    paths: [".github/workflows/m3-file-build-impact-20261020.yml", ".github/workflows/m3-file-delta-20261020.yml", ".github/workflows/m3-native-shadow-stream-progress-20261020.yml", ".github/workflows/m3-semantic-census-20261101.yml", ".github/workflows/m3-tooling-atom-jit-gate-20261106.yml", ".github/workflows/m3jdk21-jni-declaration-projection-20261101.yml", ".github/workflows/m3jdk21-jni-export-join-20261101.yml", "m3/file/**", "m3/tooling/atom-census/**", "m3/tooling/atom-jit-gate/**", "src/jdk.m3.collections/**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: 'Superset gate'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 'Check out the gate files'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/checks-superset
          fetch-depth: 1
          filter: blob:none
      - name: 'Decide member workflows from triggers, branches and changed paths (plain git)'
        id: gate
        run: python3 .github/checks-superset/gate.py 10

  m3-file-build-impact-20261020__array-graph-contract:
    name: "M3File reverse impact Java21 / array-graph-contract"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-file-build-impact-20261020'] }}"
    concurrency:
      group: "M3File reverse impact Java21-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Full M3File module and source/binary reverse impact contracts
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/m3-file-impact-dependencies"
          bash m3/file/compile-dependencies.sh "$JAVA_HOME" "$deps"
          python3 m3/file/verify.py --java-home "$JAVA_HOME" --module-path "$deps" --output "$RUNNER_TEMP/m3-file-impact-suite"

  m3-file-delta-20261020__source-class-delta-and-impact:
    name: "M3File native delta and build-impact Java21 / source-class-delta-and-impact"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-file-delta-20261020'] }}"
    concurrency:
      group: "M3File native delta and build-impact Java21-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and verify original M3File module plus all contract oracles
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/m3-file-delta-dependencies"
          bash m3/file/compile-dependencies.sh "$JAVA_HOME" "$deps"
          python3 m3/file/verify.py --java-home "$JAVA_HOME" --module-path "$deps" --output "$RUNNER_TEMP/m3-file-delta-suite"

  m3-native-shadow-stream-progress-20261020__original-m3file-io-contract:
    name: "M3JDK21 single-source layered shadow I/O / original-m3file-io-contract"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-native-shadow-stream-progress-20261020'] }}"
    concurrency:
      group: "M3JDK21 single-source layered shadow I/O-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source-bound file workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          bash -n m3/file/compile-dependencies.sh
          python3 -m py_compile m3/file/verify.py m3/file/test_workflow_wiring.py
          python3 -m unittest discover -s m3/file -p test_workflow_wiring.py -v
      - name: Compile original M3File module and run exact normal/interpreted shadow contracts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-native-shadow"
          deps="$RUNNER_TEMP/m3-native-shadow-dependencies"
          bash m3/file/compile-dependencies.sh "$JAVA_HOME" "$deps"
          mkdir -p "$out/classes" "$out/jmods"
          find m3/file/src/main/java -type f -name '*.java' -print0 \
            | LC_ALL=C sort -z > "$out/file.sources"
          mapfile -d '' -t sources < "$out/file.sources"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            --module-path "$deps" -d "$out/classes" "${sources[@]}" \
            m3/file/src/test/java/jdk/m3/file/M3ShadowStreamsContract.java
          java --module-path "$out/classes:$deps" \
            -m org.m3jdk.file/jdk.m3.file.M3ShadowStreamsContract
          java -Xint --module-path "$out/classes:$deps" \
            -m org.m3jdk.file/jdk.m3.file.M3ShadowStreamsContract
          jmod create --class-path "$out/classes" "$out/jmods/org.m3jdk.file.jmod"
          jlink --module-path "$JAVA_HOME/jmods:$deps:$out/jmods" \
            --add-modules org.m3jdk.file --output "$out/image"
          "$out/image/bin/java" \
            -m org.m3jdk.file/jdk.m3.file.M3ShadowStreamsContract
          "$out/image/bin/java" -Xint \
            -m org.m3jdk.file/jdk.m3.file.M3ShadowStreamsContract

  m3-semantic-census-20261101__semantic-census:
    name: "M3JDK21 semantic atom census Java21 and Maven admission / semantic-census"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-semantic-census-20261101'] }}"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit exact source SHA256 postimages and unchanged ABI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          receipt=json.loads(Path('m3/tooling/atom-census/contract/M3_SEMANTIC_CENSUS_V2_RECEIPT.json').read_text())
          if receipt['external_api_changed'] or receipt['jni_abi_changed']:
              raise SystemExit('REFUSED: ABI unlock')
          for key in ('source_change','test_change'):
              row=receipt[key]
              path=Path(row['path'])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('REFUSED: missing or linked postimage '+str(path))
              sha=hashlib.sha256(path.read_bytes()).hexdigest()
              if sha!=row['post_sha256']:
                  raise SystemExit('REFUSED: postimage drift '+str(path))
          print('M3_SEMANTIC_CENSUS_V2_SOURCE_SEALS_PASS')
          PY
      - name: Strict Java21 source compile and 154 executed assertions
        shell: bash
        run: |
          set -euo pipefail
          root=m3/tooling/atom-census
          mkdir -p "$RUNNER_TEMP/m3-semantic"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-semantic" \
            "$root/src/main/java/jdk/m3/tooling/atoms/contract/AtomKind.java" \
            "$root/src/main/java/jdk/m3/tooling/atoms/AtomCensus.java" \
            "$root/src/test/java/jdk/m3/tooling/atoms/AtomCensusSemanticSelfTest.java"
          java -cp "$RUNNER_TEMP/m3-semantic" jdk.m3.tooling.atoms.AtomCensusSemanticSelfTest \
            | tee "$RUNNER_TEMP/m3-semantic.log"
          grep -q $'M3_SEMANTIC_CENSUS_PROOF\tchecks=154\tstatus=PASS' "$RUNNER_TEMP/m3-semantic.log"
      - name: Verify canonical atom contract and fail-closed admission
        shell: bash
        run: |
          set -euo pipefail
          bash m3/tooling/atom-census/verify-contract.sh
      - name: Execute actual JUnit tests in M3JDK21 atom census module
        shell: bash
        run: mvn -B -ntp -f m3/tooling/atom-census/pom.xml clean test
      - name: Require Surefire cases without failure or skip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=Path('m3/tooling/atom-census/target/surefire-reports')
          files=sorted(reports.glob('TEST-*.xml'))
          if not files: raise SystemExit('HOLD: no JUnit XML')
          count=0
          for path in files:
              if path.is_symlink() or path.stat().st_size>2*1024*1024:
                  raise SystemExit('HOLD: unsafe XML')
              raw=path.read_bytes()
              if b'<!DOCTYPE' in raw.upper() or b'<!ENTITY' in raw.upper():
                  raise SystemExit('HOLD: XML entity')
              suite=ET.fromstring(raw)
              if suite.tag!='testsuite': raise SystemExit('HOLD: suite')
              for attr in ('errors','failures','skipped'):
                  if int(suite.get(attr,'-1'))!=0: raise SystemExit('HOLD: '+attr)
              cases=suite.findall('testcase')
              if len(cases)!=int(suite.get('tests','-1')):
                  raise SystemExit('HOLD: nested/hidden testcase')
              count+=len(cases)
          if count<4: raise SystemExit('HOLD: mandatory atom tests absent')
          print('M3_SEMANTIC_CENSUS_JUNIT_PASS',count)
          PY
      - name: Explicit product hold
        run: echo 'TOOLING_CI_DOES_NOT_PROVE_FULL_JDK21_JTREG_C1_C2_JNI_ABI_CROSS_PLATFORM'

  m3-tooling-atom-jit-gate-20261106__atom-jit-gate:
    name: "M3JDK21 per-atom JIT retest gate (tooling) / atom-jit-gate"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-tooling-atom-jit-gate-20261106'] }}"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install the atom census the gate atomizes with
        run: mvn -B -ntp -q -f m3/tooling/atom-census/pom.xml -DskipTests install
      - name: Package the gate (-Xlint:all -Werror) and run its JUnit tests
        run: mvn -B -ntp -f m3/tooling/atom-jit-gate/pom.xml package
      - name: Fixture gate (javac -h, C17/C++20 JNI, nm exports, four JVM modes, negative control)
        shell: bash
        run: |
          set -euo pipefail
          gate=m3/tooling/atom-jit-gate/fixture-gate
          python3 -I "$gate/verify.py" --evidence "$RUNNER_TEMP/atom-jit-fixture" --timeout-seconds 120
          python3 -I "$gate/verify.py" --evidence "$RUNNER_TEMP/atom-jit-negative" --timeout-seconds 120 --negative-test
          (cd "$gate" && python3 -m unittest -q test_verify)
      - name: Explicit product hold
        run: echo 'TOOLING_CI_DOES_NOT_PROVE_FULL_JDK21_JTREG_IMAGE_C1_C2_JNI_ABI_CROSS_PLATFORM'

  m3jdk21-jni-declaration-projection-20261101__java21-jni-declaration:
    name: "M3JDK21 native JNI declaration projection Java21 / java21-jni-declaration"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-jni-declaration-projection-20261101'] }}"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Java21 strict compile and independent JNI source/header proof
        shell: bash
        run: bash m3/tooling/atom-census/verify-jni-projection.sh
      - name: Genuine module JUnit tests with full original semantic tests
        shell: bash
        run: mvn -B -ntp -f m3/tooling/atom-census/pom.xml clean test
      - name: Fail closed on absent or skipped JUnit XML
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('m3/tooling/atom-census/target/surefire-reports')
          reports=sorted(root.glob('TEST-*.xml'))
          if not reports: raise SystemExit('HOLD: missing JUnit XML results')
          tests=0
          for path in reports:
              if path.is_symlink() or path.stat().st_size>2*1024*1024: raise SystemExit('HOLD: invalid JUnit XML')
              blob=path.read_bytes()
              if b'<!DOCTYPE' in blob.upper() or b'<!ENTITY' in blob.upper(): raise SystemExit('HOLD: XML entity')
              suite=ET.fromstring(blob)
              for key in ('failures','errors','skipped'):
                  if int(suite.get(key,'-1'))!=0: raise SystemExit('HOLD: '+key)
              cases=suite.findall('testcase')
              if len(cases)!=int(suite.get('tests','-1')): raise SystemExit('HOLD: incomplete test count')
              tests+=len(cases)
          if tests<3: raise SystemExit('HOLD: missing required atom tests')
          print('M3_JNI_JUNIT_PASS', tests)
          PY
      - name: Reference tool proof is not installed-image ABI qualification
        run: echo 'HOLD_M3JDK21_SOURCE_BUILT_JNI_ABI_JIT_JTREG_JCK'

  m3jdk21-jni-export-join-20261101__source-bound-join:
    name: "M3JDK21 source-bound JNI declaration/export join / source-bound-join"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-jni-export-join-20261101'] }}"
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact SHA256 and receiver documentation custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          root=Path('m3/tooling/atom-census')
          receipt=json.loads((root/'contract/M3_JNI_EXPORT_JOIN_RECEIPT.json').read_text())
          assert receipt['schema']=='M3_JNI_EXPORT_JOIN_RECEIVER/1'
          required={
            'src/main/java/jdk/m3/tooling/atoms/JniExportJoin.java': 'b6aa82f5fb88cc93eddd5c3ba8e28667f68c903d92099ae6ace17719ee0bf7fc',
            'src/test/java/jdk/m3/tooling/atoms/JniExportJoinSelfTest.java': '3cb59a8a3c26d58cd12333affe5a3c586e204836305d693342bfcaf7be193720',
            'src/test/java/jdk/m3/tooling/atoms/JniExportJoinTest.java': '6c0a20e08a88e625428f3769652049882c33d132b4a67157bba239d96dd25275',
            'test-fixtures/jni-export-join/JniJoinRuntime.java': '6feda8e0868db0beccf0728c8606d1dbd46ee8618ede52f35444ceba2a61f4e6',
            'test-fixtures/jni-export-join/demo/pkg/Outer.java': '6b92a80fc03677194d100ea4f4038540abe5deed1fc3fde615c39a31de8906f4',
            'test-fixtures/jni-export-join/m3jni_export_join.c': '8ae1fa0283ddd70856b049450418d487e3d2cfe661bd6942243502bb11d970f5',
            'verify-jni-export-join.sh': '7b39603b8309bf41d8d411f23b0f7577bdd28e57b7ffb445efba5f22821f83e9',
            'contract/JNI_EXPORT_JOIN_V1.md': '2ddbcbbdbcac089699ce258c057e0c8cdc925823dc9fd56f844ef8dabb65bfb9',
          }
          for name,expected in required.items():
              path=root/name
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('SOURCE_REQUIRED_MISSING_OR_LINKED '+name)
              actual=hashlib.sha256(path.read_bytes()).hexdigest()
              if actual!=expected:raise SystemExit('SOURCE_DRIFT '+name)
          print('M3_JNI_SOURCE_SHA256_PASS files='+str(len(required)))
          PY
      - name: Java21 strict compile, 28 JNI source/header checks, GCC and Clang Xcheck:jni
        shell: bash
        run: bash m3/tooling/atom-census/verify-jni-export-join.sh
      - name: Real JUnit / Surefire in the existing atom census Maven owner
        shell: bash
        run: mvn -B -ntp -f m3/tooling/atom-census/pom.xml -Dtest=JniExportJoinTest test
      - name: Preserve product qualification hold
        run: echo 'TESTED_JAVA21_TOOL_NOT_SOURCE_BUILT_M3JDK21_ABI_JTREG_JCK'
