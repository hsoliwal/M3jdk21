name: M3 TornadoVM Installed Image Device Parity

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  physical-gpu-parity:
    runs-on: [self-hosted, linux, tornadovm-gpu]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and seal the existing source-owned JUnit test support
        run: >-
          python3 -B m3/runtime-integration/tornado/build_junit_support.py
          --repo-root "$GITHUB_WORKSPACE"
          --jdk-home "$JAVA_HOME" --maven "$(command -v mvn)"
          --maven-repo "$HOME/.m2/repository"
          --out "$RUNNER_TEMP/m3-tornado-gpu-junit" --resolve-build-tools
      - name: Build in-tree compiler, runtime and provider, then require device parity
        run: >-
          bash m3/build-tornado.sh
          --jdk-home "$JAVA_HOME" --maven "$(command -v mvn)"
          --maven-repo "$HOME/.m2/repository"
          --junit-lock "$RUNNER_TEMP/m3-tornado-gpu-junit/JUNIT_LOCK.json"
          --backend opencl --out "$RUNNER_TEMP/m3-tornado-gpu-proof"
          --allow-bootstrap-jdk --require-gpu --resolve-build-tools --phase all
      # This hosted/bootstrap toolchain lane is a device qualification result.
      # Matched M3JDK21 release admission additionally requires --m3-jdk-receipt.
      - name: Preserve device identity, parity and installed-image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-tornado-gpu-proof
          path: |
            ${{ runner.temp }}/m3-tornado-gpu-proof
            ${{ runner.temp }}/m3-tornado-gpu-junit
          if-no-files-found: error
