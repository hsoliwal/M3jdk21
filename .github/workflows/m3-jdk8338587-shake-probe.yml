name: M3 SHAKE workflow probe

on:
  push:
    branches:
      - 'm3/jdk8338587-shake-*'
  pull_request:
    paths:
      - '.github/workflows/m3-jdk8338587-shake-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: echo SHAKE_WORKFLOW_PROBE_OK
