# SPDX-License-Identifier: Apache-2.0
# Composes the already qualified hosted storage/toolchain lane; model-only qualification.
name: M3 source-qualified TQ reactor model
on:
  pull_request:
    paths:
      - '.github/workflows/m3-source-qualified-tq-model.yml'
      - 'm3/vendor/third_party/**/pom.xml'
      - 'm3/vendor/third_party/pom.xml'
      - 'm3/tooling/tq-sync/pom.xml'
      - 'm3/tooling/tq-sync/source-reactor/**'
permissions:
  contents: read
jobs:
  source-qualified-tq-model:
    name: Offline Maven selection and refusal contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Reserve storage and select existing toolchains
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-source-qualified-tq-model-source
          TMPDIR: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/data
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os,pathlib,re
          reserve,cap=8*1024**3,512*1024**2
          for key in ("RUNNER_TEMP","GITHUB_WORKSPACE"):
              base=pathlib.Path(os.environ[key])
              if not base.is_dir() or any(p.is_symlink() for p in [base,*base.parents]):raise SystemExit("redirected/missing runner storage")
              st=os.statvfs(base)
              if st.f_bavail*st.f_frsize<reserve+cap:raise SystemExit("HOLD_STORAGE 8GiB after512MiB")
          root=pathlib.Path(os.environ["M3_PROOF_ROOT"]);source=pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          if root.exists() or source.exists():raise SystemExit("owned output paths must be fresh")
          cache=pathlib.Path(os.environ["RUNNER_TOOL_CACHE"])
          javas=[]
          for version in (cache/"Java_Temurin-Hotspot_jdk").glob("21.*"):
              home=version/"x64"
              if re.fullmatch(r"21\.\d+\.\d+-\d+(?:\.\d+)*",version.name) and (version/"x64.complete").is_file() and all(os.access(home/"bin"/name,os.X_OK) for name in ("java","javac")):javas.append(home)
          pythons=[]
          for version in (cache/"Python").glob("3.12.*"):
              home=version/"x64";python=home/"bin/python3.12"
              if re.fullmatch(r"3\.12\.\d+",version.name) and (version/"x64.complete").is_file() and os.access(python,os.X_OK) and (home/"lib/python3.12/venv/__init__.py").is_file() and (home/"lib/python3.12/ensurepip/__init__.py").is_file():pythons.append(python)
          if not javas or not pythons:raise SystemExit("HOLD_TOOLCHAIN preinstalled JDK21/CPython3.12 required; no setup/download fallback")
          java=sorted(javas)[-1].resolve();python=sorted(pythons)[-1].resolve()
          for directory in ("home/.m2","m2","tmp","cache","config","data"):(root/directory).mkdir(parents=True,exist_ok=False)
          settings='<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"/>\n'
          for name in ("settings.xml","global-settings.xml"):(root/"home/.m2"/name).write_text(settings,encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("java="+str(java)+"\npython="+str(python)+"\npython-bin="+str(python.parent)+"\n")

          PY
      - name: Narrow exact-head checkout
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-source-qualified-tq-model-source
          TMPDIR: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3-source-qualified-tq-model-source
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/m3-source-qualified-tq-model.yml
            /m3/vendor/third_party/pom.xml
            /m3/vendor/third_party/*/pom.xml
            /m3/tooling/tq-sync/pom.xml
            /m3/tooling/tq-sync/source-reactor/
      - name: Qualify actual offline Maven model under storage supervision
        shell: bash
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-source-qualified-tq-model-source
          TMPDIR: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/data
          M3_JAVA_HOME: ${{ steps.preflight.outputs.java }}
          M3_PYTHON: ${{ steps.preflight.outputs.python }}
          M3_PYTHON_BIN: ${{ steps.preflight.outputs.python-bin }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_OPTIONAL_LOCKS: '0'
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,signal,subprocess,time
          reserve,cap=8*1024**3,512*1024**2
          root=pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source=pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          start=time.monotonic()
          def traversal_error(error):raise RuntimeError("storage census failed") from error
          def gate(limit=480*1024**2):
              used=0
              for base in (pathlib.Path(os.environ["RUNNER_TEMP"]),source):
                  if not base.is_dir() or base.is_symlink():raise RuntimeError("missing/redirected storage")
                  for folder,names,files in os.walk(base,followlinks=False,onerror=traversal_error):
                      for name in names+files:
                          try:info=os.lstat(pathlib.Path(folder)/name)
                          except FileNotFoundError:continue
                          used+=max(info.st_size,info.st_blocks*512)
              if used>limit:raise RuntimeError("512MiB aggregate task limit (32MiB artifact reserve)")
              for base in (root,source):
                  st=os.statvfs(base)
                  if st.f_bavail*st.f_frsize<reserve+cap-used:raise RuntimeError("8GiB-after-output reserve")
              return used
          def getgit(*args):
              return subprocess.check_output(["git",*args],cwd=source,text=True,timeout=15).strip()
          gate()
          head=getgit("rev-parse","HEAD")
          if head!=os.environ["EXPECTED_SOURCE_SHA"] or not re.fullmatch("[0-9a-f]{40}",head):raise RuntimeError("checkout is not exact candidate head")
          env=os.environ.copy()
          for name in list(env):
              if name in ("GITHUB_TOKEN","GH_TOKEN") or name.startswith(("PIP_","PYTHON","MAVEN_","JAVA_TOOL_OPTIONS","JDK_JAVA_OPTIONS")):env.pop(name,None)
          env.update(HOME=str(root/"home"),USERPROFILE=str(root/"home"),MAVEN_USER_HOME=str(root/"home/.m2"),TMPDIR=str(root/"tmp"),TEMP=str(root/"tmp"),TMP=str(root/"tmp"),JAVA_HOME=os.environ["M3_JAVA_HOME"],PATH=os.environ["M3_PYTHON_BIN"]+os.pathsep+os.environ["M3_JAVA_HOME"]+"/bin"+os.pathsep+env["PATH"],MAVEN_OPTS="-Xmx512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir="+str(root/"tmp")+" -Duser.home="+str(root/"home"),JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -Djava.io.tmpdir="+str(root/"tmp")+" -Duser.home="+str(root/"home")+" -XX:+PerfDisableSharedMem",PIP_CONFIG_FILE=os.devnull,PIP_DISABLE_PIP_VERSION_CHECK="1",PIP_NO_CACHE_DIR="1",PYTHONDONTWRITEBYTECODE="1",GIT_OPTIONAL_LOCKS="0",GIT_NO_LAZY_FETCH="1",GIT_TERMINAL_PROMPT="0")
          records=[]
          log=root/"qualification.log"
          def cleanup(child):
              # Every descendant inherits this owned session; bootstrap creates no nested sessions.
              for sig,seconds in ((signal.SIGTERM,2),(signal.SIGKILL,3)):
                  try:os.killpg(child.pid,sig)
                  except ProcessLookupError:pass
                  end=time.monotonic()+seconds
                  while time.monotonic()<end:
                      try:os.killpg(child.pid,0)
                      except ProcessLookupError:return
                      time.sleep(.05)
              raise RuntimeError("owned process group terminal state unproved")
          def run(name,command,deadline=300):
              if time.monotonic()-start>720:raise RuntimeError("global deadline before launch")
              gate()
              child=None;code=None
              with log.open("ab") as out:
                  try:
                      child=subprocess.Popen(command,cwd=source,env=env,stdin=subprocess.DEVNULL,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)
                      command_start=time.monotonic()
                      while child.poll() is None:
                          gate()
                          if time.monotonic()-command_start>deadline or time.monotonic()-start>720:raise RuntimeError("owned command deadline")
                          time.sleep(.5)
                      code=child.wait()
                      if time.monotonic()-start>720:raise RuntimeError("global deadline after child exit")
                  finally:
                      if child is not None:
                          if child.poll() is None:
                              try:os.killpg(child.pid,signal.SIGTERM)
                              except ProcessLookupError:pass
                              try:child.wait(timeout=2)
                              except subprocess.TimeoutExpired:
                                  try:os.killpg(child.pid,signal.SIGKILL)
                                  except ProcessLookupError:pass
                                  child.wait(timeout=5)
                          cleanup(child)
                          records.append({"name":name,"returncode":child.returncode,"parentReaped":True,"ownedSessionAbsent":True})
              gate()
              if code:raise RuntimeError(name+" failed with "+str(code))
          py=[os.environ["M3_PYTHON"],"-I","-S","-B"]
          env["M3_QUALIFICATION_ROOT"]=str(root)
          try:
              run("actual-offline-maven-model-contract",py+[str(source/"m3/tooling/tq-sync/source-reactor/test_reactor.py")],deadline=300)
              receipt=json.loads((root/"model-receipt.json").read_bytes())
              if receipt["tests"]!=6 or receipt["failures"] or receipt["errors"] or receipt["skips"] or receipt["successful"] is not True:raise RuntimeError("nonzero exact six method qualification required")
              if any(receipt[key] is not False for key in ("compiled","tqJUnitQualified","originalModelQualified","runtimeJniQualified","matchedJdkQualified","phaseAdvanced")):raise RuntimeError("model-only scope drift")
              hosted={"schema":"M3_SOURCE_QUALIFIED_TQ_HOSTED_V1","checkoutCommit":head,"commands":records,"modelReceiptSha256":hashlib.sha256((root/"model-receipt.json").read_bytes()).hexdigest(),"mavenOffline":True,"aggregateBytes":gate(),"compiled":False,"phaseAdvanced":False}
              (root/"hosted-receipt.json").write_text(json.dumps(hosted,indent=2)+"\n",encoding="utf-8")
          finally:
              tail=b""
              if log.is_file() and not log.is_symlink():
                  with log.open("rb") as f:f.seek(max(0,log.stat().st_size-32768));tail=f.read(32768)
              before=gate(496*1024**2)
              selected=[root/"model-receipt.json",root/"hosted-receipt.json",root/"toolchain.log"]
              selected+=sorted(root.glob("selected57.log"))+sorted(root.glob("missing-*.log"))+sorted(root.glob("stale-producer.log"))
              selected=[p for p in selected if p.is_file()]
              if len(selected)>16 or any(p.is_symlink() for p in selected):raise RuntimeError("artifact source fence")
              planned=sum(p.stat().st_size for p in selected)+len(tail)
              if planned>1024**2 or before+planned+1024**2>496*1024**2:raise RuntimeError("artifact budget")
              bundle=root/"artifacts";bundle.mkdir(exist_ok=False)
              for path in selected:
                  gate(496*1024**2);shutil.copyfile(path,bundle/path.name)
              (bundle/"log-tail.txt").write_bytes(tail)
              (bundle/"commands.json").write_text(json.dumps(records,indent=2)+"\n",encoding="utf-8")
              print(tail.decode("utf-8",errors="replace"))
              print("Final aggregate bytes before artifact upload:",gate(496*1024**2))
          PY
      - name: Retain bounded Maven model receipts and failure tail
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-source-qualified-tq-model-source
          TMPDIR: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          if-no-files-found: error
