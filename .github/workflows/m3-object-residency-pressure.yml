# SPDX-License-Identifier: Apache-2.0
name: M3 object residency pressure contract

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectResidency.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3Residency.java'
      - 'm3/tooling/object-residency/**'
      - '.github/workflows/m3-object-residency-pressure.yml'
  push:
    branches: [master]
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectResidency.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3Residency.java'
      - 'm3/tooling/object-residency/**'
      - '.github/workflows/m3-object-residency-pressure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-xmx:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile parent-owned residency proof
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-residency-pressure"
          mkdir -p "$OUT"
          javac --release 21 -Xlint:all -Werror -d "$OUT" \
            m3/collections/src/main/java/com/m3/collections/M3ObjectResidency.java \
            m3/tooling/object-residency/M3ResidencyPressureProbe.java
      - name: Execute real small-Xmx LRU/recreation proof
        shell: bash
        run: |
          set -euo pipefail
          java -Xms8m -Xmx32m -cp "$RUNNER_TEMP/m3-residency-pressure" \
            com.m3.collections.verification.M3ResidencyPressureProbe
