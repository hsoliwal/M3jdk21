# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 owned StaticBucketMap arrays (candidate)
# Former triggers (below, as of the move) now start job(s) 'm3-static-bucket-array-20261114__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/collections/implementations/apache-static-bucket-map/**'
#         - '.github/workflows/m3-static-bucket-array-20261114.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owned-array-map-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Actual Maven compile, JUnit differential and package
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/implementations/apache-static-bucket-map/pom.xml clean verify
      - name: Preserve original Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-static-bucket-array-surefire
          path: m3/collections/implementations/apache-static-bucket-map/target/surefire-reports/
          if-no-files-found: warn
