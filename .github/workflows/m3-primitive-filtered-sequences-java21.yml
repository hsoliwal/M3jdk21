name: m3-primitive-filtered-sequences-java21
# Former triggers (below, as of the move) now start job(s) 'm3-primitive-filtered-sequences-java21__*' in
# .github/workflows/checks-superset-03.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Product-backed primitive filtered sequence contracts
        run: bash m3/collections/verification/primitive-filtered-sequences-20261017/verify.sh
