# SPDX-License-Identifier: Apache-2.0
name: M3 zero-key primitive collection admission
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IntHashSet.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IntIntHashMap.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IntLongHashMap.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ZeroSlotCapacity*'
      - 'm3/collections/verification/zero-slot-growth-20261017/**'
      - 'm3/collections/qualification/zero-slot-growth-20261017.tsv'
      - '.github/workflows/m3-zero-slot-growth-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact generated source, API descriptors and JDK differential
        run: python3 m3/collections/verification/zero-slot-growth-20261017/verify.py --root .
      - name: Check patch hygiene
        run: git diff --check HEAD^...HEAD
  module-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run owning collection-module JUnit (does not imply jtreg)
        run: ./mvnw -B -ntp -f m3/collections/pom.xml -Dtest=M3ZeroSlotCapacityTest test
