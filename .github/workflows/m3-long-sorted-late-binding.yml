name: M3 long sorted live lazy cursor
# Former triggers (below, as of the move) now start job(s) 'm3-long-sorted-late-binding__*' in
# .github/workflows/checks-superset-08.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongSortedViews.java'
#         - 'test/jdk/jdk/m3/collections/M3LongSortedLateBindingSelfTest.java'
#         - '.github/workflows/m3-long-sorted-late-binding.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sorted-view-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java21 primitive collection and sorted view contract
        shell: bash
        run: |
          set -euo pipefail
          classes="$(mktemp -d)"
          trap 'rm -rf "$classes"' EXIT
          root=src/jdk.m3.collections/share/classes/jdk/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror -d "$classes" \
            "$root/M3LongCollection.java" "$root/M3LongIterator.java" \
            "$root/M3LongSortedSet.java" "$root/M3LongFilteredView.java" \
            "$root/M3LongSortedViews.java" \
            test/jdk/jdk/m3/collections/M3LongSortedLateBindingSelfTest.java
          java -ea -cp "$classes" jdk.m3.collections.M3LongSortedLateBindingSelfTest
          java -Xint -ea -cp "$classes" jdk.m3.collections.M3LongSortedLateBindingSelfTest
          git diff --check
