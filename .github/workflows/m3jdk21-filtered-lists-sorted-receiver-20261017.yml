name: M3JDK21 filtered List and sorted interop source receiver
on:
  pull_request:
    paths:
      - '.github/workflows/m3jdk21-filtered-lists-sorted-receiver-20261017.yml'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3FilteredLists.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3FilteredLists*.java'
      - 'm3/collections/JDK_FAMILY_MAP.tsv'
      - 'm3/collections/name-mapping.json'
      - 'm3/collections/qualification/M3_FILTERED_LISTS_RECEIVING_20261017.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-seal-and-standalone-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact Synexia recipe postimages (nine files)
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '12bdc2271eee96fb0d24ec188cbcbe37d6c110bf3bb61682715f1af7d5984333' 'm3/collections/src/main/java/jdk/m3/collections/M3FilteredLists.java' | sha256sum -c -
          printf '%s  %s\n' '4e9fb51a3c6efabff5ec449b8ad1d8403be1e873dfa4b605143954414503b680' 'm3/collections/src/test/java/jdk/m3/collections/M3FilteredListsContract.java' | sha256sum -c -
          printf '%s  %s\n' '487f96596d4b9b5ba70abc8df3ac8168b89cf72fb7e8d1bdaf2b1b35f3b58876' 'm3/collections/src/test/java/jdk/m3/collections/M3FilteredListsEdges.java' | sha256sum -c -
          printf '%s  %s\n' '61a51411c54bfdd900ae8cf3541fae1585700ba9b07ac37c2d6f8fc7afb49c76' 'm3/collections/src/test/java/jdk/m3/collections/M3FilteredListsSortedInteropTest.java' | sha256sum -c -
          printf '%s  %s\n' '48bea47817b3417246cb57b87da288129329da4236cacd3b8474a4fa8c693a36' 'm3/collections/src/test/java/jdk/m3/collections/M3FilteredListsTest.java' | sha256sum -c -
          printf '%s  %s\n' 'a3a9b7d66ce32d7677f030e43fcde06c399a236b6deae7208cda0158a59e49db' 'm3/collections/src/test/java/jdk/m3/collections/M3FilteredListsWorkProof.java' | sha256sum -c -
          printf '%s  %s\n' 'e75547f2e579ad3c794ea4ef5839afb8b3419af978b971b9da64303c5f97fca5' 'm3/collections/JDK_FAMILY_MAP.tsv' | sha256sum -c -
          printf '%s  %s\n' '320f47e9a8381350cd641a3444119513e5fd32b961369c98338846d7735d03f4' 'm3/collections/name-mapping.json' | sha256sum -c -
          printf '%s  %s\n' 'd28c495a49aea2bb1c1a17376632a610f04da9bcd8214421dd7bb7d982dfb3c0' 'm3/collections/qualification/M3_FILTERED_LISTS_RECEIVING_20261017.md' | sha256sum -c -
          echo 'M3_FILTERED_LIST_RECEIVER_SOURCE_SEAL_PASS targets=9'
      - name: Compile real filtered List donor and run three Java21 standalone proof suites
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          root=m3/collections/src
          javac --release 21 -proc:none -Xlint:all -Werror -d "$dir" \
            "$root/main/java/jdk/m3/collections/M3FilteredLists.java" \
            "$root/test/java/jdk/m3/collections/M3FilteredListsContract.java" \
            "$root/test/java/jdk/m3/collections/M3FilteredListsEdges.java" \
            "$root/test/java/jdk/m3/collections/M3FilteredListsWorkProof.java"
          java -ea -Xmx384m -cp "$dir" jdk.m3.collections.M3FilteredListsContract
          java -ea -Xmx384m -cp "$dir" jdk.m3.collections.M3FilteredListsEdges
          java -ea -Xmx384m -cp "$dir" jdk.m3.collections.M3FilteredListsWorkProof
          java -Xint -ea -Xmx384m -cp "$dir" jdk.m3.collections.M3FilteredListsEdges
          javap -classpath "$dir" jdk.m3.collections.M3FilteredLists | grep -F 'readOnlyFiltered'
          git diff --check HEAD^ HEAD
  maven-junit-module-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Real M3 collections module compilation and both JUnit suites
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3FilteredListsTest,M3FilteredListsSortedInteropTest test
          test -s m3/collections/target/surefire-reports/jdk.m3.collections.M3FilteredListsTest.txt
          test -s m3/collections/target/surefire-reports/jdk.m3.collections.M3FilteredListsSortedInteropTest.txt
