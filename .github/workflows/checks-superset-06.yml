              run("manifest-reports",py+[str(lanes["manifest"]/"verify.py"),"--reports"],deadline=90)
              run("sdk-report",py+[str(qualifier),"report"],deadline=90)
              run("authority-report",py+[str(authority/"qualify.py"),"report"],deadline=120)
              commands_expected=["binding","authority-binding","toolchain","sdk-inputs","scope-inputs","manifest-inputs","sdk-maven","sdk-reports","scope-maven","scope-reports","manifest-maven","manifest-reports","sdk-report","authority-report"]
              if [r["name"] for r in records]!=commands_expected or any(r["returncode"]!=0 or not r["parentReaped"] or not r["ownedSessionAbsent"] for r in records):raise RuntimeError("fourteen exact successful owned commands required")
              authority_receipt=json.loads((bundle/"authority-qualification-receipt.json").read_bytes())
              if authority_receipt["recipeSdksQualified"] is not True or authority_receipt["sourceOnly"] is not True or authority_receipt["artifactMembers"]!=46:raise RuntimeError("actual two-SDK source qualification required")
              for key in ("originalReceivingMavenModelQualified","canonicalModuleQualified","fullMatchedJdkQualified","windowsQualified","performanceRetentionQualified","productTargetApplied","runtimeApplied","phaseAdvanced","promotionAuthority"):
                  if authority_receipt[key] is not False:raise RuntimeError("authority source SDK scope drift")
              receipt=json.loads((bundle/"qualification-receipt.json").read_bytes())
              if receipt["sdkRecipeJUnitQualified"] is not True or receipt["knownOwnerSourceReplayQualified"] is not True:raise RuntimeError("actual recipe and exact known owner proof required")
              for key in ("originalPrivateModelQualified","stringDispatchQualified","fullNativeTargetQualified","windowsQualified","fullMatchedJdkQualified","performanceRetentionQualified","productTargetApplied","phaseAdvanced"):
                  if receipt[key] is not False:raise RuntimeError("source SDK scope drift")
              hosted={"schema":"M3_HASH_PINNED_TARGET_PATHS_COMPAT_HOSTED_V1","checkoutCommit":head,"commands":records,"qualificationReceiptSha256":hashlib.sha256((bundle/"qualification-receipt.json").read_bytes()).hexdigest(),"aggregateBytes":gate(),"storageGuardReceiptSha256":hashlib.sha256((bundle/"storage-guard-receipt.json").read_bytes()).hexdigest(),"mavenIdentity":observed,"authorityQualificationReceiptSha256":hashlib.sha256((bundle/"authority-qualification-receipt.json").read_bytes()).hexdigest(),"artifactMembers":46,"phaseAdvanced":False}
              (bundle/"hosted-receipt.json").write_text(json.dumps(hosted,indent=2)+"\n",encoding="utf-8")
              completed=True
          finally:
              # Command logs already reside in the upload directory if storage refuses new copies.
              last=bundle/(records[-1]["log"] if records else "binding.log")
              tail=b""
              if last.is_file() and not last.is_symlink():
                  with last.open("rb") as f:f.seek(max(0,last.stat().st_size-32768));tail=f.read(32768)
              try:
                  before=gate(496*1024**2)
                  present=sorted(bundle.iterdir())
                  external=sorted(root.glob("*.json"))+sorted(root.glob("*.log"))
                  external+=sorted((sdk/"target/surefire-reports").glob("TEST-*.xml"))
                  external+=sorted((sdk/"target/surefire-reports").glob("*.txt"))
                  external+=[sdk/"target/sdk-receipt.json",sdk/"target/recipe-test-counters.json",qualifier.parent/"source-binding.json"]
                  external+=[sdk/"target/emitted/m3/tooling/migration-recipes/src/main/java/jdk/internal/m3/rewrite/M3HashPinnedJavaSnapshotRecipe.java",sdk/"target/inverse-emitted/m3/tooling/migration-recipes/src/main/java/jdk/internal/m3/rewrite/M3HashPinnedJavaSnapshotRecipe.java"]
                  aliases={sdk/"target/emitted/m3/tooling/migration-recipes/src/main/java/jdk/internal/m3/rewrite/M3HashPinnedJavaSnapshotRecipe.java":"emitted-product-provider.java",sdk/"target/inverse-emitted/m3/tooling/migration-recipes/src/main/java/jdk/internal/m3/rewrite/M3HashPinnedJavaSnapshotRecipe.java":"emitted-inverse-provider.java"}
                  child=runpy.run_path(str(authority/"qualify.py"),run_name="m3_authority_artifact_contract")
                  new_sources=child["artifact_sources"]()
                  aliases.update(dict(new_sources))
                  external.extend(path for path,name in new_sources)
                  selected=present+[p for p in external if p.is_file()]
                  if any(not p.is_file() or any(q.is_symlink() for q in [p,*p.parents]) for p in selected):raise RuntimeError("closed artifact source fence")
                  by_name={}
                  origins={}
                  copies=[]
                  for path in selected:
                      name=aliases.get(path,path.name)
                      if name in ("commands.json","inventory.json","log-tail.txt"):raise RuntimeError("reserved artifact name already exists")
                      destination=bundle/name
                      if name in by_name:
                          if path.read_bytes()!=by_name[name].read_bytes():raise RuntimeError("artifact basename conflict")
                          continue
                      by_name[name]=path
                      origins[name]=str(path.relative_to(root)) if root in path.parents else str(path.relative_to(source))
                      if path!=destination:copies.append((path,destination))
                  commands=(json.dumps(records,indent=2)+"\n").encode("utf-8")
                  payload=sum(p.stat().st_size for p in by_name.values())+len(tail)+len(commands)
                  planned=sum(p.stat().st_size for p,d in copies)+len(tail)+len(commands)
                  if len(by_name)+3>64 or payload+1024**2>8*1024**2 or before+planned+1024**2>496*1024**2:raise RuntimeError("complete artifact payload exceeds closed budget")
                  if completed:
                      api_suite="jdk.internal.m3.rewrite.M3HashPinnedTargetPathsCompatRecipeTest"
                      original_members={"binding.log","toolchain.log","sdk-inputs.log","sdk-maven.log","sdk-reports.log","sdk-report.log","binding-receipt.json","qualification-receipt.json","storage-guard-receipt.json","hosted-receipt.json","TEST-"+api_suite+".xml",api_suite+".txt","sdk-receipt.json","recipe-test-counters.json","source-binding.json","emitted-product-provider.java","emitted-inverse-provider.java"}
                      added_logs={name+".log" for name in ("authority-binding","scope-inputs","manifest-inputs","scope-maven","scope-reports","manifest-maven","manifest-reports","authority-report")}
                      expected_members=original_members|added_logs|{"authority-binding-receipt.json","authority-qualification-receipt.json"}|{name for path,name in new_sources}
                      if len(expected_members)+3!=46 or set(by_name)!=expected_members:raise RuntimeError("exact original20 and complete46member success artifact closure required")
              except BaseException:
                  print(tail.decode("utf-8",errors="replace"));raise
              for path,destination in copies:
                  gate(496*1024**2);shutil.copyfile(path,destination)
              gate(496*1024**2);(bundle/"commands.json").write_bytes(commands)
              gate(496*1024**2);(bundle/"log-tail.txt").write_bytes(tail)
              origins["commands.json"]="generated command lifecycle records"
              origins["log-tail.txt"]="additional bounded tail of "+last.name
              inventory={}
              for path in sorted(bundle.iterdir()):
                  if not path.is_file() or path.is_symlink():raise RuntimeError("artifact inventory redirected")
                  with path.open("rb") as f:digest=hashlib.file_digest(f,"sha256").hexdigest()
                  inventory[path.name]={"bytes":path.stat().st_size,"sha256":digest,"source":origins[path.name]}
              gate(496*1024**2)
              (bundle/"inventory.json").write_text(json.dumps(inventory,indent=2)+"\n",encoding="utf-8")
              print(tail.decode("utf-8",errors="replace"))
              print("Final aggregate bytes before artifact upload:",gate(496*1024**2))
          PY
      - name: Fence the existing artifact payload
        id: artifact_payload
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-hash-pinned-target-paths-source
          TMPDIR: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/data
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os,pathlib,stat
          bundle=pathlib.Path(os.environ["M3_PROOF_ROOT"])/"artifacts"
          if not bundle.is_dir() or any(p.is_symlink() for p in [bundle,*bundle.parents]):raise SystemExit("artifact payload missing or redirected")
          files=list(bundle.iterdir())
          if not files or len(files)>64:raise SystemExit("artifact payload must contain1..64flat regular files")
          total=0
          for path in files:
              info=path.lstat()
              if not stat.S_ISREG(info.st_mode) or path.is_symlink():raise SystemExit("artifact payload contains nonregular or redirected input")
              total+=info.st_size
          if total>8*1024**2:raise SystemExit("artifact payload exceeds8MiB: observed="+str(total)+" limit="+str(8*1024**2)+" bytes")
          print("Closed artifact payload:",len(files),"files",total,"bytes")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as output:output.write("allowed=true\n")
          PY
      - name: Retain bounded SDK logs and source qualification receipts
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-hash-pinned-target-paths-source
          TMPDIR: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/data
        if: ${{ always() && steps.artifact_payload.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-hash-pinned-target-paths-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

