    name: "M3 Bulk Executor Port / patch-smoke"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-bulk-executor-port'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 Bulk Executor Port-${{ github.ref }}-patch-smoke"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile java.base patch candidate
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/bulk-patch-src"
          out="$RUNNER_TEMP/bulk-java-base"
          tests="$RUNNER_TEMP/bulk-tests"
          mkdir -p "$src/jdk/internal/vm/parallel" "$out" "$tests"
          cp src/java.base/share/classes/jdk/internal/vm/parallel/BulkTask.java "$src/jdk/internal/vm/parallel/"
          cp src/java.base/share/classes/jdk/internal/vm/parallel/BulkExecutor.java "$src/jdk/internal/vm/parallel/"
          cp src/java.base/share/classes/jdk/internal/vm/parallel/BulkExecution.java "$src/jdk/internal/vm/parallel/"
          cp src/java.base/share/classes/jdk/internal/vm/parallel/BulkExecutorProvider.java "$src/jdk/internal/vm/parallel/"
          cp src/java.base/share/classes/jdk/internal/vm/parallel/BulkScheduler.java "$src/jdk/internal/vm/parallel/"
          javac -Xlint:all -Werror             --patch-module "java.base=$src"             -d "$out"             "$src"/jdk/internal/vm/parallel/*.java
          javac -Xlint:all -Werror             --patch-module "java.base=$out"             --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED             -d "$tests"             test/jdk/jdk/internal/vm/parallel/BulkExecutorTest.java \
            test/jdk/jdk/internal/vm/parallel/BulkSchedulerTest.java
          java             --patch-module "java.base=$out"             --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED             -cp "$tests"             BulkExecutorTest
          java             --patch-module "java.base=$out"             --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED             -cp "$tests"             BulkSchedulerTest

  m3-bulk-executor-port__jdk-build-jtreg:
    name: "M3 Bulk Executor Port / jdk-build-jtreg"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-bulk-executor-port'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 Bulk Executor Port-${{ github.ref }}-jdk-build-jtreg"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: Build repository JTReg for this run
        uses: ./.github/actions/build-jtreg
      - name: Get JTReg
        id: jtreg
        uses: ./.github/actions/get-jtreg
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libxrandr-dev libxtst-dev libcups2-dev libasound2-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100             --slave /usr/bin/g++ g++ /usr/bin/g++-12
      - name: Configure
        run: |
