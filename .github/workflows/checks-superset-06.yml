jobs:
  gate:
    name: 'Superset gate'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 'Check out the gate files'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/checks-superset
          fetch-depth: 1
          filter: blob:none
      - name: 'Decide member workflows from triggers, branches and changed paths (plain git)'
        id: gate
        run: python3 .github/checks-superset/gate.py 06

  m3-source-signal-recorded-graph-20261024__exact-original-javac-image-binding:
    name: "M3JDK21 original javac signal graph quality binding / exact-original-javac-image-binding"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-source-signal-recorded-graph-20261024'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 original javac signal graph quality binding-${{ github.ref }}-exact-original-javac-image-binding"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original source image, typed quality, and recorded graph owners
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-recorded-binding"
          mkdir -p "$out/classes" "$out/plugin/META-INF/services" "$out/fixture-classes" "$out/demo"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SignalColumns.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SignalRelations.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SourceSignalImage.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SignalDependencyEpochs.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SignalQualitySchema.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SourceSignalQualityFactory.java \
            test/jdk/jdk/m3/collections/M3SourceSignalQualityFactorySelfTest.java
          java -cp "$out/classes" jdk.m3.collections.M3SourceSignalQualityFactorySelfTest
          java -Xint -cp "$out/classes" jdk.m3.collections.M3SourceSignalQualityFactorySelfTest
      - name: Execute original javac M3SourceSignals plugin and parse real S/T/E evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-recorded-binding"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/plugin" \
            m3/compiler/source-signals/src/main/java/jdk/m3/compiler/signals/MethodSignals.java \
            m3/compiler/source-signals/src/main/java/jdk/m3/compiler/signals/SourceSignalPlugin.java
          cp m3/compiler/source-signals/src/main/resources/META-INF/services/com.sun.source.util.Plugin \
            "$out/plugin/META-INF/services/com.sun.source.util.Plugin"
          cat > "$out/demo/Example.java" <<'JAVA'
          package demo;
          class Example {
              static void run() { new Target().run(); }
          }
          class Target { void run() { } }
          JAVA
          javac --release 21 -proc:none -processorpath "$out/plugin" \
            "-Xplugin:M3SourceSignals out=$out/facts.tsv include=all" \
            -d "$out/fixture-classes" "$out/demo/Example.java"
          test -s "$out/facts.tsv"
          java -cp "$out/classes" jdk.m3.collections.M3SourceSignalQualityFactorySelfTest "$out/facts.tsv"
          java -Xint -cp "$out/classes" jdk.m3.collections.M3SourceSignalQualityFactorySelfTest "$out/facts.tsv"

  m3-source-signal-recorded-graph-20261024__original-owning-junit:
    name: "M3JDK21 original javac signal graph quality binding / original-owning-junit"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-source-signal-recorded-graph-20261024'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 original javac signal graph quality binding-${{ github.ref }}-original-owning-junit"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile original source-vendored JUnit artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Build original array dependency, retaining owning collections tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3SourceSignalQualityFactoryTest test

  m3-source-signals-service-lifecycle__original-compiler-module-maven:
    name: "M3JDK21 javac source signals Maven service lifecycle / original-compiler-module-maven"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-source-signals-service-lifecycle'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 javac source signals Maven service lifecycle-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Strict Maven source compile and original JUnit suite from clean classes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/master...HEAD
          mvn -B -ntp -f m3/compiler/source-signals/pom.xml clean verify
      - name: Verify original provider identity in compiled classes and packaged JAR
        shell: bash
        run: |
          set -euo pipefail
          module="m3/compiler/source-signals"
          descriptor="META-INF/services/com.sun.source.util.Plugin"
          test -f "$module/target/classes/$descriptor"
          diff "$module/src/main/resources/$descriptor" "$module/target/classes/$descriptor"
