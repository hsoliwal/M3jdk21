              (6021224546, 8000, "e38ab5459c39ff1db85cc562830ef5ce71519ce6e9c7c1b92ff976a19d29713b"),
              (6021251481, 8000, "eb6e9a04db123c2086c96a3ec5bc9b44a9a3a0f767d5d8ae20b0f5e0c012ef30"),
              (6021329398, 7444, "f2e47ee9f0be4a32ffb617b8693bb28090ae4123d02036d2137edfcf7b377779"),
          )

          def require(value, message):
              if not value:
                  raise RuntimeError(message)

          def unique(pairs):
              out = {}
              for key, value in pairs:
                  require(key not in out, "duplicate JSON key")
                  out[key] = value
              return out

          def decode(parts):
              require(len(parts) == len(PARTS), "part count")
              for text, (_, size, expected) in zip(parts, PARTS):
                  require(len(text) == size, "part length")
                  require(hashlib.sha256(text.encode("ascii")).hexdigest() == expected, "part SHA")
              data = base64.b64decode("".join(parts), validate=True)
              require(len(data) == 29581 and hashlib.sha256(data).hexdigest() == ARCHIVE_SHA, "archive seal")
              with zipfile.ZipFile(io.BytesIO(data)) as archive:
                  entries = archive.infolist()
                  require(len(entries) == 1 and entries[0].filename == "packet.json", "ZIP inventory")
                  entry = entries[0]
                  require(not entry.is_dir() and not stat.S_ISLNK(entry.external_attr >> 16), "ZIP type")
                  require(entry.file_size == 125328 and entry.compress_type == zipfile.ZIP_LZMA, "ZIP size/type")
                  with archive.open(entry) as stream:
                      content = stream.read(262145)
                  require(len(content) <= 262144, "decompressed budget")
              packet = json.loads(content.decode("utf-8"), object_pairs_hook=unique)
              require(set(packet) == {"metadata", "contents"}, "packet fields")
              meta, files = packet["metadata"], packet["contents"]
              require(meta["schema"] == "M3_CALLBACK_SDK_PACKET_V1", "packet schema")
              require(meta["sourceCommit"] == SOURCE and meta["targetCommit"] == TARGET, "source/target pin")
              require(meta["license"] == "Apache-2.0" and meta["scope"] == "FIRST_PARTY_AUTHORING_PROOF_ONLY", "scope")
              require(set(files) == set(meta["files"]) and len(files) == 18, "file inventory")
              total = 0
              for name, text in files.items():
                  require(isinstance(name, str) and 0 < len(name) <= 4096, "path type/length")
                  require(not name.startswith("/") and "\\" not in name and ":" not in name, "absolute path")
                  require(all(p not in ("", ".", "..") and p.lower() != ".git" for p in name.split("/")), "path escape")
                  require(not any(ord(c) < 32 or ord(c) == 127 for c in name), "path control")
                  require(isinstance(text, str), "UTF-8 text source required")
                  raw = text.encode("utf-8")
                  total += len(raw)
                  require(len(raw) <= 262144 and total <= 2097152, "source byte budget")
                  require(hashlib.sha256(raw).hexdigest() == meta["files"][name], "source SHA: " + name)
              return data, meta, files

          def main():
              parts = []
              for identifier, _, _ in PARTS:
                  request = urllib.request.Request(
                      f"https://api.github.com/repos/hsoliwal/M3jdk21/issues/comments/{identifier}",
                      headers={"Accept": "application/vnd.github+json", "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                               "User-Agent": "Synexia-Callback-Input/1", "X-GitHub-Api-Version": "2022-11-28"})
                  with urllib.request.urlopen(request, timeout=60) as response:
                      raw = response.read(65537)
                  require(len(raw) <= 65536, "comment response budget")
                  comment = json.loads(raw.decode("utf-8"), object_pairs_hook=unique)
                  require(comment["id"] == identifier, "comment identity")
                  require(comment["issue_url"] == "https://api.github.com/repos/hsoliwal/M3jdk21/issues/258", "comment owner")
                  blocks = re.findall(r"```base64\n([A-Za-z0-9+/=]+)\n```", comment["body"])
                  require(len(blocks) == 1, "one base64 part required")
                  parts.append(blocks[0])
              data, meta, files = decode(parts)
              parent = Path(os.environ["RUNNER_TEMP"])
              root = parent / "callback-source"
              record = parent / "callback-input"
              require(parent.is_dir() and not root.exists() and not record.exists(), "fresh input directories required")
              for part in (parent, *parent.parents):
                  require(not part.is_symlink(), "symbolic output parent")
              root.mkdir()
              record.mkdir()
              for name, text in sorted(files.items()):
                  output = root / name
                  output.parent.mkdir(parents=True, exist_ok=True)
                  with output.open("xb") as stream:
                      stream.write(text.encode("utf-8"))
              (root / "SOURCE_PACKET.json").write_text(json.dumps(meta, sort_keys=True, indent=2) + "\n")
              (record / "packet.zip").write_bytes(data)
              receipt = {"status": "INPUT_VERIFIED_NOT_EXECUTED", "sourceCommit": SOURCE, "targetCommit": TARGET,
                         "archiveSha256": ARCHIVE_SHA, "comments": [row[0] for row in PARTS], "files": meta["files"]}
              (record / "ACQUISITION.json").write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n")
              print(json.dumps({"status": receipt["status"], "files": len(files), "archiveSha256": ARCHIVE_SHA}))

          if __name__ == "__main__":
              main()
          PY_SOURCE
      - name: Verify and reconstruct canonical source correction
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY_DELTA'
          import hashlib, json, os, re, urllib.request
          from pathlib import Path

          COMMENT = 6034649686
          DELTA_SHA = '1a46ee791bb0a61128e8f98cd3434f8026512e6d240bf3e2d123c00f5208511f'
          BASE = '01554337e0051018e6d932f3775378a01faf88f8'
          SOURCE = '01561606c6adec4c5c3a3d81247924c60f9a9fd0'
          TARGET = 'c1acefe582ac84414f1082f095e96bbee167bc33'
          PATH = 'm3-openrewrite-recipes/tools/patternizer/callback-parity/receivers/m3jdk21/hosted_apply.py'
          BEFORE = '5cb0930da45a862207360b684579219c6a208bac5f5c27e2f409caf1d26f96c7'
          AFTER = '3718546fc3fe883a56fdb00ae30c4343efa91d3954fca465dac8928c5994ec4d'

          def require(value, message):
              if not value:
                  raise RuntimeError(message)

          def unique(pairs):
              out = {}
              for key, value in pairs:
                  require(key not in out, 'duplicate JSON key')
                  out[key] = value
              return out

          def reconstruct(before, meta, raw):
              require(len(raw) == 2982 and hashlib.sha256(raw).hexdigest() == DELTA_SHA, 'delta seal')
              delta = json.loads(raw.decode('utf-8'), object_pairs_hook=unique)
              require(set(delta) == {'schema', 'path', 'baseSourceCommit', 'sourceCommit', 'beforeSha256', 'afterSha256', 'edits'}, 'delta fields')
              require(delta['schema'] == 'M3_CALLBACK_SOURCE_DELTA_V1' and delta['path'] == PATH, 'delta scope')
              require(delta['baseSourceCommit'] == BASE and delta['sourceCommit'] == SOURCE, 'delta lineage')
              require(delta['beforeSha256'] == BEFORE and delta['afterSha256'] == AFTER, 'delta hashes')
              require(meta['sourceCommit'] == BASE and meta['targetCommit'] == TARGET, 'base packet lineage')
              require(len(meta['files']) == 18 and meta['files'][PATH] == BEFORE, 'base packet file seal')
              require(hashlib.sha256(before).hexdigest() == BEFORE, 'source preimage')
              text = before.decode('utf-8')
              require(len(delta['edits']) == 2, 'exact edit count')
              for edit in delta['edits']:
                  require(set(edit) == {'before', 'after'} and isinstance(edit['before'], str) and isinstance(edit['after'], str), 'edit shape')
                  require(edit['before'] and text.count(edit['before']) == 1, 'unique exact source atom')
                  text = text.replace(edit['before'], edit['after'], 1)
              after = text.encode('utf-8')
              require(hashlib.sha256(after).hexdigest() == AFTER, 'source postimage')
              updated = json.loads(json.dumps(meta))
              updated['baseSourceCommit'] = BASE
              updated['sourceCommit'] = SOURCE
              updated['sourceDeltaSha256'] = DELTA_SHA
              updated['sourceFileRevisions'] = {name: BASE for name in meta['files']}
              updated['sourceFileRevisions'][PATH] = SOURCE
              updated['files'][PATH] = AFTER
              return after, updated

          def main():
              request = urllib.request.Request(
                  f'https://api.github.com/repos/hsoliwal/M3jdk21/issues/comments/{COMMENT}',
                  headers={'Accept': 'application/vnd.github+json', 'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'User-Agent': 'Synexia-Callback-Delta/1', 'X-GitHub-Api-Version': '2022-11-28'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  response_bytes = response.read(65537)
              require(len(response_bytes) <= 65536, 'comment response budget')
              comment = json.loads(response_bytes.decode('utf-8'), object_pairs_hook=unique)
              require(comment['id'] == COMMENT and comment['issue_url'] == 'https://api.github.com/repos/hsoliwal/M3jdk21/issues/258', 'comment identity')
              blocks = re.findall(r'```json\n(.*?\n)```', comment['body'], flags=re.S)
              require(len(blocks) == 1, 'one delta JSON block required')
              raw = blocks[0].encode('utf-8')
              root = Path(os.environ['RUNNER_TEMP']) / 'callback-source'
              record = Path(os.environ['RUNNER_TEMP']) / 'callback-input'
              host = root / PATH
              for path in (host, root / 'SOURCE_PACKET.json', record):
                  for part in (path, *path.parents):
                      require(not part.is_symlink(), 'symbolic source/record path')
              meta_bytes = (root / 'SOURCE_PACKET.json').read_bytes()
              meta = json.loads(meta_bytes.decode('utf-8'), object_pairs_hook=unique)
              after, updated = reconstruct(host.read_bytes(), meta, raw)
              for name, expected in meta['files'].items():
                  require(hashlib.sha256((root / name).read_bytes()).hexdigest() == expected, 'base source inventory drift')
              with (record / 'BASE_SOURCE_PACKET.json').open('xb') as out:
                  out.write(meta_bytes)
              with (record / 'SOURCE_DELTA.json').open('xb') as out:
                  out.write(raw)
              host.write_bytes(after)
              (root / 'SOURCE_PACKET.json').write_text(json.dumps(updated, sort_keys=True, indent=2) + '\n', encoding='utf-8')
              require(all(hashlib.sha256((root / name).read_bytes()).hexdigest() == value for name, value in updated['files'].items()), 'derived source inventory drift')
              receipt = {'status': 'SOURCE_INPUT_RECONSTRUCTED_NOT_EXECUTED', 'baseSourceCommit': BASE,
                         'correctionCommit': SOURCE, 'deltaSha256': DELTA_SHA, 'path': PATH,
                         'beforeSha256': BEFORE, 'afterSha256': AFTER, 'targetCommit': TARGET,
                         'sourceFileRevisions': updated['sourceFileRevisions']}
              with (record / 'DELTA_RECEIPT.json').open('x', encoding='utf-8') as out:
                  out.write(json.dumps(receipt, sort_keys=True, indent=2) + '\n')
              print(json.dumps({'status': receipt['status'], 'correctionCommit': SOURCE, 'afterSha256': AFTER}))

          if __name__ == '__main__':
              main()
          PY_DELTA
