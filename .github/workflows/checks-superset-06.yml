          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/receiver-classes" \
            m3/tooling/jmod-recipes/src/main/java/jdk/m3/rewrite/jmod/CpuToolReceiverAdmission.java \
            m3/tooling/jmod-recipes/src/test/java/jdk/m3/rewrite/jmod/CpuToolReceiverAdmissionChecks.java
          java -cp "$RUNNER_TEMP/receiver-classes" jdk.m3.rewrite.jmod.CpuToolReceiverAdmissionChecks
          java -cp "$RUNNER_TEMP/receiver-classes" jdk.m3.rewrite.jmod.CpuToolReceiverAdmission \
            m3/tooling/jmod-recipes/CPU_TOOL_DONOR_CATALOGUE_PIN_20261015.tsv \
            m3/tooling/jmod-recipes/CPU_TOOL_RECEIVER_MAP_20261014.tsv \
            m3/tooling/jmod-recipes/CPU_TOOL_RECEIVER_DEFERRALS_20261015.tsv

  m3-current-nlp-search-jmods-20261018__current-forks:
    name: "M3 current Lucene/OpenNLP JMODs / current-forks"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-current-nlp-search-jmods-20261018'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 current Lucene/OpenNLP JMODs-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      JAVA_TOOL_OPTIONS: '-Xmx1024m'
      MAVEN_OPTS: '-Xmx512m'
    steps:
      - name: Check out the M3 receiver
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: |
            m3/core/src
            m3/ports/compiletime/src/main/java/jdk/m3/compiletime/ast
            m3/vendor/m3/m3-mindex
            m3/vendor/m3/m3-native-interop
            m3/vendor/m3/m3-openrewrite-recipes
            m3/tooling/jmod-recipes/tools
            m3/tooling/module-packs/nlp-search
            m3/tooling/joined-range-directory/current-baseline
      - name: Select Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check out the qualified Lucene source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hsoliwal/lucene
          ref: '873b6167603c69101d626ddffd8d733340300fea'
          path: donors/lucene
      - name: Check out the qualified OpenNLP source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: hsoliwal/opennlp
          ref: '8b647d1d389736952e43fb46865c874747f7acde'
          path: donors/opennlp
      - name: Verify companion source commits
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          refs = json.loads(Path('m3/tooling/module-packs/nlp-search/CURRENT_FORK_REFS.json').read_text())
          for name in ('lucene', 'opennlp'):
              actual = subprocess.check_output(['git', '-C', 'donors/' + name, 'rev-parse', 'HEAD'], text=True).strip()
              if actual != refs['donors'][name]['implementation_commit']:
                  raise SystemExit('companion commit mismatch: ' + name)
          PY
      - name: Verify JMOD collection regressions
        shell: bash
        env:
          M3_NLP_TEST_TEMP: ${{ runner.temp }}
        run: python3 -m unittest discover -s m3/tooling/module-packs/nlp-search/tests -p 'test_current_forks.py' -v
      - name: Build and verify the canonical recipe engine
        shell: bash
        run: |
          mvn -version
          mvn -B -ntp \
            -f m3/vendor/m3/m3-openrewrite-recipes/crates/m3-nlp-search/current-forks-20261018/pom.xml \
            test org.apache.maven.plugins:maven-dependency-plugin:3.11.0:build-classpath \
            -Dmdep.outputFile=target/sdk-classpath.txt
      - name: Build the source JMODs and combined image
        shell: bash
        run: |
          python3 m3/tooling/module-packs/nlp-search/current_forks.py \
            --jdk-home "$JAVA_HOME" \
            --receiver-transition m3/tooling/joined-range-directory/current-baseline/RECEIVER_TRANSITIONS_V10.json \
            --lucene-source donors/lucene \
            --opennlp-source donors/opennlp \
            --recipe-runner m3/vendor/m3/m3-openrewrite-recipes/crates/m3-nlp-search/current-forks-20261018/run_recipe.py \
            --recipe-resources m3/vendor/m3/m3-openrewrite-recipes/src/main/resources \
            --out out/current-nlp-search
      - name: Retain JMODs and build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: m3-current-nlp-search-jmods
          if-no-files-found: error
          retention-days: 14
          path: |
            out/current-nlp-search/pack/jmods/
            out/current-nlp-search/**/*.json
            out/current-nlp-search/**/*.tsv
            out/current-nlp-search/**/*.log
            out/current-nlp-search/modules.txt

