        run: |
          set -euo pipefail
          git diff --check
          python3 m3/ports/compiletime/verify_compiletime_precompute.py

      - name: Install the dependency-free precompute port
        run: |
          set -euo pipefail
          out=target/m3-precompute-classes
          mkdir -p "$out"
          javac --release 21 -d "$out" $(find src/java.base/share/classes/jdk/m3/precompute -name '*.java')
