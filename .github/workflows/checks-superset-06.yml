  m3-filtered-list-mutation-20261018__qualify:
    name: "M3 filtered List mutation receiver SDK and Java21 / qualify"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-filtered-list-mutation-20261018'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 filtered List mutation receiver SDK and Java21-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            src/jdk.m3.collections/share
            test/jdk/jdk/m3/collections
            test/jdk/jdk/internal/m3/collections
            m3/tooling/migration-recipes/src/main/java/jdk/internal/m3/rewrite
            m3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3jdk21-filtered-list-mutation-20261018
            m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing receiver engine and pinned before source
        shell: bash
        run: |
          set -euo pipefail
          P=m3/collections/qualification/filtered-list-mutation-20261018
          test "$(git hash-object m3/tooling/migration-recipes/src/main/java/jdk/internal/m3/rewrite/M3HashPinnedJavaSnapshotRecipe.java)" = aaf5c4615fb44e49dde1ddcf15eb11a578c31885
          mkdir -p "$P/target/pre"
          cp "$P/pre/M3FilteredLists.java.txt" "$P/target/pre/M3FilteredLists.java"
          echo "f1e3e21c37cbe084ef6b9446b86293d5039cd9b2bc6c1bf86d63a86793e3b8d5  $P/target/pre/M3FilteredLists.java" | sha256sum -c -
          { git rev-parse HEAD; java -version 2>&1; mvn -version; } > "$P/target/environment.txt"
      - name: Execute existing Java-LST recipe with real Maven SDK
        shell: bash
        run: |
          set -euo pipefail
          P=m3/collections/qualification/filtered-list-mutation-20261018
          mvn -B -ntp -f "$P/pom.xml" test | tee "$P/target/maven.log"
          grep -F 'Tests run: 4, Failures: 0, Errors: 0, Skipped: 0' "$P/target/surefire-reports/jdk.internal.m3.rewrite.FilteredListMutationRecipeTest.txt"
      - name: Generated-source red green, public API and actual receiver state
        shell: bash
        run: |
          set -euo pipefail
          P=m3/collections/qualification/filtered-list-mutation-20261018
          G="$P/target/generated/m3/collections/src"
          test "$(find "$P/target/generated" -name '*.java' | wc -l)" -eq 3
          mkdir -p "$P/target/green" "$P/target/red" "$P/target/receiver"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$P/target/green" "$G/main/java/jdk/m3/collections/M3FilteredLists.java" "$G/test/java/jdk/m3/collections/M3FilteredListMutationProof.java"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$P/target/red" "$P/target/pre/M3FilteredLists.java" "$G/test/java/jdk/m3/collections/M3FilteredListMutationProof.java"
          if java -ea -Xmx128m -cp "$P/target/red" jdk.m3.collections.M3FilteredListMutationProof > "$P/target/red.log" 2>&1; then echo 'Original unexpectedly passed'; exit 1; fi
          grep -F 'missing ConcurrentModificationException before mutation' "$P/target/red.log"
          java -ea -Xmx128m -cp "$P/target/green" jdk.m3.collections.M3FilteredListMutationProof | tee "$P/target/green.log"
          java -ea -Xint -Xmx128m -cp "$P/target/green" jdk.m3.collections.M3FilteredListMutationProof | tee "$P/target/interpreted.log"
          for L in green interpreted; do grep -F 'M3_FILTERED_LIST_MUTATION_PASS checks=775092' "$P/target/$L.log"; done
          javap -classpath "$P/target/red" -public -s jdk.m3.collections.M3FilteredLists > "$P/target/api-before.txt"
          javap -classpath "$P/target/green" -public -s jdk.m3.collections.M3FilteredLists > "$P/target/api-after.txt"
          diff -u "$P/target/api-before.txt" "$P/target/api-after.txt"
          if cmp -s src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredLists.java "$P/target/pre/M3FilteredLists.java"; then
            test ! -e test/jdk/jdk/m3/collections/M3FilteredListMutationProof.java
            test ! -e test/jdk/jdk/m3/collections/M3FilteredListMutationTest.java
            echo GENERATED_NOT_RECEIVED | tee "$P/target/receiver-state.txt"
          else
            for REL in main/java/jdk/m3/collections/M3FilteredLists.java test/java/jdk/m3/collections/M3FilteredListMutationProof.java test/java/jdk/m3/collections/M3FilteredListMutationTest.java; do cmp "m3/collections/src/$REL" "$G/$REL"; done
            javac --release 21 -proc:none -Xlint:all -Werror -d "$P/target/receiver" src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredLists.java test/jdk/jdk/m3/collections/M3FilteredListMutationProof.java
            java -ea -Xmx128m -cp "$P/target/receiver" jdk.m3.collections.M3FilteredListMutationProof | tee "$P/target/receiver.log"
            echo RECEIVED_AND_VERIFIED | tee "$P/target/receiver-state.txt"
          fi
          find "$P/target/generated" -name '*.java' -print0 | sort -z | xargs -0 sha256sum > "$P/target/generated-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filtered-list-mutation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            m3/collections/qualification/filtered-list-mutation-20261018/target/generated
            m3/collections/qualification/filtered-list-mutation-20261018/target/*.txt
            m3/collections/qualification/filtered-list-mutation-20261018/target/*.log
            m3/collections/qualification/filtered-list-mutation-20261018/target/surefire-reports

