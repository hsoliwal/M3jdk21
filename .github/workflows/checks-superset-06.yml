  m3-full-precompute-second-pass__verify:
    name: "M3 Full Precompute Second Pass / verify"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-full-precompute-second-pass'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 Full Precompute Second Pass-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diff and mapping syntax
        run: |
          set -euo pipefail
          git diff --check
          python3 -m json.tool m3/docs/name-mapping.json >/dev/null

      - name: Java precompute differential proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml test

      - name: Java JNI and native C parity proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative test

      - name: Install the source-built OpenRewrite/JUnit dependency closure
        run: |
          mvn -B -ntp -f m3/vendor/third_party/pom.xml -pl :rewrite-core,:rewrite-java,:rewrite-java-21,:rewrite-test,:junit-jupiter,junit-platform-launcher-1.10.2 -am -Dmaven.test.skip=true install
          mvn -B -ntp -f m3/m3-import/pure-int-recipe-custody/pom.xml -DskipTests install

      - name: Recipe engine and crate fixed point
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml -Dtest=M3Jdk21HashPinnedSnapshotRecipeNameTest,M3FullPrecomputeSecondPassRecipeTest test

