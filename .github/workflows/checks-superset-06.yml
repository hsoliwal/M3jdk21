  m3jdk-proof__proof:
    name: "M3JDK proof kit / proof"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk-proof'] && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK proof kit-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Read the exact candidate
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir "$RUNNER_TEMP/kit" "$RUNNER_TEMP/repo" "$RUNNER_TEMP/maven-repo"
          curl --fail --location --retry 3 "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" -o "$RUNNER_TEMP/kit/source.tar.gz"
          tar -xzf "$RUNNER_TEMP/kit/source.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf '%s\n' "$HEAD_SHA" > "$RUNNER_TEMP/kit/source-sha.txt"
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"
      - name: Prepare the retained Java21 toolchain
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"
      - name: Execute real module-pack tests then unchanged admission
        run: |
          set -euo pipefail
          java -version 2>&1 | tee "$RUNNER_TEMP/kit/java-version.txt"
          mvn -version 2>&1 | tee "$RUNNER_TEMP/kit/maven-version.txt"
          mvn -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/maven-repo" -f "$REPO/m3/tooling/module-packs/pom.xml" clean test 2>&1 | tee "$RUNNER_TEMP/kit/test.log"
          mvn -B -ntp -Dmaven.repo.local="$RUNNER_TEMP/maven-repo" -f "$REPO/m3/tooling/module-packs/pom.xml" verify 2>&1 | tee "$RUNNER_TEMP/kit/verify.log"
      - name: Attempt the complete retained control reactor without hiding failures
        if: always() && env.REPO != ''
        run: |
          set -euo pipefail
          mvn -B -ntp -fae -Dmaven.repo.local="$RUNNER_TEMP/maven-repo" -f "$REPO/m3/pom.xml" clean verify 2>&1 | tee "$RUNNER_TEMP/kit/reactor-verify.log"
      - name: Preserve exact runtime and dependencies even on rejection
        if: always()
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/kit"
          if command -v mvn >/dev/null; then
            home=$(dirname "$(dirname "$(readlink -f "$(command -v mvn)")")")
            test -d "$home/lib" && test -d "$home/boot"
            mkdir -p "$RUNNER_TEMP/maven/conf"
            cp -R "$home/bin" "$home/boot" "$home/lib" "$RUNNER_TEMP/maven/"
            for name in LICENSE NOTICE README.txt; do
              if test -f "$home/$name"; then cp "$home/$name" "$RUNNER_TEMP/maven/"; fi
            done
            if test -d "$home/conf/logging"; then cp -R "$home/conf/logging" "$RUNNER_TEMP/maven/conf/"; fi
            printf '%s\n' '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"/>' > "$RUNNER_TEMP/maven/conf/settings.xml"
            tar -czf "$RUNNER_TEMP/kit/maven.tar.gz" -C "$RUNNER_TEMP" maven
          fi
          if test -d "$RUNNER_TEMP/maven-repo"; then
            tar --exclude='*.lastUpdated' --exclude='resolver-status.properties' -czf "$RUNNER_TEMP/kit/repository.tar.gz" -C "$RUNNER_TEMP" maven-repo
          fi
          if test -d "$RUNNER_TEMP/repo/m3"; then
            find "$RUNNER_TEMP/repo/m3" -type f \( -path '*/surefire-reports/*' -o -path '*/site/jacoco/*' -o -name 'jacoco.exec' \) -print0 | tar --null -T - -czf "$RUNNER_TEMP/kit/reports.tar.gz"
          fi
          printf '%s\n' 'Proof inputs only. Artifact preservation is not test success or release admission. No user/runner settings, credentials, or generated key stores are included.' > "$RUNNER_TEMP/kit/BOUNDARY.txt"
          (cd "$RUNNER_TEMP/kit" && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
      - name: Save proof inputs, not a release
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3jdk-kit-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/kit
          retention-days: 3
          if-no-files-found: error

  m3jdk21-jep-residue-proof-gate__python-gate:
    name: "M3 JDK21 JEP residue proof-gate repair / python-gate"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-jep-residue-proof-gate'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JDK21 JEP residue proof-gate repair-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Diff and Python syntax
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile m3/backports/jep_residue.py m3/backports/test_jep_residue.py m3/backports/test_m3_extension_residue.py
      - name: Released-JEP residue tests
        run: |
          set -euo pipefail
          python3 -m unittest -v m3/backports/test_jep_residue.py m3/backports/test_m3_extension_residue.py
          python3 m3/backports/jep_residue.py --root . --out /tmp/m3-jep-residue.tsv
          cmp /tmp/m3-jep-residue.tsv m3/backports/JEP_RESIDUE_QUEUE.tsv

  m3jdk21-recipe-crates__generate:
    name: "M3 JDK21 OpenRewrite crate generation / generate"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-recipe-crates'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-pr-m3jdk21-recipe-crates.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-${{ strategy.job-index }}"
      cancel-in-progress: "${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 22
            tag: jdk-22+36
          - release: 23
            tag: jdk-23+37
          - release: 24
            tag: jdk-24+36
          - release: 25
            tag: jdk-25+36
          - release: 26
            tag: jdk-26+35
          - release: 27
            tag: jdk-27+35
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact M3JDK21 commit
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" -o "$RUNNER_TEMP/m3jdk21.tar.gz"
          mkdir -p "$RUNNER_TEMP/m3jdk21"
          tar -xzf "$RUNNER_TEMP/m3jdk21.tar.gz" -C "$RUNNER_TEMP/m3jdk21" --strip-components=1
          printf 'M3ROOT=%s\n' "$RUNNER_TEMP/m3jdk21" >> "$GITHUB_ENV"
          # Read the exact target Git tree so inherited and M3-modified files are routed separately.
          mkdir -p "$RUNNER_TEMP/m3-current-git"
          git -C "$RUNNER_TEMP/m3-current-git" init -q
          git -C "$RUNNER_TEMP/m3-current-git" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/m3-current-git" -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "$HEAD_SHA"
          git -C "$RUNNER_TEMP/m3-current-git" rev-parse --verify "${HEAD_SHA}^{commit}"
          printf 'M3TARGET=%s\n' "$RUNNER_TEMP/m3-current-git" >> "$GITHUB_ENV"
          printf 'M3HEAD=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Fetch JDK21 baseline and donor tag
        shell: bash
        env:
          DONOR_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none             --no-tags             origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/${DONOR_TAG}:refs/tags/${DONOR_TAG}"
          git -C "$RUNNER_TEMP/upstream-jdk" rev-parse --verify 'jdk-21+35^{commit}'
          git -C "$RUNNER_TEMP/upstream-jdk" rev-parse --verify "${DONOR_TAG}^{commit}"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: Unit-test comparator and crate generator
        shell: bash
        run: |
          set -euo pipefail
          cd "$M3ROOT/m3/backports"
          python3 -m unittest -v test_file_delta_inventory.py test_generate_recipe_crates.py

      - name: Generate exact file comparison and OpenRewrite candidate crates
        shell: bash
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          python3 "$M3ROOT/m3/backports/file_delta_inventory.py"             --repo "$UPSTREAM"             --release "$RELEASE"             --out "$RUNNER_TEMP/output/JDK21_FILE_DELTAS.tsv"
          python3 "$M3ROOT/m3/backports/generate_recipe_crates.py"             --repo "$UPSTREAM"             --release "$RELEASE"             --all-candidates             --target-git "$M3TARGET"             --target-ref "$M3HEAD"             --out "$RUNNER_TEMP/output/openrewrite-bundle"
          gzip -9 -k "$RUNNER_TEMP/output/JDK21_FILE_DELTAS.tsv"
          cat "$RUNNER_TEMP/output/openrewrite-bundle/CRATES.tsv"


      - name: Upload candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3jdk21-openrewrite-jdk${{ matrix.release }}-${{ github.run_id }}
          path: ${{ runner.temp }}/output
          if-no-files-found: error
          retention-days: 7

  m3jdk8368692-recovery__recipe-and-static-proof:
    name: "M3 JDK-8368692 recovery proof / recipe-and-static-proof"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk8368692-recovery'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JDK-8368692 recovery proof-${{ github.ref }}-recipe-and-static-proof"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify packet hashes and compatibility
        run: python3 m3/backports/recipes/jdk-8368692/verify_recovery.py

  m3jdk8368692-recovery__java-base-image-and-jtreg:
    name: "M3 JDK-8368692 recovery proof / java-base-image-and-jtreg"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk8368692-recovery'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JDK-8368692 recovery proof-${{ github.ref }}-java-base-image-and-jtreg"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install OpenJDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
      - name: Configure
        run: bash configure --with-boot-jdk="$JAVA_HOME" --with-debug-level=release --with-jvm-variants=server --disable-warnings-as-errors
      - name: Build image
        run: make JOBS=2 images
      - name: Run focused password policy jtreg
        run: make JOBS=2 test TEST="test/jdk/sun/security/tools/keytool/AllowSystemIn.java"

  m3jdk21-pipeline-paged__patch-module-contract:
    name: "M3JDK21 paged pipeline private-atom proof / patch-module-contract"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-pipeline-paged'] }}"
