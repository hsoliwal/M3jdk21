  m3-jep485-stream-gatherers-optin__recipe-dag-proof:
    name: "M3 JEP 485 opt-in Stream Gatherers proof / recipe-dag-proof"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jep485-stream-gatherers-optin'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JEP 485 opt-in Stream Gatherers proof-${{ github.ref }}-recipe-dag-proof"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: 2 - Materializer syntax and unit proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             m3/backports/recipes/jep-485-gatherers/materialize.py             m3/backports/recipes/jep-485-gatherers/test_materialize.py
          python3 m3/backports/recipes/jep-485-gatherers/test_materialize.py


      - name: 4 - Prove Java21 identity policy remains opt-in
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          catalogue = Path("m3/backports/JEP_CATALOGUE.tsv").read_text(encoding="utf-8").splitlines()
          priority = Path("m3/backports/POST21_PRIORITY_COMPATIBILITY.tsv").read_text(encoding="utf-8").splitlines()
          policy = Path("m3/backports/recipes/jep-485-gatherers/POLICY.tsv").read_text(encoding="utf-8").splitlines()

          catalogue_rows = [line.split("\t") for line in catalogue[1:] if line.startswith("24\t485\t")]
          assert len(catalogue_rows) == 1, catalogue_rows
          assert catalogue_rows[0][4] == "candidate", catalogue_rows[0]

          jep = [line.split("\t") for line in priority[1:] if line.startswith("485\t")]
          assert len(jep) == 1, jep
          row = jep[0]
          assert row[3] == "OPT_IN_SE_API_EXTENSION", row
          assert row[4] == "NO", row

          packet = [line.split("\t") for line in policy[1:] if line.strip()]
          assert packet == [[
              "485",
              "OPT_IN_SE_API_EXTENSION",
              "NO",
              "LIBRARY_API",
              "EXPLICIT_CONTRACT_CHANGE",
              "false",
          ]], packet
          PY

      - name: Prepare exact historical packet input
        shell: bash
        run: python3 -S m3/migration/prepare_immutable_inputs.py --root .

      - name: Build and install the complete DAG dependency reactor
        run: mvn -B -ntp -f m3/pom.xml -pl tooling/backport-dag -am install

      - name: 5 - Validate packet and atom evidence
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=jdk.m3.tooling.dag.BackportPacketMain             -Dexec.args="$PWD/m3/backports/recipes/jep-485-gatherers/packet.tsv $PWD/m3/backports/recipes/jep-485-gatherers/atom-evidence.tsv"             exec:java

      - name: 6 - Project exact packet to Camel Airflow and Drools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep485-projection
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=jdk.m3.tooling.dag.OrchestrationProjectionMain             -Dexec.args="$PWD/m3/backports/recipes/jep-485-gatherers/packet.tsv $PWD/target/jep485-projection $PWD/m3/backports/recipes/jep-485-gatherers/atom-evidence.tsv"             exec:java
          test -s target/jep485-projection/M3BackportRoutes.java
          test -s target/jep485-projection/m3_backport_dag.py
          test -s target/jep485-projection/m3_backport_rules.drl
          test -s target/jep485-projection/atom-evidence.tsv

      - name: 7 - Verify backport metadata
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/backports/pom.xml verify
          python3 m3/backports/program_status.py --root .             --json-out target/jep485-program-status.json             --tsv-out target/jep485-program-status.tsv

      - name: 8 - Upload recipe DAG evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jep485-optin-recipe-dag-${{ github.run_id }}
          path: |
            target/jep485-projection
            m3/backports/recipes/jep-485-gatherers/POLICY.tsv
            target/jep485-program-status.json
            target/jep485-program-status.tsv
          if-no-files-found: warn
          retention-days: 30

  m3-jep485-stream-gatherers-optin__openjdk-proof:
