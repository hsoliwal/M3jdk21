        with:
          distribution: temurin
          java-version: '21'
      - name: Confirm exact original owner and donor fixture SHA256
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          expected = {
              "src/java.base/share/classes/jdk/internal/m3/IndexedArray.java": "90f9c573c48319d1811fd5a663d6690b075c45ab257c8a80256f9beccdf6b791",
              "test/jdk/jdk/internal/m3/IndexedArrayGrowthAgent.java": "0a1957ea4c6db007f13ab9d1ef669e2334eb2dc7121fcc4c0d16602e843aead3",
              "test/jdk/jdk/internal/m3/IndexedArrayGrowthFailureTest.java": "3cffeb6f2352e20cbdfa7843b29d6372181d78aff6eed305939c3497315aa750",
              "test/jdk/jdk/internal/m3/IndexedArrayGrowthFault.java": "f4f28798f4ef81eb8f49fefb972b90d9daa15b7ff5255515efe6e0ceaf8541a0",
          }
          for filename, target in expected.items():
              path = Path(filename)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"OWNER_OR_TEST_MISSING: {filename}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != target:
                  raise SystemExit(f"OWNER_OR_TEST_DRIFT: {filename}: {digest}")
              print("SOURCE_SEAL_OK", filename)
          PY
      - name: Compile original JDK-owned array/view sources into java.base patch
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-atomic-growth"
          mkdir -p "$out/patch" "$out/test" "$out/src/jdk/internal/m3"
          # Copy only the two SHA-audited original JDK sources into an isolated
          # patch input. The full JDK source root would pull unrelated JDK
          # sources into javac and fail strict lint for out-of-scope code.
          cp src/java.base/share/classes/jdk/internal/m3/IndexedArray.java "$out/src/jdk/internal/m3/"
          cp src/java.base/share/classes/jdk/internal/m3/IndexedView.java "$out/src/jdk/internal/m3/"
          javac -source 21 -target 21 -proc:none -Xlint:all -Werror \
            --patch-module java.base="$out/src" \
            -d "$out/patch" \
            "$out/src/jdk/internal/m3/IndexedArray.java" \
            "$out/src/jdk/internal/m3/IndexedView.java"
      - name: Compile original 21-site fault injection and existing indexed view oracles
