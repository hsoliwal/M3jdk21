          javac -source 21 -target 21 -proc:none -Xlint:all,-serial -Werror \
            --patch-module java.base="$out/patch" \
            --add-exports java.base/jdk.internal.m3=ALL-UNNAMED \
            --add-exports java.base/jdk.internal.org.objectweb.asm=ALL-UNNAMED \
            -d "$out/test" \
            test/jdk/jdk/internal/m3/IndexedArrayGrowthAgent.java \
            test/jdk/jdk/internal/m3/IndexedArrayGrowthFailureTest.java \
            test/jdk/jdk/internal/m3/IndexedArrayGrowthFault.java \
            test/jdk/jdk/internal/m3/IndexedArrayTest.java \
            test/jdk/jdk/internal/m3/StateMaskedIndexedViewTest.java
      - name: Package original Java agent/bootstrap fault hook
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-atomic-growth"
