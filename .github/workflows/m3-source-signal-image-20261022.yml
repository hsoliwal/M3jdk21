# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 source-time typed signal CSR Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalRelations.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SourceSignalImage*.java'
      - 'm3/collections/qualification/source-signal-image-20261022/**'
      - '.github/workflows/m3-source-signal-image-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  actual-javac-source-to-primitive-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source custody, diff hygiene and package identity
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/m3/typed-signal-columns-20261022...HEAD
          bash m3/collections/qualification/source-signal-image-20261022/verify.sh
      - name: Compile M3JDK21 owning source and run strict seeded Java21 differential
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-compiler-image"
          mkdir -p "$out/classes" "$out/plugin/META-INF/services" "$out/fixture-classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/test/java/com/m3/collections/M3SourceSignalImageSelfTest.java
          java -cp "$out/classes" com.m3.collections.M3SourceSignalImageSelfTest
      - name: Compile actual existing javac M3SourceSignals plugin and produce attributed S/T/E
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-compiler-image"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/plugin" \
            m3/compiler/source-signals/src/main/java/com/m3/compiler/signals/M3SourceSignalPlugin.java
          cp m3/compiler/source-signals/src/main/resources/META-INF/services/com.sun.source.util.Plugin \
            "$out/plugin/META-INF/services/com.sun.source.util.Plugin"
          mkdir -p "$out/demo"
          cat > "$out/demo/Example.java" <<'JAVA'
          package demo;
          class Example {
              static void run() { new Target().run(); }
          }
          class Target { void run() { } }
          JAVA
          javac --release 21 -proc:none -processorpath "$out/plugin" \
            "-Xplugin:M3SourceSignals out=$out/facts.tsv include=all" \
            -d "$out/fixture-classes" "$out/demo/Example.java"
          test -s "$out/facts.tsv"
          java -cp "$out/classes" com.m3.collections.M3SourceSignalImageSelfTest \
            "$out/facts.tsv"

  original-reuse-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Original javac source-signal producer tests
        run: >
          mvn -B -ntp -f m3/compiler/source-signals/pom.xml test
      - name: Source-build exact M3JDK21 JUnit 5.10.2 custom Maven artifact
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py \
            m3/vendor/third_party/junit-jupiter-5.10.2/target/junit-jupiter-5.10.2-m3-source-1.jar
      - name: Original M3 collections typed-signal and CSR tests
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3SignalColumnsTest,M3SignalDimensionsTest,M3SourceSignalImageTest
          test
