name: M3 A3 SourceFile type and custody
on:
  pull_request:
    paths:
      - 'm3/synexia-import/pure-int-recipe-custody/**'
      - '.github/workflows/m3-a3-sourcefile-typing-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sourcefile-typing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            m3/synexia-import/pure-int-recipe-custody
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: m3/synexia-import/pure-int-recipe-custody/pom.xml
      - name: Compile full custody owner and run existing A3 tests
        run: mvn -B -ntp -f m3/synexia-import/pure-int-recipe-custody/pom.xml -Dtest=M3Jdk21A3SourceSealedRecipeTest -Dsurefire.failIfNoSpecifiedTests=true test
