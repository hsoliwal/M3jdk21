name: M3File reverse impact Java21
on:
  pull_request:
    paths:
      - 'm3/file/**'
      - 'src/jdk.m3.collections/**'
      - '.github/workflows/m3-file-build-impact-20261020.yml'
  push:
    paths:
      - 'm3/file/**'
      - 'src/jdk.m3.collections/**'
      - '.github/workflows/m3-file-build-impact-20261020.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  array-graph-contract:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Full M3File module and source/binary reverse impact contracts
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/m3-file-impact-dependencies"
          bash m3/file/compile-dependencies.sh "$JAVA_HOME" "$deps"
          python3 m3/file/verify.py --java-home "$JAVA_HOME" --module-path "$deps" --output "$RUNNER_TEMP/m3-file-impact-suite"
