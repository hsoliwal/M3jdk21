name: M3 long sorted snapshot recipe and Java21 contract

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongSortedSnapshot.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongSortedSnapshotSelfTest.java'
      - 'm3/collections/snapshot-recipe-20261017/**'
      - 'm3/collections/qualification/sorted-snapshot-20261017/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3long-sorted-snapshot-20261017/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3long-sorted-snapshot-20261017.yml'
      - '.github/workflows/m3-long-sorted-snapshot-20261017.yml'
  workflow_dispatch:

jobs:
  exact-source-and-java21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source/template SHA-256 and no inherited source modification
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path('m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3long-sorted-snapshot-20261017')
          rows=[x.split('\t') for x in (root/'manifest.tsv').read_text().splitlines() if x and not x.startswith('#')]
          assert len(rows)==2
          for path,before,after,template in rows:
              target=Path(path)
              expected=(root/template).read_bytes()
              assert before=='ABSENT' and sha256(expected).hexdigest()==after,(path,'template drift')
              assert target.read_bytes()==expected,(path,'installed source mismatch')
              print('SEALED_POSTIMAGE',path,after)
          PY
      - name: Compile exact M3 collection owners and standalone JDK21 oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/m3-snapshot-javac
          javac --release 21 -proc:none -Xlint:all -Werror \
            -sourcepath m3/collections/src/main/java:m3/collections/src/test/java \
            -d target/m3-snapshot-javac \
            m3/collections/src/main/java/com/m3/collections/M3LongSortedSnapshot.java \
            m3/collections/src/test/java/com/m3/collections/M3LongSortedSnapshotSelfTest.java
          java -cp target/m3-snapshot-javac com.m3.collections.M3LongSortedSnapshotSelfTest
          java -Xint -cp target/m3-snapshot-javac com.m3.collections.M3LongSortedSnapshotSelfTest
      - name: Execute the actual Maven/OpenRewrite LST recipe and JUnit fixed-point gates
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/snapshot-recipe-20261017/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3long-sorted-snapshot-proof
          path: |
            m3/collections/snapshot-recipe-20261017/target/surefire-reports/**
          if-no-files-found: ignore
