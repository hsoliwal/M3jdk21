name: M3 four-library receiver admission
on:
  pull_request:
    branches: [master]
    paths:
      - 'm3/collections/interop/**'
      - 'm3/collections/src/main/java/**'
      - 'm3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java'
      - '.github/workflows/m3-collections-interop-receiving.yml'
  push:
    branches: [aix/m3-collections-interop-receiving-20261015]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-interop-receiving-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  receiver-recipe-and-contracts:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            m3/collections
            m3/tooling/migration-recipes
      # Prove the 36 historical owners at their real authoring commit, without
      # relaxing the immutable current-census-20261017 source verifier.
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/M3jdk21
          ref: a720780b1a5ab41ea27182b9b7ad873efdf533b4
          path: historical-product
          sparse-checkout: |
            m3/collections/interop
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Identify exact head and verify admitted production postimages
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/core-classes/META-INF
          { git rev-parse HEAD; uname -m; java -version 2>&1; mvn -version; } > proof/identity.txt
          ENGINE=m3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java
          test "$(git hash-object "$ENGINE")" = 05e02169c7429183107a99c60e1aad05b4d73b5f
          python3 -m unittest discover -s m3/collections/interop/qualification/current-census-20261017 -p 'test_*.py' -v 2>&1 | tee proof/census-tests.log
          python3 -m unittest discover -s m3/collections/interop/qualification/current-census-superset-20261022 -p 'test_*.py' -v 2>&1 | tee proof/superset-census-tests.log
          python3 m3/collections/interop/qualification/current-census-superset-20261022/verify_superset.py --product . --historical-product historical-product | tee proof/admitted-postimages.tsv
      - name: Run all six actual recipe proofs before delivery
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/recipe/pom.xml test 2>&1 | tee proof/recipe.log
          cp -R m3/collections/interop/recipe/target/surefire-reports proof/recipe-all-six
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          reports = list(Path('proof/recipe-all-six').glob('TEST-*.xml'))
          assert reports, 'missing actual recipe reports'
          roots = [E.parse(path).getroot() for path in reports]
          totals = {k: sum(int(r.attrib.get(k, 0)) for r in roots) for k in ('tests', 'failures', 'errors', 'skipped')}
          assert totals == {'tests': 6, 'failures': 0, 'errors': 0, 'skipped': 0}, totals
          print('RECIPE_EXECUTED', totals)
          PY
      - name: Reprove original five-file recipe in isolation and current exact successor
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/recipe/pom.xml \
            '-Dtest=M3CollectionsLibraryInteropTest#exactOutputsFixedPointAndOptionalMaterialization' \
            test 2>&1 | tee proof/recipe-delivery.log
          python3 m3/collections/interop/qualification/current-census-superset-20261022/verify_superset.py --product . --historical-product historical-product > proof/current-successor-ledger.tsv
          cat m3/collections/interop/recipe-receipt.tsv | tee proof/recipe-receipt.tsv
          git diff --exit-code -- m3/collections/interop/src m3/collections/interop/recipe-receipt.tsv
      - name: Compile unchanged M3 core and verify the dependency boundary
        shell: bash
        run: |
          set -euxo pipefail
          find m3/collections/src/main/java -name '*.java' | sort > proof/core-sources.txt
          sha256sum $(cat proof/core-sources.txt) > proof/core-source-hashes.txt
          javac --release 21 -Xlint:all,-module -Werror -d proof/core-classes @proof/core-sources.txt 2>&1 | tee proof/core-compile.log
          cp m3/collections/{LICENSE,NOTICE,provenance.json,name-mapping.json} proof/core-classes/META-INF/
          jar --create --file proof/m3-collections.jar -C proof/core-classes .
          jdeps --print-module-deps proof/m3-collections.jar | tee proof/core-module-deps.txt
          test "$(cat proof/core-module-deps.txt)" = java.base
          JAR="$GITHUB_WORKSPACE/proof/m3-collections.jar"
          (cd "$RUNNER_TEMP" && mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$JAR" -DgroupId=com.m3 -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true)
      - name: Compile and execute exactly the complete indexed five-library JUnit corpus
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml verify 2>&1 | tee proof/interop.log
          python3 -m unittest discover \
            -s m3/collections/interop/qualification/runtime-junit-census-20261022 \
            -p 'test_verify_surefire.py' -v 2>&1 | tee proof/junit-negative-controls.log
          python3 m3/collections/interop/qualification/runtime-junit-census-20261022/verify_surefire.py \
            --product . \
            --receipts m3/collections/interop/qualification/runtime-junit-census-20261022/receipts \
            --reports m3/collections/interop/target/surefire-reports \
            | tee proof/junit-complete-source-method-census.log
          javap -classpath m3/collections/interop/target/m3-collections-interop-0.1.0-SNAPSHOT.jar \
            com.m3.collections.interop.M3LibraryCollections \
            com.m3.collections.interop.M3LibraryCollectors \
            com.m3.collections.interop.M3SpringMultiValueMap > proof/interop-public-api.txt
          git diff --exit-code -- m3/collections/src/main/java m3/tooling/migration-recipes/src/main/java m3/collections/interop/src
      - name: Preserve actual resolved runtime dependency closure and hashes
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.6.1:copy-dependencies \
            -DincludeScope=runtime -DprependGroupId=true \
            -DoutputDirectory="$GITHUB_WORKSPACE/proof/runtime-dependencies" 2>&1 | tee proof/runtime-dependencies.log
          find proof/runtime-dependencies -type f -name '*.jar' | sort | xargs sha256sum > proof/runtime-dependency-sha256.txt
          test -s proof/runtime-dependency-sha256.txt
      - name: Preserve exact admitted sources and executed reports including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-interop-receiver-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/interop/recipe/target/surefire-reports/
            m3/collections/interop/recipe-receipt.tsv
            m3/collections/interop/src/
            m3/collections/interop/target/
