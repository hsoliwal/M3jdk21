name: M3 long path JNI Java21 C17 differential
on:
  pull_request:
    paths:
      - 'm3/collections/qualification/m3-long-index-path-jni-20261018/**'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexPathMasks.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongIndexPathMasksJNI.java'
      - 'src/jdk.m3.collections/share/native/libm3collections/collections/m3_long_index_path_masks_jni.c'
      - 'test/jdk/jdk/m3/collections/M3LongIndexPathMasksJNISelfTest.java'
      - '.github/workflows/m3-long-index-path-jni-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            m3/collections
            src/jdk.m3.collections/share
            test/jdk/jdk/m3/collections
            test/jdk/jdk/internal/m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify merged Java oracle has unchanged identity
        shell: bash
        run: |
          set -euo pipefail
          JAVA_OWNER=src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongIndexPathMasks.java
          # FLLDCIM: MRL - p2-057-20261107 P2: re-pinned to the census2 P2-057 owner (was 278f63e3bdc6)
          test "$(git hash-object "$JAVA_OWNER")" = 58c87920ae0f02328dcb0281a5cea90e6625e4e0
      - name: Build canonical source-sealed Maven generator
        shell: bash
        run: |
          set -euo pipefail
          CRATE=m3/collections/qualification/m3-long-index-path-jni-20261018/recipe
          mvn -B -ntp -f "$CRATE/pom.xml" -DskipTests package
          java -cp "$CRATE/target/classes" jdk.internal.m3.M3LongIndexPathJNIRecipe --check . "$CRATE/templates"
          FRESH="$RUNNER_TEMP/source-sealed-fresh"
          mkdir -p "$FRESH"
          java -cp "$CRATE/target/classes" jdk.internal.m3.M3LongIndexPathJNIRecipe --apply "$FRESH" "$CRATE/templates"
          java -cp "$CRATE/target/classes" jdk.internal.m3.M3LongIndexPathJNIRecipe --check "$FRESH" "$CRATE/templates"
          java -cp "$CRATE/target/classes" jdk.internal.m3.M3LongIndexPathJNIRecipe --apply "$FRESH" "$CRATE/templates"
          cmp "$CRATE/templates/M3LongIndexPathMasksJNI.java" "$FRESH/src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongIndexPathMasksJNI.java"
          cmp "$CRATE/templates/M3LongIndexPathMasksJNISelfTest.java" "$FRESH/test/jdk/jdk/m3/collections/M3LongIndexPathMasksJNISelfTest.java"
          cmp "$CRATE/templates/m3_long_index_path_masks_jni.c" "$FRESH/src/jdk.m3.collections/share/native/libm3collections/collections/m3_long_index_path_masks_jni.c"
          printf '\n// deliberate drift\n' >> "$FRESH/src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongIndexPathMasksJNI.java"
          if java -cp "$CRATE/target/classes" jdk.internal.m3.M3LongIndexPathJNIRecipe --check "$FRESH" "$CRATE/templates"; then
            echo 'ERROR: changed generated source was accepted' >&2
            exit 1
          fi
      - name: Strict Java21 compile and reference tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-long-path-jni"
          mkdir -p "$OUT/classes" "$OUT/headers"
          MAIN=src/jdk.m3.collections/share/classes/jdk/m3/collections
          TEST=test/jdk/jdk/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror -h "$OUT/headers" -d "$OUT/classes" \
            "$MAIN/M3IndexPathMasks.java" \
            "$MAIN/M3LongIndexPathMasks.java" "$MAIN/M3LongIndexPathMasksJNI.java" \
            "$TEST/M3LongIndexPathMasksSelfTest.java" "$TEST/M3LongIndexPathMasksJNISelfTest.java"
          java -Xcheck:jni -cp "$OUT/classes" jdk.m3.collections.M3LongIndexPathMasksSelfTest
          java -Xcheck:jni -cp "$OUT/classes" jdk.m3.collections.M3LongIndexPathMasksJNISelfTest
      - name: Real JNI parity and undefined-behavior sanitizer
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-long-path-jni"
          SRC=src/jdk.m3.collections/share/native/libm3collections/collections/m3_long_index_path_masks_jni.c
          JDK_HOME=$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")
          gcc -std=c17 -fPIC -shared -O2 -Wall -Wextra -Wconversion -Wshadow -Werror -pedantic \
            -I"$JDK_HOME/include" -I"$JDK_HOME/include/linux" \
            -o "$OUT/libm3_collections_long_path_masks.so" "$SRC"
          java -Xcheck:jni -Djava.library.path="$OUT" -cp "$OUT/classes" \
            jdk.m3.collections.M3LongIndexPathMasksJNISelfTest --native
          gcc -std=c17 -fPIC -shared -O1 -Wall -Wextra -Wconversion -Wshadow -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JDK_HOME/include" -I"$JDK_HOME/include/linux" \
            -o "$OUT/libm3_collections_long_path_masks.so" "$SRC"
          java -Xcheck:jni -Djava.library.path="$OUT" -cp "$OUT/classes" \
            jdk.m3.collections.M3LongIndexPathMasksJNISelfTest --native
