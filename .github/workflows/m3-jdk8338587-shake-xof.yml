# SPDX-License-Identifier: GPL-2.0-with-classpath-exception
name: M3 JDK-8338587 SHAKE XOF candidate

on:
  push:
    branches:
      - 'm3/materialize-jdk8338587-shake-xof-20261007'
    paths:
      - 'src/java.base/share/classes/sun/security/provider/SHA3.java'
      - 'test/jdk/sun/security/provider/MessageDigest/SHAKEXofCompatibility.java'
      - 'm3/backports/recipes/jdk-8338587-shake-xof/**'
      - 'm3/backports/recipes/j496/**'
      - 'm3/backports/recipes/j497/**'
      - 'm3/backports/JEP_RESIDUE_QUEUE.tsv'
      - 'm3/backports/test_jep_residue.py'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jdk8338587ShakeXofBackportRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jdk8338587ShakeXofBackportRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk24-jdk8338587-shake-xof/**'
      - '.github/workflows/m3-jdk8338587-shake-xof.yml'
  pull_request:
    paths:
      - 'src/java.base/share/classes/sun/security/provider/SHA3.java'
      - 'test/jdk/sun/security/provider/MessageDigest/SHAKEXofCompatibility.java'
      - 'm3/backports/recipes/jdk-8338587-shake-xof/**'
      - 'm3/backports/recipes/j496/**'
      - 'm3/backports/recipes/j497/**'
      - 'm3/backports/JEP_RESIDUE_QUEUE.tsv'
      - 'm3/backports/test_jep_residue.py'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jdk8338587ShakeXofBackportRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jdk8338587ShakeXofBackportRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk24-jdk8338587-shake-xof/**'
      - '.github/workflows/m3-jdk8338587-shake-xof.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-and-residue-proof:
    if: ${{ !contains(github.event.head_commit.message || '', '[m3-shake-proofed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check

      - name: 2 - SHAKE recipe JUnit and fixed-point proof
        run: >-
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3Jdk8338587ShakeXofBackportRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: 3 - Released JEP residue denominator remains derived
        run: python3 -m unittest m3/backports/test_jep_residue.py

  jdk-shake-proof:
    if: ${{ !contains(github.event.head_commit.message || '', '[m3-shake-proofed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install focused OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: Configure Java 21 receiver
        shell: bash
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: Build JDK image
        run: make JOBS=2 images

      - name: SHAKE XOF compatibility and known-answer jtreg
        run: >-
          make JOBS=2 test
          TEST="test/jdk/sun/security/provider/MessageDigest/SHAKEXofCompatibility.java"

      - name: Existing SHA3 digest regression
        run: >-
          make JOBS=2 test
          TEST="test/jdk/sun/security/provider/MessageDigest/SHA3.java"

      - name: Candidate tree remains clean after proof
        run: git diff --exit-code --check


  current-tree-receipt:
    if: \${{ github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[m3-shake-proofed]') }}
    needs:
      - recipe-and-residue-proof
      - jdk-shake-proof
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Re-prove source-sealed SHAKE recipe before receipt mutation
        run: >-
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3Jdk8338587ShakeXofBackportRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: Ratify dependency proof into current-tree receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          path = Path("m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv")
          updates = {
              "current_tree_state": "CANDIDATE_MATERIALIZED_PROVED",
              "recipe_junit": "PASS",
              "openjdk_image_build": "PASS",
              "shake_jtreg": "PASS",
              "sha3_regression": "PASS",
              "fixed_point": "PASS",
              "promotion": "NOT_AUTHORIZED",
              "next_action": "CANONICAL_READBACK_THEN_UNBLOCK_JEP496_JEP497_DEPENDENTS",
              "proof_head": os.environ["GITHUB_SHA"],
              "proof_run": os.environ["GITHUB_RUN_ID"],
              "proof_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }
          rows=[]
          seen=set()
          for line in path.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              key,value=line.split("\t",1)
              if key in updates:
                  value=updates[key]
                  seen.add(key)
              rows.append((key,value))
          for key in ("proof_head","proof_run","proof_attempt"):
              if key not in seen:
                  rows.append((key,updates[key]))
          path.write_text(
              "".join(f"{key}\t{value}\n" for key,value in rows),
              encoding="utf-8")
          PY
          git diff --check
          grep -F $'current_tree_state\tCANDIDATE_MATERIALIZED_PROVED' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'recipe_junit\tPASS' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'openjdk_image_build\tPASS' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'shake_jtreg\tPASS' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'sha3_regression\tPASS' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'fixed_point\tPASS' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'promotion\tNOT_AUTHORIZED' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv

      - name: Commit only the proven dependency receipt
        shell: bash
        env:
          BRANCH_NAME: \${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          git diff --cached --check
          git config user.name "m3-recipe-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "m3: ratify SHAKE XOF proof [m3-shake-proofed]"
          git push origin "HEAD:$BRANCH_NAME"

  canonical-readback:
    if: \${{ contains(github.event.head_commit.message || '', '[m3-shake-proofed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify source-bound recipe remains fixed and receipt is non-promoting
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3Jdk8338587ShakeXofBackportRecipeTest \
            -Dsurefire.failIfNoSpecifiedTests=false \
            test
          grep -F $'current_tree_state\tCANDIDATE_MATERIALIZED_PROVED' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'fixed_point\tPASS' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'promotion\tNOT_AUTHORIZED' m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          git diff --exit-code
          test -z "$(git status --porcelain=v1 -uall)"
