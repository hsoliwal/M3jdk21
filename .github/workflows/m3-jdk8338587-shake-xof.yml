# SPDX-License-Identifier: GPL-2.0-with-classpath-exception
name: M3 JDK-8338587 SHAKE XOF candidate

on:
  push:
    branches:
      - 'm3/jdk8338587-shake-*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Validate workflow through canonical Synexia owner
        shell: bash
        run: |
          set -euo pipefail
          SYNEXIA="$RUNNER_TEMP/synexia-recipe-owner"
          git init -q "$SYNEXIA"
          git -C "$SYNEXIA" remote add origin https://github.com/hsoliwal/com.synexia.git
          git -C "$SYNEXIA" -c protocol.version=2 fetch -q --depth=1 origin 0f0f9965092955c15f5c32f5eb102137fd0dbf8e
          test "$(git -C "$SYNEXIA" rev-parse FETCH_HEAD)" = "0f0f9965092955c15f5c32f5eb102137fd0dbf8e"
          java "$SYNEXIA/synexia-code-convergence/tools/WorkflowStructureCheck.java"             .github/workflows/m3-jdk8338587-shake-xof.yml
      - name: Diff hygiene
        run: git diff --check
      - name: SHAKE recipe JUnit and fixed point
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3Jdk8338587ShakeXofBackportRecipeTest             -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Released JEP residue denominator
        run: python3 -m unittest m3/backports/test_jep_residue.py

  jdk-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install OpenJDK prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev
      - name: Configure Java21 receiver
        shell: bash
        run: |
          set -euo pipefail
          bash configure             --with-boot-jdk="$JAVA_HOME"             --with-debug-level=release             --with-jvm-variants=server             --disable-warnings-as-errors
      - name: Build JDK image
        run: make JOBS=2 images
      - name: SHAKE XOF compatibility jtreg
        run: make JOBS=2 test TEST="test/jdk/sun/security/provider/MessageDigest/SHAKEXofCompatibility.java"
      - name: Existing SHA3 digest regression
        run: make JOBS=2 test TEST="test/jdk/sun/security/provider/MessageDigest/SHA3.java"
      - name: Candidate tree remains clean
        run: git diff --exit-code --check
