name: M3 JDK-8338587 SHAKE XOF recipe proof

on:
  pull_request:
    paths:
      - "m3/backports/recipes/jdk-8338587-shake-xof/**"
      - "m3/backports/recipes/j496/**"
      - "m3/backports/recipes/j497/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jdk8338587ShakeXofBackportRecipe.java"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jdk8338587ShakeXofBackportRecipeTest.java"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk24-jdk8338587-shake-xof/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/scope/M3RecipeScopeRegistry.java"
      - "m3/tooling/recipe-catalogue.tsv"
      - ".github/workflows/m3-jdk8338587-shake-xof.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check

      - name: 2 - Compile and prove XOF recipe
        run: >
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3Jdk8338587ShakeXofBackportRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false test

      - name: 3 - Residue and dependency receipts
        run: |
          set -euo pipefail
          python3 -m unittest m3/backports/test_jep_residue.py
          grep -F $'JDK-8338587 SHAKE/XOF\tRECIPE_CANDIDATE_UNVERIFIED'             m3/backports/recipes/j496/CURRENT_DEPENDENCY_STATE.tsv
          grep -F $'JDK-8338587 SHAKE/XOF\tRECIPE_CANDIDATE_UNVERIFIED'             m3/backports/recipes/j497/CURRENT_DEPENDENCY_STATE.tsv
