name: M3JDK21 affix/Strings exact Java21 receiver
on:
  push:
    branches: [m3/affix-strings-receiver-20261017]
  pull_request:
    paths:
      - "src/java.base/share/classes/java/lang/M3StringAffixPrecompute.java"
      - "src/java.base/share/classes/java/lang/M3StringRegexRowPrecompute.java"
      - "src/java.base/share/classes/java/util/Strings.java"
      - "test/jdk/java/lang/String/M3StringAffixPrecomputeTest.java"
      - "test/jdk/java/util/Strings/StringsContractTest.java"
      - "m3/runtime-integration/affix-strings-20261017/**"
      - ".github/workflows/m3-affix-strings-20261017.yml"
permissions:
  contents: read
jobs:
  source-extracted-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/java.base/share/classes/java/lang/M3StringAffixPrecompute.java
            src/java.base/share/classes/java/lang/M3StringRegexRowPrecompute.java
            src/java.base/share/classes/java/util/Strings.java
            test/jdk/java/lang/String/M3StringAffixPrecomputeTest.java
            test/jdk/java/util/Strings/StringsContractTest.java
            m3/runtime-integration/affix-strings-20261017/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Fail closed on source/review drift
        run: python3 m3/runtime-integration/affix-strings-20261017/verify_receiver.py
      - name: Execute exact source-extracted Java21 affix/regex and Strings contract oracles
        run: python3 m3/runtime-integration/affix-strings-20261017/run_java21_proof.py
      # This is not a full source-built M3JDK21 java.base, jtreg or JNI qualification.
