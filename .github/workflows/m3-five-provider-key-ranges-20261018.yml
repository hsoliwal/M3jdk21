name: M3 five-provider indexed key ranges recipe and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/interop/**'
      - '.github/workflows/m3-five-provider-key-ranges-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualifying-product:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            m3/tooling/migration-recipes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail closed on exact source templates and product postimages
        run: python3 m3/collections/interop/recipe/m3jdk21-five-provider-key-ranges-20261018/verify.py
      - name: Run existing Maven/OpenRewrite engine on real sealed fixture
        run: mvn -B -ntp -f m3/collections/interop/recipe/m3jdk21-five-provider-key-ranges-20261018/pom.xml clean test
      - name: Compile existing complete M3 collection owners strictly
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-core"
          find m3/collections/src/main/java -name '*.java' | sort > "$RUNNER_TEMP/m3-sources"
          javac --release 21 -proc:none -Xlint:all,-module -Werror -d "$RUNNER_TEMP/m3-core" @"$RUNNER_TEMP/m3-sources"
          jar --create --file "$RUNNER_TEMP/m3-core.jar" -C "$RUNNER_TEMP/m3-core" .
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file \
            -Dfile="$RUNNER_TEMP/m3-core.jar" -DgroupId=com.m3 \
            -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Compile and test actual five library interop interfaces
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Build existing C17 JNI mask selector unchanged
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3native"
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wsign-conversion -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/m3native/libm3_collections_mask.so"
      - name: Repeat new real-provider differential test with checked JNI
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveLibraryKeyRangesTest \
            "-DargLine=-Xcheck:jni -Djava.library.path=$RUNNER_TEMP/m3native" test
      - name: Require all new contract tests with no missing or skipped cases
        shell: bash
        run: |
          python3 - <<'PYTEST'
          import xml.etree.ElementTree as E
          from pathlib import Path
          root=Path('m3/collections/interop/target/surefire-reports')
          found=list(root.glob('TEST-*.M3FiveLibraryKeyRangesTest.xml'))
          assert len(found) == 1, 'missing actual new real-library test suite'
          suite=E.parse(found[0]).getroot()
          assert int(suite.get('tests','0')) == 3, suite.attrib
          assert all(int(suite.get(k,'0'))==0 for k in ('failures','errors','skipped')),suite.attrib
          print('M3_FIVE_PROVIDER_KEY_RANGES_CI_PASS')
          PYTEST
