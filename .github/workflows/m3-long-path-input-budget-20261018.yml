name: M3 long-path bounded-input Java21 JNI proof
on:
  pull_request:
    paths:
      - 'm3/collections/qualification/m3-long-path-input-budget-20261018/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongIndexPathBudget.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongIndexPathBudgetSelfTest.java'
      - '.github/workflows/m3-long-path-input-budget-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strict-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Maven source-admission recipe
        run: |
          set -euo pipefail
          ROOT=m3/collections/qualification/m3-long-path-input-budget-20261018/recipe
          mvn -B -ntp -f "$ROOT/pom.xml" package
          java -cp "$ROOT/target/classes" com.synexia.m3.M3LongPathInputBudgetRecipeSelfTest "$ROOT/templates"
          java -cp "$ROOT/target/classes" com.synexia.m3.M3LongPathInputBudgetRecipe --check . "$ROOT/templates"
      - name: Strict Java21 Java-only contract
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-budget-proof"
          mkdir -p "$OUT/classes" "$OUT/native"
          PKG=m3/collections/src/main/java/com/m3/collections
          TEST=m3/collections/src/test/java/com/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror -d "$OUT/classes" \
            "$PKG/M3LongIndexPathMasks.java" "$PKG/M3LongIndexPathMasksJNI.java" \
            "$PKG/M3LongIndexPathBudget.java" "$TEST/M3LongIndexPathBudgetSelfTest.java"
          java -cp "$OUT/classes" com.m3.collections.M3LongIndexPathBudgetSelfTest
      - name: Actual JNI Region parity and undefined-behavior sanitizer
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-budget-proof"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          SRC=m3/collections/src/main/native/collections/m3_long_index_path_masks_jni.c
          for MODE in strict ubsan; do
            case "$MODE" in
              strict) FLAGS='';;
              ubsan) FLAGS='-fsanitize=undefined -fno-sanitize-recover=undefined';;
            esac
            gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror -pedantic \
              -fPIC -shared $FLAGS -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
              -o "$OUT/native/libm3_collections_long_path_masks.so" "$SRC"
            java -Xcheck:jni -Djava.library.path="$OUT/native" -cp "$OUT/classes" \
              com.m3.collections.M3LongIndexPathBudgetSelfTest --native
          done
