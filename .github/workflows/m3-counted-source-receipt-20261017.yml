# SPDX-License-Identifier: Apache-2.0
name: M3 counted source identity successor recipe
on:
  push:
    branches: ["m3/writable-filtered-map-avl-receiver-20261017"]
  pull_request:
    paths:
      - ".github/workflows/m3-count-totals.yml"
      - ".github/workflows/m3-counted-continuation.yml"
      - ".github/workflows/m3-counted-source-receipt-20261017.yml"
      - "m3/collections/wrappers/counted-source-receipt-20261017/**"
      - "m3/collections/wrappers/workflow-pin-20261017/recipe/**"
jobs:
  exact-source-gate-and-text-lst:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate two exact after workflow Git identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object .github/workflows/m3-count-totals.yml)" = cb8786c3a4c62e400246f336c138988c0d069f99
          test "$(git hash-object .github/workflows/m3-counted-continuation.yml)" = 756460eeb4a001697d499eef9bd8008fb3a6b942
          test "$(git hash-object m3/collections/counts/recipe/pinned-engine/com/synexia/rewrite/M3HashPinnedTextSnapshotRecipe.java)" = 8bd6f399b298f364a41d53391ba2e72da4c5c635
      - name: Execute existing Maven OpenRewrite text recipe and refusal suite
        run: mvn -B -ntp -f m3/collections/wrappers/workflow-pin-20261017/recipe/pom.xml -Dtest=M3Jdk21CountedSourcePinRecipeTest test
