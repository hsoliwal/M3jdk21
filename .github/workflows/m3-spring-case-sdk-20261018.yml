# SPDX-License-Identifier: Apache-2.0
name: M3 Spring indexed-case SDK real recipe, providers and JNI
on:
  pull_request:
    paths:
      - "m3/collections/interop/src/main/java/com/m3/collections/interop/M3LibraryCollections.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3*SpringCaseInsensitive*.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3SdkFamiliesTest.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3LibraryBindingsSelfTest.java"
      - "m3/collections/interop/sdk-family-bindings.tsv"
      - "m3/collections/interop/SDK_FAMILIES.md"
      - "m3/collections/interop/qualification/spring-case-sdk-20261018/**"
      - ".github/workflows/m3-spring-case-sdk-20261018.yml"
  push:
    branches: [m3/spring-case-indexed-sdk-receiver-20261018]
permissions:
  contents: read
jobs:
  java21-recipe-interop-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source-sealed candidate and unchanged owners
        shell: bash
        run: |
          set -euxo pipefail
          python3 -S m3/collections/interop/qualification/spring-case-sdk-20261018/verify.py
      - name: Actual Maven/OpenRewrite Java LST and text recipe JUnit
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/qualification/spring-case-sdk-20261018/pom.xml test
      - name: Compile original M3 Java21 core and install focused source-built jar
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/core proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z |
            xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/core
          jar --create --file proof/m3-collections.jar -C proof/core .
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile=proof/m3-collections.jar -DgroupId=com.m3 -DartifactId=m3-collections \
            -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Run exact SDK/real five-provider JVM tests (Spring 6.2, Guava, Eclipse, Apache)
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3SpringCaseInsensitiveSdkFactoryTest,M3SpringCaseInsensitiveTest,M3SdkFamiliesTest test
      - name: Verify existing unchanged JNI primitive batch selector under Xcheck JNI
        shell: bash
        run: |
          set -euxo pipefail
          javac --release 21 -proc:none -h proof/native -cp proof/core -d proof/core \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all -shared -fPIC \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          javac --release 21 -proc:none -cp proof/core -d proof/core \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/core \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
          python3 -S m3/collections/interop/qualification/spring-case-sdk-20261018/verify.py
          git diff --exit-code
      - name: Preserve test receipts and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spring-case-sdk-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/interop/qualification/spring-case-sdk-20261018/target/surefire-reports/
            m3/collections/interop/target/surefire-reports/
