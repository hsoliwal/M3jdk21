name: M3JDK21 regex row bitmap receiver source proof
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/java/lang/M3StringRegexRowPrecompute.java'
      - 'test/jdk/java/lang/String/M3StringRegexRowPrecomputeTest.java'
      - 'm3/runtime-integration/regex-row-precompute/**'
      - '.github/workflows/m3-regex-row-precompute-20261016.yml'
permissions:
  contents: read
jobs:
  source-sealed-javabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict source seal, Java21 --patch-module and JDK Pattern oracle
        run: python3 m3/runtime-integration/regex-row-precompute/verify.py
