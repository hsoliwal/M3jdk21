name: M3JDK21 regex row bitmap receiver source proof
# Former triggers (below, as of the move) now start job(s) 'm3-regex-row-precompute-20261016__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/java.base/share/classes/java/lang/M3StringRegexRowPrecompute.java'
#         - 'test/jdk/java/lang/String/M3StringRegexRowPrecomputeTest.java'
#         - 'm3/runtime-integration/regex-row-precompute/**'
#         - '.github/workflows/m3-regex-row-precompute-20261016.yml'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-sealed-javabase:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict source seal, Java21 --patch-module and JDK Pattern oracle
        run: python3 m3/runtime-integration/regex-row-precompute/verify.py
