# SPDX-License-Identifier: Apache-2.0
name: M3 source-backed byte evidence query Java21 JNI
on:
  pull_request:
    paths:
      - 'm3/ports/capability-runtime/**'
      - '.github/workflows/m3-cpu-byte-evidence-query-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-source-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: m3/ports/capability-runtime
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java21 exact source evidence + existing C11 JNI
        run: |
          python3 m3/ports/capability-runtime/verify_native.py --root m3/ports/capability-runtime --out "$RUNNER_TEMP/m3-byte-evidence-proof" --developer-image
          grep -q 'M3_BYTE_EVIDENCE_QUERY_PASS' "$RUNNER_TEMP/m3-byte-evidence-proof/byte-evidence-java-oracle.log"
          grep -q 'M3_BYTE_EVIDENCE_QUERY_PASS' "$RUNNER_TEMP/m3-byte-evidence-proof/byte-evidence-jni-oracle.log"
          test -s "$RUNNER_TEMP/m3-byte-evidence-proof/REPORT.json"
      - name: Preserve actual Java/JNI/JMOD receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-byte-evidence-query-proof
          path: ${{ runner.temp }}/m3-byte-evidence-proof/
          if-no-files-found: error
  windows-source-evidence:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Allow long OpenJDK repository paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: m3/ports/capability-runtime
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java21 evidence oracle, no WSL
        shell: pwsh
        run: |
          python m3/ports/capability-runtime/verify_native.py --root m3/ports/capability-runtime --out "${{ runner.temp }}/m3-byte-evidence-java" --java-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
