# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 adaptive sparse IntLane JMH profiling
on:
  pull_request:
    paths:
      - 'src/jdk.m3.collections/share/classes/jdk/m3/arrays/IntLaneAlgorithms.java'
      - 'test/micro/org/openjdk/bench/jdk/m3/arrays/IntLaneSparseRange.java'
      - '.github/workflows/m3jdk-intlane-sparse-jmh.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-built-jmh:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout actual M3JDK21 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Check exact source and benchmark identities
        shell: bash
        run: |
          set -euo pipefail
          owner='src/jdk.m3.collections/share/classes/jdk/m3/arrays/IntLaneAlgorithms.java'
          benchmark='test/micro/org/openjdk/bench/jdk/m3/arrays/IntLaneSparseRange.java'
          printf '%s  %s\n' d3f78a046a3ff1d1bc27dfebdfd0e82f34de3bc8e9b604fb722c9a728ab77fd8 "$owner" | sha256sum --check -
          printf '%s  %s\n' 3f52e5043826e2da1841a9470ddb637112aaa0ac0e1380bbb28d24fd3e0f7efa "$benchmark" | sha256sum --check -
          grep -Fq 'exports jdk.m3.arrays;' src/jdk.m3.collections/share/classes/module-info.java
          echo 'M3_INTLANE_JMH_SOURCE_SEAL_PASS'
      - name: Install source-build BootJDK
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: Install supported native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-10 g++-10 make autoconf zip unzip \
            libxrandr-dev libxtst-dev libcups2-dev libasound2-dev \
            libfreetype6-dev libffi-dev zlib1g-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-10
      - name: Download and SHA-256-pin four JMH 1.37 artifacts
        shell: bash
        run: |
          set -euo pipefail
          jars="$GITHUB_WORKSPACE/build/jmh/jars"
          mkdir -p "$jars"
          base='https://repo.maven.apache.org/maven2'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$base/org/openjdk/jmh/jmh-core/1.37/jmh-core-1.37.jar" -o "$jars/jmh-core-1.37.jar"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$base/org/openjdk/jmh/jmh-generator-annprocess/1.37/jmh-generator-annprocess-1.37.jar" -o "$jars/jmh-generator-annprocess-1.37.jar"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$base/net/sf/jopt-simple/jopt-simple/5.0.4/jopt-simple-5.0.4.jar" -o "$jars/jopt-simple-5.0.4.jar"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 120 \
            "$base/org/apache/commons/commons-math3/3.6.1/commons-math3-3.6.1.jar" -o "$jars/commons-math3-3.6.1.jar"
          (cd "$jars" && cat <<'SHA256' | sha256sum --check --status
          dc0eaf2bbf0036a70b60798c785d6e03a9daf06b68b8edb0f1ba9eb3421baeb3  jmh-core-1.37.jar
          6a5604b5b804e0daca1145df1077609321687734a8b49387e49f10557c186c77  jmh-generator-annprocess-1.37.jar
          df26cc58f235f477db07f753ba5a3ab243ebe5789d9f89ecf68dd62ea9a66c28  jopt-simple-5.0.4.jar
          1e56d7b058d28b65abd256b8458e3885b674c1d588fa43cd7d1cbb9c7ef2b308  commons-math3-3.6.1.jar
          SHA256
          )
          echo 'M3_INTLANE_JMH_DEPENDENCIES_PINNED_PASS'
      - name: Configure and build source JDK with actual JMH support
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          test -x bootjdk/jdk/bin/java
          bash configure --with-conf-name=m3jdk21-intlane-jmh \
            --with-boot-jdk=bootjdk/jdk \
            --with-jmh="$GITHUB_WORKSPACE/build/jmh/jars" \
            --with-debug-level=release --with-zlib=system --with-skia=none --with-jobs=2
          make CONF=m3jdk21-intlane-jmh JOBS=2 LOG=info images
          image=build/m3jdk21-intlane-jmh/images/jdk
          test -x "$image/bin/java"
          "$image/bin/java" --list-modules | grep -Eq '^jdk\.m3\.collections($|@)'
      - name: Run actual JMH 64-case source-built benchmark
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          make CONF=m3jdk21-intlane-jmh JOBS=2 LOG=info test \
            TEST='micro:org.openjdk.bench.jdk.m3.arrays.IntLaneSparseRange.wholeRangeAddMaximum' \
            MICRO='FORK=1;WARMUP_ITER=2;WARMUP_TIME=1;ITER=3;TIME=1;RESULTS_FORMAT=csv'
          results='build/m3jdk21-intlane-jmh/test-results'
          test -d "$results"
          find "$results" -type f -name 'jmh-result.csv' -print | sort > "$RUNNER_TEMP/jmh-matches.txt"
          test -s "$RUNNER_TEMP/jmh-matches.txt"
          while IFS= read -r report; do
            test -s "$report"
            grep -Fq 'org.openjdk.bench.jdk.m3.arrays.IntLaneSparseRange.wholeRangeAddMaximum' "$report"
            matches=$(grep -Fc 'org.openjdk.bench.jdk.m3.arrays.IntLaneSparseRange.wholeRangeAddMaximum' "$report")
            test "$matches" -ge 64
            echo "M3_INTLANE_JMH_64_CASES_PASS count=$matches report=$report"
          done < "$RUNNER_TEMP/jmh-matches.txt"
      - name: Preserve actual JMH/installed-image result files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3jdk-intlane-source-built-jmh-results
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/m3jdk21-intlane-jmh/configure.log
            build/m3jdk21-intlane-jmh/build.log
            build/m3jdk21-intlane-jmh/test-results/
            build/m3jdk21-intlane-jmh/test-support/
