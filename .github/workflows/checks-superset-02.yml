concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: 'Superset gate'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 'Check out the gate files'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/checks-superset
          fetch-depth: 1
          filter: blob:none
      - name: 'Decide member workflows from triggers, branches and changed paths (plain git)'
        id: gate
        run: python3 .github/checks-superset/gate.py 02

  m3-intake-policy__verify:
    name: "M3 Synexia intake policy / verify"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-intake-policy'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 Synexia intake policy-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact workflow head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}"             -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"

      - name: Verify Synexia intake and direct-copy review inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REPO/m3/runtime-integration/verify-m3-intake.py" --repo "$REPO"

      - name: Prepare pinned JDK 21
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz'             -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n'             '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6'             "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"

  m3jdk21-backport-dag__dag-proof:
    name: "M3JDK21 Backport Recipe DAG / dag-proof"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-backport-dag'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 Backport Recipe DAG-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Bootstrap pinned source-built OpenRewrite and JUnit closure
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f "$PWD/m3/vendor/third_party/pom.xml" -pl rewrite-java-21,rewrite-test,junit-jupiter-5.10.2,junit-platform-launcher-1.10.2 -am -DskipTests install

      - name: Verify recipe substrate and DAG semantic kernel
        run: |
          mvn -B -ntp -f m3/pom.xml -pl tooling/backport-dag -am clean verify

      - name: Execute canonical DAG parser
        run: |
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=jdk.m3.tooling.dag.BackportDagMain             exec:java

      - name: Project sample packet to Camel Airflow and Drools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/m3-projection-smoke
          cat > target/m3-projection-smoke/packet.tsv <<'EOF'
          packet_id	atom_id	scope	scope_promotion_approved	work_ref	depends_on
          ci-projection	java	FILE	false	jdk.m3.rewrite.SampleJava	
          ci-projection	text	FILE	false	jdk.m3.rewrite.SampleText	
          ci-projection	join	PACKAGE	true	jdk.m3.rewrite.SampleJoin	java,text
          EOF
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=jdk.m3.tooling.dag.OrchestrationProjectionMain \
            -Dexec.args="$PWD/target/m3-projection-smoke/packet.tsv $PWD/target/m3-projection-smoke/out" \
            exec:java
          test -s target/m3-projection-smoke/out/M3BackportRoutes.java
          test -s target/m3-projection-smoke/out/m3_backport_dag.py
          test -s target/m3-projection-smoke/out/m3_backport_rules.drl
          test -s target/m3-projection-smoke/out/projection.tsv
          DAG_ROOT="$(tail -n 1 target/m3-projection-smoke/out/projection.tsv | cut -f2)"
          test "${#DAG_ROOT}" -eq 64
          grep -F "$DAG_ROOT" target/m3-projection-smoke/out/M3BackportRoutes.java
          grep -F "$DAG_ROOT" target/m3-projection-smoke/out/m3_backport_dag.py
          grep -F "$DAG_ROOT" target/m3-projection-smoke/out/m3_backport_rules.drl

      - name: Emit backport programme status
        run: |
          mvn -B -ntp -f m3/backports/pom.xml verify

      - name: Parse every packet; validate approved DAGs and report unapproved scope holds
        shell: bash
        run: |
          set -euo pipefail
          test -s m3/backports/target/backport-recipe-dag.tsv
          test -s m3/backports/target/backport-recipe-dag.json
          test -s m3/backports/target/backport-packets.tsv
          test -d m3/backports/target/backport-packets
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=jdk.m3.tooling.dag.BackportPacketBatchMain \
            -Dexec.args="$PWD/m3/backports/target/backport-packets" \
            exec:java

      - name: Upload backport status artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3jdk21-backport-status-${{ github.run_id }}
          path: |
            m3/backports/target/program-status.json
            m3/backports/target/program-status.tsv
            m3/backports/target/backport-recipe-dag.json
            m3/backports/target/backport-recipe-dag.tsv
            m3/backports/target/backport-packets.tsv
            m3/backports/target/backport-packets/**
            target/m3-projection-smoke/out/**
          if-no-files-found: error
          retention-days: 14

  m3-a3__a3-proof:
    name: "M3 A3 absorption proof / a3-proof"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-a3'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 A3 absorption proof-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Fetch exact workflow head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          curl --fail --location --retry 3             "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}"             -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"

      - name: Prepare pinned JDK 21
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz'             -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n'             '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6'             "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"

      # Standalone (2026-10-31): the A3 recipe export is absorbed. Its eight manifest-listed
      # sources, the export manifest and the export's seven unit tests are byte-identical under
      # m3/vendor/ (provenance: m3/vendor/m3/README.md); the reactor module
      # tooling/m3jdk-a3-recipes builds them into the same coordinate in the reactor step
      # below (-am) and runs the tests in its own step. No other repository is fetched
      # (decisions: m3/tooling/standalone/M3_REFS.tsv).
      - name: Verify absorbed A3 recipe export closure
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO/m3/vendor/m3/m3-openrewrite-recipes"
          sha256sum --check --strict - <<'CLOSURE'
          69104cee94e06e9d87aadac208140eddf585e0404385e9ee7ca40bc635a8eeba  src/main/java/jdk/internal/m3/rewrite/M3RecipeMasteryPortableReceipt.java
          4367a662ef19efd9193934778dae9ef6a58c31f45e76e9c8f3607e6f7dfa962e  src/main/java/jdk/internal/m3/rewrite/atom/M3AtomizePureIntReturnRecipe.java
          c8b90be60cace5aba0e00d438be09cb6348273a8229adf7b5df490a5c3ec6a50  src/main/java/jdk/internal/m3/rewrite/atom/M3DocumentPureIntAtomRecipe.java
          3f11b266e4bf7bb9a08cf43f6692ce3209f310059462dfe70eca56048809b01f  src/main/java/jdk/internal/m3/rewrite/atom/M3FileAtomCandidateTable.java
          923f15cef4b6b0ecc575cf1ad95a1fac3607f77bb111b9b87bd924b76d4b2c06  src/main/java/jdk/internal/m3/rewrite/atom/M3InventoryPureIntAtomCandidates.java
          eabca39453edaebc5b7f0e9aaaf12b900ba181e21dc5c8a08640abc7f0d0b6f7  src/main/java/jdk/internal/m3/rewrite/atom/M3PatternizePureIntAtomRecipe.java
          32b98c2eafaa8e4231dcded464a88f1560cebc71fb39d5d28934482af61b0043  src/main/java/jdk/internal/m3/rewrite/atom/M3PureIntAtomEligibility.java
          a6587bcc76d05b006757f8ded6da2c7d46bb23b521e2030b8b9d657b6a31cdf8  src/main/java/jdk/internal/m3/rewrite/atom/M3PureIntConvergenceRecipe.java
          2470fa652697645b0895b42eeca8c75e8df79e8f8637210a82bb2b20f4759303  src/main/resources/META-INF/m3/jdk-a3-recipe-export.tsv
          b2cceacde86886a6339ff1df9dcfb267bee589e23e800864b5507dea603a1f72  src/test/java/jdk/internal/m3/rewrite/M3JdkA3RecipeExportTest.java
