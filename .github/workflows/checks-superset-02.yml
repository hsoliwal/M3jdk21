                      if path.is_symlink() or path.stat().st_size>2*1024**2:raise RuntimeError("CLI output fence")
                      content=path.read_bytes()
                      if len(content)!=record[stream+"Bytes"] or hashlib.sha256(content).hexdigest()!=record[stream+"Sha256"]:raise RuntimeError("CLI output receipt drift")
              baseline_error=(root/"provider"/records_by_label["baseline-validate"]["stderrPath"]).read_text(encoding="utf-8")
              if "target hash drift: src/java.base/share/classes/jdk/internal/mindex/M3TQ.java" not in baseline_error or "missing file: m3-openrewrite-recipes/" not in baseline_error:raise RuntimeError("original baseline diagnostics absent")
              marker=(root/"provider"/records_by_label["current-validate"]["stdoutPath"]).read_text(encoding="utf-8")
              completion=(root/"provider"/records_by_label["current-complete"]["stderrPath"]).read_text(encoding="utf-8").splitlines()
              if marker!="MIGRATION_MANIFEST_VALID completion=INCOMPLETE\n" or len(completion)!=158:raise RuntimeError("unchanged completion boundaries lost")
              coverage=(root/"provider"/records_by_label["current-report"]["stdoutPath"]).read_text(encoding="utf-8")
              if "**INCOMPLETE**" not in coverage:raise RuntimeError("actual original coverage report not incomplete")
              final={"schema":"M3_ORIGINAL_MAPPING_PROVIDER_HOSTED_V1","runId":runid,"checkoutCommit":head,"canonicalSourceCommit":binding["sourceCommit"],"sdkTree":tree,"pinsSha256":hashlib.sha256(pins).hexdigest(),"commands":records,"providerReceiptSha256":hashlib.sha256(provider_receipt_path.read_bytes()).hexdigest(),"recipeReceiptSha256":hashlib.sha256((root/"recipe-execution.json").read_bytes()).hexdigest(),"baselineAfterProviderReceiptSha256":hashlib.sha256((root/"recipe-after-provider.json").read_bytes()).hexdigest(),"frozenPreBaseline":pre,"baselineVerifiedBeforeAndAfterProvider":True,"runtimeJniQualified":False,"matchedJdkQualified":False,"performanceRetentionQualified":False,"phaseAdvanced":False}
              (root/"hosted-receipt.json").write_text(json.dumps(final,indent=2)+"\n",encoding="utf-8")
          finally:
              # Never write failure artifacts until fresh reserve and planned-copy gates pass.
              tail=b""
              if log.is_file() and not log.is_symlink():
                  with log.open("rb") as f:f.seek(max(0,log.stat().st_size-32768));tail=f.read(32768)
              try:
                  before=gate(496*1024**2)
                  selected=[root/"recipe-execution.json",root/"recipe-after-provider.json",root/"hosted-receipt.json",source/"m3/migration/original-provider-20261017/source-binding.json",sdk/"src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text/m3-original-mapping-provider-20261017/baseline-pre.tsv"]
                  selected+=sorted(build.glob("surefire-reports/TEST-*.xml"))
                  selected+=sorted((root/"provider").glob("*.json"))
                  selected+=sorted((root/"provider-boundaries").glob("*.json"))
                  selected+=sorted((root/"provider").glob("*.md"))
                  selected+=sorted((root/"provider").glob("logs/*.stdout"))+sorted((root/"provider").glob("logs/*.stderr"))
                  selected=sorted(set(p for p in selected if p.is_file()),key=str)
                  if len(selected)>256 or any(any(x.is_symlink() for x in [p,*p.parents]) for p in selected):raise RuntimeError("closed artifact source fence")
                  planned=sum(p.stat().st_size for p in selected)+len(tail)
                  if planned>8*1024**2 or before+planned+1024**2>496*1024**2:raise RuntimeError("closed artifact budget")
              except BaseException:
                  print(tail.decode("utf-8",errors="replace"))
                  raise
              bundle=root/"artifacts";bundle.mkdir(exist_ok=False)
              inv={}
              for n,path in enumerate(selected):
                  gate(496*1024**2)
                  label=str(n).zfill(3)+"-"+path.name;shutil.copyfile(path,bundle/label)
                  inv[label]={"bytes":path.stat().st_size,"sha256":hashlib.sha256(path.read_bytes()).hexdigest(),"source":str(path.relative_to(root)) if root in path.parents else str(path.relative_to(source))}
              gate(496*1024**2)
              (bundle/"log-tail.txt").write_bytes(tail);print(tail.decode("utf-8",errors="replace"))
              (bundle/"inventory.json").write_text(json.dumps(inv,indent=2)+"\n",encoding="utf-8")
              (bundle/"commands.json").write_text(json.dumps(records,indent=2)+"\n",encoding="utf-8")
              print("Final aggregate bytes before artifact upload:",gate(496*1024**2))

          PY
      - name: Retain bounded original receipts and failure tail
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-original-provider-source
          TMPDIR: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  m3jdk21-tokenizer-full-image__integrated-image:
    name: "M3JDK21 tokenizer source-built image and jtreg / integrated-image"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-tokenizer-full-image'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 tokenizer source-built image and jtreg-${{ github.ref }}-${{ strategy.job-index }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        debug: [release, fastdebug]
    env:
      CONF: m3jdk21-tokenizer-${{ matrix.debug }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout integration tree without retained credentials
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact qualified production and jtreg outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tokenizer-receipts"
          {
            printf 'checkout='; git rev-parse HEAD
            printf 'event_head=%s\n' "$PR_HEAD"
            printf 'configuration=%s\n' "$CONF"
          } | tee "$RUNNER_TEMP/tokenizer-receipts/source.txt"
          source=src/java.base/share/classes/java/util/StringTokenizer.java
          test_source=test/jdk/java/util/StringTokenizer/NullDelimiterState8360045.java
          test "$(git hash-object "$source")" = c469e81420702a5feedcbc255cec938aefd966ea
          test "$(git hash-object "$test_source")" = 80fe4bf5c8db7b10d236506ab6d49bcd754657a4
          printf '%s  %s\n' f91ec29b40359a419bada579efed57cdcf63043e1f0b11d5c22da92d3ccf301f "$source" | sha256sum --check -
          printf '%s  %s\n' dcde80e8d253d2b9f74e14da70d0a9887301a2ea1e9c4fb9710ee6b16db432bd "$test_source" | sha256sum --check -
          test "$(git hash-object test/jdk/java/util/StringTokenizer/FormFeed.java)" = 09b3d9cd983b0cd92095a0f43a93efbba4aae54c
          test "$(git hash-object test/jdk/java/util/StringTokenizer/ResetPos.java)" = cfd051c9f15db79f1b8fa7e6b302731f13da7196
          test "$(git hash-object test/jdk/java/util/StringTokenizer/Supplementary.java)" = 7e9f00095b0856f5425c4630fdb098de08482cc9

      - name: Prepare repository jtreg builder
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reuse canonical BootJDK action
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64

      - name: Reuse canonical jtreg action
        uses: ./.github/actions/get-jtreg

      - name: Install Linux JDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-10 g++-10 make autoconf zip unzip \
            libxrandr-dev libxtst-dev libcups2-dev libasound2-dev \
            libfreetype6-dev libffi-dev zlib1g-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-10

      - name: Configure actual integrated M3JDK21
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          test -x bootjdk/jdk/bin/java
          test -x jtreg/installed/bin/jtreg
          bash configure --with-conf-name="$CONF" \
            --with-boot-jdk=bootjdk/jdk --with-jtreg=jtreg/installed \
            --with-debug-level='${{ matrix.debug }}' --with-zlib=system --with-jobs=2

      - name: Build actual java.base, HotSpot and complete JDK image
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          make CONF="$CONF" JOBS=2 LOG=info images
          image="build/$CONF/images/jdk"
          test -x "$image/bin/java"
          test -x "$image/bin/javac"
          "$image/bin/java" -XshowSettings:properties -version > "$RUNNER_TEMP/tokenizer-receipts/version.txt" 2>&1
          grep -Eq 'java.class.version = 65([.]0)?' "$RUNNER_TEMP/tokenizer-receipts/version.txt"
          cat "$RUNNER_TEMP/tokenizer-receipts/version.txt"

      - name: Run all tokenizer jtreg and preserved CheckedMap regression on product image
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          make CONF="$CONF" JOBS=2 LOG=info test \
            TEST="test/jdk/java/util/StringTokenizer test/jdk/java/util/Collections/CheckedMapMerge8292955Test.java"

      - name: Replay exact emitted oracle with image java and javac
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          image="$GITHUB_WORKSPACE/build/$CONF/images/jdk"
          out="$RUNNER_TEMP/tokenizer-receipts"
          mkdir -p "$out/classes"
          "$image/bin/javac" --release 21 -proc:none -Xlint:all -Werror \
            -d "$out/classes" test/jdk/java/util/StringTokenizer/NullDelimiterState8360045.java
          for mode in default -Xint -XX:+CompactStrings -XX:-CompactStrings -XX:+UseG1GC -XX:+UseSerialGC; do
            options=()
            if [ "$mode" != default ]; then options=("$mode"); fi
            "$image/bin/java" "${options[@]}" -Xcheck:jni -Xverify:all \
              -XX:-OmitStackTraceInFastThrow -cp "$out/classes" \
              NullDelimiterState8360045 --candidate > "$out/$mode.log"
            grep -qx 'PASS --candidate checks=47675' "$out/$mode.log"
            cat "$out/$mode.log"
          done

      - name: Retain actual source, build and jtreg evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3jdk21-tokenizer-${{ matrix.debug }}-image-receipts
          path: |
            build/${{ env.CONF }}/configure.log
            build/${{ env.CONF }}/build.log
            build/${{ env.CONF }}/test-results/
            build/${{ env.CONF }}/test-support/
            ${{ runner.temp }}/tokenizer-receipts/
          retention-days: 14
          if-no-files-found: error

  m3-object-residency-pressure__small-xmx:
    name: "M3 object residency pressure contract / small-xmx"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-object-residency-pressure'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 object residency pressure contract-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile parent-owned residency proof
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-residency-pressure"
          mkdir -p "$OUT"
          javac --release 21 -Xlint:all -Werror -d "$OUT" \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3Address28.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IntLane28.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3BitLane28.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SlotAllocator28.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3ObjectResidency.java \
            m3/tooling/object-residency/M3ResidencyPressureProbe.java
      - name: Execute real small-Xmx LRU/recreation proof
        shell: bash
        run: |
          set -euo pipefail
          java -Xms8m -Xmx32m -cp "$RUNNER_TEMP/m3-residency-pressure" \
            jdk.m3.collections.verification.M3ResidencyPressureProbe

  m3-state-mask-histogram-20261017__java-jni-parity:
