  m3-merged-atom-preservation-20261022__require-merged-sources:
    name: "M3 merged recipe atom preservation / require-merged-sources"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-merged-atom-preservation-20261022'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 merged recipe atom preservation-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Reject new transformation recipe sources in the downstream product
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          M3_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$M3_BASE_SHA"
          git diff --diff-filter=A --name-only "$M3_BASE_SHA" HEAD > "$RUNNER_TEMP/m3-new-paths.txt"
          if grep -E '(^m3/recipes/|^m3/tooling/migration-recipes/|/recipe(s)?/)' "$RUNNER_TEMP/m3-new-paths.txt"; then
            echo 'ERROR: recipe roots (m3/recipes, migration-recipes, */recipe(s)/) take no new sources; add tools under m3/tooling/<lane>/tools/ (standalone, m3/tooling/standalone/M3_REFS.tsv)'
            exit 1
          fi

  m3-tooling-recipes__verify-recipes:
    name: "M3 OpenRewrite recipe proof / verify-recipes"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-tooling-recipes'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 OpenRewrite recipe proof-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact workflow head without reusable actions
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          curl --fail --location --retry 3 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" \
            -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"

      - name: Prepare isolated pinned JDK 21
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' \
            -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' \
            '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' \
            "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"

      - name: Synexia canonical ownership compatibility proof
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REPO/m3/compatibility/check_m3_recipe_ownership.py"
          python3 -m unittest discover \
            -s "$REPO/m3/compatibility" \
            -p 'test_m3_recipe_home_policy.py' \
            -v

      - name: Verify canonical A3 descriptor owners and refusal controls
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO"


      - name: Emit M3 convergence proof artifacts
        shell: bash
        run: |
          set -euo pipefail
          python3 "$REPO/m3/tooling/emit-java21-convergence-proof.py" \
            --repo "$REPO" \
            --out "$RUNNER_TEMP/m3-java21-convergence-proof"
          cat "$RUNNER_TEMP/m3-java21-convergence-proof/FINAL_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload M3 convergence proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-java21-convergence-proof-${{ github.run_id }}
          path: ${{ runner.temp }}/m3-java21-convergence-proof
          if-no-files-found: error
          retention-days: 30

