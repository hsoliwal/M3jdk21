name: M3 A3 Synexia mastery custody

on:
  push:
    branches:
      - 'fix/a3-synexia-mastery-custody-20261006'
    paths:
      - 'm3/tooling/a3/src/main/java/com/m3/a3/A3Lab.java'
      - 'm3/tooling/recipe-catalogue.tsv'
      - 'm3/docs/A3_SYNX_MASTERY_CUSTODY.md'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/a3-synexia-mastery-custody/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/a3-synexia-mastery-custody-text/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-synexia-mastery-custody.yml'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/M3A3SynexiaMasteryCustodyRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/a3-synexia-mastery-custody/**'
      - '.github/workflows/m3-a3-synexia-mastery-custody.yml'
  pull_request:
    paths:
      - 'm3/tooling/a3/src/main/java/com/m3/a3/A3Lab.java'
      - 'm3/tooling/recipe-catalogue.tsv'
      - 'm3/docs/A3_SYNX_MASTERY_CUSTODY.md'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/a3-synexia-mastery-custody/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/a3-synexia-mastery-custody-text/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-synexia-mastery-custody.yml'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/M3A3SynexiaMasteryCustodyRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/a3-synexia-mastery-custody/**'
      - '.github/workflows/m3-a3-synexia-mastery-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 1 diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"
      - name: 2 compile A3 and recipe owners
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/migration-recipes,tooling/a3
          -am -DskipTests compile
      - name: 3 source-sealed custody recipe fixed point
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/migration-recipes
          -Dtest=M3A3SynexiaMasteryCustodyRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: 4 hostile mastery laboratory
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/a3
          -Dtest=A3LabTest
          -Dsurefire.failIfNoSpecifiedTests=false test
