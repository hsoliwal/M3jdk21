name: M3JDK21 full-width path-mask classification Java/JNI proof
# Former triggers (below, as of the move) now start job(s) 'm3-index-pathmask-classification-20261021__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     workflow_dispatch:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexPathMasks.java'
#         - 'test/jdk/jdk/m3/collections/M3IndexPathMaskClassificationProof.java'
#         - 'm3/collections/qualification/pathmask-classification-20261021/**'
#         - 'm3/collections/algorithm-catalog/pathmask-terminal-classification-20261021.tsv'
#         - 'm3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-index-pathmask-classification-20261021/**'
#         - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-index-pathmask-classification-20261021.yml'
#         - '.github/workflows/m3-index-pathmask-classification-20261021.yml'
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-c17-jni:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source seals, Java 21 differentials and checked C17 JNI
        run: bash m3/collections/qualification/pathmask-classification-20261021/verify.sh
