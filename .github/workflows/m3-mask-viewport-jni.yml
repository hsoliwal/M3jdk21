name: M3 Mask Viewport Java JNI
on:
  pull_request:
    paths:
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3MaskViewport*.java'
      - 'src/jdk.m3.collections/share/native/libm3collections/m3maskviewport.c'
      - 'test/jdk/jdk/m3/collections/M3MaskViewportKernelContract.java'
      - 'make/m3/collections/viewport-proof/**'
      - '.github/workflows/m3-mask-viewport-jni.yml'
      - '.github/workflows/m3-viewport-family-composed.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-jni-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java 21 and C17 JNI differential
        run: bash make/m3/collections/viewport-proof/verify.sh
