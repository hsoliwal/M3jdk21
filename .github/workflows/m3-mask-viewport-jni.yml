name: M3 Mask Viewport Java JNI
# Former triggers (below, as of the move) now start job(s) 'm3-mask-viewport-jni__*' in
# .github/workflows/checks-superset-08.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3MaskViewport*.java'
#         - 'src/jdk.m3.collections/share/native/libm3collections/m3maskviewport.c'
#         - 'test/jdk/jdk/m3/collections/M3MaskViewportKernelContract.java'
#         - 'm3/collections/viewport-proof/**'
#         - '.github/workflows/m3-mask-viewport-jni.yml'
#         - '.github/workflows/m3-viewport-family-composed.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-jni-parity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java 21 and C17 JNI differential
        run: bash m3/collections/viewport-proof/verify.sh
