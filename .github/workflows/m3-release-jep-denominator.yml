name: M3 release JEP denominator authority

on:
  push:
    branches:
      - "m3/release-jep-denominator-authority-20261004"
    paths:
      - "m3/backports/RELEASE_JEP_AUTHORITY.tsv"
      - "m3/backports/JEP_CATALOGUE.tsv"
      - "m3/backports/BACKPORT_WORK_QUEUE.tsv"
      - "m3/backports/release_jep_authority.py"
      - "m3/backports/test_release_jep_authority.py"
      - "m3/backports/program_status.py"
      - "m3/backports/test_program_status.py"
      - "m3/backports/verify.py"
      - "m3/backports/PROGRAM_STATUS_2026-10-04.md"
      - "m3/backports/recipes/release-jep-denominator-20261004/**"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-release-jep-denominator.yml"
  pull_request:
    paths:
      - "m3/backports/RELEASE_JEP_AUTHORITY.tsv"
      - "m3/backports/JEP_CATALOGUE.tsv"
      - "m3/backports/BACKPORT_WORK_QUEUE.tsv"
      - "m3/backports/release_jep_authority.py"
      - "m3/backports/test_release_jep_authority.py"
      - "m3/backports/program_status.py"
      - "m3/backports/test_program_status.py"
      - "m3/backports/verify.py"
      - "m3/backports/PROGRAM_STATUS_2026-10-04.md"
      - "m3/backports/recipes/release-jep-denominator-20261004/**"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-release-jep-denominator.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denominator-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify authoritative release denominator
        run: |
          set -euo pipefail
          python3 -m unittest discover -s m3/backports -p 'test_*.py' -v
          python3 m3/backports/verify.py --root .

      - name: Prove nine FILE recipe atoms and MODULE fixed point
        run: |
          mvn -B -ntp -f m3/pom.xml -pl tooling/migration-recipes -am \
            -Dtest=M3ReleaseJepDenominatorRecipeTest,M3RecipeScopeDeclarationTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Validate evidence-bound denominator packet
        run: |
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=com.m3.tooling.dag.M3BackportPacketMain \
            -Dexec.args="$PWD/m3/backports/recipes/release-jep-denominator-20261004/packet.tsv $PWD/m3/backports/recipes/release-jep-denominator-20261004/atom-evidence.tsv" \
            exec:java

      - name: Project canonical DAG to Camel Airflow and Drools
        run: |
          set -euo pipefail
          mkdir -p target/release-jep-denominator
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=com.m3.tooling.dag.M3OrchestrationProjectionMain \
            -Dexec.args="$PWD/m3/backports/recipes/release-jep-denominator-20261004/packet.tsv $PWD/target/release-jep-denominator $PWD/m3/backports/recipes/release-jep-denominator-20261004/atom-evidence.tsv" \
            exec:java
          test -s target/release-jep-denominator/M3BackportRoutes.java
          test -s target/release-jep-denominator/m3_backport_dag.py
          test -s target/release-jep-denominator/m3_backport_rules.drl
          test -s target/release-jep-denominator/atom-evidence.tsv
          test -s target/release-jep-denominator/projection.tsv

      - name: Upload denominator DAG evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-jep-denominator-${{ github.run_id }}
          path: target/release-jep-denominator
          if-no-files-found: error
          retention-days: 30
