name: M3 default-template-method candidate (bounded Java21)
on:
  pull_request:
    paths:
      - '.github/workflows/m3-default-template-candidate.yml'
      - 'src/java.base/share/classes/java/util/concurrent/Callable.java'
      - 'src/java.base/share/classes/java/util/concurrent/MonitoredCallable.java'
      - 'src/java.base/share/classes/java/util/concurrent/MonitoredRunnable.java'
      - 'src/java.base/share/classes/java/util/concurrent/ProgressMonitors.java'
      - 'test/jdk/java/lang/Object/M3MonitoredTemplateTest.java'
      - 'm3/compatibility/*default*template*'
      - 'm3/compatibility/M3_DEFAULT_TEMPLATE_RECEIVER_20261017.md'
  workflow_dispatch:
jobs:
  java21-standalone-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source seals and isolated progress subset
        run: bash m3/compatibility/check_m3_default_template_java21.sh
      - name: State limitations explicitly
        run: echo 'Full Maven/OpenRewrite, JDK build, jtreg, HotSpot, native and compatibility gates remain pending.'
