name: M3 AST L0 mask selection bounded Java21 proof
on:
  pull_request:
    paths:
      - 'm3/ast/**'
      - '.github/workflows/m3-ast-mask-selection.yml'
  workflow_dispatch:
jobs:
  java21-selected-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run source-sealed selected Java 21 proof
        run: python3 m3/ast/verify_mask_selection.py
