jobs:
  original-mapping-provider:
    name: genuine provider, recipe and unchanged original CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      M3_PROOF_ROOT: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}
      M3_SOURCE_ROOT: ${{ github.workspace }}/m3-original-provider-source
      TMPDIR: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TEMP: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
      TMP: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
      XDG_CACHE_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/cache
      XDG_CONFIG_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/config
      XDG_DATA_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/data
    steps:
      - name: Reserve storage and select existing toolchains
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os,pathlib,re
          reserve,cap=8*1024**3,512*1024**2
          for key in ("RUNNER_TEMP","GITHUB_WORKSPACE"):
              base=pathlib.Path(os.environ[key])
              if not base.is_dir() or any(p.is_symlink() for p in [base,*base.parents]):raise SystemExit("redirected/missing runner storage")
              st=os.statvfs(base)
              if st.f_bavail*st.f_frsize<reserve+cap:raise SystemExit("HOLD_STORAGE 8GiB after512MiB")
          root=pathlib.Path(os.environ["M3_PROOF_ROOT"]);source=pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          if root.exists() or source.exists():raise SystemExit("owned output paths must be fresh")
          cache=pathlib.Path(os.environ["RUNNER_TOOL_CACHE"])
          javas=[]
          for version in (cache/"Java_Temurin-Hotspot_jdk").glob("21.*"):
              home=version/"x64"
              if re.fullmatch(r"21\.\d+\.\d+-\d+(?:\.\d+)*",version.name) and (version/"x64.complete").is_file() and all(os.access(home/"bin"/name,os.X_OK) for name in ("java","javac")):javas.append(home)
          pythons=[]
          for version in (cache/"Python").glob("3.12.*"):
              home=version/"x64";python=home/"bin/python3.12"
              if re.fullmatch(r"3\.12\.\d+",version.name) and (version/"x64.complete").is_file() and os.access(python,os.X_OK) and (home/"lib/python3.12/venv/__init__.py").is_file() and (home/"lib/python3.12/ensurepip/__init__.py").is_file():pythons.append(python)
          if not javas or not pythons:raise SystemExit("HOLD_TOOLCHAIN preinstalled JDK21/CPython3.12 required; no setup/download fallback")
          java=sorted(javas)[-1].resolve();python=sorted(pythons)[-1].resolve()
          for directory in ("home/.m2","m2","tmp","cache","config","data"):(root/directory).mkdir(parents=True,exist_ok=False)
          settings='<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"/>\n'
          for name in ("settings.xml","global-settings.xml"):(root/"home/.m2"/name).write_text(settings,encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("java="+str(java)+"\npython="+str(python)+"\npython-bin="+str(python.parent)+"\n")

          PY
      - name: Narrow exact-head checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3-original-provider-source
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitattributes
            /.github/workflows/m3-original-mapping-provider-qualification.yml
            /m3/migration/original-provider-20261017/
            /m3/algorithms/src/com/m3/algorithm/M3PrefixZ.java
            /m3/algorithms/test/PrefixZContractTest.java
            /m3/algorithms/test/ViewInteropContractTest.java
            /m3/core/src/com/m3/text/JoinedM3StringPiece.java
            /m3/core/src/com/m3/text/LocalM3Arena.java
            /m3/core/src/com/m3/text/LocalM3StringPiece.java
            /m3/core/src/com/m3/text/M3StringPiece.java
            /m3/core/src/com/m3/text/StorageIdentity.java
            /m3/docs/name-mapping.json
            /m3/docs/name-mapping.schema.json
            /m3/migration/evidence/local-20261002-final/prefix-z-interpreter.log
            /m3/migration/evidence/local-20261002-final/prefix-z-normal.log
            /m3/migration/evidence/local-20261002-final/receipt.json
            /m3/migration/migration.py
            /m3/migration/pinned-dependencies.json
            /m3/migration/recipes/prefix-z-v1.tsv
            /m3/migration/requirements.txt
            /m3/migration/run-tests.py
            /m3/migration/src/com/m3/migration/ExactFileRecipe.java
            /m3/migration/test/RecipeContractTest.java
            /m3/migration/test/test_migration.py
            /m3/tooling/cb/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-cb/manifest.tsv
            /m3/tooling/lane28/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-m3-lane28/manifest.tsv
            /m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-descriptor/manifest.tsv
            /m3/tooling/mr/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-m3-mr/manifest.tsv
            /m3/tooling/tq/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-m3-tq/manifest.tsv
            /m3/tooling/vi/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-vi/manifest.tsv
            /src/java.base/share/classes/java/util/regex/Matcher.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Address28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3BitLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Bits.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Boundary.java
            /src/java.base/share/classes/jdk/internal/mindex/M3CB.java
            /src/java.base/share/classes/jdk/internal/mindex/M3CI.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Class.java
            /src/java.base/share/classes/jdk/internal/mindex/M3ClassFlags.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Constructor.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Descriptor.java
            /src/java.base/share/classes/jdk/internal/mindex/M3DotStarRelations.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Field.java
            /src/java.base/share/classes/jdk/internal/mindex/M3IntLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3LongLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Member.java
            /src/java.base/share/classes/jdk/internal/mindex/M3MemberFlags.java
            /src/java.base/share/classes/jdk/internal/mindex/M3MemberKind.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Method.java
            /src/java.base/share/classes/jdk/internal/mindex/M3PC.java
            /src/java.base/share/classes/jdk/internal/mindex/M3RecordComponent.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Release.java
            /src/java.base/share/classes/jdk/internal/mindex/M3StateRelation.java
            /src/java.base/share/classes/jdk/internal/mindex/M3TQ.java
            /src/java.base/share/classes/jdk/internal/mindex/M3VI.java
            /src/java.base/share/native/libjava/M3BitLane28.c
            /src/java.base/share/native/libjava/M3StateRelation.c
            /src/java.base/share/native/libjava/m3_state_relation.h
      - name: Qualify recipe and genuine original validator under storage supervision
        shell: bash
        env:
          M3_JAVA_HOME: ${{ steps.preflight.outputs.java }}
          M3_PYTHON: ${{ steps.preflight.outputs.python }}
          M3_PYTHON_BIN: ${{ steps.preflight.outputs.python-bin }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_OPTIONAL_LOCKS: '0'
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,signal,subprocess,time
          reserve,cap=8*1024**3,512*1024**2
          root=pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source=pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          sdk=source/"m3/migration/original-provider-20261017/sdk"
          start=time.monotonic()
          def traversal_error(error):raise RuntimeError("storage census failed") from error
          def gate(limit=480*1024**2):
              used=0
              for base in (pathlib.Path(os.environ["RUNNER_TEMP"]),source):
                  if not base.is_dir() or base.is_symlink():raise RuntimeError("missing/redirected storage")
                  for folder,names,files in os.walk(base,followlinks=False,onerror=traversal_error):
                      for name in names+files:
                          try:info=os.lstat(pathlib.Path(folder)/name)
                          except FileNotFoundError:continue
                          used+=max(info.st_size,info.st_blocks*512)
              if used>limit:raise RuntimeError("512MiB aggregate task limit (32MiB artifact reserve)")
              for base in (root,source):
                  st=os.statvfs(base)
                  if st.f_bavail*st.f_frsize<reserve+cap-used:raise RuntimeError("8GiB-after-output reserve")
              return used
          def getgit(*args):
              return subprocess.check_output(["git",*args],cwd=source,text=True,timeout=15).strip()
          gate()
          head=getgit("rev-parse","HEAD")
          if head!=os.environ["EXPECTED_SOURCE_SHA"] or not re.fullmatch("[0-9a-f]{40}",head):raise RuntimeError("checkout is not exact candidate head")
          binding=json.loads((source/"m3/migration/original-provider-20261017/source-binding.json").read_bytes())
          if binding["repository"]!="hsoliwal/com.synexia" or binding["receiverCorePath"]!="m3/migration/original-provider-20261017/sdk":raise RuntimeError("canonical owner drift")
          if not re.fullmatch("[0-9a-f]{40}",binding["sourceCommit"]):raise RuntimeError("missing canonical commit")
          if binding["runtimeApplied"] is not False or binding["phaseAdvanced"] is not False:raise RuntimeError("scope drift")
          tree=getgit("rev-parse","HEAD:"+binding["receiverCorePath"])
          pins=(sdk/"pins.json").read_bytes()
          workflow=source/".github/workflows/m3-original-mapping-provider-qualification.yml"
          if tree!=binding["moduleGitTree"] or hashlib.sha256(pins).hexdigest()!=binding["pinsSha256"] or hashlib.sha256(workflow.read_bytes()).hexdigest()!=binding["workflowSha256"]:raise RuntimeError("exact SDK/workflow binding drift")
          env=os.environ.copy()
          for name in list(env):
              if name in ("GITHUB_TOKEN","GH_TOKEN") or name.startswith(("PIP_","PYTHON","MAVEN_","JAVA_TOOL_OPTIONS","JDK_JAVA_OPTIONS")):env.pop(name,None)
          env.update(HOME=str(root/"home"),USERPROFILE=str(root/"home"),MAVEN_USER_HOME=str(root/"home/.m2"),TMPDIR=str(root/"tmp"),TEMP=str(root/"tmp"),TMP=str(root/"tmp"),JAVA_HOME=os.environ["M3_JAVA_HOME"],PATH=os.environ["M3_PYTHON_BIN"]+os.pathsep+os.environ["M3_JAVA_HOME"]+"/bin"+os.pathsep+env["PATH"],MAVEN_OPTS="-Xmx512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir="+str(root/"tmp")+" -Duser.home="+str(root/"home"),JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -Djava.io.tmpdir="+str(root/"tmp")+" -Duser.home="+str(root/"home")+" -XX:+PerfDisableSharedMem",PIP_CONFIG_FILE=os.devnull,PIP_DISABLE_PIP_VERSION_CHECK="1",PIP_NO_CACHE_DIR="1",PYTHONDONTWRITEBYTECODE="1",GIT_OPTIONAL_LOCKS="0",GIT_NO_LAZY_FETCH="1",GIT_TERMINAL_PROMPT="0")
          records=[]
          log=root/"qualification.log"
          def cleanup(child):
              # Every descendant inherits this owned session; bootstrap creates no nested sessions.
              for sig,seconds in ((signal.SIGTERM,2),(signal.SIGKILL,3)):
                  try:os.killpg(child.pid,sig)
                  except ProcessLookupError:pass
                  end=time.monotonic()+seconds
                  while time.monotonic()<end:
                      try:os.killpg(child.pid,0)
                      except ProcessLookupError:return
                      time.sleep(.05)
              raise RuntimeError("owned process group terminal state unproved")
          def run(name,command,deadline=300):
              if time.monotonic()-start>720:raise RuntimeError("global deadline before launch")
              gate()
              child=None;code=None
              with log.open("ab") as out:
                  try:
                      child=subprocess.Popen(command,cwd=source,env=env,stdin=subprocess.DEVNULL,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)
                      command_start=time.monotonic()
                      while child.poll() is None:
                          gate()
                          if time.monotonic()-command_start>deadline or time.monotonic()-start>720:raise RuntimeError("owned command deadline")
                          time.sleep(.5)
                      code=child.wait()
                      if time.monotonic()-start>720:raise RuntimeError("global deadline after child exit")
                  finally:
                      if child is not None:
                          if child.poll() is None:
                              try:os.killpg(child.pid,signal.SIGTERM)
                              except ProcessLookupError:pass
                              try:child.wait(timeout=2)
                              except subprocess.TimeoutExpired:
                                  try:os.killpg(child.pid,signal.SIGKILL)
                                  except ProcessLookupError:pass
                                  child.wait(timeout=5)
                          cleanup(child)
                          records.append({"name":name,"returncode":child.returncode,"parentReaped":True,"ownedSessionAbsent":True})
              gate()
              if code:raise RuntimeError(name+" failed with "+str(code))
          py=[os.environ["M3_PYTHON"],"-I","-S","-B"]
          build=root/"target";overlay=root/"emitted"
          runid=os.environ["GITHUB_RUN_ID"]+"-"+os.environ["GITHUB_RUN_ATTEMPT"]+"-"+head[:12]
          bootstrap=overlay/"m3/migration/provider/python312-linux-x86_64/bootstrap.py"
          settings=root/"home/.m2"
          try:
              run("closed-sdk-source-and-current-target-custody",py+[str(sdk/"verify.py"),"--self-test","--receiver",str(source)])
              run("actual-maven-openrewrite-sdk",["mvn","-B","-ntp","-s",str(settings/"settings.xml"),"-gs",str(settings/"global-settings.xml"),"-Dmaven.repo.local="+str(root/"m2"),"-f",str(sdk/"pom.xml"),"-Dm3.build.root="+str(build),"-Dm3.output.root="+str(overlay),"verify"])
              run("named-sdk-and-exact-emission-receipt",py+[str(sdk/"verify.py"),"--report",str(build/"surefire-reports/TEST-com.m3.rewrite.backport.M3OriginalCliProviderRecipeTest.xml"),"--emitted",str(overlay),"--receipt",str(root/"recipe-execution.json"),"--run-id",runid])
              run("provider-stdlib-boundary-tests",py+[str(bootstrap),"--self-test","--output",str(root/"provider-boundaries"),"--lock",str(bootstrap.with_name("wheels.lock.json"))])
              run("genuine-provider-and-unchanged-original-cli",py+[str(bootstrap),"--root",str(overlay),"--baseline-root",str(source),"--output",str(root/"provider"),"--lock",str(bootstrap.with_name("wheels.lock.json"))],360)
              # Exact bootstrap receipt shape is checked below after provider implementation freezes.
              provider_receipt_path=root/"provider"/"provider-receipt.json"
              provider=json.loads(provider_receipt_path.read_bytes())
              if provider.get("schema")!="M3_ORIGINAL_MAPPING_PYTHON_PROVIDER_RECEIPT_V1" or provider.get("exitCode")!=0 or provider.get("providerQualified") is not True or provider.get("originalSyntheticTestsPassed") is not True:raise RuntimeError("genuine provider/original unit execution gate")
              if provider.get("baselineManifestValid") is not False or provider.get("currentManifestValid") is not True or provider.get("migrationComplete") is not False:raise RuntimeError("expected PRE invalid / POST valid but INCOMPLETE transition")
              if any(provider.get(k) is not False for k in ("runtimeQualified","jniQualified","jdkQualified","performanceQualified","phaseAdvanced")):raise RuntimeError("provider cannot advance runtime acceptance")
              units=provider.get("originalUnits",{})
              if units.get("testsRun")!=26 or len(units.get("methods",[]))!=26 or len(set(units["methods"]))!=26 or any(units.get(k)!=0 for k in ("failures","errors","skipped","expectedFailures","unexpectedSuccesses")):raise RuntimeError("original 26 named methods missing/failing")
              bpath=root/"provider-boundaries/stdlib-boundary-tests.json"
              boundary=json.loads(bpath.read_bytes())
              if boundary.get("schema")!="M3_PYTHON_PROVIDER_STDLIB_BOUNDARY_TESTS_V1" or boundary.get("testsRun")!=38 or boundary.get("exitCode")!=0 or any(boundary.get(k)!=0 for k in ("failures","errors","skipped","expectedFailures","unexpectedSuccesses")):raise RuntimeError("38 stdlib boundary methods missing/failing")
              probes=provider.get("provider",{})
              if probes.get("draft2020Discriminators")!={"prefixItems":True,"unevaluatedProperties":True,"invalidSchemaRefused":True,"localRef":True} or probes.get("hashTrieMapImmutableOperations") is not True or not probes.get("loadedNativePayloads") or len(probes.get("releasedPayloads",{}))!=6:raise RuntimeError("genuine Draft2020/native/installed-payload proof absent")
              records_by_label={r["label"]:r for r in provider["commands"]}
              for label,expected in (("baseline-validate",1),("baseline-report",1),("baseline-complete",1),("current-validate",0),("current-report",0),("current-complete",2)):
                  record=records_by_label[label]
                  if record["returncode"]!=expected or record["termination"] is not None:raise RuntimeError("unchanged CLI result drift "+label)
                  for stream in ("stdout","stderr"):
                      path=root/"provider"/record[stream+"Path"]
                      if path.is_symlink() or path.stat().st_size>2*1024**2:raise RuntimeError("CLI output fence")
                      content=path.read_bytes()
                      if len(content)!=record[stream+"Bytes"] or hashlib.sha256(content).hexdigest()!=record[stream+"Sha256"]:raise RuntimeError("CLI output receipt drift")
              baseline_error=(root/"provider"/records_by_label["baseline-validate"]["stderrPath"]).read_text(encoding="utf-8")
              if "target hash drift: src/java.base/share/classes/jdk/internal/mindex/M3TQ.java" not in baseline_error or "missing file: synexia-openrewrite-recipes/" not in baseline_error:raise RuntimeError("original baseline diagnostics absent")
              marker=(root/"provider"/records_by_label["current-validate"]["stdoutPath"]).read_text(encoding="utf-8")
              completion=(root/"provider"/records_by_label["current-complete"]["stderrPath"]).read_text(encoding="utf-8").splitlines()
              if marker!="MIGRATION_MANIFEST_VALID completion=INCOMPLETE\n" or len(completion)!=158:raise RuntimeError("unchanged completion boundaries lost")
              coverage=(root/"provider"/records_by_label["current-report"]["stdoutPath"]).read_text(encoding="utf-8")
              if "**INCOMPLETE**" not in coverage:raise RuntimeError("actual original coverage report not incomplete")
              final={"schema":"M3_ORIGINAL_MAPPING_PROVIDER_HOSTED_V1","runId":runid,"checkoutCommit":head,"canonicalSourceCommit":binding["sourceCommit"],"sdkTree":tree,"pinsSha256":hashlib.sha256(pins).hexdigest(),"commands":records,"providerReceiptSha256":hashlib.sha256(provider_receipt_path.read_bytes()).hexdigest(),"recipeReceiptSha256":hashlib.sha256((root/"recipe-execution.json").read_bytes()).hexdigest(),"runtimeJniQualified":False,"matchedJdkQualified":False,"performanceRetentionQualified":False,"phaseAdvanced":False}
              (root/"hosted-receipt.json").write_text(json.dumps(final,indent=2)+"\n",encoding="utf-8")
          finally:
              # Never write failure artifacts until fresh reserve and planned-copy gates pass.
              tail=b""
              if log.is_file() and not log.is_symlink():
                  with log.open("rb") as f:f.seek(max(0,log.stat().st_size-32768));tail=f.read(32768)
              try:
                  before=gate(496*1024**2)
                  selected=[root/"recipe-execution.json",root/"hosted-receipt.json",source/"m3/migration/original-provider-20261017/source-binding.json"]
                  selected+=sorted(build.glob("surefire-reports/TEST-*.xml"))
                  selected+=sorted((root/"provider").glob("*.json"))
                  selected+=sorted((root/"provider-boundaries").glob("*.json"))
                  selected+=sorted((root/"provider").glob("*.md"))
                  selected+=sorted((root/"provider").glob("logs/*.stdout"))+sorted((root/"provider").glob("logs/*.stderr"))
                  selected=sorted(set(p for p in selected if p.is_file()),key=str)
                  if len(selected)>256 or any(any(x.is_symlink() for x in [p,*p.parents]) for p in selected):raise RuntimeError("closed artifact source fence")
