            /m3/migration/recipes/prefix-z-v1.tsv
            /m3/migration/requirements.txt
            /m3/migration/run-tests.py
            /m3/migration/src/com/m3/migration/ExactFileRecipe.java
            /m3/migration/test/RecipeContractTest.java
            /m3/migration/test/test_migration.py
            /m3/tooling/cb/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-cb/manifest.tsv
            /m3/tooling/lane28/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-m3-lane28/manifest.tsv
            /m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-descriptor/manifest.tsv
            /m3/tooling/mr/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-m3-mr/manifest.tsv
            /m3/tooling/tq/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-m3-tq/manifest.tsv
            /m3/tooling/vi/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-vi/manifest.tsv
            /src/java.base/share/classes/java/util/regex/Matcher.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Address28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3BitLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Bits.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Boundary.java
            /src/java.base/share/classes/jdk/internal/mindex/M3CB.java
            /src/java.base/share/classes/jdk/internal/mindex/M3CI.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Class.java
            /src/java.base/share/classes/jdk/internal/mindex/M3ClassFlags.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Constructor.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Descriptor.java
            /src/java.base/share/classes/jdk/internal/mindex/M3DotStarRelations.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Field.java
            /src/java.base/share/classes/jdk/internal/mindex/M3IntLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3LongLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Member.java
            /src/java.base/share/classes/jdk/internal/mindex/M3MemberFlags.java
            /src/java.base/share/classes/jdk/internal/mindex/M3MemberKind.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Method.java
            /src/java.base/share/classes/jdk/internal/mindex/M3PC.java
            /src/java.base/share/classes/jdk/internal/mindex/M3RecordComponent.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Release.java
            /src/java.base/share/classes/jdk/internal/mindex/M3StateRelation.java
            /src/java.base/share/classes/jdk/internal/mindex/M3TQ.java
            /src/java.base/share/classes/jdk/internal/mindex/M3VI.java
            /src/java.base/share/native/libjava/M3BitLane28.c
            /src/java.base/share/native/libjava/M3StateRelation.c
            /src/java.base/share/native/libjava/m3_state_relation.h
      - name: Qualify recipe and genuine original validator under storage supervision
        shell: bash
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-original-provider-source
          TMPDIR: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-original-provider-${{ github.run_id }}-${{ github.run_attempt }}/data
          M3_JAVA_HOME: ${{ steps.preflight.outputs.java }}
          M3_PYTHON: ${{ steps.preflight.outputs.python }}
          M3_PYTHON_BIN: ${{ steps.preflight.outputs.python-bin }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_OPTIONAL_LOCKS: '0'
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,signal,subprocess,time
          reserve,cap=8*1024**3,512*1024**2
          root=pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source=pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          sdk=source/"m3/migration/original-provider-20261017/sdk"
          start=time.monotonic()
          def traversal_error(error):raise RuntimeError("storage census failed") from error
          def gate(limit=480*1024**2):
              used=0
              for base in (pathlib.Path(os.environ["RUNNER_TEMP"]),source):
                  if not base.is_dir() or base.is_symlink():raise RuntimeError("missing/redirected storage")
                  for folder,names,files in os.walk(base,followlinks=False,onerror=traversal_error):
                      for name in names+files:
                          try:info=os.lstat(pathlib.Path(folder)/name)
                          except FileNotFoundError:continue
                          used+=max(info.st_size,info.st_blocks*512)
              if used>limit:raise RuntimeError("512MiB aggregate task limit (32MiB artifact reserve)")
              for base in (root,source):
                  st=os.statvfs(base)
                  if st.f_bavail*st.f_frsize<reserve+cap-used:raise RuntimeError("8GiB-after-output reserve")
              return used
          def getgit(*args):
              return subprocess.check_output(["git",*args],cwd=source,text=True,timeout=15).strip()
          gate()
          head=getgit("rev-parse","HEAD")
          if head!=os.environ["EXPECTED_SOURCE_SHA"] or not re.fullmatch("[0-9a-f]{40}",head):raise RuntimeError("checkout is not exact candidate head")
          binding=json.loads((source/"m3/migration/original-provider-20261017/source-binding.json").read_bytes())
          if binding["repository"]!="hsoliwal/com.synexia" or binding["receiverCorePath"]!="m3/migration/original-provider-20261017/sdk":raise RuntimeError("canonical owner drift")
          if not re.fullmatch("[0-9a-f]{40}",binding["sourceCommit"]):raise RuntimeError("missing canonical commit")
          if binding["runtimeApplied"] is not False or binding["phaseAdvanced"] is not False:raise RuntimeError("scope drift")
          tree=getgit("rev-parse","HEAD:"+binding["receiverCorePath"])
          pins=(sdk/"pins.json").read_bytes()
          workflow=source/".github/workflows/m3-original-mapping-provider-qualification.yml"
          if tree!=binding["moduleGitTree"] or hashlib.sha256(pins).hexdigest()!=binding["pinsSha256"] or hashlib.sha256(workflow.read_bytes()).hexdigest()!=binding["workflowSha256"]:raise RuntimeError("exact SDK/workflow binding drift")
          env=os.environ.copy()
