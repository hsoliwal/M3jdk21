              gate(496*1024**2)
              (bundle/"log-tail.txt").write_bytes(tail);print(tail.decode("utf-8",errors="replace"))
              (bundle/"inventory.json").write_text(json.dumps(inv,indent=2)+"\n",encoding="utf-8")
              (bundle/"commands.json").write_text(json.dumps(records,indent=2)+"\n",encoding="utf-8")
              print("Final aggregate bytes before artifact upload:",gate(496*1024**2))

