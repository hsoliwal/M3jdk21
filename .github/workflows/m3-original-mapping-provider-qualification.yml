            /m3/core/src/com/m3/text/M3StringPiece.java
            /m3/core/src/com/m3/text/StorageIdentity.java
            /m3/docs/name-mapping.json
            /m3/docs/name-mapping.schema.json
            /m3/migration/evidence/local-20261002-final/prefix-z-interpreter.log
            /m3/migration/evidence/local-20261002-final/prefix-z-normal.log
            /m3/migration/evidence/local-20261002-final/receipt.json
            /m3/migration/migration.py
