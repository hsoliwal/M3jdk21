# SPDX-License-Identifier: Apache-2.0
name: M3AST shared relation queries and structural classes

on:
  push:
    branches: [m3/ast-shared-relations-20261021]
  pull_request:
    paths:
      - m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTIndex.java
      - m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTRelations.java
      - m3/tooling/module-packs/parser/src/test/java/jdk/m3/parser/test/M3ASTRelationsContract.java
      - m3/tooling/module-packs/parser/build.py
      - .github/workflows/m3-ast-shared-relations-20261021.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-source-and-query-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact existing AST owner and new source with Java 21 lint
        shell: bash
        run: |
          set -euo pipefail
          ROOT=m3/tooling/module-packs/parser/src
          mkdir -p "$RUNNER_TEMP/m3-ast-relations-classes"
          javac --release 21 -Xlint:all -Werror -proc:none -implicit:none \
            -d "$RUNNER_TEMP/m3-ast-relations-classes" \
            "$ROOT/main/java/jdk/m3/parser/M3File.java" \
            "$ROOT/main/java/jdk/m3/parser/M3ASTIndex.java" \
            "$ROOT/main/java/jdk/m3/parser/M3ASTRelations.java" \
            "$ROOT/test/java/jdk/m3/parser/test/M3ASTRelationsContract.java"
      - name: Run source and structural relation oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3-ast-relations-proof
          java -ea -cp "$RUNNER_TEMP/m3-ast-relations-classes" \
            jdk.m3.parser.test.M3ASTRelationsContract \
            | tee m3-ast-relations-proof/RESULT.txt
          grep '^M3_AST_RELATIONS_PASS checks=' m3-ast-relations-proof/RESULT.txt
          grep -F '("jdk.m3.parser.test.M3ASTRelationsContract", "M3_AST_RELATIONS_PASS")' \
            m3/tooling/module-packs/parser/build.py
      - name: Pin measured source code for JMOD follow-up
        if: always()
        shell: bash
        run: |
          mkdir -p m3-ast-relations-proof
          sha256sum \
            m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTIndex.java \
            m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTRelations.java \
            m3/tooling/module-packs/parser/src/test/java/jdk/m3/parser/test/M3ASTRelationsContract.java \
            m3/tooling/module-packs/parser/build.py \
            > m3-ast-relations-proof/SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-ast-relations-source-oracle
          path: m3-ast-relations-proof/
          retention-days: 14
          if-no-files-found: warn
