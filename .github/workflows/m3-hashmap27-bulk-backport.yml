name: M3JDK21 HashMap OpenJDK27 fast-path A/B

on:
  push:
    branches:
      - m3/jdk27-hashmap-bulk-20261017
  pull_request:
    paths:
      - "src/java.base/share/classes/java/util/HashMap.java"
      - "src/java.base/share/classes/java/util/Collections.java"
      - "test/jdk/java/util/HashMap/M3HashMapBulkCopyTest.java"
      - "m3/runtime-integration/hashmap27/**"
      - ".github/workflows/m3-hashmap27-bulk-backport.yml"

permissions:
  contents: read

jobs:
  java21-hashmap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact M3JDK receiver
        uses: actions/checkout@v4
      - name: Prepare Java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Seal source and test postimages
        run: python3 m3/runtime-integration/hashmap27/verify_receiver.py
      - name: Compile exact target JDK21 java.base HashMap class with package-private JDK access
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-hashmap/src/java/util" \
                   "$RUNNER_TEMP/m3-hashmap/patch" \
                   "$RUNNER_TEMP/m3-hashmap/test"
          cp src/java.base/share/classes/java/util/HashMap.java \
             "$RUNNER_TEMP/m3-hashmap/src/java/util/HashMap.java"
          cp src/java.base/share/classes/java/util/Collections.java \
             "$RUNNER_TEMP/m3-hashmap/src/java/util/Collections.java"
          javac --patch-module "java.base=$RUNNER_TEMP/m3-hashmap/src" \
                -proc:none -Xlint:all,-serial,-this-escape -Werror \
                -d "$RUNNER_TEMP/m3-hashmap/patch" \
                "$RUNNER_TEMP/m3-hashmap/src/java/util/Collections.java" \
                "$RUNNER_TEMP/m3-hashmap/src/java/util/HashMap.java"
          javac --release 21 -proc:none -Xlint:all,-serial -Werror \
                -d "$RUNNER_TEMP/m3-hashmap/test" \
                test/jdk/java/util/HashMap/M3HashMapBulkCopyTest.java \
                m3/runtime-integration/hashmap27/M3HashMapBeforeAfterBench.java
      - name: Validate stock Java21 baseline and key-hash callback counts
        run: |
          java -ea -Dm3.hashmap.fastExpected=false \
               -cp "$RUNNER_TEMP/m3-hashmap/test" M3HashMapBulkCopyTest
      - name: Validate patched Java21 HashMap constructor/putAll contracts
        run: |
          java -ea --patch-module "java.base=$RUNNER_TEMP/m3-hashmap/patch" \
               -Dm3.hashmap.fastExpected=true \
               -cp "$RUNNER_TEMP/m3-hashmap/test" M3HashMapBulkCopyTest
          java -Xint -ea --patch-module "java.base=$RUNNER_TEMP/m3-hashmap/patch" \
               -Dm3.hashmap.fastExpected=true \
               -cp "$RUNNER_TEMP/m3-hashmap/test" M3HashMapBulkCopyTest
      - name: Measure same-host Java21 stock and --patch-module before/after
        run: |
          java -Xms256m -Xmx256m -Dm3.variant=baseline \
               -cp "$RUNNER_TEMP/m3-hashmap/test" M3HashMapBeforeAfterBench \
               | tee "$RUNNER_TEMP/m3-hashmap/before.txt"
          java -Xms256m -Xmx256m \
               --patch-module "java.base=$RUNNER_TEMP/m3-hashmap/patch" \
               -Dm3.variant=patched \
               -cp "$RUNNER_TEMP/m3-hashmap/test" M3HashMapBeforeAfterBench \
               | tee "$RUNNER_TEMP/m3-hashmap/after.txt"
          python3 m3/runtime-integration/hashmap27/compare_bench.py \
            "$RUNNER_TEMP/m3-hashmap/before.txt" "$RUNNER_TEMP/m3-hashmap/after.txt"
      # Important: Java21 --patch-module tests this exact Java class on a stock
      # VM. It is not a source-built M3JDK21 image with matched JNI/HotSpot.
