  m3-eclipse-framework-forward-20261017__eclipse-framework-forward:
    name: "M3 Eclipse framework indexed forward receiver / eclipse-framework-forward"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-eclipse-framework-forward-20261017'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 Eclipse framework indexed forward receiver-${{ github.ref }}-eclipse-framework-forward"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify original, identity and full-flag successor source custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          original = Path('m3/eclipse/framework/recipe/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/eclipse-framework-m3-index-forward')
          current = Path('m3/eclipse/framework/recipe/flags-20261020/src/test/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-eclipse-full-delta-flags-20261020')
          old = [row.split('\t') for row in (original/'manifest.tsv').read_text().splitlines() if row and not row.startswith('#')]
          latest = [row.split('\t') for row in (current/'manifest.tsv').read_text().splitlines() if row and not row.startswith('#')]
          assert len(old) == 8 and len(latest) == 2
          assert [row[0] for row in old] == sorted(row[0] for row in old)
          assert [row[0] for row in latest] == sorted(row[0] for row in latest)
          replacements = {row[0]:row for row in latest}
          originals = {row[0]:row for row in old}
          # The historical recipe postimages stay sealed. Admit only this
          # qualified test-fixture successor after the full-width flags API.
          successor_tests = {
              'm3/eclipse/framework/src/test/java/jdk/m3/eclipse/framework/M3EclipseRuntimeActivatorTest.java': '510f39d07ad486dbb7565c9db66cc30b480a11a2f21839a2d4e5193b5ada1022',
              'm3/eclipse/framework/src/test/java/jdk/m3/eclipse/framework/M3EclipseDeltaIdentitySetTest.java': '3f3221dc9c8d4a9b34c86374f2c798d96603b9b6201a5ae85fc0c0aeae01cc0e',
          }
          for path, after_hash in successor_tests.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == after_hash, path
          for path, before, expected, template in old:
              assert hashlib.sha256((original/template).read_bytes()).hexdigest() == expected, template
              if path not in replacements and path not in successor_tests:
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          delta = 'm3/eclipse/framework/src/main/java/jdk/m3/eclipse/framework/M3EclipseResourceDeltaSnapshot.java'
          assert originals[delta][2] == '1ce2e7fac96924f307ab150a21e93303d2d0f1ecd422c68d6ab20b35039b276c'
          assert replacements[delta][1] == '21a893d7f976e5bf2d42998335d99556edfffb266016cce15d5784ebc1c19274'
          identity = Path('m3/eclipse/framework/src/test/java/jdk/m3/eclipse/framework/M3EclipseDeltaIdentitySetTest.java')
          assert hashlib.sha256(identity.read_bytes()).hexdigest() == '3f3221dc9c8d4a9b34c86374f2c798d96603b9b6201a5ae85fc0c0aeae01cc0e'
          for path, before, after, template in latest:
              prior = current/template.replace('.after.txt','.before.txt')
              assert hashlib.sha256(prior.read_bytes()).hexdigest() == before, prior
              assert hashlib.sha256((current/template).read_bytes()).hexdigest() == after, template
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == after, path
          tracked = set(subprocess.check_output(['git','ls-files','m3/eclipse/framework/src'],text=True).splitlines())
          assert tracked == set(originals) | {str(identity)}, tracked ^ (set(originals) | {str(identity)})
          print('ECLIPSE_EIGHT_PLUS_IDENTITY_PLUS_FULL_FLAG_SOURCE_SEALS_OK')
          PY

