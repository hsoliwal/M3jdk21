        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact Synexia postimage SHA256
        shell: bash
        run: |
          set -euo pipefail
          echo '90d641f3cd322f0b02c2675e6c1f10af13406a6a76175684d566c5d811c09743  src/jdk.m3.collections/share/classes/jdk/m3/collections/M3NativeFiveLibrarySdk.java' | sha256sum -c -
          echo '692395015e40c6dca69808312c31de95652a4d85d6b0e5a0cf9d26343faab150  test/jdk/jdk/m3/collections/M3NativeFiveLibrarySdkNoVendorTest.java' | sha256sum -c -
      - name: Compile complete M3 arrays and collections modules with Java 21 JPMS
        shell: bash
        run: |
          set -euo pipefail
          # The real native core requires the IN-PRODUCT jdk.m3.arrays module.
          # Compile source, do not resolve any external third-party runtime JAR.
          mkdir -p "$RUNNER_TEMP/arrays" "$RUNNER_TEMP/classes"
          find m3/arrays/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/arrays -name '*.java' | sort > "$RUNNER_TEMP/arrays-sources.txt"
          test -s "$RUNNER_TEMP/arrays-sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -d "$RUNNER_TEMP/arrays" @"$RUNNER_TEMP/arrays-sources.txt"
          find m3/collections/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/collections src/jdk.m3.collections/share/classes/jdk/internal/m3/collections -name '*.java' | sort > "$RUNNER_TEMP/sources.txt"
          test -s "$RUNNER_TEMP/sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            --module-path "$RUNNER_TEMP/arrays" \
            -d "$RUNNER_TEMP/classes" @"$RUNNER_TEMP/sources.txt"
          jar --create --file "$RUNNER_TEMP/m3-native-core.jar" -C "$RUNNER_TEMP/classes" .
          jar --create --file "$RUNNER_TEMP/m3-native-arrays.jar" -C "$RUNNER_TEMP/arrays" .
          jdeps --module-path "$RUNNER_TEMP/arrays" --print-module-deps \
            "$RUNNER_TEMP/m3-native-core.jar" | tee "$RUNNER_TEMP/jdeps.txt"
          # Both are in-product Java modules; reject any vendor module.
          dep_line="$(cat "$RUNNER_TEMP/jdeps.txt")"
          IFS=',' read -r -a deps <<< "$dep_line"
          test "${#deps[@]}" -gt 0
          for dep in "${deps[@]}"; do
            case "$dep" in
              java.base|jdk.m3.arrays) ;;
              *) echo "Refusing unexpected external/runtime module: $dep" >&2; exit 1 ;;
            esac
          done
          grep -Eq '(^|,)com[.]m3[.]arrays(,|$)' "$RUNNER_TEMP/jdeps.txt"
      - name: Install source-vendored JUnit build prerequisites
        shell: bash
        run: mvn -B -ntp -f m3/vendor/third_party/pom.xml -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Install internal M3 arrays from source (never donor binaries)
        shell: bash
        run: mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Build and verify the REQUIRED in-product M3 arrays JNI allocator from source
        shell: bash
        run: |
          set -euo pipefail
          cmake -S make/m3/arrays \
            -B "$RUNNER_TEMP/m3-native-arrays-build" \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_STANDARD=17
          cmake --build "$RUNNER_TEMP/m3-native-arrays-build" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/m3-native-arrays-build" --output-on-failure
          test -s "$RUNNER_TEMP/m3-native-arrays-build/libm3_arrays.so"
      - name: Execute exact-head JUnit runtime owner and dependency boundary tests with checked JNI
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3NativeFiveLibrarySdkNoVendorTest \
            -DargLine="-ea -Xcheck:jni -Dm3.arrays.native.path=$RUNNER_TEMP/m3-native-arrays-build/libm3_arrays.so" \
            test
      - name: Preserve real source-built proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-native-five-dep-free-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/jdeps.txt
            m3/collections/target/surefire-reports/

  m3jdk-regex-spec__regex-spec:
    name: "M3JDK regex spec / regex-spec"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk-regex-spec'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK regex spec-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /make/jdk/src/classes/build/tools/canongate/**
            /make/scripts/canon-gate.sh
            /make/data/m3regex/**
            /src/**/*.java
            /make/m3/**/*.java
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Every regex call site a change adds has a spec row and a listed site (owner decision 46)
        run: |
          set -eu
          # A pull request is checked out as its merge commit: the first parent is the base branch.
          base=$(git rev-parse HEAD^1)
          out="$RUNNER_TEMP/regex-spec"
          status=0
          bash make/scripts/canon-gate.sh regex_spec . "$base" "$out" || status=$?
          {
            echo "### Regex spec gate against $base: exit $status"
            echo '```'
            cat "$out/REGEX_SPEC_GATE.tsv" 2>/dev/null || echo 'no evidence table'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
