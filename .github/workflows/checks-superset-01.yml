          java -Xmx512m -XX:-UsePerfData -Xcheck:jni -Dm3.arrays.native.path="$M3_TASK_OUT/native-array/libm3_arrays.so" -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" jdk.m3.collections.M3SdkOwnerFactorySelfTest
          java -Xmx512m -XX:-UsePerfData -Xcheck:jni -Xint -Dm3.arrays.native.path="$M3_TASK_OUT/native-array/libm3_arrays.so" -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" jdk.m3.collections.M3SdkOwnerFactorySelfTest
          java -Xmx512m -XX:-UsePerfData -Dm3.arrays.native.path="$M3_TASK_OUT/native-array/libm3_arrays.so" -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" jdk.m3.collections.apache.M3MultiValuedMapSelfTest
          java -Xmx512m -XX:-UsePerfData -Dm3.arrays.native.path="$M3_TASK_OUT/native-array/libm3_arrays.so" -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" ApacheM3MultiValueCandidateProbe
          java -Xmx512m -XX:-UsePerfData -Dm3.arrays.native.path="$M3_TASK_OUT/native-array/libm3_arrays.so" -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" jdk.m3.collections.apache.M3MultiValuedMapCounterDifferentialTest

