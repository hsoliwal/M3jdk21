          (root / 'java-negative-fixtures.json').write_text(json.dumps(proof, indent=2) + '\n')
          PY_MUTANTS
          for mutant in seam containment order; do
            variant="$out/java-mutants/$mutant"
            mkdir -p "$variant/patch"
            "$JAVA_HOME/bin/javac" -J-Xmx256m -J-XX:ActiveProcessorCount=2 -J-XX:+PerfDisableSharedMem \
              -source 21 -target 21 -proc:none -implicit:none -Xlint:all -Werror \
              --patch-module "java.base=$variant/source" -d "$variant/patch" \
              "$variant/source/jdk/internal/mindex/M3TQ.java" \
              "$variant/source/jdk/internal/mindex/M3StringBacking.java" \
              "$variant/source/jdk/internal/mindex/M3MappedStringBacking.java" \
              > "$out/logs/java-$mutant-compile.log" 2>&1
            case "$mutant" in
              seam) main=M3TQTest; diagnostic='AssertionError: seam composition';;
              containment) main=M3TQTest; diagnostic='AssertionError: containment set oracle';;
              order) main=M3TQRollingPreparationTest; diagnostic='AssertionError: independent exact trigram set';;
            esac
            if timeout 240 "$JAVA_HOME/bin/java" -Xmx256m -XX:ActiveProcessorCount=2 \
                -XX:+PerfDisableSharedMem -Xcheck:jni -Xmixed --patch-module "java.base=$variant/patch" \
                --add-exports java.base/jdk.internal.mindex=ALL-UNNAMED \
                --add-opens java.base/jdk.internal.mindex=ALL-UNNAMED \
                "-Djava.library.path=$out/native" -cp "$out/tests" "$main" \
                > "$out/logs/java-$mutant-mutant.log" 2>&1; then
              echo "Java $mutant negative control unexpectedly passed" >&2
              exit 1
            else
              status=$?
              if [[ "$status" != 1 ]]; then cat "$out/logs/java-$mutant-mutant.log"; exit 1; fi
              grep -Fq "$diagnostic" "$out/logs/java-$mutant-mutant.log"
            fi
          done
          python3 -B -S - "$out" <<'PY'
          from pathlib import Path
          import sys
          import xml.etree.ElementTree as ET
          root = Path(sys.argv[1])
          markers = {
              "M3MappedStringBackingTest": "M3JDK_MAPPED_BACKING_PASS|",
              "MapFactsTest": "MAP_FACTS_PASS checks=",
              "M3TQTest": "TQ checks=",
              "M3TQArrayCompositionTest": "TQ_ARRAY_COMPOSITION_PASS checks=",
              "M3TQSparseContainmentTest": "TQ_SPARSE_CONTAINMENT_PASS checks=",
              "M3TQAdaptiveContainmentTest": "TQ_ADAPTIVE_CONTAINMENT_PASS checks=",
              "M3TQRollingPreparationTest": "TQ_ROLLING_PREPARATION_PASS checks=",
          }
          cases = [("native", mode, compact, name)
                   for compact in ("compact", "utf16") for mode in ("interpreter", "mixed", "c1", "c2")
                   for name in markers]
          cases += [("ubsan", mode, "compact", name) for mode in ("interpreter", "mixed", "c1", "c2")
                    for name in ("M3TQTest", "M3TQArrayCompositionTest")]
          cases += [("ubsan", "mixed", "utf16", name) for name in ("M3TQTest", "M3TQArrayCompositionTest")]
          for lane, mode, compact, name in cases:
              label = f"{lane}-{mode}-{compact}-{name}"
              log = (root / "logs" / (label + ".log")).read_text()
              if markers[name] not in log or "WARNING in native method" in log or "FATAL ERROR in native method" in log:
                  raise SystemExit(f"Missing or invalid completed product test: {label}")
              if name in ("M3TQTest", "M3TQSparseContainmentTest", "M3TQAdaptiveContainmentTest") and "warmPayloadReads=0" not in log:
                  raise SystemExit(f"Warm payload-read invariant failed: {label}")
              if name == "M3TQArrayCompositionTest" and "native=true" not in log:
                  raise SystemExit(f"Independent JNI oracle was not used: {label}")
          for compact in ("compact", "utf16"):
              for compiler in ("c1", "c2"):
                  for name in ("M3TQTest", "M3TQSparseContainmentTest"):
                      label = f"native-{compiler}-{compact}-{name}"
                      tree = ET.parse(root / "logs" / (label + "-compilation.xml"))
                      methods = [node.get("method", "") for node in tree.iter("nmethod")
                                 if node.get("compiler") == compiler]
                      if not any("jdk.internal.mindex.M3TQ$Facts containsAll " in method for method in methods):
                          raise SystemExit(f"Missing {compiler} containment compilation: {label}")
                      if name == "M3TQTest" and not any("jdk.internal.mindex.M3TQ " in method for method in methods):
                          raise SystemExit(f"Missing {compiler} current-kernel compilation: {label}")
          for required in ("protected-api.txt", "api-contract-result.txt", "module-deps.txt", "jni-abi-result.txt",
                           "logs/native-mutant.log", "java-negative-fixtures.json", "logs/java-seam-mutant.log",
                           "logs/java-containment-mutant.log", "logs/java-order-mutant.log"):
              if not (root / required).is_file() or not (root / required).stat().st_size:
                  raise SystemExit(f"Missing required result: {required}")
          (root / "component-result.txt").write_text(
              f"PASS current product component executions={len(cases)}; JNI ABI; four VM modes; "
              "both compact-string modes; C1/C2 compiler XML; UBSan; API compatibility; java.base-only; "
              "native UTF-16 and Java seam/containment/order negative controls\n")
          print((root / "component-result.txt").read_text(), end="")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tq-recipe-${{ github.sha }}
          path: ${{ runner.temp }}/m3-tq-component/
          if-no-files-found: error

