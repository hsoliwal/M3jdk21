      - name: Run complete pinned fork suites and exact generated-library replays
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/upstream-qualification-regression.py 2>&1 | tee build/m3-jackson-ci/upstream-admission-regression.log
          python3 m3/tooling/module-packs/jackson/upstream-qualification.py \
            --annotations-root build/m3-jackson-upstream-sources/jackson-annotations \
            --core-root build/m3-jackson-upstream-sources/jackson-core \
            --databind-root build/m3-jackson-upstream-sources/jackson-databind \
            --runtime-jars build/m3-jackson/jars --java-home "$JAVA_HOME" \
            --maven "$(command -v mvn)" --cache "$RUNNER_TEMP/m3-jackson-test-maven" \
            --out build/m3-jackson-upstream-proof
      - name: Verify executed contracts, exact source hashes and all eight upstream lanes
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/verify-qualification.py \
            --runtime build/m3-jackson --compiler build/m3-jackson-compiler \
            --upstream build/m3-jackson-upstream-proof --repo-root "$PWD" \
            --expected-head "$M3_JACKSON_HEAD" --out build/m3-jackson-ci/CI_RECEIPT.json
      - name: Retain head-specific Jackson source and JMOD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-jackson-source-jmods-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/m3-jackson-ci/*
            build/m3-jackson/*.json
            build/m3-jackson/*.tsv
            build/m3-jackson/toolchain-release.txt
            build/m3-jackson/logs/*
            build/m3-jackson/legal/**
            build/m3-jackson/jars/*.jar
            build/m3-jackson/pack/*.json
            build/m3-jackson/pack/*.tsv
            build/m3-jackson/pack/*.log
            build/m3-jackson/pack/jmods/*.jmod
            build/m3-jackson-compiler/*.json
            build/m3-jackson-compiler/*.tsv
            build/m3-jackson-compiler/*.log
            build/m3-jackson-compiler/jdk.m3.jackson.compiler.jar
            build/m3-jackson-compiler/pack/*.json
            build/m3-jackson-compiler/pack/*.tsv
            build/m3-jackson-compiler/pack/*.log
            build/m3-jackson-compiler/pack/jmods/*.jmod
            build/m3-jackson-upstream-proof/**/*.json
            build/m3-jackson-upstream-proof/**/*.xml
            build/m3-jackson-upstream-proof/**/*.log
            build/m3-jackson-upstream-proof/**/test-classes/**
            build/m3-jackson-upstream-proof/**/test-classpath.txt
            build/m3-jackson-upstream-proof/**/release.txt
            build/m3-text-tools/**/*.json
            build/m3-text-tools/**/*.tsv

  m3-string-replacement-guard-proof__route-regressions:
    name: "M3 String replacement guard proof / route-regressions"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-string-replacement-guard-proof'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 String replacement guard proof-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned workflow parser
        run: python3 -m pip install --disable-pip-version-check --no-input PyYAML==6.0.3
      - name: Verify retained historical custody without recipe execution
        run: sha256sum -c m3/runtime-integration/string-replacement-guard-sha256.txt
      - name: Verify executed target source and test custody
        run: sha256sum --strict -c m3/runtime-integration/string-replacement-target-sha256.txt
      - name: Run target-owned pool, cursor and workflow contracts
        run: |
          python3 m3/runtime-integration/test_string_pool_precompute.py
          python3 m3/runtime-integration/test_string_cursor_and_ingress.py
          python3 m3/runtime-integration/test_string_workflow_contract.py
      - name: Run replacement route mutation tests on exact String source
        run: python3 m3/runtime-integration/test_string_replacement_routes.py
      - name: Run complete M3 String source invariants without bypass
        run: python3 m3/runtime-integration/check-m3string-invariants.py

  m3-applied-lexicon-contracts__missing-contracts:
    name: "M3 applied lexicon native and java.base contracts / missing-contracts"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-applied-lexicon-contracts'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-applied-lexicon-contracts-${{ github.ref }}-${{ strategy.job-index }}"
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        contract: [fixed-address, literal, code-text]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      M3_CONTRACT: ${{ matrix.contract }}
      M3_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      EVIDENCE: ${{ github.workspace }}/m3-applied-proof-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.contract }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/core/
            /src/java.base/share/classes/jdk/m3/text/
            /m3/lexicon/native/
            /m3/ports/compiletime/
            /m3/verify-fixed-address-jni.py
            /m3/verify-gvas-literal-precompute.py
            /m3/tooling/joined-range-directory/current-module/COMPOSITION_BINDING.json
            /m3/lexicon/m3-code-text-precompute-field-map.tsv
            /m3/lexicon/m3-code-text-target-receiver-receipt-10124.tsv
            /src/java.base/share/classes/java/lang/M3CodeTextFacts.java
            /src/java.base/share/classes/java/lang/M3CodeTextSignalBatch.java
      - name: Verify source identity, capacity and existing Java21 toolchain
        shell: bash
        run: |
          set -euo pipefail
          test ! -e "$EVIDENCE"
          test "$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -1)" -ge 8858370048
          test "$(du -s -B1 "$GITHUB_WORKSPACE" | cut -f1)" -le 268435456
          mkdir -p "$EVIDENCE/tmp" "$EVIDENCE/home" "$EVIDENCE/cache"
          jdk="${JAVA_HOME_21_X64:?A pre-provisioned Java21 toolchain is required}"
          test -x "$jdk/bin/javac"
          "$jdk/bin/javac" -J-XX:-UsePerfData -J-Djava.io.tmpdir="$EVIDENCE/tmp" -J-Duser.home="$EVIDENCE/home" -version | grep -E '^javac 21([. ]|$)'
          printf 'JAVA_HOME=%s\n' "$jdk" >> "$GITHUB_ENV"
          printf '%s/bin\n' "$jdk" >> "$GITHUB_PATH"
          printf 'TMPDIR=%s/tmp\nTEMP=%s/tmp\nTMP=%s/tmp\nHOME=%s/home\nXDG_CACHE_HOME=%s/cache\n' "$EVIDENCE" "$EVIDENCE" "$EVIDENCE" "$EVIDENCE" "$EVIDENCE" >> "$GITHUB_ENV"
          printf 'JAVA_TOOL_OPTIONS=-XX:-UsePerfData -Djava.io.tmpdir=%s/tmp -Duser.home=%s/home\n' "$EVIDENCE" "$EVIDENCE" >> "$GITHUB_ENV"
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,platform,subprocess
          root=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          assert head==os.environ['M3_HEAD']
          raw=(root/'m3/tooling/joined-range-directory/current-module/COMPOSITION_BINDING.json').read_bytes()
          assert hashlib.sha256(raw).hexdigest()=='8932a28368f3ce8531692771d986f0fb24257908ca00ee50dfc6153a159c2c68'
          binding=json.loads(raw)
          assert hashlib.sha256((root/binding['targetPath']).read_bytes()).hexdigest()==binding['after']['sha256']
          for path,digest in binding['custodySha256'].items():
              assert hashlib.sha256((root/path).read_bytes()).hexdigest()==digest
          record=dict(head=head,contract=os.environ['M3_CONTRACT'],system=platform.system(),machine=platform.machine(),compositionSha256=hashlib.sha256(raw).hexdigest(),nativeOrHostSubset=True,wholeJdk=False)
          (pathlib.Path(os.environ['EVIDENCE'])/'source.json').write_text(json.dumps(record,indent=2)+'\n')
          PY
      - name: Execute unchanged contract owners
        shell: bash
        run: |
          set -euo pipefail
          case "$M3_CONTRACT" in
            fixed-address)
              M3JDK="$JAVA_HOME" python3 -I -S -B m3/verify-fixed-address-jni.py 2>&1 | tee "$EVIDENCE/contract.log"
              ;;
            literal)
              M3JDK="$JAVA_HOME" python3 -I -S -B m3/verify-gvas-literal-precompute.py 2>&1 | tee "$EVIDENCE/contract.log"
              ;;
            code-text)
              test ! -e m3/build/m3-code-text-host
              mkdir -p m3/build/m3-code-text-host
              javac --release 21 --patch-module java.base=src/java.base -d m3/build/m3-code-text-host \
                src/java.base/share/classes/java/lang/M3CodeTextFacts.java \
                src/java.base/share/classes/java/lang/M3CodeTextSignalBatch.java \
                m3/core/test/java/lang/M3CodeTextFactsReceiverTest.java \
                m3/core/test/java/lang/M3CodeTextSignalBatchTest.java
              for mode in jit int nocompact c2; do
                flags=()
                case "$mode" in int) flags=(-Xint);; nocompact) flags=(-XX:-CompactStrings);; c2) flags=(-Xbatch -XX:-TieredCompilation);; esac
                java "${flags[@]}" --patch-module java.base=m3/build/m3-code-text-host -ea java.lang.M3CodeTextFactsReceiverTest
                java "${flags[@]}" --patch-module java.base=m3/build/m3-code-text-host -ea java.lang.M3CodeTextSignalBatchTest
              done | tee "$EVIDENCE/contract.log"
              test "$(wc -l < m3/lexicon/m3-code-text-precompute-field-map.tsv)" -eq 12
              grep -F 'M3JDK_CODE_TEXT_PRECOMPUTE_TARGET_RECEIVER_V1' m3/lexicon/m3-code-text-target-receiver-receipt-10124.tsv
              ;;
            *) exit 74 ;;
          esac
          test "$(du -s -B1 "$GITHUB_WORKSPACE" | cut -f1)" -le 536870912
          test "$(df -B1 --output=avail "$GITHUB_WORKSPACE" | tail -1)" -ge 8589934592
      - name: Retain exact source and contract logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-applied-${{ matrix.contract }}
          path: |
            ${{ env.EVIDENCE }}/*.json
            ${{ env.EVIDENCE }}/*.log
          if-no-files-found: warn

  m3-jni-common__platform-workflow-contract:
    name: "M3JDK21 common JNI C11 contract / Platform workflow guard (source-only)"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jni-common'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 common JNI C11 contract-${{ github.ref }}-platform-workflow-contract"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify target and runtime claims are kept distinct
        run: python3 -m unittest discover -s m3/native -p 'test_platform_ci_workflow.py' -v

  m3-jni-common__host-contract:
    name: "M3JDK21 common JNI C11 contract / C11 JNI contract (${{ matrix.os }})"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jni-common'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 common JNI C11 contract-${{ github.ref }}-host-contract-${{ strategy.job-index }}"
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      # Git for Windows rejects deeply nested M3 recipe-custody paths unless
      # core.longpaths is set before checkout creates the working tree.
      - name: Enable Git long paths before checkout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ((git config --global --get core.longpaths).Trim() -ne 'true') {
            throw 'Git long path support was not configured'
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run canonical native contract checks
        run: |
          cmake -S m3/native -B m3/native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build m3/native/build --config Release
          ctest --test-dir m3/native/build -C Release --output-on-failure

  m3-jni-common__android-ndk-compile:
    name: "M3JDK21 common JNI C11 contract / Android ARM64 C11/JNI headers (compile only)"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jni-common'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 common JNI C11 contract-${{ github.ref }}-android-ndk-compile"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile with the runner Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$NDK" || ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            echo 'A provisioned Android NDK is required for this build gate' >&2
            exit 1
          fi
          cmake -S m3/native -B m3/native/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build m3/native/build-android --config Release
          echo 'Android JNI/C11 compile passed; runtime/device JNI tests remain pending.'

  m3-jni-common__ios-arm64-compile:
    name: "M3JDK21 common JNI C11 contract / iOS arm64 C11/JNI sources (cross-compile only)"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jni-common'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 common JNI C11 contract-${{ github.ref }}-ios-arm64-compile"
      cancel-in-progress: true
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile portable native owners with the iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk"
          test -f "$JAVA_HOME/include/jni.h"
          test -f "$JAVA_HOME/include/darwin/jni_md.h"
          cmake -S m3/native -B m3/native/build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DM3_JNI_INCLUDE_DIRS="$JAVA_HOME/include;$JAVA_HOME/include/darwin" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build m3/native/build-ios --config Release --verbose
          echo 'iOS arm64 portable C11/JNI compilation passed.'
          echo 'No iOS JVM, Java execution, Objective-C integration, codesigning or device runtime was tested.'

  m3-sdk-family-names-20261017__sdk-and-donors:
    name: "M3 five-family SDK contracts / sdk-and-donors"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-sdk-family-names-20261017'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 five-family SDK contracts-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            m3/arrays
            m3/evidence/arrays
            src/jdk.m3.collections/share
            make/m3/arrays
            test/jdk/jdk/m3/arrays
            m3/native
            m3/collections
            test/jdk/jdk/m3/collections
            test/jdk/jdk/internal/m3/collections
            m3/qualification/sdk-native-owner
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original M3 array and collection modules
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/arrays/META-INF proof/collections/META-INF
          find m3/arrays/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/arrays -name '*.java' | sort > proof/array-sources.txt
          javac --release 21 -Xlint:all,-module -Werror -d proof/arrays @proof/array-sources.txt
          # Approved layout: legal notice and historical donor provenance have current owners.
          test "$(git hash-object src/jdk.m3.collections/share/legal/m3arrays.md)" = f7002b4c480e10e8af6a0e279cc9582db7de7b9e
          test "$(git hash-object m3/evidence/arrays/provenance.json)" = 619a6822a3a62ff2a652e3b6e011081359132115
          cp m3/arrays/LICENSE proof/arrays/META-INF/LICENSE
          cp src/jdk.m3.collections/share/legal/m3arrays.md proof/arrays/META-INF/NOTICE
          cp m3/evidence/arrays/provenance.json proof/arrays/META-INF/provenance.json
          cmp m3/arrays/LICENSE proof/arrays/META-INF/LICENSE
          cmp src/jdk.m3.collections/share/legal/m3arrays.md proof/arrays/META-INF/NOTICE
          cmp m3/evidence/arrays/provenance.json proof/arrays/META-INF/provenance.json
          jar --create --file proof/m3-arrays.jar -C proof/arrays .
          find m3/collections/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/collections src/jdk.m3.collections/share/classes/jdk/internal/m3/collections -name '*.java' | sort > proof/core-sources.txt
          javac --release 21 -Xlint:all,-module -Werror --module-path proof/m3-arrays.jar \
            -d proof/collections @proof/core-sources.txt
          cp m3/collections/{LICENSE,provenance.json,name-mapping.json} proof/collections/META-INF/
          test "$(git hash-object src/jdk.m3.collections/share/legal/m3collections.md)" = c35cf82657474282058afc7ffbcb98c46fd865e3
          cp src/jdk.m3.collections/share/legal/m3collections.md proof/collections/META-INF/NOTICE
          cmp src/jdk.m3.collections/share/legal/m3collections.md proof/collections/META-INF/NOTICE
          jar --create --file proof/m3-collections.jar -C proof/collections .
          jdeps --print-module-deps --module-path proof/m3-arrays.jar proof/m3-collections.jar \
            > proof/module-closure.txt
          test "$(cat proof/module-closure.txt)" = java.base,jdk.m3.arrays
          ARRAYS="$GITHUB_WORKSPACE/proof/m3-arrays.jar"
          (cd "$RUNNER_TEMP" && mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$ARRAYS" -DpomFile="$GITHUB_WORKSPACE/m3/arrays/pom.xml")
          CORE="$GITHUB_WORKSPACE/proof/m3-collections.jar"
          (cd "$RUNNER_TEMP" && mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$CORE" -DgroupId=com.m3 -DartifactId=m3-collections \
            -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar \
            -DpomFile="$GITHUB_WORKSPACE/m3/collections/pom.xml")
          sha256sum proof/m3-arrays.jar proof/m3-collections.jar > proof/java-artifacts-sha256.txt
      - name: Build original JNI library and execute CTest
        shell: bash
        run: |
          set -euxo pipefail
          test -s m3/native/include/m3_jni_core.h
          cmake -S make/m3/arrays -B proof/native \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DJAVA_HOME="$JAVA_HOME"
          cmake --build proof/native --config Release --parallel 2
          ctest --test-dir proof/native --output-on-failure -C Release
          test -s proof/native/libm3_arrays.so
          sha256sum proof/native/libm3_arrays.so > proof/native-sha256.txt
      - name: Run exact real SDK factories with checked JNI
        shell: bash
        run: |
          set -euxo pipefail
          LIBRARY="$GITHUB_WORKSPACE/proof/native/libm3_arrays.so"
          SDK=m3/collections/interop/src/test/java/jdk/m3/collections/interop/M3SdkFamiliesTest.java
          SPRING=m3/collections/interop/src/test/java/jdk/m3/collections/interop/M3SpringCaseInsensitiveSdkFactoryTest.java
          test "$(git hash-object "$SDK")" = f4aa93c3a674e91d56bdb112dba86af3c97307d9
          test "$(git hash-object "$SPRING")" = fcfbab2a9a49218b57df018992afc3ff1651f8e8
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            '-Dtest=M3SdkFamiliesTest,M3SpringCaseInsensitiveSdkFactoryTest' \
            "-DargLine=-Xcheck:jni -Dm3.arrays.native.path=$LIBRARY" \
            "-Dm3.arrays.native.path=$LIBRARY" verify 2>&1 | tee proof/sdk-junit.log
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path('m3/collections/interop/target/surefire-reports')
          expected = {'M3SdkFamiliesTest': 7, 'M3SpringCaseInsensitiveSdkFactoryTest': 2}
          identities = set()
          for name, count in expected.items():
              paths = list(reports.glob('TEST-jdk.m3.collections.interop.' + name + '.xml'))
              assert len(paths) == 1, ('missing or duplicate original SDK suite', name)
              root = ET.parse(paths[0]).getroot()
              assert int(root.get('tests', '-1')) == count, ('SDK method count', name)
              assert all(int(root.get(k, '-1')) == 0 for k in ('failures', 'errors', 'skipped'))
              methods = root.findall('testcase')
              assert len(methods) == count
              for method in methods:
                  assert not list(method), ('failed, skipped or flaky SDK test', name)
                  pair = method.get('classname'), method.get('name')
                  assert all(pair) and pair not in identities
                  identities.add(pair)
          assert len(identities) == 9
          print('M3_SDK_NATIVE_OWNER_PASS methods=9 classes=2 checked_jni=true')
          PYTEST
          git diff --exit-code -- src/jdk.m3.collections/share m3/collections/src/main/java m3/collections/interop/src
      - name: Preserve SDK native and JUnit receipts including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-sdk-native-owner-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
