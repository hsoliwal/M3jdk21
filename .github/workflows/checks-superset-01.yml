      contents: read
    concurrency:
      group: "M3 JDK21 verbatim oracle-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout M3JDK21 candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          path: candidate

      - name: Prove comparator
        run: python3 candidate/m3/tooling/baseline/test_compare_jdk21.py

      - name: Checkout pinned OpenJDK 21 GA oracle
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: openjdk/jdk
          ref: 890adb6410dab4606a4f26a942aed02fb2f55387
          persist-credentials: false
          path: baseline
          fetch-depth: 1

