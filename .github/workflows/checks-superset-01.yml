          gcc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_compactor.c -o "$M3_TASK_OUT/native/libm3_collections_mask.so"
          # Reuse the canonical m3/arrays JNI owner for required-backed collection factories.
