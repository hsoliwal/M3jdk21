# SPDX-License-Identifier: Apache-2.0
# Checks superset 01: generated by .github/checks-superset/generate.py from filters.json and the member
# workflow files, which stay the source of truth for every member job below. Do not edit by hand: edit the
# member file, then run  python3 .github/checks-superset/generate.py build
name: 'Checks superset 01'

on:
  push:
    branches: ["aix/jdk22-27-backports-20261002", "m3/db-parse-20261004", "m3/indexdb-build-state-20261020", "m3/java21-convergence-ci-proof-20261002", "m3/jep423-materialize-current-*", "m3/m3-apache-import-*", "m3/native-five-family-no-vendor-runtime-20261027", "m3/release-jep-authority-repair-*", "m3/string-replacement-guard-20261012", "release/**"]
  pull_request:
    paths: [".github/workflows/m3-applied-lexicon-contracts.yml", ".github/workflows/m3-array-substrate.yml", ".github/workflows/m3-ci-probe.yml", ".github/workflows/m3-core-contract-matrix.yml", ".github/workflows/m3-core-current-baseline.yml", ".github/workflows/m3-db-parse.yml", ".github/workflows/m3-eclipse-core-optional-jmod.yml", ".github/workflows/m3-eclipse-framework-forward-20261017.yml", ".github/workflows/m3-file-content-delta.yml", ".github/workflows/m3-file-shadow-stream-20261020.yml", ".github/workflows/m3-first-release-admission.yml", ".github/workflows/m3-foundation.yml", ".github/workflows/m3-full-delivery-a3.yml", ".github/workflows/m3-import.yml", ".github/workflows/m3-indexdb-build-state-20261020.yml", ".github/workflows/m3-jep423-current-materialize.yml", ".github/workflows/m3-jni-common.yml", ".github/workflows/m3-joined-range-directory.yml", ".github/workflows/m3-lane28.yml", ".github/workflows/m3-long-direct-address-kernel.yml", ".github/workflows/m3-mop-memory-20261020.yml", ".github/workflows/m3-owned-apache-multivalue.yml", ".github/workflows/m3-owned-guava-minmax-priority-queue.yml", ".github/workflows/m3-parallel-bitcount.yml", ".github/workflows/m3-parallel-bulk-provider.yml", ".github/workflows/m3-release-jep-authority-repair.yml", ".github/workflows/m3-release.yml", ".github/workflows/m3-sdk-family-names-20261017.yml", ".github/workflows/m3-secondary-recipe-caller-20261021.yml", ".github/workflows/m3-string-replacement-guard-proof.yml", ".github/workflows/m3-tq.yml", ".github/workflows/m3jdk-all-files-m3scale-20261018.yml", ".github/workflows/m3jdk-regex-spec.yml", ".github/workflows/m3jdk-standard.yml", ".github/workflows/m3jdk21-backports.yml", ".github/workflows/m3jdk21-verbatim.yml", ".github/workflows/m3sdk-jmod-receiver.yml", ".github/workflows/mindex-string-backing.yml", ".github/workflows/native-five-family-contract.yml", ".m3/openrewrite-recipes/**", ".m3/recipe-source-custody-20261018/**", "M3-SYNEXIA-AUTHORS.md", "M3-SYNEXIA-NOTICE.md", "M3-SYNEXIA-RIGHTS.md", "doc/mindex-string-backing.md", "m3/**", "make/**", "src/**", "test/**", "tools/m3scale/**"]
  workflow_dispatch:
    inputs:
      select:
        description: "Members to run: all, or member file names / keys separated by spaces or commas"
        required: false
        default: "all"
      chrome_ai:
        description: "Require installed optional M3JDK21 Chrome AI capability"
        type: "boolean"
        required: false
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: 'Superset gate'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 'Check out the gate files'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/checks-superset
          fetch-depth: 1
          filter: blob:none
      - name: 'Decide member workflows from triggers, branches and changed paths (plain git)'
        id: gate
        run: python3 .github/checks-superset/gate.py 01

  m3-secondary-recipe-caller-20261021__existing-recipe-receiver:
    name: "M3JDK21 Secondary Recipe Bootstrap (candidate-only) / existing-recipe-receiver"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-secondary-recipe-caller-20261021'] }}"
    permissions:
      contents: read
      pull-requests: read
    concurrency:
      group: "M3JDK21 Secondary Recipe Bootstrap (candidate-only)-${{ github.ref }}"
      cancel-in-progress: true
    # Full-length public executor SHA, not a floating tag or a private Synexia workflow.
    uses: hsoliwal/rewrite/.github/workflows/m3-secondary-recipe-executor-20261021.yml@5bf9bfc4adf50d54efe14b36daf5a2e96f0e2bc1
    with:
      executor_sha: 5bf9bfc4adf50d54efe14b36daf5a2e96f0e2bc1
      target_pom: .m3/openrewrite-recipes/pom.xml
      pr_number: ${{ github.event.pull_request.number || 0 }}
      chrome_ai: ${{ inputs.chrome_ai || false }}

  m3-first-release-admission__contract:
    name: "M3 first release admission / release contract and provenance"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-first-release-admission'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-first-release-admission-${{ github.ref }}-contract"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned naming-schema test dependencies
        run: python3 -m pip install --disable-pip-version-check -r m3/migration/requirements.txt
      - name: Diff hygiene
        run: git diff --check
      - name: Unit-test the release verifier
        run: python3 -m unittest discover -s m3/release -p 'test_*.py' -v
      - name: Fail if standalone M3 core tests are omitted
        run: |
          python3 m3/release/verify_test_wiring.py --root . --strict \
            --json-out m3/release/queue/current/core-test-wiring.json
      - name: Record human/machine release branch identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/release/queue/current
          mode=()
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then mode=(--release); fi
          python3 m3/release/audit_release_identity.py --root . \
            --json-out m3/release/queue/current/release-identity.json "${mode[@]}"
      - name: Test canonical naming and package refusals
        run: python3 -m unittest discover -s m3/tooling/name-contract -p 'test_*.py' -v
      - name: Validate release claims and boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/release/queue/current
          mode=()
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            mode=(--release)
          fi
          python3 m3/release/verify_release_admission.py \
            --root . "${mode[@]}" \
            --json-out m3/release/queue/current/admission.json \
            --queue-out m3/release/queue/current/README.md \
            --sha256-out m3/release/queue/current/SHA256SUMS
          git rev-parse HEAD | tee m3/release/queue/current/HEAD
          git rev-parse 'HEAD^{tree}' | tee m3/release/queue/current/TREE
          git status --porcelain=v1 --untracked-files=no | tee m3/release/queue/current/WORKTREE
          test ! -s m3/release/queue/current/WORKTREE
      - name: Export canonical naming and retained source queues
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/release/queue/current
          python3 m3/tooling/name-contract/check.py | tee m3/release/queue/current/name-check.txt
          python3 m3/tooling/name-contract/audit.py > m3/release/queue/current/name-census.tsv
          queue_mode=()
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            queue_mode=(--strict)
          fi
          python3 m3/release/retained_source_queue.py --root . \
            --tsv-out m3/release/queue/current/retained-source-queue.tsv \
            --summary-out m3/release/queue/current/retained-source-summary.json \
            "${queue_mode[@]}"
      - name: Show retained-source review queue
        if: always()
        shell: bash
        run: |
          if test -f m3/release/queue/current/retained-source-summary.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          info = json.loads(Path('m3/release/queue/current/retained-source-summary.json').read_text(encoding='utf-8'))
          print('## M3JDK21 archived-source review queue')
          print()
          print('Exact HEAD: `' + info['tree_head'] + '`')
          print()
          print('| Source path disposition | Number of rows |')
          print('| --- | ---: |')
          for state, total in sorted(info['states'].items()):
              print('| ' + state + ' | ' + str(total) + ' |')
          print('| **Review required** | **' + str(info['unresolved_rows']) + '** |')
          print()
          print('Full original paths, PR numbers, Git blob identities and modes are in the uploaded TSV and JSON artifacts.')
          print('Path equality is not API, compiler, JNI or runtime acceptance; no automatic merge is authorized.')
          PY
          fi
      - name: Expose intermediate release queue
        if: always()
        shell: bash
        run: |
          if test -f m3/release/queue/current/README.md; then
            cat m3/release/queue/current/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-release-contract-${{ github.sha }}
          path: m3/release/queue/current
          retention-days: 90
          if-no-files-found: error

  m3-first-release-admission__foundation:
    name: "M3 first release admission / immutable text foundation"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-first-release-admission'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-first-release-admission-${{ github.ref }}-foundation"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare exact Java 21 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' \
            -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' \
            '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' \
            "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          echo "M3JDK=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"
      - name: Build and test P0 immutable text foundation
        run: bash ./m3/build.sh
      - name: Execute separately qualified additional core contracts
        run: bash ./m3/release/run_extra_core_contracts.sh
      - name: Verify Synexia compatibility and shared mapping
        run: |
          python3 m3/compatibility/check-m3.py
          python3 m3/verify-shared-mapping.py
      - name: Record core suite wiring and hash raw test logs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/build/logs
          python3 m3/release/verify_test_wiring.py --root . --strict \
            --json-out m3/build/logs/core-test-wiring.json
          find m3/build/logs -maxdepth 1 -type f -name '*.log' -print0 | \
            sort -z | xargs -0 -r sha256sum > m3/build/logs/test-log-sha256.txt
      - name: Upload P0 foundation raw test logs and wiring evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-foundation-test-evidence-${{ github.sha }}
          path: |
            m3/build/logs/
            m3/build/english-image-path.txt
          if-no-files-found: warn
          retention-days: 90

  m3-first-release-admission__precompute:
    name: "M3 first release admission / Java and JNI precompute parity"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-first-release-admission'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-first-release-admission-${{ github.ref }}-precompute"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java differential proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml test
      - name: JNI/native parity proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative test
      - name: Upload precompute Surefire and native test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: m3-precompute-test-evidence-${{ github.sha }}
          path: |
            m3/ports/precompute/target/surefire-reports/
            m3/ports/precompute/target/failsafe-reports/
          if-no-files-found: warn
          retention-days: 90

  m3-first-release-admission__control-reactor:
    name: "M3 first release admission / M3JDK21 Maven control-reactor execution"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-first-release-admission'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-first-release-admission-${{ github.ref }}-control-reactor"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Execute the complete product Maven control reactor
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/release/run_maven_control_reactor.py --root . \
            --expected-commit "$EXPECTED_SOURCE_COMMIT" \
            --out "$RUNNER_TEMP/m3-maven-control" --timeout-seconds 1800
      - name: Require the same-run product Maven receipt
        if: always()
        env:
          MAVEN_EVIDENCE: ${{ runner.temp }}/m3-maven-control/evidence.json
        shell: bash
        run: |
          set -euo pipefail
          # Product execution and canonical transformation provenance have separate owners.
          # This consumer reads only the exact evidence produced above, including HOLD/FAIL.
          python3 - <<'PYCODE'
          import importlib.util
          import json
          import os
          from pathlib import Path
          path = Path('m3/release/verify_release_admission.py')
          spec = importlib.util.spec_from_file_location('release_admission', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.validate(Path('.'), evidence_path=Path(os.environ['MAVEN_EVIDENCE']))
          name = 'gate:M3_MAVEN_CONTROL_REACTOR'
          checks = [check for check in result['checks'] if check['name'] == name]
          print(json.dumps({'source_commit': result['source_commit'],
                            'canonical_maven_gate': checks}, sort_keys=True))
          if not result['policy_valid'] or len(checks) != 1 or checks[0]['status'] != 'PASS':
              raise SystemExit('HOLD: the same-run full product Maven execution is not qualified; inspect the producer artifacts. Canonical recipe provenance never substitutes for product execution.')
          PYCODE
      - name: Full-family and receiving-policy verification
        if: always()
        run: |
          if test -f m3/compatibility/check_m3_full_family.py; then
            python3 m3/compatibility/check_m3_full_family.py
            python3 -m unittest discover -s m3/compatibility -p 'test_m3_full_family.py' -v
          fi

      - name: Upload product Maven execution or refusal evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-maven-control-${{ github.sha }}
          path: ${{ runner.temp }}/m3-maven-control
          if-no-files-found: error
          retention-days: 90

  m3-first-release-admission__release-proof-summary:
    name: "M3 first release admission / proof summary"
    needs: ["gate", "m3-first-release-admission__contract", "m3-first-release-admission__foundation", "m3-first-release-admission__precompute", "m3-first-release-admission__control-reactor"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-first-release-admission'] && (always()) }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-first-release-admission-${{ github.ref }}-release-proof-summary"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    steps:
      - name: Summarize release admission
        shell: bash
        run: |
          {
            echo '## M3JDK21 first-release admission'
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| contract/provenance | ${{ needs.m3-first-release-admission__contract.result }} |"
            echo "| immutable text foundation | ${{ needs.m3-first-release-admission__foundation.result }} |"
            echo "| Java + JNI precompute parity | ${{ needs.m3-first-release-admission__precompute.result }} |"
            echo "| M3jdk21 Maven control-reactor receipt | ${{ needs.m3-first-release-admission__control-reactor.result }} |"
            echo
            echo 'The existing OpenJDK GHA sanity workflow remains the product-build/platform matrix.'
            echo 'A passing proof summary does not upgrade any claim marked NOT_CLAIMED in release-contract.json.'
            echo 'Historical recipe sources remain migration debt; this workflow never runs their target-local executors.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any mandatory M3 gate failed
        if: >
          needs.m3-first-release-admission__contract.result != 'success' ||
          needs.m3-first-release-admission__foundation.result != 'success' ||
          needs.m3-first-release-admission__precompute.result != 'success' ||
          needs.m3-first-release-admission__control-reactor.result != 'success'
        run: exit 1

  m3-ci-probe__probe:
    name: "M3 CI probe / probe"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-ci-probe'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 CI probe-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    steps:
      - name: Runner probe
        shell: bash
        run: |
          set -euo pipefail
          printf 'M3_CI_PROBE=PASS\n'
          java -version
          mvn -version

  m3-foundation__instance-index-contract:
    name: "M3 foundation contracts / instance-index-contract"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-foundation'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 foundation contracts-${{ github.ref }}-instance-index-contract"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout only the owner and contract test
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /src/java.base/share/classes/jdk/m3/text/M3InstanceIndexPrecompute.java
            /m3/core/test/M3InstanceIndexPrecomputeTest.java
      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and execute the isolated owner contract
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
        run: |
          set -euo pipefail
          test "$TEMP" = "$RUNNER_TEMP"
          test "$TMP" = "$RUNNER_TEMP"
          printf 'TEMP=%s\nTMP=%s\n' "$TEMP" "$TMP"
          classes="$RUNNER_TEMP/m3-instance-index-contract"
          mkdir -p "$classes"
          javac --release 17 -Xlint:all -Werror -d "$classes" \
            src/java.base/share/classes/jdk/m3/text/M3InstanceIndexPrecompute.java \
            m3/core/test/M3InstanceIndexPrecomputeTest.java
          output="$(java -ea -cp "$classes" M3InstanceIndexPrecomputeTest)"
          printf '%s\n' "$output"
          test "$output" = "M3JDK_INSTANCE_INDEX_PRECOMPUTE_PASS checks=25"

  m3-foundation__foundation:
    name: "M3 foundation contracts / foundation"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-foundation'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 foundation contracts-${{ github.ref }}-foundation"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare isolated pinned compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          echo "M3JDK=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"
      - name: Exercise WordRows Java and JNI in four VM modes
        shell: bash
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}
          _JAVA_OPTIONS: ''
          JDK_JAVA_OPTIONS: ''
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }} -XX:-UsePerfData
        run: |
          set -euo pipefail
          printf 'M3_WORDROWS_SOURCE_COMMIT=%s\n' "$(git rev-parse HEAD)"
          git ls-tree HEAD -- \
            src/java.base/share/classes/jdk/m3/text/M3WordRows.java \
            src/java.base/share/classes/jdk/m3/text/M3WordRowsNative.java \
            m3/core/test/M3WordRowsContractTest.java \
            m3/lexicon/native/m3_wordrows_jni.c \
            m3/lexicon/run-wordrows-proof.sh
          log="$RUNNER_TEMP/m3-wordrows-contract.log"
          sha256sum \
            src/java.base/share/classes/jdk/m3/text/M3WordRows.java \
            src/java.base/share/classes/jdk/m3/text/M3WordRowsNative.java \
            m3/core/test/M3WordRowsContractTest.java \
            m3/lexicon/native/m3_wordrows_jni.c \
            m3/lexicon/run-wordrows-proof.sh
          bash m3/lexicon/run-wordrows-proof.sh | tee "$log"
          test "$(grep -c '^M3_WORDROWS_PASS checks=96 JNI=true imageFormat=3 scope=word-id-arithmetic-no-string-replacement$' "$log")" -eq 4
          test "$(grep -c '^M3_WORDROWS_FIXTURE_CLEANUP_PASS files=7 childExited=true$' "$log")" -eq 4
      - name: Verify layered source-bound recipes
        run: |
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py --check
          python3 m3/runtime-integration/char-array-copy/recipe/test_recipe.py
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py --reverse
          trap 'python3 m3/runtime-integration/char-array-copy/recipe/apply.py >/dev/null' EXIT
          python3 m3/runtime-integration/recipe/apply.py --check
          python3 m3/runtime-integration/recipe/test_recipe.py
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py
          trap - EXIT
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py --check
      - name: Verify OpenRewrite convergence DAG
        run: |
          java -version
          mvn -version
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml clean verify
      - name: Build and exercise immutable foundation
        run: bash ./m3/build.sh
      - name: Compare pinned Synexia content and range contract
        run: python3 m3/compatibility/check-m3.py
      - name: Verify two-process read-only image mapping
        run: python3 m3/verify-shared-mapping.py

  m3jdk-standard__source-names:
    name: "M3JDK source naming / source-names"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk-standard'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK source naming-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/compiler/jdk-standard/**
            /.github/workflows/m3jdk-standard.yml
      - name: Materialize Java source scope
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          patterns="${RUNNER_TEMP}/m3jdk-standard-sparse.txt"
          printf '%s\n' \
            '/m3/compiler/jdk-standard/**' \
            '/.github/workflows/m3jdk-standard.yml' > "$patterns"
          if [[ '${{ github.event_name }}' == 'pull_request' ]]; then
            git diff --name-only --diff-filter=ACMR "$BASE...$HEAD" -- '*.java'
          else
            git ls-tree -r --name-only "$HEAD" -- '*.java'
          fi | sed '/^$/d; s#^#/#' >> "$patterns"
          sort -u "$patterns" -o .git/info/sparse-checkout
          git read-tree -mu HEAD
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Standalone compiler and discriminator proof
        run: bash m3/compiler/jdk-standard/verify.sh
      - name: Maven module proof
        run: mvn -B -ntp -f m3/compiler/jdk-standard/pom.xml verify
      - name: Refuse findings introduced on added source lines
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: >-
          bash m3/compiler/jdk-standard/check-changed.sh
          "$BASE" "$HEAD" "${RUNNER_TEMP}/m3jdk-standard-changed.tsv"
      - name: Repository-wide warning census
        if: github.event_name == 'workflow_dispatch'
        run: >-
          bash m3/compiler/jdk-standard/census.sh
          "${RUNNER_TEMP}/m3jdk-standard-census.tsv"
      - name: Summarize naming reports
        if: always()
        shell: bash
        run: |
          shopt -s nullglob
          reports=("${RUNNER_TEMP}"/m3jdk-standard-*.tsv)
          if (( ${#reports[@]} == 0 )); then
            echo 'No naming report was produced.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          for report in "${reports[@]}"; do
            findings=$(( $(wc -l < "$report") - 1 ))
            echo "### $(basename "$report")" >> "$GITHUB_STEP_SUMMARY"
            echo "Findings: $findings" >> "$GITHUB_STEP_SUMMARY"
            awk -F '\t' 'NR > 1 { count[$4]++ }
              END { for (rule in count) print "- " rule ": " count[rule] }' \
              "$report" | sort >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Upload naming reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3jdk-standard-${{ github.run_id }}
          path: ${{ runner.temp }}/m3jdk-standard-*.tsv
          if-no-files-found: ignore
          retention-days: 14

  m3-eclipse-core-optional-jmod__jmod-receiving-proof:
    name: "M3 optional Eclipse core JMOD - real owner Java21 JNI / jmod-receiving-proof"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-eclipse-core-optional-jmod'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-eclipse-core-jmod-${{ github.head_ref || github.ref_name }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            m3/core
            m3/arrays
            src/jdk.m3.collections/share
            make/m3/arrays
            test/jdk/jdk/m3/arrays
            m3/ast
            m3/collections
            test/jdk/jdk/m3/collections
            test/jdk/jdk/internal/m3/collections
            m3/file
            m3/eclipse/optional-jmod
            m3/tooling/migration-recipes
            m3/docs/name-mapping.d/eclipse-core-optional-jmod-20261018.tsv
            m3/LICENSE
            m3/NOTICE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind exact PR head and verify eight source/template identities
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head.txt
          java -version 2>&1 | tee proof/java-version.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          root = Path('m3/eclipse/optional-jmod/recipe/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/eclipse-core-optional-jmod')
          lines = [x.split('\t') for x in (root / 'manifest.tsv').read_text().splitlines()
                   if x and not x.startswith('#')]
          assert len(lines) == 8, lines
          assert [x[0] for x in lines] == sorted(x[0] for x in lines)
          for path, before, digest, template in lines:
              assert before == 'ABSENT'
              assert len(digest) == 64
              for file in (Path(path), root / template):
                  assert file.is_file() and not file.is_symlink(), file
                  actual = hashlib.sha256(file.read_bytes()).hexdigest()
                  assert actual == digest, (file, digest, actual)
          print('EIGHT_EXACT_M3_JAVA_POSTIMAGES')
          PY
      - name: Verify source seal for strict-warning Builder correction
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('m3/eclipse/optional-jmod/recipe/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-shared-lexicon-builder-explicit-ctor-20261018')
          rows = [x.split('\t') for x in (root / 'manifest.tsv').read_text().splitlines()
                  if x and not x.startswith('#')]
          assert len(rows) == 1, rows
          path, before, after, template = rows[0]
          assert path == 'src/java.base/share/classes/jdk/m3/text/SharedLexiconPrecomputeCatalog.java'
          fixture = Path('m3/eclipse/optional-jmod/recipe/src/test/resources/jdk/internal/m3/rewrite/m3-shared-lexicon-builder-explicit-ctor-20261018/SharedLexiconPrecomputeCatalog.java.before.txt')
          target = Path(path)
          postimage = root / template
          for item in (fixture, target, postimage):
              assert item.is_file() and not item.is_symlink(), item
          digest = lambda item: hashlib.sha256(item.read_bytes()).hexdigest()
          assert digest(fixture) == before, (fixture, before, digest(fixture))
          assert digest(postimage) == after, (postimage, after, digest(postimage))
          assert digest(target) in {before, after}, (target, before, after, digest(target))
          named = Path('m3/eclipse/optional-jmod/recipe/src/main/resources/META-INF/rewrite/m3-shared-lexicon-builder-explicit-ctor-20261018.yml')
          assert named.is_file() and not named.is_symlink(), named
          print('EXACT_SHARED_LEXICON_BUILDER_POSTIMAGE_SEAL')
          PY
      - name: Execute actual canonical OpenRewrite fixed-point and refusal tests
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/optional-jmod/recipe/pom.xml test 2>&1 | tee proof/recipe.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=list(Path('m3/eclipse/optional-jmod/recipe/target/surefire-reports').glob('TEST-*.xml'))
          assert r, 'missing OpenRewrite JUnit report'
          roots=[ET.parse(x).getroot() for x in r]
          totals={k: sum(int(x.attrib.get(k,0)) for x in roots)
                  for k in ('tests','failures','errors','skipped')}
          assert totals == {'tests':8,'failures':0,'errors':0,'skipped':0}, totals
          print('CANONICAL_OPENREWRITE_TESTS_PASSED',totals)
          PY
      - name: Build real target M3File module with Java21 warnings-as-errors
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/file/pom.xml package 2>&1 | tee proof/m3-file-maven.txt
      - name: Compile reused M3 JNI selector with native warnings-as-errors
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/native
          cc -std=c17 -O2 -shared -fPIC -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so 2>&1 | tee proof/native-compile.txt
          sha256sum proof/native/libm3_collections_mask.so > proof/native-sha256.txt
      - name: Package all REAL M3 owner sources as JPMS/JMOD; check JNI, jlink, replay
        shell: bash
        run: |
          set -euxo pipefail
          JAVA_TOOL_OPTIONS="-Djava.library.path=$GITHUB_WORKSPACE/proof/native -Dm3.native.required=true -Xcheck:jni" \
            python3 m3/eclipse/optional-jmod/build.py verify \
            --jdk "$JAVA_HOME" --out "$GITHUB_WORKSPACE/proof/optional-jmod" \
            2>&1 | tee proof/real-jmod-build.txt
          grep -q 'M3_ECLIPSE_OPTIONAL_JMOD_REAL_JPMS_PASS assertions=22' proof/real-jmod-build.txt
          grep -q 'M3_ECLIPSE_CORE_JMOD_VERIFIED' proof/real-jmod-build.txt
          test -s proof/optional-jmod/jmods/jdk.m3.eclipse.core.jmod
          test -s proof/optional-jmod/JMOD_BUILD.tsv
          "$JAVA_HOME/bin/jmod" describe proof/optional-jmod/jmods/jdk.m3.eclipse.core.jmod \
            > proof/eclipse-core-module-descriptor.txt
          grep -q 'provides jdk.m3.eclipse.core.M3EclipseCore' proof/eclipse-core-module-descriptor.txt
          grep -q 'org.m3jdk.file' proof/eclipse-core-module-descriptor.txt
          git diff --exit-code -- m3/core/src m3/arrays/src m3/ast/src \
            m3/collections/src m3/file/src m3/eclipse/optional-jmod/src
      - name: Upload exact-head binary and source-qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-optional-jmod-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/head.txt
            proof/java-version.txt
            proof/recipe.txt
            proof/m3-file-maven.txt
            proof/native-compile.txt
            proof/native-sha256.txt
            proof/real-jmod-build.txt
            proof/eclipse-core-module-descriptor.txt
            proof/optional-jmod/JMOD_BUILD.tsv
            proof/optional-jmod/jmods/*.jmod
            m3/eclipse/optional-jmod/recipe/target/surefire-reports/

  m3-jep423-current-materialize__materialize-and-prove:
    name: "M3 JEP 423 current materialization / materialize-and-prove"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jep423-current-materialize'] && (!contains(github.event.head_commit.message || '', '[m3-jep423-materialized]')) }}"
    permissions:
      contents: write
    concurrency:
      group: "M3 JEP 423 current materialization-${{ github.ref }}-materialize-and-prove"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene and unit proof
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile \
            m3/backports/current_tree_preimage_inventory.py \
            m3/backports/file_delta_inventory.py \
            m3/backports/generate_recipe_crates.py \
            m3/backports/materialize_generated_crates.py \
            m3/backports/recipes/jep-423-region-pinning/validate_lineage.py \
            m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py
          (
            cd m3/backports
            python3 -m unittest -v \
              test_current_tree_preimage_inventory.py \
              test_file_delta_inventory.py \
              test_generate_recipe_crates.py \
              test_materialize_generated_crates.py \
              test_jep423_lineage.py \
              test_jep423_current_admission.py
          )

      - name: 2 - Fetch exact JDK21 baseline and full JEP423 repair lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch \
            --filter=blob:none --no-tags origin \
            "refs/tags/jdk-21+35:refs/tags/jdk-21+35" \
            "refs/tags/jdk-22+36:refs/tags/jdk-22+36" \
            "38cfb220ddadbb401cc15f313aadb8234f626210" \
            "8643cc21333c6b51242ed3b9295b25f372244755" \
            "0d5f5e15d43f94a79c6133baecd5af217365d176"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: 3 - Validate lineage and current-tree admission
        shell: bash
        run: |
          set -euo pipefail
          packet=m3/backports/recipes/jep-423-region-pinning
          python3 "$packet/validate_lineage.py"
          mkdir -p "$RUNNER_TEMP/jep423"
          python3 m3/backports/current_tree_preimage_inventory.py \
            --root . \
            --paths-file "$packet/CUMULATIVE_ADMIT_PATHS.txt" \
            --out "$RUNNER_TEMP/jep423/CURRENT_PREIMAGES.tsv" \
            --baseline-git "$UPSTREAM" \
            --baseline-ref jdk-21+35 \
            --admission-out "$RUNNER_TEMP/jep423/CURRENT_TREE_FILE_ADMISSION.tsv" \
            --mechanical-paths-out "$RUNNER_TEMP/jep423/MECHANICAL_PATHS.txt"
          python3 "$packet/validate_current_admission.py" \
            --packet "$packet" \
            --admission "$RUNNER_TEMP/jep423/CURRENT_TREE_FILE_ADMISSION.tsv"

      - name: 4 - Generate one source-sealed FILE crate per admitted path
        shell: bash
        run: |
          set -euo pipefail
          packet=m3/backports/recipes/jep-423-region-pinning
          python3 m3/backports/file_delta_inventory.py \
            --repo "$UPSTREAM" \
            --release 22 \
            --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176 \
            --out "$RUNNER_TEMP/jep423/JDK21_TO_JEP423_FINAL.tsv"
          python3 m3/backports/generate_recipe_crates.py \
            --repo "$UPSTREAM" \
            --release 22 \
            --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176 \
            --paths-file "$RUNNER_TEMP/jep423/MECHANICAL_PATHS.txt" \
            --donor-map "$packet/PATH_DONOR_OVERRIDES.tsv" \
            --crate-size 1 \
            --include-native \
            --include-text \
            --out "$RUNNER_TEMP/jep423/file-atoms"
          python3 "$packet/validate_current_admission.py" \
            --packet "$packet" \
            --runner "$RUNNER_TEMP/jep423"

      - name: 4b - Bootstrap source-vendored Maven DAG dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Build pinned upstream source artifacts before resolving source-coordinate dependencies.
          mvn -B -ntp -f m3/vendor/third_party/pom.xml -DskipTests install
          # Build/install migration, A3, and DAG modules in reactor dependency order.
          # This is preparation only; focused G1/JNI/JFR tests and promotion gates stay intact.
          mvn -B -ntp -f m3/pom.xml -pl tooling/backport-dag -am -DskipTests install

      - name: 5 - Prove scoped recipe DAG before source mutation
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=jdk.m3.tooling.dag.BackportPacketMain \
            -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv" \
            exec:java

      - name: 6 - Check exact preimages then materialize recipe output
        shell: bash
        run: |
          set -euo pipefail
          generated="$RUNNER_TEMP/jep423/file-atoms"
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$generated" \
            --mode check \
            --require-one-target-per-crate \
            --receipt "$RUNNER_TEMP/jep423/preimage.tsv"
          test -z "$(git status --porcelain=v1 -uall)"
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$generated" \
            --mode apply \
            --require-one-target-per-crate \
            --receipt "$RUNNER_TEMP/jep423/apply.tsv"
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$generated" \
            --mode verify-post \
            --require-one-target-per-crate \
            --receipt "$RUNNER_TEMP/jep423/postimage.tsv"
          before="$(git diff --binary | sha256sum | awk '{print $1}')"
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$generated" \
            --mode apply \
            --require-one-target-per-crate
          after="$(git diff --binary | sha256sum | awk '{print $1}')"
          test "$before" = "$after"
          git diff --check

      - name: 7 - Prove exactly the generated 62 FILE targets changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import subprocess
          from pathlib import Path

          generated = Path(os.environ["RUNNER_TEMP"]) / "jep423" / "file-atoms"
          expected = set()
          for root in (
              generated / "src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned",
              generated / "src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text",
          ):
              if not root.exists():
                  continue
              for manifest in root.glob("*/manifest.tsv"):
                  for line in manifest.read_text(encoding="utf-8").splitlines():
                      if line and not line.startswith("#"):
                          expected.add(line.split("\t", 1)[0])

          actual = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain=v1", "-uall"], text=True
              ).splitlines()
              if line
          }
          if actual != expected:
              raise SystemExit(
                  "JEP423 changed-path fence failed\n"
                  f"expected={sorted(expected)}\nactual={sorted(actual)}"
              )
          if len(actual) != 62:
              raise SystemExit(f"JEP423 expected 62 changes, got {len(actual)}")
          print("JEP423_CHANGED_PATHS=62")
          PY

      - name: 8 - Install focused OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: 9 - Configure and build fastdebug JDK image
        shell: bash
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=fastdebug \
            --with-jvm-variants=server \
            --disable-warnings-as-errors
          make JOBS=2 images

      - name: 10 - Run pinned-object G1 JNI and JFR regressions
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="\
          test/hotspot/jtreg/gc/g1/pinnedobjs \
          test/hotspot/jtreg/gc/g1/plab/TestPLABEvacuationFailure.java \
          test/hotspot/jtreg/gc/g1/TestGCLogMessages.java \
          test/hotspot/jtreg/gc/stress/gclocker/TestExcessGCLockerCollections.java \
          test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/TestJNIBlockFullGC.java \
          test/jdk/jdk/jfr/event/gc/collection/TestG1ParallelPhases.java \
          test/jdk/jdk/jfr/event/gc/collection/TestGCCauseWithG1ConcurrentMark.java \
          test/jdk/jdk/jfr/event/gc/collection/TestGCCauseWithG1FullCollection.java \
          test/jdk/jdk/jfr/event/gc/detailed/TestGCLockerEvent.java"

      - name: 11 - Write proof receipt after all gates pass
        shell: bash
        run: |
          set -euo pipefail
          receipt=m3/backports/recipes/jep-423-region-pinning/CURRENT_TREE_RECEIPT.tsv
          post_root="$(sha256sum "$RUNNER_TEMP/jep423/postimage.tsv" | awk '{print $1}')"
          {
            printf 'field\tvalue\n'
            printf 'jep\t423\n'
            printf 'title\tRegion Pinning for G1\n'
            printf 'classification\tCOMPATIBLE_RUNTIME\n'
            printf 'proof_base\t%s\n' "$GITHUB_SHA"
            printf 'implementation_commit\t38cfb220ddadbb401cc15f313aadb8234f626210\n'
            printf 'followup_commit_1\t8643cc21333c6b51242ed3b9295b25f372244755\n'
            printf 'followup_commit_2\t0d5f5e15d43f94a79c6133baecd5af217365d176\n'
            printf 'source_materialized\ttrue\n'
            printf 'materialized_paths\t62\n'
            printf 'preserved_java21_deletions\t2\n'
            printf 'recipe_scope\tFILE_THEN_MODULE_MULTI_MODULE_PROOF\n'
            printf 'recipe_replay_fixed_point\tPASS\n'
            printf 'openjdk_fastdebug_build\tPASS\n'
            printf 'focused_g1_jni_jfr_jtreg\tPASS\n'
            printf 'postimage_receipt_sha256\t%s\n' "$post_root"
            printf 'workflow_run\t%s\n' "$GITHUB_RUN_ID"
            printf 'workflow_attempt\t%s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'canonical_readback\tPENDING_POST_COMMIT_RUN\n'
            printf 'promotion\tNOT_AUTHORIZED\n'
            printf 'next_action\tPOST_COMMIT_READBACK_THEN_MODULE_MULTI_MODULE_ACCEPTANCE_REVIEW\n'
          } > "$receipt"

      - name: 12 - Commit only proven recipe output and receipt
        if: ${{ github.event_name == 'push' }}
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name "m3-recipe-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "m3: materialize JEP423 recipe output [m3-jep423-materialized]"
          git push origin "HEAD:$BRANCH_NAME"

      - name: 13 - Upload materialization proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jep423-current-materialization-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jep423
            build/*/test-results/**
          if-no-files-found: warn
          retention-days: 30

  m3-jep423-current-materialize__canonical-readback:
    name: "M3 JEP 423 current materialization / canonical-readback"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jep423-current-materialize'] && (contains(github.event.head_commit.message || '', '[m3-jep423-materialized]')) }}"
    permissions:
      contents: write
    concurrency:
      group: "M3 JEP 423 current materialization-${{ github.ref }}-canonical-readback"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: 1 - Require materialization receipt
        run: test -s m3/backports/recipes/jep-423-region-pinning/CURRENT_TREE_RECEIPT.tsv

      - name: 2 - Fetch exact lineage donor
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch \
            --filter=blob:none --no-tags origin \
            "0d5f5e15d43f94a79c6133baecd5af217365d176" \
            "38cfb220ddadbb401cc15f313aadb8234f626210"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: 3 - Regenerate FILE crates and verify committed postimages
        shell: bash
        run: |
          set -euo pipefail
          packet=m3/backports/recipes/jep-423-region-pinning
          mkdir -p "$RUNNER_TEMP/jep423"
          cp "$packet/CUMULATIVE_ADMIT_PATHS.txt" "$RUNNER_TEMP/jep423/MECHANICAL_PATHS.txt"
          python3 m3/backports/generate_recipe_crates.py \
            --repo "$UPSTREAM" \
            --release 22 \
            --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176 \
            --paths-file "$RUNNER_TEMP/jep423/MECHANICAL_PATHS.txt" \
            --donor-map "$packet/PATH_DONOR_OVERRIDES.tsv" \
            --crate-size 1 \
            --include-native \
            --include-text \
            --out "$RUNNER_TEMP/jep423/file-atoms"
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$RUNNER_TEMP/jep423/file-atoms" \
            --mode verify-post \
            --require-one-target-per-crate \
            --receipt "$RUNNER_TEMP/jep423/readback.tsv"
          git diff --check
          test -z "$(git status --porcelain=v1 -uall)"

      - name: 4 - Confirm proof receipt remains non-promoting
        shell: bash
        run: |
          set -euo pipefail
          grep -F $'source_materialized\ttrue' m3/backports/recipes/jep-423-region-pinning/CURRENT_TREE_RECEIPT.tsv
          grep -F $'recipe_replay_fixed_point\tPASS' m3/backports/recipes/jep-423-region-pinning/CURRENT_TREE_RECEIPT.tsv
          grep -F $'openjdk_fastdebug_build\tPASS' m3/backports/recipes/jep-423-region-pinning/CURRENT_TREE_RECEIPT.tsv
          grep -F $'focused_g1_jni_jfr_jtreg\tPASS' m3/backports/recipes/jep-423-region-pinning/CURRENT_TREE_RECEIPT.tsv
          grep -F $'promotion\tNOT_AUTHORIZED' m3/backports/recipes/jep-423-region-pinning/CURRENT_TREE_RECEIPT.tsv

  m3-release-jep-authority-repair__verify:
    name: "M3 released JEP authority repair / verify"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-release-jep-authority-repair'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 released JEP authority repair-${{ github.ref }}"
