  m3-long-direct-address-kernel__java-jni:
    name: "M3 long direct address kernel / java-jni"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-long-direct-address-kernel'] }}"
    concurrency:
      group: "M3 long direct address kernel-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Historical recipe self-test and fixed point (isolated fixture)
        run: |
          mvn -B -ntp -f m3/collections/qualification/m3-long-direct-address-kernel-20261017/recipe/pom.xml verify
      - name: Compile and install original arrays Maven dependency
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          ARRAYS_JAR="$HOME/.m2/repository/jdk/m3/m3-arrays/0.1.0-SNAPSHOT/m3-arrays-0.1.0-SNAPSHOT.jar"
          test -s "$ARRAYS_JAR"
          jar --describe-module --file "$ARRAYS_JAR" | grep -q '^jdk.m3.arrays'
      - name: Java owner tests
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongAddressKernelTest,M3LongAddressBoundedTest test
      - name: Current owner compiled address-kernel contract
        shell: bash
        run: |
          set -euo pipefail
          # Historical snapshot Recipe.run was already self-tested on frozen inputs.
          # Current M3LongIndexProjection has since acquired new source atoms;
          # do not re-apply the historical exact postimage over that product.
          # Verify the actual current Java21 bytecode still calls every owned
          # primitive leaf, then retain the normal and checked-JNI owner tests.
          python3 - <<'PYCODE'
          import re
          import subprocess
          from pathlib import Path
          code = subprocess.check_output([
              'javap', '-c', '-p', '-classpath', 'm3/collections/target/classes',
              'jdk.m3.collections.M3LongIndexProjection'], text=True)
          lines = code.splitlines()
          method = re.compile(r'^  (?:public|private|protected) .+? ([A-Za-z_$][\w$]*)\([^)]*\);$')
          declarations = [(i, match.group(1)) for i, line in enumerate(lines)
                          if (match := method.match(line))]
          bodies = {}
          for n, (begin, name) in enumerate(declarations):
              end = declarations[n + 1][0] if n + 1 < len(declarations) else len(lines)
              bodies.setdefault(name, []).append('\n'.join(lines[begin:end]))
          required = {
              'physicalIndex': 'M3LongAddressKernel.addressUnchecked:',
              'get': 'M3LongAddressKernel.loadUnchecked:',
              'toArray': 'M3LongAddressKernel.gatherJavaUnchecked:',
              'alreadyOrdered': 'M3LongAddressKernel.loadPhysicalUnchecked:',
              'sorted': 'M3LongAddressKernel.loadPhysicalUnchecked:',
          }
          for name, invocation in required.items():
              if not any(invocation in body for body in bodies.get(name, [])):
                  raise SystemExit('CURRENT_ADDRESS_ATOM_REFUSED: ' + name + ' -> ' + invocation)
          if not Path('src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongIndexProjection.java').is_file():
              raise SystemExit('CURRENT_ADDRESS_ATOM_REFUSED: missing original Java owner')
          print('CURRENT_ADDRESS_ATOM_PASS compiled_methods=' + str(len(required)))
          PYCODE
      - name: Build optional JNI batch gather
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/m3address
          cc -std=c17 -fPIC -shared -Wall -Wextra -Werror             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             src/jdk.m3.collections/share/native/libm3collections/collections/m3_long_address_kernel.c             -o /tmp/m3address/libm3_collections_address.so
      - name: JNI parity
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongAddressKernelTest,M3LongAddressBoundedTest -DargLine="-Xcheck:jni -Dm3.address.required=true -Djava.library.path=/tmp/m3address" test

  m3-owned-apache-multivalue__contracts:
    name: "Owned M3 Apache multivalue contracts / contracts"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-owned-apache-multivalue'] }}"
    permissions:
      contents: read
    concurrency:
      group: "Owned M3 Apache multivalue contracts-${{ github.ref }}-contracts"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            m3/arrays
            src/jdk.m3.collections/share
            make/m3/arrays
            test/jdk/jdk/m3/arrays
            m3/native/include
            m3/collections
            test/jdk/jdk/m3/collections
            test/jdk/jdk/internal/m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify sealed SDK successor and run owned contracts
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-apache-sdk-successor"
          mkdir -p "$M3_TASK_OUT/arrays" "$M3_TASK_OUT/core" "$M3_TASK_OUT/classes" "$M3_TASK_OUT/native" "$M3_TASK_OUT/tmp"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_PROVIDER="$M3_TASK_OUT/commons-collections4-4.5.0.jar"
          curl --fail --location --silent --show-error --output "$M3_PROVIDER" https://repo.maven.apache.org/maven2/org/apache/commons/commons-collections4/4.5.0/commons-collections4-4.5.0.jar
          python -I -S -B m3/collections/qualification/owned-apache-multivalue-20261024/verify_source_binding_successor_v5.py --jar "$M3_PROVIDER" --args "$M3_TASK_OUT/owned.args"
          python -I -S -B m3/collections/qualification/owned-apache-multivalue-20261024/probe_source_binding_successor_v5.py --jar "$M3_PROVIDER" --work "$M3_TASK_OUT/guard-probe"
          find m3/arrays/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/arrays -name '*.java' | sort > "$M3_TASK_OUT/arrays.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -g -encoding UTF-8 -proc:none -Xlint:all,-module -Werror -d "$M3_TASK_OUT/arrays" @"$M3_TASK_OUT/arrays.args"
          find m3/collections/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/collections src/jdk.m3.collections/share/classes/jdk/internal/m3/collections -name '*.java' | sort > "$M3_TASK_OUT/core.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -g -encoding UTF-8 -proc:none -Xlint:all,-module --module-path "$M3_TASK_OUT/arrays" -Werror -d "$M3_TASK_OUT/core" @"$M3_TASK_OUT/core.args"
