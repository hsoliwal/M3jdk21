  m3-db-parse__proof:
    name: "M3 DB parse proof / ${{ matrix.suite }}"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-db-parse'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 DB parse proof-${{ github.ref }}-${{ strategy.job-index }}"
      cancel-in-progress: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        suite: [db, recipe]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact source
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" \
            -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"
          printf 'TESTED_SHA=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Prepare pinned Java 21 test JDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' \
            -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' \
            '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' \
            "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"
      - name: Execute owning module proof
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          printf '%s\n' "$TESTED_SHA" > "$RUNNER_TEMP/proof/tested-sha.txt"
          java -version 2>&1 | tee "$RUNNER_TEMP/proof/java-version.txt"
          mvn -version | tee "$RUNNER_TEMP/proof/maven-version.txt"
          case "$SUITE" in
            db)
              python3 "$REPO/m3/compatibility/check_m3_m3indexdb_v1.py" \
                2>&1 | tee "$RUNNER_TEMP/proof/m3-v1-pin.log"
              mvn -B -ntp -f "$REPO/m3/indexdb/pom.xml" clean verify \
                2>&1 | tee "$RUNNER_TEMP/proof/db-verify.log"
              ;;
            recipe)
              mvn -B -ntp -f "$REPO/m3/tooling/migration-recipes/pom.xml" \
                -Dtest=DbRecipeTest test 2>&1 | tee "$RUNNER_TEMP/proof/recipe-test.log"
              ;;
            *) exit 2 ;;
          esac
      - name: Retain observed source and failures
        if: always()
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/proof"
          if test -n "${REPO:-}" && test -d "$REPO/m3/indexdb"; then
            cp -R "$REPO/m3/indexdb" "$RUNNER_TEMP/proof/indexdb"
          fi
          if test "$SUITE" = recipe && test -n "${REPO:-}"; then
            cp -R "$REPO/m3/tooling/migration-recipes" "$RUNNER_TEMP/proof/recipes"
          fi
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: db-parse-${{ matrix.suite }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/proof
          if-no-files-found: error

  m3-file-content-delta__file-delta:
    name: "M3File source and class content deltas / file-delta"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-file-content-delta'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3File source and class content deltas-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify module and linked-image source/class contract
        run: mvn -B -ntp -f m3/file/pom.xml verify
      - name: Require executed JUnit and original host/linked image proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import xml.etree.ElementTree as ET

          report = Path("m3/file/target/surefire-reports/TEST-jdk.m3.file.M3FileDeltaTest.xml")
          if not report.is_file() or not report.stat().st_size:
              raise SystemExit("missing actual JUnit file-delta report")
          suite = ET.parse(report).getroot()
          if (suite.tag != "testsuite" or int(suite.get("tests", "0")) < 1
                  or any(int(suite.get(name, "0")) for name in ("errors", "failures", "skipped"))
                  or not any(test.get("name") == "fullSourceClassAndCliContract"
                             for test in suite.iter("testcase"))):
              raise SystemExit("file-delta JUnit did not execute and pass its actual test")
          receipt = Path("m3/file/target/delta-check/receipt.json")
          if not receipt.is_file():
              raise SystemExit("missing file module host/image receipt")
          result = json.loads(receipt.read_text(encoding="utf-8"))
          inventory = result.get("contract_inventory", {})
          host = result.get("host_module_contracts", {})
          image = result.get("image_module_contracts", {})
          if (result.get("state") != "PASSED"
                  or inventory.get("source_count") != 19
                  or inventory.get("host_javac_only") != ["M3FileDeltaSelfTest"]
                  or inventory.get("maven_junit_separate_gate") != ["M3FileDeltaTest"]
                  or len(host) != 18 or len(image) != 17
                  or "M3FILE_DELTA_SELFTEST_PASS" not in host.get("M3FileDeltaSelfTest", "")
                  or "M3FileDeltaSelfTest" in image
                  or "M3FILE_DELTA_CONTRACT_PASS" not in image.get("M3FileDeltaContractSelfTest", "")):
              raise SystemExit("incomplete file module host/image/JUnit source qualification")
          print("M3_FILE_DELTA_JUNIT_AND_IMAGE_PROOF_PASS tests=1 host=18 image=17 sources=19")
          PY
      - name: Retain actual commands and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-file-content-delta-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            m3/file/target/delta-check/*.log
            m3/file/target/delta-check/*.json
          if-no-files-found: error

