tring toString();\n    descriptor: ()Ljava/lang/String;\n}\nCompiled from "M3TQ.java"\npublic final class jdk.internal.mindex.M3TQ$Facts implements java.util.function.LongPredicate {\n  public int utf16Length();\n    descriptor: ()I\n\n  public int keyCount();\n    descriptor: ()I\n\n  public long[] keys();\n    descriptor: ()[J\n\n  public boolean test(long);\n    descriptor: (J)Z\n\n  public boolean containsAll(jdk.internal.mindex.M3TQ$Facts);\n    descriptor: (Ljdk/internal/mindex/M3TQ$Facts;)Z\n\n  public jdk.internal.mindex.M3TQ$Facts concat(jdk.internal.mindex.M3TQ$Facts, int);\n    descriptor: (Ljdk/internal/mindex/M3TQ$Facts;I)Ljdk/internal/mindex/M3TQ$Facts;\n}\nCompiled from "M3TQ.java"\npublic final class jdk.internal.mindex.M3TQ$Op extends java.lang.Enum<jdk.internal.mindex.M3TQ$Op> {\n  public static final jdk.internal.mindex.M3TQ$Op ALL;\n    descriptor: Ljdk/internal/mindex/M3TQ$Op;\n  public static final jdk.internal.mindex.M3TQ$Op NONE;\n    descriptor: Ljdk/internal/mindex/M3TQ$Op;\n  public static final jdk.internal.mindex.M3TQ$Op AND;\n    descriptor: Ljdk/internal/mindex/M3TQ$Op;\n  public static final jdk.internal.mindex.M3TQ$Op OR;\n    descriptor: Ljdk/internal/mindex/M3TQ$Op;\n  public static jdk.internal.mindex.M3TQ$Op[] values();\n    descriptor: ()[Ljdk/internal/mindex/M3TQ$Op;\n\n  public static jdk.internal.mindex.M3TQ$Op valueOf(java.lang.String);\n    descriptor: (Ljava/lang/String;)Ljdk/internal/mindex/M3TQ$Op;\n}\n'
          
          def api_signature(text):
              classes = {}
