# SPDX-License-Identifier: Apache-2.0
name: M3 long bitmap algebra Java/JNI receiver
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongBitmapFilterPlan.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongBitmapFilterPlanSelfTest.java'
      - 'm3/collections/qualification/m3-long-bitmap-algebra-20261017/**'
      - '.github/workflows/m3-long-bitmap-algebra-20261017.yml'
  workflow_dispatch:
jobs:
  m3-bitmap-algebra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source-sealed recipe verification
        run: |
          set -eu
          RECIPE=m3/collections/qualification/m3-long-bitmap-algebra-20261017/recipe
          mvn -B -ntp -f "$RECIPE/pom.xml" verify
          java -cp "$RECIPE/target/classes" com.synexia.m3.M3LongBitmapFilterPlanRecipe --check .
      - name: Owning collection Maven tests
        run: mvn -B -ntp -f m3/collections/pom.xml test
      - name: Real selected-source Java/JNI parity and UBSan
        run: |
          set -eu
          CLASSES="$RUNNER_TEMP/m3-bitmap-algebra/classes"
          NATIVE="$RUNNER_TEMP/m3-bitmap-algebra/native"
          mkdir -p "$CLASSES" "$NATIVE"
          PKG=m3/collections/src/main/java/com/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror -d "$CLASSES" \
            "$PKG/M3LongIterator.java" \
            "$PKG/M3LongCollection.java" \
            "$PKG/M3IndexMaskCompactor.java" \
            "$PKG/M3LongIndexProjection.java" \
            "$PKG/M3LongBitmapFilterPlan.java" \
            m3/collections/src/test/java/com/m3/collections/M3LongBitmapFilterPlanSelfTest.java
          java -cp "$CLASSES" com.m3.collections.M3LongBitmapFilterPlanSelfTest
          cc -std=c17 -fPIC -shared -O1 -g -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$NATIVE/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$NATIVE" -cp "$CLASSES" \
            com.m3.collections.M3LongBitmapFilterPlanSelfTest
