# SPDX-License-Identifier: Apache-2.0
name: M3 native five-family core Java/JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedBiMap.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedSetMultiMap.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3ListMultiValueMap.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3NativeFiveLibrarySdk.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3NativeFiveLibrarySelfTest.java'
      - 'm3/collections/qualification/m3-native-five-provider-core-20261018/**'
      - '.github/workflows/m3-native-five-provider-core-20261018.yml'
  workflow_dispatch:
jobs:
  native-m3-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact canonical Maven recipe and SHA256 fixed point
        run: |
          set -eu
          R=m3/collections/qualification/m3-native-five-provider-core-20261018/recipe
          mvn -B -ntp -f "$R/pom.xml" verify
          java -cp "$R/target/classes" com.synexia.m3.M3NativeFiveLibraryRecipe --check .
      - name: Enforce native-core-only dependency boundary
        run: |
          set -eu
          for source in M3IndexedBiMap M3IndexedSetMultiMap M3ListMultiValueMap M3NativeFiveLibrarySdk; do
            file=m3/collections/src/main/java/com/m3/collections/"$source".java
            if grep -nE '^import (com[.]google[.]common|org[.]apache[.]commons|org[.]eclipse[.]collections|org[.]springframework)' "$file"; then
              echo "External collection dependency in M3 core: $file"
              exit 1
            fi
          done
      - name: Compile and test the actual M3 collections owner
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/pom.xml test
          java -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3NativeFiveLibrarySelfTest
      - name: Reuse actual C17 JNI primitive index selector with checked Java runtime
        run: |
          set -eu
          LIB="$RUNNER_TEMP/m3-native-five-lib"
          mkdir -p "$LIB"
          cc -std=c17 -O1 -g -fPIC -shared -Wall -Wextra -Werror \
             -fsanitize=undefined -fno-sanitize-recover=all \
             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
             m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
             -o "$LIB/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$LIB" \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3NativeFiveLibrarySelfTest
