name: M3 A3 V6 mastery gate

on:
  push:
    branches:
      - 'm3/a3-v6-mastery-gate-20261005'
    paths:
      - 'm3/tooling/a3/**'
      - 'm3/tooling/migration-recipes/**a3-mastery-v6**'
      - 'm3/tooling/migration-recipes/**M3A3MasteryV6**'
      - 'm3/docs/a3-mastery-v6.md'
      - '.github/workflows/m3-a3-v6-mastery.yml'
  pull_request:
    paths:
      - 'm3/tooling/a3/**'
      - 'm3/tooling/migration-recipes/**a3-mastery-v6**'
      - 'm3/tooling/migration-recipes/**M3A3MasteryV6**'
      - 'm3/docs/a3-mastery-v6.md'
      - '.github/workflows/m3-a3-v6-mastery.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: 1 diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"
      - name: 2 compile A3 and recipe owners
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/migration-recipes,tooling/a3
          -am -DskipTests compile
      - name: 3 recipe-first exact postimage and fixed point
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/migration-recipes
          -Dtest=M3A3MasteryV6RecipeTest,M3A3MasteryV6DeliveryTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: 4 A3 V6 admission and real FILE candidate
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/a3
          -Dtest=A3GateTest,A3ApplyTest,A3LabTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: 5 converged OpenRewrite dry run
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/a3 -am
          -Pm3-a3-mastery-v6
          -Drewrite.failOnDryRunResults=true
          rewrite:dryRun
