name: M3 array-backed entry facade cache

on:
  pull_request:
    paths:
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LFUCache.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SlotMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3OrderedSlotMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LinkedHashMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3TreeMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3WeakHashMap.java'
      - 'test/jdk/jdk/m3/collections/M3EntryFacadeCacheTest.java'
      - 'make/m3/collections/qualification/m3-entry-facade-cache-20261018/**'
  push:
    branches:
      - m3/lfu-entry-facades-20261018
    paths:
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LFUCache.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SlotMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3OrderedSlotMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LinkedHashMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3TreeMap.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3WeakHashMap.java'
      - 'test/jdk/jdk/m3/collections/M3EntryFacadeCacheTest.java'
      - 'make/m3/collections/qualification/m3-entry-facade-cache-20261018/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry-facade-cache:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify source-sealed transformation recipe
        run: mvn -B -ntp -f make/m3/collections/qualification/m3-entry-facade-cache-20261018/recipe/pom.xml verify
      - name: Build m3/arrays and its JNI library, which the collection module requires
        run: mvn -B -ntp -f m3/arrays/pom.xml -Pnative-linux -DskipTests install
      - name: Test owning M3 collection module
        run: mvn -B -ntp -f m3/collections/pom.xml "-Dm3.arrays.native.path=$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so" test
      - name: Verify generated source postimages
        run: java -cp make/m3/collections/qualification/m3-entry-facade-cache-20261018/recipe/target/classes jdk.internal.m3.M3EntryFacadeCacheRecipe --check .
