# SPDX-License-Identifier: Apache-2.0
name: M3 Synexia collection port recipe pin

# Former triggers (below, as of the move) now start job(s) 'm3-collection-port-recipe-pin__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/compatibility/m3-collection-port-recipe-pin.tsv'
#         - 'm3/compatibility/check_m3_collection_port_recipe.py'
#         - '.github/workflows/m3-collection-port-recipe-pin.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Diff hygiene
        run: git diff --check
      - name: Verify exact Synexia recipe pin
        run: python3 m3/compatibility/check_m3_collection_port_recipe.py
