# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 ordered convergence receiver Java21

on:
  pull_request:
    paths:
      - 'm3/compatibility/M3OrderedConvergenceReceiver.java'
      - 'm3/compatibility/M3OrderedConvergenceReceiverTest.java'
      - 'm3/docs/ordered-convergence-receiving-20261017.md'
      - 'm3/docs/SYNEXIA_CONVERGENCE_MODEL.md'
      - '.github/workflows/m3-ordered-convergence-receiver-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout complete target history, no write credential
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 1 - Additive source custody
        shell: bash
        run: |
          set -euo pipefail
          BASE=master
          if [ -n "$GITHUB_BASE_REF" ]; then BASE="$GITHUB_BASE_REF"; fi
          git diff --check
          git diff --check "origin/$BASE...HEAD"
          if git diff --name-status "origin/$BASE...HEAD" -- src/ | grep -E '^[DMR][[:space:]]'; then
            echo 'M3JDK21 runtime source changed in receiver-only PR' >&2
            exit 1
          fi
          git status --porcelain -- src/

      - name: 2 - Public-target license/provenance policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -B m3/compatibility/check_synexia_public_target.py

      - name: 3 - Compile receiver Java 21 with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m3-ordered-receiver
          javac --release 21 -Xlint:all -Werror -d build/m3-ordered-receiver \
            m3/compatibility/M3OrderedConvergenceReceiver.java \
            m3/compatibility/M3OrderedConvergenceReceiverTest.java

      - name: 4 - Execute independent Git fixture and hostile handoff tests
        shell: bash
        run: |
          set -euo pipefail
          java -cp build/m3-ordered-receiver M3OrderedConvergenceReceiverTest

      - name: 5 - Reuse repository-owned dated history test suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s m3/history -p 'test_*.py' -v

      - name: 6 - Enforce target admission boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F '"JTREG"' m3/compatibility/M3OrderedConvergenceReceiver.java
          grep -F '"JNI_PARITY"' m3/compatibility/M3OrderedConvergenceReceiver.java
          grep -F '"RUNTIME"' m3/compatibility/M3OrderedConvergenceReceiver.java
          grep -F 'automaticSourceCopy' m3/compatibility/M3OrderedConvergenceReceiver.java
          echo 'M3JDK21 RECEIVER-ONLY PROOF: no JDK product build, JNI, jtreg, GC/JIT/CDS or runtime acceptance claimed.'
