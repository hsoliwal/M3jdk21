name: M3 sparse viewport geometry Java21 oracle
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SparseExtents.java'
      - 'm3/collections/viewport-proof/fixtures/M3ViewportGeometryTest.txt'
      - '.github/workflows/m3-sparse-viewport-geometry.yml'
permissions:
  contents: read
jobs:
  baseline-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit exact original-owner bytes and separate test fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e '9dd1df62f3d5406760427cb5e840a36c9e7a59ea^{commit}'
          SOURCE=m3/collections/src/main/java/com/m3/collections/M3SparseExtents.java
          HEAP=m3/collections/src/main/java/com/m3/collections/M3HeapGrowth.java
          WINDOW=m3/collections/src/main/java/com/m3/collections/M3WindowPlan.java
          FIXTURE=m3/collections/viewport-proof/fixtures/M3ViewportGeometryTest.txt
          test "$(git hash-object "$SOURCE")" = d35282fb564a0a9231f31781e1a699f7e571f8de
          test "$(git hash-object "$HEAP")" = d7a6ce1410499e6b8fa4844bf01ad9d51fdcdbd6
          test "$(git hash-object "$WINDOW")" = d0ce93a6e0afec40def2f84aab9a522e8fcc4e3d
          printf '%s  %s\n' '75e960d7db157ab38f9597317589be1480eadca5eaf5f3fd048f98a540c3fc58' "$FIXTURE" | sha256sum --check -
          git show '9dd1df62f3d5406760427cb5e840a36c9e7a59ea:'"$SOURCE" > "$RUNNER_TEMP/M3SparseExtents-before.java"
          test "$(git hash-object "$RUNNER_TEMP/M3SparseExtents-before.java")" = 650356bcdffa372328e5a79f4f596a887fe5f447
          git diff --check "$BASE_SHA...HEAD"
          echo M3_GEOMETRY_SOURCE_ADMISSION_PASS
      - name: Build isolated actual-owner baseline and candidate test projects
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m3-geometry"
          for state in before after; do
            MODULE="$ROOT/$state"
            mkdir -p "$MODULE/src/main/java/com/m3/collections" "$MODULE/src/test/java/com/m3/collections"
            cp m3/collections/src/main/java/com/m3/collections/M3HeapGrowth.java "$MODULE/src/main/java/com/m3/collections/"
            cp m3/collections/src/main/java/com/m3/collections/M3WindowPlan.java "$MODULE/src/main/java/com/m3/collections/"
            cp m3/collections/viewport-proof/fixtures/M3ViewportGeometryTest.txt "$MODULE/src/test/java/com/m3/collections/M3ViewportGeometryTest.java"
            if [[ "$state" == before ]]; then
              cp "$RUNNER_TEMP/M3SparseExtents-before.java" "$MODULE/src/main/java/com/m3/collections/M3SparseExtents.java"
            else
              cp m3/collections/src/main/java/com/m3/collections/M3SparseExtents.java "$MODULE/src/main/java/com/m3/collections/M3SparseExtents.java"
            fi
            cat > "$MODULE/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion><groupId>com.m3.verification</groupId>
            <artifactId>m3-sparse-geometry-oracle</artifactId><version>1</version>
            <properties><maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding><argLine></argLine></properties>
            <dependencies><dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter</artifactId>
              <version>5.10.2</version><scope>test</scope></dependency></dependencies>
            <build><plugins>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId>
                <version>3.13.0</version><configuration>
                <compilerArgs><arg>-Xlint:all</arg><arg>-Werror</arg></compilerArgs>
                </configuration></plugin>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId>
                <version>3.2.5</version><configuration><failIfNoTests>true</failIfNoTests>
                <useModulePath>false</useModulePath><argLine>${argLine}</argLine></configuration></plugin>
            </plugins></build>
          </project>
          POM
          done
      - name: Reproduce exact baseline failure and prove candidate twice
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m3-geometry"
          if mvn -B -ntp -f "$ROOT/before/pom.xml" -Dtest=M3ViewportGeometryTest test > "$ROOT/baseline.log" 2>&1; then
            echo 'Baseline incorrectly passed the overflow oracle' >&2; exit 1
          fi
          python3 - "$ROOT/before/target/surefire-reports" 10 3 <<'PY'
          import sys,xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path(sys.argv[1]).glob('TEST-com.m3.collections.M3ViewportGeometryTest.xml'))
          if len(files)!=1:raise SystemExit('JUnit baseline report absent')
          root=ET.parse(files[0]).getroot()
          got=tuple(int(root.get(n,'-1')) for n in ('tests','failures','errors','skipped'))
          expected=(int(sys.argv[2]),int(sys.argv[3]),0,0)
          if got!=expected:raise SystemExit('JUnit baseline differs: '+str(got))
          print('M3_GEOMETRY_BASELINE_REJECTED tests=10 failures=3')
          PY
          mvn -B -ntp -f "$ROOT/after/pom.xml" -Dtest=M3ViewportGeometryTest test | tee "$ROOT/candidate.log"
          python3 - "$ROOT/after/target/surefire-reports" <<'PY'
          import sys,xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path(sys.argv[1])/'TEST-com.m3.collections.M3ViewportGeometryTest.xml'
          r=ET.parse(path).getroot()
          got=tuple(int(r.get(n,'-1')) for n in ('tests','failures','errors','skipped'))
          if got!=(10,0,0,0):raise SystemExit('candidate JUnit mismatch: '+str(got))
          print('M3_GEOMETRY_JUNIT_PASS tests=10 mode=mixed')
          PY
          mvn -B -ntp -f "$ROOT/after/pom.xml" -DargLine=-Xint -Dtest=M3ViewportGeometryTest test | tee "$ROOT/candidate-int.log"
          python3 - "$ROOT/after/target/surefire-reports" <<'PY'
          import sys,xml.etree.ElementTree as ET
          from pathlib import Path
          r=ET.parse(Path(sys.argv[1])/'TEST-com.m3.collections.M3ViewportGeometryTest.xml').getroot()
          got=tuple(int(r.get(n,'-1')) for n in ('tests','failures','errors','skipped'))
          if got!=(10,0,0,0):raise SystemExit('interpreted JUnit mismatch: '+str(got))
          print('M3_GEOMETRY_JUNIT_PASS tests=10 mode=interpreted')
          PY
          javap -classpath "$ROOT/before/target/classes" -public -s com.m3.collections.M3SparseExtents > "$ROOT/before-public.txt"
          javap -classpath "$ROOT/after/target/classes" -public -s com.m3.collections.M3SparseExtents > "$ROOT/after-public.txt"
          cmp "$ROOT/before-public.txt" "$ROOT/after-public.txt"
          echo M3_GEOMETRY_ABI_PASS
      - name: Retain exact source/JUnit/compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-sparse-geometry-${{ github.event.pull_request.head.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/m3-geometry/
            ${{ runner.temp }}/M3SparseExtents-before.java
