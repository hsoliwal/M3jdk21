# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 exact indexed-filter JNI source admission
on:
  push:
    branches: ["m3/writable-filtered-map-avl-receiver-20261017"]
  pull_request:
    paths:
      - "m3/collections/counts/recipe/pinned-engine/com/synexia/rewrite/M3HashPinnedTextSnapshotRecipe.java"
      - "m3/collections/wrappers/workflow-pin-20261017/recipe/**"
      - "m3/collections/wrappers/native-path-admission-20261017/**"
      - ".github/workflows/m3-index-filter-native-admission-20261017.yml"
jobs:
  exact-java-recipe-and-jni-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Source-pinned old/new provider identity and exact after installation
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object m3/collections/counts/recipe/pinned-engine/com/synexia/rewrite/M3HashPinnedTextSnapshotRecipe.java)" = 8bd6f399b298f364a41d53391ba2e72da4c5c635
          cmp m3/collections/counts/recipe/pinned-engine/com/synexia/rewrite/M3HashPinnedTextSnapshotRecipe.java m3/collections/wrappers/workflow-pin-20261017/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3jdk21-native-path-admission-20261017/M3HashPinnedTextSnapshotRecipe.java.txt
      - name: Run Java21 real LST source recipe and exact native admission negative controls
        run: mvn -B -ntp -f m3/collections/wrappers/workflow-pin-20261017/recipe/pom.xml -Dtest=M3Jdk21ExactNativePathAdmissionRecipeTest,M3IndexFilterNativePathContractTest test
      - name: Re-run the original native-JNI text receipt through old-provider wrapper recipe
        run: mvn -B -ntp -f m3/collections/wrappers/recipe/pom.xml -Dtest=M3FilteredMatReceiverRecipeTest test
      - name: Compile unchanged C17 JNI, run signed selection/dense oracle under five collectors
        run: sh m3/collections/wrappers/filtered-mat-receiver-20261017/verify.sh
