      - name: Compile current M3 collections and execute real JUnit
        run: |
          set -euo pipefail
          export JAVA_HOME="$M3_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          # Platform-owned tests need their POM's JUnit classes visible from the bootstrap loader.
          junit_classpath="$RUNNER_TEMP/m3-stream-junit-classpath.txt"
          mvn -B -ntp -f m3/collections/pom.xml \
            org.apache.maven.plugins:maven-dependency-plugin:3.8.1:build-classpath \
            -DincludeScope=test \
            -DincludeGroupIds=org.junit.jupiter,org.junit.platform,org.opentest4j,org.apiguardian \
            "-Dmdep.outputFile=$junit_classpath"
          test -s "$junit_classpath"
          # Patch only the original test output; implementations remain in the source-built module.
          for suite in ObjectStreamAdvancedContractTest ObjectStreamLoopContractTest ObjectStreamCompatibilityGateTest; do
            rm -f "m3/collections/target/surefire-reports/TEST-jdk.m3.collections.$suite.xml"
          done
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=ObjectStreamAdvancedContractTest,ObjectStreamLoopContractTest,ObjectStreamCompatibilityGateTest \
            -DfailIfNoTests=true \
            "-DargLine=-Xbootclasspath/a:\"$(cat "$junit_classpath")\" --add-modules jdk.m3.collections --patch-module \"jdk.m3.collections=$GITHUB_WORKSPACE/m3/collections/target/test-classes\" --add-reads jdk.m3.collections=ALL-UNNAMED --add-opens jdk.m3.collections/jdk.m3.collections=ALL-UNNAMED" \
            test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          expected = {
              'jdk.m3.collections.ObjectStreamAdvancedContractTest': 8,
              'jdk.m3.collections.ObjectStreamLoopContractTest': 9,
              'jdk.m3.collections.ObjectStreamCompatibilityGateTest': 5,
          }
          reports = Path('m3/collections/target/surefire-reports')
          total = 0
          for name in sorted(expected):
              suite = ET.parse(reports / ('TEST-' + name + '.xml')).getroot()
              cases = suite.findall('testcase')
              identities = [(case.get('classname'), case.get('name')) for case in cases]
              if (suite.get('name') != name or len(cases) != expected[name]
                      or int(suite.get('tests', '-1')) != len(cases)
                      or len(set(identities)) != len(identities) or any(not item[1] for item in identities)
                      or any(int(suite.get(key, '-1')) != 0 for key in ('failures', 'errors', 'skipped'))
                      or any(case.get('classname') != name or case.find('failure') is not None
                             or case.find('error') is not None or case.find('skipped') is not None for case in cases)):
                  raise SystemExit('Incomplete original stream JUnit proof: ' + name)
              total += len(cases)
          print(f'M3_STREAM_JUNIT_PASS classes={len(expected)} tests={total}')
          PY
      - name: Archive source-built M3 image with custody
        id: m3_image_custody
        if: ${{ always() && env.M3_JAVA_HOME != '' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/build/m3-groovy-native-proof/images/jdk"
          test "$M3_JAVA_HOME" = "$image"
          test "$(realpath "$image")" = "$image"
          find "$image" -type l -print0 | while IFS= read -r -d '' link; do
            case "$(readlink "$link")" in
              /*) echo "Absolute image symlink is not portable: $link" >&2; exit 1 ;;
            esac
            case "$(realpath -e "$link")" in
              "$image"/*) ;;
              *) echo "Image symlink escapes image or is dangling: $link" >&2; exit 1 ;;
            esac
          done
          for tool in java javac jlink jmod; do
            test -x "$image/bin/$tool"
            case "$(realpath "$image/bin/$tool")" in
              "$image"/*) ;;
              *) echo "M3 image tool escapes image: $tool" >&2; exit 1 ;;
            esac
          done
          for required in release lib/modules jmods/java.base.jmod jmods/jdk.m3.collections.jmod; do
            if [[ ! -s "$image/$required" ]]; then
              echo "Required M3 image file absent: $required" >&2
              exit 1
            fi
            case "$(realpath "$image/$required")" in
              "$image"/*) ;;
              *) echo "M3 image file escapes image: $required" >&2; exit 1 ;;
            esac
          done
          cd "$GITHUB_WORKSPACE"
          source_head="$(git rev-parse HEAD)"
          test "$source_head" = "$GITHUB_SHA"
          git ls-files -v -z -- | python3 -c '
          import sys
          entries = sys.stdin.buffer.read().split(b"\0")
          if any(entry[:1] == b"S" or entry[:1].islower() for entry in entries if entry):
              raise SystemExit("Hidden Git index flags prevent complete source custody")
          '
          git diff --exit-code HEAD --
          source_roots=(src/jdk.m3.collections/share/classes src/jdk.m3.collections/providers/classes)
          test -z "$(git ls-files --others -- "${source_roots[@]}")"
          git ls-files --error-unmatch \
            "${source_roots[0]}/module-info.java" \
            "${source_roots[1]}/module-info.java.extra" \
            make/conf/module-loader-map.conf \
            make/jdk/src/classes/build/tools/module/GenModuleInfoSource.java > /dev/null
          custody="$RUNNER_TEMP/m3-source-built-image"
          mkdir "$custody"
          git ls-files --stage -- "${source_roots[@]}" \
            make/conf/module-loader-map.conf \
            make/jdk/src/classes/build/tools/module/GenModuleInfoSource.java > "$custody/source-inventory.git"
          git ls-files -z -- "${source_roots[@]}" \
            make/conf/module-loader-map.conf \
            make/jdk/src/classes/build/tools/module/GenModuleInfoSource.java \
            | xargs -0 -r sha256sum > "$custody/source-files.sha256"
          test -s "$custody/source-files.sha256"
          "$image/bin/java" --list-modules > "$custody/image-modules.txt"
          grep -E '^jdk[.]m3[.]collections(@[^[:space:]]+)?$' "$custody/image-modules.txt"
          "$image/bin/java" --describe-module jdk.m3.collections > "$custody/image-module-description.txt"
          "$image/bin/jmod" describe "$image/jmods/jdk.m3.collections.jmod" > "$custody/jmod-description.txt"
          printf 'repository=%s\nsource_head=%s\nsource_tree=%s\nworkflow_blob=%s\nrun_id=%s\nrun_attempt=%s\nprovider_junit=NOT_RUN_BY_THIS_STEP\n' \
            "$GITHUB_REPOSITORY" "$source_head" "$(git rev-parse 'HEAD^{tree}')" \
            "$(git rev-parse HEAD:.github/workflows/m3-object-stream-native-proof-20261118.yml)" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$custody/custody.txt"
          (cd "$image"; sha256sum release lib/modules jmods/java.base.jmod \
            jmods/jdk.m3.collections.jmod bin/java bin/javac bin/jlink bin/jmod) > "$custody/image.sha256"
          # Tar preserves the image's executable modes and symlinks inside the artifact ZIP.
          tar --create --gzip --file "$custody/jdk.tar.gz" -C "$(dirname "$image")" jdk
          tar --compare --gzip --file "$custody/jdk.tar.gz" -C "$(dirname "$image")"
          (cd "$image"; sha256sum --check "$custody/image.sha256")
          archive_bytes="$(stat -c %s "$custody/jdk.tar.gz")"
          if (( archive_bytes > 2147483648 )); then
            echo "M3 image archive exceeds 2147483648 bytes: $archive_bytes" >&2
            exit 1
          fi
          printf 'archive_bytes=%s\narchive_limit_bytes=2147483648\n' "$archive_bytes" >> "$custody/custody.txt"
          (cd "$custody"; sha256sum custody.txt source-inventory.git source-files.sha256 \
            image-modules.txt image-module-description.txt jmod-description.txt image.sha256 jdk.tar.gz \
            > SHA256SUMS)
      - name: Retain source-built M3 image separately
        if: ${{ always() && steps.m3_image_custody.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-source-built-jdk-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m3-source-built-image/jdk.tar.gz
            ${{ runner.temp }}/m3-source-built-image/custody.txt
            ${{ runner.temp }}/m3-source-built-image/source-inventory.git
            ${{ runner.temp }}/m3-source-built-image/source-files.sha256
            ${{ runner.temp }}/m3-source-built-image/image-modules.txt
            ${{ runner.temp }}/m3-source-built-image/image-module-description.txt
            ${{ runner.temp }}/m3-source-built-image/jmod-description.txt
            ${{ runner.temp }}/m3-source-built-image/image.sha256
            ${{ runner.temp }}/m3-source-built-image/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Archive a bounded source-built M3 test runtime
        id: m3_test_runtime_custody
        if: ${{ always() && steps.m3_image_custody.outcome == 'success' }}
        timeout-minutes: 10
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/build/m3-groovy-native-proof/images/jdk"
          test "$M3_JAVA_HOME" = "$image"
          test "$(realpath "$image")" = "$image"
          full="$RUNNER_TEMP/m3-source-built-image"
          destination="$RUNNER_TEMP/m3-source-built-test-runtime"
          if [[ -e "$destination" || -L "$destination" ]]; then
            echo "Test-runtime output already exists" >&2; exit 1
          fi
          (cd "$full"; sha256sum --strict --check SHA256SUMS)
          (cd "$image"; sha256sum --strict --check "$full/image.sha256")
          tar --compare --gzip --file "$full/jdk.tar.gz" -C "$(dirname "$image")"
          temporary="$(mktemp -d "$RUNNER_TEMP/m3-test-runtime-XXXXXX")"
          trap 'rm -rf -- "$temporary"' EXIT
          package="$temporary/package"
          mkdir "$package" "$package/original-custody" "$temporary/extracted"
          cp "$full"/{custody.txt,source-inventory.git,source-files.sha256,image-modules.txt,image-module-description.txt,jmod-description.txt,image.sha256} "$package/original-custody/"
          cp "$full/SHA256SUMS" "$package/original-custody/full-image-SHA256SUMS"
          python3 - "$image" > "$package/omitted-image-paths.txt" <<'PY'
          import pathlib, sys
          image = pathlib.Path(sys.argv[1])
          def excluded(name):
              return (name == 'jmods' or name.startswith('jmods/') or name == 'lib/src.zip'
                      or name.endswith(('.debuginfo', '.diz', '.pdb')))
          for path in sorted(image.rglob('*')):
              name = path.relative_to(image).as_posix()
              if '\n' in name or '\r' in name or '\t' in name:
                  raise SystemExit('Unsafe image path: ' + repr(name))
              if path.is_dir() and not path.is_symlink() and name.endswith(('.debuginfo', '.diz', '.pdb')):
                  raise SystemExit('Debug suffix is not a file: ' + name)
              if excluded(name):
                  print('jdk/' + name)
              elif path.is_symlink():
                  if path.readlink().is_absolute():
                      raise SystemExit('Absolute retained image symlink: ' + name)
                  target = path.resolve(strict=True)
                  if image not in target.parents or excluded(target.relative_to(image).as_posix()):
                      raise SystemExit('Retained symlink escapes image or targets omitted content: ' + name)
          PY
          (cd "$image"; sha256sum release lib/modules bin/java bin/javac bin/javap bin/jlink bin/jmod) > "$package/runtime.sha256"
          tar --create --gzip --file "$package/test-runtime.tar.gz" -C "$(dirname "$image")" \
            --anchored --exclude='jdk/jmods' --exclude='jdk/lib/src.zip' \
            --exclude='*.debuginfo' --exclude='*.diz' --exclude='*.pdb' jdk
          tar --compare --gzip --file "$package/test-runtime.tar.gz" -C "$(dirname "$image")"
          archive_bytes="$(stat -c %s "$package/test-runtime.tar.gz")"
          if (( archive_bytes > 524288000 )); then
            echo "Test-runtime archive exceeds 524288000 bytes: $archive_bytes" >&2; exit 1
          fi
          tar --extract --gzip --file "$package/test-runtime.tar.gz" -C "$temporary/extracted" --no-same-owner
          runtime="$temporary/extracted/jdk"
          while IFS= read -r omitted; do
            if [[ -e "$temporary/extracted/$omitted" || -L "$temporary/extracted/$omitted" ]]; then
              echo "Omitted path remained in test runtime: $omitted" >&2; exit 1
            fi
          done < "$package/omitted-image-paths.txt"
          (cd "$runtime"; sha256sum --strict --check "$package/runtime.sha256")
          "$runtime/bin/java" --list-modules > "$package/runtime-modules.txt"
          cmp "$full/image-modules.txt" "$package/runtime-modules.txt"
          for tool in java javac javap; do
            "$image/bin/$tool" -version > "$temporary/original-version.txt" 2>&1
            "$runtime/bin/$tool" -version > "$package/$tool-version.txt" 2>&1
            cmp "$temporary/original-version.txt" "$package/$tool-version.txt"
          done
          tar --compare --gzip --file "$package/test-runtime.tar.gz" -C "$temporary/extracted"
          (cd "$image"; sha256sum --strict --check "$full/image.sha256" "$package/runtime.sha256")
          tar --compare --gzip --file "$full/jdk.tar.gz" -C "$(dirname "$image")"
          printf 'kind=source-built-test-runtime\nfull_jdk_or_jlink_distribution=false\narchive_bytes=%s\narchive_limit_bytes=524288000\nruntime_tests=NOT_RUN_BY_PACKAGING\nomissions=jmods-tree,lib-src.zip,debug-symbol-files\n' "$archive_bytes" > "$package/test-runtime.txt"
          (cd "$package"; find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS)
          package_bytes="$(du -sb "$package" | cut -f1)"
          if (( package_bytes > 524288000 )); then
            echo "Test-runtime artifact payload exceeds 524288000 bytes: $package_bytes" >&2; exit 1
          fi
          if [[ -e "$destination" || -L "$destination" ]]; then
            echo "Test-runtime output appeared during packaging" >&2; exit 1
          fi
          mv -T "$package" "$destination"
          printf 'M3_TEST_RUNTIME_ARCHIVE_PASS archive_bytes=%s package_bytes=%s\n' "$archive_bytes" "$package_bytes"
      - name: Retain source-built M3 test runtime separately
        if: ${{ always() && steps.m3_test_runtime_custody.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-source-built-test-runtime-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-source-built-test-runtime/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Retain Maven/JDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
