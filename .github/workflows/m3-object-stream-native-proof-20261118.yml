            'ArraySizingStrategyPrimitiveAdoptionTest.java:f4fd2926a9a6aec3cecb3779eabaf92040b15cf1'
            'ArraySizingStrategySupersetTest.java:a5ea368458bab592d7ef2ef791355ee299e0714c'
            'EqualityStrategyAdaptersTest.java:f86292dc01fe1b804d74dca0fe3118328c0f40a2'
            'EquivalenceFromFunctionsTest.java:4698fedff23af6a8cd44e710d9c3e7c4a2d5987e'
            'HashedMapEquatorTest.java:3e4f6754997247e76786c683d62a89a3eb7c3cc0'
            'LinkedHashMultimapLanesTest.java:73602251b20ec63405575f9bc516eadc1054afe5'
            'StrategyHashMapTest.java:e4edd25750f05d00dec01094c47f07c15242b034'
