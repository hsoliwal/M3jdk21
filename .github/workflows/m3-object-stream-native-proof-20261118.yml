          test "${#provider_cases[@]}" -eq 8
          suite=()
          for binding in "${provider_cases[@]}"; do
            name="${binding%%:*}"
            pin="${binding#*:}"
            file="test/jdk/jdk/m3/collections/providers/$name"
            [[ -f "$file" && ! -L "$file" ]] || { echo "provider main missing: $file" >&2; exit 90; }
            [[ "$(git hash-object -- "$file")" = "$pin" ]] || { echo "provider main source drift: $file" >&2; exit 91; }
            grep -Eq '^[[:space:]]*\*[[:space:]]*@test[[:space:]]*$' "$file"
            grep -Eq '^[[:space:]]*\*[[:space:]]*@modules[[:space:]]+' "$file"
            grep -Eq '^[[:space:]]*\*[[:space:]]*@run[[:space:]]+main(/othervm)?[[:space:]]+' "$file"
            ! grep -Eq 'org[.]junit[.]' "$file"
