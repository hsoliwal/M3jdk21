# SPDX-License-Identifier: Apache-2.0
name: M3 object-stream native JDK proof

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/m3-object-stream-native-proof-20261118.yml'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStream*.java'
      - 'test/jdk/jdk/m3/collections/ObjectStream*.java'
      - 'm3/collections/qualification/stream-current-compatible-20261118/**'
      - 'm3/collections/test_verify_stream_current.py'
      - 'm3/collections/pom.xml'
  pull_request:
    paths:
      - '.github/workflows/m3-object-stream-native-proof-20261118.yml'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStream*.java'
      - 'test/jdk/jdk/m3/collections/ObjectStream*.java'
      - 'm3/collections/qualification/stream-current-compatible-20261118/**'
      - 'm3/collections/test_verify_stream_current.py'
      - 'm3/collections/pom.xml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-object-stream-proof-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-identity:
    name: Exact source identities and public API guard
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify clean diff and source receipts
        run: |
          set -euo pipefail
          git diff --check
          python3 -m unittest -v m3/collections/test_verify_stream_current.py
          python3 m3/collections/qualification/stream-current-compatible-20261118/verify.py

  actual-m3jdk:
    name: Build modified M3JDK21 image and execute stream JUnit
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    needs: source-identity
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install JDK image build prerequisites
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
      - name: Acquire hash-pinned Java 21 boot JDK
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz' \
            -o "$RUNNER_TEMP/m3jdk21.tar.gz"
          printf '%s  %s\n' \
            'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94' \
            "$RUNNER_TEMP/m3jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/m3jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'BOOT_JDK=%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
      - name: Configure and build modified M3JDK21 image
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$BOOT_JDK" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors
          make JOBS=2 images
          m3_java="$(find build -type f -path '*/jdk/bin/java' -print -quit)"
          test -n "$m3_java"
          m3_home="$(dirname "$(dirname "$m3_java")")"
          printf 'M3_JAVA_HOME=%s\n' "$m3_home" >> "$GITHUB_ENV"
          "$m3_home/bin/java" -version
          "$m3_home/bin/javap" --module java.base java.util.stream.Streams > "$RUNNER_TEMP/m3-streams-api.txt"
          grep -F 'public final class java.util.stream.Streams' "$RUNNER_TEMP/m3-streams-api.txt"
          grep -F 'mapWhile(' "$RUNNER_TEMP/m3-streams-api.txt"
          grep -F 'pairwise(' "$RUNNER_TEMP/m3-streams-api.txt"
      - name: Compile actual M3 arrays dependency
        run: |
          set -euo pipefail
          export JAVA_HOME="$M3_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Compile current M3 collections and execute real JUnit
        run: |
          set -euo pipefail
          export JAVA_HOME="$M3_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=ObjectStreamAdvancedContractTest,ObjectStreamLoopContractTest,ObjectStreamCompatibilityGateTest \
            test
      - name: Verify installed collection module image
        run: |
          set -euo pipefail
          export JAVA_HOME="$M3_JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"
          java --list-modules | grep '^jdk.m3.collections@'
          jlink --add-modules jdk.m3.collections --output "$RUNNER_TEMP/m3-object-stream-jlink"
          "$RUNNER_TEMP/m3-object-stream-jlink/bin/java" --list-modules | grep '^jdk.m3.collections@'
      - name: Compile and run collate on built and linked M3 images
        run: |
          set -euo pipefail
          collate_classes="$RUNNER_TEMP/m3-collate-contract-classes"
          empty_sourcepath="$RUNNER_TEMP/m3-collate-empty-sourcepath"
          mkdir -p "$collate_classes" "$empty_sourcepath"
          "$M3_JAVA_HOME/bin/javac" \
            -source 21 -target 21 -proc:none -implicit:none -Xlint:all -Werror \
            --add-modules jdk.m3.collections \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -sourcepath "$empty_sourcepath" -classpath "$collate_classes" \
            -d "$collate_classes" \
            test/jdk/jdk/m3/collections/ObjectStreamCollateTest.java
          "$M3_JAVA_HOME/bin/java" -Xmx64m -ea \
            --add-modules jdk.m3.collections \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -cp "$collate_classes" ObjectStreamCollateTest \
            | tee "$RUNNER_TEMP/m3-collate-full-image.log"
          grep -Fx 'OBJECT_STREAM_COLLATE_PASS checks=29894' \
            "$RUNNER_TEMP/m3-collate-full-image.log"
          "$RUNNER_TEMP/m3-object-stream-jlink/bin/java" -Xmx64m -ea \
            --add-modules jdk.m3.collections \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -cp "$collate_classes" ObjectStreamCollateTest \
            | tee "$RUNNER_TEMP/m3-collate-jlink-image.log"
          grep -Fx 'OBJECT_STREAM_COLLATE_PASS checks=29894' \
            "$RUNNER_TEMP/m3-collate-jlink-image.log"
      - name: Retain Maven/JDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-object-stream-native-${{ github.run_id }}
          path: |
            m3/collections/target/surefire-reports/
            m3/arrays/target/surefire-reports/
            ${{ runner.temp }}/m3-collate-full-image.log
            ${{ runner.temp }}/m3-collate-jlink-image.log
          if-no-files-found: warn
