name: M3 Object Array Pool Java 21

on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/util/M3ObjectArrayPool.java'
      - 'test/jdk/jdk/internal/util/M3ObjectArrayPoolTest.java'
      - '.github/workflows/m3-object-array-pool-java21.yml'
  push:
    branches:
      - 'feature/m3-object-array-reuse-20261012'
    paths:
      - 'src/java.base/share/classes/jdk/internal/util/M3ObjectArrayPool.java'
      - 'test/jdk/jdk/internal/util/M3ObjectArrayPoolTest.java'
      - '.github/workflows/m3-object-array-pool-java21.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Diff hygiene
        run: git diff --check origin/master...HEAD
      - name: Source invariants
        shell: bash
        run: |
          set -euo pipefail
          source=src/java.base/share/classes/jdk/internal/util/M3ObjectArrayPool.java
          grep -F 'private static final ThreadLocal<Cache> LOCAL' "$source" >/dev/null
          grep -F 'private static final long DEFAULT_MAX_CACHED_BYTES = 4096;' "$source" >/dev/null
          grep -F 'Arrays.fill(released, null);' "$source" >/dev/null
          grep -F 'Thread.currentThread() != owner' "$source" >/dev/null
          grep -F 'PRESSURE_EPOCH.incrementAndGet();' "$source" >/dev/null
          ! grep -E 'Unsafe|addressOf|objectAddress|System\.identityHashCode' "$source"
      - name: Compile patched java.base owner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m3-object-pool/module build/m3-object-pool/test
          javac --release 21 -proc:none -encoding UTF-8 -Xlint:all -Werror             --patch-module java.base=src/java.base/share/classes             -d build/m3-object-pool/module             src/java.base/share/classes/jdk/internal/util/M3ObjectArrayPool.java
      - name: Compile focused test
        shell: bash
        run: |
          set -euo pipefail
          javac --release 21 -proc:none -encoding UTF-8 -Xlint:all -Werror             --patch-module java.base=build/m3-object-pool/module             --add-exports java.base/jdk.internal.util=ALL-UNNAMED             -d build/m3-object-pool/test             test/jdk/jdk/internal/util/M3ObjectArrayPoolTest.java
      - name: Execute focused runtime proof
        shell: bash
        run: |
          set -euo pipefail
          java             --patch-module java.base=build/m3-object-pool/module             --add-exports java.base/jdk.internal.util=ALL-UNNAMED             -cp build/m3-object-pool/test             M3ObjectArrayPoolTest
