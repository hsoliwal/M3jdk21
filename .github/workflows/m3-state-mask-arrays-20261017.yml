# SPDX-License-Identifier: Apache-2.0
name: M3 state mask arrays (recipe, Java21, JNI)
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3StateMaskArrays.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3StateMaskArraysSelfTest.java'
      - 'm3/collections/qualification/m3-state-mask-arrays-20261017/**'
      - '.github/workflows/m3-state-mask-arrays-20261017.yml'
  workflow_dispatch:
jobs:
  state-mask-arrays:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify canonical source-sealed Maven recipe
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/qualification/m3-state-mask-arrays-20261017/recipe/pom.xml verify
          java -cp m3/collections/qualification/m3-state-mask-arrays-20261017/recipe/target/classes \
            com.synexia.m3.M3StateMaskArraysRecipe --check .
      - name: Compile against unchanged M3 mask engine and run Java differential tests
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m3-mask-classes" "$RUNNER_TEMP/m3-mask-native"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-mask-classes" \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/main/java/com/m3/collections/M3StateMaskArrays.java \
            m3/collections/src/test/java/com/m3/collections/M3StateMaskArraysSelfTest.java
          java -cp "$RUNNER_TEMP/m3-mask-classes" com.m3.collections.M3StateMaskArraysSelfTest
      - name: Existing bounded JNI selector parity under checked JNI
        run: |
          set -eu
          cc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$RUNNER_TEMP/m3-mask-native/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$RUNNER_TEMP/m3-mask-native" \
            -cp "$RUNNER_TEMP/m3-mask-classes" com.m3.collections.M3StateMaskArraysSelfTest
