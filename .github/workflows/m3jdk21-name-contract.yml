name: M3JDK21 mapped naming and package queue
on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'm3/docs/name-mapping.json'
      - 'm3/docs/name-mapping.schema.json'
      - 'm3/migration/requirements.txt'
      - 'm3/compatibility/check_public_names.py'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/arrays/**'
      - 'src/java.base/share/classes/java/util/Arrays.java'
      - 'src/java.base/share/classes/java/lang/Object.java'
      - 'src/java.base/share/classes/java/security/SHA256Adapter.java'
      - 'test/jdk/java/lang/Object/SHA256ObjectAdapterTest.java'
      - 'test/jdk/java/lang/Object/libSHA256ObjectAdapterTest.c'
      - 'src/java.base/share/classes/module-info.java'
      - 'src/java.base/share/classes/java/lang/Object.java'
      - 'src/java.base/share/classes/java/security/SHA256Adapter.java'
      - 'test/jdk/java/lang/Object/SHA256ObjectAdapterTest.java'
      - 'test/jdk/java/lang/Object/libSHA256ObjectAdapterTest.c'
      - 'm3/docs/M3JDK21_NAME_AND_PACKAGE_CONTRACT.md'
      - 'm3/tooling/name-contract/**'
      - '.github/workflows/m3jdk21-name-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  documented-name-queue:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            AGENTS.md
            m3/docs/name-mapping.json
            m3/docs/name-mapping.schema.json
            m3/migration/requirements.txt
            m3/docs/M3JDK21_NAME_AND_PACKAGE_CONTRACT.md
            m3/tooling/name-contract/**
            m3/compatibility/check_public_names.py
            src/jdk.m3.collections/share/classes/jdk/m3/arrays/**
            make/m3/arrays/**
            src/jdk.m3.collections/share/native/libm3arrays/**
            src/jdk.m3.collections/share/classes/jdk/m3/arrays/M3Arrays.java
            src/jdk.m3.collections/share/**
            m3/core/src/jdk/m3/text/SharedRelatedLexemeCatalog.java
            m3/arrays/src/main/java/module-info.java
            src/java.base/share/classes/java/util/Arrays.java
            src/java.base/share/classes/java/util/concurrent/locks/AbstractQueuedLongSynchronizer.java
            src/java.base/share/classes/java/util/concurrent/locks/AbstractQueuedSynchronizer.java
            src/java.base/share/classes/java/util/concurrent/locks/StampedLock.java
            test/jdk/java/util/concurrent/tck/SemaphoreTest.java
            test/jdk/java/util/concurrent/tck/StampedLockTest.java
            src/java.base/share/classes/sun/util/cldr/CLDRTimeZoneNameProviderImpl.java
            test/jdk/sun/util/locale/provider/TimeZoneNameConcurrencyTest.java
            test/jdk/sun/util/locale/provider/TimeZoneNameOrderTest.java
            src/java.base/share/classes/java/lang/Object.java
            src/java.base/share/classes/java/security/SHA256Adapter.java
            test/jdk/java/lang/Object/SHA256ObjectAdapterTest.java
            test/jdk/java/lang/Object/libSHA256ObjectAdapterTest.c
            src/java.base/share/classes/module-info.java
            src/java.base/share/classes/java/lang/Class.java
            src/java.base/share/classes/java/lang/Object.java
            src/java.base/share/classes/java/security/SHA256Adapter.java
            test/jdk/java/lang/Object/SHA256ObjectAdapterTest.java
            test/jdk/java/lang/Object/libSHA256ObjectAdapterTest.c
            src/java.base/share/classes/java/lang/M3StringRegexDp.java
            src/java.base/share/classes/java/util/regex/Matcher.java
            src/java.base/share/classes/jdk/internal/mindex/**
            src/java.base/share/native/libjava/M3BitLane28.c
            src/java.base/share/native/libjava/M3StateRelation.c
            src/java.base/share/native/libjava/m3_state_relation.h
            src/jdk.compiler/share/classes/com/sun/tools/javac/m3/**
            m3/algorithms/src/jdk/m3/algorithm/PrefixZ.java
            m3/tooling/migration-recipes/src/**
            m3/fs/src/main/java/jdk/m3/fs/**
            m3/llm/src/main/java/jdk/m3/llm/projection/**
            test/jdk/java/lang/String/M3StringHierarchicalRegexTest.java
            m3/collections/implementations/guava-evicting-queue/src/main/java/jdk/m3/collections/guava/M3EvictingQueue.java
            m3/collections/implementations/evicting-queue/src/main/java/jdk/m3/collections/queue/M3EvictingQueue.java
            m3/collections/implementations/commons-collections-4.5.0/src/main/java/jdk/m3/collections/apache/iterators/PermutationIterator.java
            m3/collections/implementations/commons-collections-4.5.0/src/main/java/jdk/m3/collections/apache/queue/CircularFifoQueue.java
            m3/collections/implementations/eclipse-collections-14.0.0-snapshot-00a668d6/eclipse-collections/src/main/java/jdk/m3/collections/eclipse/impl/set/mutable/UnifiedSet.java
            m3/collections/implementations/eclipse-collections-14.0.0-snapshot-00a668d6/eclipse-collections/src/main/java/jdk/m3/collections/eclipse/impl/map/sorted/mutable/IndexedTreeArena.java
            m3/collections/implementations/eclipse-collections-14.0.0-snapshot-00a668d6/eclipse-collections/src/main/java/jdk/m3/collections/eclipse/impl/map/sorted/mutable/IndexedRedBlackMap.java
            m3/collections/implementations/eclipse-collections-14.0.0-snapshot-00a668d6/eclipse-collections/src/main/java/jdk/m3/collections/eclipse/impl/map/sorted/mutable/IndexedSortedMap.java
            m3/collections/implementations/eclipse-collections-14.0.0-snapshot-00a668d6/eclipse-collections/src/main/java/jdk/m3/collections/eclipse/impl/list/mutable/FastList.java
            m3/collections/implementations/guava-33.4.8/guava/src/jdk/m3/collections/guava/collect/CompactHashMap.java
            m3/collections/implementations/guava-33.4.8/android/guava/src/jdk/m3/collections/guava/collect/CompactHashMap.java
            src/jdk.m3.io/share/classes/jdk/m3/optane/PmemCheckpoint.java
            m3/collections/implementations/spring-core-6.2.0-collections/src/main/java/jdk/m3/collections/spring/MultiToSingleValueMapAdapter.java
            m3/collections/implementations/spring-core-6.2.0-collections/src/main/java/jdk/m3/collections/spring/SingleToMultiValueMapAdapter.java
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongLongHashMap.java
            m3/core/src/jdk/m3/text/SharedRelatedLexemeCatalog.java
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexedListSnapshot.java
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3TreeWindowPlan.java
            src/java.base/share/classes/java/util/ChangeJournal.java
            src/java.base/share/classes/java/lang/M3CodeTextSignalBatch.java
            .github/workflows/m3jdk21-name-contract.yml
            m3/collections/implementations/eclipse-collections-14.0.0-snapshot-00a668d6/eclipse-collections/src/main/java/jdk/m3/collections/eclipse/impl/list/mutable/FastList.java
            m3/collections/implementations/guava-33.4.8/android/guava/src/jdk/m3/collections/guava/collect/CompactHashMap.java
            m3/collections/implementations/guava-33.4.8/guava/src/jdk/m3/collections/guava/collect/CompactHashMap.java
            src/jdk.m3.io/share/classes/jdk/m3/optane/PmemCheckpoint.java
            m3/ports/precompute/src/main/java/jdk/m3/precompute/NcmCodebook.java
            m3/ports/precompute/src/main/java/jdk/m3/precompute/NativePrecomputeOps.java
            m3/llm/src/main/native/**
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned naming schema test dependency
        run: python3 -m pip install -r m3/migration/requirements.txt
      - name: Canonical name and package mapping gate
        run: python3 m3/tooling/name-contract/check.py
      - name: Canonical target class and JNI owner census
        run: python3 m3/tooling/name-contract/audit.py --strict
      - name: Adversarial source-queue refusal tests
        if: always()
        run: python3 -m unittest discover -s m3/tooling/name-contract -p 'test_*.py' -v
