# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 exact unsigned-128 integer signal distance Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalExactIntegerDistance.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalExactIntegerDistance*.java'
      - 'm3/collections/qualification/signal-exact-integer-distance-20261025/**'
      - '.github/workflows/m3-signal-exact-integer-distance-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strictly compile actual owning source and independent unsigned-128 oracle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-integer-distance"
          mkdir -p "$out/classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalDependencyEpochs.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalQualitySchema.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressMonitor.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressState.java \
            m3/collections/src/main/java/com/m3/collections/M3ChildProgressMonitor.java \
            m3/collections/src/main/java/com/m3/collections/M3ShadowStreams.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalExactIntegerDistance.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalExactIntegerDistanceSelfTest.java
          java -cp "$out/classes" com.m3.collections.M3SignalExactIntegerDistanceSelfTest
          java -Xint -cp "$out/classes" com.m3.collections.M3SignalExactIntegerDistanceSelfTest
  original-module-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build existing source-vendored original JUnit dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Compile existing arrays, preserving original owning collections JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3SignalExactIntegerDistanceTest test
          test -s m3/collections/target/surefire-reports/TEST-com.m3.collections.M3SignalExactIntegerDistanceTest.xml
