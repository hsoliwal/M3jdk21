# SPDX-License-Identifier: Apache-2.0
name: M3 TypeFix actual framework proof
on:
  pull_request:
    paths:
      - 'm3/tooling/migration-recipes/**'
      - '.github/workflows/m3-type-fix.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Inspect exact input and diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/type-fix-proof
          git rev-parse HEAD > m3/type-fix-proof/head.txt
          git diff --check HEAD^ HEAD
          java -version 2> m3/type-fix-proof/java.txt
          mvn -version > m3/type-fix-proof/maven.txt
          printf '%s  %s\n' a1e1984d9b59ef07639df5c89b8ed3b03944bdbbefbac656865561d1689acb27 m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jdk21HashPinnedSnapshotRecipe.java | sha256sum --check -
      - name: Run real TypeFix parser and scheduler tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml -Dtest=TypeTest test 2>&1 | tee m3/type-fix-proof/type-test.log
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report = Path('m3/tooling/migration-recipes/target/surefire-reports/TEST-com.m3.rewrite.backport.TypeTest.xml')
          suite = ET.parse(report).getroot()
          if int(suite.attrib['tests']) != 5 or any(int(suite.attrib.get(k, '0')) for k in ('failures', 'errors', 'skipped')):
              raise SystemExit('Five executed, unskipped TypeTest cases are required')
          print('TYPE_FIX_JUNIT_PASS tests=5')
          PY
          cp -a m3/tooling/migration-recipes/target/surefire-reports m3/type-fix-proof/focused-reports
      - name: Run unchanged complete recipe verification and coverage gates
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml clean verify 2>&1 | tee m3/type-fix-proof/module-verify.log
      - name: Retain actual reports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-type-fix-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            m3/type-fix-proof/
            m3/tooling/migration-recipes/target/surefire-reports/
            m3/tooling/migration-recipes/target/site/jacoco/
          if-no-files-found: error
          retention-days: 14
