# SPDX-License-Identifier: Apache-2.0
# Source-first M3Scale: candidate mutation in disposable worktrees only.
name: M3 five-provider full source candidate execution
on:
  pull_request:
    paths:
      - 'synexia-openrewrite-recipes/recipe-crates/five-provider-package-relocation-20261018/**'
      - 'm3/collections/relocation/five-provider-20261018/**'
      - '.github/workflows/m3-five-provider-source-candidates.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-candidate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: GUAVA
            repository: hsoliwal/guava
            pin: dfd9dca629d44faf71846b1f85acd38556f4854d
            source_root: guava/src/com/google/common/collect
            source_tree: bdba90884fefae61cd8bf56092b8c97eb4539d85
            recipe: com.synexia.m3.RelocateGuavaFork20261018
          - family: ECLIPSE
            repository: hsoliwal/eclipse-collections
            pin: fbaa8605dad1a84900fd38a1f6954de31b733f07
            source_root: eclipse-collections/src/main/java/org/eclipse/collections/impl
            source_tree: 7585fe79da3edb6c2ccd79be7ec32759dcc43422
            recipe: com.synexia.m3.RelocateEclipseFork20261018
          - family: APACHE
            repository: hsoliwal/commons-collections
            pin: 6404dfdfe553097bb934e044034abcec5a4dbdd
            source_root: src/main/java/org/apache/commons/collections4
            source_tree: 56171a20ba5c365a2c70777dcaa619520cdf4a57
            recipe: com.synexia.m3.RelocateApacheCommonsFork20261018
          - family: SPRING
            repository: spring-projects/spring-framework
            pin: 49adc91c7e41eaafb52fc11e1210989894bda1f3
            source_root: spring-core/src/main/java/org/springframework/util
            source_tree: cfd3640d24b8d2dde3610396a1d1c8f6baf896ac
            recipe: com.synexia.m3.RelocateSpringFork20261018
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact public M3 recipe mirror, not live default source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/M3jdk21
          ref: 3c3accdd72b2395cff3ea70c300aab1de351a99e
          path: canonical
          persist-credentials: false
      - name: Checkout immutable donor source tree
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.pin }}
          path: donor
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preflight exact source commitment and source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-candidate"
          cd donor
          test "$(git rev-parse HEAD)" = "${{ matrix.pin }}"
          test "$(git rev-parse "HEAD:${{ matrix.source_root }}")" = "${{ matrix.source_tree }}"
          test -z "$(git status --porcelain)"
          echo -e "family\tpinned_commit\troot_git_tree\tmode\n${{ matrix.family }}\t${{ matrix.pin }}\t${{ matrix.source_tree }}\tEPHEMERAL_RUNNER_ONLY" > "$RUNNER_TEMP/m3-candidate/PIN.tsv"
      - name: Materialize full donor source candidate with canonical OpenRewrite recipe
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          RECIPE="$GITHUB_WORKSPACE/canonical/m3/collections/relocation/five-provider-20261018/src/main/resources/META-INF/rewrite/m3-five-provider-relocations.yml"
          test -f "$RECIPE"
          mvn -B -ntp org.openrewrite.maven:rewrite-maven-plugin:5.23.1:run \
            -Drewrite.configLocation="$RECIPE" \
            -Drewrite.activeRecipes="${{ matrix.recipe }}" \
            2>&1 | tee "$RUNNER_TEMP/m3-candidate/OPENREWRITE.log"
      - name: Record exact diff before linter or compiler
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          git add -N .
          git diff --binary > "$RUNNER_TEMP/m3-candidate/CANDIDATE.patch"
          git diff --name-status > "$RUNNER_TEMP/m3-candidate/FILES.tsv"
          git status --short > "$RUNNER_TEMP/m3-candidate/GIT_STATUS.txt"
          test -s "$RUNNER_TEMP/m3-candidate/CANDIDATE.patch"
          grep -Eq '\.java' "$RUNNER_TEMP/m3-candidate/FILES.tsv"
      - name: Check patch and Java source layout, then compile
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          git diff --check
          mvn -B -ntp -DskipTests compile 2>&1 | tee "$RUNNER_TEMP/m3-candidate/COMPILE.log"
      - name: Run full donor tests, then hold for serial M3 admission
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          mvn -B -ntp test 2>&1 | tee "$RUNNER_TEMP/m3-candidate/TEST.log"
          printf 'candidate_build\tPASS\nproduct_admission\tNOT_PERFORMED\n' > "$RUNNER_TEMP/m3-candidate/STATUS.tsv"
      - name: Retain all candidate logs and diffs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-full-source-${{ matrix.family }}-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/m3-candidate/
  jdk-protected-source:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse to package-rename real java.base
        shell: bash
        run: |
          echo "JDK original java.util API remains locked."
          echo "Source-first isolated-copy candidate requires separate JDK compiler module and full jtreg/JCK proof."
          echo "No java.base mutation or alias is admitted by this workflow."
