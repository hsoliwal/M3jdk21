# SPDX-License-Identifier: Apache-2.0
name: M3 five-library indexed materialization Java/JNI
on:
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryIndexViews.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryIndexViewsTest.java'
      - 'm3/collections/interop/qualification/current-census-20261017/**'
      - 'm3/collections/qualification/m3-five-provider-indexed-projections-20261018/**'
      - '.github/workflows/m3-five-provider-indexed-projections-20261018.yml'
  workflow_dispatch:
jobs:
  source-sealed-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real Maven/OpenRewrite scheduler and drift/fixed-point/refusal tests
        run: mvn -B -ntp -f m3/collections/qualification/m3-five-provider-indexed-projections-20261018/recipe/pom.xml clean verify
      - name: Verify four generated product and census postimages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path(".")
          recipe=root/"m3/collections/qualification/m3-five-provider-indexed-projections-20261018/recipe/src/main/resources/com/synexia/rewrite/m3-five-provider-indexed-projections-20261018"
          items=(recipe/"manifest.tsv").read_text(encoding="utf-8").splitlines()
          assert len(items)==4
          for item in items:
              path,before,after,template=item.split("\t")
              expected=(recipe/template).read_bytes()
              actual=(root/path).read_bytes()
              assert sha256(expected).hexdigest()==after,(path,"SHA")
              assert actual==expected,(path,"source drift")
          print("PASS source-sealed 4/4 generated postimages")
          PY
      - name: Preserve historical owners and 34-file source census
        run: |
          cd m3/collections/interop/qualification/current-census-20261017
          python3 -m unittest discover -p 'test_*.py' -v
          python3 verify.py
  actual-five-provider-qualification:
    runs-on: ubuntu-latest
    needs: source-sealed-recipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile existing M3 index and payload owners, with actual JDK21
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Compile and test actual five-provider APIs, not stubs
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Compile unchanged bounded C17 mask-window JNI
        run: |
          set -eu
          N="$RUNNER_TEMP/m3-five-provider-index-native"
          mkdir -p "$N"
          cc -std=c17 -fPIC -shared -O1 -g -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$N/libm3_collections_mask.so"
      - name: JUnit provider differential under checked Java/C JNI
        run: |
          N="$RUNNER_TEMP/m3-five-provider-index-native"
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveLibraryIndexViewsTest \
            "-DargLine=-Xcheck:jni -Djava.library.path=$N" test
