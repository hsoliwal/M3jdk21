# SPDX-License-Identifier: Apache-2.0
name: M3 five-family SDK contracts
on:
  pull_request:
    branches: [master]
    paths:
      - 'm3/collections/interop/**'
      - 'm3/collections/src/main/java/**'
      - 'm3/arrays/src/main/**'
      - 'm3/native/**'
      - 'm3/qualification/sdk-native-owner/**'
      - '.github/workflows/m3-sdk-family-names-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-and-donors:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            m3/arrays
            m3/native
            m3/collections
            m3/qualification/sdk-native-owner
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original M3 array and collection modules
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/arrays/META-INF proof/collections/META-INF
          find m3/arrays/src/main/java -name '*.java' | sort > proof/array-sources.txt
          javac --release 21 -Xlint:all,-module -Werror -d proof/arrays @proof/array-sources.txt
          cp m3/arrays/{LICENSE,NOTICE,provenance.json} proof/arrays/META-INF/
          jar --create --file proof/m3-arrays.jar -C proof/arrays .
          find m3/collections/src/main/java -name '*.java' | sort > proof/core-sources.txt
          javac --release 21 -Xlint:all,-module -Werror --module-path proof/m3-arrays.jar \
            -d proof/collections @proof/core-sources.txt
          cp m3/collections/{LICENSE,NOTICE,provenance.json,name-mapping.json} proof/collections/META-INF/
          jar --create --file proof/m3-collections.jar -C proof/collections .
          jdeps --print-module-deps --module-path proof/m3-arrays.jar proof/m3-collections.jar \
            > proof/module-closure.txt
          test "$(cat proof/module-closure.txt)" = com.m3.arrays,java.base
          ARRAYS="$GITHUB_WORKSPACE/proof/m3-arrays.jar"
          (cd "$RUNNER_TEMP" && mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$ARRAYS" -DpomFile="$GITHUB_WORKSPACE/m3/arrays/pom.xml")
          CORE="$GITHUB_WORKSPACE/proof/m3-collections.jar"
          (cd "$RUNNER_TEMP" && mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$CORE" -DgroupId=com.m3 -DartifactId=m3-collections \
            -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar \
            -DpomFile="$GITHUB_WORKSPACE/m3/collections/pom.xml")
          sha256sum proof/m3-arrays.jar proof/m3-collections.jar > proof/java-artifacts-sha256.txt
      - name: Build original JNI library and execute CTest
        shell: bash
        run: |
          set -euxo pipefail
          test -s m3/native/include/m3_jni_core.h
          cmake -S m3/arrays/src/main/native -B proof/native \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DJAVA_HOME="$JAVA_HOME"
          cmake --build proof/native --config Release --parallel 2
          ctest --test-dir proof/native --output-on-failure -C Release
          test -s proof/native/libm3_arrays.so
          sha256sum proof/native/libm3_arrays.so > proof/native-sha256.txt
      - name: Run exact real SDK factories with checked JNI
        shell: bash
        run: |
          set -euxo pipefail
          LIBRARY="$GITHUB_WORKSPACE/proof/native/libm3_arrays.so"
          SDK=m3/collections/interop/src/test/java/com/m3/collections/interop/M3SdkFamiliesTest.java
          SPRING=m3/collections/interop/src/test/java/com/m3/collections/interop/M3SpringCaseInsensitiveSdkFactoryTest.java
          test "$(git hash-object "$SDK")" = ff4754059d05d2c9a40b93c05867024639b1bf6d
          test "$(git hash-object "$SPRING")" = 530bbe2f3def29336a71c0d9030c8d541055641e
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            '-Dtest=M3SdkFamiliesTest,M3SpringCaseInsensitiveSdkFactoryTest' \
            "-DargLine=-Xcheck:jni -Dm3.arrays.native.path=$LIBRARY" \
            "-Dm3.arrays.native.path=$LIBRARY" verify 2>&1 | tee proof/sdk-junit.log
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = Path('m3/collections/interop/target/surefire-reports')
          expected = {'M3SdkFamiliesTest': 7, 'M3SpringCaseInsensitiveSdkFactoryTest': 2}
          identities = set()
          for name, count in expected.items():
              paths = list(reports.glob('TEST-com.m3.collections.interop.' + name + '.xml'))
              assert len(paths) == 1, ('missing or duplicate original SDK suite', name)
              root = ET.parse(paths[0]).getroot()
              assert int(root.get('tests', '-1')) == count, ('SDK method count', name)
              assert all(int(root.get(k, '-1')) == 0 for k in ('failures', 'errors', 'skipped'))
              methods = root.findall('testcase')
              assert len(methods) == count
              for method in methods:
                  assert not list(method), ('failed, skipped or flaky SDK test', name)
                  pair = method.get('classname'), method.get('name')
                  assert all(pair) and pair not in identities
                  identities.add(pair)
          assert len(identities) == 9
          print('M3_SDK_NATIVE_OWNER_PASS methods=9 classes=2 checked_jni=true')
          PYTEST
          git diff --exit-code -- m3/arrays/src/main m3/collections/src/main/java m3/collections/interop/src
      - name: Preserve SDK native and JUnit receipts including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-sdk-native-owner-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/interop/target/surefire-reports/
