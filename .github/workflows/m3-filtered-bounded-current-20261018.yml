name: M3 bounded filtered current-master receiver
on:
  pull_request:
    paths:
      - 'm3/collections/qualification/m3-filtered-bounded-current-20261018/**'
      - 'm3/collections/qualification/m3-filtered-navigation-20261018/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredViews.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3MutableFilteredViews.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java'
      - 'm3/collections/src/main/native/collections/m3_index_path_masks.c'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/main/native/collections/m3_index_mask_window.c'
      - 'm3/collections/src/test/java/com/m3/collections/**'
      - '.github/workflows/m3-filtered-bounded-current-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-filtered-current-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sealed-receiver-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Replay real OpenRewrite SDK and all input/receiver contracts
        run: |
          set -eu
          Q=m3/collections/qualification/m3-filtered-navigation-20261018
          mvn -B -ntp -f "$Q/recipe/pom.xml" \
            -Dm3.dataset=filtered-navigation-20261018 \
            -Drecipe.owner.root="$PWD/$Q/recipe/sdk-owner" -Pcontract verify
          python3 m3/collections/qualification/filtered-current/verify_shadow.py --crate "$Q/recipe" --dataset filtered-navigation-20261018 --target "$PWD"
          awk -F '\t' '!/^#/ && NF == 3 {print $3 "  " $1}' \
            "$Q/recipe/target/filtered-navigation-20261018/candidate/SDK_RESULTS.tsv" | sha256sum -c -
      - name: Preserve historical receipt and unchanged predecessor outputs
        run: |
          set -eu
          Q=m3/collections/qualification/m3-filtered-bounded-current-20261018/recipe
          awk -F '\t' -v q="$Q" '{print $3 "  " q "/" $4}' "$Q/manifest.tsv" | sha256sum -c -
          awk -F '\t' '$1 != "m3/collections/src/main/java/com/m3/collections/M3FilteredViews.java" {print $3 "  " $1}' \
            "$Q/manifest.tsv" | sha256sum -c -
      - name: Current full core and focused Java/JNI runtime closure
        run: python3 m3/collections/qualification/m3-filtered-navigation-20261018/runtime/verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-filtered-current-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            m3/collections/qualification/m3-filtered-navigation-20261018/runtime/target/*.log
            m3/collections/qualification/m3-filtered-navigation-20261018/runtime/target/*.json
            m3/collections/qualification/m3-filtered-navigation-20261018/runtime/target/*.tsv
            m3/collections/qualification/m3-filtered-navigation-20261018/runtime/target/*/surefire-reports/*.xml
            m3/collections/qualification/m3-filtered-navigation-20261018/recipe/target/filtered-navigation-20261018/surefire-reports/*
            m3/collections/qualification/m3-filtered-navigation-20261018/recipe/target/filtered-navigation-20261018/candidate/SDK_*.tsv
  owning-maven-contract:
    needs: sealed-receiver-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build genuine source-owned JUnit prerequisite
        run: |
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2,junit-platform-launcher-1.10.2 \
            -am -DskipTests install
      - name: Original owning Maven JUnit gate (must be green before promotion)
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3BoundedFilteredNavigationTest,M3FilteredNavigationReconciliationTest test
