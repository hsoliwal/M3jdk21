name: M3 wrapper boundary recipe and Java JNI proof
on:
  pull_request:
    paths:
      - 'm3/collections/**'
      - '.github/workflows/m3-wrapper-boundaries-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare sealed resources from exact parent; no product installation
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 https://github.com/hsoliwal/M3jdk21.git 11dde1eac33cea2a8b90baba8c155eabec341144
          python3 m3/collections/wrappers/boundaries-20261017/prepare.py
      - name: Actual Maven OpenRewrite SDK before source installation
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/wrappers/recipe/pom.xml \
            -Dtest=M3WrapperBoundaryRecipeTest \
            -Dm3.boundary.output="$RUNNER_TEMP/m3-boundary-sdk-output" test
      - name: Admit actual SDK output and execute Java21 and C17 JNI
        run: |
          set -euo pipefail
          python3 m3/collections/wrappers/boundaries-20261017/prepare.py \
            --install-sdk-output "$RUNNER_TEMP/m3-boundary-sdk-output"
          work="$RUNNER_TEMP/m3-boundary-proof"
          mkdir -p "$work/classes" "$work/headers"
          source=m3/collections/src/main/java/com/m3/collections
          test=m3/collections/wrappers/src/test/java/com/m3/collections
          sources=()
          for name in M3AdmissionWrappers M3BoundedLists M3CollectionWrappers M3ConcatenatedViews M3FixedSizeLists M3MappedViews M3CollectionViews M3FilteredMaps; do
            sources+=("$source/$name.java")
          done
          for name in M3WrapperBoundaryProof M3MapCursorNativeProof M3CollectionWrappersSelfTest M3PurposeReceiverProof M3FilteredSnapshotFusionProof; do
            sources+=("$test/$name.java")
          done
          javac --release 21 -proc:none -Xlint:all -Werror -h "$work/headers" -d "$work/classes" "${sources[@]}"
          for name in M3WrapperBoundaryProof M3CollectionWrappersSelfTest M3PurposeReceiverProof M3FilteredSnapshotFusionProof; do
            java -ea -cp "$work/classes" "com.m3.collections.$name"
          done
          timeout 90s java -ea -cp "$work/classes" com.m3.collections.M3WrapperBoundaryProof overflow
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -include "$work/headers/com_m3_collections_M3MapCursorNativeProof.h" \
            m3/collections/wrappers/direct-projection-20261017/m3_map_cursor_jni.c \
            -o "$work/libm3cursor.so"
          java -Xcheck:jni -ea -Dm3.cursor.native.library="$work/libm3cursor.so" \
            -cp "$work/classes" com.m3.collections.M3MapCursorNativeProof
          java m3/collections/counts/src/main/java/com/m3/collections/tooling/M3CountedCatalogue.java \
            m3/collections/wrappers/boundaries-20261017/CATEGORY_REVIEW.tsv lazy
          git diff --check
      - name: Preserve exact generated source, recipe resources and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-wrapper-boundary-proof
          path: |
            ${{ runner.temp }}/m3-boundary-sdk-output
            m3/collections/wrappers/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-wrapper-boundaries-20261017
            m3/collections/wrappers/recipe/target/surefire-reports
          if-no-files-found: error
