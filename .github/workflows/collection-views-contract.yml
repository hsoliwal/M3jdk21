# SPDX-License-Identifier: Apache-2.0
name: Collection views compatibility
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/java/util/CollectionViews.java'
      - 'test/jdk/java/util/CollectionViews/StoredRepresentativeOracle.java'
      - 'm3/compatibility/collection-views/**'
      - '.github/workflows/collection-views-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-head-patched-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/java.base/share/classes/java/util/CollectionViews.java
            test/jdk/java/util/CollectionViews/**
            m3/compatibility/collection-views/**
            .github/workflows/collection-views-contract.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source, public ABI, old red, new oracle and existing contracts
        run: bash m3/compatibility/collection-views/verify.sh "$RUNNER_TEMP/m3-stored-occurrence"
