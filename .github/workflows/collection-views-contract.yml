name: Collection views compatibility
# Former triggers (below, as of the move) now start job(s) 'collection-views-contract__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/java.base/share/classes/java/util/CollectionViews.java'
#         - 'test/jdk/java/util/CollectionViews/StoredRepresentativeOracle.java'
#         - 'm3/compatibility/collection-views/**'
#         - '.github/workflows/collection-views-contract.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-head-patched-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            src/java.base/share/classes/java/util/CollectionViews.java
            test/jdk/java/util/CollectionViews/**
            m3/compatibility/collection-views/**
            .github/workflows/collection-views-contract.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source, public ABI, old red, new oracle and existing contracts
        run: bash m3/compatibility/collection-views/verify.sh "$RUNNER_TEMP/m3-stored-occurrence"
