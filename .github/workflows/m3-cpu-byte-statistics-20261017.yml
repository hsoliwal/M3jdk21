name: M3 CPU byte statistics Java21 source and recipe custody

on:
  pull_request:
    paths:
      - 'm3/ports/capability-runtime/src/main/java/com/m3/runtime/capability/ByteStatistics.java'
      - 'm3/ports/capability-runtime/src/test/java/com/m3/runtime/capability/ByteStatisticsChecks.java'
      - 'm3/ports/capability-runtime/BYTE_STATISTICS_RECEIVER.md'
      - 'm3/ports/capability-runtime/CPU_TOOLS_FAMILY_CATALOGUE_20261017.tsv'
      - 'm3/ports/capability-runtime/RECEIVING_SHA256.tsv'
      - 'm3/ports/capability-runtime/verify_byte_statistics.py'
      - '.github/workflows/m3-cpu-byte-statistics-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-java21:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Enable long paths on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: m3/ports/capability-runtime
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java 21 compilation, real source and randomized oracle
        shell: bash
        run: |
          python3 m3/ports/capability-runtime/verify_byte_statistics.py --root . \
            --out "$RUNNER_TEMP/m3-byte-statistics-proof"
          test -s "$RUNNER_TEMP/m3-byte-statistics-proof/RECEIPT.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-byte-statistics-${{ matrix.os }}
          path: ${{ runner.temp }}/m3-byte-statistics-proof/
          if-no-files-found: warn
