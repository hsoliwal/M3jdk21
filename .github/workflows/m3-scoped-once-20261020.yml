# SPDX-License-Identifier: Apache-2.0
name: M3 scoped parse-once javac isolation
on:
  push:
    branches: [m3/scoped-once-javac-20261020]
  pull_request:
    paths:
      - m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ScopedCompilation.java
      - m3/tooling/module-packs/parser/src/test/java/jdk/m3/parser/test/M3ScopedCompilationTest.java
      - .github/workflows/m3-scoped-once-20261020.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile real javac scope driver and test with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-scoped-classes"
          javac --release 21 -Xlint:all -Werror -proc:none             -d "$RUNNER_TEMP/m3-scoped-classes"             m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ScopedCompilation.java             m3/tooling/module-packs/parser/src/test/java/jdk/m3/parser/test/M3ScopedCompilationTest.java
          java -ea -cp "$RUNNER_TEMP/m3-scoped-classes"             jdk.m3.parser.test.M3ScopedCompilationTest | tee scoped-result.txt
          grep '^M3_SCOPED_COMPILATION_PASS checks=9$' scoped-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-scoped-javac-receipt
          path: scoped-result.txt
          if-no-files-found: warn
