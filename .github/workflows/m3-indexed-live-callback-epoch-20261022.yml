name: M3JDK21 indexed filtered/sorted view original-owner callback epochs

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexedLiveView.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewPreparationContract.java'
      - 'm3/collections/qualification/indexed-live-callback-epoch-20261022/**'
      - 'm3/collections/algorithm-catalogue/indexed-live-callback-epoch-20261022.tsv'
      - '.github/workflows/m3-indexed-live-callback-epoch-20261022.yml'
  push:
    branches:
      - m3/indexed-live-callback-epoch-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-original-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: hsoliwal/M3jdk21
          ref: fee49d6f6197dc62c35ee741f564a8898cd2c5ba
          path: baseline
          sparse-checkout: |
            m3/collections/src/main/java
            m3/collections/src/test/java
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Source-sealed owner, exact preimage and generated postimages
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum baseline/m3/collections/src/main/java/jdk/m3/collections/M3IndexedLiveView.java | cut -d' ' -f1)" = 'c7b8f004d7702874d4353a021eb9297df207899c11556b966f6aa629f5920439'
          printf '%s\n' \
            '2e5c00296e26186c071fc47d2e3bcd16315825c8404bf271eafa8cd597c268af  m3/collections/src/main/java/jdk/m3/collections/M3IndexedLiveView.java' \
            '10f556673813bed4def929cd29a10063bfee430ceafe3f97c309a5a66fa3c5c0  m3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewPreparationContract.java' \
            | sha256sum -c -
      - name: Compile original Java 21 collection owners and both differential contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-indexed-live/new" "$RUNNER_TEMP/m3-indexed-live/original"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -sourcepath m3/collections/src/main/java:m3/collections/src/test/java \
            -d "$RUNNER_TEMP/m3-indexed-live/new" \
            m3/collections/src/main/java/module-info.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewContract.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewPreparationContract.java
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -sourcepath baseline/m3/collections/src/main/java:baseline/m3/collections/src/test/java \
            -d "$RUNNER_TEMP/m3-indexed-live/original" \
            baseline/m3/collections/src/main/java/module-info.java \
            baseline/m3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewContract.java
      - name: Preserve original public Java collection type and method signatures
        shell: bash
        run: |
          set -euo pipefail
          javap -public -classpath "$RUNNER_TEMP/m3-indexed-live/original" \
            jdk.m3.collections.M3IndexedLiveView > "$RUNNER_TEMP/m3-indexed-live/original.api"
          javap -public -classpath "$RUNNER_TEMP/m3-indexed-live/new" \
            jdk.m3.collections.M3IndexedLiveView > "$RUNNER_TEMP/m3-indexed-live/new.api"
          diff -u "$RUNNER_TEMP/m3-indexed-live/original.api" \
            "$RUNNER_TEMP/m3-indexed-live/new.api"
      - name: Original M3 collection index and read-only wrapper regression
        run: |
          java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-indexed-live/new" \
            -m jdk.m3.collections/jdk.m3.collections.M3IndexedLiveViewContract
      - name: New callback epoch, recursion, stable offset and JDK List differential
        run: |
          java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-indexed-live/new" \
            -m jdk.m3.collections/jdk.m3.collections.M3IndexedLiveViewPreparationContract
          java -Xint --module-path "$RUNNER_TEMP/m3-indexed-live/new" \
            -m jdk.m3.collections/jdk.m3.collections.M3IndexedLiveViewPreparationContract
