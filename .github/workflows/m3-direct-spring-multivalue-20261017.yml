# SPDX-License-Identifier: Apache-2.0
name: M3 direct Spring multivalue provider Java21
on:
  push:
    branches: ['m3/direct-spring-multivaluemap-20261017']
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3SpringArrayMultiValueMap.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3LibraryCollections.java'
      - 'm3/collections/interop/sdk-family-bindings.tsv'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3SpringArrayContractTest.java'
      - 'm3/collections/interop/qualification/m3-direct-spring-multivaluemap-20261017/**'
      - '.github/workflows/m3-direct-spring-multivalue-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-Spring-contract-direct-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Source-first Maven recipe, sealed templates and refused drift
        run: |
          mvn -B -ntp -f m3/collections/interop/qualification/m3-direct-spring-multivaluemap-20261017/recipe/pom.xml verify
          java -cp m3/collections/interop/qualification/m3-direct-spring-multivaluemap-20261017/recipe/target/classes \
            com.synexia.m3.M3SpringDirect20261017Recipe --check "$PWD"
      - name: Compile existing real M3 core, retain java.base-only dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-core"
          find m3/collections/src/main/java -name '*.java' | sort > "$RUNNER_TEMP/m3-sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -d "$RUNNER_TEMP/m3-core" @"$RUNNER_TEMP/m3-sources.txt"
          jar --create --file "$RUNNER_TEMP/m3-collections.jar" -C "$RUNNER_TEMP/m3-core" .
          test "$(jdeps --print-module-deps "$RUNNER_TEMP/m3-collections.jar")" = java.base
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$RUNNER_TEMP/m3-collections.jar" -DgroupId=com.m3 \
            -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT \
            -Dpackaging=jar -DgeneratePom=true
      - name: Real Spring 6.2 Maven/JUnit and all retained interop tests
        run: |
          mvn -B -ntp -f m3/collections/interop/pom.xml verify
          test -s m3/collections/interop/target/surefire-reports/TEST-com.m3.collections.interop.M3SpringArrayContractTest.xml
      - name: Inspect compiled implementation inheritance (no vendor adapter)
        run: |
          javap -classpath m3/collections/interop/target/classes \
            com.m3.collections.interop.M3SpringArrayMultiValueMap | \
            grep 'extends java.util.AbstractMap'
          ! javap -classpath m3/collections/interop/target/classes \
            com.m3.collections.interop.M3SpringArrayMultiValueMap | grep MultiValueMapAdapter
      - name: Preserve original M3 C17 JNI source boundary
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Werror -pedantic -fsyntax-only \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c
      - name: Confirm no unexpected source edits by build
        run: git diff --exit-code -- m3/collections/interop/src m3/collections/src/main/java
