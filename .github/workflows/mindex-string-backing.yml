name: M3JDK String owner-coordinate runtime
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/mindex/**'
      - 'm3/docs/m3-runtime-invariants.tsv'
      - 'm3/docs/m3string-history-recovery.tsv'
      - 'm3/docs/name-mapping.json'
      - 'm3/docs/synexia-string-recipe-authority.tsv'
      - 'm3/docs/m3jdk21-porting-invariant.md'
      - 'm3/docs/m3string-synexia-lineage.md'
      - 'm3/synexia-import/current-full-borrow/STRING_PHASE.md'
      - 'm3/synexia-import/current-full-borrow/string-source-target-map.tsv'
      - 'm3/synexia-import/current-full-borrow/string-phase-gates.tsv'
      - 'm3/synexia-import/current-full-borrow/string-phase-work-orders.tsv'
      - 'm3/synexia-import/current-full-borrow/check_string_phase.py'
      - 'm3/synexia-import/current-full-borrow/receiver-status.tsv'
      - 'm3/docs/synexia-string-precompute-port-map.tsv'
      - 'm3/docs/string-precompute-completeness.tsv'
      - 'm3/runtime-integration/**'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/M3Java21ConvergenceRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/M3Java21ConvergenceRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-atom-pattern.yml'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-file-inventory.yml'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-java21-convergence.yml'
      - 'src/hotspot/share/prims/jni.cpp'
      - 'src/hotspot/share/gc/shared/stringdedup/stringDedupTable.cpp'
      - 'src/hotspot/share/classfile/vmClassMacros.hpp'
      - 'src/hotspot/share/classfile/vmSymbols.hpp'
      - 'src/hotspot/share/classfile/javaClasses.inline.hpp'
      - 'src/hotspot/share/classfile/javaClasses.hpp'
      - 'src/hotspot/share/classfile/javaClasses.cpp'
      - 'src/hotspot/share/cds/archiveHeapWriter.cpp'
      - 'src/hotspot/share/opto/stringopts.cpp'
      - 'src/java.base/share/native/libjava/String.c'
      - 'src/java.base/share/classes/java/lang/M3String*.java'
      - 'src/java.base/share/classes/java/lang/M3StringCodePointPrecompute.java'
      - 'src/java.base/share/classes/java/lang/String.java'
      - 'src/java.base/share/classes/java/lang/StringConcatHelper.java'
      - 'src/java.base/share/classes/java/lang/AbstractStringBuilder.java'
      - 'test/jdk/java/lang/String/M3MappedStringBackingTest.java'
      - 'test/jdk/java/lang/String/MapGuardTest.java'
      - 'test/jdk/java/lang/String/MapFactsTest.java'
      - 'test/jdk/java/lang/String/MapUtfTest.java'
      - 'test/jdk/java/lang/String/M3StringFactsCompositionTest.java'
      - 'test/jdk/java/lang/String/M3StringCanonicalDagTest.java'
      - 'test/jdk/java/lang/String/M3StringStreamsTest.java'
      - 'test/jdk/java/lang/String/M3StringPrecomputeSearchTest.java'
      - 'test/jdk/java/lang/String/M3StringRegexReplacementTest.java'
      - 'test/jdk/java/lang/String/M3StringInternTest.java'
      - 'test/jdk/java/lang/String/M3StringCharArrayHistoryTest.java'
      - 'test/jdk/java/lang/String/M3StringConcatReferenceDagTest.java'
      - 'test/jdk/java/lang/String/M3StringJoinCarryTest.java'
      - 'test/jdk/java/lang/String/M3StringCodePointGeometryTest.java'
      - 'test/jdk/java/lang/String/M3StringLiteralMatchesTest.java'
      - 'test/jdk/java/lang/String/M3StringBuilderRangeBulkTest.java'
      - 'test/jdk/java/lang/String/M3StringByteSourceNeedleTest.java'
      - 'test/jdk/java/lang/String/M3StringMixedLiteralReplaceTest.java'
      - 'test/jdk/java/lang/String/M3StringRegexSplitHistoryTest.java'
      - 'test/jdk/java/lang/String/M3StringUtf16DifferentialCorpus.java'
      - 'test/jdk/java/lang/String/M3StringUtf16DifferentialTest.java'
      - 'test/jdk/jdk/internal/mindex/M3TQFactsTest.java'
      - 'test/jdk/java/util/regex/M3RegexLiteralTQTest.java'
      - 'test/jdk/java/util/regex/M3RegexReuseTest.java'
      - 'src/java.base/share/classes/java/util/regex/**'
      - 'm3/tooling/mr/**'
      - 'doc/mindex-string-backing.md'
      - '.github/workflows/mindex-string-backing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jdk-backing:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21 for recipe proofs
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify full-borrow MIndexString to M3String custody
        run: python3 m3/synexia-import/current-full-borrow/check_string_phase.py
      - name: Verify String completeness admission and refusal controls
        run: python3 m3/runtime-integration/test_string_completeness.py
      - name: Verify compiler-parsed M3 String layout
        run: python3 m3/runtime-integration/test_string_layout.py
      - name: Verify M3 String source invariants
        run: python3 m3/runtime-integration/check-m3string-invariants.py
      - name: Check current MIndexString history parity
        run: python3 m3/runtime-integration/check-m3string-history-recovery.py
      - name: Check compiler concat reference DAG
        run: python3 m3/runtime-integration/check-m3string-concat-reference-dag.py
      - name: Check bounded M3 String code-point geometry
        run: python3 m3/runtime-integration/check-m3string-codepoint-geometry.py
      - name: Check conservative literal String.matches receiver
        run: python3 m3/runtime-integration/check-m3string-literal-matches.py
      - name: Check prepared M3 builder range bulk receiver
        run: python3 m3/runtime-integration/check-m3string-builder-range-bulk.py
      - name: Check byte-source canonical M3 needle receiver
        run: python3 m3/runtime-integration/check-m3string-byte-source-needle.py
      - name: Check mixed canonical literal replacement receiver
        run: python3 m3/runtime-integration/check-m3string-mixed-literal-replace.py
      - name: Prove canonical DAG master-repair recipe
        run: mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml -Dtest=M3StringCanonicalDagMasterRepairRecipeTest test
      - name: Prove direct M3 String stream traversal recipe
        run: mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml -Dtest=M3StringDirectStreamTraversalRecipeTest test
      - name: Prove immutable Matcher fact reuse
        run: mvn -B -ntp -f m3/tooling/mr/pom.xml test
      - name: Set up Java 20 boot JDK for OpenJDK 21 build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '20'
      - name: Install build prerequisites
        run: sudo apt-get update && sudo apt-get install -y autoconf
      - name: Configure
        run: bash configure --with-debug-level=fastdebug --with-jvm-variants=server
      - name: Build java.base
        run: make java.base-java-only
      - name: Build matching runtime image
        run: make images
      - name: Run M3 String backing jtreg
        run: make test TEST="test/jdk/java/lang/String/M3MappedStringBackingTest.java test/jdk/java/lang/String/MapGuardTest.java test/jdk/java/lang/String/MapFactsTest.java test/jdk/java/lang/String/MapUtfTest.java test/jdk/java/lang/String/M3StringFactsCompositionTest.java test/jdk/java/lang/String/M3StringCanonicalDagTest.java test/jdk/java/lang/String/M3StringStreamsTest.java test/jdk/java/lang/String/M3StringPrecomputeSearchTest.java test/jdk/java/lang/String/M3StringRegexReplacementTest.java test/jdk/java/lang/String/M3StringInternTest.java test/jdk/java/lang/String/M3StringCharArrayHistoryTest.java test/jdk/java/lang/String/M3StringConcatReferenceDagTest.java test/jdk/java/lang/String/M3StringJoinCarryTest.java test/jdk/java/lang/String/M3StringCodePointGeometryTest.java test/jdk/java/lang/String/M3StringLiteralMatchesTest.java test/jdk/java/lang/String/M3StringBuilderRangeBulkTest.java test/jdk/java/lang/String/M3StringByteSourceNeedleTest.java test/jdk/java/lang/String/M3StringMixedLiteralReplaceTest.java test/jdk/java/lang/String/M3StringRegexSplitHistoryTest.java test/jdk/java/lang/String/M3StringUtf16DifferentialTest.java test/jdk/jdk/internal/mindex/M3TQFactsTest.java test/jdk/java/util/regex/M3RegexLiteralTQTest.java test/jdk/java/util/regex/M3RegexReuseTest.java"
