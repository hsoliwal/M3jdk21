name: M3 all-five actual SDK indexed masks32 / Java JNI
on:
  push:
    branches: ['m3/five-provider-index-masks32-receiver-20261018']
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryIndexViews.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryState32Test.java'
      - 'm3/collections/interop/qualification/five-provider-index-masks32-20261018/**'
      - '.github/workflows/m3-five-provider-index-masks32-20261018.yml'
permissions:
  contents: read
jobs:
  actual-five-provider-jdk21:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact recipe postimage and new JUnit hashes
        shell: bash
        run: |
          set -euo pipefail
          echo 'fb8125ef79ffc4788b00571ab447a1ed08eca65a56668725db5b2d799a67e85b  m3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryIndexViews.java' | sha256sum -c -
          echo '26548a60299d8647807401c467d013da60e2f9d248cb82450dcc6d0fe70a3d15  m3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryState32Test.java' | sha256sum -c -
      # Product m3/collections/pom.xml currently pins a non-repository JUnit
      # version 5.10.2-m3-source-1. That original Maven/JUnit build remains
      # blocked and is NOT represented as a green gate. This independent
      # source-only main-JAR installation compiles all actual M3 source owners
      # without copying a fake dependency or modifying the authoritative POM.
      - name: Compile exact real M3 core, check java.base-only boundary and install main JAR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-core-classes"
          find m3/collections/src/main/java -name '*.java' | sort > "$RUNNER_TEMP/m3-core-sources.txt"
          test -s "$RUNNER_TEMP/m3-core-sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -d "$RUNNER_TEMP/m3-core-classes" @"$RUNNER_TEMP/m3-core-sources.txt"
          jar --create --file "$RUNNER_TEMP/m3-collections-core.jar" \
            -C "$RUNNER_TEMP/m3-core-classes" .
          jdeps --print-module-deps "$RUNNER_TEMP/m3-collections-core.jar" > "$RUNNER_TEMP/m3-core-modules.txt"
          test "$(cat "$RUNNER_TEMP/m3-core-modules.txt")" = java.base
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$RUNNER_TEMP/m3-collections-core.jar" \
            -DgroupId=com.m3 -DartifactId=m3-collections \
            -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Compile actual Guava Eclipse Spring Apache APIs and run JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveLibraryState32Test,M3FiveLibraryIndexViewsTest,M3FiveLibraryInteropContractTest,M3EclipseMultimapTest,M3SpringArrayContractTest,M3CountedProviderContractTest \
            test
      - name: Compile BOTH existing C17 JNI mask selectors without new ABI
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -fPIC -shared -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
          gcc -std=c17 -fPIC -shared -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Actual JNI -Xcheck:jni AND five provider native JUnit replay
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveLibraryState32Test,M3FiveLibraryIndexViewsTest \
            -DargLine="-Xcheck:jni -Djava.library.path=$RUNNER_TEMP" test
      - name: Preserve executed test XML and log artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-five-provider-masks32-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            m3/collections/interop/target/surefire-reports/
            m3/collections/target/surefire-reports/
