# SPDX-License-Identifier: Apache-2.0
name: M3 execution profile contract

on:
  pull_request:
    paths:
      - 'm3/compiler/execution-profiles/**'
      - '.github/workflows/m3-execution-profile-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-execution-profile-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate verification script syntax
        run: bash -n m3/compiler/execution-profiles/verify.sh
      - name: Compile, test, merge and prove fixed point
        run: bash m3/compiler/execution-profiles/verify.sh
      - name: Upload deterministic profile and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-execution-profile-${{ github.sha }}
          path: build/m3-execution-profiles/
          if-no-files-found: error
          retention-days: 14
