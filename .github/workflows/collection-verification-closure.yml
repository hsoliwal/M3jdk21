# SPDX-License-Identifier: Apache-2.0
name: Collection verification module closure
# Former triggers (below, as of the move) now start job(s) 'collection-verification-closure__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/collections/verification/filtered-object-deques-20261017/verify.sh'
#         - 'm3/collections/verification/primitive-filtered-sequences-20261017/verify.sh'
#         - '.github/workflows/collection-verification-closure.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-collection-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run actual filtered Deque ownership
        run: bash m3/collections/verification/filtered-object-deques-20261017/verify.sh
      - name: Compile actual array prerequisite and primitive filtered collection module
        run: bash m3/collections/verification/primitive-filtered-sequences-20261017/verify.sh
