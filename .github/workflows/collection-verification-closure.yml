# SPDX-License-Identifier: Apache-2.0
name: Collection verification module closure
on:
  pull_request:
    paths:
      - 'm3/collections/verification/filtered-object-deques-20261017/verify.sh'
      - 'm3/collections/verification/primitive-filtered-sequences-20261017/verify.sh'
      - '.github/workflows/collection-verification-closure.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-collection-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run actual filtered Deque ownership
        run: bash m3/collections/verification/filtered-object-deques-20261017/verify.sh
      - name: Compile actual array prerequisite and primitive filtered collection module
        run: bash m3/collections/verification/primitive-filtered-sequences-20261017/verify.sh
