name: M3 optional Eclipse core JMOD - real owner Java21 JNI
on:
  pull_request:
    branches: [master]
    paths:
      - 'm3/eclipse/optional-jmod/**'
      - 'm3/file/**'
      - 'm3/core/src/**'
      - 'm3/arrays/src/**'
      - 'm3/ast/src/**'
      - 'm3/collections/src/**'
      - 'm3/docs/name-mapping.d/eclipse-core-optional-jmod-20261018.tsv'
      - '.github/workflows/m3-eclipse-core-optional-jmod.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-eclipse-core-jmod-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  jmod-receiving-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            m3/core
            m3/arrays
            m3/ast
            m3/collections
            m3/file
            m3/eclipse/optional-jmod
            m3/tooling/migration-recipes
            m3/docs/name-mapping.d/eclipse-core-optional-jmod-20261018.tsv
            m3/LICENSE
            m3/NOTICE
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind exact PR head and verify eight source/template identities
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head.txt
          java -version 2>&1 | tee proof/java-version.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          root = Path('m3/eclipse/optional-jmod/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/eclipse-core-optional-jmod')
          lines = [x.split('\t') for x in (root / 'manifest.tsv').read_text().splitlines()
                   if x and not x.startswith('#')]
          assert len(lines) == 8, lines
          assert [x[0] for x in lines] == sorted(x[0] for x in lines)
          for path, before, digest, template in lines:
              assert before == 'ABSENT'
              assert len(digest) == 64
              for file in (Path(path), root / template):
                  assert file.is_file() and not file.is_symlink(), file
                  actual = hashlib.sha256(file.read_bytes()).hexdigest()
                  assert actual == digest, (file, digest, actual)
          print('EIGHT_EXACT_M3_JAVA_POSTIMAGES')
          PY
      - name: Verify source seal for strict-warning Builder correction
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('m3/eclipse/optional-jmod/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-shared-lexicon-builder-explicit-ctor-20261018')
          rows = [x.split('\\t') for x in (root / 'manifest.tsv').read_text().splitlines()
                  if x and not x.startswith('#')]
          assert len(rows) == 1, rows
          path, before, after, template = rows[0]
          assert path == 'm3/core/src/com/m3/text/SharedLexiconPrecomputeCatalog.java'
          fixture = Path('m3/eclipse/optional-jmod/recipe/src/test/resources/com/synexia/rewrite/m3-shared-lexicon-builder-explicit-ctor-20261018/SharedLexiconPrecomputeCatalog.java.before.txt')
          target = Path(path)
          postimage = root / template
          for item in (fixture, target, postimage):
              assert item.is_file() and not item.is_symlink(), item
          digest = lambda item: hashlib.sha256(item.read_bytes()).hexdigest()
          assert digest(fixture) == before, (fixture, before, digest(fixture))
          assert digest(postimage) == after, (postimage, after, digest(postimage))
          assert digest(target) in {before, after}, (target, before, after, digest(target))
          named = Path('m3/eclipse/optional-jmod/recipe/src/main/resources/META-INF/rewrite/m3-shared-lexicon-builder-explicit-ctor-20261018.yml')
          assert named.is_file() and not named.is_symlink(), named
          print('EXACT_SHARED_LEXICON_BUILDER_POSTIMAGE_SEAL')
          PY
      - name: Execute actual canonical OpenRewrite fixed-point and refusal tests
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/optional-jmod/recipe/pom.xml test 2>&1 | tee proof/recipe.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          r=list(Path('m3/eclipse/optional-jmod/recipe/target/surefire-reports').glob('TEST-*.xml'))
          assert r, 'missing OpenRewrite JUnit report'
          roots=[ET.parse(x).getroot() for x in r]
          totals={k: sum(int(x.attrib.get(k,0)) for x in roots)
                  for k in ('tests','failures','errors','skipped')}
          assert totals == {'tests':8,'failures':0,'errors':0,'skipped':0}, totals
          print('CANONICAL_OPENREWRITE_TESTS_PASSED',totals)
          PY
      - name: Build real target M3File module with Java21 warnings-as-errors
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/file/pom.xml package 2>&1 | tee proof/m3-file-maven.txt
      - name: Compile reused M3 JNI selector with native warnings-as-errors
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/native
          cc -std=c17 -O2 -shared -fPIC -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so 2>&1 | tee proof/native-compile.txt
          sha256sum proof/native/libm3_collections_mask.so > proof/native-sha256.txt
      - name: Package all REAL M3 owner sources as JPMS/JMOD; check JNI, jlink, replay
        shell: bash
        run: |
          set -euxo pipefail
          JAVA_TOOL_OPTIONS="-Djava.library.path=$GITHUB_WORKSPACE/proof/native -Dm3.native.required=true -Xcheck:jni" \
            python3 m3/eclipse/optional-jmod/build.py verify \
            --jdk "$JAVA_HOME" --out "$GITHUB_WORKSPACE/proof/optional-jmod" \
            2>&1 | tee proof/real-jmod-build.txt
          grep -q 'M3_ECLIPSE_OPTIONAL_JMOD_REAL_JPMS_PASS assertions=22' proof/real-jmod-build.txt
          grep -q 'M3_ECLIPSE_CORE_JMOD_VERIFIED' proof/real-jmod-build.txt
          test -s proof/optional-jmod/jmods/com.m3.eclipse.core.jmod
          test -s proof/optional-jmod/JMOD_BUILD.tsv
          "$JAVA_HOME/bin/jmod" describe proof/optional-jmod/jmods/com.m3.eclipse.core.jmod \
            > proof/eclipse-core-module-descriptor.txt
          grep -q 'provides com.m3.eclipse.core.M3EclipseCore' proof/eclipse-core-module-descriptor.txt
          grep -q 'com.m3.file' proof/eclipse-core-module-descriptor.txt
          git diff --exit-code -- m3/core/src m3/arrays/src m3/ast/src \
            m3/collections/src m3/file/src m3/eclipse/optional-jmod/src
      - name: Upload exact-head binary and source-qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-optional-jmod-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/head.txt
            proof/java-version.txt
            proof/recipe.txt
            proof/m3-file-maven.txt
            proof/native-compile.txt
            proof/native-sha256.txt
            proof/real-jmod-build.txt
            proof/eclipse-core-module-descriptor.txt
            proof/optional-jmod/JMOD_BUILD.tsv
            proof/optional-jmod/jmods/*.jmod
            m3/eclipse/optional-jmod/recipe/target/surefire-reports/
