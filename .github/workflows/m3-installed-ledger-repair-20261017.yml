# SPDX-License-Identifier: Apache-2.0
name: M3 collection source inventory and Maven dependency repair recipe

on:
  pull_request:
    paths:
      - 'm3/collections/qualification/installed-ledger-20261017/**'
      - 'm3/collections/pom.xml'
      - 'm3/collections/recipe/pom.xml'
      - 'm3/collections/synexia-donation.json'
      - 'm3/collections/qualification/installed-source-20261017.tsv'
      - '.github/workflows/m3-installed-ledger-repair-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-sealed-maven-openrewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run real OpenRewrite XML two-POM generator and complete installed-source receipt JUnit
        run: >-
          mvn -B -ntp -f m3/collections/qualification/installed-ledger-20261017/pom.xml
          test -Dsurefire.useFile=false
      - name: Exact source-epoch V3 receipt emitted by qualified Maven test
        shell: bash
        run: |
          set -euo pipefail
          C=m3/collections/qualification/installed-ledger-20261017/target/receipt-candidates
          test -s "$C/installed-source-20261017.tsv"
          test -s "$C/synexia-donation.json"
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path("m3/collections/qualification/installed-ledger-20261017/target/receipt-candidates")
          src=(root/"installed-source-20261017.tsv").read_bytes()
          rec=(root/"synexia-donation.json").read_bytes()
          assert len([x for x in src.splitlines() if x and not x.startswith(b"#")])==135
          print("M3_GENERATED_MANIFEST_SHA256="+sha256(src).hexdigest())
          print("M3_GENERATED_DONATION_SHA256="+sha256(rec).hexdigest())
          print("M3_GENERATED_MANIFEST_BEGIN")
          print(src.decode("utf-8"),end="")
          print("M3_GENERATED_MANIFEST_END")
          PY
      - name: Verify recipe and current-tree diff hygiene
        run: git diff --check HEAD^ HEAD
