name: M3 acronym receiver

on:
  pull_request:
    branches:
      - codex/m3jdk-precompute-coverage-invariant-20261010
    paths:
      - m3/core/src/com/m3/text/M3LexiconPrecompute.java
      - m3/core/src/com/m3/text/AcronymSidecarCatalog.java
      - m3/core/test/M3AcronymPrecomputeTest.java
      - m3/core/test/AcronymSidecarCatalogTest.java
      - m3/core/test/M3AcronymReceiverCoverageTest.java
      - m3/lexicon/synexia-acronym-target-map.tsv
      - m3/lexicon/synexia-acronyms.tsv
      - m3/lexicon/synexia-acronym-provenance.json
      - m3/lexicon/synexia-acronym-target-receiver-receipt.tsv
      - m3/build.sh
      - .github/workflows/m3-acronym-receiver.yml
  push:
    branches:
      - codex/m3jdk-acronym-receiver-custody-20261010
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acronym-receiver:
    name: Java 21 acronym receiver and custody proof
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile and execute M3 acronym receiver
        shell: bash
        run: |
          set -euo pipefail
          export M3_JDK="$JAVA_HOME"
          bash m3/build.sh
          grep -R --fixed-strings             "M3_ACRONYM_RECEIVER_COVERAGE_PASS"             m3/build/logs/acronym-receiver-jit.log
