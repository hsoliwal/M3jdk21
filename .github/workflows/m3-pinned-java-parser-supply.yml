# Draft-branch toolchain transport only. This workflow contains no source-changing recipe.
name: M3 Pinned Java Parser Supply
on:
  pull_request:
    paths:
      - '.github/workflows/m3-pinned-java-parser-supply.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  obtain-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Obtain exact OpenRewrite Java21 parser from Maven Central
        shell: bash
        run: |
          set -euo pipefail
          : "${RUNNER_TEMP:?}"
          root="$RUNNER_TEMP/m3-java-parser/repository/org/openrewrite/rewrite-java-21/8.17.1"
          mkdir -p "$root"
          base='https://repo.maven.apache.org/maven2/org/openrewrite/rewrite-java-21/8.17.1'
          for suffix in jar pom jar.sha1 pom.sha1; do
            curl --fail --show-error --silent --location --retry 3 --connect-timeout 15 --max-time 90 \
              "$base/rewrite-java-21-8.17.1.$suffix" \
              --output "$root/rewrite-java-21-8.17.1.$suffix"
          done
          (cd "$root"; echo "$(cat rewrite-java-21-8.17.1.jar.sha1)  rewrite-java-21-8.17.1.jar" | sha1sum --check --status)
          (cd "$root"; echo "$(cat rewrite-java-21-8.17.1.pom.sha1)  rewrite-java-21-8.17.1.pom" | sha1sum --check --status)
          # Independent Synexia toolchain receipt, not a hash learned from the
          # same Maven download. Refuse altered JAR/POM even with matching .sha1.
          printf '%s\n' \
            '7e654435905cf6afb9e659185773de0b75e4282c8e30c916ad15fd16b0fba9f4  rewrite-java-21-8.17.1.jar' \
            '9465d6d13672fc36b517e7c06ad649a081829340b53ee3872bf08349ca9310c7  rewrite-java-21-8.17.1.pom' \
            > "$RUNNER_TEMP/m3-java-parser/EXPECTED_SHA256.txt"
          (cd "$root"; sha256sum --check --status "$RUNNER_TEMP/m3-java-parser/EXPECTED_SHA256.txt")
          # Under pipefail, grep -q may stop reading before jar finishes (SIGPIPE).
          # Inspect a completed archive listing instead of a short-circuit pipe.
          jar tf "$root/rewrite-java-21-8.17.1.jar" > "$RUNNER_TEMP/m3-java-parser/JAR_ENTRIES.txt"
          grep -Fxq 'org/openrewrite/java/Java21Parser.class' "$RUNNER_TEMP/m3-java-parser/JAR_ENTRIES.txt"
          test "$(stat -c '%s' "$root/rewrite-java-21-8.17.1.jar")" -gt 50000
          (cd "$root"; sha256sum rewrite-java-21-8.17.1.jar rewrite-java-21-8.17.1.pom) \
             | tee "$RUNNER_TEMP/m3-java-parser/SOURCE_MANIFEST.sha256"
          printf '%s\n' 'M3_AUTHENTIC_OPENREWRITE_JAVA21_SUPPLY_PASS version=8.17.1'
      - name: Preserve exact parser binary, POM and SHA256 receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-openrewrite-java21-parser-8171
          if-no-files-found: error
          retention-days: 30
          path: |
            ${{ runner.temp }}/m3-java-parser/repository/
            ${{ runner.temp }}/m3-java-parser/SOURCE_MANIFEST.sha256
            ${{ runner.temp }}/m3-java-parser/EXPECTED_SHA256.txt
