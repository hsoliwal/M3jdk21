# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 Synexia recipe home

on:
  push:
    branches:
      - "m3/synexia-consumer-only-*"
      - "m3/synexia-recipe-mirror-receiver-v2-*"
    paths:
      - "m3/compatibility/synexia-recipe-home-policy.tsv"
      - "m3/compatibility/test_synexia_recipe_home_policy.py"
      - "m3/compatibility/test_synexia_recipe_mirror_receiver_v2.py"
      - "m3/docs/mindex-migration-handoff.md"
      - "m3/compatibility/test_synexia_m3index_ownership_policy.py"
      - "m3/compatibility/SYNEXIA_M3INDEX_RECEIVER.md"
      - "m3/compatibility/synexia-m3index-family-handoff.tsv"
      - "m3/compatibility/synexia-m3index-ownership-pin.tsv"
      - "m3/tooling/migration-recipes/README.md"
      - "m3/tooling/migration-recipes/pom.xml"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/synexia/M3SynexiaRecipeHomePolicyTest.java"
      - "m3/docs/synexia-apache2-borrowing-contract.md"
      - "m3/docs/SYNEXIA_CONVERGENCE_MODEL.md"
      - "m3/tooling/migration-recipes/receiver/synexia-recipe-mirror-v2/**"
      - ".github/workflows/m3-synexia-recipe-home.yml"
  pull_request:
    paths:
      - "m3/compatibility/synexia-recipe-home-policy.tsv"
      - "m3/compatibility/test_synexia_recipe_home_policy.py"
      - "m3/compatibility/test_synexia_recipe_mirror_receiver_v2.py"
      - "m3/docs/mindex-migration-handoff.md"
      - "m3/compatibility/test_synexia_m3index_ownership_policy.py"
      - "m3/compatibility/SYNEXIA_M3INDEX_RECEIVER.md"
      - "m3/compatibility/synexia-m3index-family-handoff.tsv"
      - "m3/compatibility/synexia-m3index-ownership-pin.tsv"
      - "m3/tooling/migration-recipes/README.md"
      - "m3/tooling/migration-recipes/pom.xml"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/synexia/M3SynexiaRecipeHomePolicyTest.java"
      - "m3/docs/synexia-apache2-borrowing-contract.md"
      - "m3/docs/SYNEXIA_CONVERGENCE_MODEL.md"
      - "m3/tooling/migration-recipes/receiver/synexia-recipe-mirror-v2/**"
      - ".github/workflows/m3-synexia-recipe-home.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Checkout pinned canonical Synexia verifier source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/com.synexia
          ref: 9264e2aa35ca58c28fc40e361811949a50163fd6
          path: .m3-synexia-source
          fetch-depth: 1
      - name: Install portable Synexia receiver verifier
        run: >
          mvn -B -ntp
          -f .m3-synexia-source/synexia-openrewrite-recipes/pom-m3jdk21-recipe-mirror-verifier.xml
          -Dmaven.test.skip=true
          install
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/master HEAD)"
          git diff --check "$base"...HEAD
      - name: Receiver policy unit test
        run: >
          python -m unittest
          m3/compatibility/test_synexia_recipe_home_policy.py
          m3/compatibility/test_synexia_m3index_ownership_policy.py
          m3/compatibility/test_synexia_recipe_mirror_receiver_v2.py
      - name: Migration-recipes JUnit ownership proof
        run: >
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3SynexiaRecipeHomePolicyTest
          test
      - name: Verify proof-bound Synexia recipe mirror receiver
        run: >
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -P m3-synexia-recipe-mirror-v2
          org.codehaus.mojo:exec-maven-plugin:3.5.0:java@verify-proof-bound-synexia-recipe-mirror
