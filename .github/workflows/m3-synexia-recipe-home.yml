name: M3JDK21 Synexia recipe home

on:
  push:
    branches:
      - "m3/synexia-consumer-only-*"
      - "m3/synexia-canonical-recipe-residue-freeze-*"
    paths:
      - "m3/compatibility/synexia-recipe-home-policy.tsv"
      - "m3/compatibility/synexia-canonical-residue-gitblobs.tsv"
      - "m3/docs/synexia-recipe-ownership-classification.tsv"
      - "m3/docs/M3JDK_SYNEXIA_PORTING_INVARIANT.md"
      - "m3/docs/m3jdk-synexia-porting-policy.tsv"
      - "m3/compatibility/synexia-a3-regex-memory-recipe-receipt-20261008.tsv"
      - "m3/compatibility/test_synexia_a3_regex_memory_receipt.py"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-regex-memory-lab.yml"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-regex-memory-workflow.yml"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-jni-newstring-admission.yml"
      - "m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/a3-regex-memory-lab/manifest.tsv"
      - "m3/compatibility/test_synexia_recipe_home_policy.py"
      - "m3/compatibility/synexia-string-focused-recipe-receipt-20261008.tsv"
      - "m3/compatibility/synexia-string-focused-estate-binding-20261008.tsv"
      - "m3/compatibility/test_synexia_string_focused_recipe_receipt.py"
      - "m3/compatibility/test_synexia_string_runtime_responsibility.py"
      - "m3/compatibility/synexia-string-runtime-responsibility-20261008.tsv"
      - "m3/docs/mindex-migration-handoff.md"
      - "m3/compatibility/test_synexia_m3index_ownership_policy.py"
      - "m3/compatibility/SYNEXIA_M3INDEX_RECEIVER.md"
      - "m3/compatibility/synexia-m3index-family-handoff.tsv"
      - "m3/compatibility/synexia-m3index-ownership-pin.tsv"
      - "m3/tooling/migration-recipes/README.md"
      - "m3/tooling/migration-recipes/pom.xml"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/synexia/M3SynexiaRecipeHomePolicyTest.java"
      - "m3/docs/synexia-apache2-borrowing-contract.md"
      - "m3/docs/SYNEXIA_CONVERGENCE_MODEL.md"
      - ".github/workflows/m3-synexia-recipe-home.yml"
  pull_request:
    paths:
      - "m3/compatibility/synexia-recipe-home-policy.tsv"
      - "m3/compatibility/synexia-a3-regex-memory-recipe-receipt-20261008.tsv"
      - "m3/compatibility/test_synexia_a3_regex_memory_receipt.py"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-regex-memory-lab.yml"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-regex-memory-workflow.yml"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-jni-newstring-admission.yml"
      - "m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/a3-regex-memory-lab/manifest.tsv"
      - "m3/compatibility/test_synexia_recipe_home_policy.py"
      - "m3/compatibility/synexia-string-focused-recipe-receipt-20261008.tsv"
      - "m3/compatibility/synexia-string-focused-estate-binding-20261008.tsv"
      - "m3/compatibility/test_synexia_string_focused_recipe_receipt.py"
      - "m3/docs/mindex-migration-handoff.md"
      - "m3/compatibility/test_synexia_m3index_ownership_policy.py"
      - "m3/compatibility/SYNEXIA_M3INDEX_RECEIVER.md"
      - "m3/compatibility/synexia-m3index-family-handoff.tsv"
      - "m3/compatibility/synexia-m3index-ownership-pin.tsv"
      - "m3/tooling/migration-recipes/README.md"
      - "m3/tooling/migration-recipes/pom.xml"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/synexia/M3SynexiaRecipeHomePolicyTest.java"
      - "m3/docs/synexia-apache2-borrowing-contract.md"
      - "m3/docs/SYNEXIA_CONVERGENCE_MODEL.md"
      - ".github/workflows/m3-synexia-recipe-home.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout canonical Synexia recipe workspace
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/com.synexia
          ref: develop
          path: .canonical-synexia
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          base="$(git merge-base origin/master HEAD)"
          git diff --check "$base"...HEAD
      - name: Receiver policy unit test
        run: >
          python -m unittest
          m3/compatibility/test_synexia_recipe_home_policy.py
          m3/compatibility/test_synexia_a3_regex_memory_receipt.py
          m3/compatibility/test_synexia_m3index_ownership_policy.py
          m3/compatibility/test_synexia_string_focused_recipe_receipt.py
          m3/compatibility/test_synexia_string_runtime_responsibility.py
      - name: Migration-recipes JUnit ownership proof
        run: >
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3SynexiaRecipeHomePolicyTest
          test
      - name: Install canonical Synexia OpenRewrite artifact
        working-directory: .canonical-synexia
        run: >
          mvn -B -ntp
          -pl synexia-openrewrite-recipes -am
          -DskipTests
          install
      - name: Prove M3JDK21 consumers without copied Synexia main sources
        run: >
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -P m3-synexia-consumer-retirement-proof
          -Dtest=M3SynexiaCanonicalRecipeConsumerTest,M3SynexiaScopeKernelConsumerTest,M3SynexiaSemanticFingerprintConsumerTest,M3SynexiaRecipeHomePolicyTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
