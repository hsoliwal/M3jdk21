name: M3 region foundation receiver
on:
  push:
    branches: ['m3/region-foundation-repair-20261016']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-region-foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-bound-qualification:
    if: github.ref == 'refs/heads/m3/region-foundation-repair-20261016'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            m3/tooling/region-foundation-repair
            m3/runtime-integration/region-foundation-20261016
            m3/docs
            src/java.base/share/classes/java/lang
            test/jdk/java/lang/String
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 855afe57a679aeb454052630de7beddcb25f5f8f
          path: baseline
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            m3/core
            m3/docs
            m3/tooling/migration-recipes
            src/java.base/share/classes/java/lang
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify canonical task before target application
        shell: bash
        run: |
          set -euo pipefail
          bash m3/tooling/region-foundation-repair/qualify.sh "$PWD/baseline" "$RUNNER_TEMP/m3-region-evidence"
      - name: Preserve dependency and source evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/m3-region-evidence"
          mkdir -p "$evidence"
          tar -czf "$evidence/task-source.tar.gz" m3/tooling/region-foundation-repair
          if test -d "$HOME/.m2/repository"; then
            tar -C "$HOME/.m2" -czf "$evidence/maven-dependencies.tar.gz" repository
          fi
          git rev-parse HEAD > "$evidence/receiver-commit.txt"
          git -C baseline rev-parse HEAD > "$evidence/baseline-commit.txt"
      - name: Publish qualified Java candidates on this review branch only
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/m3/region-foundation-repair-20261016
          export DELIVERY="$RUNNER_TEMP/m3-region-evidence/delivery"
          python3 - <<'PY'
          import csv, hashlib, os
          from pathlib import Path
          root = Path.cwd()
          delivery = Path(os.environ['DELIVERY'])
          rows = list(csv.DictReader((root/'m3/tooling/region-foundation-repair/postimages.tsv').open(), delimiter='\t'))
          admitted = []
          for row in rows:
              path = row['path']
              target = root/path
              raw = (delivery/path).read_bytes()
              assert hashlib.sha256(raw).hexdigest() == row['after_sha256'], path
              current = hashlib.sha256(target.read_bytes()).hexdigest() if target.exists() else 'ABSENT'
              assert current in (row['before_sha256'], row['after_sha256']), path
              # Workflow output is reviewed/applied separately with the GitHub connector.
              if not path.startswith('.github/'):
                  admitted.append((target, raw))
          for target, raw in admitted:
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          PY
          proof=m3/runtime-integration/region-foundation-20261016
          mkdir -p "$proof"
          cp "$DELIVERY/delivery.tsv" "$proof/"
          cp "$RUNNER_TEMP/m3-region-evidence/runtime/qualification-scope.json" "$proof/"
          cp "$RUNNER_TEMP/m3-region-evidence/runtime/"*.log "$proof/"
          cp "$RUNNER_TEMP/m3-region-evidence/maven-verify.log" "$proof/"
          printf '%s\n' "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > "$proof/action-run.txt"
          git add src/java.base/share/classes/java/lang/String.java m3/docs/name-mapping.json test/jdk/java/lang/String/M3RegionMatchesNonPositive.java "$proof"
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'Hitesh Soliwal'
          git config user.email 'hsoliwal@gmail.com'
          git commit -m 'fix(m3jdk): apply qualified non-positive region guards and regression corpus'
          askpass="$RUNNER_TEMP/m3-git-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) echo x-access-token;; *) echo "$GH_TOKEN";; esac' > "$askpass"
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          remote="$(git ls-remote origin refs/heads/m3/region-foundation-repair-20261016 | cut -f1)"
          test "$remote" = "$GITHUB_SHA"
          git push origin HEAD:refs/heads/m3/region-foundation-repair-20261016
          rm -f "$askpass"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3-region-foundation-${{ github.sha }}
          path: ${{ runner.temp }}/m3-region-evidence/
          if-no-files-found: error
          retention-days: 7
