# SPDX-License-Identifier: Apache-2.0
name: M3 CPU tool receiver complete admission
on:
  pull_request:
    paths:
      - 'm3/tooling/jmod-recipes/**'
      - '.github/workflows/m3-cpu-tool-receiver-admission-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-java21-admission:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and run real candidate, adversarial and 20-to-18 proof
        run: |
          mkdir -p "$RUNNER_TEMP/receiver-classes"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/receiver-classes" \
            m3/tooling/jmod-recipes/src/main/java/com/m3/rewrite/jmod/CpuToolReceiverAdmission.java \
            m3/tooling/jmod-recipes/src/test/java/com/m3/rewrite/jmod/CpuToolReceiverAdmissionChecks.java
          java -cp "$RUNNER_TEMP/receiver-classes" com.m3.rewrite.jmod.CpuToolReceiverAdmissionChecks
          java -cp "$RUNNER_TEMP/receiver-classes" com.m3.rewrite.jmod.CpuToolReceiverAdmission \
            m3/tooling/jmod-recipes/CPU_TOOL_DONOR_CATALOGUE_PIN_20261015.tsv \
            m3/tooling/jmod-recipes/CPU_TOOL_RECEIVER_MAP_20261014.tsv \
            m3/tooling/jmod-recipes/CPU_TOOL_RECEIVER_DEFERRALS_20261015.tsv
