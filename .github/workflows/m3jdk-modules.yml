name: M3JDK modules
# Product code moved from the m3/ side tree into real JDK modules under src/ (approved layout 2026-11-08).
# One step per moved area runs make/m3/<area>/test-module.sh on a host JDK 21: the module compiles as a module,
# its same-package tests run exactly as the former Maven module ran them, and the opt-in native lane builds the
# library through make/m3/<area>/CMakeLists.txt.
# Former triggers (below, as of the move) now start job(s) 'm3jdk-modules__*' in
# .github/workflows/checks-superset-02.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       branches: [master]
#       paths:
#         - 'src/jdk.m3.collections/**'
#         - 'test/jdk/jdk/m3/arrays/**'
#         - 'test/jdk/jdk/m3/collections/**'
#         - 'test/jdk/jdk/internal/m3/collections/**'
#         - 'make/m3/collections/**'
#         - 'm3/arrays/pom.xml'
#         - 'm3/collections/pom.xml'
#         - 'make/m3/arrays/**'
#         - 'make/modules/jdk.m3.collections/**'
#         - '.github/workflows/m3jdk-modules.yml'
#     push:
#       branches: [master]
#       paths:
#         - 'src/jdk.m3.collections/**'
#         - 'test/jdk/jdk/m3/arrays/**'
#         - 'test/jdk/jdk/m3/collections/**'
#         - 'test/jdk/jdk/internal/m3/collections/**'
#         - 'make/m3/collections/**'
#         - 'm3/arrays/pom.xml'
#         - 'm3/collections/pom.xml'
#         - 'make/m3/arrays/**'
#         - 'make/modules/jdk.m3.collections/**'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  modules:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: JUnit console launcher
        run: mvn -B -ntp -q dependency:get -Dartifact=org.junit.platform:junit-platform-console-standalone:1.11.4
      - name: jdk.m3.collections / arrays
        run: bash make/m3/arrays/test-module.sh ~/.m2/repository/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar "$RUNNER_TEMP/m3-arrays"
      - name: Maven bridge of the moved area (m3/arrays -> the module sources) and its first consumer
        run: |
          mvn -B -ntp -q -f m3/arrays/pom.xml install
          mvn -B -ntp -q -f m3/collections/pom.xml -DskipTests package
      - name: Verify MAT primitive export contracts in the owning collection module
        run: >-
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=PrimitiveExportContractTest -DfailIfNoTests=true test

      - name: Execute range jtreg-style main on the actual compiled M3 module
        shell: bash
        run: |
          set -euo pipefail
          module_dir="$RUNNER_TEMP/m3-arrays/module"
          test -s "$module_dir/module-info.class"
          test -s "$module_dir/jdk/m3/collections/CollectionViews.class"
          test -s "$module_dir/jdk/m3/collections/DefaultProgressMonitor.class"
          test -s test/jdk/jdk/m3/collections/CollectionViewsRangeCompatibilityTest.java
          test_dir="$RUNNER_TEMP/m3-real-range-contract"
          mkdir -p "$test_dir"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            --module-path "$module_dir" --add-modules jdk.m3.collections \
            -d "$test_dir" \
            test/jdk/jdk/m3/collections/CollectionViewsRangeCompatibilityTest.java
          for mode in default interpreter tier1; do
            options=()
            case "$mode" in
              interpreter) options=(-Xint) ;;
              tier1) options=(-XX:TieredStopAtLevel=1) ;;
            esac
            output="$(java "${options[@]}" \
              --module-path "$module_dir" --add-modules jdk.m3.collections \
              -cp "$test_dir" CollectionViewsRangeCompatibilityTest)"
            printf '%s\n' "$output"
            test "$output" = "M3_STATIC_RANGE_COMPAT_PASS checks=46"
          done
          echo "M3_REAL_MODULE_RANGE_TEST_PASS configurations=3 checks=138"

      - name: Verify functional equivalence on the complete owning module
        shell: bash
        run: bash make/m3/collections/test-equivalence.sh "$RUNNER_TEMP/m3-equivalence"
