# SPDX-License-Identifier: Apache-2.0
name: M3 primitive composite lazy streams and unchanged JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongCompositeViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongCompositeLateBind*'
      - 'm3/collections/qualification/composite-latebind-20261017/**'
      - '.github/workflows/m3-composite-latebind-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify canonical Synexia-generated postimages
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check m3/collections/qualification/composite-latebind-20261017/SHA256SUMS
      - name: Compile existing M3 owners and differential oracle under strict Java21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-composite-classes
          find m3/collections/src/main/java -name '*.java' -print | LC_ALL=C sort > /tmp/m3-composite-sources.txt
          javac --release 21 -proc:none -Xlint:all,-module -Werror -d /tmp/m3-composite-classes @/tmp/m3-composite-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror -cp /tmp/m3-composite-classes -d /tmp/m3-composite-classes m3/collections/src/test/java/com/m3/collections/M3LongCompositeLateBindSelfTest.java
          java -ea -cp /tmp/m3-composite-classes com.m3.collections.M3LongCompositeLateBindSelfTest
      - name: Real JNI native parity for existing unchanged mask kernel
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -O2 -fPIC -shared -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" m3/collections/src/main/native/collections/m3_index_mask_compactor.c -o /tmp/libm3_collections_mask.so
          javac --release 21 -proc:none -Xlint:all -Werror -cp /tmp/m3-composite-classes -d /tmp/m3-composite-classes m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          java -Xcheck:jni -Djava.library.path=/tmp -cp /tmp/m3-composite-classes com.m3.collections.M3IndexMaskCompactorSelfTest --native
