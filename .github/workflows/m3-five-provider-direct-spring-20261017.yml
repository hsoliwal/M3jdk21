# SPDX-License-Identifier: Apache-2.0
name: M3 five-provider direct Spring Java21 and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveProviderDirectSdk.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3SpringArrayMultiValueMap.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveProviderDirectSdkTest.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3SpringArrayContractTest.java'
      - 'm3/collections/interop/qualification/five-provider-direct-spring-20261017/**'
      - '.github/workflows/m3-five-provider-direct-spring-20261017.yml'
  workflow_dispatch:
jobs:
  actual-source-and-provider-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Prove exact canonical OpenRewrite source and installed result
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/interop/qualification/five-provider-direct-spring-20261017/recipe/pom.xml \
            "-Dm3.receiver.root=$PWD" clean verify
      - name: Compile and install actual unchanged M3 collection owners
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Run actual JDK Guava Eclipse Apache Spring JUnit provider tests
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Reexercise unchanged JNI mask selector with checked JNI
        run: |
          set -eu
          CLASSES="$RUNNER_TEMP/m3-direct-spring/classes"
          NATIVE="$RUNNER_TEMP/m3-direct-spring/native"
          mkdir -p "$CLASSES" "$NATIVE"
          PKG=m3/collections/src/main/java/com/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror -d "$CLASSES" \
            "$PKG/M3IndexMaskCompactor.java" \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$NATIVE/libm3_collections_mask.so"
          java -Xcheck:jni "-Djava.library.path=$NATIVE" -cp "$CLASSES" \
            com.m3.collections.M3IndexMaskCompactorSelfTest
