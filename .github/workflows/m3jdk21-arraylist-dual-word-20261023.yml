name: M3JDK21 array-backed removeIf dual-word receiving gate
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ArrayList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ArrayListShortWordMaskContract.java'
      - 'm3/collections/algorithm-catalog/arraylist-dual-word-mask-20261023.tsv'
      - 'm3/collections/qualification/arraylist-dual-word-20261023/**'
      - '.github/workflows/m3jdk21-arraylist-dual-word-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-built-collections:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            m3/collections/**
            .github/workflows/m3jdk21-arraylist-dual-word-20261023.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and install real M3 array substrate
        run: mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Compile and test actual M3 collections module
        run: mvn -B -ntp -f m3/collections/pom.xml test
      - name: Run full Java21 M3ArrayList differential contract
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListShortWordMaskContract
      - name: Run existing reference identity/fail-fast/serialization oracle
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListRemoveIfProof
