# SPDX-License-Identifier: Apache-2.0
name: M3 observable filtered and sorted indexed views Java21

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObservableList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ObservableIndexedViewsContract.java'
      - 'm3/collections/recipe/observable-indexed-views-20261021/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-observable-indexed-views-20261021/**'
      - '.github/workflows/m3-observable-indexed-views-20261021.yml'
  push:
    branches:
      - m3/observable-indexed-views-20261021
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-owner-and-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile existing M3 dynamic-array/index-mask owners and contracts
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m3-observable"
          javac --release 21 -Xlint:all,-module -Werror \
            -sourcepath m3/collections/src/main/java:m3/collections/src/test/java \
            -d "$RUNNER_TEMP/m3-observable" \
            m3/collections/src/main/java/module-info.java \
            m3/collections/src/test/java/com/m3/collections/M3ObservableListContract.java \
            m3/collections/src/test/java/com/m3/collections/M3ObservableIndexedViewsContract.java
      - name: Existing observable List contract
        run: java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-observable" -m com.m3.collections/com.m3.collections.M3ObservableListContract
      - name: Observable filtered/sorted primitive-index contract
        run: java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-observable" -m com.m3.collections/com.m3.collections.M3ObservableIndexedViewsContract
      - name: Source-sealed Maven/OpenRewrite recipe and refusal
        run: mvn -B -ntp -f m3/collections/recipe/observable-indexed-views-20261021/pom.xml test
