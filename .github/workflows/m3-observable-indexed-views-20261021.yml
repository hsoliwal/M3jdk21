# SPDX-License-Identifier: Apache-2.0
name: M3 observable filtered and sorted indexed views Java21

on:
  pull_request:
    paths:
      - 'src/jdk.m3.collections/share/classes/**'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/**'
      - 'src/jdk.m3.collections/share/classes/jdk/internal/m3/collections/**'
      - 'm3/collections/src/main/java/**'
      - 'src/jdk.m3.collections/share/classes/jdk/internal/m3/collections/ObservableList.java'
      - 'test/jdk/jdk/internal/m3/collections/ObservableListContract.java'
      - 'm3/collections/test_observable_workflow.py'
      - 'test/jdk/jdk/m3/collections/ObservableIndexedViewsContract.java'
      - '.github/workflows/m3-observable-indexed-views-20261021.yml'
  push:
    branches:
      - master
      - m3/restore-merged-atoms-ci-20261022
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-owner-and-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original jdk.m3.arrays module before dependent collections
        shell: bash
        run: |
          set -euo pipefail
          modules="$RUNNER_TEMP/m3-observable/modules"
          mkdir -p "$modules/jdk.m3.arrays"
          mapfile -d '' -t array_sources < <(
            find m3/arrays/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/arrays -type f -name '*.java' -print0 | sort -z
          )
          test "${#array_sources[@]}" -ge 2
          test -f m3/arrays/src/main/java/module-info.java
          javac --release 21 -Xlint:all,-module -Werror \
            -d "$modules/jdk.m3.arrays" "${array_sources[@]}"
          test -f "$modules/jdk.m3.arrays/module-info.class"
          java --module-path "$modules" --describe-module jdk.m3.arrays
      - name: Compile existing M3 dynamic-array/index-mask owners and contracts
        shell: bash
        run: |
          set -euo pipefail
          modules="$RUNNER_TEMP/m3-observable/modules"
          test -f "$modules/jdk.m3.arrays/module-info.class"
          mkdir -p "$modules/jdk.m3.collections"
          mapfile -d '' -t collection_sources < <(
            find m3/collections/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/collections src/jdk.m3.collections/share/classes/jdk/internal/m3/collections -type f -name '*.java' ! -name module-info.java -print0 | sort -z
          )
          test "${#collection_sources[@]}" -ge 1
          javac --release 21 -Xlint:all,-module -Werror \
            --module-path "$modules" \
            -sourcepath m3/collections/src/main/java:src/jdk.m3.collections/share/classes:test/jdk \
            -d "$modules/jdk.m3.collections" \
            m3/collections/src/main/java/module-info.java \
            "${collection_sources[@]}" \
            test/jdk/jdk/internal/m3/collections/ObservableListContract.java \
            test/jdk/jdk/m3/collections/ObservableIndexedViewsContract.java
      - name: Check observable workflow source wiring
        run: python3 -m unittest discover -s m3/collections -p test_observable_workflow.py -v
      - name: Existing observable List contract
        run: java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-observable/modules" -m jdk.m3.collections/jdk.internal.m3.collections.ObservableListContract
      - name: Observable filtered/sorted primitive-index contract
        run: java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-observable/modules" -m jdk.m3.collections/jdk.m3.collections.ObservableIndexedViewsContract
