# SPDX-License-Identifier: Apache-2.0
name: M3 Synexia family naming receiver

on:
  pull_request:
    paths:
      - 'make/m3/compatibility/M3_FAMILY_NAMING_RECEIVER.md'
      - 'make/m3/compatibility/m3-family-naming-pin.tsv'
      - 'make/m3/compatibility/m3-family-naming-target-disposition.tsv'
      - 'make/m3/compatibility/check_m3_family_naming.py'
      - 'doc/m3/M3JDK_M3_PORTING_INVARIANT.md'
      - '.github/workflows/m3-family-naming-receiver.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Diff hygiene
        run: git diff --check
      - name: Verify pinned family naming receiver
        run: python3 make/m3/compatibility/check_m3_family_naming.py
