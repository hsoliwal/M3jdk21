name: M3 JEP 423 G1 region-pinning inventory

on:
  push:
    branches:
      - "m3/jep423-*"
      - "m3/jep423-region-pinning-inventory-20261006"
    paths:
      - "m3/backports/recipes/jep-423-region-pinning/**"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-jep423-region-pinning-inventory.yml"
  pull_request:
    paths:
      - "m3/backports/recipes/jep-423-region-pinning/**"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-jep423-region-pinning-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Consume canonical Synexia workflow-structure validator
        shell: bash
        run: |
          set -euo pipefail
          SYNEXIA="$RUNNER_TEMP/synexia-recipe-owner"
          git init -q "$SYNEXIA"
          git -C "$SYNEXIA" remote add origin https://github.com/hsoliwal/com.synexia.git
          git -C "$SYNEXIA" -c protocol.version=2 fetch -q --depth=1 origin 0f0f9965092955c15f5c32f5eb102137fd0dbf8e
          test "$(git -C "$SYNEXIA" rev-parse FETCH_HEAD)" = "0f0f9965092955c15f5c32f5eb102137fd0dbf8e"
          java "$SYNEXIA/synexia-code-convergence/tools/WorkflowStructureCheck.java" \
            .github/workflows/m3-jep423-region-pinning-inventory.yml

      - name: Fetch exact OpenJDK 21, JEP423 implementation and JDK22 GA
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/jdk-22+36:refs/tags/jdk-22+36"             "38cfb220ddadbb401cc15f313aadb8234f626210"
          printf 'UPSTREAM=%s\\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: Prove implementation touched-path denominator and compatibility split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep423
          python3 - <<'PY'
          import csv
          import subprocess
          from pathlib import Path
          import os

          root = Path(".")
          repo = Path(os.environ["UPSTREAM"])
          packet = root / "m3/backports/recipes/jep-423-region-pinning"

          expected = [
              line.strip()
              for line in (packet / "PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          admitted = [
              line.strip()
              for line in (packet / "ADMIT_PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          actual = subprocess.check_output(
              [
                  "git", "-C", str(repo), "diff-tree", "--no-commit-id", "--name-only", "-r",
                  "38cfb220ddadbb401cc15f313aadb8234f626210",
              ],
              text=True,
          ).splitlines()

          if len(expected) != 59:
              raise SystemExit(f"expected 59 JEP423 paths, found {len(expected)}")
          if len(admitted) != 57:
              raise SystemExit(f"expected 57 admitted JEP423 paths, found {len(admitted)}")
          if sorted(expected) != sorted(actual):
              raise SystemExit(
                  "JEP423 implementation denominator drift "
                  f"missing={sorted(set(actual)-set(expected))} "
                  f"extra={sorted(set(expected)-set(actual))}"
              )

          preserved = sorted(set(expected) - set(admitted))
          wanted_preserved = sorted([
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/TestJNIBlockFullGC.java",
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/libTestJNIBlockFullGC.c",
          ])
          if preserved != wanted_preserved:
              raise SystemExit(f"JEP423 preserved-deletion drift: {preserved}")

          with (packet / "COMPATIBILITY_SPLIT.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              split = {row["path"]: row for row in csv.DictReader(handle, delimiter="	")}
          if set(split) != set(expected):
              raise SystemExit("JEP423 compatibility split does not cover full denominator")
          for path in wanted_preserved:
              if split[path]["disposition"] != "PRESERVE_JDK21_PATH":
                  raise SystemExit(f"JEP423 removal not preserved: {path}")
          print("JEP423_DENOMINATOR=59")
          print("JEP423_ADMITTED=57")
          print("JEP423_PRESERVED_DELETIONS=2")
          PY

      - name: Unit-test whole-tree comparator and mixed FILE-crate generator
        shell: bash
        run: |
          set -euo pipefail
          cd m3/backports
          python3 -m unittest -v             test_file_delta_inventory.py             test_generate_recipe_crates.py

      - name: Inventory exact JDK21 to JDK22 GA deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/file_delta_inventory.py             --repo "$UPSTREAM"             --release 22             --out target/jep423/JDK21_TO_JDK22.tsv

      - name: Generate one source-sealed FILE atom per admitted JEP423 path
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/generate_recipe_crates.py             --repo "$UPSTREAM"             --release 22             --paths-file m3/backports/recipes/jep-423-region-pinning/ADMIT_PATHS.txt             --crate-size 1             --include-native             --include-text             --out target/jep423/file-atoms

      - name: Account for all admitted and preserved paths
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          from pathlib import Path

          packet = Path("m3/backports/recipes/jep-423-region-pinning")
          admitted = {
              line.strip()
              for line in (packet / "ADMIT_PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          all_paths = {
              line.strip()
              for line in (packet / "PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          preserved = all_paths - admitted

          with Path("target/jep423/JDK21_TO_JDK22.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              delta = {
                  row["path"]: row["status"]
                  for row in csv.DictReader(handle, delimiter="	")
                  if row["path"] in admitted
              }
          missing = admitted - delta.keys()
          if missing:
              raise SystemExit(f"admitted paths absent from JDK22 tree comparison: {sorted(missing)}")

          same = {path for path, status in delta.items() if status == "SAME"}

          with Path("target/jep423/file-atoms/CRATES.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              crates = list(csv.DictReader(handle, delimiter="	"))
          generated = sum(int(row["target_count"]) for row in crates)

          with Path("target/jep423/file-atoms/EXCLUSIONS.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              exclusions = list(csv.DictReader(handle, delimiter="	"))

          if generated + len(exclusions) + len(same) != len(admitted):
              raise SystemExit(
                  "JEP423 admitted accounting mismatch: "
                  f"generated={generated} exclusions={len(exclusions)} "
                  f"same={len(same)} admitted={len(admitted)}"
              )
          if len(preserved) != 2:
              raise SystemExit(f"JEP423 preserved deletion count drift: {len(preserved)}")
          if generated + len(exclusions) + len(same) + len(preserved) != len(all_paths):
              raise SystemExit("JEP423 full denominator accounting mismatch")

          print(
              f"JEP423_ACCOUNTED generated={generated} exclusions={len(exclusions)} "
              f"same={len(same)} preserved={len(preserved)} total={len(all_paths)}"
          )
          PY

      - name: Verify M3 backport and recipe substrate
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/backports/pom.xml verify
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3RecipeScopeDeclarationTest             -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Validate evidence-bound JEP423 packet DAG
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=com.m3.tooling.dag.M3BackportPacketMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java

      - name: Project JEP423 DAG to Camel Airflow and Drools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep423/projections
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=com.m3.tooling.dag.M3OrchestrationProjectionMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/target/jep423/projections $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java
          test -s target/jep423/projections/M3BackportRoutes.java
          test -s target/jep423/projections/m3_backport_dag.py
          test -s target/jep423/projections/m3_backport_rules.drl
          test -s target/jep423/projections/projection.tsv

      - name: Upload JEP423 FILE-atom inventory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jep423-file-atoms-${{ github.run_id }}
          path: target/jep423
          if-no-files-found: error
          retention-days: 30
