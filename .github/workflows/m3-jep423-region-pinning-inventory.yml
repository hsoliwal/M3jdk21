name: M3 JEP 423 G1 region-pinning inventory

on:
  push:
    branches:
      - "m3/jep423-region-pinning-inventory-20261006"
      - "m3/jep423-current-tree-admission-repair-20261007"
    paths:
      - "m3/backports/recipes/jep-423-region-pinning/**"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/current_tree_preimage_inventory.py"
      - "m3/backports/test_current_tree_preimage_inventory.py"
      - "m3/backports/test_jep423_current_admission.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-jep423-region-pinning-inventory.yml"
  pull_request:
    paths:
      - "m3/backports/recipes/jep-423-region-pinning/**"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/current_tree_preimage_inventory.py"
      - "m3/backports/test_current_tree_preimage_inventory.py"
      - "m3/backports/test_jep423_current_admission.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-jep423-region-pinning-inventory.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Fetch exact OpenJDK 21, complete JEP423 lineage and JDK22 GA
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/jdk-22+36:refs/tags/jdk-22+36"             "38cfb220ddadbb401cc15f313aadb8234f626210"             "8643cc21333c6b51242ed3b9295b25f372244755"             "0d5f5e15d43f94a79c6133baecd5af217365d176"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: Prove implementation touched-path denominator and compatibility split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep423
          python3 - <<'PY'
          import csv
          import subprocess
          from pathlib import Path
          import os

          root = Path(".")
          repo = Path(os.environ["UPSTREAM"])
          packet = root / "m3/backports/recipes/jep-423-region-pinning"

          expected = [
              line.strip()
              for line in (packet / "PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          admitted = [
              line.strip()
              for line in (packet / "ADMIT_PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          actual = subprocess.check_output(
              [
                  "git", "-C", str(repo), "diff-tree", "--no-commit-id", "--name-only", "-r",
                  "38cfb220ddadbb401cc15f313aadb8234f626210",
              ],
              text=True,
          ).splitlines()

          if len(expected) != 59:
              raise SystemExit(f"expected 59 JEP423 paths, found {len(expected)}")
          if len(admitted) != 57:
              raise SystemExit(f"expected 57 admitted JEP423 paths, found {len(admitted)}")
          if sorted(expected) != sorted(actual):
              raise SystemExit(
                  "JEP423 implementation denominator drift "
                  f"missing={sorted(set(actual)-set(expected))} "
                  f"extra={sorted(set(expected)-set(actual))}"
              )

          preserved = sorted(set(expected) - set(admitted))
          wanted_preserved = sorted([
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/TestJNIBlockFullGC.java",
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/libTestJNIBlockFullGC.c",
          ])
          if preserved != wanted_preserved:
              raise SystemExit(f"JEP423 preserved-deletion drift: {preserved}")

          with (packet / "COMPATIBILITY_SPLIT.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              split = {row["path"]: row for row in csv.DictReader(handle, delimiter="	")}
          if set(split) != set(expected):
              raise SystemExit("JEP423 compatibility split does not cover full denominator")
          for path in wanted_preserved:
              if split[path]["disposition"] != "PRESERVE_JDK21_PATH":
                  raise SystemExit(f"JEP423 removal not preserved: {path}")
          print("JEP423_DENOMINATOR=59")
          print("JEP423_ADMITTED=57")
          print("JEP423_PRESERVED_DELETIONS=2")
          PY

      - name: Validate complete JEP423 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/recipes/jep-423-region-pinning/validate_lineage.py
          cd m3/backports
          python3 -m unittest -v test_jep423_lineage.py

      - name: Prove pinned upstream commit identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import os
          import subprocess
          from pathlib import Path

          repo = Path(os.environ["UPSTREAM"])
          packet = Path("m3/backports/recipes/jep-423-region-pinning")
          with (packet / "LINEAGE.tsv").open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream, delimiter="\t"))

          for row in rows:
              commit = row["commit"]
              actual = subprocess.check_output(
                  ["git", "-C", str(repo), "show", "-s", "--format=%H%n%P%n%s", commit],
                  text=True,
              ).splitlines()
              if actual[0] != commit:
                  raise SystemExit(f"commit identity drift: {commit}")
              if row["parent"] not in actual[1].split():
                  raise SystemExit(f"parent identity drift: {commit}")
              if row["jbs"] not in actual[2]:
                  raise SystemExit(f"JBS identity drift: {commit}: {actual[2]}")
              print(f"JEP423_LINEAGE_OK {row['order']} {row['jbs']} {commit}")
          PY

      - name: Admit current-tree preimages against exact Java21 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/current_tree_preimage_inventory.py \
            --root . \
            --paths-file m3/backports/recipes/jep-423-region-pinning/CUMULATIVE_ADMIT_PATHS.txt \
            --out target/jep423/CURRENT_PREIMAGES.tsv \
            --baseline-git "$UPSTREAM" \
            --baseline-ref jdk-21+35 \
            --admission-out target/jep423/CURRENT_TREE_FILE_ADMISSION.tsv \
            --mechanical-paths-out target/jep423/MECHANICAL_PATHS.txt
          python3 m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py \
            --packet m3/backports/recipes/jep-423-region-pinning \
            --admission target/jep423/CURRENT_TREE_FILE_ADMISSION.tsv

      - name: Unit-test whole-tree comparator and mixed FILE-crate generator
        shell: bash
        run: |
          set -euo pipefail
          cd m3/backports
          python3 -m unittest -v             test_current_tree_preimage_inventory.py             test_file_delta_inventory.py             test_generate_recipe_crates.py             test_jep423_current_admission.py

      - name: Inventory exact JDK21 to JDK22 GA deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/file_delta_inventory.py             --repo "$UPSTREAM"             --release 22             --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176             --out target/jep423/JDK21_TO_JEP423_FINAL.tsv

      - name: Generate one source-sealed FILE atom per admitted JEP423 path
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/generate_recipe_crates.py             --repo "$UPSTREAM"             --release 22             --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176             --paths-file target/jep423/MECHANICAL_PATHS.txt                         --donor-map m3/backports/recipes/jep-423-region-pinning/PATH_DONOR_OVERRIDES.tsv --crate-size 1             --include-native             --include-text             --out target/jep423/file-atoms

      - name: Account for all admitted and preserved paths
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py \
            --packet m3/backports/recipes/jep-423-region-pinning \
            --runner target/jep423

      - name: Verify M3 backport and recipe substrate
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/backports/pom.xml verify
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3RecipeScopeDeclarationTest             -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Validate evidence-bound JEP423 packet DAG
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=com.m3.tooling.dag.M3BackportPacketMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java

      - name: Project JEP423 DAG to Camel Airflow and Drools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep423/projections
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=com.m3.tooling.dag.M3OrchestrationProjectionMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/target/jep423/projections $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java
          test -s target/jep423/projections/M3BackportRoutes.java
          test -s target/jep423/projections/m3_backport_dag.py
          test -s target/jep423/projections/m3_backport_rules.drl
          test -s target/jep423/projections/projection.tsv

      - name: Upload JEP423 FILE-atom inventory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jep423-file-atoms-${{ github.run_id }}
          path: target/jep423
          if-no-files-found: error
          retention-days: 30
