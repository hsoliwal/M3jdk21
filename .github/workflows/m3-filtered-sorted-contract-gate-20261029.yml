name: M3 filtered/sorted Java 21 contract gate
# Former triggers (below, as of the move) now start job(s) 'm3-filtered-sorted-contract-gate-20261029__*' in
# .github/workflows/checks-superset-08.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredViews.java'
#         - 'test/jdk/jdk/m3/collections/M3FilteredSortedContractGate20261029.java'
#         - '.github/workflows/m3-filtered-sorted-contract-gate-20261029.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
jobs:
  java21-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned owner source blob
        shell: bash
        run: |
          actual="$(git hash-object src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredViews.java)"
          test "$actual" = "102fa70995471fefdd18edb6a58c6a85cf80fdb8"
      - name: Compile actual owner and standalone contract
        shell: bash
        run: |
          mkdir -p build/m3-filtered-contract
          javac --release 21 -proc:none -Xlint:all -Werror -d build/m3-filtered-contract \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredViews.java \
            test/jdk/jdk/m3/collections/M3FilteredSortedContractGate20261029.java
      - name: Execute normal and interpreted runtime contracts
        shell: bash
        run: |
          java -cp build/m3-filtered-contract jdk.m3.collections.M3FilteredSortedContractGate20261029
          java -Xint -cp build/m3-filtered-contract jdk.m3.collections.M3FilteredSortedContractGate20261029
