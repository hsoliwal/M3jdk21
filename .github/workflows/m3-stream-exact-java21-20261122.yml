# SPDX-License-Identifier: Apache-2.0
name: M3 stream original-owner exact Java21 patch proof

on:
  pull_request:
    paths:
      - '.github/workflows/m3-stream-exact-java21-20261122.yml'
      - 'src/java.base/share/classes/java/util/stream/Streams.java'
      - 'src/java.base/share/classes/java/util/function/ext/ObjLongFunction.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStream*.java'
      - 'test/jdk/java/util/stream/Streams/StreamStrictAndAdjacentTest.java'
      - 'test/jdk/jdk/m3/collections/ObjectStreamStrictZipContractTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-java21:
    name: Exact java.base and M3 source closures (stock JDK21 patch, not full JDK image)
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind source identities to exact candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '91e40e3322a5377c0c0e7e35dd5379da0cdc7e55502700b4fde0408d427c3617' 'src/java.base/share/classes/java/util/stream/Streams.java' \
            '2a22852aa0b68209fa7ef7ab50a935149b5a697d837cd00a38330118957d119b' 'src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStream.java' \
            '12ddd2e21e43d3ee3bf41d08629978d5e1cca52f2a44ab64da306d3628fd7d17' 'test/jdk/java/util/stream/Streams/StreamStrictAndAdjacentTest.java' \
            '4db258ab88e335eda443c66aa1c68f2101fc0324dd3c93b5d3bc043c91dc24a3' 'test/jdk/jdk/m3/collections/ObjectStreamStrictZipContractTest.java' \
            | sha256sum --check -
          git diff --check

      - name: Compile exact java.base Streams original owner (Java21 patch-module)
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/m3-stream-exact"
          mkdir -p "$work/patch/java/util/stream" "$work/patch/java/util/function/ext" \
            "$work/java.base" "$work/jdk.m3.collections" "$work/tests"
          cp src/java.base/share/classes/java/util/stream/Streams.java \
            "$work/patch/java/util/stream/Streams.java"
          cp src/java.base/share/classes/java/util/function/ext/ObjLongFunction.java \
            "$work/patch/java/util/function/ext/ObjLongFunction.java"
          javac -Xlint:all,-exports -Werror --patch-module "java.base=$work/patch" \
            -d "$work/java.base" \
            "$work/patch/java/util/function/ext/ObjLongFunction.java" \
            "$work/patch/java/util/stream/Streams.java"
          printf 'M3_EXACT_WORK=%s\n' "$work" >> "$GITHUB_ENV"

      - name: Run exact java.base regression in normal and interpreted modes
        shell: bash
        run: |
          set -euo pipefail
          javac -Xlint:all,-exports -Werror \
            --patch-module "java.base=$M3_EXACT_WORK/java.base" \
            -d "$M3_EXACT_WORK/tests" \
            test/jdk/java/util/stream/Streams/StreamStrictAndAdjacentTest.java
          java --patch-module "java.base=$M3_EXACT_WORK/java.base" \
            -cp "$M3_EXACT_WORK/tests" StreamStrictAndAdjacentTest \
            | tee "$RUNNER_TEMP/m3-stream-normal.log"
          java -Xint --patch-module "java.base=$M3_EXACT_WORK/java.base" \
            -cp "$M3_EXACT_WORK/tests" StreamStrictAndAdjacentTest \
            | tee "$RUNNER_TEMP/m3-stream-interpreted.log"
          grep '^M3_STREAM_STRICT_ADJACENT_PASS checks=' "$RUNNER_TEMP/m3-stream-normal.log"
          grep '^M3_STREAM_STRICT_ADJACENT_PASS checks=' "$RUNNER_TEMP/m3-stream-interpreted.log"

      - name: Compile exact M3 ObjectStream original source closure
        shell: bash
        run: |
          set -euo pipefail
          javac -Xlint:all,-exports,-module -Werror \
            --patch-module "java.base=$M3_EXACT_WORK/java.base" \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -sourcepath src/jdk.m3.collections/share/classes \
            -d "$M3_EXACT_WORK/jdk.m3.collections" \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStream.java

      - name: Run exact M3 ObjectStream contract in normal and interpreted modes
        shell: bash
        run: |
          set -euo pipefail
          javac -Xlint:all,-exports,-module -Werror \
            --patch-module "java.base=$M3_EXACT_WORK/java.base" \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -cp "$M3_EXACT_WORK/jdk.m3.collections" \
            -d "$M3_EXACT_WORK/tests" \
            test/jdk/jdk/m3/collections/ObjectStreamStrictZipContractTest.java
          java --patch-module "java.base=$M3_EXACT_WORK/java.base" \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -cp "$M3_EXACT_WORK/jdk.m3.collections:$M3_EXACT_WORK/tests" \
            ObjectStreamStrictZipContractTest | tee "$RUNNER_TEMP/m3-object-normal.log"
          java -Xint --patch-module "java.base=$M3_EXACT_WORK/java.base" \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -cp "$M3_EXACT_WORK/jdk.m3.collections:$M3_EXACT_WORK/tests" \
            ObjectStreamStrictZipContractTest | tee "$RUNNER_TEMP/m3-object-interpreted.log"
          grep '^M3_OBJECT_STREAM_STRICT_ZIP_PASS checks=' "$RUNNER_TEMP/m3-object-normal.log"
          grep '^M3_OBJECT_STREAM_STRICT_ZIP_PASS checks=' "$RUNNER_TEMP/m3-object-interpreted.log"

      - name: Preserve source-compile evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-stream-exact-java21-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/m3-stream-normal.log
            ${{ runner.temp }}/m3-stream-interpreted.log
            ${{ runner.temp }}/m3-object-normal.log
            ${{ runner.temp }}/m3-object-interpreted.log
          if-no-files-found: ignore
