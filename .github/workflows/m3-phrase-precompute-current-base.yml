# SPDX-License-Identifier: Apache-2.0
name: M3 phrase precompute current-base

on:
  pull_request:
    paths:
      - "m3/core/src/com/m3/text/M3PhrasePrecompute.java"
      - "m3/core/src/com/m3/text/M3PhraseSidecarCatalog.java"
      - "m3/core/test/M3PhrasePrecomputeTest.java"
      - "m3/core/test/M3PhraseSidecarCatalogTest.java"
      - "m3/runtime-integration/synexia_phrase_sidecar.py"
      - "m3/lexicon/synexia-source-manifest.tsv"
      - "m3/lexicon/synexia-precompute-field-map.tsv"
      - "m3/runtime-integration/FOSS_REUSE_DECISION.tsv"
      - ".github/workflows/m3-phrase-precompute-current-base.yml"
  push:
    branches:
      - codex/m3-phrase-precompute-current-base-20261011
    paths:
      - "m3/core/src/com/m3/text/M3PhrasePrecompute.java"
      - "m3/core/src/com/m3/text/M3PhraseSidecarCatalog.java"
      - "m3/core/test/M3PhrasePrecomputeTest.java"
      - "m3/core/test/M3PhraseSidecarCatalogTest.java"
      - "m3/runtime-integration/synexia_phrase_sidecar.py"
      - "m3/lexicon/synexia-source-manifest.tsv"
      - "m3/lexicon/synexia-precompute-field-map.tsv"
      - "m3/runtime-integration/FOSS_REUSE_DECISION.tsv"
      - ".github/workflows/m3-phrase-precompute-current-base.yml"

permissions:
  contents: read

jobs:
  receiver:
    name: M3PhrasePrecompute
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Run deterministic Python sidecar proof
        shell: bash
        run: python3 -B m3/runtime-integration/synexia_phrase_sidecar.py
      - name: Compile and run Java receiver proofs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m3/build/phrase-precompute-current-base
          mkdir -p m3/build/phrase-precompute-current-base/classes m3/build/phrase-precompute-current-base/tests
          javac --release 21 -Xlint:all -Werror             -d m3/build/phrase-precompute-current-base/classes             m3/core/src/com/m3/text/M3PhrasePrecompute.java             m3/core/src/com/m3/text/M3PhraseSidecarCatalog.java
          javac --release 21 -Xlint:all -Werror             -cp m3/build/phrase-precompute-current-base/classes             -d m3/build/phrase-precompute-current-base/tests             m3/core/test/M3PhrasePrecomputeTest.java             m3/core/test/M3PhraseSidecarCatalogTest.java
          java -ea -cp m3/build/phrase-precompute-current-base/classes:m3/build/phrase-precompute-current-base/tests M3PhrasePrecomputeTest
          java -ea -cp m3/build/phrase-precompute-current-base/classes:m3/build/phrase-precompute-current-base/tests M3PhraseSidecarCatalogTest
          grep -F 'translate.index-phrases' m3/lexicon/synexia-source-manifest.tsv
          grep -F 'M3PhrasePrecompute.Phrase' m3/lexicon/synexia-precompute-field-map.tsv
          grep -F 'indexed-phrase-rewrite-receiver' m3/runtime-integration/FOSS_REUSE_DECISION.tsv
