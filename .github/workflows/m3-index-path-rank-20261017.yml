# SPDX-License-Identifier: Apache-2.0
name: M3 Indexed Path Rank Java 21 JNI recipe gate
on:
  pull_request:
    paths:
      - 'm3/collections/src/**/M3IndexPathRank*.java'
      - 'm3/collections/qualification/m3-index-path-rank-20261017/**'
      - 'm3/collections/qualification/indexpath-bulk-20261021/**'
      - 'm3/collections/algorithm-catalog/index-path-rank-20261017.tsv'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-index-path-rank-20261017/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-index-path-rank-20261017.yml'
      - 'm3/tooling/migration-recipes/src/test/java/com/synexia/rewrite/M3IndexPathRankRecipeTest.java'
      - '.github/workflows/m3-index-path-rank-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipe-java21-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Inventory historical recipe templates and validate current successor separately
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          python3 m3/collections/qualification/indexpath-bulk-20261021/verify_history.py
          bash m3/collections/qualification/indexpath-bulk-20261021/verify.sh
      - name: Real Maven OpenRewrite LST generation fixed-point and refusal
        run: >
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3IndexPathRankRecipeTest test
      - name: M3 collections JUnit Java21 contract
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3IndexPathRankTest test
      - name: Compile existing JNI mask peer with warnings as errors
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-index-rank"
          mkdir -p "$out/classes" "$out/native"
          javac --release 21 -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/main/java/com/m3/collections/M3IndexPathRank.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexPathRankSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexPathRankNativeSelfTest.java
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$out/native/libm3_collections_pathmask.so"
          java -cp "$out/classes" com.m3.collections.M3IndexPathRankSelfTest
          java -Xcheck:jni -Djava.library.path="$out/native" -cp "$out/classes" \
            com.m3.collections.M3IndexPathRankNativeSelfTest
