# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 monitored IO receiver Java21 host proof
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/java/io/InputStream.java'
      - 'src/java.base/share/classes/java/io/OutputStream.java'
      - 'src/java.base/share/classes/java/io/Reader.java'
      - 'src/java.base/share/classes/java/io/Writer.java'
      - 'test/jdk/java/io/MonitoredIoOperations.java'
      - 'm3/qualification/monitored-io-20261023/**'
      - '.github/workflows/m3jdk21-monitored-io-receiver-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-host-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify JDK21 patched-host regression in normal and interpreter mode
        run: |
          bash -n m3/qualification/monitored-io-20261023/verify-host-patch.sh
          bash m3/qualification/monitored-io-20261023/verify-host-patch.sh
