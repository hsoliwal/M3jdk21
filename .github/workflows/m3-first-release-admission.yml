# SPDX-License-Identifier: Apache-2.0
name: M3 first release admission

on:
  pull_request:
    paths:
      - 'M3-SYNEXIA-NOTICE.md'
      - 'M3-SYNEXIA-RIGHTS.md'
      - 'M3-SYNEXIA-AUTHORS.md'
      - 'm3/**'
      - '.github/workflows/m3-first-release-admission.yml'
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-first-release-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: release contract and provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diff hygiene
        run: git diff --check
      - name: Unit-test the release verifier
        run: python3 -m unittest discover -s m3/release -p 'test_*.py' -v
      - name: Validate release claims and boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/m3-release-proof
          mode=()
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            mode=(--release)
          fi
          python3 m3/release/verify_release_admission.py \
            --root . "${mode[@]}" \
            --json-out target/m3-release-proof/admission.json \
            --sha256-out target/m3-release-proof/SHA256SUMS
          git rev-parse HEAD | tee target/m3-release-proof/HEAD
          git rev-parse 'HEAD^{tree}' | tee target/m3-release-proof/TREE
          git status --porcelain=v1 --untracked-files=no | tee target/m3-release-proof/WORKTREE
          test ! -s target/m3-release-proof/WORKTREE
      - name: Upload contract evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-release-contract-${{ github.sha }}
          path: target/m3-release-proof
          retention-days: 90
          if-no-files-found: error

  foundation:
    name: immutable text foundation
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare exact Java 21 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' \
            -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' \
            '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' \
            "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          echo "M3_JDK=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"
      - name: Verify source-bound recipes
        run: |
          set -euo pipefail
          python3 m3/runtime-integration/char-array-copy/recipe/apply.py --check
          python3 m3/runtime-integration/char-array-copy/recipe/test_recipe.py
          python3 m3/runtime-integration/recipe/apply.py --check
          python3 m3/runtime-integration/recipe/test_recipe.py
      - name: Build and test P0 immutable text foundation
        run: bash ./m3/build.sh
      - name: Verify Synexia compatibility and shared mapping
        run: |
          python3 m3/compatibility/check-synexia.py
          python3 m3/verify-shared-mapping.py

  precompute:
    name: Java and JNI precompute parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Qualify exact UTF8 receiving SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import json, pathlib, shutil, subprocess
          root = pathlib.Path("m3/runtime-integration/utf8-cursor-20261014/recipe")
          metadata = json.loads((root / "canonical-source.json").read_text(encoding="utf-8"))
          assert metadata["repository"] == "hsoliwal/com.synexia"
          assert metadata["receivingProviderGitBlob"] == "2530c533003a8a17d0e782728d98a4dfebe13651"
          assert metadata["phase_advance"] is False and metadata["runtimeApplied"] is False
          assert metadata["receiverCorePath"] == str(root / "canonical")
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD:" + metadata["receiverCorePath"]],
              text=True).strip()
          assert actual == metadata["moduleGitTree"], "canonical receiving core tree drift"
          assert shutil.disk_usage(".").free - (512 << 20) >= (8 << 30), "SDK scratch reserve"
          print("M3_UTF8_RECEIVING_CORE_TREE_EXACT " + actual)
          PY
          python3 -I -S -B m3/runtime-integration/utf8-cursor-20261014/recipe/canonical/verify.py --repository "$GITHUB_WORKSPACE"
          mvn -B -ntp -f m3/runtime-integration/utf8-cursor-20261014/recipe/canonical/pom.xml test
          python3 -I -S -B m3/runtime-integration/utf8-cursor-20261014/recipe/canonical/verify.py --reports --repository "$GITHUB_WORKSPACE"
      - name: Retain exact UTF8 SDK receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-utf8-receiving-sdk-${{ github.sha }}
          path: |
            m3/runtime-integration/utf8-cursor-20261014/recipe/canonical/target/sdk-receipt.json
            m3/runtime-integration/utf8-cursor-20261014/recipe/canonical/target/surefire-reports/TEST-*.xml
          retention-days: 90
          if-no-files-found: error
      - name: Qualify serial String successor repairs with original provider
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path("m3/runtime-integration/string-successor-sdk-20261017")
          metadata = json.loads((root / "canonical-source.json").read_text(encoding="utf-8"))
          assert metadata["repository"] == "hsoliwal/com.synexia"
          assert metadata["commit"] == "4be49026cdbaf277a062fb294c519a80535ad42a"
          assert metadata["moduleGitTree"] == "12902bd47baa70fd524e91addb73541d9eece032"
          assert metadata["openrewriteAdapterGitBlob"] == "1c1b1b568d369f688f6953161636bf36b484bf5a"
          assert metadata["manifestKernelGitBlob"] == "38df5f97bbeec8a8a8cfc77091d56bda925c07f2"
          assert metadata["receiverCorePath"] == str(root / "canonical")
          assert metadata["runtimeApplied"] is False and metadata["phaseAdvanced"] is False
          assert metadata["targetToolingApplied"] is False
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD:" + metadata["receiverCorePath"]],
              text=True).strip()
          assert actual == metadata["moduleGitTree"], "canonical receiving core tree drift"
          pins = (root / "canonical/pins.json").read_bytes()
          assert hashlib.sha256(pins).hexdigest() == "93a14c96379d598daf86d0ecfc12aa58a5464e06defa4158e77d35408919c3bb"
          assert shutil.disk_usage(".").free - (512 << 20) >= (8 << 30), "SDK scratch reserve"
          print("M3_STRING_SUCCESSOR_RECEIVING_CORE_TREE_EXACT " + actual)
          guard = json.loads((root / "workflow-canonical-source.json").read_text(encoding="utf-8"))
          assert guard["repository"] == "hsoliwal/com.synexia"
          assert guard["sourcePath"] == "synexia-openrewrite-recipes/recipes/m3-string-successor-chain-20261014/utf8-chain-sdk-20261017/workflow-sdk"
          assert guard["receiverCorePath"] == str(root / "workflow-canonical")
          assert guard["openrewriteAdapterGitBlob"] == "1c1b1b568d369f688f6953161636bf36b484bf5a"
          assert guard["manifestKernelGitBlob"] == "38df5f97bbeec8a8a8cfc77091d56bda925c07f2"
          assert guard["runtimeApplied"] is False and guard["phaseAdvanced"] is False
          guard_tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD:" + guard["receiverCorePath"]],
              text=True).strip()
          assert guard_tree == guard["moduleGitTree"], "canonical workflow module tree drift"
          print("M3_STRING_WORKFLOW_RECEIVING_CORE_TREE_EXACT " + guard_tree)
          PY
          python3 -I -S -B m3/runtime-integration/string-successor-sdk-20261017/canonical/verify.py
          mvn -B -ntp -f m3/runtime-integration/string-successor-sdk-20261017/canonical/pom.xml test
          python3 -I -S -B m3/runtime-integration/string-successor-sdk-20261017/canonical/verify.py --reports
          python3 -I -S -B m3/runtime-integration/string-successor-sdk-20261017/workflow-canonical/verify.py
          mvn -B -ntp -f m3/runtime-integration/string-successor-sdk-20261017/workflow-canonical/pom.xml test
          python3 -I -S -B m3/runtime-integration/string-successor-sdk-20261017/workflow-canonical/verify.py --reports
      - name: Retain serial String SDK evidence and emitted files
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-string-successor-sdk-${{ github.sha }}
          path: |
            m3/runtime-integration/string-successor-sdk-20261017/canonical/target/sdk-receipt.json
            m3/runtime-integration/string-successor-sdk-20261017/canonical/target/surefire-reports/TEST-*.xml
            m3/runtime-integration/string-successor-sdk-20261017/canonical/target/emitted/
            m3/runtime-integration/string-successor-sdk-20261017/workflow-canonical/target/sdk-receipt.json
            m3/runtime-integration/string-successor-sdk-20261017/workflow-canonical/target/surefire-reports/TEST-*.xml
            m3/runtime-integration/string-successor-sdk-20261017/workflow-canonical/target/emitted/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error
      - name: Java differential proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml test
      - name: JNI/native parity proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative test

      - name: Qualify exact license-fixture whitespace policy SDK
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib, json, pathlib, shutil, subprocess
          root = pathlib.Path("m3/runtime-integration/license-whitespace-sdk-20261017")
          metadata = json.loads((root / "canonical-source.json").read_bytes())
          assert metadata["repository"] == "hsoliwal/com.synexia"
          assert metadata["sourcePath"] == "synexia-openrewrite-recipes/recipes/m3-string-successor-chain-20261014/license-whitespace-sdk-20261017/sdk"
          assert metadata["receiverCorePath"] == str(root / "canonical")
          assert metadata["moduleGitTree"] == "d9f99d9d99ff66ae4afd37f147af66f63da61e55"
          assert metadata["openrewriteAdapterGitBlob"] == "1c1b1b568d369f688f6953161636bf36b484bf5a"
          assert metadata["manifestKernelGitBlob"] == "38df5f97bbeec8a8a8cfc77091d56bda925c07f2"
          assert metadata["runtimeApplied"] is False and metadata["phaseAdvanced"] is False
          assert metadata["pinsSha256"] == "03b940aa136078498dd9cbd6349c0abda59c8c8123d0a7672fb213171fdbc99b"
          actual = subprocess.check_output(
              ["git", "rev-parse", "HEAD:" + metadata["receiverCorePath"]],
              text=True).strip()
          assert actual == metadata["moduleGitTree"], "canonical policy SDK tree drift"
          pins = (root / "canonical/pins.json").read_bytes()
          assert hashlib.sha256(pins).hexdigest() == metadata["pinsSha256"], "canonical policy SDK pins drift"
          assert shutil.disk_usage(".").free - (512 << 20) >= (8 << 30), "SDK scratch reserve"
          print("M3_LICENSE_WHITESPACE_POLICY_RECEIVING_CORE_TREE_EXACT " + actual)
          guard = json.loads((root / "workflow-canonical-source.json").read_bytes())
          assert guard["repository"] == "hsoliwal/com.synexia"
          assert guard["sourcePath"] == "synexia-openrewrite-recipes/recipes/m3-string-successor-chain-20261014/license-whitespace-sdk-20261017/workflow-sdk"
          assert guard["receiverCorePath"] == str(root / "workflow-canonical")
          assert guard["openrewriteAdapterGitBlob"] == "1c1b1b568d369f688f6953161636bf36b484bf5a"
          assert guard["manifestKernelGitBlob"] == "38df5f97bbeec8a8a8cfc77091d56bda925c07f2"
          assert guard["runtimeApplied"] is False and guard["phaseAdvanced"] is False
          guard_tree = subprocess.check_output(
              ["git", "rev-parse", "HEAD:" + guard["receiverCorePath"]],
              text=True).strip()
          assert guard_tree == guard["moduleGitTree"], "canonical qualification workflow SDK tree drift"
          guard_pins = (root / "workflow-canonical/pins.json").read_bytes()
          assert hashlib.sha256(guard_pins).hexdigest() == guard["pinsSha256"], "canonical qualification workflow SDK pins drift"
          print("M3_LICENSE_WHITESPACE_WORKFLOW_RECEIVING_CORE_TREE_EXACT " + guard_tree)
          PY
          python3 -I -S -B m3/runtime-integration/license-whitespace-sdk-20261017/canonical/verify.py
          mvn -B -ntp -f m3/runtime-integration/license-whitespace-sdk-20261017/canonical/pom.xml test
          python3 -I -S -B m3/runtime-integration/license-whitespace-sdk-20261017/canonical/verify.py --reports
          python3 -I -S -B m3/runtime-integration/license-whitespace-sdk-20261017/workflow-canonical/verify.py
          mvn -B -ntp -f m3/runtime-integration/license-whitespace-sdk-20261017/workflow-canonical/pom.xml test
          python3 -I -S -B m3/runtime-integration/license-whitespace-sdk-20261017/workflow-canonical/verify.py --reports
      - name: Retain exact license-fixture whitespace SDK evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-license-whitespace-policy-sdk-${{ github.sha }}
          path: |
            m3/runtime-integration/license-whitespace-sdk-20261017/canonical/target/sdk-receipt.json
            m3/runtime-integration/license-whitespace-sdk-20261017/canonical/target/surefire-reports/TEST-*.xml
            m3/runtime-integration/license-whitespace-sdk-20261017/canonical/target/emitted/
            m3/runtime-integration/license-whitespace-sdk-20261017/workflow-canonical/target/sdk-receipt.json
            m3/runtime-integration/license-whitespace-sdk-20261017/workflow-canonical/target/surefire-reports/TEST-*.xml
            m3/runtime-integration/license-whitespace-sdk-20261017/workflow-canonical/target/emitted/
          retention-days: 90
          include-hidden-files: true
          if-no-files-found: error

  compiler-current-owner-qualification:
    name: sealed compiler recipes and JDK21 contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reserve storage and require preinstalled Temurin JDK 21
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os, pathlib, re
          reserve, cap = 8 * 1024**3, 512 * 1024**2
          for name in ("RUNNER_TEMP", "GITHUB_WORKSPACE"):
              path = pathlib.Path(os.environ[name])
              if not path.is_dir() or path.is_symlink():
                  raise SystemExit("missing or redirected runner storage")
              facts = os.statvfs(path)
              if facts.f_bavail * facts.f_frsize < reserve + cap:
                  raise SystemExit("HOLD_STORAGE: reserve after planned 512 MiB")
          root = pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source = pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          if root.exists() or source.exists():
              raise SystemExit("owned output paths must be fresh")
          for path in (root, source):
              if not path.is_absolute() or any(char.isspace() for char in str(path)):
                  raise SystemExit("invalid explicit output path")
          cache = pathlib.Path(os.environ["RUNNER_TOOL_CACHE"]) / "Java_Temurin-Hotspot_jdk"
          candidates = []
          for version in cache.glob("21.*"):
              jdk = version / "x64"
              if re.fullmatch(r"21\.\d+\.\d+-\d+(?:\.\d+)*", version.name) and (version / "x64.complete").is_file() and all(os.access(jdk / "bin" / tool, os.X_OK) for tool in ("java", "javac")):
                  candidates.append((version.name, jdk))
          if not candidates:
              raise SystemExit("HOLD_TOOLCHAIN: preinstalled Temurin 21 required; no download")
          version, jdk = sorted(candidates)[-1]
          for relative in ("tmp", "home/.m2", "m2", "target", "generated-atom", "cache", "config", "data"):
              (root / relative).mkdir(parents=True, exist_ok=False)
          empty = '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"/>\n'
          for name in ("settings.xml", "global-settings.xml"):
              (root / "home" / ".m2" / name).write_text(empty, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("java-version=" + version.replace("-", "+", 1) + "\n")
              output.write("java-path=" + str(jdk.resolve()) + "\n")
          PY
      - name: Narrow shallow source checkout
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3-bounded-read-source
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/runtime-integration/javac-regex-current-owner-20261017/
            /m3/migration/regex-reconciliation-20261017/
            /m3/docs/name-mapping.schema.json
            /m3/migration/migration.py
            /src/java.base/share/classes/jdk/internal/mindex/M3TQ.java
            /src/java.base/share/classes/jdk/internal/mindex/M3DotStarRelations.java
            /src/java.base/share/classes/jdk/internal/mindex/M3StateRelation.java
            /src/java.base/share/native/libjava/M3StateRelation.c
            /src/java.base/share/native/libjava/m3_state_relation.h
            /src/java.base/share/classes/java/lang/M3StringRegexDp.java
            /test/jdk/java/lang/String/M3StringHierarchicalRegexTest.java
            /m3/docs/name-mapping.json
            /.github/workflows/m3-first-release-admission.yml
            /.gitattributes
      # Sparse checkout is capacity-checked before and after; only Maven is continuously monitored.
      - name: Fresh post-checkout storage gate before JDK settings output
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os, pathlib
          reserve, cap = 8 * 1024**3, 512 * 1024**2
          roots = (pathlib.Path(os.environ["RUNNER_TEMP"]), pathlib.Path(os.environ["M3_SOURCE_ROOT"]))
          def traversal_error(error):
              raise RuntimeError("HOLD_STORAGE: footprint traversal failed") from error
          used = 0
          for folder in roots:
              if not folder.is_dir() or folder.is_symlink():
                  raise SystemExit("HOLD_STORAGE: destination missing or redirected")
              for directory, names, files in os.walk(folder, followlinks=False, onerror=traversal_error):
                  for name in names + files:
                      try:
                          info = os.lstat(pathlib.Path(directory) / name)
                      except FileNotFoundError:
                          continue
                      used += max(info.st_size, info.st_blocks * 512)
          if used > cap:
              raise SystemExit("HOLD_STORAGE: aggregate source/cache/output exceeds 512 MiB")
          for folder in roots:
              facts = os.statvfs(folder)
              if facts.f_bavail * facts.f_frsize < reserve + cap - used:
                  raise SystemExit("HOLD_STORAGE: 8 GiB reserve after remaining output")
          print("Post-checkout aggregate bytes:", used)
          PY
      - name: Select the preinstalled JDK without network or Maven credentials
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''
        with:
          distribution: temurin
          java-version: ${{ steps.preflight.outputs.java-version }}
          java-package: jdk
          architecture: x64
          check-latest: false
          settings-path: ${{ env.M3_PROOF_ROOT }}/home/.m2
          overwrite-settings: false
          token: ''
      - name: Sealed compiler recipes and four-source contracts with storage guard
        shell: bash
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
          EXPECTED_JAVA_HOME: ${{ steps.preflight.outputs.java-path }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os, pathlib, signal, subprocess, time
          reserve, cap = 8 * 1024**3, 512 * 1024**2
          root = pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source = pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          if pathlib.Path(os.environ["JAVA_HOME"]).resolve() != pathlib.Path(os.environ["EXPECTED_JAVA_HOME"]):
              raise SystemExit("unexpected JDK route")
          # Count all job temp, including checkout/setup-java temporary metadata, once.
          roots = (pathlib.Path(os.environ["RUNNER_TEMP"]), source)
          def traversal_error(error):
              raise RuntimeError("HOLD_STORAGE: footprint traversal failed") from error
          def gate():
              used = 0
              for folder in roots:
                  if not folder.is_dir() or folder.is_symlink():
                      raise RuntimeError("HOLD_STORAGE: owned destination missing or redirected")
                  for directory, names, files in os.walk(folder, followlinks=False, onerror=traversal_error):
                      for name in names + files:
                          try:
                              info = os.lstat(pathlib.Path(directory) / name)
                          except FileNotFoundError:
                              continue
                          used += max(info.st_size, info.st_blocks * 512)
              if used > cap:
                  raise RuntimeError("HOLD_STORAGE: aggregate source/cache/output exceeds 512 MiB")
              remaining = cap - used
              for folder in roots:
                  facts = os.statvfs(folder)
                  if facts.f_bavail * facts.f_frsize < reserve + remaining:
                      raise RuntimeError("HOLD_STORAGE: 8 GiB reserve after remaining output")
              return used
          gate()
          env = os.environ.copy()
          env.pop("GITHUB_TOKEN", None)
          env.pop("GH_TOKEN", None)
          env["MAVEN_OPTS"] = "-Xmx512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=" + str(root / "tmp") + " -Duser.home=" + str(root / "home")
          env["MAVEN_USER_HOME"] = str(root / "home" / ".m2")
          env["JAVA_TOOL_OPTIONS"] = "-Dfile.encoding=UTF-8 -Djava.io.tmpdir=" + str(root / "tmp") + " -Duser.home=" + str(root / "home") + " -XX:+PerfDisableSharedMem"
          import hashlib, json, re
          receiving = source / "m3/runtime-integration/javac-regex-current-owner-20261017"
          current = receiving / "current-canonical"
          fixture = receiving / "fixture-canonical"
          context = receiving / "source-context"
          workflow = receiving / "workflow-canonical"
          mapping = source / "m3/migration/regex-reconciliation-20261017/sdk"
          mapping_workflow = receiving / "mapping-workflow-canonical"
          specifications = (
              ("current-canonical-source.json", "current-canonical",
               "d81ce3df2695611b8fb1f4b0670a317c78d81d30",
               "0da95840e225e9e019967a449bd1343bda01085888572d985f6fc54a25927532",
               "ca001a5aaa98c0fb4f849bdee480065ccaec2f66fb250b970bf9a2668a766a7c"),
              ("fixture-canonical-source.json", "fixture-canonical",
               "8b044787430444c4ffd01d6bd0d312356b136ad2",
               "8de03168a897f3001b9f47b5dd18d539303eb60513eb5bc0f74ac0bd0944ba65",
               "b9253a8b08c4ea5fb3983aa58313c8181c2317b22f4145d3c5aa8d5082eee78a"),
          )
          for metadata_name, folder, tree, pins_digest, metadata_digest in specifications:
              data = (receiving / metadata_name).read_bytes()
              if hashlib.sha256(data).hexdigest() != metadata_digest:
                  raise SystemExit("receiving compiler source metadata drift")
              metadata = json.loads(data)
              if metadata["repository"] != "hsoliwal/com.synexia" or metadata["commit"] != "515f2f2153aa6afbc758da34c495c7223ee7997a":
                  raise SystemExit("receiving compiler source revision drift")
              if metadata["runtimeApplied"] is not False or metadata["phaseAdvanced"] is not False:
                  raise SystemExit("receiving compiler metadata cannot advance runtime or phase")
              if metadata["openrewriteAdapterGitBlob"] != "1c1b1b568d369f688f6953161636bf36b484bf5a" or metadata["manifestKernelGitBlob"] != "38df5f97bbeec8a8a8cfc77091d56bda925c07f2":
                  raise SystemExit("receiving compiler provider identity drift")
              if metadata["receiverCorePath"] != "m3/runtime-integration/javac-regex-current-owner-20261017/" + folder or metadata["moduleGitTree"] != tree or metadata["pinsSha256"] != pins_digest:
                  raise SystemExit("receiving compiler module metadata drift")
              actual = subprocess.check_output(["git", "rev-parse", "HEAD:" + metadata["receiverCorePath"]], cwd=source, text=True).strip()
              if actual != tree or hashlib.sha256((receiving / folder / "pins.json").read_bytes()).hexdigest() != pins_digest:
                  raise SystemExit("receiving compiler SDK tree or pins drift")
          context_bytes = (receiving / "source-context.json").read_bytes()
          if hashlib.sha256(context_bytes).hexdigest() != "2514cebccb3d6f907dae29518f32ba30b3e076896f22b551288338c3bcd5290e":
              raise SystemExit("compiler source context manifest drift")
          context_manifest = json.loads(context_bytes)
          context_tree = subprocess.check_output(["git", "rev-parse", "HEAD:m3/runtime-integration/javac-regex-current-owner-20261017/source-context"], cwd=source, text=True).strip()
          if context_tree != "75162bca704fd006ab80c655d65184217e6ecc67" or context_manifest["moduleGitTree"] != context_tree:
              raise SystemExit("compiler source context tree drift")
          def verify_context():
              rows = context_manifest["files"]
              if len(rows) != 17 or len({row["path"] for row in rows}) != 17:
                  raise SystemExit("compiler source context inventory drift")
              expected = {row["path"] for row in rows}
              actual = set()
              for path in context.rglob("*"):
                  if path.is_symlink():
                      raise SystemExit("compiler source context redirect")
                  if path.is_file():
                      actual.add(path.relative_to(context).as_posix())
                      if len(actual) > 17:
                          raise SystemExit("unsealed compiler source context")
              if actual != expected:
                  raise SystemExit("compiler source context file closure drift")
              for row in rows:
                  data = (context / row["path"]).read_bytes()
                  identity = hashlib.sha1(b"blob " + str(len(data)).encode("ascii") + b"\0" + data).hexdigest()
                  if hashlib.sha256(data).hexdigest() != row["sha256"] or identity != row["gitBlob"]:
                      raise SystemExit("compiler source context file drift")
          verify_context()
          # The original workflow SDK remains immutable and executes against its frozen predecessor fixture.
          predecessor_metadata = (receiving / "workflow-canonical-source.json").read_bytes()
          if hashlib.sha256(predecessor_metadata).hexdigest() != "bcf127cea1e729efeae22e1a098f3935c869d8d04218169c7a6bbddc7a75413c":
              raise SystemExit("frozen predecessor workflow SDK metadata drift")
          workflow_metadata = json.loads(predecessor_metadata)
          if workflow_metadata["repository"] != "hsoliwal/com.synexia" or workflow_metadata["sourcePath"] != "synexia-openrewrite-recipes/recipes/m3-javac-regex-hosted-receiving-qualification-20261017/workflow-sdk" or workflow_metadata["receiverCorePath"] != "m3/runtime-integration/javac-regex-current-owner-20261017/workflow-canonical":
              raise SystemExit("compiler workflow SDK source metadata drift")
          if workflow_metadata["runtimeApplied"] is not False or workflow_metadata["phaseAdvanced"] is not False:
              raise SystemExit("compiler workflow SDK cannot advance runtime or phase")
          if workflow_metadata["openrewriteAdapterGitBlob"] != "1c1b1b568d369f688f6953161636bf36b484bf5a" or workflow_metadata["manifestKernelGitBlob"] != "38df5f97bbeec8a8a8cfc77091d56bda925c07f2":
              raise SystemExit("compiler workflow SDK provider identity drift")
          workflow_tree = subprocess.check_output(["git", "rev-parse", "HEAD:" + workflow_metadata["receiverCorePath"]], cwd=source, text=True).strip()
          if workflow_tree != workflow_metadata["moduleGitTree"] or hashlib.sha256((workflow / "pins.json").read_bytes()).hexdigest() != workflow_metadata["pinsSha256"]:
              raise SystemExit("compiler workflow SDK tree or pins drift")
          checked_workflow = source / ".github/workflows/m3-first-release-admission.yml"
          sealed_workflow = workflow / "src/main/resources/com/synexia/rewrite/m3-javac-regex-hosted-receiving-qualification-20261017/out/m3-first-release-admission.yml"
          if hashlib.sha256(sealed_workflow.read_bytes()).hexdigest() != "689f6e970fedc702f8d31c36c840954bfdb0da3ca5e4b38de18dbb78a23fadb2":
              raise SystemExit("frozen predecessor workflow fixture drift")
          mapping_binding = (mapping.parent / "source-binding.json").read_bytes()
          if hashlib.sha256(mapping_binding).hexdigest() != "8c6aa71568828f0ddef6b6ecf0df637c478cb066adb204252bf531477f7e509e":
              raise SystemExit("canonical mapping SDK source binding drift")
          mapping_metadata = json.loads(mapping_binding)
          mapping_tree = subprocess.check_output(["git", "rev-parse", "HEAD:m3/migration/regex-reconciliation-20261017/sdk"], cwd=source, text=True).strip()
          if mapping_tree != "acb7e31ace0871a7a4d1630ff899a19e922a9d52" or mapping_metadata["sdk"]["core"] != mapping_tree:
              raise SystemExit("canonical mapping SDK tree drift")
          if hashlib.sha256((mapping / "pins.json").read_bytes()).hexdigest() != "99e64f97550dfebede86c8d0fabfd3d2de2700a51e3b302af4676b1aeb2c9ab2" or mapping_metadata["sdk"]["pinsSha256"] != "99e64f97550dfebede86c8d0fabfd3d2de2700a51e3b302af4676b1aeb2c9ab2":
              raise SystemExit("canonical mapping SDK pins drift")
          successor_metadata = json.loads((receiving / "mapping-workflow-canonical-source.json").read_bytes())
          if successor_metadata["repository"] != "hsoliwal/com.synexia" or successor_metadata["sourcePath"] != "synexia-openrewrite-recipes/recipes/m3-canonical-mapping-hosted-qualification-20261017/workflow-sdk" or successor_metadata["receiverCorePath"] != "m3/runtime-integration/javac-regex-current-owner-20261017/mapping-workflow-canonical":
              raise SystemExit("mapping workflow SDK source metadata drift")
          if successor_metadata["runtimeApplied"] is not False or successor_metadata["phaseAdvanced"] is not False:
              raise SystemExit("mapping workflow SDK cannot advance runtime or phase")
          if successor_metadata["openrewriteAdapterGitBlob"] != "1c1b1b568d369f688f6953161636bf36b484bf5a" or successor_metadata["manifestKernelGitBlob"] != "38df5f97bbeec8a8a8cfc77091d56bda925c07f2":
              raise SystemExit("mapping workflow SDK provider identity drift")
          successor_tree = subprocess.check_output(["git", "rev-parse", "HEAD:" + successor_metadata["receiverCorePath"]], cwd=source, text=True).strip()
          if successor_tree != successor_metadata["moduleGitTree"] or hashlib.sha256((mapping_workflow / "pins.json").read_bytes()).hexdigest() != successor_metadata["pinsSha256"]:
              raise SystemExit("mapping workflow SDK tree or pins drift")
          successor_workflow = mapping_workflow / "src/main/resources/com/synexia/rewrite/m3-canonical-mapping-hosted-qualification-20261017/out/m3-first-release-admission.yml"
          if hashlib.sha256(checked_workflow.read_bytes()).digest() != hashlib.sha256(successor_workflow.read_bytes()).digest():
              raise SystemExit("checked-out workflow differs from sealed successor recipe output")
          maven = ["mvn", "-B", "-ntp", "-s", str(root / "home" / ".m2" / "settings.xml"), "-gs", str(root / "home" / ".m2" / "global-settings.xml"), "-Dmaven.repo.local=" + str(root / "m2")]
          python = ["python3", "-I", "-S", "-B"]
          commands = [
              python + [str(current / "verify.py"), "--inputs", "--self-test", "--repository", str(context)],
              maven + ["-f", str(current / "pom.xml"), "test"],
              python + [str(current / "verify.py"), "--reports", "--repository", str(context)],
              python + [str(fixture / "verify.py"), "--self-test", "--repository", str(context)],
              maven + ["-f", str(fixture / "pom.xml"), "test"],
              python + [str(fixture / "verify.py"), "--reports", "--repository", str(context)],
              python + [str(workflow / "verify.py")],
              maven + ["-f", str(workflow / "pom.xml"), "test"],
              python + [str(workflow / "verify.py"), "--reports"],
              python + [str(mapping / "verify.py"), "--self-test", "--repository", str(source)],
              maven + ["-f", str(mapping / "pom.xml"), "test"],
              python + [str(mapping / "verify.py"), "--reports", "--repository", str(source)],
              python + [str(mapping_workflow / "verify.py")],
              maven + ["-f", str(mapping_workflow / "pom.xml"), "test"],
              python + [str(mapping_workflow / "verify.py"), "--reports"],
              maven + ["-f", str(context / "synexia-openrewrite-recipes/crates/m3-javac-regex-current-owner-qualification-20261017/pom.xml"), "verify"],
          ]
          child = None
          log = root / "maven.log"
          try:
              with log.open("wb") as output:
                  for owned_command in commands:
                      gate()
                      child = subprocess.Popen(owned_command, cwd=source, env=env, stdin=subprocess.DEVNULL, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                      while child.poll() is None:
                          gate()
                          time.sleep(1)
                      result = child.wait()
                      if result != 0:
                          raise SystemExit(result)
              used = gate()
              print("Aggregate proof footprint bytes:", used)
              if result != 0:
                  raise SystemExit(result)
              verify_context()
              required = (
                  "MIndexJdkConstantRegexCurrentOwnerContract addedChecks=11552 charSequenceComparisons=10800 scope=JDK_CHARSEQUENCE_ONLY PASS",
                  "M3_JAVAC_CURRENT_OWNER_REGEX_JDK21=PASS scope=JDK_ONLY_FOUR_FILE_CONTRACTS",
                  "M3_JAVAC_CURRENT_OWNER_SOURCE_SEALS=PASS owners=6 historicalInputs=6 qualificationOutputs=3 originalCorpus=EXACT",
              )
              observed = {marker: 0 for marker in required}
              matches = []
              plan_counts = []
              with log.open("rt", encoding="utf-8", errors="strict") as logged:
                  for line in logged:
                      line = line.rstrip("\r\n")
                      if line in observed:
                          observed[line] += 1
                      plan_match = re.fullmatch(r"MIndexJdkConstantRegexPlanContract checks=([1-9][0-9]*) PASS", line)
                      if plan_match is not None:
                          plan_counts.append(int(plan_match[1]))
                          if len(plan_counts) > 1:
                              raise SystemExit("ambiguous executed original compiler plan contract")
                      match = re.fullmatch(r"MIndexJavaConstantStringFactsContract checks=([1-9][0-9]*) PASS", line)
                      if match is not None:
                          matches.append(int(match[1]))
                          if len(matches) > 1:
                              raise SystemExit("ambiguous executed compiler facts contract")
              # Four preserved null-replacement cases each have one optional value check.
              # Matcher exception timing determines the observed count within this range.
              if len(plan_counts) != 1 or not 70326 <= plan_counts[0] <= 70330:
                  raise SystemExit("missing or out-of-range executed original compiler plan contract")
              if any(count != 1 for count in observed.values()) or len(matches) != 1:
                  raise SystemExit("missing or ambiguous executed compiler contract marker")
              with log.open("rb") as logged:
                  log_digest = hashlib.file_digest(logged, "sha256").hexdigest()
              receipt = {
                  "schema": "M3_JAVAC_HOSTED_QUALIFICATION_RECEIPT_V1",
                  "ciReportedSha": os.environ.get("GITHUB_SHA", "UNKNOWN"),
                  "checkoutCommit": subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source, text=True).strip(),
                  "sourceCommit": "515f2f2153aa6afbc758da34c495c7223ee7997a",
                  "sourceContextTree": context_tree,
                  "donatedSdkTests": 7, "workflowSdkTests": 2,
                  "mappingSdkTests": 3, "mappingWorkflowSdkTests": 2,
                  "totalSdkTests": 14, "supervisedCommands": 16,
                  "originalPlanCorpusChecks": plan_counts[0], "newContractChecks": 11552,
                  "charSequenceComparisons": 10800,
                  "compilerFactsContractChecks": matches[0],
                  "currentSdkReceiptSha256": hashlib.sha256((current / "target/sdk-receipt.json").read_bytes()).hexdigest(),
                  "fixtureSdkReceiptSha256": hashlib.sha256((fixture / "target/sdk-receipt.json").read_bytes()).hexdigest(),
                  "workflowSdkReceiptSha256": hashlib.sha256((workflow / "target/sdk-receipt.json").read_bytes()).hexdigest(),
                  "mappingSdkReceiptSha256": hashlib.sha256((mapping / "target/sdk-receipt.json").read_bytes()).hexdigest(),
                  "mappingWorkflowSdkReceiptSha256": hashlib.sha256((mapping_workflow / "target/sdk-receipt.json").read_bytes()).hexdigest(),
                  "mappingDonorCommit": "347ac7363aea1e9a7527df64ad62184534089fdf",
                  "mappingSdkTree": mapping_tree, "mappingWorkflowSdkTree": successor_tree,
                  "predecessorWorkflowFixtureSha256": "689f6e970fedc702f8d31c36c840954bfdb0da3ca5e4b38de18dbb78a23fadb2",
                  "wholeMigrationValidator": "NOT_RUN",
                  "logSha256": log_digest,
                  "scope": "DONATED_RECIPE_SDKS_AND_JDK_ONLY_FOUR_SOURCE_CONTRACTS",
                  "modifiedJdkQualified": False, "realMIndexBridgeQualified": False,
                  "jniQualified": False, "runtimeApplied": False, "phaseAdvanced": False,
              }
              (root / "compiler-contract-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n", encoding="utf-8")
              gate()
              print("PASS donated compiler SDK7 plus workflow SDK2 and JDK-only four-source contracts")
              print("PASS canonical mapping SDK3 plus successor workflow SDK2; combined SDK14 supervisedCommands16")
              print("NOT_RUN real MIndex bridge, modified JDK/JNI/runtime/performance; phase remains unchanged")
          except BaseException:
              if child is not None and child.poll() is None:
                  try:
                      os.killpg(child.pid, signal.SIGTERM)
                  except ProcessLookupError:
                      pass
                  try:
                      child.wait(timeout=2)
                  except subprocess.TimeoutExpired:
                      try:
                          os.killpg(child.pid, signal.SIGKILL)
                      except ProcessLookupError:
                          pass
                      child.wait()
              raise
          finally:
              if log.exists():
                  with log.open("rb") as output:
                      output.seek(max(0, log.stat().st_size - 32768))
                      print(output.read(32768).decode("utf-8", errors="replace"))
          PY
      - name: Retain exact compiler SDK and contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-javac-current-owner-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/current-canonical/target/sdk-receipt.json
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/current-canonical/target/surefire-reports/TEST-*.xml
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/current-canonical/target/emitted/
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/fixture-canonical/target/sdk-receipt.json
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/fixture-canonical/target/surefire-reports/TEST-*.xml
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/fixture-canonical/target/emitted/
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/workflow-canonical/target/sdk-receipt.json
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/workflow-canonical/target/surefire-reports/TEST-*.xml
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/workflow-canonical/target/emitted/
            m3-bounded-read-source/m3/migration/regex-reconciliation-20261017/sdk/target/sdk-receipt.json
            m3-bounded-read-source/m3/migration/regex-reconciliation-20261017/sdk/target/surefire-reports/TEST-*.xml
            m3-bounded-read-source/m3/migration/regex-reconciliation-20261017/sdk/target/emitted/
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/mapping-workflow-canonical/target/sdk-receipt.json
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/mapping-workflow-canonical/target/surefire-reports/TEST-*.xml
            m3-bounded-read-source/m3/runtime-integration/javac-regex-current-owner-20261017/mapping-workflow-canonical/target/emitted/
            ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/maven.log
            ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/compiler-contract-receipt.json
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: error

  control-reactor:
    name: M3 control reactor
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Full M3 Maven verification
        run: mvn -B -ntp -fae -f m3/pom.xml clean verify
      - name: Full-family and receiving-policy verification
        run: |
          if test -f m3/compatibility/check_synexia_full_family.py; then
            python3 m3/compatibility/check_synexia_full_family.py
            python3 -m unittest -v m3/compatibility/test_synexia_full_family.py
          fi

  release-proof-summary:
    name: proof summary
    needs:
      - contract
      - foundation
      - precompute
      - control-reactor
      - compiler-current-owner-qualification
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Summarize release admission
        shell: bash
        run: |
          {
            echo '## M3JDK21 first-release admission'
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| contract/provenance | ${{ needs.contract.result }} |"
            echo "| immutable text foundation | ${{ needs.foundation.result }} |"
            echo "| Java + JNI precompute parity | ${{ needs.precompute.result }} |"
            echo "| M3 control reactor | ${{ needs.control-reactor.result }} |"
            echo "| sealed compiler recipes and JDK21 contracts | ${{ needs.compiler-current-owner-qualification.result }} |"
            echo
            echo 'The existing OpenJDK GHA sanity workflow remains the product-build/platform matrix.'
            echo 'A passing proof summary does not upgrade any claim marked NOT_CLAIMED in release-contract.json.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any mandatory M3 gate failed
        if: >
          needs.contract.result != 'success' ||
          needs.foundation.result != 'success' ||
          needs.precompute.result != 'success' ||
          needs.control-reactor.result != 'success'
          || needs.compiler-current-owner-qualification.result != 'success'
        run: exit 1
