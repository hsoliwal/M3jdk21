# SPDX-License-Identifier: Apache-2.0
name: M3 first release admission

on:
  pull_request:
    paths:
      - 'M3-SYNEXIA-NOTICE.md'
      - 'M3-SYNEXIA-RIGHTS.md'
      - 'M3-SYNEXIA-AUTHORS.md'
      - 'm3/**'
      - '.github/workflows/m3-first-release-admission.yml'
  push:
    # master: development-mode receipt per landed commit
    # (release-contract.json execution_evidence.require_exact_commit_and_tree).
    # release/**: --release mode at the single fork commit.
    # main.yml keeps branches-ignore: master; this is the release gate, not the build.
    branches:
      - 'master'
      - 'release/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: release contract and provenance
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diff hygiene
        run: git diff --check
      - name: Unit-test the release verifier
        run: python3 -m unittest discover -s m3/release -p 'test_*.py' -v
      - name: Validate release claims and boundaries
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/release/queue/current
          mode=()
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            mode=(--release)
          fi
          python3 m3/release/verify_release_admission.py \
            --root . "${mode[@]}" \
            --json-out m3/release/queue/current/admission.json \
            --queue-out m3/release/queue/current/README.md \
            --sha256-out m3/release/queue/current/SHA256SUMS
          git rev-parse HEAD | tee m3/release/queue/current/HEAD
          git rev-parse 'HEAD^{tree}' | tee m3/release/queue/current/TREE
          git status --porcelain=v1 --untracked-files=no | tee m3/release/queue/current/WORKTREE
          test ! -s m3/release/queue/current/WORKTREE
      - name: Export canonical naming and retained source queues
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/release/queue/current
          python3 m3/tooling/name-contract/check.py | tee m3/release/queue/current/name-check.txt
          python3 m3/tooling/name-contract/audit.py > m3/release/queue/current/name-census.tsv
          queue_mode=()
          if [[ "${GITHUB_REF}" == refs/heads/release/* ]]; then
            queue_mode=(--strict)
          fi
          python3 m3/release/retained_source_queue.py --root . \
            --tsv-out m3/release/queue/current/retained-source-queue.tsv \
            --summary-out m3/release/queue/current/retained-source-summary.json \
            "${queue_mode[@]}"
      - name: Show retained-source review queue
        if: always()
        shell: bash
        run: |
          if test -f m3/release/queue/current/retained-source-summary.json; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          info = json.loads(Path('m3/release/queue/current/retained-source-summary.json').read_text(encoding='utf-8'))
          print('## M3JDK21 archived-source review queue')
          print()
          print('Exact HEAD: `' + info['tree_head'] + '`')
          print()
          print('| Source path disposition | Number of rows |')
          print('| --- | ---: |')
          for state, total in sorted(info['states'].items()):
              print('| ' + state + ' | ' + str(total) + ' |')
          print('| **Review required** | **' + str(info['unresolved_rows']) + '** |')
          print()
          print('Full original paths, PR numbers, Git blob identities and modes are in the uploaded TSV and JSON artifacts.')
          print('Path equality is not API, compiler, JNI or runtime acceptance; no automatic merge is authorized.')
          PY
          fi
      - name: Expose intermediate release queue
        if: always()
        shell: bash
        run: |
          if test -f m3/release/queue/current/README.md; then
            cat m3/release/queue/current/README.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-release-contract-${{ github.sha }}
          path: m3/release/queue/current
          retention-days: 90
          if-no-files-found: error

  foundation:
    name: immutable text foundation
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare exact Java 21 compiler
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' \
            -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' \
            '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' \
            "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          echo "M3_JDK=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"
      - name: Build and test P0 immutable text foundation
        run: bash ./m3/build.sh
      - name: Verify Synexia compatibility and shared mapping
        run: |
          python3 m3/compatibility/check-synexia.py
          python3 m3/verify-shared-mapping.py

  precompute:
    name: Java and JNI precompute parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Java differential proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml test
      - name: JNI/native parity proof
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative test

  control-reactor:
    name: canonical Synexia Maven evidence
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Require executed Synexia recipe evidence
        shell: bash
        run: |
          set -euo pipefail
          # Historical target-local recipes remain inventoried source, never execution authority.
          # This read-only consumer requires the same mandatory Maven gate; missing proof fails.
          python3 - <<'PYCODE'
          import importlib.util
          import json
          from pathlib import Path
          path = Path('m3/release/verify_release_admission.py')
          spec = importlib.util.spec_from_file_location('release_admission', path)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          result = module.validate(Path('.'))
          name = 'gate:M3_MAVEN_CONTROL_REACTOR'
          checks = [check for check in result['checks'] if check['name'] == name]
          print(json.dumps({'source_commit': result['source_commit'],
                            'canonical_maven_gate': checks}, sort_keys=True))
          if not result['policy_valid'] or len(checks) != 1 or checks[0]['status'] != 'PASS':
              raise SystemExit('HOLD: execute and qualify source-bound recipes in hsoliwal/com.synexia; attach the exact command, source pins and raw artifact hashes.')
          PYCODE
      - name: Full-family and receiving-policy verification
        if: always()
        run: |
          if test -f m3/compatibility/check_synexia_full_family.py; then
            python3 m3/compatibility/check_synexia_full_family.py
            python3 -m unittest -v m3/compatibility/test_synexia_full_family.py
          fi

  release-proof-summary:
    name: proof summary
    needs:
      - contract
      - foundation
      - precompute
      - control-reactor
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - name: Summarize release admission
        shell: bash
        run: |
          {
            echo '## M3JDK21 first-release admission'
            echo
            echo "| Gate | Result |"
            echo "| --- | --- |"
            echo "| contract/provenance | ${{ needs.contract.result }} |"
            echo "| immutable text foundation | ${{ needs.foundation.result }} |"
            echo "| Java + JNI precompute parity | ${{ needs.precompute.result }} |"
            echo "| canonical Synexia Maven evidence | ${{ needs.control-reactor.result }} |"
            echo
            echo 'The existing OpenJDK GHA sanity workflow remains the product-build/platform matrix.'
            echo 'A passing proof summary does not upgrade any claim marked NOT_CLAIMED in release-contract.json.'
            echo 'Historical recipe sources remain migration debt; this workflow never runs their target-local executors.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail if any mandatory M3 gate failed
        if: >
          needs.contract.result != 'success' ||
          needs.foundation.result != 'success' ||
          needs.precompute.result != 'success' ||
          needs.control-reactor.result != 'success'
        run: exit 1
