name: M3 statehist adaptive mask Java21
# Former triggers (below, as of the move) now start job(s) 'm3-statehist-adaptive-master-20261021__*' in
# .github/workflows/checks-superset-08.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     push:
#       branches: [m3/statehist-adaptive-maskcount-master-20261021]
#     pull_request:
#       paths:
#         - src/jdk.m3.collections/share/classes/jdk/m3/collections/M3StateMaskHistogram.java
#         - test/jdk/jdk/m3/collections/M3StateMaskAdaptiveCountContract.java
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exhaustive-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict compilation of original Java histogram and mask owners
        run: |
          mkdir -p build/statehist
          javac --release 21 -Xlint:all -Werror -proc:none -d build/statehist \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3StateMaskHistogram.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexMaskCompactor.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexPathMasks.java \
            test/jdk/jdk/m3/collections/M3StateMaskAdaptiveCountContract.java
      - name: Real array offset bit mask and native availability oracle
        run: |
          java -ea -Xcheck:jni -cp build/statehist \
            jdk.m3.collections.M3StateMaskAdaptiveCountContract
      - name: Interpreter oracle
        run: |
          java -Xint -ea -cp build/statehist \
            jdk.m3.collections.M3StateMaskAdaptiveCountContract
