# SPDX-License-Identifier: Apache-2.0
name: M3 statehist adaptive mask Java21
on:
  push:
    branches: [m3/statehist-adaptive-maskcount-master-20261021]
  pull_request:
    paths:
      - m3/collections/src/main/java/com/m3/collections/M3StateMaskHistogram.java
      - m3/collections/src/test/java/com/m3/collections/M3StateMaskAdaptiveCountContract.java
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exhaustive-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict compilation of original Java histogram and mask owners
        run: |
          mkdir -p build/statehist
          javac --release 21 -Xlint:all -Werror -proc:none -d build/statehist \
            m3/collections/src/main/java/com/m3/collections/M3StateMaskHistogram.java \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/test/java/com/m3/collections/M3StateMaskAdaptiveCountContract.java
      - name: Real array offset bit mask and native availability oracle
        run: |
          java -ea -Xcheck:jni -cp build/statehist \
            com.m3.collections.M3StateMaskAdaptiveCountContract
      - name: Interpreter oracle
        run: |
          java -Xint -ea -cp build/statehist \
            com.m3.collections.M3StateMaskAdaptiveCountContract
