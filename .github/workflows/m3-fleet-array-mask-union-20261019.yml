# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 fleet array and JNI mask union
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IntIntHashMap.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3FleetArrayMaskUnion*.java'
      - 'm3/collections/qualification/fleet-array-mask-union-20261019/**'
      - '.github/workflows/m3-fleet-array-mask-union-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-owner-java-jni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source-seal and file drift admission
        run: |
          set -euo pipefail
          sha256sum --check m3/collections/qualification/fleet-array-mask-union-20261019/SOURCE_SEALS.sha256
      - name: Compile source owner and exercise deterministic Java oracle
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3fleet"
          mkdir -p "$OUT/classes" "$OUT/native"
          SRC=m3/collections/src/main/java/com/m3/collections
          TEST=m3/collections/src/test/java/com/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror -d "$OUT/classes"             "$SRC/M3IntIntHashMap.java" "$SRC/M3IntIterator.java"             "$SRC/M3IntIntConsumer.java" "$SRC/M3IndexMaskCompactor.java"             "$TEST/M3FleetArrayMaskUnionSelfTest.java"
          java -ea -cp "$OUT/classes" com.m3.collections.M3FleetArrayMaskUnionSelfTest
      - name: Compile existing native JNI and verify exact int/long windows
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3fleet"
          cc -std=c17 -O2 -fPIC -shared -Wall -Wextra -Wconversion -Wshadow -Werror             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_mask_compactor.c             -o "$OUT/native/libm3_collections_mask.so"
          java -ea -Xcheck:jni -Djava.library.path="$OUT/native" -cp "$OUT/classes"             com.m3.collections.M3FleetArrayMaskUnionSelfTest --native
      - name: Exercise existing immutable filtered-sorted snapshot regression
        run: mvn -B -ntp -f m3/collections/pom.xml           -Dtest=M3PackedFilterTest,M3FleetArrayMaskUnionTest test
