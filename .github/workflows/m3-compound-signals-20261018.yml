name: M3 Compound Signals Java21 JNI
# Former triggers (below, as of the move) now start job(s) 'm3-compound-signals-20261018__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SignalDimensions.java'
#         - 'test/jdk/jdk/m3/collections/M3SignalDimensions*.java'
#         - 'm3/collections/qualification/compound-signals-20261018/**'
#         - '.github/workflows/m3-compound-signals-20261018.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source seal and Java 21/JNI parity
        shell: bash
        run: bash m3/collections/qualification/compound-signals-20261018/verify.sh

  module-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual M3 collections Maven JUnit
        shell: bash
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3SignalDimensionsTest test
