name: M3 Compound Signals Java21 JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalDimensions.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalDimensions*.java'
      - 'm3/collections/qualification/compound-signals-20261018/**'
      - '.github/workflows/m3-compound-signals-20261018.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source seal and Java 21/JNI parity
        shell: bash
        run: bash m3/collections/qualification/compound-signals-20261018/verify.sh

  module-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual M3 collections Maven JUnit
        shell: bash
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3SignalDimensionsTest test
