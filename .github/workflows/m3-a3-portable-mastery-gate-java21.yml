name: M3 A3 portable mastery gate Java 21

on:
  push:
    branches:
      - 'm3/a3-portable-mastery-gate-20261007'
    paths:
      - 'm3/tooling/a3/**'
      - 'm3/tooling/migration-recipes/src/main/java/jdk/m3/rewrite/backport/M3Jdk21HashPinnedSnapshotRecipe.java'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-*.yml'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/m3-a3-*/**'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text/m3-a3-*/**'
      - 'm3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/backport/M3A3*.java'
      - '.github/workflows/m3-a3-portable-mastery-gate-java21.yml'
  pull_request:
    paths:
      - 'm3/tooling/a3/**'
      - 'm3/tooling/migration-recipes/src/main/java/jdk/m3/rewrite/backport/M3Jdk21HashPinnedSnapshotRecipe.java'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-*.yml'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/m3-a3-*/**'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text/m3-a3-*/**'
      - 'm3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/backport/M3A3*.java'
      - '.github/workflows/m3-a3-portable-mastery-gate-java21.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout M3JDK21 candidate
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 1 diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "$BASE_SHA...HEAD"

      # Standalone (2026-10-31): the slim A3 export is absorbed (m3/vendor/m3/README.md);
      # the reactor module tooling/m3jdk-a3-recipes builds it into the same coordinate and its
      # test verifies the absorbed bytes. No other repository is fetched
      # (m3/tooling/standalone/M3_REFS.tsv).
      - name: 2 build the absorbed slim A3 artifact
        shell: bash
        run: |
          set -euo pipefail
          bash m3/m3-import/pure-int-recipe-custody/install.sh "$PWD"
          mvn -B -ntp -f m3/pom.xml -pl tooling/m3jdk-a3-recipes clean install


      - name: 4 compile and test A3 mastery receiver
        run: >
          mvn -B -ntp
          -f m3/pom.xml
          -pl tooling/a3
          -am
          -Dtest=A3RecipeHomeTest,A3MasteryTest,A3ApplyTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
