# SPDX-License-Identifier: Apache-2.0
name: M3 direct generic Deque and PriorityQueue Java JNI
on:
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/M3ArrayDeque.java"
      - "m3/collections/src/main/java/com/m3/collections/M3PriorityQueue.java"
      - "m3/collections/src/test/java/com/m3/collections/M3GenericReferenceOwners*.java"
      - "m3/collections/qualification/direct-generic-deque-heap-20261018/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-native-generic-deque-priority-20261018/**"
      - ".github/workflows/m3-direct-generic-deque-heap-20261018.yml"
  push:
    branches: [m3/direct-generic-array-deque-heap-receiver-20261018]
permissions:
  contents: read
jobs:
  actual-core-recipe-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact canonical Java/source/native custody
        shell: bash
        run: |
          set -euxo pipefail
          python3 -S m3/collections/qualification/direct-generic-deque-heap-20261018/verify.py
      - name: Real Maven/OpenRewrite Java LST recipe and fixed point/refusal
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/qualification/direct-generic-deque-heap-20261018/recipe/pom.xml test
      - name: Strict full current M3 core compile and JDK contract
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z | \
            xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          javac --release 21 -proc:none -Xlint:all -Werror -cp proof/classes -d proof/classes \
            m3/collections/src/test/java/com/m3/collections/M3GenericReferenceOwnersProof.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          java -Xmx256m -cp proof/classes com.m3.collections.M3GenericReferenceOwnersProof | tee proof/java-default.log
          java -Xint -Xmx256m -cp proof/classes com.m3.collections.M3GenericReferenceOwnersProof | tee proof/java-interpreted.log
          grep -q 'PASS M3GenericReferenceOwnersProof' proof/java-default.log
      - name: Compile original C17 JNI and check loaded native parity
        shell: bash
        run: |
          set -euxo pipefail
          javac --release 21 -proc:none -h proof/native -cp proof/classes -d proof/classes \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native | tee proof/native-mask.log
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3GenericReferenceOwnersProof --native | tee proof/native-direct.log
          grep -q 'native=true' proof/native-direct.log
          python3 -S m3/collections/qualification/direct-generic-deque-heap-20261018/verify.py
          git diff --exit-code
      - name: Retain test and native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-generic-deque-heap-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 14
          path: |
            proof/
            m3/collections/qualification/direct-generic-deque-heap-20261018/recipe/target/surefire-reports/
