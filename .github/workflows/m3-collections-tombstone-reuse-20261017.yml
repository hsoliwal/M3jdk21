name: M3 tombstone reuse Java21 receiver
# Former triggers (below, as of the move) now start job(s) 'm3-collections-tombstone-reuse-20261017__*' in
# .github/workflows/checks-superset-08.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongHashSet.java'
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongLongHashMap.java'
#         - 'test/jdk/jdk/m3/collections/M3TombstoneReuse*.java'
#         - 'm3/collections/verification/tombstone-reuse-20261017/**'
#         - '.github/workflows/m3-collections-tombstone-reuse-20261017.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch hygiene
        run: git diff --check origin/master...HEAD
      - name: Source sealed Java21 differential and fixed point
        run: python3 m3/collections/verification/tombstone-reuse-20261017/verify.py
      - name: Maven contract tests
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3TombstoneReuseTest test
