# SPDX-License-Identifier: Apache-2.0
name: M3 tombstone reuse Java21 receiver
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongHashSet.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongLongHashMap.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3TombstoneReuse*.java'
      - 'm3/collections/verification/tombstone-reuse-20261017/**'
      - '.github/workflows/m3-collections-tombstone-reuse-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Patch hygiene
        run: git diff --check origin/master...HEAD
      - name: Source sealed Java21 differential and fixed point
        run: python3 m3/collections/verification/tombstone-reuse-20261017/verify.py
      - name: Maven contract tests
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3TombstoneReuseTest test
