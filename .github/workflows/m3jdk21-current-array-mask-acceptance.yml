name: M3JDK21 current collection array-mask acceptance
# Former triggers (below, as of the move) now start job(s) 'm3jdk21-current-array-mask-acceptance__*' in
# .github/workflows/checks-superset-09.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3ArrayList.java'
#         - 'test/jdk/jdk/m3/collections/M3ArrayListShortWordMaskContract.java'
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexMaskWindow.java'
#         - 'src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_window.c'
#         - 'src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_compactor.c'
#         - 'test/jdk/jdk/m3/collections/M3BudgetedMaskWindowContract.java'
#         - 'm3/arrays/pom.xml'
#         - 'm3/collections/pom.xml'
#         - '.github/workflows/m3jdk21-current-array-mask-acceptance.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-master-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            src/jdk.m3.collections/share/**
            make/m3/arrays/**
            test/jdk/jdk/m3/arrays/**
            m3/collections/**
            test/jdk/jdk/m3/collections/**
            test/jdk/jdk/internal/m3/collections/**
            m3/native/include/**
            .github/workflows/m3jdk21-current-array-mask-acceptance.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build actual M3 arrays and their JNI library, including tests
        run: |
          cmake -S make/m3/arrays -B m3/arrays/target/native \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON "-DJAVA_HOME=$JAVA_HOME"
          cmake --build m3/arrays/target/native --config Release --parallel 2
          ctest --test-dir m3/arrays/target/native --output-on-failure -C Release --no-tests=error
          test -s m3/arrays/target/native/libm3_arrays.so
          mvn -B -ntp -f m3/arrays/pom.xml -Dm3.arrays.native.required=true \
            "-DargLine=-Xcheck:jni -Dm3.arrays.native.path=$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so" install
      - name: Build and run all available Maven collection tests
        run: mvn -B -ntp -f m3/collections/pom.xml "-Dm3.arrays.native.path=$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so" test
      - name: Executable array-backed list identity, stable order and fail-fast checks
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            jdk.m3.collections.M3ArrayListShortWordMaskContract
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            jdk.m3.collections.M3ArrayListRemoveIfProof
      - name: Executable bounded mask window Java parity
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            jdk.m3.collections.BudgetedMaskWindowContract
      - name: Build unchanged JNI selector against matching Java 21 headers
        run: |
          gcc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_compactor.c \
            src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Executable JNI mask parity and bounded cursor contract
        run: |
          java -ea -Djava.library.path="$RUNNER_TEMP" \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            jdk.m3.collections.BudgetedMaskWindowContract --native
