name: M3JDK21 current collection array-mask acceptance
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ArrayList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ArrayListShortWordMaskContract.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexMaskWindow.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_window.c'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3BudgetedMaskWindowContract.java'
      - 'm3/arrays/pom.xml'
      - 'm3/collections/pom.xml'
      - '.github/workflows/m3jdk21-current-array-mask-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-master-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            m3/collections/**
            .github/workflows/m3jdk21-current-array-mask-acceptance.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build actual M3 arrays, including tests
        run: mvn -B -ntp -f m3/arrays/pom.xml install
      - name: Build and run all available Maven collection tests
        run: mvn -B -ntp -f m3/collections/pom.xml test
      - name: Executable array-backed list identity, stable order and fail-fast checks
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListShortWordMaskContract
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListRemoveIfProof
      - name: Executable bounded mask window Java parity
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3BudgetedMaskWindowContract
      - name: Build unchanged JNI selector against matching Java 21 headers
        run: |
          gcc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Executable JNI mask parity and bounded cursor contract
        run: |
          java -ea -Djava.library.path="$RUNNER_TEMP" \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3BudgetedMaskWindowContract --native
