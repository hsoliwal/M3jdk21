name: M3 indexed 28-bit bitmap successor Java21 JNI receiver
# Former triggers (below, as of the move) now start job(s) 'm3-bitlane-indexed-navigation-20261017__*' in
# .github/workflows/checks-superset-09.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     push:
#       branches:
#         - m3/bitlane-indexed-navigation-receiver-20261017
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3BitLane28.java'
#         - 'test/jdk/jdk/m3/collections/M3BitLaneJumpProof.java'
#         - 'test/jdk/jdk/m3/collections/native/m3_bitlane_jump_jni.c'
#         - 'm3/collections/qualification/bitlane-indexed-navigation-20261017/**'
#         - '.github/workflows/m3-bitlane-indexed-navigation-20261017.yml'
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3BitLane28.java'
#         - 'test/jdk/jdk/m3/collections/M3BitLaneJumpProof.java'
#         - 'test/jdk/jdk/m3/collections/native/m3_bitlane_jump_jni.c'
#         - 'm3/collections/qualification/bitlane-indexed-navigation-20261017/**'
#         - '.github/workflows/m3-bitlane-indexed-navigation-20261017.yml'
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-product-java-jni:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            m3/collections
            src/jdk.m3.collections/share
            test/jdk/jdk/m3/collections
            test/jdk/jdk/internal/m3/collections
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact SHA-256 and public descriptors, Java21 tiered and interpreter oracles
        run: python3 m3/collections/qualification/bitlane-indexed-navigation-20261017/verify.py
      - name: Strict C17 UBSan and checked JNI differential (test-only native)
        run: python3 m3/collections/qualification/bitlane-indexed-navigation-20261017/verify.py --jni
      - name: No file mutations from source verification
        run: git diff --exit-code -- m3/collections
  owning-maven-module:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            m3/collections
            src/jdk.m3.collections/share
            test/jdk/jdk/m3/collections
            test/jdk/jdk/internal/m3/collections
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Existing complete M3 collection module tests
        run: mvn -B -ntp -f m3/collections/pom.xml test
