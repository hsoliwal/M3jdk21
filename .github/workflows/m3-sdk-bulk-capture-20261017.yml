name: M3 SDK bulk capture source-sealed Java21
on:
  push:
    branches: [m3/sdk-bulk-capture-20261017]
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3MutableFilteredViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3BulkCaptureContract.java'
      - 'm3/collections/qualification/sdk-bulk-capture-20261017/**'
      - '.github/workflows/m3-sdk-bulk-capture-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipe-and-real-java-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Canonical postimage, refusal and Maven recipe fixed point
        run: mvn -B -ntp -f m3/collections/qualification/sdk-bulk-capture-20261017/recipe/pom.xml verify
      - name: Strict Java21 owning source and hostile TreeSet/TreeMap differential oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3sdk"
          javac --release 21 -Xlint:all -Werror -proc:none -d "$RUNNER_TEMP/m3sdk" \
            m3/collections/src/main/java/com/m3/collections/M3MutableFilteredViews.java \
            m3/collections/src/test/java/com/m3/collections/M3BulkCaptureContract.java
          java -ea -cp "$RUNNER_TEMP/m3sdk" com.m3.collections.M3BulkCaptureContract
      - name: Owning Maven compile gate (not full JDK or JNI admission)
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests compile
