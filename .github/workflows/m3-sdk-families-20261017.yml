# SPDX-License-Identifier: Apache-2.0
name: M3 SDK cross-library names and filtered/sorted receivers
on:
  pull_request:
    paths:
      - 'm3/collections/qualification/m3-sdk-families-20261017/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionSdk*.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3CollectionSdk*.java'
      - '.github/workflows/m3-sdk-families-20261017.yml'
  workflow_dispatch:
jobs:
  sdk-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Maven verify source-sealed catalogue generator
        run: |
          set -eu
          RECIPE=m3/collections/qualification/m3-sdk-families-20261017/recipe
          mvn -B -ntp -f "$RECIPE/pom.xml" verify
          java -cp "$RECIPE/target/classes" com.synexia.m3.M3CollectionSdkNamesRecipe --check .
      - name: Compile strict Java21 SDK catalogue and optional primitive/JDK adapters
        run: |
          set -eu
          OUT="$RUNNER_TEMP/m3-sdk/classes"
          mkdir -p "$OUT"
          PKG=m3/collections/src/main/java/com/m3/collections
          TEST=m3/collections/src/test/java/com/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror -d "$OUT" \
            "$PKG/M3CollectionSdkCatalog.java" "$TEST/M3CollectionSdkCatalogSelfTest.java"
          java -cp "$OUT" com.m3.collections.M3CollectionSdkCatalogSelfTest
          javac --release 21 -proc:none -Xlint:all -Werror -cp "$OUT" -d "$OUT" \
            "$PKG/M3LongIterator.java" "$PKG/M3LongCollection.java" \
            "$PKG/M3IndexMaskCompactor.java" "$PKG/M3LongIndexProjection.java" \
            "$PKG/M3LongBitmapFilteredSnapshot.java" \
            "$PKG/M3FilteredLists.java" "$PKG/M3FilteredViews.java" \
            "$PKG/M3CollectionSdk.java" "$TEST/M3CollectionSdkSelfTest.java"
          java -cp "$OUT" com.m3.collections.M3CollectionSdkSelfTest
      - name: Existing C17 JNI selector parity (no new native symbols)
        run: |
          set -eu
          OUT="$RUNNER_TEMP/m3-sdk/classes"
          BIN="$RUNNER_TEMP/m3-sdk/native"
          mkdir -p "$BIN"
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$BIN/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$BIN" -cp "$OUT" \
            com.m3.collections.M3CollectionSdkSelfTest
      - name: Owning module compilation and JUnit tests (must be green for promotion)
        run: mvn -B -ntp -f m3/collections/pom.xml test
