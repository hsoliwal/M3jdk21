name: M3 counted canonical entry replay
on:
  push:
    branches: [aix/m3-counted-continuation-20261016]
  pull_request:
    paths:
      - 'm3/collections/counts/canonical-entry/**'
      - '.github/workflows/m3-counted-canonical-replay.yml'
permissions:
  contents: read
concurrency:
  group: m3-counted-entry-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  identical-canonical-entry:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            m3/collections/counts/canonical-entry
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify canonical entry byte identities and execute Maven reuse
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          { git rev-parse HEAD; uname -m; java -version 2>&1; mvn -version; } > proof/identity.txt
          ENTRY=m3/collections/counts/canonical-entry
          test "$(git hash-object "$ENTRY/pom.xml")" = 61b21b44d57cd37003ab5f961fcb48a013d96e91
          test "$(git hash-object "$ENTRY/lock.json")" = 9504088ee0a61feddcae6c090093552be209952c
          test "$(git hash-object "$ENTRY/replay.py")" = bf0e46b9e33b6e34a193e940c5db022a45442fe6
          mvn -B -ntp -f "$ENTRY/pom.xml" verify 2>&1 | tee proof/canonical-entry.log
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3-counted-canonical-entry-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/counts/canonical-entry/target/receiver-replay/evidence/
