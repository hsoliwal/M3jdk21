# SPDX-License-Identifier: Apache-2.0
name: M3 modified UTF-8 runtime owner fan-in
# Former triggers (below, as of the move) now start job(s) 'm3-runtime-mutf8-fanin-proof__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/runtime-integration/recipe/**'
#         - '.github/workflows/m3-runtime-mutf8-fanin-proof.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-and-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check exact recipe syntax
        run: python3 -m py_compile m3/runtime-integration/recipe/apply.py m3/runtime-integration/recipe/test_recipe.py
