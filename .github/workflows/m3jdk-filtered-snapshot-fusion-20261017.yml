# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 additive filtered snapshot fusion Java21 OpenRewrite JNI

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionViews.java'
      - 'm3/collections/wrappers/src/test/java/com/m3/collections/M3FilteredSnapshotFusion*.java'
      - 'm3/collections/wrappers/src/test/java/com/m3/collections/M3MapCursorNativeProof.java'
      - 'm3/collections/wrappers/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-filtered-snapshot-fusion-20261017/**'
      - 'm3/collections/wrappers/recipe/src/main/resources/META-INF/rewrite/m3-filtered-snapshot-fusion-20261017.yml'
      - 'm3/collections/wrappers/recipe/src/test/java/com/synexia/rewrite/M3FilteredSnapshotFusionReceiverRecipeTest.java'
      - 'm3/collections/wrappers/snapshot-fusion-20261017/**'
      - '.github/workflows/m3jdk-filtered-snapshot-fusion-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-jni-snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Source/postimage SHA256 check before runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path("m3/collections/wrappers/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-filtered-snapshot-fusion-20261017")
          rows=[line.split("\t") for line in (root/"manifest.tsv").read_text().splitlines() if line]
          assert len(rows)==4 and len({line[0] for line in rows})==4
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          for path,before,after,name in rows:
              assert len([path,before,after,name])==4
              assert sha(root/name)==after,(path,"template drift")
              assert Path(path).is_file() and sha(Path(path))==after,(path,"uninstalled target")
              if before!="ABSENT":
                  assert sha(root/"pre"/name)==before,(path,"source preimage drift")
          print("M3JDK21_FILTERED_SNAPSHOT_SOURCE_SEAL_PASS targets=4")
          PY
      - name: Compile actual Java21 collection owners and standalone additive contract proof
        shell: bash
        run: |
          set -euo pipefail
          B=build/m3-filtered-snapshot
          mkdir -p "$B"
          javac --release 21 -proc:none -Xlint:all -Werror -h "$B" -d "$B" \
            m3/collections/src/main/java/com/m3/collections/M3CollectionViews.java \
            m3/collections/src/main/java/com/m3/collections/M3FilteredMaps.java \
            m3/collections/wrappers/src/test/java/com/m3/collections/M3FilteredSnapshotFusionProof.java \
            m3/collections/wrappers/src/test/java/com/m3/collections/M3MapCursorNativeProof.java
          java -ea -cp "$B" com.m3.collections.M3FilteredSnapshotFusionProof
      - name: Reuse previously qualified bounded JNI proof-only native kernel
        shell: bash
        run: |
          set -euo pipefail
          B=build/m3-filtered-snapshot
          C=m3/collections/wrappers/direct-projection-20261017/m3_map_cursor_jni.c
          grep -q Java_com_m3_collections_M3MapCursorNativeProof_fold "$B/com_m3_collections_M3MapCursorNativeProof.h"
          gcc -std=c17 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            "$C" -o "$B/libm3_map_cursor_jni.so"
          java -ea -Xcheck:jni \
            -Dm3.cursor.native.library="$PWD/$B/libm3_map_cursor_jni.so" \
            -cp "$B" com.m3.collections.M3MapCursorNativeProof
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD

  retained-maven-openrewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Real Maven/OpenRewrite Java LST postimages fixed points and refusal
        run: >-
          mvn -B -ntp -f m3/collections/wrappers/recipe/pom.xml test
          -Dtest=M3FilteredSnapshotFusionReceiverRecipeTest
