# SPDX-License-Identifier: Apache-2.0
name: M3 Apache TreeList primitive-index iterator proof

on:
  pull_request:
    paths:
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/apache/M3TreeList.java'
      - 'test/jdk/jdk/m3/collections/M3TreeListCursorContract.java'
      - 'test/jdk/jdk/m3/collections/M3TreeListCursorJTReg.java'
      - '.github/workflows/m3-apache-tree-cursor-20261113.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  array-owner-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact preimage and candidate owner
        shell: bash
        run: |
          set -euo pipefail
          OWNER=src/jdk.m3.collections/share/classes/jdk/m3/collections/apache/M3TreeList.java
          test "$(git hash-object "$OWNER")" = 'ab861ce0c29d53080b54117414a4ba8486b1c58e'
          mkdir -p target/tree-cursor/before
          git show 778cd3eac266974e7b5155e79838f74ee516b535:"$OWNER" > target/tree-cursor/before/M3TreeList.java
          test "$(git hash-object target/tree-cursor/before/M3TreeList.java)" = '9da0a6ad147c423a0cfa718a8159890cc2c25977'
      - name: Strict Java 21 source and original-target contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/tree-cursor/baseline target/tree-cursor/candidate
          javac --release 21 -proc:none -Xlint:all -Werror \
            -d target/tree-cursor/baseline \
            target/tree-cursor/before/M3TreeList.java \
            test/jdk/jdk/m3/collections/ArrayTreeListContract.java
          javac --release 21 -proc:none -Xlint:all -Werror \
            -d target/tree-cursor/candidate \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/apache/M3TreeList.java \
            test/jdk/jdk/m3/collections/ArrayTreeListContract.java \
            test/jdk/jdk/m3/collections/M3TreeListCursorContract.java
          javap -public -s -classpath target/tree-cursor/baseline jdk.m3.collections.apache.M3TreeList \
            > target/tree-cursor/baseline-api.txt
          javap -public -s -classpath target/tree-cursor/candidate jdk.m3.collections.apache.M3TreeList \
            > target/tree-cursor/candidate-api.txt
          diff -u target/tree-cursor/baseline-api.txt target/tree-cursor/candidate-api.txt
          java -cp target/tree-cursor/baseline ArrayTreeListContract \
            | tee target/tree-cursor/baseline.out
          java -cp target/tree-cursor/candidate ArrayTreeListContract \
            | tee target/tree-cursor/candidate-original-contract.out
          java -cp target/tree-cursor/candidate M3TreeListCursorContract \
            | tee target/tree-cursor/candidate-cursor.out
          java -Xint -cp target/tree-cursor/candidate M3TreeListCursorContract \
            | tee target/tree-cursor/candidate-cursor-interpreted.out
      - name: Attach source and behavioral evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-apache-tree-cursor-20261113
          path: target/tree-cursor/
          if-no-files-found: ignore
