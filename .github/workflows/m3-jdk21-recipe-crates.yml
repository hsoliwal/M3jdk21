# Retained workflow source follows the target repository LICENSE.
name: M3 JDK21 OpenRewrite crate generation

on:
  push:
    branches:
      - "m3/jdk21-compatible-backport-convergence-20261003"
      - "m3/file-atomic-recipe-generator-20261004"
    paths:
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/**"
      - ".github/workflows/m3-jdk21-recipe-crates.yml"
  pull_request:
    paths:
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/**"
      - ".github/workflows/m3-jdk21-recipe-crates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-pr-m3-jdk21-recipe-crates.yml-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
jobs:
  generate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 22
            tag: jdk-22+36
          - release: 23
            tag: jdk-23+37
          - release: 24
            tag: jdk-24+36
          - release: 25
            tag: jdk-25+36
          - release: 26
            tag: jdk-26+35
          - release: 27
            tag: jdk-27+35
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    steps:
      - name: Fetch exact M3JDK21 commit
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" -o "$RUNNER_TEMP/m3jdk21.tar.gz"
          mkdir -p "$RUNNER_TEMP/m3jdk21"
          tar -xzf "$RUNNER_TEMP/m3jdk21.tar.gz" -C "$RUNNER_TEMP/m3jdk21" --strip-components=1
          printf 'M3ROOT=%s\n' "$RUNNER_TEMP/m3jdk21" >> "$GITHUB_ENV"
          # Read the exact target Git tree so inherited and M3-modified files are routed separately.
          mkdir -p "$RUNNER_TEMP/m3-current-git"
          git -C "$RUNNER_TEMP/m3-current-git" init -q
          git -C "$RUNNER_TEMP/m3-current-git" remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$RUNNER_TEMP/m3-current-git" -c protocol.version=2 fetch --depth=1 --filter=blob:none --no-tags origin "$HEAD_SHA"
          git -C "$RUNNER_TEMP/m3-current-git" rev-parse --verify "${HEAD_SHA}^{commit}"
          printf 'M3TARGET=%s\n' "$RUNNER_TEMP/m3-current-git" >> "$GITHUB_ENV"
          printf 'M3HEAD=%s\n' "$HEAD_SHA" >> "$GITHUB_ENV"

      - name: Plan legacy recipe custody restore
        id: legacy-recipe-custody
        shell: bash
        run: bash "$M3ROOT/.github/actions/legacy-recipe-custody/restore.sh" plan "$M3ROOT"
      - name: Check out the Synexia legacy recipe custody seal
        if: steps.legacy-recipe-custody.outputs.needed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hsoliwal/com.synexia
          ref: ac6518d9a38080c589b3b51cf1f18edeca1b9c41
          token: ${{ secrets.SYNEXIA_READ_TOKEN || github.token }}
          path: .legacy-recipe-custody-seal
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: ${{ steps.legacy-recipe-custody.outputs.paths }}
      - name: Restore and verify legacy recipe custody blobs
        if: steps.legacy-recipe-custody.outputs.needed == 'true'
        shell: bash
        run: bash "$M3ROOT/.github/actions/legacy-recipe-custody/restore.sh" restore "$M3ROOT" "$GITHUB_WORKSPACE/.legacy-recipe-custody-seal"

      - name: Fetch JDK21 baseline and donor tag
        shell: bash
        env:
          DONOR_TAG: ${{ matrix.tag }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none             --no-tags             origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/${DONOR_TAG}:refs/tags/${DONOR_TAG}"
          git -C "$RUNNER_TEMP/upstream-jdk" rev-parse --verify 'jdk-21+35^{commit}'
          git -C "$RUNNER_TEMP/upstream-jdk" rev-parse --verify "${DONOR_TAG}^{commit}"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: Unit-test comparator and crate generator
        shell: bash
        run: |
          set -euo pipefail
          cd "$M3ROOT/m3/backports"
          python3 -m unittest -v test_file_delta_inventory.py test_generate_recipe_crates.py

      - name: Generate exact file comparison and OpenRewrite candidate crates
        shell: bash
        env:
          RELEASE: ${{ matrix.release }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/output"
          python3 "$M3ROOT/m3/backports/file_delta_inventory.py"             --repo "$UPSTREAM"             --release "$RELEASE"             --out "$RUNNER_TEMP/output/JDK21_FILE_DELTAS.tsv"
          python3 "$M3ROOT/m3/backports/generate_recipe_crates.py"             --repo "$UPSTREAM"             --release "$RELEASE"             --all-candidates             --target-git "$M3TARGET"             --target-ref "$M3HEAD"             --out "$RUNNER_TEMP/output/openrewrite-bundle"
          gzip -9 -k "$RUNNER_TEMP/output/JDK21_FILE_DELTAS.tsv"
          cat "$RUNNER_TEMP/output/openrewrite-bundle/CRATES.tsv"

      - name: Prove OpenRewrite recipe substrate on Java 21
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f "$M3ROOT/m3/tooling/migration-recipes/pom.xml" clean verify

      - name: Upload candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-jdk21-openrewrite-jdk${{ matrix.release }}-${{ github.run_id }}
          path: ${{ runner.temp }}/output
          if-no-files-found: error
          retention-days: 7
