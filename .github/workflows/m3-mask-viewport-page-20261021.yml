name: M3 indexed viewport page Java 21 proof

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3MaskViewportPageContract.java'
      - 'm3/collections/qualification/mask-viewport-page-20261021/**'
      - '.github/workflows/m3-mask-viewport-page-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
      - name: Select Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail on candidate-source hash drift
        shell: bash
        run: |
          printf '%s  %s\n' \
            '99e8c061c60c3514ce9ec1b19e3a6afd618a32bd3f6841b36f931ca64383ac0c' 'm3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java' \
            '3a17cb6e0cebabdd77181bf102a558a489642cfc9945b97c6a85950162cc3a25' 'm3/collections/src/test/java/com/m3/collections/M3MaskViewportPageContract.java' | sha256sum -c -
      - name: Compile source owners and run visible-page oracle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m3-page-classes"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/m3-page-classes" \
            m3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java \
            m3/collections/src/main/java/com/m3/collections/M3MaskViewportNative.java \
            m3/collections/src/test/java/com/m3/collections/M3MaskViewportPageContract.java
          java -cp "$RUNNER_TEMP/m3-page-classes" com.m3.collections.M3MaskViewportPageContract \
            | tee "$RUNNER_TEMP/m3-page-oracle.txt"
          grep -Fx 'M3_MASK_VIEWPORT_PAGE_PASS checks=121831 existingJni=false' "$RUNNER_TEMP/m3-page-oracle.txt"
