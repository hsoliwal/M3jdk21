name: M3 indexed viewport page Java 21 proof

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3MaskViewportKernel.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3MaskViewportPageContract.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3FrameJavaContract.java'
      - 'm3/collections/qualification/mask-viewport-page-20261021/**'
      - '.github/workflows/m3-mask-viewport-page-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
      - name: Select Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail on candidate-source hash drift
        shell: bash
        run: |
          printf '%s  %s\n' \
            '99e8c061c60c3514ce9ec1b19e3a6afd618a32bd3f6841b36f931ca64383ac0c' 'm3/collections/src/main/java/jdk/m3/collections/M3MaskViewportKernel.java' \
            '81fa9fc5750b40c9580dad9a3e92632c1e59bb738006a01647b22d91ebe8cd4e' 'm3/collections/src/test/java/jdk/m3/collections/M3MaskViewportPageContract.java' \
            'b80df74e977a8ea67e8809e5ef8c0fd7ffe6c99a28bbafcde57b554a96702b0f' 'm3/collections/src/test/java/jdk/m3/collections/M3FrameJavaContract.java' | sha256sum -c -
      - name: Compile source owners and run visible-page oracle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m3-page-classes"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/m3-page-classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3MaskViewportKernel.java \
            m3/collections/src/main/java/jdk/m3/collections/M3MaskViewportNative.java \
            m3/collections/src/test/java/jdk/m3/collections/M3MaskViewportPageContract.java \
            m3/collections/src/test/java/jdk/m3/collections/M3FrameJavaContract.java
          java -cp "$RUNNER_TEMP/m3-page-classes" jdk.m3.collections.M3MaskViewportPageContract \
            | tee "$RUNNER_TEMP/m3-page-oracle.txt"
          grep -Fx 'M3_MASK_VIEWPORT_PAGE_PASS checks=121831 existingJni=false' "$RUNNER_TEMP/m3-page-oracle.txt"
          java -ea -cp "$RUNNER_TEMP/m3-page-classes" jdk.m3.collections.M3FrameJavaContract | tee "$RUNNER_TEMP/m3-frame-java-oracle.txt"
          java -ea -Xint -cp "$RUNNER_TEMP/m3-page-classes" jdk.m3.collections.M3FrameJavaContract | tee "$RUNNER_TEMP/m3-frame-java-oracle-int.txt"
          cmp "$RUNNER_TEMP/m3-frame-java-oracle.txt" "$RUNNER_TEMP/m3-frame-java-oracle-int.txt"
          grep -Fx 'M3_FRAME_JAVA_PASS checks=35080 digest=ed73ef29740c1e87' "$RUNNER_TEMP/m3-frame-java-oracle.txt"
