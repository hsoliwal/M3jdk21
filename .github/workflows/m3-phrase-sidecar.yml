name: M3 phrase sidecar contract

on:
  push:
    branches:
      - codex/m3jdk-phrase-precompute-20261009
  pull_request:
    branches:
      - codex/m3jdk-langdex-contract-20261009

permissions:
  contents: read

jobs:
  phrase-sidecar:
    name: M3PhraseSidecarContract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run deterministic Python exporter proof
        working-directory: m3
        shell: bash
        run: |
          set -euo pipefail
          python3 runtime-integration/synexia_phrase_sidecar.py

      - name: Compile and run Java receiver proof
        working-directory: m3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/phrase-sidecar
          mkdir -p build/phrase-sidecar
          javac --release 21 -d build/phrase-sidecar \
            core/src/com/m3/text/M3PhrasePrecompute.java \
            core/src/com/m3/text/M3PhraseSidecarCatalog.java \
            core/test/M3PhraseSidecarCatalogTest.java
          java -ea -cp build/phrase-sidecar M3PhraseSidecarCatalogTest
