# SPDX-License-Identifier: Apache-2.0
name: M3 widget-derived span index Java21 JNI proof
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SpanIndex.java'
      - 'm3/collections/src/main/native/collections/m3_span_index_jni.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3SpanIndex*.java'
      - 'm3/collections/recipe/widget-span-index-20261017/**'
      - 'm3/collections/qualification/widget-span-index-20261017/**'
      - '.github/workflows/m3-widget-span-index-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sparse-span-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact canonical Synexia template postimages
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '76da13c95905f3a41b0e95acd89ff68e9ae12b665fec8fe804a5af37235a9641' 'm3/collections/src/main/java/com/m3/collections/M3SpanIndex.java' | sha256sum -c -
          printf '%s  %s\n' '38a577aaa1857878b095e2a89f8a7c60868f471ff3c125cbfb839b56e7842cf6' 'm3/collections/src/test/java/com/m3/collections/M3SpanIndexSelfTest.java' | sha256sum -c -
          printf '%s  %s\n' 'fc92c4b6d1dc47519a6613ce1773331741ffd2e6deaf8dd97e35dc98a02b2cef' 'm3/collections/src/test/java/com/m3/collections/M3SpanIndexTest.java' | sha256sum -c -
          printf '%s  %s\n' 'f33781ca270dda25553986da350d4d5fc3808c483363c93a7bad64717effaf3c' 'm3/collections/src/main/native/collections/m3_span_index_jni.c' | sha256sum -c -
      - name: Run strict Java21 oracle and native C11 JNI differential
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-span-index"
          mkdir -p "$out/classes" "$out/native"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SlotArrays.java \
            m3/collections/src/main/java/com/m3/collections/M3SpanIndex.java \
            m3/collections/src/test/java/com/m3/collections/M3SpanIndexSelfTest.java
          java -cp "$out/classes" com.m3.collections.M3SpanIndexSelfTest
          gcc -std=c11 -O2 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_span_index_jni.c \
            -o "$out/native/libm3_collections_span.so"
          java -Djava.library.path="$out/native" -cp "$out/classes" \
            com.m3.collections.M3SpanIndexSelfTest
      - name: Focused M3 collections Maven/JUnit acceptance gate
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3SpanIndexTest -Dsurefire.failIfNoSpecifiedTests=false test
