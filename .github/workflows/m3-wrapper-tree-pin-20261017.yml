# SPDX-License-Identifier: Apache-2.0
name: M3 wrapper CI pin source-sealed exact recipe
on:
  push:
    branches: ["m3/writable-filtered-map-avl-receiver-20261017"]
  pull_request:
    paths:
      - "m3/collections/wrappers/workflow-pin-20261017/**"
      - ".github/workflows/m3-filtered-sorted-receiver.yml"
      - ".github/workflows/m3-wrapper-tree-pin-20261017.yml"
jobs:
  source-identity-and-real-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Assert actual existing recipe, proof and original verifier identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD:m3/collections/wrappers/recipe)" = e4ccfffd308feca5a7eab1beb59d1d20b0d1300b
          test "$(git hash-object m3/collections/wrappers/verify.py)" = 5c813e8aa766ae9bd90a8c3a7e54412a8b5281c8
          test "$(git rev-parse HEAD:m3/collections/wrappers/proof)" = c901d303b718fb435b24a8fe1d42f40016a89fcf
      - name: Real OpenRewrite text recipe, fixed point and drift refusal
        run: mvn -B -ntp -f m3/collections/wrappers/workflow-pin-20261017/recipe/pom.xml -Dtest=M3Jdk21WrapperTreePinRecipeTest,M3Jdk21PinnedProviderTestCompatRecipeTest test
