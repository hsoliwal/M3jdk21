name: M3 #1294 source-exact historical catalogue proof
# Former triggers (below, as of the move) now start job(s) 'm3-pr1294-historical-catalogue__*' in
# .github/workflows/checks-superset-04.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/collections/algorithm-catalog/wrapper-convergence-20261018/**'
#         - '.github/workflows/m3-pr1294-historical-catalogue.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-custody:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact Git blob, mode, length and JSON parsing
        shell: bash
        run: |
          set -euo pipefail
          file=m3/collections/algorithm-catalog/wrapper-convergence-20261018/SOURCE_CUSTODY_20261028.tsv
          test "$(wc -l < "$file")" -eq 24
          while IFS=$'\t' read -r path sha mode bytes; do
            [[ "$path" == \#* ]] && continue
            test -f "$path"
            test "$(git hash-object "$path")" = "$sha"
            test "$(git ls-files -s -- "$path" | awk '{print $1}')" = "$mode"
            test "$(wc -c < "$path" | tr -d ' ')" = "$bytes"
            case "$path" in
              *.json) python3 -m json.tool "$path" >/dev/null ;;
            esac
          done < "$file"
          git diff --check HEAD^1 HEAD
