# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 java.base deletion-mask contracts
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/mindex/M3CollectionMaskCompactor.java'
      - 'test/jdk/java/util/ArrayList/M3CollectionMaskCompactorContract.java'
      - 'm3/collections/qualification/java-base-mask-20261023/**'
      - 'm3/collections/qualification/java-base-mask-current-master-20261027/**'
      - '.github/workflows/m3-jdk21-java-base-mask-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mask-kernel-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify sealed JDK source and actual Java 21 kernel test
        run: bash m3/collections/qualification/java-base-mask-current-master-20261027/verify.sh
