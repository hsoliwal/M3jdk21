name: M3 repository file atom census

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: m3-repository-file-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repository-file-census:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate and verify repository file atoms
        run: m3/tooling/atom-census/verify-repository-census.sh
      - name: Retain commit-sealed census
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-repository-file-census-${{ github.sha }}
          path: build/m3-repository-file-census/
          if-no-files-found: error
          retention-days: 14
