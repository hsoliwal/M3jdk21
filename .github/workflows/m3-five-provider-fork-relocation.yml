# SPDX-License-Identifier: Apache-2.0
name: M3 SDK five-provider fork source package relocation
on:
  pull_request:
    paths:
      - 'm3/collections/relocation/five-provider-20261018/**'
      - '.github/workflows/m3-five-provider-fork-relocation.yml'
  workflow_dispatch:
jobs:
  test-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual OpenRewrite package-refactoring Maven tests
        run: mvn -B -ntp -f m3/collections/relocation/five-provider-20261018/pom.xml clean test
