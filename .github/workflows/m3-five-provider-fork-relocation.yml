# SPDX-License-Identifier: Apache-2.0
name: M3 SDK five-provider fork source package relocation
# Former triggers (below, as of the move) now start job(s) 'm3-five-provider-fork-relocation__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/collections/relocation/five-provider-20261018/**'
#         - '.github/workflows/m3-five-provider-fork-relocation.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-recipes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual OpenRewrite package-refactoring Maven tests
        run: mvn -B -ntp -f m3/collections/relocation/five-provider-20261018/pom.xml clean test
