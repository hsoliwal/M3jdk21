name: M3 AST unnamed source facts
# Former triggers (below, as of the move) now start job(s) 'm3-ast-general-source-facts__*' in
# .github/workflows/checks-superset-04.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/ast/src/main/java/jdk/m3/ast/ASTHierarchy.java'
#         - 'm3/ast/src/test/java/jdk/m3/ast/ASTHierarchyContract.java'
#         - 'm3/ast/recipe-custody/hierarchy-encoding-20261018/**'
#         - '.github/workflows/m3-ast-general-source-facts.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-and-openrewrite:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Full original AST source/family contract and frozen roots
        run: |
          mkdir -p /tmp/m3-ast-general/classes
          javac --release 21 -Xlint:all -Werror -d /tmp/m3-ast-general/classes \
            m3/ast/src/main/java/jdk/m3/ast/ASTHierarchy.java \
            m3/ast/src/test/java/jdk/m3/ast/ASTHierarchyContract.java \
            m3/ast/src/test/java/jdk/m3/ast/ASTHierarchyEncodingTest.java
          java -cp /tmp/m3-ast-general/classes jdk.m3.ast.ASTHierarchyContract 2000
          java -cp /tmp/m3-ast-general/classes jdk.m3.ast.ASTHierarchyEncodingTest
      - name: Qualify exact canonical OpenRewrite recipe result and fixed point
        run: |
          cd m3/ast/recipe-custody/hierarchy-encoding-20261018
          mvn -B -ntp -Dm3.dataset=ast-general-source-20261019 \
            -Dm3.crate.name=m3-ast-general-source-20261019 \
            -Dm3.recipe.name=jdk.internal.m3.m3jdk.AstGeneralSourceFacts20261019 \
            -Drecipe.owner.root="$PWD/sdk-owner" test
