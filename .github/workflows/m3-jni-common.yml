name: M3JDK21 common JNI C11 contract

on:
  pull_request:
    paths:
      - 'm3/native/**'
      - 'm3/arrays/src/main/native/**'
      - 'm3/collections/src/main/native/**'
      - '.github/workflows/m3-jni-common.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-contract:
    name: C11 JNI contract (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      # Git for Windows rejects deeply nested M3 recipe-custody paths unless
      # core.longpaths is set before checkout creates the working tree.
      - name: Enable Git long paths before checkout on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.longpaths true
          if ((git config --global --get core.longpaths).Trim() -ne 'true') {
            throw 'Git long path support was not configured'
          }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and run canonical native contract checks
        run: |
          cmake -S m3/native -B m3/native/build -DCMAKE_BUILD_TYPE=Release
          cmake --build m3/native/build --config Release
          ctest --test-dir m3/native/build -C Release --output-on-failure

  android-ndk-compile:
    name: Android ARM64 C11/JNI headers (compile only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Compile with the runner Android NDK
        shell: bash
        run: |
          set -euo pipefail
          NDK="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
          if [[ -z "$NDK" || ! -f "$NDK/build/cmake/android.toolchain.cmake" ]]; then
            echo 'A provisioned Android NDK is required for this build gate' >&2
            exit 1
          fi
          cmake -S m3/native -B m3/native/build-android \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-24 \
            -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build m3/native/build-android --config Release
          echo 'Android JNI/C11 compile passed; runtime/device JNI tests remain pending.'

  ios-arm64-compile:
    name: iOS arm64 C11/JNI sources (cross-compile only)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile portable native owners with the iPhoneOS SDK
        shell: bash
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk iphoneos --show-sdk-path)"
          test -d "$sdk"
          test -f "$JAVA_HOME/include/jni.h"
          test -f "$JAVA_HOME/include/darwin/jni_md.h"
          cmake -S m3/native -B m3/native/build-ios \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT="$sdk" \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_TRY_COMPILE_TARGET_TYPE=STATIC_LIBRARY \
            -DM3_JNI_INCLUDE_DIRS="$JAVA_HOME/include;$JAVA_HOME/include/darwin" \
            -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build m3/native/build-ios --config Release --verbose
          echo 'iOS arm64 portable C11/JNI compilation passed.'
          echo 'No iOS JVM, Java execution, Objective-C integration, codesigning or device runtime was tested.'
