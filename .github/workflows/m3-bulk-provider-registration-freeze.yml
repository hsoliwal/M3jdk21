name: M3 Bulk Provider Registration Freeze

on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/vm/parallel/BulkScheduler.java'
      - 'test/jdk/jdk/internal/vm/parallel/BulkProviderStableIdentityTest.java'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3BulkRegistrationFreezeReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3BulkRegistrationFreezeReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-registration-freeze/**'
      - 'm3/tooling/migration-recipes/tasks/bulk-registration-freeze/**'
      - '.github/workflows/m3-bulk-provider-registration-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-custody:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify immutable recipe target paths
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3BulkRegistrationFreezeReceiverRecipeTest test

  isolated-java-base-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile strict isolated patch and run both scheduler contracts
        shell: bash
        run: |
          set -euo pipefail
          source_root="$RUNNER_TEMP/m3-bulk-freeze/src"
          classes="$RUNNER_TEMP/m3-bulk-freeze/classes"
          test_classes="$RUNNER_TEMP/m3-bulk-freeze/tests"
          mkdir -p "$source_root/jdk/internal/vm/parallel" "$classes" "$test_classes"
          for name in BulkTask BulkExecutor BulkExecution BulkExecutorProvider BulkScheduler; do
            cp "src/java.base/share/classes/jdk/internal/vm/parallel/$name.java" \
              "$source_root/jdk/internal/vm/parallel/$name.java"
          done
          javac -Xlint:all -Werror \
            --patch-module "java.base=$source_root" -d "$classes" \
            "$source_root"/jdk/internal/vm/parallel/*.java
          javac -Xlint:all -Werror \
            --patch-module "java.base=$classes" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -d "$test_classes" \
            test/jdk/jdk/internal/vm/parallel/BulkExecutorTest.java \
            test/jdk/jdk/internal/vm/parallel/BulkSchedulerTest.java \
            test/jdk/jdk/internal/vm/parallel/BulkProviderStableIdentityTest.java
          for test in BulkExecutorTest BulkSchedulerTest BulkProviderStableIdentityTest; do
            java --patch-module "java.base=$classes" \
              --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
              -cp "$test_classes" "$test"
          done

  release-image-jtreg:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: Get JTReg
        id: jtreg
        uses: ./.github/actions/get-jtreg
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libxrandr-dev libxtst-dev libcups2-dev libasound2-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-12
      - name: Configure
        run: |
          bash configure --with-conf-name=linux-x64-bulk-freeze \
            --with-debug-level=release \
            --with-boot-jdk='${{ steps.bootjdk.outputs.path }}' \
            --with-jtreg='${{ steps.jtreg.outputs.path }}' \
            --with-zlib=system
      - name: Build release image
        run: make CONF=linux-x64-bulk-freeze images
      - name: Run focused scheduler jtreg
        run: |
          make CONF=linux-x64-bulk-freeze test \
            TEST="test/jdk/jdk/internal/vm/parallel/BulkExecutorTest.java \
                  test/jdk/jdk/internal/vm/parallel/BulkSchedulerTest.java \
                  test/jdk/jdk/internal/vm/parallel/BulkProviderStableIdentityTest.java"
