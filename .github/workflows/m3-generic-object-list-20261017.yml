# SPDX-License-Identifier: Apache-2.0
name: M3 generic object collections Java/JNI receiver
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ArrayList.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedListSnapshot.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3GenericCollections.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3GenericArrayList*.java'
      - 'm3/collections/qualification/m3-generic-object-list-20261017/**'
      - '.github/workflows/m3-generic-object-list-20261017.yml'
  workflow_dispatch:
jobs:
  generic-object-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify exact Maven source-sealed generator
        shell: bash
        run: |
          set -euo pipefail
          RECIPE=m3/collections/qualification/m3-generic-object-list-20261017/recipe
          mvn -B -ntp -f "$RECIPE/pom.xml" verify
          java -cp "$RECIPE/target/classes" com.synexia.m3.M3GenericObjectListRecipe --check .
      - name: Differential Java21 object List and indexed snapshot
        shell: bash
        run: |
          set -euo pipefail
          SRC=m3/collections/src/main/java/com/m3/collections
          TEST=m3/collections/src/test/java/com/m3/collections
          mkdir -p "$RUNNER_TEMP/m3generic/classes" "$RUNNER_TEMP/m3generic/native"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3generic/classes" \
            "$SRC/M3IndexMaskCompactor.java" "$SRC/M3ArrayList.java" \
            "$SRC/M3IndexedListSnapshot.java" "$SRC/M3GenericCollections.java" \
            "$TEST/M3GenericArrayListSelfTest.java"
          java -cp "$RUNNER_TEMP/m3generic/classes" com.m3.collections.M3GenericArrayListSelfTest
      - name: Checked JNI against existing M3 primitive selector
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m3generic"
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$ROOT/native/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$ROOT/native" -cp "$ROOT/classes" \
            com.m3.collections.M3GenericArrayListSelfTest
      - name: Owning module Maven tests
        run: mvn -B -ntp -f m3/collections/pom.xml test
