name: M3 Tree native-parent handle closure
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ParentHandleClosureProof.java'
      - 'm3/collections/qualification/viewport-tree-parent/**'
      - '.github/workflows/m3-viewport-tree-parent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  headless-original-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact emitted source, baseline and proof seals
        shell: bash
        run: |
          set -euo pipefail
          SRC=m3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java
          PROOF=m3/collections/src/test/java/com/m3/collections/M3ParentHandleClosureProof.java
          echo 'ce27f58fa068a61feb6e74d6067a5751241f41688b63e87085ecae34a1eeba6d  '"$SRC" | sha256sum -c -
          echo '2d891a6bd14007f003dc34b53dd548bcae55341839c26db400fca5e7c3da29b0  '"$PROOF" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/m3-tree-parent/src/com/m3/collections"
          git show '9dd1df62f3d5406760427cb5e840a36c9e7a59ea:'"$SRC" > "$RUNNER_TEMP/m3-tree-parent/src/com/m3/collections/M3TreeWindowPlan.java"
          echo 'be77b8dd08c7a498355bc8793932039a00a0f523e206e47f116b7a6b10635082  '"$RUNNER_TEMP/m3-tree-parent/src/com/m3/collections/M3TreeWindowPlan.java" | sha256sum -c -
      - name: Compile exact current Java21 dependencies and new proof
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/m3-tree-parent"
          SOURCE=m3/collections/src/main/java/com/m3/collections
          TEST=m3/collections/src/test/java/com/m3/collections/M3ParentHandleClosureProof.java
          mkdir -p "$B/baseline-classes" "$B/candidate-classes"
          DEPS=(M3LongLongHashMap M3LongLongConsumer M3LongIterator M3TreeProjection M3TreeTopology M3OrderStatisticForest M3ItemState)
          ARG=(); for cls in "${DEPS[@]}"; do ARG+=("$SOURCE/$cls.java"); done
          javac --release 21 -Xlint:all -Werror -d "$B/baseline-classes" \
            "$B/src/com/m3/collections/M3TreeWindowPlan.java" "${ARG[@]}" "$TEST"
          javac --release 21 -Xlint:all -Werror -d "$B/candidate-classes" \
            "$SOURCE/M3TreeWindowPlan.java" "${ARG[@]}" "$TEST"
          javap -public -s -classpath "$B/baseline-classes" com.m3.collections.M3TreeWindowPlan > "$B/baseline.javap"
          javap -public -s -classpath "$B/candidate-classes" com.m3.collections.M3TreeWindowPlan > "$B/candidate.javap"
          cmp "$B/baseline.javap" "$B/candidate.javap"
      - name: Prove expected baseline failure and candidate mixed/interpreted parity
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/m3-tree-parent"
          if java -ea -Xmx64m -XX:+UseSerialGC -cp "$B/baseline-classes" \
             com.m3.collections.M3ParentHandleClosureProof > "$B/baseline.out" 2> "$B/baseline.err"; then
             echo 'unfixed original unexpectedly passed' >&2; exit 1
          fi
          grep -F 'child of retired root cannot keep destroyed native handle check=2' "$B/baseline.err"
          for mode in mixed interpreted; do
             opts=(); if [[ "$mode" == interpreted ]]; then opts=(-Xint); fi
             java "${opts[@]}" -ea -Xmx64m -XX:+UseSerialGC -cp "$B/candidate-classes" \
                com.m3.collections.M3ParentHandleClosureProof | tee "$B/candidate-$mode.log"
             grep -qx 'M3_TREE_PARENT_CLOSURE_PASS checks=206547 digest=e4635cc5d317d586' "$B/candidate-$mode.log"
          done
          cmp "$B/candidate-mixed.log" "$B/candidate-interpreted.log"
          echo M3_TREE_PARENT_HEADLESS_PASS
      - name: Retain exact original owner, compile and proof receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-tree-parent-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/m3-tree-parent/
            m3/collections/qualification/viewport-tree-parent/QUALIFICATION.json
