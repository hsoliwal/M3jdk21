# SPDX-License-Identifier: Apache-2.0
name: M3 mask all-selected Java21/JNI source-sealed receiver
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3Mask*'
      - 'm3/collections/verification/mask-all-select-20261017/**'
      - 'm3/compatibility/m3-mask-all-select-receiver-20261017.tsv'
      - '.github/workflows/m3-collections-mask-all-select-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-java21-jni:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: git diff --check origin/master...HEAD
      - run: python3 m3/collections/verification/mask-all-select-20261017/verify.py
  maven-collection-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3MaskAllSelectionReceiverTest test
