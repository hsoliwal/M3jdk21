name: M3 CircularFifoQueue index-wrap Java21 and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/implementations/apache-circular-fifo/**'
      - 'm3/collections/qualification/owned-apache-circular-fifo-20261018/**'
      - 'm3/collections/qualification/owned-apache-circular-fifo-index-wrap-20261018/**'
      - '.github/workflows/m3-owned-apache-circular-fifo-index-wrap.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source seal
        run: python -I -S -B m3/collections/qualification/owned-apache-circular-fifo-index-wrap-20261018/verify.py
      - name: Compile provider, M3 core and receiver proofs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-fifo-index-wrap"
          mkdir -p "$OUT/core" "$OUT/classes" "$OUT/native"
          curl --fail --location --silent --show-error             --output "$OUT/commons-collections4-4.5.0.jar"             https://repo.maven.apache.org/maven2/org/apache/commons/commons-collections4/4.5.0/commons-collections4-4.5.0.jar
          find m3/collections/src/main/java -name '*.java' | sort > "$OUT/core.args"
          javac --release 21 -g -proc:none -Xlint:all,-module -Werror             -d "$OUT/core" @"$OUT/core.args"
          javac --release 21 -g -proc:none -Xlint:all,-module -Werror             -cp "$OUT/core:$OUT/commons-collections4-4.5.0.jar"             -d "$OUT/classes"             m3/collections/implementations/apache-circular-fifo/src/main/java/com/m3/collections/apache/M3CircularFifoQueue.java             m3/collections/qualification/owned-apache-circular-fifo-20261018/CircularFifoProtocolProof.java             m3/collections/qualification/owned-apache-circular-fifo-20261018/CircularFifoMutationProbe.java             m3/collections/qualification/owned-apache-circular-fifo-index-wrap-20261018/CircularFifoIndexWrapProof.java
          gcc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_mask_compactor.c             -o "$OUT/native/libm3_collections_mask.so"
          echo "$OUT" > "$RUNNER_TEMP/m3_fifo_out"
      - name: Run Apache differential and checked JNI lane
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(cat "$RUNNER_TEMP/m3_fifo_out")"
          CP="$OUT/classes:$OUT/core:$OUT/commons-collections4-4.5.0.jar"
          java -cp "$CP" CircularFifoProtocolProof             org.apache.commons.collections4.queue.CircularFifoQueue > "$OUT/provider.json"
          java -cp "$CP" CircularFifoProtocolProof             com.m3.collections.apache.M3CircularFifoQueue > "$OUT/java.json"
          java -Xcheck:jni -Djava.library.path="$OUT/native" -cp "$CP"             CircularFifoProtocolProof com.m3.collections.apache.M3CircularFifoQueue native             > "$OUT/native.json"
          java -cp "$CP" CircularFifoMutationProbe             org.apache.commons.collections4.queue.CircularFifoQueue > "$OUT/provider-mutation.json"
          java -cp "$CP" CircularFifoMutationProbe             com.m3.collections.apache.M3CircularFifoQueue > "$OUT/owned-mutation.json"
          python -I -S -B             m3/collections/qualification/owned-apache-circular-fifo-20261018/compare.py "$OUT"
          java -cp "$CP" CircularFifoIndexWrapProof
