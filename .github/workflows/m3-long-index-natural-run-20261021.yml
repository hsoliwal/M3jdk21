name: M3JDK21 native owner monotonic index contract
# Former triggers (below, as of the move) now start job(s) 'm3-long-index-natural-run-20261021__*' in
# .github/workflows/checks-superset-09.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongIndexProjection.java'
#         - 'test/jdk/jdk/m3/collections/M3LongIndexNaturalRunContract.java'
#         - 'test/jdk/jdk/m3/collections/M3LongIndexNaturalRunTest.java'
#         - 'm3/collections/qualification/natural-run-20261021/**'
#         - 'm3/collections/algorithm-catalog/natural-run-20261021/**'
#         - 'm3/docs/M3JDK21-INTEGRATED-JAVA-JNI-RECIPE-CATALOGUE-20261021.md'
#         - '.github/workflows/m3-long-index-natural-run-20261021.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-source-baseline-candidate-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pinned source + actual product Java21 strict compile and differential
        run: bash m3/collections/qualification/natural-run-20261021/verify.sh
