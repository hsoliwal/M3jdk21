# SPDX-License-Identifier: Apache-2.0
name: M3 adapted JBS proof wave

on:
  pull_request:
    paths:
      - 'm3/backports/ADAPTED_JBS_PROOF_WAVE.tsv'
      - 'm3/backports/adapted_jbs_proof.py'
      - 'm3/backports/test_adapted_jbs_proof.py'
      - 'm3/backports/UPSTREAM_CHANGE_SEEDS.tsv'
      - 'm3/backports/recipes/jdk-8347112/**'
      - 'm3/backports/recipes/jdk-8357439/**'
      - 'm3/backports/recipes/jdk-8359706/**'
      - 'm3/backports/recipes/jdk-8364182/**'
      - 'm3/backports/recipes/jdk-8367584/**'
      - 'm3/backports/recipes/jdk-8368692/**'
      - 'm3/backports/recipes/jdk-8374808/**'
      - 'm3/tooling/migration-recipes/**'
      - 'src/hotspot/**'
      - 'src/java.base/**'
      - 'src/jdk.javadoc/**'
      - 'src/jdk.jcmd/**'
      - 'test/hotspot/**'
      - 'test/jdk/**'
      - 'test/langtools/**'
      - '.github/workflows/m3-adapted-jbs-proof-wave.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-and-recipe-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diff hygiene
        run: git diff --check

      - name: Verify exact current-tree adapted packet hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest -v m3/backports/test_adapted_jbs_proof.py
          python3 m3/backports/adapted_jbs_proof.py \
            --root . \
            --out target/m3-adapted-jbs-proof
          test -s target/m3-adapted-jbs-proof/work.tsv
          test -s target/m3-adapted-jbs-proof/targets.tsv
          test -s target/m3-adapted-jbs-proof/summary.json

      - name: Verify canonical backport inventory and current tree
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/verify.py --root .

      - name: Install source-built OpenRewrite JUnit and Synexia custody
        shell: bash
        run: |
          set -euo pipefail
          bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"

      - name: Prove all seven source-pinned recipe atoms
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest='M3Jdk8347112BackportRecipeTest,M3Jdk8357439JcmdCompletionBackportRecipeTest,M3Jdk8359706BackportRecipeTest,M3Jdk8364182BackportRecipeTest,M3Jdk8367584JfrOptionsHelpBackportRecipeTest,M3Jdk8368692PasswordSystemInBackportRecipeTest,M3Jdk8374808BackportRecipeTest' \
            test

      - name: Run packet-local recovery and tooling smokes
        shell: bash
        run: |
          set -euo pipefail
          bash m3/backports/recipes/jdk-8357439/test_jcmd_completion.sh
          python3 m3/backports/recipes/jdk-8367584/verify_recovery.py
          python3 m3/backports/recipes/jdk-8368692/verify_recovery.py

      - name: Upload exact adapted-wave receipts
        uses: actions/upload-artifact@v4
        with:
          name: m3-adapted-jbs-proof
          path: target/m3-adapted-jbs-proof/**
          if-no-files-found: error
          retention-days: 14

  linux-release-image-and-jtreg:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: Configure release JDK
        shell: bash
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: Build one release image for the adapted wave
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 images
          test -x "$(find build -path '*/images/jdk/bin/java' -type f -print -quit)"

      - name: Prove jcmd Bash completion packaging
        shell: bash
        run: |
          set -euo pipefail
          completion="$(find build -path '*/images/jdk/conf/bash-completion/jcmd' -type f -print -quit)"
          test -n "$completion"
          cmp -s src/jdk.jcmd/share/conf/bash-completion/jcmd "$completion"
          bash m3/backports/recipes/jdk-8357439/test_jcmd_completion.sh "$completion"

      - name: JDK-8347112 javadoc nested doc-files
        run: make JOBS=2 test TEST="test/langtools/jdk/javadoc/doclet/testCopyFiles/TestCopyFiles.java"

      - name: JDK-8359706 VM.info open file descriptors
        run: make JOBS=2 test TEST="test/jdk/sun/tools/jcmd/TestJcmdSanity.java"

      - name: JDK-8364182 VM.security_properties and legacy compatibility
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="test/hotspot/jtreg/serviceability/dcmd/vm/SecurityPropertiesTest.java"
          make JOBS=2 test TEST="test/hotspot/jtreg/serviceability/dcmd/vm/SystemPropertiesTest.java"

      - name: JDK-8367584 FlightRecorderOptions help
        run: make JOBS=2 test TEST="test/jdk/jdk/jfr/startupargs/TestOptionsHelp.java"

      - name: JDK-8368692 password System.in policy
        run: make JOBS=2 test TEST="test/jdk/sun/security/tools/keytool/AllowSystemIn.java"

      - name: JDK-8374808 KeyStore Instant API and legacy behavior
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="test/jdk/java/security/KeyStore/CreationInstant.java"
          make JOBS=2 test TEST="test/jdk/java/security/KeyStore/TestKeyStoreBasic.java"

  macos-open-fd-proof:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install macOS build prerequisite
        run: brew install autoconf

      - name: Configure release macOS JDK
        shell: bash
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: Build macOS image with JDK-8380236 repair
        run: make JOBS=2 images

      - name: Prove VM.info open-FD behavior on macOS
        run: make JOBS=2 test TEST="test/jdk/sun/tools/jcmd/TestJcmdSanity.java"
