# SPDX-License-Identifier: Apache-2.0
name: DOOPS entryless Java21 JNI receiver
on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/doops-entryless-receiver.yml'
      - 'm3/collections/qualification/doops-entryless-verify.sh'
      - 'm3/collections/qualification/doops-entryless-receiver.tsv'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3FilteredViews.java'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3TreeMap.java'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexMaskCompactor.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3*Proof.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiver-java21-jni:
    # Avoid executing untrusted fork PR source in this qualification workflow.
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == 'hsoliwal/M3jdk21' &&
       startsWith(github.event.pull_request.head.ref, 'm3/doops-entryless-receiver-'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact product source and run Java/JNI differential oracles
        run: bash m3/collections/qualification/doops-entryless-verify.sh
