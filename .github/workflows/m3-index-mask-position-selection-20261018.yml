# SPDX-License-Identifier: Apache-2.0
name: M3 direct mask positions Java21/JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3CountedBag.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java'
      - 'm3/collections/qualification/m3-index-mask-position-selection-20261018/**'
      - '.github/workflows/m3-index-mask-position-selection-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-jni:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact postimages and allocation boundary
        run: python -I -S -B m3/collections/qualification/m3-index-mask-position-selection-20261018/verify.py
      - name: Compile current M3 core and self-tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-mask-positions"
          mkdir -p "$OUT/classes" "$OUT/current" "$OUT/legacy"
          find m3/collections/src/main/java/com/m3/collections -name '*.java' -print | sort > "$OUT/main.args"
          javac --release 21 -proc:none -Xlint:all -Werror             -d "$OUT/classes" @"$OUT/main.args"
          javac --release 21 -proc:none -Xlint:all -Werror             -cp "$OUT/classes" -d "$OUT/classes"             m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3CountedBagSelfTest.java
          java -cp "$OUT/classes" com.m3.collections.M3IndexMaskCompactorSelfTest
          java -cp "$OUT/classes" com.m3.collections.M3CountedBagSelfTest
          echo "$OUT" > "$RUNNER_TEMP/m3_mask_positions_out"
      - name: Build current JNI and run checked native differential
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(cat "$RUNNER_TEMP/m3_mask_positions_out")"
          gcc -std=c17 -O2 -Wall -Wextra -Wconversion -Wshadow -Werror             -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_mask_compactor.c             -o "$OUT/current/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$OUT/current" -cp "$OUT/classes"             com.m3.collections.M3IndexMaskCompactorSelfTest --native
          java -Xcheck:jni -Djava.library.path="$OUT/current" -cp "$OUT/classes"             com.m3.collections.M3CountedBagSelfTest
      - name: Prove new Java against pre-change native ABI
        shell: bash
        run: |
          set -euo pipefail
          OUT="$(cat "$RUNNER_TEMP/m3_mask_positions_out")"
          BASE=275b610f26c191cd70420172ac65b634a8a4df49
          NATIVE=m3/collections/src/main/native/collections/m3_index_mask_compactor.c
          git show "$BASE:$NATIVE" > "$OUT/legacy/m3_index_mask_compactor.c"
          printf '%s  %s\n'             cb8e8c66e07cc4651e95a0c28ad834d2c9de48df34dc90c6d7da68443f1da531             "$OUT/legacy/m3_index_mask_compactor.c" | sha256sum -c -
          gcc -std=c17 -O2 -Wall -Wextra -Wconversion -Wshadow -Werror             -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             "$OUT/legacy/m3_index_mask_compactor.c"             -o "$OUT/legacy/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$OUT/legacy" -cp "$OUT/classes"             com.m3.collections.M3IndexMaskCompactorSelfTest --native
          java -Xcheck:jni -Djava.library.path="$OUT/legacy" -cp "$OUT/classes"             com.m3.collections.M3CountedBagSelfTest
      - name: Run core JUnit and counted provider differential
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml             -Dtest=M3IndexMaskCompactorTest,M3CountedBagTest             -Dsurefire.failIfNoSpecifiedTests=false test
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/interop/pom.xml             -Dtest=M3CountedProviderContractTest             -Dsurefire.failIfNoSpecifiedTests=false test
