name: M3 complete collection source capture
on:
  pull_request:
    paths:
      - '.github/workflows/m3-collection-source-capture-20261020.yml'
      - 'm3/collections/qualification/all-collection-preparation-20261019/**'
permissions:
  contents: read
jobs:
  capture:
    if: github.repository == 'hsoliwal/M3jdk21' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Diff and source integrity
        shell: bash
        run: |
          set -euo pipefail
          git show --format= --check HEAD -- .github/workflows/m3-collection-source-capture-20261020.yml m3/collections/qualification/all-collection-preparation-20261019
          cd m3/collections/qualification/all-collection-preparation-20261019
          sha256sum --check TOOLS.sha256
          python3 - <<'PYLINT'
          from pathlib import Path
          for path in sorted(Path('.').glob('*.py')):
              text = path.read_text(encoding='utf-8')
              assert text.endswith('\n'), path
              assert all(line == line.rstrip() for line in text.splitlines()), path
              assert '\r' not in text and '\x00' not in text, path
          print('SOURCE_FORMAT_AND_HASH_LINT=PASS')
          PYLINT
      - name: Compile Python syntax
        working-directory: m3/collections/qualification/all-collection-preparation-20261019
        run: python3 -m py_compile prepare.py test_prepare.py capture.py test_capture.py
      - name: Preparation and capture contract tests
        working-directory: m3/collections/qualification/all-collection-preparation-20261019
        run: python3 -m unittest -v test_prepare test_capture
      - name: Serial pinned source capture
        shell: bash
        run: |
          set -euo pipefail
          tool="$GITHUB_WORKSPACE/m3/collections/qualification/all-collection-preparation-20261019"
          python3 "$tool/capture.py" --inputs "$tool/INPUTS.tsv" --work "$RUNNER_TEMP/m3-collection-capture"
      - name: Retain exact public sources and receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-collection-source-capture-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/m3-collection-capture/M3_COLLECTION_SOURCES_20261020.zip
            ${{ runner.temp }}/m3-collection-capture/M3_COLLECTION_SOURCES_20261020.sha256
            ${{ runner.temp }}/m3-collection-capture/RESULT.json
            ${{ runner.temp }}/m3-collection-capture/logs/
          if-no-files-found: error
          retention-days: 14
