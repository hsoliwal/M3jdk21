name: M3 current core historical and current runtime proof
on:
  pull_request:
    paths:
      - 'm3/core/**'
      - 'm3/build.sh'
      - 'm3/lexicon/*.tsv'
      - 'm3/lexicon/english-demo.txt'
      - 'm3/tooling/joined-range-directory/current-baseline/**'
      - 'm3/tooling/joined-range-directory/current-module/**'
      - '.github/workflows/m3-core-current-baseline.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-current-core-runtime-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-build-cohorts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      Q: m3/tooling/joined-range-directory/current-baseline
      PROOF: ${{ github.workspace }}/m3-core-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/core/
            /m3/build.sh
            /m3/lexicon/english-demo.txt
            /m3/lexicon/synexia-number-target-map.tsv
            /m3/lexicon/synexia-precompute-field-map.tsv
            /m3/lexicon/synexia-source-manifest.tsv
            /m3/lexicon/synexia-word-source-revisions.tsv
            /m3/tooling/joined-range-directory/current-baseline/
            /m3/tooling/joined-range-directory/current-module/COMPOSITION_BINDING.json
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Prepare exact baseline inputs without changing checked-out product sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 "$Q/bootstrap.py" --qualifier "$Q/qualify.py" \
            --profile "$Q/CURRENT_BUILD_INPUTS.json" --original "$Q/contract/ORIGINAL_BUILD_INPUTS.json" \
            --receiver "$GITHUB_WORKSPACE" --root "$PROOF" \
            --declared-transition "m3/tooling/joined-range-directory/current-module/COMPOSITION_BINDING.json"
      - name: Execute source controls and both complete original module builds
        shell: bash
        run: |
          set -euo pipefail
          for phase in controls runtime; do
            python3 "$Q/qualify.py" --crate "$Q" --emitted "$PWD" \
              --inputs "$PROOF/inputs" --out "$PROOF/result" --jdk "$JAVA_HOME" --bash /bin/bash \
              --historical-workspace "$PROOF/historical" --phase "$phase"
          done
          test "$(du -s -B1 "$PROOF" | cut -f1)" -le 536870912
          test "$(df -B1 --output=avail "$PROOF" | tail -1)" -ge 8589934592
      - name: Retain source identities, complete original logs and notices
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-current-core-runtime
          if-no-files-found: warn
          path: |
            ${{ env.PROOF }}/BOOTSTRAP.json
            ${{ env.PROOF }}/result/*.json
            ${{ env.PROOF }}/result/*.log
            ${{ env.PROOF }}/inputs/notices/
