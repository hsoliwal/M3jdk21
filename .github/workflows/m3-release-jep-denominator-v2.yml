name: M3 released JEP denominator v2

on:
  pull_request:
    paths:
      - "m3/backports/JEP_CATALOGUE.tsv"
      - "m3/backports/RELEASE_JEP_AUTHORITY.tsv"
      - "m3/backports/BACKPORT_PASSES.tsv"
      - "m3/backports/BACKPORT_WORK_QUEUE.tsv"
      - "m3/backports/program_status.py"
      - "m3/backports/test_program_status.py"
      - "m3/backports/release_jep_authority.py"
      - "m3/backports/test_release_jep_authority.py"
      - "m3/backports/verify.py"
      - "m3/backports/README.md"
      - "m3/backports/PROGRAM_STATUS_2026-10-04.md"
      - "m3/backports/recipes/release-jep-denominator-v2/**"
      - "m3/tooling/migration-recipes/**"
      - ".github/workflows/m3-release-jep-denominator-v2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  denominator:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Runner and diff probe
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          git diff --check

      - name: 2 - Released denominator and queue proof
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q m3/backports
          (
            cd m3/backports
            python3 -m unittest -v               test_release_jep_authority.py               test_program_status.py
          )
          python3 m3/backports/verify.py --root .

      - name: 3 - OpenRewrite recipe and scope JUnit proof
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/pom.xml             -pl tooling/migration-recipes -am             -Dtest=M3ReleaseJepDenominatorRecipeTest,M3RecipeScopeDeclarationTest             -Dsurefire.failIfNoSpecifiedTests=false             test

      - name: 4 - Build DAG control plane
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/pom.xml             -pl tooling/backport-dag -am             -DskipTests install

      - name: 5 - Validate evidence-bound packet
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=com.m3.tooling.dag.M3BackportPacketMain             -Dexec.args="$PWD/m3/backports/recipes/release-jep-denominator-v2/packet.tsv $PWD/m3/backports/recipes/release-jep-denominator-v2/atom-evidence.tsv"             exec:java

      - name: 6 - Project canonical DAG to Camel Airflow and Drools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/release-jep-denominator-v2
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=com.m3.tooling.dag.M3OrchestrationProjectionMain             -Dexec.args="$PWD/m3/backports/recipes/release-jep-denominator-v2/packet.tsv $PWD/target/release-jep-denominator-v2 $PWD/m3/backports/recipes/release-jep-denominator-v2/atom-evidence.tsv"             exec:java
          test -s target/release-jep-denominator-v2/M3BackportRoutes.java
          test -s target/release-jep-denominator-v2/m3_backport_dag.py
          test -s target/release-jep-denominator-v2/m3_backport_rules.drl
          test -s target/release-jep-denominator-v2/projection.tsv
          test -s target/release-jep-denominator-v2/atom-evidence.tsv

      - name: 7 - Upload orchestration evidence
        uses: actions/upload-artifact@v4
        with:
          name: released-jep-denominator-v2
          path: target/release-jep-denominator-v2
          if-no-files-found: error
          retention-days: 30
