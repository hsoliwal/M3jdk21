# SPDX-License-Identifier: Apache-2.0
name: M3 source-byte line index Java21 C11 JNI
on:
  pull_request:
    paths:
      - 'm3/ports/capability-runtime/**'
      - '.github/workflows/m3-cpu-byte-line-index-20261015.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real JDK21 source, UBSan C11, JNI parity, developer image
        run: |
          python3 m3/ports/capability-runtime/verify_native.py --root m3/ports/capability-runtime --out "$RUNNER_TEMP/m3-byte-line-index-proof" --developer-image
          test -s "$RUNNER_TEMP/m3-byte-line-index-proof/REPORT.json"
          grep -q 'M3_BYTE_LINE_INDEX_PASS' "$RUNNER_TEMP/m3-byte-line-index-proof/line-index-java-oracle.log"
          grep -q 'M3_BYTE_LINE_INDEX_PASS' "$RUNNER_TEMP/m3-byte-line-index-proof/line-index-jni-oracle.log"
      - name: Publish real Java and native witness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-byte-line-index-jdk21-jni
          path: ${{ runner.temp }}/m3-byte-line-index-proof/
          if-no-files-found: error
  java21-windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
      - name: Admit long repository paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: m3/ports/capability-runtime
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java source-only proof (no WSL)
        shell: pwsh
        run: |
          python m3/ports/capability-runtime/verify_native.py --root m3/ports/capability-runtime --out "${{ runner.temp }}/m3-byte-line-index-java" --java-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
