# SPDX-License-Identifier: Apache-2.0
name: M3 LeetCode arrayification five-provider Java/JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ArrayifiedIndexOps.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ArrayifiedIndexOpsSelfTest.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryIndexViews.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryArrayificationTest.java'
      - 'm3/collections/qualification/m3-arrayification-20261018/**'
      - '.github/workflows/m3-leetcode-arrayification-20261018.yml'
  workflow_dispatch:
jobs:
  m3-arrayification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Real Maven OpenRewrite recipe and exact generated postimages
        run: |
          set -eu
          TASK=m3/collections/qualification/m3-arrayification-20261018
          RES="$TASK/recipe/src/main/resources/com/synexia/rewrite/arrayification-20261018"
          mvn -B -ntp -f "$TASK/recipe/pom.xml" test
          cmp -s m3/collections/src/main/java/com/m3/collections/M3ArrayifiedIndexOps.java "$RES/M3ArrayifiedIndexOps.java"
          cmp -s m3/collections/src/test/java/com/m3/collections/M3ArrayifiedIndexOpsSelfTest.java "$RES/M3ArrayifiedIndexOpsSelfTest.java"
          cmp -s m3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryIndexViews.java "$RES/M3FiveLibraryIndexViews.java"
          cmp -s m3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryArrayificationTest.java "$RES/M3FiveLibraryArrayificationTest.java"
      - name: Strict Java21 with actual C17 JNI selector
        run: |
          set -eu
          SRC=m3/collections/src/main/java/com/m3/collections
          OUT="$RUNNER_TEMP/m3-arrayification"
          mkdir -p "$OUT/classes" "$OUT/native"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$OUT/classes" \
            "$SRC/M3IndexMaskCompactor.java" "$SRC/M3ArrayifiedIndexOps.java" \
            m3/collections/src/test/java/com/m3/collections/M3ArrayifiedIndexOpsSelfTest.java
          java -cp "$OUT/classes" com.m3.collections.M3ArrayifiedIndexOpsSelfTest
          cc -std=c17 -fPIC -shared -O1 -g -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$OUT/native/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$OUT/native" -cp "$OUT/classes" \
            com.m3.collections.M3ArrayifiedIndexOpsSelfTest
      - name: Actual JDK Guava Eclipse Apache and Spring module contracts
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/pom.xml test install
          mvn -B -ntp -f m3/collections/interop/pom.xml test
