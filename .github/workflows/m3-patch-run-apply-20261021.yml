name: M3JDK21 original packed patch run application

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3Patch.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3PatchApplyRunsContract.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3PatchApplyRunsTest.java'
      - 'm3/collections/qualification/patch-runs-20261021/**'
      - '.github/workflows/m3-patch-run-apply-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse source drift from canonical Maven/OpenRewrite output templates
        shell: bash
        run: |
          printf '%s  %s\n' \
            '5901276ed3ee3a295cf80f359549f8f426eb26d390874bc961143ba4e5b5c396' 'm3/collections/src/main/java/jdk/m3/collections/M3Patch.java' \
            '6a0df4d0dff4ee1c5330cf89de790d4c6257b224a6d30ebc3dfe5c59ff01fbd9' 'm3/collections/src/test/java/jdk/m3/collections/M3PatchApplyRunsContract.java' \
            'd36333cdd12e93d1778192b4beb3a571d36609e87aa84e22a929854596fba521' 'm3/collections/src/test/java/jdk/m3/collections/M3PatchApplyRunsTest.java' | sha256sum -c -
      - name: Strict compile full original owner and test all Java21 VM modes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m3-patch-classes"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/m3-patch-classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3Patch.java \
            m3/collections/src/test/java/jdk/m3/collections/M3PatchApplyRunsContract.java
          for mode in default interpreter c1 non-tiered; do
            case "$mode" in
              default) opts=() ;;
              interpreter) opts=(-Xint) ;;
              c1) opts=(-XX:TieredStopAtLevel=1) ;;
              non-tiered) opts=(-XX:-TieredCompilation) ;;
            esac
            java "${opts[@]}" -cp "$RUNNER_TEMP/m3-patch-classes" \
              jdk.m3.collections.M3PatchApplyRunsContract | tee "$RUNNER_TEMP/patch-$mode.txt"
            grep -Fx 'M3_PATCH_RUN_APPLY_PASS checks=125036' "$RUNNER_TEMP/patch-$mode.txt"
          done
