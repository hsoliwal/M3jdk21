# Standalone rule (2026-10-31): no live workflow fetches the donor repository or reads a donor secret;
# donor lineage lives in m3/tooling/standalone/ (LINEAGE_SOURCES.tsv, ledger and rules).
name: M3 standalone references

# Former triggers (below, as of the move) now start job(s) 'm3-standalone-refs__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/tooling/standalone/**'
#         - 'm3/ports/collections/verify_collection_port_wave1.py'
#         - '.github/workflows/**'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  references:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Ledger tool, lineage-ledger consumers and live-workflow fetch guard
        run: python3 -m unittest -v m3/tooling/standalone/tools/test_refs_ledger.py
