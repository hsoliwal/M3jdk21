name: M3 Parallel Bulk Compiler V2

on:
  pull_request:
    paths:
      - 'm3/ports/parallel-bulk/pom.xml'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/m3-parallel-bulk-compiler-repair/**'
      - 'm3/tooling/migration-recipes/tasks/parallel-bulk-compiler-repair/source-lock-v2-20261014.json'
      - '.github/workflows/m3-parallel-bulk-compiler-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-recipe-postimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify hash-pinned exact source and Maven compiler contract
        run: |
          python3 - <<'PY'
          import hashlib, xml.etree.ElementTree as ET
          from pathlib import Path
          root = Path('.')
          source = root / 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/m3-parallel-bulk-compiler-repair/'
          target, before, after, template = (source/'manifest.tsv').read_text().strip().split('\t')
          data = (root/target).read_bytes()
          assert hashlib.sha256(data).hexdigest() == after
          assert data == (source/template).read_bytes()
          assert hashlib.sha256((source/'before-parallel-bulk-pom.xml.txt').read_bytes()).hexdigest() == before
          project = ET.fromstring(data)
          ns = {'m':'http://maven.apache.org/POM/4.0.0'}
          plugins = project.findall('.//m:build/m:plugins/m:plugin', ns)
          compiler = [p for p in plugins if p.findtext('m:artifactId', namespaces=ns) == 'maven-compiler-plugin']
          assert len(compiler) == 1
          config = compiler[0].find('m:configuration',ns)
          assert config.find('m:release',ns) is None
          assert config.findtext('m:source',namespaces=ns) == '21'
          assert config.findtext('m:target',namespaces=ns) == '21'
          arguments = [x.text for x in config.findall('m:compilerArgs/m:arg',ns)]
          assert '--patch-module' in arguments and '--add-exports' in arguments and '-Werror' in arguments
          ids = [x.text for x in project.findall('m:profiles/m:profile/m:id', ns)]
          assert 'm3-synexia-atom-pattern' in ids
          assert 'm3-synexia-atom-pattern-mastery' in ids
          print('PASS exact POM SHA, current profiles, Java21 compiler arguments')
          PY

  compiler-and-cpu-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile isolated java.base sources and execute real parallel provider oracle
        run: bash m3/ports/parallel-bulk/verification/verify.sh

  full-module-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install source-built JUnit runtime
        run: >
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl junit-jupiter-5.10.2,junit-platform-launcher-1.10.2
          -am -DskipTests install
      - name: Install actual m3.parallel dependency
        run: mvn -B -ntp -f m3/ports/parallel/pom.xml -DskipTests install
      - name: Execute full real source JUnit suite
        run: mvn -B -ntp -f m3/ports/parallel-bulk/pom.xml test
