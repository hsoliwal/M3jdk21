# SPDX-License-Identifier: Apache-2.0
name: M3 long-range arrays with real JNI masks
on:
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/M3LongRangeSet.java"
      - "m3/collections/src/test/java/com/m3/collections/M3LongRangeSet*.java"
      - "m3/collections/qualification/long-range-set-20261017/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3jdk21-long-range-array-flags-20261017/**"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3jdk21-long-range-array-flags-20261017.yml"
      - ".github/workflows/m3-long-range-arrays-jni-20261017.yml"
  push:
    branches: [m3/range-array-mask-receiver-20261017]
permissions:
  contents: read
jobs:
  real-java21-recipe-and-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail closed on source/postimage/owner drift
        shell: bash
        run: |
          set -euxo pipefail
          python3 -S m3/collections/qualification/long-range-set-20261017/verify.py
      - name: Actual Maven OpenRewrite AST source generation and refusals
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/qualification/long-range-set-20261017/recipe/pom.xml test
      - name: Strict current M3 Java and module owner JUnit
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z | \
            xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          javac --release 21 -proc:none -Xlint:all -Werror -cp proof/classes -d proof/classes \
            m3/collections/src/test/java/com/m3/collections/M3LongRangeSetSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexPathMasksSelfTest.java
          java -Xmx128m -cp proof/classes com.m3.collections.M3LongRangeSetSelfTest | tee proof/long-range-java.log
          grep -q 'PASS M3LongRangeSetSelfTest oracleChecks=' proof/long-range-java.log
          java -Xint -Xmx128m -cp proof/classes com.m3.collections.M3LongRangeSetSelfTest
          mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongRangeSetTest test
      - name: Unchanged C17 JNI binary, checked native oracle and range selection
        shell: bash
        run: |
          set -euxo pipefail
          javac --release 21 -proc:none -h proof/native -cp proof/classes \
            -d proof/classes m3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror -pedantic \
            -fPIC -shared -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o proof/native/libm3_collections_pathmask.so
          nm -D proof/native/libm3_collections_pathmask.so | \
            grep Java_com_m3_collections_M3IndexPathMasks_selectNative
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx128m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3IndexPathMasksSelfTest --native | tee proof/pathmask-native.log
          grep -q 'JNI=true' proof/pathmask-native.log
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx128m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3LongRangeSetSelfTest | tee proof/long-range-native.log
          grep -q 'PASS M3LongRangeSetSelfTest oracleChecks=' proof/long-range-native.log
          python3 -S m3/collections/qualification/long-range-set-20261017/verify.py
          git diff --exit-code
      - name: Retain build evidence and actual errors
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-long-range-proof-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/qualification/long-range-set-20261017/recipe/target/surefire-reports/
            m3/collections/target/surefire-reports/
