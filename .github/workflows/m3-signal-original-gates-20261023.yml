# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original javac service and source-vendored JUnit admission
on:
  pull_request:
    paths:
      - 'm3/compiler/source-signals/pom.xml'
      - '.github/workflows/m3-source-signal-image-20261022.yml'
      - '.github/workflows/m3-signal-original-gates-20261023.yml'
      - 'm3/qualification/signal-original-gates-20261023/**'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-signals-original-javac-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Fail closed on product source drift
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/master...HEAD
          bash m3/qualification/signal-original-gates-20261023/verify.sh
      - name: Original M3 SourceSignals Maven JUnit including actual javac provider
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/compiler/source-signals/pom.xml \
            -Dtest=M3SourceSignalPluginJUnitTest test
          descriptor=m3/compiler/source-signals/target/classes/META-INF/services/com.sun.source.util.Plugin
          test -f "$descriptor"
          grep -Fxq 'com.m3.compiler.signals.M3SourceSignalPlugin' "$descriptor"

  exact-source-vendored-original-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify both unmodified source-vendored JUnit donor bodies
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          python3 m3/vendor/third_party/junit-platform-launcher-1.10.2/verify_source.py
      - name: Build original source-vendored Jupiter AND independent Platform Launcher
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2,junit-platform-launcher-1.10.2 \
            -am -DskipTests install
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py \
            m3/vendor/third_party/junit-jupiter-5.10.2/target/junit-jupiter-5.10.2-m3-source-1.jar
          python3 m3/vendor/third_party/junit-platform-launcher-1.10.2/verify_source.py \
            m3/vendor/third_party/junit-platform-launcher-1.10.2/target/junit-platform-launcher-1.10.2-m3-source-1.jar
      - name: Build unchanged original array substrate before collections JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Run original M3JDK21 collection JUnit without replacing its custom dependencies
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3SignalColumnsTest,M3SourceSignalImageTest,M3SignalDimensionsTest
          test
