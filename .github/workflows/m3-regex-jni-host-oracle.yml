name: M3 regex JNI host boundary oracle
on:
  pull_request:
    paths:
      - 'test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.java'
      - 'test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.c'
      - 'm3/runtime-integration/regex-jni-oracle/**'
      - '.github/workflows/m3-regex-jni-host-oracle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  host-jni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.java
            test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.c
            m3/runtime-integration/regex-jni-oracle/run-host-proof.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and execute strict JNI host oracle
        run: bash m3/runtime-integration/regex-jni-oracle/run-host-proof.sh
