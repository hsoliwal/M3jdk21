name: M3 regex JNI host boundary oracle
# Former triggers (below, as of the move) now start job(s) 'm3-regex-jni-host-oracle__*' in
# .github/workflows/checks-superset-09.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.java'
#         - 'test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.c'
#         - 'm3/runtime-integration/regex-jni-oracle/**'
#         - '.github/workflows/m3-regex-jni-host-oracle.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host-jni:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.java
            test/jdk/java/lang/String/M3StringRegexNativeBridgeTest.c
            m3/runtime-integration/regex-jni-oracle/run-host-proof.sh
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and execute strict JNI host oracle
        run: bash m3/runtime-integration/regex-jni-oracle/run-host-proof.sh
