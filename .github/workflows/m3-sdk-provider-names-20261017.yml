# SPDX-License-Identifier: Apache-2.0
name: M3 SDK five-provider names and indexed multivalue Java JNI
on:
  pull_request:
    paths:
      - 'm3/collections/qualification/m3-sdk-provider-names-20261017/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionSdkNames.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedMultiValueMap.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3CollectionSdkContractSelfTest.java'
      - 'm3/collections/src/main/resources/com/m3/collections/M3_SDK_FAMILY_CATALOG.tsv'
      - 'm3/docs/name-mapping.d/m3-sdk-provider-names-20261017.json'
      - '.github/workflows/m3-sdk-provider-names-20261017.yml'
  workflow_dispatch:
jobs:
  m3-sdk-provider-qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Canonical Maven recipe self-test and exact fixed point
        run: |
          set -eu
          RECIPE=m3/collections/qualification/m3-sdk-provider-names-20261017/recipe
          mvn -B -ntp -f "$RECIPE/pom.xml" verify
          java -cp "$RECIPE/target/classes" com.synexia.m3.M3SdkNamesRecipe --check .
      - name: Compile actual existing M3 key map and new SDK source with strict Java 21
        run: |
          set -eu
          ROOT=m3/collections/src/main/java/com/m3/collections
          mkdir -p "$RUNNER_TEMP/m3sdk-classes" "$RUNNER_TEMP/m3sdk-native"
          javac --release 21 -proc:none -Xlint:all -Werror \
            -d "$RUNNER_TEMP/m3sdk-classes" \
            "$ROOT/M3SlotArrays.java" "$ROOT/M3SlotMap.java" \
            "$ROOT/M3SlotSpliterators.java" "$ROOT/M3OrderedSlotMap.java" \
            "$ROOT/M3LinkedHashMap.java" "$ROOT/M3IndexMaskCompactor.java" \
            "$ROOT/M3CollectionSdkNames.java" "$ROOT/M3IndexedMultiValueMap.java" \
            m3/collections/src/test/java/com/m3/collections/M3CollectionSdkContractSelfTest.java
          java -cp "$RUNNER_TEMP/m3sdk-classes:m3/collections/src/main/resources" \
            com.m3.collections.M3CollectionSdkContractSelfTest
      - name: Real unchanged JNI index-mask C17 backend with checked JNI and UBSan
        run: |
          set -eu
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$RUNNER_TEMP/m3sdk-native/libm3_collections_mask.so"
          java -Xcheck:jni \
            -Djava.library.path="$RUNNER_TEMP/m3sdk-native" \
            -cp "$RUNNER_TEMP/m3sdk-classes:m3/collections/src/main/resources" \
            com.m3.collections.M3CollectionSdkContractSelfTest
      - name: Verify owning M3 Collections Maven module
        run: mvn -B -ntp -f m3/collections/pom.xml test
