name: M3 parser intake review ledger closure
# Former triggers (below, as of the move) now start job(s) 'm3-parser-intake-ledger-20261026__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/docs/m3-direct-copy-review.tsv'
#         - '.github/workflows/m3-parser-intake-ledger-20261026.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-review-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run unchanged original upstream-reuse and intake policy checks
        run: |
          set -euo pipefail
          python3 m3/compatibility/check_m3_full_family.py
          python3 m3/compatibility/check_m3_full_borrow_receiver.py
          python3 m3/runtime-integration/verify-m3-intake.py
      - name: Require all 29 independent rights reviews to remain pending
        run: |
          python3 - <<'PY'
          import csv
          with open('m3/docs/m3-direct-copy-review.tsv', encoding='utf-8') as stream:
              rows = list(csv.DictReader(stream, delimiter='\t'))
          assert len(rows) == len({r['mapping_id'] for r in rows}) == 29
          assert all(r['review_status'] == 'REVIEW_REQUIRED' for r in rows)
          for ident in ('m3.build.change-journal-doclint', 'm3.regex.prepared-utf16-effects.receiver'):
              row = next(r for r in rows if r['mapping_id'] == ident)
              assert 'relicense' in row['required_resolution'].lower()
              assert 'reimplementation' in row['required_resolution'].lower()
          print('M3_PARSER_INTAKE_LEDGER_PENDING_PASS reviews=29 append=2')
          PY
