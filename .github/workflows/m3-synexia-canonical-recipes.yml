name: M3 Synexia canonical recipe consumer

on:
  pull_request:
    paths:
      - "m3/docs/SYNEXIA_CONVERGENCE_MODEL.md"
      - "m3/compatibility/synexia-recipe-ownership.tsv"
      - "m3/compatibility/synexia-recipe-home-pin.tsv"
      - "m3/compatibility/nebula-proven-recipe-transfer.tsv"
      - "m3/compatibility/test_nebula_proven_recipe_transfer.py"
      - "m3/compatibility/check_synexia_recipe_ownership.py"
      - "m3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/atom/**"
      - "m3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/scope/**"
      - "m3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/semantic/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/scope/M3RecipeScopeRegistry.java"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-canonical-recipe-ownership.yml"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/synexia/M3SynexiaCanonicalRecipeConsumerTest.java"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/synexia/M3SynexiaScopeKernelConsumerTest.java"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/synexia/M3SynexiaSemanticFingerprintConsumerTest.java"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/scope/M3RecipeScopeDeclarationTest.java"
      - ".github/workflows/m3-synexia-canonical-recipes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD || git diff --check

      - name: Verify exact Synexia and frozen legacy blobs
        run: python3 m3/compatibility/check_synexia_recipe_ownership.py

      - name: Verify Nebula proving-ground transfer receipt
        run: python3 m3/compatibility/test_nebula_proven_recipe_transfer.py

      - name: Compile and execute canonical recipe consumer
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3SynexiaCanonicalRecipeConsumerTest,M3SynexiaScopeKernelConsumerTest,M3SynexiaSemanticFingerprintConsumerTest,M3RecipeScopeDeclarationTest             test
