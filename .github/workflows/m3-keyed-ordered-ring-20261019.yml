# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 keyed masked completion ring
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3KeyedParallelismPlan.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3KeyedOrderRing*'
      - 'm3/collections/recipe/keyed-ordered-ring-20261019/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/keyed-ordered-ring-20261019/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-keyed-ordered-ring-20261019.yml'
      - '.github/workflows/m3-keyed-ordered-ring-20261019.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify actual OpenRewrite SDK receipt and fixed-point/refusals
        run: mvn -B -ntp -f m3/collections/recipe/keyed-ordered-ring-20261019/pom.xml clean test
      - name: Run owning M3JDK21 collection JUnit contracts
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3KeyedOrderRingTest,M3ObjectStreamContractTest test
      - name: Retain verification receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-keyed-ring-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            m3/collections/recipe/keyed-ordered-ring-20261019/target/surefire-reports/
            m3/collections/target/surefire-reports/
          if-no-files-found: warn
