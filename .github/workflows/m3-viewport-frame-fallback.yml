# SPDX-License-Identifier: Apache-2.0
name: M3 original frame-page Java fallback
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3FrameJavaContract.java'
      - 'm3/collections/qualification/viewport-frame/JAVA_FALLBACK_CURRENT_REVIEW.md'
      - '.github/workflows/m3-viewport-frame-fallback.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-owner-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit exact qualified Java source and unchanged native owners
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java)" = aefcdb933cbc2caa122a527180e20fda8e2a284d
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3FrameJavaContract.java)" = db58a90031370a5cf8dd9039dbce6306817dde46
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3MaskViewportNative.java)" = 9cdfab35cf719ccf26f61ee61e1ae10fa98eb9ad
          test "$(git hash-object m3/collections/src/main/c/m3maskviewport.c)" = f29d081e28ba8ccc4516bd28c09e738b7a408a76
          echo M3_FRAME_FALLBACK_SOURCE_ADMISSION_PASS
      - name: Compile existing Java kernel and all original frame/page contracts
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/m3-viewport-frame-fallback"
          mkdir -p "$B/classes"
          javac --release 21 -encoding UTF-8 -Xlint:all -Werror -d "$B/classes" \
            m3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java \
            m3/collections/src/main/java/com/m3/collections/M3MaskViewportNative.java \
            m3/collections/src/test/java/com/m3/collections/M3MaskViewportKernelContract.java \
            m3/collections/src/test/java/com/m3/collections/M3MaskViewportPageContract.java \
            m3/collections/src/test/java/com/m3/collections/M3FrameJavaContract.java
          for mode in mixed interpreted; do
            opts=(); if [[ "$mode" == interpreted ]]; then opts=(-Xint); fi
            java "${opts[@]}" -ea -Xmx64m -XX:+UseSerialGC -cp "$B/classes" \
              com.m3.collections.M3FrameJavaContract | tee "$B/frame-$mode.log"
            grep -qx 'M3_FRAME_JAVA_PASS checks=35080 digest=ed73ef29740c1e87' "$B/frame-$mode.log"
            java "${opts[@]}" -ea -Xmx64m -XX:+UseSerialGC -cp "$B/classes" \
              com.m3.collections.M3MaskViewportKernelContract | tee "$B/kernel-$mode.log"
            grep -q 'PASS checks=94442 jni=false' "$B/kernel-$mode.log"
            java "${opts[@]}" -ea -Xmx64m -XX:+UseSerialGC -cp "$B/classes" \
              com.m3.collections.M3MaskViewportPageContract | tee "$B/page-$mode.log"
            grep -q 'M3_MASK_VIEWPORT_PAGE_PASS checks=121831 existingJni=false' "$B/page-$mode.log"
          done
          cmp "$B/frame-mixed.log" "$B/frame-interpreted.log"
          cmp "$B/kernel-mixed.log" "$B/kernel-interpreted.log"
          cmp "$B/page-mixed.log" "$B/page-interpreted.log"
          echo M3_FRAME_FALLBACK_JAVA21_PASS
      - name: Preserve original Java21 contract results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-viewport-java-fallback-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/m3-viewport-frame-fallback/*.log
