# SPDX-License-Identifier: Apache-2.0
name: M3File move candidates and source recipes

on:
  push:
    branches:
      - master
      - m3/restore-merged-atoms-ci-20261022
    paths:
      - 'm3/file/**'
      - 'm3/arrays/**'
      - 'm3/collections/**'
      - '.github/workflows/m3-file-move-candidates-20261021.yml'
  pull_request:
    paths:
      - 'm3/file/**'
      - 'm3/arrays/**'
      - 'm3/collections/**'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-file-move-candidates-20261021/**'
      - '.github/workflows/m3-file-move-candidates-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  delta-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source-bound file workflow wiring
        shell: bash
        run: |
          set -euo pipefail
          bash -n m3/file/compile-dependencies.sh
          python3 -m py_compile m3/file/verify.py m3/file/test_workflow_wiring.py
          python3 -m unittest discover -s m3/file -p test_workflow_wiring.py -v
      - name: Verify M3File module and linked-image contracts
        shell: bash
        run: |
          set -euo pipefail
          deps="$RUNNER_TEMP/m3-file-move-dependencies"
          bash m3/file/compile-dependencies.sh "$JAVA_HOME" "$deps"
          python3 m3/file/verify.py --java-home "$JAVA_HOME" --module-path "$deps" --output "$RUNNER_TEMP/m3-file-move-contract"
