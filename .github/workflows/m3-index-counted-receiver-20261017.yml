# SPDX-License-Identifier: Apache-2.0
name: M3 sorted counted collections Java21 JNI receiver
on:
  push:
    branches: ["m3/filtered-sorted-counts-java-jni-20261017"]
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/MIndexSpace.java"
      - "m3/collections/src/main/java/com/m3/collections/M3Index*"
      - "m3/collections/src/main/java/com/m3/collections/M3FilteredSortedMultisets.java"
      - "m3/collections/src/test/java/com/m3/collections/M3FilteredSortedMultiset*"
      - "m3/collections/src/test/java/com/m3/collections/M3IndexCountKernelJniParityProof.java"
      - "m3/collections/src/main/native/collections/m3_count_kernel.c"
      - "m3/collections/wrappers/index-counted-receiver-20261017/**"
      - ".github/workflows/m3-index-counted-receiver-20261017.yml"
jobs:
  exact-maven-openrewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute retained Java LST and native text recipes, fixed-point and source refusal
        run: mvn -B -ntp -f m3/collections/wrappers/index-counted-receiver-20261017/recipe/pom.xml -Dtest=M3Jdk21IndexCountedReceiverRecipeTest test
  exact-java21-jni-5-gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: SHA256 template and product equality, strict javac/JNI, all five GCs and interpreter
        run: sh m3/collections/wrappers/index-counted-receiver-20261017/verify.sh
