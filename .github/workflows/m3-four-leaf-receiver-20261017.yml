# SPDX-License-Identifier: Apache-2.0
name: M3 source-pinned four-leaf and filtered-wrapper receiving

# Former triggers (below, as of the move) now start job(s) 'm3-four-leaf-receiver-20261017__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/compatibility/M3AtomicLeafReceiverVerifier.java'
#         - 'm3/compatibility/m3-four-leaf-candidate-20261017.tsv'
#         - 'm3/compatibility/m3-filtered-wrapper-candidates-20261017.tsv'
#         - 'm3/compatibility/M3_MINDEX_FOUR_LEAF_HANDOFF_20261017.md'
#         - '.github/workflows/m3-four-leaf-receiver-20261017.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-read-only-receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source-only provenance and qualification gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/m3-leaf-receiver
          javac --release 21 -Xlint:all -Werror -d build/m3-leaf-receiver \
            m3/compatibility/M3AtomicLeafReceiverVerifier.java
          java -cp build/m3-leaf-receiver M3AtomicLeafReceiverVerifier --self-test \
            m3/compatibility/m3-four-leaf-candidate-20261017.tsv \
            m3/compatibility/m3-filtered-wrapper-candidates-20261017.tsv
          git diff --check HEAD^ HEAD
