# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original source signal dependency epochs
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalDependencyEpochs.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalQualitySchema.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SourceSignalQualityFactory.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalDependencyEpochs*.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalQualitySchema*.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SourceSignalQualityFactory*.java'
      - 'm3/collections/qualification/signal-dependency-epochs-20261024/**'
      - '.github/workflows/m3-signal-dependency-epochs-20261024.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-java21-compiler-and-graph-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile actual M3JDK21 relation owner and exact new source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-signal-epochs"
          mkdir -p "$out/classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalDependencyEpochs.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalQualitySchema.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalQualityFactory.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalDependencyEpochsSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalQualitySchemaSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SourceSignalQualityFactorySelfTest.java
          java -Xss256k -cp "$out/classes" com.m3.collections.M3SignalDependencyEpochsSelfTest
          java -Xint -cp "$out/classes" com.m3.collections.M3SignalDependencyEpochsSelfTest
          java -cp "$out/classes" com.m3.collections.M3SignalQualitySchemaSelfTest
          java -Xint -cp "$out/classes" com.m3.collections.M3SignalQualitySchemaSelfTest
          java -cp "$out/classes" com.m3.collections.M3SourceSignalQualityFactorySelfTest
          java -Xint -cp "$out/classes" com.m3.collections.M3SourceSignalQualityFactorySelfTest
  original-source-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build original source-vendored JUnit dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Build original arrays dependency for real collections Maven module
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Run original owning JUnit test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3SignalDependencyEpochsTest,M3SignalQualitySchemaTest,M3SourceSignalQualityFactoryTest test
