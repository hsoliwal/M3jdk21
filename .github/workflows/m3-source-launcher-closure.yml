name: M3 source-built launcher closure

on:
  pull_request:
    paths:
      - 'm3/synexia-import/pure-int-recipe-custody/source-launcher-closure-lock.json'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/m3-source-launcher-closure-20261013/**'
      - '.github/workflows/m3-source-launcher-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-installer-regression:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore sealed legacy recipe custody from Synexia
        uses: ./.github/actions/legacy-recipe-custody
        with:
          token: ${{ secrets.SYNEXIA_READ_TOKEN || github.token }}
      - name: Check exact recipe-owned target bytes
        shell: bash
        run: |
          set -euo pipefail
          source=m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/m3-source-launcher-closure-20261013
          target=m3/synexia-import/pure-int-recipe-custody
          cmp "$source/install.sh.txt" "$target/install.sh"
          cmp "$source/test_source_bootstrap.py.txt" "$target/test_source_bootstrap.py"
      - name: Check shell syntax
        run: bash -n m3/synexia-import/pure-int-recipe-custody/install.sh
      - name: Run isolated source-launcher refusal tests
        run: python3 -S m3/synexia-import/pure-int-recipe-custody/test_source_bootstrap.py -v

  actual-vendored-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Restore sealed legacy recipe custody from Synexia
        uses: ./.github/actions/legacy-recipe-custody
        with:
          token: ${{ secrets.SYNEXIA_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install complete pinned source-built test and recipe toolchain
        run: bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - name: Compile and test existing recipe receiver plus launcher closure
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3SourceLauncherClosureRecipeTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
