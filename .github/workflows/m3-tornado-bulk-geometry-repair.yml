name: M3 Tornado Bulk Geometry Repair

on:
  pull_request:
    paths:
      - 'm3/ports/tornadovm-bulk/src/test/java/com/m3/tornado/Rv32iBulkExecutorAdapterTest.java'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3TornadoBulkGeometryRepairReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3TornadoBulkGeometryRepairReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-tornado-geometry-20261013/**'
      - 'm3/tooling/migration-recipes/tasks/tornado-bulk-geometry-20261013/**'
      - '.github/workflows/m3-tornado-bulk-geometry-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-geometry-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source and recipe ownership
        shell: bash
        run: |
          set -euo pipefail
          target=m3/ports/tornadovm-bulk/src/test/java/com/m3/tornado/Rv32iBulkExecutorAdapterTest.java
          resource=m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-tornado-geometry-20261013/Rv32iBulkExecutorAdapterTest.java.txt
          cmp "$target" "$resource"
          printf '%s  %s\n' f0323ce99ce0ad5cab8b94e04252c72970e669f2098c1d8045d7e13693c716ff "$target" | sha256sum --check
          ! grep -F 'tornado.supports(task(4, 64))' "$target"
          grep -F 'tornado.supports(task(4, 4))' "$target"
      - name: Compile and execute actual java.base task-geometry contract
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/geometry-src"
          out="$RUNNER_TEMP/geometry-classes"
          tests="$RUNNER_TEMP/geometry-tests"
          mkdir -p "$src/jdk/internal/vm/parallel" "$out" "$tests"
          cp src/java.base/share/classes/jdk/internal/vm/parallel/BulkTask.java "$src/jdk/internal/vm/parallel/"
          javac -Xlint:all -Werror --patch-module "java.base=$src" -d "$out" "$src"/jdk/internal/vm/parallel/BulkTask.java
          cat >"$src/GeometrySmoke.java" <<'JAVA'
          import java.util.List;
          import jdk.internal.vm.parallel.BulkTask;
          public class GeometrySmoke {
              static BulkTask task(long global, long local) {
                  return new BulkTask("m3.rv32im.slice", global, local,
                          List.of("batch", "instructionBudget"), List.of("batch"));
              }
              public static void main(String[] args) {
                  boolean rejected = false;
                  try { task(4, 64); } catch (IllegalArgumentException expected) { rejected = true; }
                  if (!rejected) throw new AssertionError("oversized local work admitted");
                  for (int n : new int[]{1,2,3,4,8,63,64,65}) {
                      task(n, 0);
                      task(n, n);
                  }
                  System.out.println("PASS: actual BulkTask work geometry");
              }
          }
          JAVA
          javac -Xlint:all -Werror --patch-module "java.base=$out" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -d "$tests" "$src/GeometrySmoke.java"
          java --patch-module "java.base=$out" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -cp "$tests" GeometrySmoke

  recipe-custody:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install source-built OpenRewrite and JUnit runtime
        run: >
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl rewrite-java-21,rewrite-test,junit-jupiter-5.10.2,junit-platform-launcher-1.10.2
          -am -DskipTests install
      - name: Verify canonical published source-build coordinates
        run: python3 -S m3/synexia-import/pure-int-recipe-custody/verify-source-rewrite-coordinate.py
      - name: Install bounded Synexia recipe dependencies
        run: bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - name: Verify geometry receiver recipe
        run: >
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3TornadoBulkGeometryRepairReceiverRecipeTest test

  cpu-adapter-junit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/checkout@v5
        with:
          repository: hsoliwal/synexia-tornadovm
          ref: d7b4615ccaa286a1a11a60bc079969f24cc7f197
          path: target/synexia-tornadovm
      - name: Install pinned RV32IM provider with Java 21 preview ABI
        run: >
          mvn -B -ntp -f target/synexia-tornadovm/m3/cpu-gpu/pom.xml
          -Dmaven.compiler.enablePreview=true -DskipTests install
      - name: Install source-built JUnit 5.11.4
        run: >
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl junit-jupiter-5.11.4,junit-platform-launcher-1.11.4
          -am -DskipTests install
      - name: Execute CPU-only Tornado adapter regression
        run: >
          mvn -B -ntp -f m3/ports/tornadovm-bulk/pom.xml
          -Dtest=Rv32iBulkExecutorAdapterTest
          -Dmaven.compiler.enablePreview=true -Dm3.gpu=false test
