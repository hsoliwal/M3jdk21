name: M3 filtered List mutation receiver SDK and Java21
on:
  push:
    branches: ['m3/filtered-list-mutation-20261018-receiver']
  pull_request:
    paths:
      - '.github/workflows/m3-filtered-list-mutation-20261018.yml'
      - 'm3/collections/qualification/filtered-list-mutation-20261018/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3jdk21-filtered-list-mutation-20261018/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3jdk21-filtered-list-mutation-20261018.yml'
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredLists.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3FilteredListMutation*.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            m3/tooling/migration-recipes/src/main/java/com/synexia/rewrite
            m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3jdk21-filtered-list-mutation-20261018
            m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing receiver engine and pinned before source
        shell: bash
        run: |
          set -euo pipefail
          P=m3/collections/qualification/filtered-list-mutation-20261018
          test "$(git hash-object m3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java)" = d58ca50dfaeb60f581b64f43545e688aca5c6530
          mkdir -p "$P/target/pre"
          cp "$P/pre/M3FilteredLists.java.txt" "$P/target/pre/M3FilteredLists.java"
          echo "b2dc49d3a9ec43b6e6bd34cf5c6dac53057cf90f42cc9ed506d54822a760fc2d  $P/target/pre/M3FilteredLists.java" | sha256sum -c -
          { git rev-parse HEAD; java -version 2>&1; mvn -version; } > "$P/target/environment.txt"
      - name: Execute existing Java-LST recipe with real Maven SDK
        shell: bash
        run: |
          set -euo pipefail
          P=m3/collections/qualification/filtered-list-mutation-20261018
          mvn -B -ntp -f "$P/pom.xml" test | tee "$P/target/maven.log"
          grep -F 'Tests run: 4, Failures: 0, Errors: 0, Skipped: 0' "$P/target/surefire-reports/com.synexia.rewrite.FilteredListMutationRecipeTest.txt"
      - name: Generated-source red green, public API and actual receiver state
        shell: bash
        run: |
          set -euo pipefail
          P=m3/collections/qualification/filtered-list-mutation-20261018
          G="$P/target/generated/m3/collections/src"
          test "$(find "$P/target/generated" -name '*.java' | wc -l)" -eq 3
          mkdir -p "$P/target/green" "$P/target/red" "$P/target/receiver"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$P/target/green" "$G/main/java/com/m3/collections/M3FilteredLists.java" "$G/test/java/com/m3/collections/M3FilteredListMutationProof.java"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$P/target/red" "$P/target/pre/M3FilteredLists.java" "$G/test/java/com/m3/collections/M3FilteredListMutationProof.java"
          if java -ea -Xmx128m -cp "$P/target/red" com.m3.collections.M3FilteredListMutationProof > "$P/target/red.log" 2>&1; then echo 'Original unexpectedly passed'; exit 1; fi
          grep -F 'missing ConcurrentModificationException before mutation' "$P/target/red.log"
          java -ea -Xmx128m -cp "$P/target/green" com.m3.collections.M3FilteredListMutationProof | tee "$P/target/green.log"
          java -ea -Xint -Xmx128m -cp "$P/target/green" com.m3.collections.M3FilteredListMutationProof | tee "$P/target/interpreted.log"
          for L in green interpreted; do grep -F 'M3_FILTERED_LIST_MUTATION_PASS checks=775092' "$P/target/$L.log"; done
          javap -classpath "$P/target/red" -public -s com.m3.collections.M3FilteredLists > "$P/target/api-before.txt"
          javap -classpath "$P/target/green" -public -s com.m3.collections.M3FilteredLists > "$P/target/api-after.txt"
          diff -u "$P/target/api-before.txt" "$P/target/api-after.txt"
          if cmp -s m3/collections/src/main/java/com/m3/collections/M3FilteredLists.java "$P/target/pre/M3FilteredLists.java"; then
            test ! -e m3/collections/src/test/java/com/m3/collections/M3FilteredListMutationProof.java
            test ! -e m3/collections/src/test/java/com/m3/collections/M3FilteredListMutationTest.java
            echo GENERATED_NOT_RECEIVED | tee "$P/target/receiver-state.txt"
          else
            for REL in main/java/com/m3/collections/M3FilteredLists.java test/java/com/m3/collections/M3FilteredListMutationProof.java test/java/com/m3/collections/M3FilteredListMutationTest.java; do cmp "m3/collections/src/$REL" "$G/$REL"; done
            javac --release 21 -proc:none -Xlint:all -Werror -d "$P/target/receiver" m3/collections/src/main/java/com/m3/collections/M3FilteredLists.java m3/collections/src/test/java/com/m3/collections/M3FilteredListMutationProof.java
            java -ea -Xmx128m -cp "$P/target/receiver" com.m3.collections.M3FilteredListMutationProof | tee "$P/target/receiver.log"
            echo RECEIVED_AND_VERIFIED | tee "$P/target/receiver-state.txt"
          fi
          find "$P/target/generated" -name '*.java' -print0 | sort -z | xargs -0 sha256sum > "$P/target/generated-sha256.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filtered-list-mutation-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            m3/collections/qualification/filtered-list-mutation-20261018/target/generated
            m3/collections/qualification/filtered-list-mutation-20261018/target/*.txt
            m3/collections/qualification/filtered-list-mutation-20261018/target/*.log
            m3/collections/qualification/filtered-list-mutation-20261018/target/surefire-reports
