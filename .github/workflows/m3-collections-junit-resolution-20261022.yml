name: M3JDK21 original collection Maven JUnit dependency qualification
# Former triggers (below, as of the move) now start job(s) 'm3-collections-junit-resolution-20261022__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/collections/pom.xml'
#         - 'm3/collections/qualification/junit-resolution-20261022/**'
#         - '.github/workflows/m3-collections-junit-resolution-20261022.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-m3-collections-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prove standard scoped test dependency and original contract
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -Fq '<version>5.10.2</version>' m3/collections/pom.xml
          ! grep -Fq '5.10.2-m3-source-1' m3/collections/pom.xml
      - name: Build m3/arrays, which the collection module requires
        run: mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Execute original owning M3 collections signal tests
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=SignalColumnsTest,SignalDimensionsTest,SourceSignalImageTest,SignalTopKTest
          test
