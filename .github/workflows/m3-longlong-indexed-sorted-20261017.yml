# SPDX-License-Identifier: Apache-2.0
name: M3 long-long indexed sorted map Java21 / JNI parity

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongLongIndexedSortedView.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongLongIndexedSortedView*.java'
      - 'm3/collections/algorithm-catalog/longlong-indexed-sorted-20261017.tsv'
      - 'm3/collections/docs/long-long-indexed-sorted-snapshot-20261017.md'
      - 'm3/collections/JDK_FAMILY_MAP.tsv'
      - '.github/workflows/m3-longlong-indexed-sorted-20261017.yml'

permissions:
  contents: read

jobs:
  primitive-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact sources with real existing JNI-capable mask selector
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/m3-longlong-view-oracle
          javac --release 21 -Xlint:all -Werror -d target/m3-longlong-view-oracle \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/main/java/com/m3/collections/M3LongLongIndexedSortedView.java \
            m3/collections/src/test/java/com/m3/collections/M3LongLongIndexedSortedViewProof.java
          java -Xmx48m -cp target/m3-longlong-view-oracle \
            com.m3.collections.M3LongLongIndexedSortedViewProof
      - name: Maven/JUnit target receiving module
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3LongLongIndexedSortedViewTest
          -Dsurefire.failIfNoSpecifiedTests=false test
