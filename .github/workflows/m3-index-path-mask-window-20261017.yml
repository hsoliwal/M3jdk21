name: M3 indexed path mask bounded windows Java JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexPathMaskWindowSelfTest.java'
      - 'm3/collections/qualification/M3_INDEX_PATH_MASK_WINDOW_20261017.md'
      - '.github/workflows/m3-index-path-mask-window-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  path-mask-window:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile real Java 21 owner plus inherited and window regressions
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          main=m3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java
          test=m3/collections/src/test/java/com/m3/collections/M3IndexPathMaskWindowSelfTest.java
          inherited=m3/collections/src/test/java/com/m3/collections/M3IndexPathMasksSelfTest.java
          native=m3/collections/src/main/native/collections/m3_index_path_masks.c
          javac --release 21 -proc:none -Xlint:all -Werror -h "$work" \
            -d "$work" "$main" "$test" "$inherited"
          gcc -std=c17 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            "$native" -o "$work/libm3_collections_pathmask.so"
          for flags in '' '-Xint' '-XX:TieredStopAtLevel=1'; do
            java $flags -Xcheck:jni -cp "$work" \
              com.m3.collections.M3IndexPathMaskWindowSelfTest
            UBSAN_OPTIONS=halt_on_error=1 java $flags -Xcheck:jni \
              -Djava.library.path="$work" -cp "$work" \
              com.m3.collections.M3IndexPathMaskWindowSelfTest --native
            UBSAN_OPTIONS=halt_on_error=1 java $flags -Xcheck:jni \
              -Djava.library.path="$work" -cp "$work" \
              com.m3.collections.M3IndexPathMasksSelfTest --native
          done
          git diff --check
