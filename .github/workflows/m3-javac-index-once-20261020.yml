# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original javac single-parse M3AST index
on:
  pull_request:
    paths:
      - 'm3/tooling/module-packs/parser/**'
      - 'm3/tooling/shared-frontend/recipe-custody/datasets/m3-javac-index-20261020/**'
      - '.github/workflows/m3-javac-index-once-20261020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-javac-and-openrewrite:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original existing OpenRewrite SDK source-sealed replay
        run: |
          set -euo pipefail
          root="$PWD/m3/tooling/shared-frontend/recipe-custody"
          mvn -B -ntp -f "$root/pom.xml" -Pcontract \
            -Dm3.dataset=m3-javac-index-20261020 \
            "-Drecipe.owner.root=$root/sdk-owner" verify
          python3 "$root/receive.py" --dataset m3-javac-index-20261020 \
            --recipe-owner "$root/sdk-owner" --target "$PWD" --check
      - name: Original parser JMOD and javac contract phases
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-original-javac-proof"
          for phase in lint compile test runtime; do
            python3 m3/tooling/module-packs/parser/build.py \
              --jdk-home "$JAVA_HOME" --out "$out" --phase "$phase"
          done
