# SPDX-License-Identifier: Apache-2.0
name: M3 SDK actual Guava BiMap contract and unchanged JNI
on:
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3GuavaBiMap.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3LibraryCollections.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3GuavaBiMap*Test.java'
      - 'm3/collections/interop/sdk-family-bindings.tsv'
      - 'm3/collections/recipes/sdk-guava-bimap-20261017/**'
      - '.github/workflows/m3-sdk-guava-bimap-20261017.yml'
  workflow_dispatch:
jobs:
  actual-guava-bimap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute actual Maven/OpenRewrite SDK recipe qualification
        run: mvn -B -ntp -f m3/collections/recipes/sdk-guava-bimap-20261017/pom.xml clean test
      - name: Verify installed source matches all five sealed postimages
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root=Path('m3/collections/recipes/sdk-guava-bimap-20261017/src/main/resources/com/synexia/rewrite/m3-guava-bimap-20261017')
          for row in (root/'manifest.tsv').read_text().splitlines():
              path,before,after,template=row.split('\t')
              installed=Path(path).read_bytes()
              canonical=(root/template).read_bytes()
              assert hashlib.sha256(installed).hexdigest()==after, path
              assert installed==canonical, path
          print('PASS five exact SDK receiver postimages')
          PY
      - name: Compile actual M3 collection owners and run core tests
        run: mvn -B -ntp -f m3/collections/pom.xml clean install
      - name: Compile against actual Guava dependency and run contract tests
        run: mvn -B -ntp -f m3/collections/interop/pom.xml test
      - name: Check unchanged JNI mask backend under native checked mode
        run: |
          set -eu
          D="$RUNNER_TEMP/m3-jni-regression"
          mkdir -p "$D/classes" "$D/native"
          TEST=m3/collections/src/test/java/com/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror \
            -cp m3/collections/target/classes -d "$D/classes" \
            "$TEST/M3IndexMaskCompactorSelfTest.java"
          cc -std=c17 -O1 -g -fPIC -shared -Wall -Wextra -Werror \
             -fsanitize=undefined -fno-sanitize-recover=all \
             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
             m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
             -o "$D/native/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$D/native" -cp "$D/classes:m3/collections/target/classes" \
             com.m3.collections.M3IndexMaskCompactorSelfTest --native
