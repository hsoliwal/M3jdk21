          SEALED
          while read -r expected path; do
            test -f "$path"
            test ! -L "$path"
            observed="$(git hash-object "$path")"
            if [[ "$observed" != "$expected" ]]; then
              echo "ORIGINAL_JDK_COLLECTION_JNI_DRIFT: $path $observed"
              exit 1
            fi
          done <<'PRESERVED'
          29bbd29f677d5eabe78bc1ff0d4f0f0878d52746 src/java.base/share/classes/java/util/ChangeJournal.java
