# Actual original M3JDK21 image and selected regex/collection/JNI tests; not full JCK.
name: M3JDK21 regex collections original image
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/java/util/regex/**'
      - 'src/java.base/share/classes/jdk/internal/mindex/M3TQ.java'
      - 'src/java.base/share/classes/jdk/internal/m3/M3IndexedView.java'
      - 'src/java.base/share/classes/jdk/internal/m3/M3IndexedArray.java'
      - 'test/jdk/jdk/internal/m3/M3IndexedSortWorkspaceTest.java'
      - 'src/java.base/share/native/libjava/M3IndexMaskWindow.c'
      - 'test/jdk/jdk/internal/m3/M3NativeCountBatchingTest.java'
      - 'test/jdk/jdk/internal/m3/M3IndexedViewLifecycleTest.java'
      - 'test/jdk/java/util/regex/M3RegexShortCircuitTest.java'
      - 'test/jdk/java/util/regex/M3RegexFrontierShortCircuitTest.java'
      - 'test/jdk/java/util/regex/M3RegexUnicodeFrontierTest.java'
      - 'test/jdk/java/util/regex/M3RegexPredicateRunTest.java'
      - 'test/jdk/java/util/regex/M3PatternStateMaskTest.java'
      - '.github/workflows/m3-regex-collection-superset.yml'
      - 'm3/qualification/regex-collection-superset/**'
      - 'src/java.base/share/classes/java/lang/M3StringRegexDp.java'
      - 'src/java.base/share/classes/java/lang/StringBuffer.java'
      - 'src/java.base/share/classes/java/util/Arrays.java'
      - 'src/java.base/share/classes/java/util/ChangeJournal.java'
      - 'test/jdk/java/lang/String/M3RegexNativeRouteProbe.java'
      - 'test/jdk/java/lang/String/M3StringRegexDpTest.java'
      - 'test/jdk/java/lang/String/M3StringRegexEffectsTest.java'
      - 'test/jdk/java/lang/String/M3StringRegexPreparedNativeTest.java'
      - 'test/jdk/java/lang/String/M3StringRegexPreparedUtf16Test.java'
      - 'test/jdk/java/lang/String/M3StringRegexPressureTest.java'
      - 'test/jdk/java/lang/StringBuffer/StringBufferRepeatCache8322512Test.java'
      - 'test/jdk/java/util/Arrays/HashCode8312164.java'
      - 'test/jdk/java/lang/String/libM3RegexNativeRouteProbe.c'
      - 'src/java.base/share/classes/java/lang/invoke/StringConcatFactory.java'
      - 'test/jdk/java/lang/String/M3StringConcatTupleTest.java'
      - 'test/jdk/java/lang/String/M3StringConcatReferenceDagTest.java'
      - 'm3/runtime-integration/check-m3string-concat-reference-dag.py'
      - 'm3/runtime-integration/test_m3string_concat_reference_dag.py'
      - 'src/java.base/share/classes/java/lang/M3StringPool.java'
      - 'test/jdk/java/lang/String/M3StringTupleReuseTest.java'
      - 'test/jdk/java/lang/String/M3StringConcatLengthOverflowTest.java'
      - 'test/jdk/jdk/internal/mindex/M3TokenRegexTest.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-jdk-source-image:
    if: github.repository == 'hsoliwal/M3jdk21'
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    steps:
      - name: Checkout exact original JDK sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: false
      - name: Java 21 boot toolchain
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse regression-source drift and unrelated collection-JNI mutations
        shell: bash
        run: |
          set -euo pipefail
          cat <<'SEALED' | sha256sum -c
          b62086cfa2ff37e6f6be94ad117511694ae87aae3bd8a0227913b58e0ae4e60b  src/java.base/share/classes/java/util/regex/M3PatternQuery.java
          6ffb6eb3bf57c56101dbcfe97e97f529324efa6363c9648065ee58302e01b48c  src/java.base/share/classes/java/util/regex/Matcher.java
          1f730adaf2e7abb82f464d75008d5884bbc121b19f9d7ff770a220edc427340e  src/java.base/share/classes/jdk/internal/mindex/M3TQ.java
