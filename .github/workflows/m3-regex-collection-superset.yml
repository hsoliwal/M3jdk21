          94d58abfabb42ff980c6714e83c763482165dc64069d4a4c0d1c14680ca7c0fd  test/jdk/java/lang/String/M3StringRegexDpTest.java
          9dd08a313a4351c146efc0fb1936d6787ca4538c3c47007441a7b7a0b3d7df1f  test/jdk/java/lang/String/M3StringRegexEffectsTest.java
          533ec17e75eea17d9756ea2d46ee0ae6a0d82f233085bfb9504652dee132399d  test/jdk/java/lang/String/M3StringRegexPreparedNativeTest.java
          eeb7d32c127111e4c4c85fe3f11df6f9e8dbe1b948bc2142df53592c2de5745d  test/jdk/java/lang/String/M3StringRegexPreparedUtf16Test.java
          45cf6f68a86bad3c0cec0cb822978f576fe4c82bf08397aa5782082cbc7a9e13  test/jdk/java/lang/String/M3StringRegexPressureTest.java
          ba2fbfa349a865c4337cdb15a97f3df6c79baa47ec0bf97491859ba918860250  test/jdk/java/lang/StringBuffer/StringBufferRepeatCache8322512Test.java
