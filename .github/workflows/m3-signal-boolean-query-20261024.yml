# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original source typed signal Boolean query Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalBooleanQuery.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalBooleanQuery*.java'
      - 'm3/collections/qualification/signal-boolean-query-20261024/**'
      - '.github/workflows/m3-signal-boolean-query-20261024.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java21 source compilation and independent bitmask oracle
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-signal-boolean-query"
          mkdir -p "$out/classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalDependencyEpochs.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalQualitySchema.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalExactRangeIndex.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalBooleanQuery.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalBooleanQuerySelfTest.java
          java -cp "$out/classes" com.m3.collections.M3SignalBooleanQuerySelfTest
          java -Xint -cp "$out/classes" com.m3.collections.M3SignalBooleanQuerySelfTest
  original-collections-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build original source-vendored Jupiter artifact
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Resolve original arrays module and execute unmodified owning JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3SignalBooleanQueryTest test
