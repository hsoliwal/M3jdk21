name: Java21 JDK-8292955 CheckedMap result-only receiver trial
on:
  pull_request:
    paths:
      - 'test/jdk/java/util/Collections/CheckedMapMerge8292955Test.java'
      - '.github/workflows/m3jdk21-checkedmap-merge-receive-20261027.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-source-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            src/java.base/share/classes/java/util/Collections.java
            test/jdk/java/util/Collections/CheckedMapMerge8292955Test.java
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source-seal exact public JDK21 preimage and test-only result
        run: |
          set -euo pipefail
          test "$(git hash-object src/java.base/share/classes/java/util/Collections.java)" = "874a056d6d1c24f4fbc0f564ba564519c9db71e7"
          test "$(git hash-object test/jdk/java/util/Collections/CheckedMapMerge8292955Test.java)" = "8d083b3104b860056ba38bd0fbc0496cbb93dbf0"
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          origin=Path("src/java.base/share/classes/java/util/Collections.java").read_bytes()
          test=Path("test/jdk/java/util/Collections/CheckedMapMerge8292955Test.java").read_bytes()
          if hashlib.sha256(origin).hexdigest() != "7dcb1bde18923274518b747ad4e65e3019046ca7742714ead678c615d99499ba":
              raise RuntimeError("original Java21 source drift")
          if hashlib.sha256(test).hexdigest() != "009524fae549ec941bdc14bc1496a3e2ac097f865d233dce9a741d8b849b2940":
              raise RuntimeError("canonical Synexia test payload changed")
          old=(b"            Objects.requireNonNull(remappingFunction);\n"
               b"            return m.merge(key, value, (v1, v2) -> {")
          new=(b"            Objects.requireNonNull(remappingFunction);\n"
               b"            typeCheck(key, value);\n"
               b"            return m.merge(key, value, (v1, v2) -> {")
          if origin.count(old) != 1:
              raise RuntimeError("canonical CheckedMap.merge atom not unique")
          temp=Path(os.environ["RUNNER_TEMP"])/"jdk8292955"
          for variant,data in (("before",origin),("after",origin.replace(old,new))):
              out=temp/variant/"src/java/util/Collections.java"
              out.parent.mkdir(parents=True,exist_ok=True)
              out.write_bytes(data)
          successor=(temp/"after/src/java/util/Collections.java").read_bytes()
          if hashlib.sha256(successor).hexdigest() != "a6425169f9395d7ee48dccbcf82b708018ac0a92f82d12825df7ec413f101c47":
              raise RuntimeError("canonical one-atom postimage SHA256 mismatch")
          print("PASS: source pre/post and GPLv2 jtreg test SHA256; exactly one Java21 validation atom")
          PY
          test "$(git hash-object "$RUNNER_TEMP/jdk8292955/after/src/java/util/Collections.java")" = "396fc39c98dfa277213c61b1c0cf5a7291e0558d"
      - name: Compile both complete source versions of java.util.Collections under Java21
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/jdk8292955"
          mkdir -p "$dir/tests"
          for revision in before after; do
            mkdir -p "$dir/$revision/classes"
            javac -g --source 21 --target 21 -Xlint:all -Werror \
              --patch-module java.base="$dir/$revision/src" \
              -d "$dir/$revision/classes" "$dir/$revision/src/java/util/Collections.java"
          done
          javac --release 21 -proc:none -Xlint:all -Werror \
            -d "$dir/tests" test/jdk/java/util/Collections/CheckedMapMerge8292955Test.java
      - name: Baseline must fail, verified source patch must pass all four JVM modes
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/jdk8292955"
          for mode in default -Xint -XX:+CompactStrings -XX:-CompactStrings; do
            args=()
            if [ "$mode" != default ]; then args=("$mode"); fi
            if java "${args[@]}" -XX:-OmitStackTraceInFastThrow \
              --patch-module java.base="$dir/before/classes" \
              -cp "$dir/tests" CheckedMapMerge8292955Test > "$dir/old.log" 2>&1; then
              echo "unexpected passing original source: $mode" >&2
              exit 1
            fi
            grep -q 'AssertionError: missing ClassCastException' "$dir/old.log"
            java "${args[@]}" -XX:-OmitStackTraceInFastThrow \
              --patch-module java.base="$dir/after/classes" \
              -cp "$dir/tests" CheckedMapMerge8292955Test > "$dir/new.log"
            grep -qx 'PASS JDK-8292955 checked-map jtreg assertions=84' "$dir/new.log"
            cat "$dir/new.log"
          done
