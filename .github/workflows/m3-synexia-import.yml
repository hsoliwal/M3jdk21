name: M3 Synexia Apache import proof

on:
  push:
    branches:
      - "m3/synexia-apache-import-*"
    paths:
      - "m3/pom.xml"
      - "m3/NOTICE"
      - "m3/README.md"
      - "m3/docs/synexia-delivery.md"
      - "m3/synexia-import/**"
      - "m3/vendor/synexia/**"
      - "m3/tooling/recipe-catalogue.tsv"
      - ".github/workflows/m3-synexia-import.yml"
  pull_request:
    paths:
      - "m3/pom.xml"
      - "m3/NOTICE"
      - "m3/README.md"
      - "m3/docs/synexia-delivery.md"
      - "m3/synexia-import/**"
      - "m3/vendor/synexia/**"
      - "m3/tooling/recipe-catalogue.tsv"
      - ".github/workflows/m3-synexia-import.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore sealed legacy recipe custody from Synexia
        uses: ./.github/actions/legacy-recipe-custody
        with:
          token: ${{ secrets.SYNEXIA_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Diff hygiene
        run: git diff --check origin/master...HEAD
      - name: Verify target-local recipe ownership classification
        run: python3 m3/runtime-integration/verify-recipe-ownership.py
      - name: Verify imported Synexia vendor snapshot and canonical recipe ownership intake
        run: >
          mvn -B -ntp
          -f m3/synexia-import/pom.xml
          verify
      - name: Verify Synexia OpenRewrite import inventory and scope registration
        run: >
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3SynexiaImportInventoryRecipeTest,M3RecipeScopeDeclarationTest
          test
