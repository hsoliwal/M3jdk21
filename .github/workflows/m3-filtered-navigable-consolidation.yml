name: M3 filtered navigable consolidation
# Former triggers (below, as of the move) now start job(s) 'm3-filtered-navigable-consolidation__*' in
# .github/workflows/checks-superset-09.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredViews.java'
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredNavigableSet.java'
#         - 'test/jdk/jdk/m3/collections/M3FilteredNavigableFacadeSelfTest.java'
#         - 'm3/collections/docs/FILTERED_SORTED_VIEWS_RECEIVING_20261017.md'
#         - 'm3/collections/qualification/filtered-navigable-consolidation-20261017/**'
#         - 'test/jdk/jdk/m3/collections/M3FilteredSortedIteratorPlanTest.java'
#         - 'test/jdk/jdk/m3/collections/M3FilteredSortedIteratorPlanSelfTest.java'
#         - 'm3/collections/qualification/filtered-plan-current-master-20261027/**'
#         - '.github/workflows/m3-filtered-navigable-consolidation.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selected-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source receipt and selected contracts
        shell: bash
        run: |
          if [[ "$(git hash-object src/jdk.m3.collections/share/classes/jdk/m3/collections/M3FilteredViews.java)" == "45ad6df3a51e83c67dc70de7c7acd82bec2305d3" ]]; then
            bash m3/collections/qualification/filtered-plan-current-master-20261027/verify.sh
          else
            bash m3/collections/qualification/filtered-navigable-consolidation-20261017/verify.sh
          fi
      - name: Explicit hold
        run: echo 'Selected collections receiver proof only; full Maven/JDK/phase promotion remains separate.'
