# SPDX-License-Identifier: Apache-2.0
name: M3 filtered navigable consolidation
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredViews.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredNavigableSet.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3FilteredNavigableFacadeSelfTest.java'
      - 'm3/collections/qualification/filtered-navigable-consolidation-20261017/**'
      - '.github/workflows/m3-filtered-navigable-consolidation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  selected-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source receipt and selected contracts
        shell: bash
        run: bash m3/collections/qualification/filtered-navigable-consolidation-20261017/verify.sh
      - name: Explicit hold
        run: echo 'Selected collections receiver proof only; full Maven/JDK/phase promotion remains separate.'
