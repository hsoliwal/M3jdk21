# SPDX-License-Identifier: Apache-2.0
name: M3 required-excluded mask selector Java JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalDimensions.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3RequiredExcludedMaskSelector*.java'
      - 'm3/collections/qualification/required-excluded-mask-selector-20261018/**'
      - '.github/workflows/m3-required-excluded-mask-selector-20261018.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java21 and checked JNI differential
        run: bash m3/collections/qualification/required-excluded-mask-selector-20261018/verify.sh
