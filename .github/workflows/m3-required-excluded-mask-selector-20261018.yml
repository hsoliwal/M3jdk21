name: M3 required-excluded mask selector Java JNI
# Former triggers (below, as of the move) now start job(s) 'm3-required-excluded-mask-selector-20261018__*' in
# .github/workflows/checks-superset-08.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexMaskCompactor.java'
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SignalDimensions.java'
#         - 'src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_compactor.c'
#         - 'test/jdk/jdk/m3/collections/M3RequiredExcludedMaskSelector*.java'
#         - 'm3/collections/qualification/required-excluded-mask-selector-20261018/**'
#         - '.github/workflows/m3-required-excluded-mask-selector-20261018.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java21 and checked JNI differential
        run: bash m3/collections/qualification/required-excluded-mask-selector-20261018/verify.sh
