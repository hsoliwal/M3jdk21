# SPDX-License-Identifier: Apache-2.0
name: M3 Spring case-indexed SDK and retained JNI proof
on:
  pull_request:
    paths:
      - "m3/collections/interop/src/main/java/com/m3/collections/interop/M3SpringCaseInsensitiveMap.java"
      - "m3/collections/interop/src/test/java/com/m3/collections/interop/M3SpringCaseInsensitive*.java"
      - "m3/collections/interop/qualification/spring-case-indexed-20261018/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-spring-case-indexed-20261018/**"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-spring-case-indexed-20261018.yml"
      - ".github/workflows/m3-spring-case-indexed-20261018.yml"
  push:
    branches: [m3/spring-case-indexed-receiver-20261018]
permissions:
  contents: read
jobs:
  strict_java_real_spring_and_existing_native:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Seal Java targets and original M3 indexed owner
        run: python3 -S m3/collections/interop/qualification/spring-case-indexed-20261018/verify.py
      - name: Actual existing Maven OpenRewrite recipe AST emission/refusal/fixed-point
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/qualification/spring-case-indexed-20261018/recipe/pom.xml -Dm3.receiver="$PWD" test
      - name: Compile current M3 and run authentic five-library provider JUnit
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/interop/pom.xml test
          python3 -S m3/collections/interop/qualification/spring-case-indexed-20261018/verify.py
      - name: Original C17 JNI mask regression, no new native ABI
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z | \
            xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          javac --release 21 -proc:none -h proof/native -cp proof/classes \
            -d proof/classes m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          javac --release 21 -proc:none -cp proof/classes -d proof/classes \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          UBSAN_OPTIONS=halt_on_error=1 java -Xcheck:jni -Xmx256m \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
          git diff --exit-code
      - name: Preserve Maven/JUnit proof and native receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-spring-case-index-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            m3/collections/interop/qualification/spring-case-indexed-20261018/recipe/target/surefire-reports/
            m3/collections/interop/target/surefire-reports/
            m3/collections/target/surefire-reports/
            proof/native/
