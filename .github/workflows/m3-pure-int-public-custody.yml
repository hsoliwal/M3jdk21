name: M3 Synexia pure-int public custody

# Former triggers (below, as of the move) now start job(s) 'm3-pure-int-public-custody__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/pom.xml'
#         - 'm3/m3-import/pure-int-recipe-custody/**'
#         - '.github/workflows/m3-pure-int-public-custody.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check



      - name: 4 - Verify local canonical GAV
        shell: bash
        run: |
          set -euo pipefail
          test -s "$HOME/.m2/repository/jdk/internal/m3/m3-openrewrite-recipes/1.0.0-SNAPSHOT/m3-openrewrite-recipes-1.0.0-SNAPSHOT.jar"
