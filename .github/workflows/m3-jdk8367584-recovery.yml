name: M3 JDK-8367584 JFR help recovery proof

on:
  pull_request:
    paths:
      - "m3/backports/recipes/jdk-8367584/**"
      - "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv"
      - "m3/tooling/recipe-catalogue.tsv"
      - "m3/tooling/backport-dag/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jdk8367584JfrOptionsHelpBackportRecipe.java"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/jdk27-jfr-options-help-8367584-*/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk27-jfr-options-help-8367584-java/**"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jdk8367584JfrOptionsHelpBackportRecipeTest.java"
      - "m3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/backport/jdk27-jfr-options-help-8367584/**"
      - "src/hotspot/share/jfr/dcmd/jfrDcmds.cpp"
      - "src/hotspot/share/jfr/dcmd/jfrDcmds.hpp"
      - "src/hotspot/share/jfr/recorder/service/jfrOptionSet.cpp"
      - "test/jdk/jdk/jfr/startupargs/TestOptionsHelp.java"
      - ".github/workflows/m3-jdk8367584-recovery.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-dag-and-static-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify packet hashes and compatibility split
        run: python3 m3/backports/recipes/jdk-8367584/verify_recovery.py
      - name: Prove OpenRewrite file atoms and module fixed point
        run: |
          mvn -B -ntp -f m3/pom.xml -pl tooling/migration-recipes -am \
            -Dtest=M3Jdk8367584JfrOptionsHelpBackportRecipeTest test
      - name: Validate and project packet DAG
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/target/jdk-8367584-orchestration"
          mkdir -p "$OUT"
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=com.m3.tooling.dag.M3OrchestrationProjectionMain \
            -Dexec.args="$PWD/m3/backports/recipes/jdk-8367584/packet.tsv $OUT" \
            exec:java
          test -s "$OUT/M3BackportRoutes.java"
          test -s "$OUT/m3_backport_dag.py"
          test -s "$OUT/m3_backport_rules.drl"
          test -s "$OUT/projection.tsv"
          ROOT="$(tail -n 1 "$OUT/projection.tsv" | cut -f2)"
          test "${#ROOT}" -eq 64
          grep -F "$ROOT" "$OUT/M3BackportRoutes.java"
          grep -F "$ROOT" "$OUT/m3_backport_dag.py"
          grep -F "$ROOT" "$OUT/m3_backport_rules.drl"
      - name: Upload orchestration projections
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdk-8367584-orchestration-${{ github.run_id }}
          path: target/jdk-8367584-orchestration/**
          if-no-files-found: error
          retention-days: 14

  hotspot-image-and-jtreg:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install OpenJDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
      - name: Configure
        run: bash configure --with-boot-jdk="$JAVA_HOME" --with-debug-level=release --with-jvm-variants=server --disable-warnings-as-errors
      - name: Build image
        run: make JOBS=2 images
      - name: Run focused JFR help jtreg
        run: make JOBS=2 test TEST="test/jdk/jdk/jfr/startupargs/TestOptionsHelp.java"
