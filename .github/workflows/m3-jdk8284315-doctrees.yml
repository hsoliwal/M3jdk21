name: M3 JDK-8284315 DocTrees bug-fix proof

on:
  pull_request:
    paths:
      - "m3/backports/recipes/jdk-8284315/**"
      - "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv"
      - "m3/tooling/recipe-catalogue.tsv"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jdk8284315*.java"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk27-*8284315/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/jdk27-*8284315/**"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jdk8284315*.java"
      - "m3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/backport/jdk27-doctrees-8284315/**"
      - "src/jdk.compiler/share/classes/com/sun/source/util/DocTrees.java"
      - "src/jdk.compiler/share/classes/com/sun/tools/javac/api/JavacTrees.java"
      - "src/jdk.javadoc/share/classes/jdk/javadoc/internal/doclets/toolkit/util/CommentHelper.java"
      - "src/jdk.javadoc/share/classes/jdk/javadoc/internal/doclint/Checker.java"
      - "test/langtools/tools/javac/doctree/DocTreesElementTypeConsistencyTest.java"
      - "test/langtools/tools/doclint/ReferenceTest.java"
      - "test/langtools/tools/doclint/ReferenceTest.out"
      - "test/langtools/jdk/javadoc/doclet/testSeeTag/TestSeeTag.java"
      - ".github/workflows/m3-jdk8284315-doctrees.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-dag-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check

      - name: 2 - Prove hash-pinned semantic and expectation recipes
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest='M3Jdk8284315BackportRecipeTest,M3Jdk8284315TestExpectationsRecipeTest' \
            test

      - name: 3 - Validate and project FILE -> MODULE -> LIBRARY_API packet
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/target/jdk-8284315-orchestration"
          mkdir -p "$OUT"
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=com.m3.tooling.dag.M3OrchestrationProjectionMain \
            -Dexec.args="$PWD/m3/backports/recipes/jdk-8284315/packet.tsv $OUT" \
            exec:java
          test -s "$OUT/M3BackportRoutes.java"
          test -s "$OUT/m3_backport_dag.py"
          test -s "$OUT/m3_backport_rules.drl"
          test -s "$OUT/projection.tsv"
          ROOT="$(tail -n 1 "$OUT/projection.tsv" | cut -f2)"
          test "${#ROOT}" -eq 64
          grep -F "$ROOT" "$OUT/M3BackportRoutes.java"
          grep -F "$ROOT" "$OUT/m3_backport_dag.py"
          grep -F "$ROOT" "$OUT/m3_backport_rules.drl"
          grep -F $'library-api-join\tLIBRARY_API' m3/backports/recipes/jdk-8284315/packet.tsv

      - name: Upload orchestration projections
        uses: actions/upload-artifact@v4
        with:
          name: jdk-8284315-orchestration-${{ github.run_id }}
          path: target/jdk-8284315-orchestration/**
          if-no-files-found: error
          retention-days: 14

  langtools-image-and-jtreg:
    needs: recipe-dag-proof
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install OpenJDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: Configure Java 21-compatible M3JDK image
        run: |
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: Build image
        run: make JOBS=2 images

      - name: Run focused langtools and javadoc jtreg
        run: |
          make JOBS=2 test TEST="\
          test/langtools/tools/javac/doctree/DocTreesElementTypeConsistencyTest.java \
          test/langtools/tools/javac/doctree/ReferenceTest.java \
          test/langtools/tools/doclint/ReferenceTest.java \
          test/langtools/jdk/javadoc/doclet/testSeeTag/TestSeeTag.java"
