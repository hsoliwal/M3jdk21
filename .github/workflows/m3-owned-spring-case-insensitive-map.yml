name: Owned M3 Spring case-insensitive map contracts
on:
  pull_request:
    paths:
      - 'm3/collections/implementations/spring-case-insensitive-map/**'
      - 'm3/collections/qualification/owned-spring-case-insensitive-map-20261018/**'
      - 'm3/collections/recipe/owned-spring-case-insensitive-map-20261018/**'
      - 'm3/collections/src/main/java/**'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - '.github/workflows/m3-owned-spring-case-insensitive-map.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run source-bound original protocols and existing primitive JNI projection
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-spring-case-insensitive-map"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/native"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_Q="m3/collections/qualification/owned-spring-case-insensitive-map-20261018"
          python -I -S -B "$M3_Q/verify.py"
          M3_PROVIDER="$M3_TASK_OUT/spring-core-6.2.0.jar"
          curl --fail --location --silent --show-error --output "$M3_PROVIDER" https://repo.maven.apache.org/maven2/org/springframework/spring-core/6.2.0/spring-core-6.2.0.jar
          python -I -S -B "$M3_Q/verify.py" --jar "$M3_PROVIDER"
          gcc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" m3/collections/src/main/native/collections/m3_index_mask_compactor.c -o "$M3_TASK_OUT/native/libm3_collections_mask.so"
          python -I -S -B "$M3_Q/run_contracts.py" --jar "$M3_PROVIDER" --out "$M3_TASK_OUT/contracts" --temp "$M3_TASK_OUT/tmp" --native-library-dir "$M3_TASK_OUT/native"
          python -I -S -B "$M3_Q/verify.py" --jar "$M3_PROVIDER"
          M3_BUDGET_OUT="$M3_TASK_OUT" python -I -S -B -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["M3_BUDGET_OUT"]); assert sum(f.stat().st_size for f in p.rglob("*") if f.is_file())<=512*1024**2; assert shutil.disk_usage(p).free>=8*1024**3'
          git diff --exit-code
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run exact receiving Maven host
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-spring-case-insensitive-map-receiving"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/m2"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          export MAVEN_OPTS="-Xmx512m -XX:-UsePerfData -Djava.io.tmpdir=$M3_TASK_OUT/tmp -Duser.home=$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_Q="m3/collections/qualification/owned-spring-case-insensitive-map-20261018"
          python -I -S -B "$M3_Q/verify.py"
          mvn -B -ntp -f m3/collections/recipe/owned-spring-case-insensitive-map-20261018/pom.xml -Dmaven.repo.local="$M3_TASK_OUT/m2" -Dm3.recipe.output="$M3_TASK_OUT/target" test
          python -I -S -B "$M3_Q/verify.py"
          M3_BUDGET_OUT="$M3_TASK_OUT" python -I -S -B -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["M3_BUDGET_OUT"]); assert sum(f.stat().st_size for f in p.rglob("*") if f.is_file())<=512*1024**2; assert shutil.disk_usage(p).free>=8*1024**3'
          git diff --exit-code
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Package standalone JDK-only owner with retained licenses
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-spring-case-insensitive-map-module"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/m2"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          export MAVEN_OPTS="-Xmx512m -XX:-UsePerfData -Djava.io.tmpdir=$M3_TASK_OUT/tmp -Duser.home=$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_Q="m3/collections/qualification/owned-spring-case-insensitive-map-20261018"
          python -I -S -B "$M3_Q/verify.py"
          mvn -B -ntp -f m3/collections/implementations/spring-case-insensitive-map/pom.xml -Dmaven.repo.local="$M3_TASK_OUT/m2" -Dm3.module.output="$M3_TASK_OUT/target" package
          python -I -S -B "$M3_Q/verify_module.py" "$M3_TASK_OUT/target/m3-owned-spring-case-insensitive-map-0.1.0-SNAPSHOT.jar"
          python -I -S -B "$M3_Q/verify.py"
          M3_BUDGET_OUT="$M3_TASK_OUT" python -I -S -B -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["M3_BUDGET_OUT"]); assert sum(f.stat().st_size for f in p.rglob("*") if f.is_file())<=512*1024**2; assert shutil.disk_usage(p).free>=8*1024**3'
          git diff --exit-code
