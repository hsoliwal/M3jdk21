# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 opt-in javac source-method signals v2
on:
  pull_request:
    paths:
      - 'm3/compiler/source-signals/src/main/java/com/m3/compiler/signals/M3SourceSignalPlugin.java'
      - 'm3/compiler/source-signals/src/test/java/com/m3/compiler/signals/M3SourceSignalPluginSelfTest.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SourceMethodImage.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SourceMethodImage*.java'
      - 'm3/compiler/source-signals/qualification/method-v2-20261022/**'
      - '.github/workflows/m3-source-method-signal-v2-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  strict-compiler-original-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original source identity, SHA-256, Git blobs and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/master...HEAD
          bash m3/compiler/source-signals/qualification/method-v2-20261022/verify.sh
      - name: Compile original M3SourceSignals javac plugin and execute legacy /1 plus /2 tests
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-method-signals"
          mkdir -p "$out/plugin/META-INF/services" "$out/runtime" "$out/classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/plugin" \
            m3/compiler/source-signals/src/main/java/com/m3/compiler/signals/M3SourceSignalPlugin.java \
            m3/compiler/source-signals/src/test/java/com/m3/compiler/signals/M3SourceSignalPluginSelfTest.java
          cp m3/compiler/source-signals/src/main/resources/META-INF/services/com.sun.source.util.Plugin \
            "$out/plugin/META-INF/services/com.sun.source.util.Plugin"
          java -cp "$out/plugin" com.m3.compiler.signals.M3SourceSignalPluginSelfTest
      - name: Compile original typed Java21 source facts and source method index
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-method-signals"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/runtime" \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceMethodImage.java \
            m3/collections/src/test/java/com/m3/collections/M3SourceSignalImageSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SourceMethodImageSelfTest.java
          java -cp "$out/runtime" com.m3.collections.M3SourceSignalImageSelfTest
          java -cp "$out/runtime" com.m3.collections.M3SourceMethodImageSelfTest
      - name: Real javac ANALYZE method sidecar to original primitive relationship receiver
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-method-signals"
          mkdir -p "$out/demo"
          cat > "$out/demo/Example.java" <<'JAVA'
          package demo;
          class Example {
              static void run() { new Target().work(); }
              void invoke() { run(); }
          }
          class Target {
              void work() { }
          }
          JAVA
          javac --release 21 -proc:none -processorpath "$out/plugin" \
            "-Xplugin:M3SourceSignals out=$out/methods.tsv include=all methods=on" \
            -d "$out/classes" "$out/demo/Example.java"
          test -s "$out/methods.tsv"
          java -cp "$out/runtime" com.m3.collections.M3SourceMethodImageSelfTest \
            "$out/methods.tsv"

  original-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Original javac source-signal module JUnit
        run: >
          mvn -B -ntp -f m3/compiler/source-signals/pom.xml
          -Dtest=M3SourceSignalPluginJUnitTest test
      - name: Verify and install source-vendored exact original JUnit coordinate
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py \
            m3/vendor/third_party/junit-jupiter-5.10.2/target/junit-jupiter-5.10.2-m3-source-1.jar
      - name: Original collections module method and legacy image JUnit
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3SourceMethodImageTest,M3SourceSignalImageTest test
