name: M3 real Guava RowSortedTable recipe and five-provider contracts
on:
  pull_request:
    paths:
      - 'm3/collections/interop/**'
      - '.github/workflows/m3-guava-rowsortedtable-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            m3/tooling/migration-recipes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact canonical SHA-256 source postimage proof
        run: python3 m3/collections/interop/qualification/m3-guava-row-sorted-table-20261018/verify_receiver.py
      - name: Execute actual Maven/OpenRewrite Java source LST recipe tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp \
            -f m3/collections/interop/qualification/m3-guava-row-sorted-table-20261018/pom.xml \
            "-Dm3.engine.sources=$GITHUB_WORKSPACE/m3/tooling/migration-recipes/src/main/java" \
            clean test
      - name: Strictly compile actual M3 core owners and install local jar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-classes"
          find m3/collections/src/main/java -name '*.java' | sort > "$RUNNER_TEMP/m3-main-sources"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -d "$RUNNER_TEMP/m3-classes" @"$RUNNER_TEMP/m3-main-sources"
          jar --create --file "$RUNNER_TEMP/m3-collections.jar" -C "$RUNNER_TEMP/m3-classes" .
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            "-Dfile=$RUNNER_TEMP/m3-collections.jar" -DgroupId=com.m3 \
            -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT \
            -Dpackaging=jar -DgeneratePom=true
      - name: Compile and test actual five upstream provider dependencies
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Refuse skipped or absent real Guava RowSortedTable JUnit
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports = list(Path("m3/collections/interop/target/surefire-reports").glob("*M3GuavaRowSortedTableTest.xml"))
          assert len(reports) == 1, reports
          suite = ET.parse(reports[0]).getroot()
          assert int(suite.get("tests", "0")) == 1, suite.attrib
          assert all(int(suite.get(k, "0")) == 0 for k in ("errors", "failures", "skipped")), suite.attrib
          print("M3_GUAVA_ROWSORTEDTABLE_REAL_PROVIDER_JUNIT_PASS")
          PY
      - name: Smoke existing C17 JNI mask ABI and checked Java-native parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-native"
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -Wconversion -Wsign-conversion \
            -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/m3-native/libm3_collections_mask.so"
          javac --release 21 -proc:none -cp "$RUNNER_TEMP/m3-classes" \
            -d "$RUNNER_TEMP/m3-classes" \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          java -Xcheck:jni "-Djava.library.path=$RUNNER_TEMP/m3-native" \
            -cp "$RUNNER_TEMP/m3-classes" \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
      - name: Store real Maven test reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-guava-rowsortedtable-receiver-reports
          if-no-files-found: warn
          retention-days: 14
          path: |
            m3/collections/interop/target/surefire-reports/
            m3/collections/interop/qualification/m3-guava-row-sorted-table-20261018/target/surefire-reports/
