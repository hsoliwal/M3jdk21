name: M3JDK regex spec
# Former triggers (below, as of the move) now start job(s) 'm3jdk-regex-spec__*' in
# .github/workflows/checks-superset-01.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       branches: [master]
#       paths:
#         - 'src/**/*.java'
#         - 'make/m3/**/*.java'
#         - 'make/data/m3regex/**'
#         - 'make/jdk/src/classes/build/tools/canongate/**'
#         - 'make/scripts/canon-gate.sh'
#         - '.github/workflows/m3jdk-regex-spec.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regex-spec:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /make/jdk/src/classes/build/tools/canongate/**
            /make/scripts/canon-gate.sh
            /make/data/m3regex/**
            /src/**/*.java
            /make/m3/**/*.java
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Every regex call site a change adds has a spec row and a listed site (owner decision 46)
        run: |
          set -eu
          # A pull request is checked out as its merge commit: the first parent is the base branch.
          base=$(git rev-parse HEAD^1)
          out="$RUNNER_TEMP/regex-spec"
          status=0
          bash make/scripts/canon-gate.sh regex_spec . "$base" "$out" || status=$?
          {
            echo "### Regex spec gate against $base: exit $status"
            echo '```'
            cat "$out/REGEX_SPEC_GATE.tsv" 2>/dev/null || echo 'no evidence table'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
