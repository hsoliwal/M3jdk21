# SPDX-License-Identifier: Apache-2.0
name: Indexed live sorted Spliterator contract
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedLiveView.java'
      - 'm3/collections/src/test/java/com/m3/collections/IndexedLiveSortedSpliterator*.java'
      - 'm3/pom.xml'
      - '.github/workflows/indexed-live-sorted-spliterator.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sorted-index:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify original array-backed sorted projection through owner Maven reactor
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/pom.xml -Pm3-extended -pl :m3-collections -am \
            -Dsurefire.failIfNoSpecifiedTests=false \
            -Dtest=IndexedLiveSortedSpliteratorTest test
          report=m3/collections/target/surefire-reports/TEST-com.m3.collections.IndexedLiveSortedSpliteratorTest.xml
          test -s "$report"
          grep -q 'name="sortedIndexStreamContract"' "$report"
