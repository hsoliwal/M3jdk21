# SPDX-License-Identifier: Apache-2.0
name: M3 SDK JDK21 sequenced owners recipe and JNI proof
on:
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/M3CollectionSdk.java"
      - "m3/collections/src/test/java/com/m3/collections/M3SequencedSdkContract.java"
      - "m3/collections/qualification/jdk21-sequenced-sdk-20261017/**"
      - ".github/workflows/m3-jdk21-sequenced-sdk-20261017.yml"
  push:
    branches: [m3/jdk21-sequenced-sdk-receiver-20261017]
permissions:
  contents: read
jobs:
  exact-sdk-and-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Exact source and incumbent M3 slot/link blob identities
        run: python3 -S m3/collections/qualification/jdk21-sequenced-sdk-20261017/verify.py
      - name: Real Maven/OpenRewrite original hash-pinned recipe (all partial states)
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/qualification/jdk21-sequenced-sdk-20261017/pom.xml test
      - name: Strict owning M3 core Java21 and JDK sequenced differential
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/headers proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z | \
            xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          javac --release 21 -proc:none -Xlint:all -Werror -cp proof/classes \
            -d proof/classes m3/collections/src/test/java/com/m3/collections/M3SequencedSdkContract.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          java -Xmx512m -cp proof/classes com.m3.collections.M3SequencedSdkContract | tee proof/seq-jdk-oracle.log
          grep -F "checks=592923 mutations=147456" proof/seq-jdk-oracle.log
          javap -public -s -cp proof/classes com.m3.collections.M3CollectionSdk > proof/sdk-public-api.txt
          grep -F "java.util.SequencedMap" proof/sdk-public-api.txt
          grep -F "java.util.SequencedSet" proof/sdk-public-api.txt
          grep -F "java.util.SequencedCollection" proof/sdk-public-api.txt
      - name: Existing native array-mask JNI parity remains unchanged
        shell: bash
        run: |
          set -euxo pipefail
          javac --release 21 -proc:none -h proof/headers -cp proof/classes -d proof/classes \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
          python3 -S m3/collections/qualification/jdk21-sequenced-sdk-20261017/verify.py
          git diff --exit-code
      - name: Preserve proof artifacts including failed gate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sequenced-sdk-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/qualification/jdk21-sequenced-sdk-20261017/target/surefire-reports/
