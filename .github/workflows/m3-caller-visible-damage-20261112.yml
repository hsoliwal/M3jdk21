name: M3 caller visible-damage qualification
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm3/ports/swing-viewport/**'
      - 'm3/vendor/third_party/junit-*/**'
      - 'm3/vendor/third_party/opentest4j/**'
      - 'm3/vendor/third_party/apiguardian-api/**'
      - '.github/workflows/m3-caller-visible-damage-20261112.yml'
permissions:
  contents: read
concurrency:
  group: m3-caller-visible-damage-${{ github.ref }}
  cancel-in-progress: false
env:
  MODULE: m3/ports/swing-viewport
  RECIPE: m3/ports/swing-viewport/webwidgets/recipes/caller-visible-damage-20261112
jobs:
  qualification:
    name: ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [caller, frozen18]
    steps:
      - name: Admit storage and establish bounded output
        shell: bash
        run: |
          set -euo pipefail
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n1)" -ge $((8589934592 + 536870912))
          root="$RUNNER_TEMP/m3-caller-${{ matrix.lane }}"
          test ! -e "$root"
          mkdir -p "$root"/{logs,tmp,home,cache,repository}
          {
            echo "ROOT=$root"
            echo "OUT=$root/classes"
            echo "JUNIT_OUT=$root/junit"
            echo "XDG_CACHE_HOME=$root/cache"
            echo "JAVA_TOOL_OPTIONS=-Duser.home=$root/home -Djava.io.tmpdir=$root/tmp"
            echo "BASH_ENV=$root/guard.bash"
          } >> "$GITHUB_ENV"
          cat > "$root/guard.bash" <<'BASH'
          budget_ok() {
            local used free
            used=$(du -s -B1 "$ROOT" | cut -f1)
            free=$(df --output=avail -B1 "$ROOT" | tail -n1)
            test "$used" -le 536870912 &&
              test "$free" -ge "$((8589934592 + 536870912 - used))"
          }
          run_budgeted() {
            local name=$1 owned code
            shift
            budget_ok || return 75
            setsid "$@" > "$ROOT/logs/$name.log" 2>&1 &
            owned=$!
            while kill -0 "$owned" 2>/dev/null; do
              if ! budget_ok; then
                echo "Storage budget breach: owned group $owned" >> "$ROOT/logs/budget.log"
                kill -TERM -- "-$owned" 2>/dev/null || true
                sleep 1
                kill -KILL -- "-$owned" 2>/dev/null || true
                wait "$owned" 2>/dev/null || true
                echo 75 > "$ROOT/logs/$name.exit"
                cat "$ROOT/logs/$name.log"
                return 75
              fi
              sleep 1
            done
            if wait "$owned"; then code=0; else code=$?; fi
            echo "$code" > "$ROOT/logs/$name.exit"
            cat "$ROOT/logs/$name.log" || return 76
            budget_ok || return 75
            return "$code"
          }
          BASH
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/ports/swing-viewport/
            /m3/vendor/third_party/opentest4j/
            /m3/vendor/third_party/apiguardian-api/
            /m3/vendor/third_party/junit-platform-commons-1.10.2/
            /m3/vendor/third_party/junit-platform-engine-1.10.2/
            /m3/vendor/third_party/junit-platform-launcher-1.10.2/
            /m3/vendor/third_party/junit-jupiter-api-5.10.2/
            /m3/vendor/third_party/junit-jupiter-engine-5.10.2/
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Record exact receiving source
        shell: bash
        run: |
          set -euo pipefail
          budget_ok
          echo "M3JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            git rev-parse "HEAD:$MODULE"
          } > "$ROOT/logs/source.txt"
      - name: Qualify producer, strict compilation, protected API and replay
        if: matrix.lane == 'caller'
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted producer-qualify mvn -B -ntp -f "$RECIPE/pom.xml" \
            "-Dmaven.repo.local=$ROOT/repository" \
            "-Dm3.caller.receiverRoot=$GITHUB_WORKSPACE" \
            "-Dm3.caller.recipeRoot=$GITHUB_WORKSPACE/$RECIPE" \
            "-Dm3.caller.outputRoot=$ROOT/qualify" \
            -Dm3.caller.mode=qualify verify
      - name: Refuse changed context before generation
        if: matrix.lane == 'caller'
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RECIPE" "$ROOT/negative-recipe"
          python3 -I -S -B - "$ROOT/negative-recipe/bindings.tsv" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          rows = p.read_text().splitlines()
          for i, row in enumerate(rows):
              cols = row.split("\t")
              if cols[0] == "context":
                  cols[2] = cols[3] = "0" * 64
                  rows[i] = "\t".join(cols)
                  break
          else:
              raise AssertionError("context binding missing")
          p.write_text("\n".join(rows) + "\n")
          PY
          if run_budgeted context-drift mvn -B -ntp -f "$ROOT/negative-recipe/pom.xml" \
            "-Dmaven.repo.local=$ROOT/repository" \
            "-Dm3.caller.receiverRoot=$GITHUB_WORKSPACE" \
            "-Dm3.caller.recipeRoot=$ROOT/negative-recipe" \
            "-Dm3.caller.outputRoot=$ROOT/negative-output" \
            -Dm3.caller.mode=qualify verify
          then
            echo "Drift was incorrectly admitted" >&2
            exit 1
          else
            status=$?
          fi
          test "$status" -ne 75
          test ! -e "$ROOT/negative-output/selected-producer"
          grep -q 'input drift' "$ROOT/negative-output/jshell.stderr.log"
      - name: Apply selected outputs through the existing producer
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted producer-apply mvn -B -ntp -f "$RECIPE/pom.xml" \
            "-Dmaven.repo.local=$ROOT/repository" \
            "-Dm3.caller.receiverRoot=$GITHUB_WORKSPACE" \
            "-Dm3.caller.recipeRoot=$GITHUB_WORKSPACE/$RECIPE" \
            "-Dm3.caller.outputRoot=$ROOT/apply" \
            -Dm3.caller.mode=apply verify
          main="$MODULE/src/main/java/jdk/m3/swing/web/model/M3WebLanes.java"
          checks="$MODULE/src/test/java/jdk/m3/swing/web/model/M3WebChecks.java"
          mkdir -p "$ROOT/generated-known"
          cp "$main" "$ROOT/generated-known/M3WebLanes.java"
          cp "$checks" "$ROOT/generated-known/M3WebChecks.java"
          cmp "$main" "$ROOT/generated-known/M3WebLanes.java"
          cmp "$checks" "$ROOT/generated-known/M3WebChecks.java"
          sha256sum "$ROOT/generated-known/"*.java > "$ROOT/logs/generated-sha256.txt"
          git hash-object "$main" "$checks" > "$ROOT/logs/generated-git-blobs.txt"
          cat "$ROOT/logs/generated-sha256.txt"
          budget_ok
      - name: Expose bounded producer controller reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for dir in qualify apply negative-output; do
            for name in jshell.stdout.log jshell.stderr.log selected-producer/RESULT.tsv; do
              file="$ROOT/$dir/$name"
              if test -f "$file"; then
                echo "$dir/$name"
                head -c 65536 "$file"
              fi
            done
          done
      - name: Compile existing source JUnit and generated module
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted source-compile bash "$MODULE/run-tests.sh" compile
      - name: Execute seven existing caller tests
        if: matrix.lane == 'caller'
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted caller7 "$JAVA_HOME/bin/java" -Xmx768m -Djava.awt.headless=true \
            -cp "$OUT/main:$OUT/test:$JUNIT_OUT" jdk.m3.swing.testkit.M3JUnitLauncher \
            --select-class jdk.m3.swing.web.model.M3CollectionModesTest
          grep -Eq '^\[[[:space:]]*7 tests found[[:space:]]*\]$' "$ROOT/logs/caller7.log"
          grep -Eq '^\[[[:space:]]*7 tests successful[[:space:]]*\]$' "$ROOT/logs/caller7.log"
      - name: Execute full public suite and retain actual failures
        if: always() && matrix.lane == 'caller' && steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted public-suite "$JAVA_HOME/bin/java" -Xmx768m -Djava.awt.headless=true \
            -cp "$OUT/main:$OUT/test:$JUNIT_OUT" jdk.m3.swing.testkit.M3JUnitLauncher --scan "$OUT/test"
      - name: Compile unchanged approved eighteen-test fixture separately
        if: matrix.lane == 'frozen18'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RECIPE/fixtures/M3ViewportCoreApiTest.approved18.java.txt"
          seal=ba22b2bf42b059ab93d906383d52c16b96be6f2cdbd3e49bade4ed3d473e8522
          printf '%s  %s\n' "$seal" "$fixture" | sha256sum -c -
          mkdir -p "$ROOT/oracle-src" "$ROOT/oracle"
          cp "$fixture" "$ROOT/oracle-src/M3ViewportCoreApiTest.java"
          printf '%s  %s\n' "$seal" "$ROOT/oracle-src/M3ViewportCoreApiTest.java" | sha256sum -c -
          run_budgeted oracle-compile "$JAVA_HOME/bin/javac" --release 21 -proc:none \
            -cp "$OUT/main:$OUT/test:$JUNIT_OUT" -d "$ROOT/oracle" "$ROOT/oracle-src/M3ViewportCoreApiTest.java"
      - name: Execute all eighteen unchanged expectations
        if: matrix.lane == 'frozen18'
        shell: bash
        run: |
          set -euo pipefail
          if run_budgeted approved18 "$JAVA_HOME/bin/java" -Xmx768m -Djava.awt.headless=true \
            -cp "$ROOT/oracle:$OUT/main:$OUT/test:$JUNIT_OUT" jdk.m3.swing.testkit.M3JUnitLauncher \
            --select-class jdk.m3.swing.viewport.M3ViewportCoreApiTest
          then
            status=0
          else
            status=$?
          fi
          grep -Eq '^\[[[:space:]]*18 tests found[[:space:]]*\]$' "$ROOT/logs/approved18.log"
          if test "$status" -eq 0; then
            grep -Eq '^\[[[:space:]]*18 tests successful[[:space:]]*\]$' "$ROOT/logs/approved18.log"
          fi
          exit "$status"
      - name: Require committed generator postimages after behavioral tests
        if: always() && matrix.lane == 'caller' && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          run_budgeted committed-postimages git diff --exit-code -- \
            "$MODULE/src/main/java/jdk/m3/swing/web/model/M3WebLanes.java" \
            "$MODULE/src/test/java/jdk/m3/swing/web/model/M3WebChecks.java"
      - name: Retain actual generated files, receipts and failure status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-caller-${{ matrix.lane }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/logs/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/generated-known/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/qualify/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/apply/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/negative-output/
