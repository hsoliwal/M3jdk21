name: M3-GVAS strict same-address JNI
# Former triggers (below, as of the move) now start job(s) 'm3-gvas-strict-address__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/java.base/share/classes/jdk/m3/text/M3FixedAddressMapping.java'
#         - 'm3/core/test/jdk/m3/text/M3FixedAddressMappingContractTest.java'
#         - 'm3/lexicon/native/m3_fixed_address_mapping_jni.c'
#         - 'm3/verify-fixed-address-jni.py'
#         - '.github/workflows/m3-gvas-strict-address.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-two-process-exact-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java 21/JNI and prove identical address in two JVMs
        run: M3JDK="$JAVA_HOME" python3 m3/verify-fixed-address-jni.py
