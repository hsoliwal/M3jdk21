name: M3-GVAS strict same-address JNI
on:
  pull_request:
    paths:
      - 'm3/core/src/com/m3/text/M3FixedAddressMapping.java'
      - 'm3/core/test/com/m3/text/M3FixedAddressMappingContractTest.java'
      - 'm3/lexicon/native/m3_fixed_address_mapping_jni.c'
      - 'm3/verify-fixed-address-jni.py'
      - '.github/workflows/m3-gvas-strict-address.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-two-process-exact-address:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile Java 21/JNI and prove identical address in two JVMs
        run: M3_JDK="$JAVA_HOME" python3 m3/verify-fixed-address-jni.py
