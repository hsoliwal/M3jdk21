name: M3JDK21 COW filtered owner Java21 contract after JVM integration
# Former triggers (below, as of the move) now start job(s) 'm3-cow-filtered-owner-20261021__*' in
# .github/workflows/checks-superset-09.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3CollectionViews.java'
#         - 'test/jdk/jdk/m3/collections/M3FilteredCowOwnerContract.java'
#         - 'test/jdk/jdk/m3/collections/M3FilteredCowOwnerTest.java'
#         - 'm3/collections/qualification/cow-filtered-owner-20261021/**'
#         - 'm3/collections/algorithm-catalog/cow-filtered-owner-20261021/**'
#         - '.github/workflows/m3-cow-filtered-owner-20261021.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-owner-java21-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preserve original combined owner API and early-stop behavior; qualify exact COW contract
        run: bash m3/collections/qualification/cow-filtered-owner-20261021/verify.sh
