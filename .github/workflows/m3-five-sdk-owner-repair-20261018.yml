# SPDX-License-Identifier: Apache-2.0
name: M3 five-provider SDK array owner repair and JNI
on:
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/M3CollectionSdk.java"
      - "m3/collections/src/test/java/com/m3/collections/M3SdkOwnerFactory*.java"
      - "m3/collections/qualification/sdk-five-owner-repair-20261018/**"
      - ".github/workflows/m3-five-sdk-owner-repair-20261018.yml"
  push:
    branches: [m3/five-sdk-owner-repair-receiver-20261018]
permissions:
  contents: read
jobs:
  source-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - name: Refuse drift from exact approved JDK/Native owners
        run: |
          set -euxo pipefail
          python3 -S m3/collections/qualification/sdk-five-owner-repair-20261018/verify.py
      - name: Actual original Maven/OpenRewrite source-sealed recipe
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/qualification/sdk-five-owner-repair-20261018/recipe/pom.xml test
      - name: Strict current core Java21, seeded factory/JDK sorted wrapper oracle
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z | \
            xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          javac --release 21 -proc:none -Xlint:all,-module -Werror -cp proof/classes -d proof/classes \
            m3/collections/src/test/java/com/m3/collections/M3SdkOwnerFactorySelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          java -Xmx512m -cp proof/classes com.m3.collections.M3SdkOwnerFactorySelfTest | tee proof/factory-java.log
          java -Xint -Xmx512m -cp proof/classes com.m3.collections.M3SdkOwnerFactorySelfTest
          javap -public -cp proof/classes com.m3.collections.M3CollectionSdk >proof/sdk-api.txt
          grep -q 'm3ArrayList' proof/sdk-api.txt
          grep -q 'indexedMultiValueMap' proof/sdk-api.txt
          mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3SdkOwnerFactoryTest test
      - name: Real unchanged JNI state mask binary parity
        run: |
          set -euxo pipefail
          javac --release 21 -proc:none -h proof/native -cp proof/classes -d proof/classes \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror -pedantic -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx512m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native | tee proof/native.log
          python3 -S m3/collections/qualification/sdk-five-owner-repair-20261018/verify.py
          git diff --exit-code
      - name: Record optional five-provider interop compilation gap
        continue-on-error: true
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/interop/pom.xml test
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-sdk-owner-proof
          retention-days: 30
          path: |
            proof/
            m3/collections/qualification/sdk-five-owner-repair-20261018/recipe/target/surefire-reports/
            m3/collections/target/surefire-reports/
