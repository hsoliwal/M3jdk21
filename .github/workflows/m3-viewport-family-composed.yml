name: M3 viewport combined original-owner contracts
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/c/m3maskviewport.c'
      - 'm3/collections/src/main/java/com/m3/collections/M3MaskViewport*.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SparseExtents.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3FrameJavaContract.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3TreeCommitPlanIdentityTest.java'
      - 'm3/collections/viewport-proof/**'
      - '.github/workflows/m3-viewport-family-composed.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-viewport-family-${{ github.ref }}
  cancel-in-progress: false
jobs:
  original-owner-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 3
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            m3/collections/**
            .github/workflows/**
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit all 27 imported donor files and original JNI declaration
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          expected={
            'm3/collections/src/main/c/m3maskviewport.c':'e7db071a5e1768442ef016fc6516e9dc9e3f9396',
            'm3/collections/src/main/java/com/m3/collections/M3MaskViewportNative.java':'9cdfab35cf719ccf26f61ee61e1ae10fa98eb9ad',
            'm3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java':'aefcdb933cbc2caa122a527180e20fda8e2a284d',
            'm3/collections/src/main/java/com/m3/collections/M3SparseExtents.java':'ba6b2ebd0fac9f737deb28bce9385fff07164997',
            'm3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java':'fd425edf2bb7446a0e4446b272a616015b200361',
            'm3/collections/src/test/java/com/m3/collections/M3FrameJavaContract.java':'db58a90031370a5cf8dd9039dbce6306817dde46',
            'm3/collections/src/test/java/com/m3/collections/M3TreeCommitPlanIdentityTest.java':'a6e7df64f1850ba54851be44056837d37640a096',
            'm3/collections/viewport-proof/fixtures/M3FenwickInverseTest.txt':'dafa004fcbe3fe9e4183f830b2f1159e3c40591f',
            '.github/workflows/m3-mask-viewport-page-20261021.yml':'341bdd40c944b1b743916d1b135aa2a39cd63a8e',
            '.github/workflows/m3-pinned-java-parser-supply.yml':'552996c3bc6e99501017a28a991af6c54671a454',
            '.github/workflows/m3-sparse-viewport-geometry.yml':'bc5a1a4e0e2d3ec2049caf2cf360c0a64c1ec30c',
            '.github/workflows/m3-tree-shift-20261021.yml':'cf168081206b5d98e97999d25b07a7f9c22e778b',
            '.github/workflows/m3-viewport-tree-parent.yml':'80c2e67e3bb06569e1531f92fe05f254613a475e',
            '.github/workflows/m3jdk21-tree-plan-commit-identity.yml':'eb5f1111a6f3b328bb2fa93f448039a95cafe6f3',
            'm3/collections/qualification/tree-plan-commit-identity/EXECUTION.json':'f9901918d19152a64f1a07d7c0671d9c46bf13aa',
            'm3/collections/qualification/tree-plan-commit-identity/RECEIVER_RECEIPT.json':'5ec57a4effca64b541114aa9375fc78d5c415bdb',
            'm3/collections/qualification/tree-plan-commit-identity/test_verify_receipt.py':'b5a5ad87fa2c2a5789fbc46295d4d40f835b2f78',
            'm3/collections/qualification/tree-plan-commit-identity/verify_receipt.py':'e9c95bcc426c7267dc4f72bb7a2158c46c219196',
            'm3/collections/qualification/viewport-fenwick/DOCUMENTATION.json':'f56c52907bc52b2188b2ebdaab015c70161faafe',
            'm3/collections/qualification/viewport-fenwick/GEOMETRY_CI.json':'1938fb005d19fb85a1f68130dff6342fbe50e3cc',
            'm3/collections/qualification/viewport-fenwick/RECEIVING.json':'7ffd1552c957bb613e7ca004857472c696a63778',
            'm3/collections/qualification/viewport-frame/ALLSTATE.json':'d064de345f2e3438be5a724aa5185ee3d5535151',
            'm3/collections/qualification/viewport-frame/FRAME_JAVA_FALLBACK_RECEIVING.json':'39a73ee0e33b23a8ea5e5f2e75963b8f5899fdaf',
            'm3/collections/qualification/viewport-frame/FRAME_PARITY_EXECUTION.json':'3e8dbf4cb788f454c72d9bd2235bbae761254a6c',
            'm3/collections/src/test/java/com/m3/collections/M3TreeCoverageTest.java':'ca5bc74d0ae6dcd42f3a319b4c33bef76a4d4d4a',
            'm3/collections/src/test/java/com/m3/collections/M3TreeNativeLifecycleOracle.java':'1bf770fee2929533a7ac9478b7c44e8dd3841ad3',
            'm3/collections/src/test/java/com/m3/collections/M3TreeResidencyTest.java':'64751e4e64732604d9ff7dc81e489999a5d233f2',
            'm3/collections/viewport-proof/verify.py':'c6ef67def947b292c1504e68209e86469f6fb180',
          }
          for path,want in sorted(expected.items()):
              if not Path(path).is_file():raise SystemExit('missing owner: '+path)
              got=subprocess.check_output(['git','hash-object',path],text=True).strip()
              if got!=want:raise SystemExit('owner drift: '+path+' expected='+want+' actual='+got)
          Path('m3-viewport-source-admission.json').write_text(json.dumps({
              'status':'PASS','original_owners':len(expected),'blobs':expected},sort_keys=True,indent=2)+'\n')
          print('M3_VIEWPORT_FAMILY_SOURCE_PASS owner_blobs='+str(len(expected)))
          PY
          git diff --check
      - name: Build the original dynamic-array substrate
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install | tee m3-viewport-arrays.log
      - name: Run the existing tree residency and native-handle contracts
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3TreeCommitPlanIdentityTest,M3TreeWindowPlanTest,M3TreeCoverageTest,M3TreeResidencyTest \
            test | tee m3-viewport-tree.log
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('m3/collections/target/surefire-reports')
          names=['M3TreeCommitPlanIdentityTest','M3TreeWindowPlanTest','M3TreeCoverageTest','M3TreeResidencyTest']
          count=0
          for name in names:
              p=root/('TEST-com.m3.collections.'+name+'.xml')
              if not p.is_file():raise SystemExit('missing tree owner suite: '+name)
              r=ET.parse(p).getroot()
              n=int(r.get('tests','0'))
              if n==0 or any(int(r.get(k,'0')) for k in ('failures','errors')):
                  raise SystemExit('tree suite failed: '+name)
              count+=n
          print('M3_VIEWPORT_FAMILY_TREE_PASS tests='+str(count))
          PY
      - name: Test exact Fenwick geometry and inverse in an isolated Java21 module
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/m3-viewport-geometry"
          mkdir -p "$B/src/main/java/com/m3/collections" "$B/src/test/java/com/m3/collections"
          S=m3/collections/src/main/java/com/m3/collections
          for name in M3HeapGrowth M3SparseExtents M3WindowPlan; do
            cp "$S/$name.java" "$B/src/main/java/com/m3/collections/"
          done
          cp m3/collections/viewport-proof/fixtures/M3ViewportGeometryTest.txt \
            "$B/src/test/java/com/m3/collections/M3ViewportGeometryTest.java"
          cp m3/collections/viewport-proof/fixtures/M3FenwickInverseTest.txt \
            "$B/src/test/java/com/m3/collections/M3FenwickInverseTest.java"
          cat > "$B/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion><groupId>com.synexia.verification</groupId>
            <artifactId>m3-viewport-composed-geometry</artifactId><version>1</version>
            <properties><maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding><argLine></argLine></properties>
            <dependencies><dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter</artifactId>
              <version>5.10.2</version><scope>test</scope></dependency></dependencies>
            <build><plugins>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId>
                <version>3.13.0</version><configuration><compilerArgs><arg>-Xlint:all</arg><arg>-Werror</arg></compilerArgs></configuration></plugin>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId>
                <version>3.2.5</version><configuration><failIfNoTests>true</failIfNoTests>
                <useModulePath>false</useModulePath><argLine>${argLine}</argLine></configuration></plugin>
            </plugins></build>
          </project>
          POM
          for mode in mixed interpreted; do
            opts=(); if [[ "$mode" == interpreted ]]; then opts=(-DargLine=-Xint); fi
            mvn -B -ntp -f "$B/pom.xml" "${opts[@]}" \
              -Dtest=M3ViewportGeometryTest,M3FenwickInverseTest test | tee "m3-viewport-fenwick-$mode.log"
            python3 - "$B/target/surefire-reports" "$mode" <<'PY'
          from pathlib import Path
          import sys,xml.etree.ElementTree as ET
          root=Path(sys.argv[1]); mode=sys.argv[2]
          for name,want in [('M3ViewportGeometryTest',10),('M3FenwickInverseTest',2)]:
              p=root/('TEST-com.m3.collections.'+name+'.xml')
              if not p.is_file():raise SystemExit('missing Fenwick JUnit report '+name)
              r=ET.parse(p).getroot()
              got=tuple(int(r.get(k,'-1')) for k in ('tests','failures','errors','skipped'))
              if got!=(want,0,0,0):raise SystemExit('Fenwick JUnit mismatch: '+str((name,got)))
          print('M3_VIEWPORT_FAMILY_FENWICK_PASS mode='+mode+' tests=12')
          PY
          done
      - name: Execute installed and relocated original JNI viewport verifier
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-viewport-native"
          bash m3/collections/viewport-proof/verify.sh --output "$OUT" | tee m3-viewport-native.log
          python3 - "$OUT/RECEIPT.json" <<'PY'
          import json,sys
          from pathlib import Path
          r=json.loads(Path(sys.argv[1]).read_text())
          if r.get('status')!='PASS' or r.get('command_count',0)<32:
              raise SystemExit('installed JNI did not complete its original contract')
          required={
            'Java_com_m3_collections_M3MaskViewportNative_project',
            'Java_com_m3_collections_M3MaskViewportNative_projectPage',
            'Java_com_m3_collections_M3MaskViewportNative_projectFramePage'}
          if set(r.get('exports',[]))!=required:
              raise SystemExit('JNI export contract changed')
          frame=r.get('observations',{}).get('jni-M3FrameRegionContract','')
          if frame.strip()!='M3_FRAME_REGION_PASS checks=35080 digest=ed73ef29740c1e87':
              raise SystemExit('frame JNI observation mismatch: '+frame.strip())
          print('M3_VIEWPORT_FAMILY_JNI_PASS commands='+str(r['command_count']))
          PY
      - name: Admit assembled source state only when every owner passes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          source=Path('m3-viewport-source-admission.json').read_bytes()
          for path in ['m3-viewport-arrays.log','m3-viewport-tree.log',
                       'm3-viewport-fenwick-mixed.log','m3-viewport-fenwick-interpreted.log',
                       'm3-viewport-native.log']:
              if not Path(path).is_file() or Path(path).stat().st_size==0:
                  raise SystemExit('missing completed phase: '+path)
          receipt={'schema':'M3_VIEWPORT_COMBINED_ORIGINAL_OWNERS_V1',
                   'status':'PASS','source_receipt_sha256':hashlib.sha256(source).hexdigest(),
                   'tree_junit':'PASS','fenwick_junit_modes':['mixed','interpreted'],
                   'installed_jni':'PASS','full_jdk_hotspot_jtreg':'NOT_RUN',
                   'native_widgets':'NOT_RUN','performance_claim':False}
          Path('m3-viewport-combined.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('M3_VIEWPORT_COMBINED_ORIGINAL_OWNERS_PASS')
          PY
      - name: Retain complete separated owner execution receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-viewport-combined-${{ github.event.pull_request.head.sha || github.sha }}
          if-no-files-found: warn
          path: |
            m3-viewport-*.log
            m3-viewport-source-admission.json
            m3-viewport-combined.json
            ${{ runner.temp }}/m3-viewport-native/
            ${{ runner.temp }}/m3-viewport-geometry/target/surefire-reports/
            m3/collections/target/surefire-reports/
