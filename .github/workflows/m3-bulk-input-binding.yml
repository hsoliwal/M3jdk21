name: M3 Bulk Input Binding Contract

on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/vm/parallel/BulkScheduler.java'
      - 'test/jdk/jdk/internal/vm/parallel/BulkSchedulerTest.java'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3BulkInputBindingReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-input-binding-20261014/**'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3BulkInputBindingReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/tasks/m3-bulk-input-binding-20261014/**'
      - '.github/workflows/m3-bulk-input-binding.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-fixed-point:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate source-built recipe coordinate
        run: python3 -S m3/synexia-import/pure-int-recipe-custody/verify-source-rewrite-coordinate.py
      - name: Install pinned source recipe custody
        run: bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - name: Target recipe/JUnit custody
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3BulkInputBindingReceiverRecipeTest test
      - name: Exact recipe dry-run against materialized target
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Drewrite.activeRecipes=com.m3.rewrite.backport.M3BulkInputBindingReceiverRecipe \
            rewrite:dryRun

  isolated-java-base:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile and execute isolated production JDK patch
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/bulk-input-patch-src"
          out="$RUNNER_TEMP/bulk-input-patch-classes"
          tests="$RUNNER_TEMP/bulk-input-patch-tests"
          mkdir -p "$src/jdk/internal/vm/parallel" "$out" "$tests"
          for name in BulkTask BulkExecutor BulkExecution BulkExecutorProvider BulkScheduler; do
            cp "src/java.base/share/classes/jdk/internal/vm/parallel/$name.java" \
              "$src/jdk/internal/vm/parallel/$name.java"
          done
          javac --release 21 -Xlint:all -Werror \
            --patch-module "java.base=$src" \
            -d "$out" "$src"/jdk/internal/vm/parallel/*.java
          javac -Xlint:all -Werror \
            --patch-module "java.base=$out" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -d "$tests" \
            test/jdk/jdk/internal/vm/parallel/BulkSchedulerTest.java \
            test/jdk/jdk/internal/vm/parallel/BulkExecutorTest.java
          for mode in normal interpreter; do
            flag=""
            if [[ "$mode" == interpreter ]]; then flag="-Xint"; fi
            java $flag --patch-module "java.base=$out" \
              --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
              -cp "$tests" BulkSchedulerTest
            java $flag --patch-module "java.base=$out" \
              --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
              -cp "$tests" BulkExecutorTest
          done

# The pre-existing M3 Bulk Executor Port workflow provides the separate
# full-image build and jtreg gates for these changed java.base/test paths.
