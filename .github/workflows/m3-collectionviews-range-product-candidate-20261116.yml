name: M3 CollectionViews range product candidate (bounded Java 21)
on:
  pull_request:
    paths:
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/CollectionViews.java'
      - 'test/jdk/jdk/m3/collections/CollectionViewsRangeCompatibilityTest.java'
      - 'm3/collections/qualification/range-preflight-20261116/**'
      - '.github/workflows/m3-collectionviews-range-product-candidate-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-product-source-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check entire real M3 CollectionViews Java source and frozen clients
        run: |
          set -euo pipefail
          python3 m3/collections/qualification/range-preflight-20261116/verify_product_candidate.py
