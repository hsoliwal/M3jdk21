name: M3 A3 Synexia delivery bridge

on:
  pull_request:
    paths:
      - 'm3/tooling/a3/**'
      - 'm3/docs/a3-synexia-delivery-work.md'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/a3-synexia-delivery-work/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/a3-synexia-delivery-work-text/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-a3-synexia-delivery-work.yml'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/M3A3SynexiaDeliveryRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/a3-synexia-delivery-work/**'
      - 'm3/tooling/migration-recipes/tasks/a3-synexia-delivery-work/**'
      - '.github/workflows/m3-a3-synexia-delivery-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
      - name: Recipe replay and fixed point
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/migration-recipes -am
          -Dtest=M3A3SynexiaDeliveryRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: A3 Synexia focused proof
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/a3 -am
          -Dtest=A3SynexiaTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Complete A3 module test
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/a3 -am test
