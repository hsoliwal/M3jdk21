  m3jdk-canon-gate__selftest:
    name: "M3JDK canon gate / selftest"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk-canon-gate'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK canon gate-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /make/jdk/src/classes/build/tools/canongate/**
            /make/scripts/canon-gate.sh
            /make/conf/canon-patterns.tsv
            /test/make/canongate/**
            /doc/canon-gate.md
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile with all lint warnings as errors and run the discriminating suite
        run: bash make/scripts/canon-gate.sh selftest
      - name: The seed pattern catalog is a valid packet input
        run: |
          set -eu
          work="$RUNNER_TEMP/canon"
          mkdir -p "$work"
          printf '# canon-gate smoke packet\n' > "$work/spec.md"
          printf 'path\tsha256\tatom\tpattern\trole\texact_hash\tlogic_hash\tstructure_hash\tsim_hash\n' > "$work/atoms.tsv"
          {
            printf 'task_packet\tactive\nsource_doc\tspec.md\ninvariant_id\tCANON-SMOKE\n'
            printf 'run.mode\tdry-run\nrun.profile\tfast\nrun.workers\t1\nrun.shard_count\t1\nrun.shard_index\t0\n'
            printf 'targets.modules\tmake/jdk/src/classes/build/tools/canongate\n'
            printf 'invariant_locks\tPUBLIC_API:LOCKED,EXTERNAL_BEHAVIOR:LOCKED,DISABLED_PATHS:FORBIDDEN,EXCLUDED_PATHS:FORBIDDEN,BUILD_SCRIPTS:LOCKED\n'
            printf 'allowed_delta\tnone\nforbidden\tany change\nstop_conditions\tfirst failing stage\n'
            printf 'pattern_catalog\t%s\n' "$GITHUB_WORKSPACE/make/conf/canon-patterns.tsv"
            printf 'verify_order\tdiff,atom_pattern,lint,compile\n'
            printf 'output_contract\tSTATUS.tsv,FINAL_REPORT.md,RUN_CONTEXT.tsv,PROVENANCE.tsv,VERIFY_CONTRACT.tsv,OUTPUT_CONTRACT.tsv,ATOM_PATTERN.tsv\n'
            printf 'verify.diff\tgit diff --check\n'
            printf 'verify.atom_pattern\tcp %s "$CANON_RUN_DIR/ATOM_PATTERN.tsv"\n' "$work/atoms.tsv"
            printf 'verify.lint\tbash -n make/scripts/canon-gate.sh\n'
            printf 'verify.compile\ttrue\n'
          } > "$work/packet.tsv"
          bash make/scripts/canon-gate.sh check "$work/packet.tsv"
          bash make/scripts/canon-gate.sh run "$work/packet.tsv" "$work/run"
          cat "$work/run/FINAL_REPORT.md" >> "$GITHUB_STEP_SUMMARY"

  m3-five-provider-source-candidates__source-candidate:
    name: "M3 five-provider full source candidate execution / source-candidate"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-five-provider-source-candidates'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 five-provider full source candidate execution-${{ github.ref }}-source-candidate-${{ strategy.job-index }}"
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - family: GUAVA
            repository: hsoliwal/guava
            pin: dfd9dca629d44faf71846b1f85acd38556f4854d
            source_root: guava/src/com/google/common/collect
            source_tree: bdba90884fefae61cd8bf56092b8c97eb4539d85
            recipe: jdk.internal.m3.RelocateGuavaFork20261018
          - family: ECLIPSE
            repository: hsoliwal/eclipse-collections
            pin: fbaa8605dad1a84900fd38a1f6954de31b733f07
            source_root: eclipse-collections/src/main/java/org/eclipse/collections/impl
            source_tree: 7585fe79da3edb6c2ccd79be7ec32759dcc43422
            recipe: jdk.internal.m3.RelocateEclipseFork20261018
          - family: APACHE
            repository: hsoliwal/commons-collections
            pin: 6404dfdfe553097bb934e044034abcec5a4dbdd
            source_root: src/main/java/org/apache/commons/collections4
            source_tree: 56171a20ba5c365a2c70777dcaa619520cdf4a57
            recipe: jdk.internal.m3.RelocateApacheCommonsFork20261018
          - family: SPRING
            repository: spring-projects/spring-framework
            pin: 49adc91c7e41eaafb52fc11e1210989894bda1f3
            source_root: spring-core/src/main/java/org/springframework/util
            source_tree: cfd3640d24b8d2dde3610396a1d1c8f6baf896ac
            recipe: jdk.internal.m3.RelocateSpringFork20261018
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact public M3 recipe mirror, not live default source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/M3jdk21
          ref: 3c3accdd72b2395cff3ea70c300aab1de351a99e
          path: canonical
          persist-credentials: false
      - name: Checkout immutable donor source tree
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.pin }}
          path: donor
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preflight exact source commitment and source tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-candidate"
          cd donor
          test "$(git rev-parse HEAD)" = "${{ matrix.pin }}"
          test "$(git rev-parse "HEAD:${{ matrix.source_root }}")" = "${{ matrix.source_tree }}"
          test -z "$(git status --porcelain)"
          echo -e "family\tpinned_commit\troot_git_tree\tmode\n${{ matrix.family }}\t${{ matrix.pin }}\t${{ matrix.source_tree }}\tEPHEMERAL_RUNNER_ONLY" > "$RUNNER_TEMP/m3-candidate/PIN.tsv"
      - name: Materialize full donor source candidate with canonical OpenRewrite recipe
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          RECIPE="$GITHUB_WORKSPACE/canonical/m3/collections/relocation/five-provider-20261018/src/main/resources/META-INF/rewrite/m3-five-provider-relocations.yml"
          test -f "$RECIPE"
          mvn -B -ntp org.openrewrite.maven:rewrite-maven-plugin:5.23.1:run \
            -Drewrite.configLocation="$RECIPE" \
            -Drewrite.activeRecipes="${{ matrix.recipe }}" \
            2>&1 | tee "$RUNNER_TEMP/m3-candidate/OPENREWRITE.log"
      - name: Record exact diff before linter or compiler
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          git add -N .
          git diff --binary > "$RUNNER_TEMP/m3-candidate/CANDIDATE.patch"
          git diff --name-status > "$RUNNER_TEMP/m3-candidate/FILES.tsv"
          git status --short > "$RUNNER_TEMP/m3-candidate/GIT_STATUS.txt"
          test -s "$RUNNER_TEMP/m3-candidate/CANDIDATE.patch"
          grep -Eq '\.java' "$RUNNER_TEMP/m3-candidate/FILES.tsv"
      - name: Check patch and Java source layout, then compile
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          git diff --check
          mvn -B -ntp -DskipTests compile 2>&1 | tee "$RUNNER_TEMP/m3-candidate/COMPILE.log"
      - name: Run full donor tests, then hold for serial M3 admission
        shell: bash
        run: |
          set -euo pipefail
          cd donor
          mvn -B -ntp test 2>&1 | tee "$RUNNER_TEMP/m3-candidate/TEST.log"
          printf 'candidate_build\tPASS\nproduct_admission\tNOT_PERFORMED\n' > "$RUNNER_TEMP/m3-candidate/STATUS.tsv"
      - name: Retain all candidate logs and diffs, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-full-source-${{ matrix.family }}-${{ github.run_id }}
          if-no-files-found: warn
          path: ${{ runner.temp }}/m3-candidate/

