  m3jdk21-upstream-inventory__inventory:
    name: "M3 JDK21 upstream inventory / inventory"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk21-upstream-inventory'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JDK21 upstream inventory-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fetch pinned OpenJDK GA history without blobs
        shell: bash
        run: |
          mkdir upstream-jdk
          git -C upstream-jdk init -q
          git -C upstream-jdk remote add origin https://github.com/openjdk/jdk.git

          refs=(
            "refs/tags/jdk-21+35:refs/tags/jdk-21+35"
            "refs/tags/jdk-22+36:refs/tags/jdk-22+36"
            "refs/tags/jdk-23+37:refs/tags/jdk-23+37"
            "refs/tags/jdk-24+36:refs/tags/jdk-24+36"
            "refs/tags/jdk-25+36:refs/tags/jdk-25+36"
            "refs/tags/jdk-26+35:refs/tags/jdk-26+35"
            "refs/tags/jdk-27+35:refs/tags/jdk-27+35"
          )
          git -C upstream-jdk -c protocol.version=2 fetch             --filter=blob:none             --no-tags             origin             "${refs[@]}"

          tags=(
            jdk-21+35
            jdk-22+36
            jdk-23+37
            jdk-24+36
            jdk-25+36
            jdk-26+35
            jdk-27+35
          )
          for tag in "${tags[@]}"; do
            git -C upstream-jdk rev-parse --verify "$tag^{commit}"
          done

      - name: Materialize complete commit JBS path denominator
        shell: bash
        run: |
          mkdir -p inventory-output
          python3 m3/backports/inventory.py             --repo upstream-jdk             --out inventory-output/UPSTREAM_CHANGES.tsv

      - name: Unit-test compatibility queue
        shell: bash
        run: |
          python3 -m unittest -v m3/backports/test_compatibility_queue.py

      - name: Build deterministic compatibility proof queue
        shell: bash
        run: |
          python3 m3/backports/compatibility_queue.py \
            --inventory inventory-output/UPSTREAM_CHANGES.tsv \
            --out inventory-output/COMPATIBILITY_QUEUE.tsv
          python3 - <<'PY'
          import csv
          import json
          from collections import Counter
          from pathlib import Path
          from m3.backports.compatibility_queue import MAX_INVENTORY_FIELD_SIZE

          path = Path("inventory-output/COMPATIBILITY_QUEUE.tsv")
          previous_field_limit = csv.field_size_limit()
          try:
              csv.field_size_limit(MAX_INVENTORY_FIELD_SIZE)
              with path.open("r", encoding="utf-8", newline="") as handle:
                  rows = list(csv.DictReader(handle, delimiter="\t"))
          finally:
              csv.field_size_limit(previous_field_limit)

          if not rows:
              raise SystemExit("compatibility queue is empty")
          if any(row["compatibility_state"] != "PENDING_COMPATIBILITY_PROOF" for row in rows):
              raise SystemExit("queue heuristics must not auto-admit/reject compatibility")

          summary = {
              "schema": 1,
              "rows": len(rows),
              "by_risk": dict(sorted(Counter(row["risk"] for row in rows).items())),
              "by_proof_lane": dict(sorted(Counter(row["proof_lane"] for row in rows).items())),
              "by_recipe_strategy": dict(sorted(Counter(row["recipe_strategy"] for row in rows).items())),
              "by_scope_floor": dict(sorted(Counter(row["scope_floor"] for row in rows).items())),
          }
          Path("inventory-output/COMPATIBILITY_QUEUE.summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY

      - name: Verify and summarize inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path
          from m3.backports.compatibility_queue import MAX_INVENTORY_FIELD_SIZE

          path = Path("inventory-output/UPSTREAM_CHANGES.tsv")
          data = path.read_bytes()
          previous_field_limit = csv.field_size_limit()
          try:
              csv.field_size_limit(MAX_INVENTORY_FIELD_SIZE)
              with path.open("r", encoding="utf-8", newline="") as handle:
                  rows = list(csv.DictReader(handle, delimiter="\t"))
          finally:
              csv.field_size_limit(previous_field_limit)

          by_release = Counter(int(row["release"]) for row in rows)
          by_disposition = Counter(row["disposition"] for row in rows)
          by_domain = Counter(row["domain"] for row in rows)
          jbs_rows = sum(bool(row["jbs_ids"]) for row in rows)

          expected_release_counts = {
              22: 2384,
              23: 2355,
              24: 2562,
              25: 2678,
              26: 2611,
              27: 2358,
          }
          if dict(sorted(by_release.items())) != expected_release_counts:
              raise SystemExit(
                  f"release commit counts differ: {dict(sorted(by_release.items()))}"
              )

          commits = [row["commit"] for row in rows]
          if len(commits) != len(set(commits)):
              raise SystemExit("duplicate commit across GA interval inventory")

          summary = {
              "schema": 1,
              "source_repo": "openjdk/jdk",
              "ga_intervals": {
                  "22": ["jdk-21+35", "jdk-22+36"],
                  "23": ["jdk-22+36", "jdk-23+37"],
                  "24": ["jdk-23+37", "jdk-24+36"],
                  "25": ["jdk-24+36", "jdk-25+36"],
                  "26": ["jdk-25+36", "jdk-26+35"],
                  "27": ["jdk-26+35", "jdk-27+35"],
              },
              "total_commits": len(rows),
              "rows_with_jbs_id": jbs_rows,
              "by_release": dict(sorted(by_release.items())),
              "by_disposition": dict(sorted(by_disposition.items())),
              "by_domain": dict(sorted(by_domain.items())),
              "sha256": hashlib.sha256(data).hexdigest(),
              "bytes": len(data),
          }
          Path("inventory-output/UPSTREAM_CHANGES.summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          PY
          gzip -9 -k inventory-output/UPSTREAM_CHANGES.tsv

      - name: Upload complete upstream inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdk22-27-upstream-change-inventory
          path: inventory-output/
          if-no-files-found: error
          retention-days: 7

  m3-jep423-cumulative-materialization__cumulative-candidate:
    name: "M3 JEP 423 cumulative materialization proof / cumulative-candidate"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jep423-cumulative-materialization'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JEP 423 cumulative materialization proof-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check

      - name: 2 - Unit-test admission generator executor and lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             m3/backports/current_tree_preimage_inventory.py             m3/backports/file_delta_inventory.py             m3/backports/generate_recipe_crates.py             m3/backports/materialize_generated_crates.py             m3/backports/recipes/jep-423-region-pinning/validate_lineage.py             m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py
          (
            cd m3/backports
            python3 -m unittest -v               test_current_tree_preimage_inventory.py               test_file_delta_inventory.py               test_generate_recipe_crates.py               test_materialize_generated_crates.py               test_jep423_lineage.py               test_jep423_current_admission.py
          )

      - name: 3 - Fetch exact OpenJDK baseline donor and required lineage
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/jdk-22+36:refs/tags/jdk-22+36"             "38cfb220ddadbb401cc15f313aadb8234f626210"             "8643cc21333c6b51242ed3b9295b25f372244755"             "0d5f5e15d43f94a79c6133baecd5af217365d176"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: 4 - Prove three-commit lineage and final JEP423 repair mechanics
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/recipes/jep-423-region-pinning/validate_lineage.py
          git -C "$UPSTREAM" grep -n "G1RegionPinCache" 0d5f5e15d43f94a79c6133baecd5af217365d176 -- src/hotspot/share/gc/g1
          git -C "$UPSTREAM" show             0d5f5e15d43f94a79c6133baecd5af217365d176:src/hotspot/share/gc/g1/heapRegion.hpp             | grep -E 'size_t.*pin|pin.*size_t'
          git -C "$UPSTREAM" show             0d5f5e15d43f94a79c6133baecd5af217365d176:src/hotspot/share/gc/g1/g1CollectedHeap.inline.hpp             | grep -E 'pin_count_cache|G1RegionPinCache'

      - name: 5 - Admit the 62 cumulative candidates against Java21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jep423"
          python3 m3/backports/current_tree_preimage_inventory.py             --root .             --paths-file m3/backports/recipes/jep-423-region-pinning/CUMULATIVE_ADMIT_PATHS.txt             --out "$RUNNER_TEMP/jep423/CURRENT_PREIMAGES.tsv"             --baseline-git "$UPSTREAM"             --baseline-ref jdk-21+35             --admission-out "$RUNNER_TEMP/jep423/CURRENT_TREE_FILE_ADMISSION.tsv"             --mechanical-paths-out "$RUNNER_TEMP/jep423/MECHANICAL_PATHS.txt"
          python3 m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py \
            --packet m3/backports/recipes/jep-423-region-pinning \
            --admission "$RUNNER_TEMP/jep423/CURRENT_TREE_FILE_ADMISSION.tsv"

      - name: 6 - Generate one source-sealed FILE atom per mechanical path
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/file_delta_inventory.py             --repo "$UPSTREAM"             --release 22             --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176             --out "$RUNNER_TEMP/jep423/JDK21_TO_JEP423_FINAL.tsv"
          python3 m3/backports/generate_recipe_crates.py             --repo "$UPSTREAM"             --release 22             --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176             --paths-file "$RUNNER_TEMP/jep423/MECHANICAL_PATHS.txt"                         --donor-map m3/backports/recipes/jep-423-region-pinning/PATH_DONOR_OVERRIDES.tsv --crate-size 1             --include-native             --include-text             --out "$RUNNER_TEMP/jep423/file-atoms"

      - name: 7 - Prove complete cumulative accounting
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py \
            --packet m3/backports/recipes/jep-423-region-pinning \
            --runner "$RUNNER_TEMP/jep423"

      - name: 8 - Validate and project the scoped recipe DAG
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=jdk.m3.tooling.dag.BackportPacketMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java
          mkdir -p "$RUNNER_TEMP/jep423/projections"
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=jdk.m3.tooling.dag.OrchestrationProjectionMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $RUNNER_TEMP/jep423/projections $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java
          test -s "$RUNNER_TEMP/jep423/projections/M3BackportRoutes.java"
          test -s "$RUNNER_TEMP/jep423/projections/m3_backport_dag.py"
          test -s "$RUNNER_TEMP/jep423/projections/m3_backport_rules.drl"
          test -s "$RUNNER_TEMP/jep423/projections/projection.tsv"

      - name: 9 - Check current-tree preimages before mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode check             --require-one-target-per-crate             --receipt "$RUNNER_TEMP/jep423/preimage.tsv"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: 10 - Materialize ephemeral candidate and prove fixed point
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode apply             --require-one-target-per-crate             --receipt "$RUNNER_TEMP/jep423/apply.tsv"
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode verify-post             --require-one-target-per-crate             --receipt "$RUNNER_TEMP/jep423/postimage.tsv"
          git diff --check
          before="$(git diff --binary | sha256sum | awk '{print $1}')"
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode apply             --require-one-target-per-crate
          after="$(git diff --binary | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: 11 - Prove only generated FILE targets changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          generated = Path(os.environ["RUNNER_TEMP"]) / "jep423" / "file-atoms"
          expected = set()
          for root in (
              generated / "src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned",
              generated / "src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text",
          ):
              if not root.exists():
                  continue
              for manifest in root.glob("*/manifest.tsv"):
                  for line in manifest.read_text(encoding="utf-8").splitlines():
                      if line and not line.startswith("#"):
                          expected.add(line.split("\t", 1)[0])

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-uall"], text=True
          )
          actual = {line[3:] for line in status.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  "JEP423 changed-path fence failed\n"
                  f"expected={sorted(expected)}\nactual={sorted(actual)}"
              )
          print(f"JEP423_CHANGED_PATHS={len(actual)}")
          PY

      - name: 12 - Install focused OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: 13 - Configure fastdebug JDK
        shell: bash
        run: |
          set -euo pipefail
          bash configure             --with-boot-jdk="$JAVA_HOME"             --with-debug-level=fastdebug             --with-jvm-variants=server             --disable-warnings-as-errors

      - name: 14 - Build JDK images including HotSpot Agent
        run: make JOBS=2 images

      - name: 15 - Run pinned-object G1 and preserved JNI regressions
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="          test/hotspot/jtreg/gc/g1/pinnedobjs           test/hotspot/jtreg/gc/g1/plab/TestPLABEvacuationFailure.java           test/hotspot/jtreg/gc/g1/TestGCLogMessages.java           test/hotspot/jtreg/gc/stress/gclocker/TestExcessGCLockerCollections.java           test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/TestJNIBlockFullGC.java"

      - name: 16 - Run JFR G1 cause and locker regressions
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="          test/jdk/jdk/jfr/event/gc/collection/TestG1ParallelPhases.java           test/jdk/jdk/jfr/event/gc/collection/TestGCCauseWithG1ConcurrentMark.java           test/jdk/jdk/jfr/event/gc/collection/TestGCCauseWithG1FullCollection.java           test/jdk/jdk/jfr/event/gc/detailed/TestGCLockerEvent.java"

      - name: 17 - Upload generated FILE crates and proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jep423-cumulative-file-atom-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jep423
            build/*/test-results/**
          if-no-files-found: warn
          retention-days: 30

  m3-jep423-region-pinning-inventory__inventory:
    name: "M3 JEP 423 G1 region-pinning inventory / inventory"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jep423-region-pinning-inventory'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JEP 423 G1 region-pinning inventory-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Fetch exact OpenJDK 21, complete JEP423 lineage and JDK22 GA
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/jdk-22+36:refs/tags/jdk-22+36"             "38cfb220ddadbb401cc15f313aadb8234f626210"             "8643cc21333c6b51242ed3b9295b25f372244755"             "0d5f5e15d43f94a79c6133baecd5af217365d176"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: Prove implementation touched-path denominator and compatibility split
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep423
          python3 - <<'PY'
          import csv
          import subprocess
          from pathlib import Path
          import os

          root = Path(".")
          repo = Path(os.environ["UPSTREAM"])
          packet = root / "m3/backports/recipes/jep-423-region-pinning"

          expected = [
              line.strip()
              for line in (packet / "PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          admitted = [
              line.strip()
              for line in (packet / "ADMIT_PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          actual = subprocess.check_output(
              [
                  "git", "-C", str(repo), "diff-tree", "--no-commit-id", "--name-only", "-r",
                  "38cfb220ddadbb401cc15f313aadb8234f626210",
              ],
              text=True,
          ).splitlines()

          if len(expected) != 59:
              raise SystemExit(f"expected 59 JEP423 paths, found {len(expected)}")
          if len(admitted) != 57:
              raise SystemExit(f"expected 57 admitted JEP423 paths, found {len(admitted)}")
          if sorted(expected) != sorted(actual):
              raise SystemExit(
                  "JEP423 implementation denominator drift "
                  f"missing={sorted(set(actual)-set(expected))} "
                  f"extra={sorted(set(expected)-set(actual))}"
              )

          preserved = sorted(set(expected) - set(admitted))
          wanted_preserved = sorted([
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/TestJNIBlockFullGC.java",
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/libTestJNIBlockFullGC.c",
          ])
          if preserved != wanted_preserved:
              raise SystemExit(f"JEP423 preserved-deletion drift: {preserved}")

          with (packet / "COMPATIBILITY_SPLIT.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              split = {row["path"]: row for row in csv.DictReader(handle, delimiter="	")}
          if set(split) != set(expected):
              raise SystemExit("JEP423 compatibility split does not cover full denominator")
          for path in wanted_preserved:
              if split[path]["disposition"] != "PRESERVE_JDK21_PATH":
                  raise SystemExit(f"JEP423 removal not preserved: {path}")
          print("JEP423_DENOMINATOR=59")
          print("JEP423_ADMITTED=57")
          print("JEP423_PRESERVED_DELETIONS=2")
          PY

      - name: Validate complete JEP423 dependency closure
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/recipes/jep-423-region-pinning/validate_lineage.py
          cd m3/backports
          python3 -m unittest -v test_jep423_lineage.py

      - name: Prove pinned upstream commit identities
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import os
          import subprocess
          from pathlib import Path

          repo = Path(os.environ["UPSTREAM"])
          packet = Path("m3/backports/recipes/jep-423-region-pinning")
          with (packet / "LINEAGE.tsv").open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream, delimiter="\t"))

          for row in rows:
              commit = row["commit"]
              actual = subprocess.check_output(
                  ["git", "-C", str(repo), "show", "-s", "--format=%H%n%P%n%s", commit],
                  text=True,
              ).splitlines()
              if actual[0] != commit:
                  raise SystemExit(f"commit identity drift: {commit}")
              if row["parent"] not in actual[1].split():
                  raise SystemExit(f"parent identity drift: {commit}")
              if row["jbs"] not in actual[2]:
                  raise SystemExit(f"JBS identity drift: {commit}: {actual[2]}")
              print(f"JEP423_LINEAGE_OK {row['order']} {row['jbs']} {commit}")
          PY

      - name: Admit current-tree preimages against exact Java21 baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/current_tree_preimage_inventory.py \
            --root . \
            --paths-file m3/backports/recipes/jep-423-region-pinning/CUMULATIVE_ADMIT_PATHS.txt \
            --out target/jep423/CURRENT_PREIMAGES.tsv \
            --baseline-git "$UPSTREAM" \
            --baseline-ref jdk-21+35 \
            --admission-out target/jep423/CURRENT_TREE_FILE_ADMISSION.tsv \
            --mechanical-paths-out target/jep423/MECHANICAL_PATHS.txt
          python3 m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py \
            --packet m3/backports/recipes/jep-423-region-pinning \
            --admission target/jep423/CURRENT_TREE_FILE_ADMISSION.tsv

      - name: Unit-test whole-tree comparator and mixed FILE-crate generator
        shell: bash
        run: |
          set -euo pipefail
          cd m3/backports
          python3 -m unittest -v             test_current_tree_preimage_inventory.py             test_file_delta_inventory.py             test_generate_recipe_crates.py             test_jep423_current_admission.py

      - name: Inventory exact JDK21 to JDK22 GA deltas
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/file_delta_inventory.py             --repo "$UPSTREAM"             --release 22             --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176             --out target/jep423/JDK21_TO_JEP423_FINAL.tsv

      - name: Generate one source-sealed FILE atom per admitted JEP423 path
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/generate_recipe_crates.py             --repo "$UPSTREAM"             --release 22             --donor-ref 0d5f5e15d43f94a79c6133baecd5af217365d176             --paths-file target/jep423/MECHANICAL_PATHS.txt                         --donor-map m3/backports/recipes/jep-423-region-pinning/PATH_DONOR_OVERRIDES.tsv --crate-size 1             --include-native             --include-text             --out target/jep423/file-atoms

      - name: Account for all admitted and preserved paths
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/recipes/jep-423-region-pinning/validate_current_admission.py \
            --packet m3/backports/recipes/jep-423-region-pinning \
            --runner target/jep423

      - name: Verify M3 backport and recipe substrate
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/backports/pom.xml verify

      - name: Validate evidence-bound JEP423 packet DAG
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=jdk.m3.tooling.dag.BackportPacketMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java

      - name: Project JEP423 DAG to Camel Airflow and Drools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep423/projections
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=jdk.m3.tooling.dag.OrchestrationProjectionMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/target/jep423/projections $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java
          test -s target/jep423/projections/M3BackportRoutes.java
          test -s target/jep423/projections/m3_backport_dag.py
          test -s target/jep423/projections/m3_backport_rules.drl
          test -s target/jep423/projections/projection.tsv

      - name: Upload JEP423 FILE-atom inventory evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jep423-file-atoms-${{ github.run_id }}
          path: target/jep423
          if-no-files-found: error
          retention-days: 30

  m3-jep404-generational-shenandoah-inventory__inventory:
    name: "M3 JEP 404 Generational Shenandoah inventory / inventory"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-jep404-generational-shenandoah-inventory'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JEP 404 Generational Shenandoah inventory-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    env:
      IMPLEMENTATION_COMMIT: 28ae281b42cd00f471e275db544a5d23a42df59c
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

      - name: 2 - Prove reusable selected-path inventory and JEP404 policy
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            m3/backports/file_delta_inventory.py \
            m3/backports/generate_recipe_crates.py \
            m3/backports/materialize_generated_crates.py \
            m3/backports/selected_path_inventory.py
          cd m3/backports
          python3 -m unittest -v \
            test_selected_path_inventory.py \
            test_materialize_generated_crates.py \
            test_jep404_inventory_policy.py

      - name: 3 - Fetch pinned Java21 and Java24 GA donor history
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/jdk-24+36:refs/tags/jdk-24+36"
          git -C "$RUNNER_TEMP/upstream-jdk" cat-file -e "$IMPLEMENTATION_COMMIT^{commit}"
          git -C "$RUNNER_TEMP/upstream-jdk" merge-base --is-ancestor             "$IMPLEMENTATION_COMMIT" "jdk-24+36"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: 4 - Compare Java21 against integration commit and final JDK24 GA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jep404"
          python3 m3/backports/file_delta_inventory.py             --repo "$UPSTREAM"             --release 24             --donor-ref "$IMPLEMENTATION_COMMIT"             --out "$RUNNER_TEMP/jep404/integration-delta.tsv"
          python3 m3/backports/file_delta_inventory.py             --repo "$UPSTREAM"             --release 24             --out "$RUNNER_TEMP/jep404/ga-delta.tsv"

      - name: 5 - Join exact 228-path denominator to final GA state
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/selected_path_inventory.py             --paths m3/backports/recipes/jep-404-generational-shenandoah/INTEGRATION_PATHS.txt             --integration-delta "$RUNNER_TEMP/jep404/integration-delta.tsv"             --ga-delta "$RUNNER_TEMP/jep404/ga-delta.tsv"             --out "$RUNNER_TEMP/jep404/selected-paths.tsv"
          python3 - <<'PY'
          import csv
          import os
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "jep404"
          with (root / "selected-paths.tsv").open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))
          assert len(rows) == 228, len(rows)
          assert len({row["path"] for row in rows}) == 228
          counts = Counter(row["disposition"] for row in rows)
          admitted = [
              row["path"]
              for row in rows
              if row["disposition"] == "MATERIALIZE_GA_POSTIMAGE"
          ]
          (root / "MATERIALIZE_PATHS.txt").write_text(
              "".join(path + "\n" for path in admitted),
              encoding="utf-8",
          )
          print("JEP404_SELECTED " + " ".join(f"{k}={v}" for k, v in sorted(counts.items())))
          print(f"JEP404_MATERIALIZE_PATHS {len(admitted)}")
          if not admitted:
              raise SystemExit("JEP404 has no final-GA materialization paths")
          PY

      - name: 6 - Generate one-file Java native and text recipe evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/generate_recipe_crates.py             --repo "$UPSTREAM"             --release 24             --paths-file "$RUNNER_TEMP/jep404/MATERIALIZE_PATHS.txt"             --crate-size 1             --include-native             --include-text             --out "$RUNNER_TEMP/jep404/file-atoms"

      - name: 7 - Prove generator accounting without applying candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "jep404"
          selected = {
              line.strip()
              for line in (root / "MATERIALIZE_PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          }
          with (root / "file-atoms" / "CRATES.tsv").open(encoding="utf-8", newline="") as handle:
              crates = list(csv.DictReader(handle, delimiter="\t"))
          with (root / "file-atoms" / "EXCLUSIONS.tsv").open(encoding="utf-8", newline="") as handle:
              exclusions = list(csv.DictReader(handle, delimiter="\t"))

          generated = sum(int(row["target_count"]) for row in crates)
          assert all(int(row["target_count"]) == 1 for row in crates), "JEP404 requires FILE crates"
          if generated + len(exclusions) != len(selected):
              raise SystemExit(
                  f"JEP404 generator accounting drift generated={generated} "
                  f"exclusions={len(exclusions)} selected={len(selected)}"
              )
          print(
              f"JEP404_RECIPE_EVIDENCE selected={len(selected)} "
              f"generated={generated} typed_exclusions={len(exclusions)}"
          )
          PY
          test -z "$(git status --porcelain=v1 -uall)"

      - name: 8 - Verify current-tree preimages before ephemeral mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$RUNNER_TEMP/jep404/file-atoms" \
            --mode check \
            --require-one-target-per-crate \
            --receipt "$RUNNER_TEMP/jep404/preimage.tsv"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: 9 - Materialize exact JEP404 candidate and prove byte fixed point
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$RUNNER_TEMP/jep404/file-atoms" \
            --mode apply \
            --require-one-target-per-crate \
            --receipt "$RUNNER_TEMP/jep404/apply.tsv"
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$RUNNER_TEMP/jep404/file-atoms" \
            --mode verify-post \
            --require-one-target-per-crate \
            --receipt "$RUNNER_TEMP/jep404/postimage.tsv"
          git diff --check
          before="$(git diff --binary | sha256sum | awk '{print $1}')"
          python3 m3/backports/materialize_generated_crates.py \
            --root "$PWD" \
            --generated "$RUNNER_TEMP/jep404/file-atoms" \
            --mode apply \
            --require-one-target-per-crate
          after="$(git diff --binary | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: 10 - Prove only generated JEP404 FILE targets changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          generated = Path(os.environ["RUNNER_TEMP"]) / "jep404" / "file-atoms"
          expected = set()
          for root in (
              generated / "src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned",
              generated / "src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text",
          ):
              if not root.exists():
                  continue
              for manifest in root.glob("*/manifest.tsv"):
                  for line in manifest.read_text(encoding="utf-8").splitlines():
                      if line and not line.startswith("#"):
                          expected.add(line.split("\t", 1)[0])

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-uall"], text=True
          )
          actual = {line[3:] for line in status.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  "JEP404 changed-path fence failed\n"
                  f"expected={sorted(expected)}\nactual={sorted(actual)}"
              )
          print(f"JEP404_CHANGED_PATHS {len(actual)}")
          PY

      - name: 11 - Verify M3 backport and scope control plane
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/backports/pom.xml verify

      - name: 12 - Install OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: 13 - Configure fastdebug Java21 Shenandoah candidate
        shell: bash
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=fastdebug \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: 14 - Build JDK image
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 images

      - name: 15 - Smoke legacy and experimental generational Shenandoah modes
        shell: bash
        run: |
          set -euo pipefail
          JDK_IMAGE="$(find build -path '*/images/jdk' -type d | head -n 1)"
          test -x "$JDK_IMAGE/bin/java"
          "$JDK_IMAGE/bin/java" -XX:+UseShenandoahGC -version \
            > "$RUNNER_TEMP/jep404/shenandoah-satb.log" 2>&1
          "$JDK_IMAGE/bin/java" \
            -XX:+UnlockExperimentalVMOptions \
            -XX:+UseShenandoahGC \
            -XX:ShenandoahGCMode=generational \
            -version > "$RUNNER_TEMP/jep404/shenandoah-generational.log" 2>&1

      - name: 16 - Run focused generational Shenandoah jtreg family
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="hotspot_jtreg:gc/shenandoah/generational"

      - name: 17 - Run JNI management and JFR Shenandoah regressions
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="hotspot_jtreg:gc/shenandoah/jni"
          make JOBS=2 test TEST="hotspot_jtreg:gc/shenandoah/mxbeans"
          make JOBS=2 test TEST="test/jdk/jdk/jfr/event/gc/detailed/TestShenandoahEvacuationInformationEvent.java"

      - name: 18 - Upload JEP404 candidate proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jep404-candidate-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jep404
            build/*/test-results/**
          if-no-files-found: warn
          retention-days: 30

