# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 current array-mask wrapper convergence

on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/m3/M3IndexedArray.java'
      - 'src/java.base/share/classes/jdk/internal/m3/M3IndexedView.java'
      - 'test/jdk/jdk/internal/m3/IndexedViewSortedSpliteratorTest.java'
      - 'src/java.base/share/classes/java/util/CollectionViews.java'
      - 'test/jdk/jdk/internal/m3/M3FusedMaskedFilteredSortedViewTest.java'
      - 'test/jdk/java/util/CollectionViews/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredViews.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredLists.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredDeques.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedLiveView.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3NativeFiveLibrarySdk.java'
      - 'm3/collections/src/test/java/com/m3/collections/**'
      - 'm3/collections/qualification/current-wrapper-arraymask-convergence/**'
      - 'm3/collections/qualification/current-wrapper-arraymask-convergence/SOURCE_MANIFEST.tsv'
      - '.github/workflows/collections-convergence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-java-base:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact current product owner identities
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/master...HEAD
          test "$(git hash-object src/java.base/share/classes/jdk/internal/m3/M3IndexedArray.java)" = 50cdaedb8a4d5b09191e40ff3c5c05e130a87afc
          test "$(git hash-object src/java.base/share/classes/java/util/CollectionViews.java)" = 8840da98c37e2af8da36c63f2cacd6bdaf1cb0a8
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3FilteredViews.java)" = 45ad6df3a51e83c67dc70de7c7acd82bec2305d3
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3FilteredLists.java)" = 3c0d4b1629545d54c7519216618ce1a32990f327
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3FilteredDeques.java)" = 472e02d96401e04fd22637a7e412ccaed2abd0c6
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3IndexedLiveView.java)" = 2b010396590ab85a4fa38ea54d9277875371a7f2
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3NativeFiveLibrarySdk.java)" = ed42a45f330b9b99272349644c3796174e81404a
          bash m3/collections/qualification/filtered-cursor-mask-20261021/verify.sh
      - name: Compile actual java.base array/mask and CollectionViews owners
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-current-convergence"
          mkdir -p "$out/patch" "$out/tests" "$out/patch-src/jdk/internal/m3" "$out/patch-src/java/util"
          cp src/java.base/share/classes/jdk/internal/m3/M3IndexedArray.java "$out/patch-src/jdk/internal/m3/"
          cp src/java.base/share/classes/jdk/internal/m3/M3IndexedView.java "$out/patch-src/jdk/internal/m3/"
          cp src/java.base/share/classes/java/util/CollectionViews.java "$out/patch-src/java/util/"
          javac --release 21 -proc:none -Xlint:all -Werror \
            --patch-module java.base="$out/patch-src" -d "$out/patch" \
            "$out/patch-src/jdk/internal/m3/M3IndexedArray.java" \
            "$out/patch-src/jdk/internal/m3/M3IndexedView.java" \
            "$out/patch-src/java/util/CollectionViews.java"
          javac --release 21 -proc:none -Xlint:all -Werror             --patch-module java.base="$out/patch:test/jdk/jdk/internal/m3"             -d "$out/patch"             test/jdk/jdk/internal/m3/M3FusedMaskedFilteredSortedViewTest.java
          java --patch-module java.base="$out/patch"             jdk.internal.m3.M3FusedMaskedFilteredSortedViewTest
          java -Xint --patch-module java.base="$out/patch"             jdk.internal.m3.M3FusedMaskedFilteredSortedViewTest
          javac --release 21 -proc:none -Xlint:all -Werror \
            --patch-module "java.base=$out/patch:test/jdk/jdk/internal/m3" -d "$out/patch" \
            test/jdk/jdk/internal/m3/IndexedViewSortedSpliteratorTest.java
          java --patch-module java.base="$out/patch" jdk.internal.m3.IndexedViewSortedSpliteratorTest
          java -Xint --patch-module java.base="$out/patch" jdk.internal.m3.IndexedViewSortedSpliteratorTest
          java -XX:TieredStopAtLevel=1 --patch-module java.base="$out/patch" jdk.internal.m3.IndexedViewSortedSpliteratorTest
          java -XX:-TieredCompilation -Xbatch --patch-module java.base="$out/patch" jdk.internal.m3.IndexedViewSortedSpliteratorTest
          P=test/jdk/java/util/CollectionViews
          javac --release 21 -proc:none -Xlint:all -Werror             --patch-module java.base="$out/patch" --add-modules jdk.management             -d "$out/tests"             "$P/RunSearchJni.java"             "$P/CollectionViewsContract.java"             "$P/FilteredBulkMutationContractTest.java"             "$P/FilteredCopyOnWriteBulkTest.java"             "$P/FilteredIsEmptyDirectTest.java"             "$P/FilteredListRemoveContractTest.java"             "$P/FilteredOwnerMembershipTest.java"             "$P/FilteredRepresentativeContractTest.java"             "$P/FilteredSortedSpliteratorMetadataTest.java"
          for klass in             FilteredBulkMutationContractTest             FilteredCopyOnWriteBulkTest             FilteredIsEmptyDirectTest             FilteredListRemoveContractTest             FilteredOwnerMembershipTest             FilteredRepresentativeContractTest             FilteredSortedSpliteratorMetadataTest             CollectionViewsContract; do
            java --patch-module java.base="$out/patch"               --add-modules jdk.management               --add-opens java.base/java.util=ALL-UNNAMED               -cp "$out/tests" "$klass"
          done

  wrapper-reactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install source-vendored JUnit closure
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/vendor/third_party/pom.xml             -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Run current wrapper contracts through arrays-before-collections reactor
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/pom.xml -Pm3-extended -pl :m3-collections -am             -Dsurefire.failIfNoSpecifiedTests=false             -Dtest=M3FilteredMasterPredicatePlanLifecycleTest,M3FilteredMasterTreePlanTest,M3FilteredSortedIteratorPlanTest,IndexedLiveSortedSpliteratorTest,M3FilteredDequesTest,M3FilteredListsOwnerSetTest             test
          for klass in             M3FilteredMasterPredicatePlanLifecycleTest             M3FilteredMasterTreePlanTest             M3FilteredSortedIteratorPlanTest             IndexedLiveSortedSpliteratorTest             M3FilteredDequesTest             M3FilteredListsOwnerSetTest; do
            test -s "m3/collections/target/surefire-reports/TEST-com.m3.collections.$klass.xml"
          done

  native-five-family:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Build in-product arrays JNI and run vendor-free factory JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/vendor/third_party/pom.xml -pl junit-jupiter-5.10.2 -am -DskipTests install
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          cmake -S m3/arrays/src/main/native             -B "$RUNNER_TEMP/m3-arrays-native"             -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_STANDARD=17
          cmake --build "$RUNNER_TEMP/m3-arrays-native" --parallel 2
          ctest --test-dir "$RUNNER_TEMP/m3-arrays-native" --output-on-failure
          test -s "$RUNNER_TEMP/m3-arrays-native/libm3_arrays.so"
          mvn -B -ntp -f m3/collections/pom.xml             -Dtest=M3NativeFiveLibrarySdkNoVendorTest             -DargLine="-ea -Xcheck:jni -Dm3.arrays.native.path=$RUNNER_TEMP/m3-arrays-native/libm3_arrays.so"             test
