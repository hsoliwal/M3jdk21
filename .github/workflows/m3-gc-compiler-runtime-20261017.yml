# SPDX-License-Identifier: Apache-2.0
name: M3 GC compiler/runtime Java21 proof
on:
  push:
    branches: ["m3/gc-compiler-runtime-20261017"]
  pull_request:
    paths:
      - "m3/collections/gc-interop/**"
      - "m3/docs/M3_GC_COMPILER_RUNTIME_20261017.md"
jobs:
  compiler-runtime-gc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: SHA-pinned strict Java21 test under five collectors
        run: sh m3/collections/gc-interop/verify.sh
      - name: Compile optional Maven module
        run: mvn -B -ntp -f m3/collections/gc-interop/pom.xml -DskipTests package
