name: M3JDK21 shared immutable lexicon M3FMT Java JNI
# Former triggers (below, as of the move) now start job(s) 'm3fmt-shared-lexicon-20261021__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/file/src/main/java/jdk/m3/file/M3Fmt*.java'
#         - 'm3/file/src/main/native/m3fmt_varints_jni.c'
#         - 'm3/file/qualification/m3fmt-shared-lexicon-20261021/**'
#         - '.github/workflows/m3fmt-shared-lexicon-20261021.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  original-file-owner-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile M3JDK21 original Java owners, JNI header and C17 source, run both paths
        run: bash m3/file/qualification/m3fmt-shared-lexicon-20261021/verify.sh
