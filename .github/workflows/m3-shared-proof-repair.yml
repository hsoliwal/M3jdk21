name: M3 shared proof blocker repair

on:
  pull_request:
    paths:
      - "m3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/semantic/M3SemanticHashRecipeTest.java"
      - "m3/m3-import/current-full-borrow/string-target-successor-chain.tsv"
      - "m3/m3-import/current-full-borrow/test_string_phase_successors.py"
      - ".github/workflows/m3-jdk21-backport-dag.yml"
      - ".github/workflows/m3-full-borrow-receiver.yml"
      - ".github/workflows/m3-shared-proof-repair.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Bootstrap pinned source-built closure
        shell: bash
        run: |
          set -euo pipefail
          bash m3/m3-import/pure-int-recipe-custody/install.sh "$PWD"

      - name: Prove semantic hash regression fixture
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=jdk.m3.rewrite.semantic.M3SemanticHashRecipeTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Prove append-only current String successor custody
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/m3-import/current-full-borrow/test_string_phase_successors.py -v
          python3 m3/m3-import/current-full-borrow/check_string_phase.py
