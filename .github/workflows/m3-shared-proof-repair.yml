name: M3 shared proof blocker repair

# Former triggers (below, as of the move) now start job(s) 'm3-shared-proof-repair__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - "m3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/semantic/M3SemanticHashRecipeTest.java"
#         - "m3/m3-import/current-full-borrow/string-target-successor-chain.tsv"
#         - "m3/m3-import/current-full-borrow/test_string_phase_successors.py"
#         - ".github/workflows/m3jdk21-backport-dag.yml"
#         - ".github/workflows/m3-full-borrow-receiver.yml"
#         - ".github/workflows/m3-shared-proof-repair.yml"
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven



      - name: Prove append-only current String successor custody
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/m3-import/current-full-borrow/test_string_phase_successors.py -v
          python3 m3/m3-import/current-full-borrow/check_string_phase.py
