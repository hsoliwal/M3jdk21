name: M3 filtered sorted composition Java21 and source custody
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongFilteredView.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongSortedViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3FilteredSortedCompositionSelfTest.java'
      - 'm3/collections/qualification/filtered-sorted-postimages-20261016.tsv'
      - '.github/workflows/m3-filtered-sorted-composition-receiver.yml'
  push:
    branches:
      - m3/filtered-sorted-composition-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source seals including original primitive mask receiving
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/collections/qualification/verify_mask_selection.py
          python3 m3/collections/qualification/verify_mask_keyed.py
          python3 m3/collections/qualification/verify_mask_priority.py
          python3 m3/collections/qualification/verify_filtered_sorted.py
      - name: Compile target-owned M3 collection core and test against Java 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-filtered-sorted
          find m3/collections/src/main/java/com/m3/collections -name '*.java' -print | sort > /tmp/m3-filtered-sorted-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror             -d /tmp/m3-filtered-sorted @/tmp/m3-filtered-sorted-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror             -cp /tmp/m3-filtered-sorted -d /tmp/m3-filtered-sorted             m3/collections/src/test/java/com/m3/collections/M3FilteredSortedCompositionSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskKeyedSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskPrioritySelfTest.java
          java -Xcheck:jni -cp /tmp/m3-filtered-sorted com.m3.collections.M3FilteredSortedCompositionSelfTest
          java -Xcheck:jni -cp /tmp/m3-filtered-sorted com.m3.collections.M3IndexMaskCompactorSelfTest
          java -Xcheck:jni -cp /tmp/m3-filtered-sorted com.m3.collections.M3IndexMaskKeyedSelfTest
          java -Xcheck:jni -cp /tmp/m3-filtered-sorted com.m3.collections.M3IndexMaskPrioritySelfTest
      - name: Check target JNI boundary retained and compiled
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror             -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_mask_compactor.c             -o /tmp/libm3_collections_mask.so
          java -Xcheck:jni -Djava.library.path=/tmp -cp /tmp/m3-filtered-sorted             com.m3.collections.M3IndexMaskCompactorSelfTest --native
