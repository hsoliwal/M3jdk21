name: M3 sorted-set algebra Java21 and JNI regression
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongCompositeViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongSortedAlgebra*.java'
      - 'm3/collections/qualification/sorted-set-algebra-postimages-20261017.tsv'
      - '.github/workflows/m3-sorted-set-algebra-receiver-20261017.yml'
  push:
    branches: [m3/primitive-sorted-set-algebra-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-primitive-module-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify existing module and new exact source custody
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/collections/qualification/verify_mask_selection.py
          python3 m3/collections/qualification/verify_mask_keyed.py
          python3 m3/collections/qualification/verify_mask_priority.py
          python3 m3/collections/qualification/verify_filtered_sorted.py
          python3 m3/collections/qualification/verify_filtered_view_late_union.py
          python3 m3/collections/qualification/verify_sorted_set_algebra.py
          python3 -m unittest discover -s m3/collections/qualification             -p 'test_verify_filtered_sorted_successor.py' -v
      - name: Compile every original M3 Java21 primitive collection source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-sorted-algebra
          find m3/collections/src/main/java/com/m3/collections -name '*.java' -print | sort > /tmp/m3-sorted-algebra-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror             -d /tmp/m3-sorted-algebra @/tmp/m3-sorted-algebra-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror             -cp /tmp/m3-sorted-algebra -d /tmp/m3-sorted-algebra             m3/collections/src/test/java/com/m3/collections/M3LongSortedAlgebraSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3LongFilteredViewUnionSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3FilteredSortedCompositionSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskKeyedSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskPrioritySelfTest.java
          java -Xcheck:jni -cp /tmp/m3-sorted-algebra com.m3.collections.M3LongSortedAlgebraSelfTest
          java -Xcheck:jni -cp /tmp/m3-sorted-algebra com.m3.collections.M3LongFilteredViewUnionSelfTest
          java -Xcheck:jni -cp /tmp/m3-sorted-algebra com.m3.collections.M3FilteredSortedCompositionSelfTest
          java -Xcheck:jni -cp /tmp/m3-sorted-algebra com.m3.collections.M3IndexMaskCompactorSelfTest
          java -Xcheck:jni -cp /tmp/m3-sorted-algebra com.m3.collections.M3IndexMaskKeyedSelfTest
          java -Xcheck:jni -cp /tmp/m3-sorted-algebra com.m3.collections.M3IndexMaskPrioritySelfTest
      - name: Rebuild and run existing product JNI mask kernel
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror             -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_mask_compactor.c             -o /tmp/libm3_collections_mask.so
          java -Xcheck:jni -Djava.library.path=/tmp -cp /tmp/m3-sorted-algebra             com.m3.collections.M3IndexMaskCompactorSelfTest --native
