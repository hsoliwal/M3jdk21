name: Owned M3 Guava evicting queue contracts
on:
  pull_request:
    paths:
      - 'm3/collections/implementations/guava-evicting-queue/**'
      - 'm3/collections/qualification/owned-guava-evicting-queue-20261018/**'
      - 'm3/collections/recipe/owned-guava-evicting-queue-20261018/**'
      - 'm3/collections/src/main/java/**'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - '.github/workflows/m3-owned-guava-evicting-queue.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact provider and run frozen owned/public-surface/primitive JNI protocols
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-guava-evicting-queue"
          mkdir -p "$M3_TASK_OUT/core" "$M3_TASK_OUT/classes" "$M3_TASK_OUT/proofs" "$M3_TASK_OUT/native" "$M3_TASK_OUT/tmp"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_PROVIDER="$M3_TASK_OUT/guava-33.4.8-jre.jar"
          curl --fail --location --silent --show-error --output "$M3_PROVIDER" https://repo.maven.apache.org/maven2/com/google/guava/guava/33.4.8-jre/guava-33.4.8-jre.jar
          M3_Q="m3/collections/qualification/owned-guava-evicting-queue-20261018"
          python -I -S -B "$M3_Q/verify.py" --jar "$M3_PROVIDER"
          find m3/collections/src/main/java -name '*.java' | sort > "$M3_TASK_OUT/core.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -g -proc:none -Xlint:all,-module -Werror -d "$M3_TASK_OUT/core" @"$M3_TASK_OUT/core.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -g -proc:none -Xlint:all -Werror -d "$M3_TASK_OUT/classes" m3/collections/implementations/guava-evicting-queue/src/main/java/com/m3/collections/guava/M3EvictingQueue.java
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -g -proc:none -Xlint:all,-module -Werror -cp "$M3_TASK_OUT/core" -d "$M3_TASK_OUT/proofs" "$M3_Q/GuavaEvictingQueueProtocolProof.java" "$M3_Q/GuavaEvictingQueuePublicSurfaceProof.java" "$M3_Q/GuavaEvictingQueueMaskProjectionProof.java" "$M3_Q/GuavaEvictingQueueSerializationProof.java"
          gcc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" m3/collections/src/main/native/collections/m3_index_mask_compactor.c -o "$M3_TASK_OUT/native/libm3_collections_mask.so"
          M3_PROVIDER_CP="$M3_TASK_OUT/proofs:$M3_TASK_OUT/core:$M3_PROVIDER"
          M3_OWNED_CP="$M3_TASK_OUT/proofs:$M3_TASK_OUT/core:$M3_TASK_OUT/classes"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_PROVIDER_CP" GuavaEvictingQueueProtocolProof com.google.common.collect.EvictingQueue > "$M3_TASK_OUT/provider-protocol.json"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_OWNED_CP" GuavaEvictingQueueProtocolProof com.m3.collections.guava.M3EvictingQueue > "$M3_TASK_OUT/owned-protocol.json"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_TASK_OUT/proofs:$M3_TASK_OUT/classes:$M3_PROVIDER" GuavaEvictingQueuePublicSurfaceProof > "$M3_TASK_OUT/surface.json"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_PROVIDER_CP" GuavaEvictingQueueMaskProjectionProof com.google.common.collect.EvictingQueue java > "$M3_TASK_OUT/provider-projection.json"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_OWNED_CP" GuavaEvictingQueueMaskProjectionProof com.m3.collections.guava.M3EvictingQueue java > "$M3_TASK_OUT/owned-projection-java.json"
          java -Xmx512m -XX:-UsePerfData -Xcheck:jni -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/native" -cp "$M3_OWNED_CP" GuavaEvictingQueueMaskProjectionProof com.m3.collections.guava.M3EvictingQueue native > "$M3_TASK_OUT/owned-projection-native.json"
          java -Xmx256m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_OWNED_CP" GuavaEvictingQueueSerializationProof com.m3.collections.guava.M3EvictingQueue > "$M3_TASK_OUT/owned-serialization.jsonl"
          python -I -S -B "$M3_Q/compare.py" "$M3_TASK_OUT"
          python -I -S -B "$M3_Q/verify.py" --jar "$M3_PROVIDER"
          M3_BUDGET_OUT="$M3_TASK_OUT" python -I -S -B -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["M3_BUDGET_OUT"]); assert sum(f.stat().st_size for f in p.rglob("*") if f.is_file())<=512*1024**2; assert shutil.disk_usage(p).free>=8*1024**3'
          git diff --exit-code
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run exact receiving Maven host
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-guava-evicting-queue-receiving"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/m2"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          export MAVEN_OPTS="-Xmx512m -XX:-UsePerfData -Djava.io.tmpdir=$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_Q="m3/collections/qualification/owned-guava-evicting-queue-20261018"
          python -I -S -B "$M3_Q/verify.py"
          mvn -B -ntp -f m3/collections/recipe/owned-guava-evicting-queue-20261018/pom.xml -Dmaven.repo.local="$M3_TASK_OUT/m2" -Dm3.recipe.output="$M3_TASK_OUT/target" test
          python -I -S -B "$M3_Q/verify.py"
          M3_BUDGET_OUT="$M3_TASK_OUT" python -I -S -B -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["M3_BUDGET_OUT"]); assert sum(f.stat().st_size for f in p.rglob("*") if f.is_file())<=512*1024**2; assert shutil.disk_usage(p).free>=8*1024**3'
          git diff --exit-code
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Package standalone JDK-only owned module with retained licenses
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-guava-evicting-queue-module"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/m2"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          export MAVEN_OPTS="-Xmx512m -XX:-UsePerfData -Djava.io.tmpdir=$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_Q="m3/collections/qualification/owned-guava-evicting-queue-20261018"
          python -I -S -B "$M3_Q/verify.py"
          mvn -B -ntp -f m3/collections/implementations/guava-evicting-queue/pom.xml -Dmaven.repo.local="$M3_TASK_OUT/m2" -Dm3.module.output="$M3_TASK_OUT/target" package
          python -I -S -B "$M3_Q/verify_module.py" "$M3_TASK_OUT/target/m3-owned-guava-evicting-queue-0.1.0-SNAPSHOT.jar"
          python -I -S -B "$M3_Q/verify.py"
          M3_BUDGET_OUT="$M3_TASK_OUT" python -I -S -B -c 'import os,shutil; from pathlib import Path; p=Path(os.environ["M3_BUDGET_OUT"]); assert sum(f.stat().st_size for f in p.rglob("*") if f.is_file())<=512*1024**2; assert shutil.disk_usage(p).free>=8*1024**3'
          git diff --exit-code
