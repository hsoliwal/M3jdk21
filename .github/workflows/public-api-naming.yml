name: Public JDK naming contract
# Former triggers (below, as of the move) now start job(s) 'public-api-naming__*' in
# .github/workflows/checks-superset-03.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       branches: [master]
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-names:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test naming refusal and unchanged historic owners
        run: python3 -m unittest discover -s m3/compatibility -p test_public_names.py -v
      - name: Check exact PR changes against public JDK naming rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 m3/compatibility/check_public_names.py --base "$BASE" --head "$HEAD"
