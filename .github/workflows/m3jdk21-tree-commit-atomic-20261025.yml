name: M3JDK21 primitive viewport commit atomicity
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3TreeCommitAtomicityTest.java'
      - 'm3/collections/qualification/arraylist-dual-word-20261023/RECEIVER_RECEIPT.json'
      - 'm3/collections/qualification/tree-commit-atomic-20261025/**'
      - 'm3/collections/algorithm-catalog/tree-commit-atomic-20261025.tsv'
      - '.github/workflows/m3jdk21-tree-commit-atomic-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-collection-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            m3/collections/**
            m3/native/include/m3_jni_core.h
            .github/workflows/m3jdk21-tree-commit-atomic-20261025.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Read back sealed source and prior receiver lineage
        run: |
          python3 m3/collections/qualification/arraylist-dual-word-20261023/verify_receiver.py
          python3 -m unittest discover \
            -s m3/collections/qualification/arraylist-dual-word-20261023 \
            -p 'test_verify_receiver.py' -v
          python3 m3/collections/qualification/tree-commit-atomic-20261025/verify_receipt.py
          python3 -m unittest discover \
            -s m3/collections/qualification/tree-commit-atomic-20261025 \
            -p 'test_verify_receipt.py' -v
      - name: Build actual original native array substrate
        run: mvn -B -ntp -f m3/arrays/pom.xml -Pnative-linux -DskipTests install
      - name: Bind verified original native array library
        run: |
          test -s "$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so"
          echo "JAVA_TOOL_OPTIONS=-Dm3.arrays.native.path=$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so" >> "$GITHUB_ENV"
      - name: Compile all collection sources and test transactional commits
        run: |
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3TreeCommitAtomicityTest,M3TreeCoverageTest test
