# SPDX-License-Identifier: Apache-2.0
# Checks superset 03: generated by .github/checks-superset/generate.py from filters.json and the member
# workflow files, which stay the source of truth for every member job below. Do not edit by hand: edit the
# member file, then run  python3 .github/checks-superset/generate.py build
name: 'Checks superset 03'

on:
  push:
    branches: ["m3/restore-merged-atoms-ci-20261022", "master"]
  pull_request:
  workflow_dispatch:
    inputs:
      select:
        description: "Members to run: all, or member file names / keys separated by spaces or commas"
        required: false
        default: "all"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/master' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  gate:
    name: 'Superset gate'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: 'Check out the gate files'
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/checks-superset
          fetch-depth: 1
          filter: blob:none
      - name: 'Decide member workflows from triggers, branches and changed paths (plain git)'
        id: gate
        run: python3 .github/checks-superset/gate.py 03

  m3-object-filtered-deques-20261017__java21-contract:
    name: "m3-object-filtered-deques-java21 / java21-contract"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-object-filtered-deques-20261017'] }}"
    concurrency:
      group: "m3-object-filtered-deques-java21-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java 21 source contract
        run: bash m3/collections/verification/filtered-object-deques-20261017/verify.sh

  m3-primitive-filtered-sequences-java21__java21-contract:
    name: "m3-primitive-filtered-sequences-java21 / java21-contract"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-primitive-filtered-sequences-java21'] }}"
    concurrency:
      group: "m3-primitive-filtered-sequences-java21-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Product-backed primitive filtered sequence contracts
        run: bash m3/collections/verification/primitive-filtered-sequences-20261017/verify.sh

  m3-repository-file-census__repository-file-census:
    name: "M3 repository file atom census / repository-file-census"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-repository-file-census'] }}"
    permissions:
      contents: read
    concurrency:
      group: "m3-repository-file-census-${{ github.event.pull_request.number || github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out exact candidate tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Generate and verify repository file atoms
        run: m3/tooling/atom-census/verify-repository-census.sh
      - name: Retain commit-sealed census
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-repository-file-census-${{ github.sha }}
          path: build/m3-repository-file-census/
          if-no-files-found: error
          retention-days: 14

  m3jdk-naming__naming:
    name: "M3JDK naming standard / naming"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk-naming'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK naming standard-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Recipe tests (rename, reseal, rename_types, fold_package)
        run: |
          python3 -I m3/tooling/jdk-naming/test_jdk_naming.py
          python3 -I m3/tooling/jdk-naming/test_reseal.py
          python3 -I m3/tooling/jdk-naming/test_rename_types.py
          python3 -I m3/tooling/jdk-naming/test_fold_package.py
          python3 -I m3/tooling/jdk-naming/test_product_name.py
      - name: Package layout gate (no new package, module root or split package without approval)
        run: |
          python3 -I m3/tooling/jdk-naming/test_package_gate.py
          python3 -I m3/tooling/jdk-naming/test_pom_dependents.py
          python3 -I m3/tooling/jdk-naming/test_move_refs.py
          python3 -I m3/tooling/jdk-naming/package_gate.py check --tree HEAD
      - name: Recipe fixed point on the tree
        run: |
          python3 -I m3/tooling/jdk-naming/jdk_naming.py plan --tree HEAD --tsv naming-plan.tsv | tee naming-plan.txt
          grep -q 'moves=0 rewrites=0 refusals=0' naming-plan.txt
      - name: JUnit conformance
        run: mvn -B -ntp -f m3/tooling/jdk-naming/conformance/pom.xml test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: naming-plan
          path: naming-plan.tsv

  public-api-naming__public-names:
    name: "Public JDK naming contract / public-names"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['public-api-naming'] }}"
    permissions:
      contents: read
    concurrency:
      group: "Public JDK naming contract-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Test naming refusal and unchanged historic owners
        run: python3 -m unittest discover -s m3/compatibility -p test_public_names.py -v
      - name: Check exact PR changes against public JDK naming rules
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 m3/compatibility/check_public_names.py --base "$BASE" --head "$HEAD"

  m3-observable-indexed-views-20261021__java21-owner-and-recipe:
    name: "M3 observable filtered and sorted indexed views Java21 / java21-owner-and-recipe"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-observable-indexed-views-20261021'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 observable filtered and sorted indexed views Java21-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original jdk.m3.arrays module before dependent collections
        shell: bash
        run: |
          set -euo pipefail
          modules="$RUNNER_TEMP/m3-observable/modules"
          mkdir -p "$modules/jdk.m3.arrays"
          mapfile -d '' -t array_sources < <(
            find m3/arrays/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/arrays -type f -name '*.java' -print0 | sort -z
          )
          test "${#array_sources[@]}" -ge 2
          test -f m3/arrays/src/main/java/module-info.java
          javac --release 21 -Xlint:all,-module -Werror \
            -d "$modules/jdk.m3.arrays" "${array_sources[@]}"
          test -f "$modules/jdk.m3.arrays/module-info.class"
          java --module-path "$modules" --describe-module jdk.m3.arrays
      - name: Compile existing M3 dynamic-array/index-mask owners and contracts
        shell: bash
        run: |
          set -euo pipefail
          modules="$RUNNER_TEMP/m3-observable/modules"
          test -f "$modules/jdk.m3.arrays/module-info.class"
          mkdir -p "$modules/jdk.m3.collections"
          mapfile -d '' -t collection_sources < <(
            find m3/collections/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/collections src/jdk.m3.collections/share/classes/jdk/internal/m3/collections -type f -name '*.java' ! -name module-info.java -print0 | sort -z
          )
          test "${#collection_sources[@]}" -ge 1
          javac --release 21 -Xlint:all,-module -Werror \
            --module-path "$modules" \
            -sourcepath m3/collections/src/main/java:src/jdk.m3.collections/share/classes:test/jdk \
            -d "$modules/jdk.m3.collections" \
            m3/collections/src/main/java/module-info.java \
            "${collection_sources[@]}" \
            test/jdk/jdk/internal/m3/collections/ObservableListContract.java \
            test/jdk/jdk/m3/collections/ObservableIndexedViewsContract.java
      - name: Check observable workflow source wiring
        run: python3 -m unittest discover -s m3/collections -p test_observable_workflow.py -v
      - name: Existing observable List contract
        run: java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-observable/modules" -m jdk.m3.collections/jdk.internal.m3.collections.ObservableListContract
      - name: Observable filtered/sorted primitive-index contract
        run: java -Xcheck:jni --module-path "$RUNNER_TEMP/m3-observable/modules" -m jdk.m3.collections/jdk.m3.collections.ObservableIndexedViewsContract
