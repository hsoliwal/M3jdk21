# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 deep filter composition recipe qualification
on:
  pull_request:
    paths:
      - '.github/workflows/m3jdk-deep-filter-composition-20261017.yml'
      - 'm3/collections/wrappers/deep-filter-20261017/**'
      - 'm3/collections/wrappers/recipe/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionViews.java'
      - 'm3/collections/wrappers/src/test/java/com/m3/collections/M3DeepFilter*'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inherited-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Existing real Maven/OpenRewrite SDK baseline (not new feature acceptance)
        run: mvn -B -ntp -f m3/collections/wrappers/recipe/pom.xml test -Dtest=M3FlatMapMetadataReceiverRecipeTest
      - name: Package source-exact local qualification inputs and public dependency cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qualification-inputs
          git rev-parse HEAD > qualification-inputs/commit.txt
          tar -czf qualification-inputs/collections-source.tar.gz m3/collections
          tar -czf qualification-inputs/maven-public-repository.tar.gz -C "$HOME/.m2" repository
          MAVEN_BIN=$(readlink -f "$(command -v mvn)")
          MAVEN_HOME=$(dirname "$(dirname "$MAVEN_BIN")")
          tar -czf qualification-inputs/maven-runtime.tar.gz -C "$MAVEN_HOME" .
      - uses: actions/upload-artifact@v4
        with:
          name: deep-filter-qualification-inputs
          path: qualification-inputs/
          retention-days: 3
