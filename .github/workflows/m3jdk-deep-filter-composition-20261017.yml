# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 deep filter composition recipe qualification
on:
  pull_request:
    paths:
      - '.github/workflows/m3jdk-deep-filter-composition-20261017.yml'
      - 'm3/collections/wrappers/**'
      - 'm3/collections/counts/recipe/pinned-engine/**'
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionViews.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredMaps.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-named-maven-openrewrite:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Real named Java LST and native recipe proof before Results export
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/wrappers/recipe/pom.xml test \
            -Dtest=M3DeepFilterRecipeTest \
            -Dm3.deep.sdk.output="$RUNNER_TEMP/m3-deep-sdk"
      - uses: actions/upload-artifact@v4
        with:
          name: m3-deep-sdk-results
          path: ${{ runner.temp }}/m3-deep-sdk/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-deep-sdk-reports
          path: m3/collections/wrappers/recipe/target/surefire-reports/
          retention-days: 7

  generated-java-jni-and-installed-seal:
    needs: actual-named-maven-openrewrite
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            m3/collections
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: m3-deep-sdk-results
          path: ${{ runner.temp }}/m3-deep-sdk
      - name: Qualify existing replay, actual generated Java, old red controls and unchanged JNI kernel
        run: >-
          python3 m3/collections/wrappers/deep-filter-20261017/verify.py
          --root . --output "${{ runner.temp }}/m3-deep-proof"
      - name: SDK output, replay output and exact installed source must agree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import os
          root=Path('m3/collections/wrappers/deep-filter-20261017/replay-inputs')
          sdk=Path(os.environ['RUNNER_TEMP'])/'m3-deep-sdk'
          replay=Path(os.environ['RUNNER_TEMP'])/'m3-deep-proof/generated'
          rows=[line.split('\t') for line in (root/'manifest.tsv').read_text().splitlines()]
          assert len(rows)==6 and (sdk/'SDK_RECEIPT.tsv').is_file()
          for path,before,after,template in rows:
              for base in [sdk,replay,Path('.')]:
                  file=base/path
                  assert file.is_file() and not file.is_symlink(), str(file)
                  assert sha256(file.read_bytes()).hexdigest()==after, str(file)
          print('M3_DEEP_FILTER_INSTALLED_SEAL_PASS targets=6')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-deep-java-jni-proof
          path: ${{ runner.temp }}/m3-deep-proof/evidence/
          retention-days: 7
