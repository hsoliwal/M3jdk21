name: M3JDK21 java.base mask-run budget proof
# Former triggers (below, as of the move) now start job(s) 'm3-mask-run-budget-20261020__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     workflow_dispatch:
#     pull_request:
#       paths:
#         - 'src/java.base/share/classes/jdk/internal/mindex/M3CollectionMaskCompactor.java'
#         - 'm3/qualification/mask-run-budget-20261020/**'
#         - 'm3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-mask-run-budget-20261020/**'
#         - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-mask-run-budget-20261020.yml'
#         - '.github/workflows/m3-mask-run-budget-20261020.yml'
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-sealed-product-atom:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate canonical source and differential contracts
        run: bash m3/qualification/mask-run-budget-20261020/verify.sh
