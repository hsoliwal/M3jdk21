# SPDX-License-Identifier: Apache-2.0
name: M3 counted bag Guava Apache SDK Java JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3CountedBag.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3CountedBag*'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3GuavaMultiset.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3ApacheMultiSet.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3CountedProviderContractTest.java'
      - 'm3/collections/qualification/m3-counted-sdk-20261017/**'
      - '.github/workflows/m3-counted-sdk-20261017.yml'
  workflow_dispatch:
jobs:
  source-sealed-recipe-and-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Maven recipe and exact receiver source proof
        run: |
          set -eu
          RECIPE=m3/collections/qualification/m3-counted-sdk-20261017/recipe
          mvn -B -ntp -f "$RECIPE/pom.xml" verify
          java -cp "$RECIPE/target/classes" com.synexia.m3.M3CountedSdkRecipe --check .
      - name: Compile and run real M3 owner and core counted JUnit contracts
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3CountedBagTest test
      - name: Build current M3 core without bypassing warning gates
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Compile against real Guava and Apache jars and execute provider differential
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/interop/pom.xml -Dtest=M3CountedProviderContractTest test
      - name: Real bounded JNI selector with strict C17 and checked JNI
        run: |
          set -eu
          NATIVE="$RUNNER_TEMP/m3-counted-native"
          mkdir -p "$NATIVE"
          cc -std=c17 -O1 -g -fPIC -shared -Wall -Wextra -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$NATIVE/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$NATIVE" \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3CountedBagSelfTest
