name: M3 object-state slot explicit ctor Java21 contract
# Former triggers (below, as of the move) now start job(s) 'm3-state-slots-constructor-20261017__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     push:
#       branches: ["m3/state-slots-explicit-constructor-20261017"]
#     pull_request:
#       paths:
#         - "src/jdk.m3.collections/share/classes/jdk/m3/collections/M3ObjectStateSlots28.java"
#         - "m3/collections/qualification/state-slots-constructor-20261017/**"
#         - ".github/workflows/m3-state-slots-constructor-20261017.yml"
on:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-api-and-strict-java21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Before/after generated source SHA, javap API equality and real state-slot contract
        run: sh m3/collections/qualification/state-slots-constructor-20261017/verify.sh
