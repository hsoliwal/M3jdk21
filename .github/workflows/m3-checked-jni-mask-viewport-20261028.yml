# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 current-master viewport JNI checked Java21 and UBSan
on:
  pull_request:
    paths:
      - 'm3/collections/src/test/java/com/m3/collections/M3MaskViewportCheckedJniContract.java'
      - 'm3/collections/qualification/checked-jni-mask-viewport-20261028/**'
      - '.github/workflows/m3-checked-jni-mask-viewport-20261028.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checked-jni-g1-serial:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact native source, link actual JNI and compare Java CPU oracle
        shell: bash
        run: |
          set -o pipefail
          bash m3/collections/qualification/checked-jni-mask-viewport-20261028/verify.sh \
            2>&1 | tee m3-checked-jni-viewport.log
      - name: Retain exact native/JVM compiler and parity evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-checked-jni-viewport-g1-serial
          path: |
            m3-checked-jni-viewport.log
            m3/collections/target/surefire-reports/**
          if-no-files-found: warn
          retention-days: 14
