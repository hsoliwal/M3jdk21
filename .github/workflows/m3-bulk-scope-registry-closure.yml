name: M3 Bulk Scope Registry Closure

on:
  pull_request:
    paths:
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/scope/M3RecipeScopeRegistry.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/scope/M3ScopeCoverageClosureTest.java'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3BulkScopeRegistryRecoveryReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3BulkScopeRegistryRecoveryReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-scope-recovery-20261014/**'
      - 'm3/tooling/migration-recipes/tasks/bulk-scope-registry-recovery/**'
      - '.github/workflows/m3-bulk-scope-registry-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-source-custody:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require exact hash-pinned Java sources and fixed-point bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root = Path('.')
          base = root/'m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-scope-recovery-20261014/'
          rows = [x.split('\t') for x in (base/'manifest.tsv').read_text().splitlines() if x]
          assert len(rows) == 2
          for target, before, after, resource in rows:
              assert before == 'ABSENT' or len(before) == 64
              source = (base/resource).read_bytes()
              actual = (root/target).read_bytes()
              assert sha256(source).hexdigest() == after, target
              assert source == actual, target
          print('PASS: exact source custody and second-run fixed point; 2 targets')
          PY

  real-recipe-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned OpenRewrite and complete JUnit source closure
        run: >
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl rewrite-java-21,rewrite-test,junit-jupiter-5.10.2,junit-platform-launcher-1.10.2
          -am -DskipTests install
      - name: Install canonical Synexia recipe custody
        run: bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - name: Execute full registry and receipt tests
        run: >
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3ScopeCoverageClosureTest,M3BulkScopeRegistryRecoveryReceiverRecipeTest
          test
      - name: Install target recipe classpath
        run: mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml -DskipTests install
      - name: Require OpenRewrite fixed point
        run: >
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Drewrite.recipeArtifactCoordinates=com.m3.tooling:migration-recipes:0.1.0-SNAPSHOT
          -Drewrite.activeRecipes=com.m3.rewrite.backport.M3BulkScopeRegistryRecoveryReceiverRecipe
          rewrite:dryRun
