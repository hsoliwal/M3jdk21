name: M3 Bulk Scope Registry Closure

on:
  pull_request:
    paths:
      - 'm3/tooling/migration-recipes/src/main/java/jdk/m3/rewrite/scope/M3RecipeScopeRegistry.java'
      - 'm3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/scope/M3ScopeCoverageClosureTest.java'
      - 'm3/tooling/migration-recipes/src/main/java/jdk/m3/rewrite/backport/M3BulkScopeRegistryRecoveryReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/backport/M3BulkScopeRegistryRecoveryReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-scope-recovery-20261014/**'
      - 'm3/tooling/migration-recipes/tasks/bulk-scope-registry-recovery/**'
      - '.github/workflows/m3-bulk-scope-registry-closure.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source-custody:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Require exact hash-pinned Java sources and fixed-point bytes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root = Path('.')
          base = root/'m3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-scope-recovery-20261014/'
          rows = [x.split('\t') for x in (base/'manifest.tsv').read_text().splitlines() if x]
          assert len(rows) == 2
          for target, before, after, resource in rows:
              assert before == 'ABSENT' or len(before) == 64
              source = (base/resource).read_bytes()
              actual = (root/target).read_bytes()
              assert sha256(source).hexdigest() == after, target
              assert source == actual, target
          print('PASS: exact source custody and second-run fixed point; 2 targets')
          PY

