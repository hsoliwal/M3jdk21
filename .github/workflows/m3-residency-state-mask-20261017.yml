# SPDX-License-Identifier: Apache-2.0
name: M3 residency state-mask array/JNI receiver verification
on:
  push:
    branches: ["m3/residency-state-mask-java-jni-20261017"]
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/M3ResidencyStateMaskIndex.java"
      - "m3/collections/src/test/java/com/m3/collections/M3ResidencyStateMask*"
      - "m3/collections/src/main/native/collections/m3_residency_state_mask.c"
      - "m3/collections/qualification/residency-state-mask-20261017/**"
      - ".github/workflows/m3-residency-state-mask-20261017.yml"
jobs:
  strict-source-and-real-jdk-jni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact SHA256 source-to-recipe and JNI five-collector compatibility
        run: sh m3/collections/qualification/residency-state-mask-20261017/verify.sh
  existing-module-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile retained M3 collections and focused JUnit contract
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3ResidencyStateMaskTest test
