name: M3 Eclipse framework indexed forward receiver
on:
  pull_request:
    branches: [master]
    paths:
      - 'm3/eclipse/framework/**'
      - 'm3/collections/src/main/java/**'
      - 'm3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java'
      - '.github/workflows/m3-eclipse-framework-forward-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  eclipse-framework-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          sparse-checkout: |
            m3/arrays
            m3/eclipse/framework
            m3/collections
            m3/tooling/migration-recipes
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify original, identity and full-flag successor source custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          original = Path('m3/eclipse/framework/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/eclipse-framework-m3-index-forward')
          current = Path('m3/eclipse/framework/recipe/flags-20261020/src/test/resources/com/synexia/rewrite/hash-pinned-java/m3-eclipse-full-delta-flags-20261020')
          old = [row.split('\t') for row in (original/'manifest.tsv').read_text().splitlines() if row and not row.startswith('#')]
          latest = [row.split('\t') for row in (current/'manifest.tsv').read_text().splitlines() if row and not row.startswith('#')]
          assert len(old) == 8 and len(latest) == 2
          assert [row[0] for row in old] == sorted(row[0] for row in old)
          assert [row[0] for row in latest] == sorted(row[0] for row in latest)
          replacements = {row[0]:row for row in latest}
          originals = {row[0]:row for row in old}
          # The historical recipe postimages stay sealed. Admit only this
          # qualified test-fixture successor after the full-width flags API.
          successor_tests = {
              'm3/eclipse/framework/src/test/java/com/m3/eclipse/framework/M3EclipseRuntimeActivatorTest.java': 'ca493e93c4a5c068948af0573563ca091b47e4455d9c7ef46a2dd9f3751d270c',
              'm3/eclipse/framework/src/test/java/com/m3/eclipse/framework/M3EclipseDeltaIdentitySetTest.java': 'a363fa6cca4799cc9ff1866d7848f4a1b7e3d60b9c707fdb035b28a240d1b8ae',
          }
          for path, after_hash in successor_tests.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == after_hash, path
          for path, before, expected, template in old:
              assert hashlib.sha256((original/template).read_bytes()).hexdigest() == expected, template
              if path not in replacements and path not in successor_tests:
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          delta = 'm3/eclipse/framework/src/main/java/com/m3/eclipse/framework/M3EclipseResourceDeltaSnapshot.java'
          assert originals[delta][2] == '3e499ab33152d8a79c3171ce96a20ae35968c8e573e1ac48b999ede35a7581ec'
          assert replacements[delta][1] == '94fc5f6ac7d87439758e8dc6544754e0a77ebbff52d36bbb8ae18a6447aa555c'
          identity = Path('m3/eclipse/framework/src/test/java/com/m3/eclipse/framework/M3EclipseDeltaIdentitySetTest.java')
          assert hashlib.sha256(identity.read_bytes()).hexdigest() == 'a363fa6cca4799cc9ff1866d7848f4a1b7e3d60b9c707fdb035b28a240d1b8ae'
          for path, before, after, template in latest:
              prior = current/template.replace('.after.txt','.before.txt')
              assert hashlib.sha256(prior.read_bytes()).hexdigest() == before, prior
              assert hashlib.sha256((current/template).read_bytes()).hexdigest() == after, template
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == after, path
          tracked = set(subprocess.check_output(['git','ls-files','m3/eclipse/framework/src'],text=True).splitlines())
          assert tracked == set(originals) | {str(identity)}, tracked ^ (set(originals) | {str(identity)})
          print('ECLIPSE_EIGHT_PLUS_IDENTITY_PLUS_FULL_FLAG_SOURCE_SEALS_OK')
          PY
      - name: Execute canonical source-sealed OpenRewrite recipe tests
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/framework/recipe/pom.xml test 2>&1 | tee proof/recipe.txt
          mvn -B -ntp -f m3/eclipse/framework/recipe/flags-20261020/pom.xml test 2>&1 | tee proof/delta-flags-recipe.txt
      - name: Compile original M3 arrays then collections with their real JPMS dependency
        run: |
          set -euxo pipefail
          mkdir -p proof/arrays-classes proof/classes
          find m3/arrays/src/main/java -name '*.java' | sort > proof/m3-arrays-sources.txt
          test -s proof/m3-arrays-sources.txt
          javac --release 21 -Xlint:all,-module -Werror \
            -d proof/arrays-classes @proof/m3-arrays-sources.txt 2>&1 | tee proof/m3-arrays-compile.txt
          test -f proof/arrays-classes/module-info.class
          jar --create --file proof/m3-arrays.jar -C proof/arrays-classes .
          jar --describe-module --file proof/m3-arrays.jar > proof/arrays-module-describe.txt
          grep -q '^com.m3.arrays' proof/arrays-module-describe.txt
          find m3/collections/src/main/java -name '*.java' | sort > proof/m3-sources.txt
          test -s proof/m3-sources.txt
          javac --release 21 --module-path proof/m3-arrays.jar -Xlint:all,-module -Werror \
            -d proof/classes @proof/m3-sources.txt 2>&1 | tee proof/m3-core-compile.txt
          test -f proof/classes/module-info.class
          jar --create --file proof/m3-collections.jar -C proof/classes .
          jar --create --file proof/m3-collections-osgi.jar --manifest m3/eclipse/framework/osgi/m3-collections.MF -C proof/classes .
          jar --describe-module --file proof/m3-collections.jar > proof/core-module-describe.txt
          grep -q '^com.m3.collections' proof/core-module-describe.txt
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$GITHUB_WORKSPACE/proof/m3-arrays.jar" \
            -DpomFile="$GITHUB_WORKSPACE/m3/arrays/pom.xml" -Dpackaging=jar
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$GITHUB_WORKSPACE/proof/m3-collections.jar" \
            -DpomFile="$GITHUB_WORKSPACE/m3/collections/pom.xml" -Dpackaging=jar
      - name: Compile and execute real Eclipse API tests
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/framework/pom.xml verify 2>&1 | tee proof/eclipse-maven.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          reports=list(Path('m3/eclipse/framework/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'no JUnit reports'
          roots=[E.parse(p).getroot() for p in reports]
          n={k:sum(int(v.attrib.get(k,0)) for v in roots) for k in ('tests','errors','failures','skipped')}
          assert n=={'tests':11,'errors':0,'failures':0,'skipped':0},n
          print('ECLIPSE_API_OSGI_SERVICE_JUNIT_TESTS',n)
          PY
          unzip -p m3/eclipse/framework/target/m3-eclipse-framework-forward-0.1.0-SNAPSHOT.jar META-INF/MANIFEST.MF > proof/eclipse-bundle-manifest.txt
          grep -q 'Bundle-Activator: com.m3.eclipse.framework.M3EclipseRuntimeActivator' proof/eclipse-bundle-manifest.txt
          unzip -p proof/m3-collections-osgi.jar META-INF/MANIFEST.MF > proof/collections-bundle-manifest.txt
          grep -q 'Export-Package: com.m3.collections' proof/collections-bundle-manifest.txt
          git diff --exit-code -- m3/eclipse/framework/src m3/collections/src/main/java
      - name: Retain exact-head evidence including failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-m3-framework-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/eclipse/framework/recipe/target/surefire-reports/
            m3/eclipse/framework/recipe/flags-20261020/target/surefire-reports/
            m3/eclipse/framework/target/surefire-reports/
