name: M3 Eclipse framework indexed forward receiver
on:
  pull_request:
    branches: [master]
    paths:
      - 'm3/eclipse/framework/**'
      - 'src/jdk.m3.collections/share/classes/**'
      - 'm3/pom.xml'
      - 'm3/arrays/**'
      - 'm3/collections/**'
      - 'test/jdk/jdk/m3/arrays/**'
      - 'test/jdk/jdk/m3/collections/**'
      - 'test/jdk/jdk/internal/m3/collections/**'
      - '.github/workflows/m3-eclipse-framework-forward-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eclipse-framework-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify original, identity and full-flag successor source custody
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          original = Path('m3/eclipse/framework/recipe/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/eclipse-framework-m3-index-forward')
          current = Path('m3/eclipse/framework/recipe/flags-20261020/src/test/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-eclipse-full-delta-flags-20261020')
          old = [row.split('\t') for row in (original/'manifest.tsv').read_text().splitlines() if row and not row.startswith('#')]
          latest = [row.split('\t') for row in (current/'manifest.tsv').read_text().splitlines() if row and not row.startswith('#')]
          assert len(old) == 8 and len(latest) == 2
          assert [row[0] for row in old] == sorted(row[0] for row in old)
          assert [row[0] for row in latest] == sorted(row[0] for row in latest)
          replacements = {row[0]:row for row in latest}
          originals = {row[0]:row for row in old}
          # The historical recipe postimages stay sealed. Admit only this
          # qualified test-fixture successor after the full-width flags API.
          successor_tests = {
              'm3/eclipse/framework/src/test/java/jdk/m3/eclipse/framework/M3EclipseRuntimeActivatorTest.java': '510f39d07ad486dbb7565c9db66cc30b480a11a2f21839a2d4e5193b5ada1022',
              'm3/eclipse/framework/src/test/java/jdk/m3/eclipse/framework/M3EclipseDeltaIdentitySetTest.java': '3f3221dc9c8d4a9b34c86374f2c798d96603b9b6201a5ae85fc0c0aeae01cc0e',
          }
          for path, after_hash in successor_tests.items():
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == after_hash, path
          for path, before, expected, template in old:
              assert hashlib.sha256((original/template).read_bytes()).hexdigest() == expected, template
              if path not in replacements and path not in successor_tests:
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected, path
          delta = 'm3/eclipse/framework/src/main/java/jdk/m3/eclipse/framework/M3EclipseResourceDeltaSnapshot.java'
          assert originals[delta][2] == '1ce2e7fac96924f307ab150a21e93303d2d0f1ecd422c68d6ab20b35039b276c'
          assert replacements[delta][1] == '21a893d7f976e5bf2d42998335d99556edfffb266016cce15d5784ebc1c19274'
          identity = Path('m3/eclipse/framework/src/test/java/jdk/m3/eclipse/framework/M3EclipseDeltaIdentitySetTest.java')
          assert hashlib.sha256(identity.read_bytes()).hexdigest() == '3f3221dc9c8d4a9b34c86374f2c798d96603b9b6201a5ae85fc0c0aeae01cc0e'
          for path, before, after, template in latest:
              prior = current/template.replace('.after.txt','.before.txt')
              assert hashlib.sha256(prior.read_bytes()).hexdigest() == before, prior
              assert hashlib.sha256((current/template).read_bytes()).hexdigest() == after, template
              assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == after, path
          tracked = set(subprocess.check_output(['git','ls-files','m3/eclipse/framework/src'],text=True).splitlines())
          assert tracked == set(originals) | {str(identity)}, tracked ^ (set(originals) | {str(identity)})
          print('ECLIPSE_EIGHT_PLUS_IDENTITY_PLUS_FULL_FLAG_SOURCE_SEALS_OK')
          PY
  maven-bundles:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and test the three Maven projects
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head.txt
          mvn -B -ntp -f m3/pom.xml -pl :m3-eclipse-framework-forward -am \
            -Peclipse-osgi -DforkCount=1 -DreuseForks=true clean verify 2>&1 | tee proof/eclipse-maven.txt
      - name: Check the packaged bundles and test reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          reports=list(Path('m3/eclipse/framework/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'no JUnit reports'
          roots=[E.parse(p).getroot() for p in reports]
          n={k:sum(int(v.attrib.get(k,0)) for v in roots) for k in ('tests','errors','failures','skipped')}
          assert n=={'tests':11,'errors':0,'failures':0,'skipped':0},n
          print('ECLIPSE_API_OSGI_SERVICE_JUNIT_TESTS',n)
          PY
          unzip -p m3/eclipse/framework/target/m3-eclipse-framework-forward-0.1.0-SNAPSHOT.jar META-INF/MANIFEST.MF > proof/eclipse-bundle-manifest.txt
          grep -q 'Bundle-Activator: jdk.m3.eclipse.framework.M3EclipseRuntimeActivator' proof/eclipse-bundle-manifest.txt
          unzip -p m3/collections/target/m3-collections-0.1.0-SNAPSHOT-osgi.jar META-INF/MANIFEST.MF > proof/collections-bundle-manifest.txt
          grep -q 'Export-Package: jdk.m3.collections' proof/collections-bundle-manifest.txt
          unzip -p m3/arrays/target/m3-arrays-0.1.0-SNAPSHOT-osgi.jar META-INF/MANIFEST.MF > proof/arrays-bundle-manifest.txt
          grep -q '^Bundle-SymbolicName: jdk.m3.arrays' proof/arrays-bundle-manifest.txt
          grep -q '^Bundle-SymbolicName: com.m3.collections' proof/collections-bundle-manifest.txt
          jar --describe-module --file m3/arrays/target/m3-arrays-0.1.0-SNAPSHOT.jar > proof/arrays-module.txt
          jar --describe-module --file m3/collections/target/m3-collections-0.1.0-SNAPSHOT.jar > proof/collections-module.txt
          grep -q '^jdk.m3.arrays' proof/arrays-module.txt
          grep -q '^jdk.m3.collections' proof/collections-module.txt
          git diff --exit-code -- m3/eclipse/framework/src src/jdk.m3.collections/share m3/collections/src/main/java
      - name: Retain exact-head evidence including failures
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eclipse-m3-framework-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/arrays/target/surefire-reports/
            m3/collections/target/surefire-reports/
            m3/eclipse/framework/target/surefire-reports/
