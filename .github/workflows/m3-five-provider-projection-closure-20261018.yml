name: M3 real five-library counted filtered indexed Java JNI
on:
  push:
    branches: [m3/five-provider-projection-closure-receiver-20261018]
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryIndexViews.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryExpandedContractsTest.java'
      - 'm3/collections/interop/qualification/five-provider-projection-closure-20261018/**'
      - '.github/workflows/m3-five-provider-projection-closure-20261018.yml'
permissions:
  contents: read
jobs:
  real-provider-jdk21:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact approved Synexia recipe postimages
        shell: bash
        run: |
          set -euo pipefail
          echo '33fe97faa1c93fb963be080529fb08112d852033fd82efa37b5eb5f5b0b44d2a  m3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryIndexViews.java' | sha256sum -c -
          echo 'a4006d9c2d9995ba22687ef40db45ddd62993f11804c65c55bbff7d9c95f7de4  m3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryExpandedContractsTest.java' | sha256sum -c -
      - name: Compile all ACTUAL M3 Java21 core owners with no fake classes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-core"
          find m3/collections/src/main/java -name '*.java' | sort > "$RUNNER_TEMP/m3-core-sources.txt"
          test -s "$RUNNER_TEMP/m3-core-sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -d "$RUNNER_TEMP/m3-core" @"$RUNNER_TEMP/m3-core-sources.txt"
          jar --create --file "$RUNNER_TEMP/m3-core.jar" -C "$RUNNER_TEMP/m3-core" .
          jdeps --print-module-deps "$RUNNER_TEMP/m3-core.jar" | tee "$RUNNER_TEMP/m3-modules.txt"
          test "$(cat "$RUNNER_TEMP/m3-modules.txt")" = java.base
      - name: Execute original real M3 standalone contract oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-core-tests"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -cp "$RUNNER_TEMP/m3-core" -d "$RUNNER_TEMP/m3-core-tests" \
            m3/collections/src/test/java/com/m3/collections/M3CollectionSdkSortedFactorySelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3FilteredViewsContract.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexPathMasksSelfTest.java
          java -ea -cp "$RUNNER_TEMP/m3-core:$RUNNER_TEMP/m3-core-tests" \
            com.m3.collections.M3CollectionSdkSortedFactorySelfTest
          java -ea -cp "$RUNNER_TEMP/m3-core:$RUNNER_TEMP/m3-core-tests" \
            com.m3.collections.M3FilteredViewsContract
          java -ea -cp "$RUNNER_TEMP/m3-core:$RUNNER_TEMP/m3-core-tests" \
            com.m3.collections.M3IndexPathMasksSelfTest
      - name: Install only the actually compiled M3 core JAR for optional provider tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$RUNNER_TEMP/m3-core.jar" -DgroupId=com.m3 \
            -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT \
            -Dpackaging=jar -DgeneratePom=true
      - name: Run actual JDK Guava Eclipse Spring and Apache Commons JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveLibraryExpandedContractsTest,M3FiveLibraryIndexViewsTest,M3FiveLibraryState32Test \
            test
      - name: Build both unchanged primitive C17/JNI selection libraries
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -fPIC -shared -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
          gcc -std=c17 -fPIC -shared -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Re-run real provider tests with checked JNI and signed masks
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveLibraryExpandedContractsTest,M3FiveLibraryState32Test \
            -DargLine="-ea -Xcheck:jni -Djava.library.path=$RUNNER_TEMP" test
      - name: Keep hosted real Java/vendor/JNI reports even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-real-five-provider-closure-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            m3/collections/interop/target/surefire-reports/
