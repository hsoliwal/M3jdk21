# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 Linux OS capability Java21/JNI admission
on:
  pull_request:
    paths:
      - 'src/jdk.m3.io/share/classes/jdk/m3/os/**'
      - 'src/jdk.m3.io/share/classes/module-info.java'
      - 'src/jdk.m3.io/share/native/libm3osprobe/**'
      - 'make/modules/jdk.m3.io/Lib.gmk'
      - 'test/jdk/jdk/m3/os/**'
      - 'docs/M3_OS_CAPABILITIES.md'
      - '.github/workflows/m3-os-native-capability-20261116.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-java21-linux-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict source seals and isolated Java21 + Linux JNI smoke
        shell: bash
        run: |
          set -euo pipefail
          bash -n test/jdk/jdk/m3/os/validate-java21-linux.sh
          bash test/jdk/jdk/m3/os/validate-java21-linux.sh
      - name: Read-only source audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff --exit-code
