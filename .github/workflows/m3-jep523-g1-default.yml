name: M3 JEP 523 G1 default policy

on:
  push:
    branches:
      - "m3/jep523-*"
      - "m3/jep523-g1-default-all-envs-20261006"
    paths:
      - "src/hotspot/share/gc/shared/gcConfig.cpp"
      - "test/hotspot/jtreg/gc/arguments/TestSelectDefaultGC.java"
      - "m3/backports/recipes/jep-523-g1-default/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jep523BackportRecipe.java"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk27-jep523-g1-default-java/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/jdk27-jep523-g1-default-text/**"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jep523BackportRecipeTest.java"
      - "m3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/backport/jdk27-jep523-g1-default/**"
      - ".github/workflows/m3-jep523-g1-default.yml"
      - "m3/tooling/validators/WorkflowStructureCheck.java"
      - "m3/compatibility/synexia-workflow-structure-check-receipt-20261008.tsv"
  pull_request:
    paths:
      - "src/hotspot/share/gc/shared/gcConfig.cpp"
      - "test/hotspot/jtreg/gc/arguments/TestSelectDefaultGC.java"
      - "m3/backports/recipes/jep-523-g1-default/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jep523BackportRecipe.java"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk27-jep523-g1-default-java/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/jdk27-jep523-g1-default-text/**"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jep523BackportRecipeTest.java"
      - "m3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/backport/jdk27-jep523-g1-default/**"
      - ".github/workflows/m3-jep523-g1-default.yml"
      - "m3/tooling/validators/WorkflowStructureCheck.java"
      - "m3/compatibility/synexia-workflow-structure-check-receipt-20261008.tsv"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 0 - Validate workflow through pinned Synexia receiver
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object m3/tooling/validators/WorkflowStructureCheck.java)" = \
            "f61be81f5a15bea78f1c5ae7d5555844c9cd2ea7"
          java m3/tooling/validators/WorkflowStructureCheck.java --self-test
          java m3/tooling/validators/WorkflowStructureCheck.java \
            .github/workflows/m3-jep523-g1-default.yml

      - name: Diff hygiene
        run: git diff --check

      - name: Refuse JEP 523 product-source drift in proof-only refresh
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="80b8534ad1e45002185fb3eeab233f98d3a7c0bd"
          git diff --exit-code "$BASE_SHA...HEAD" -- \
            src/hotspot/share/gc/shared/gcConfig.cpp \
            test/hotspot/jtreg/gc/arguments/TestSelectDefaultGC.java

      - name: Prove exact upstream product denominator
        shell: bash
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/upstream"
          git -C "$RUNNER_TEMP/upstream" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             86637704fd01493ddb57e455dbd1e35e4798237d
          mapfile -t paths < <(
            git -C "$RUNNER_TEMP/upstream" diff-tree               --no-commit-id --name-only -r               86637704fd01493ddb57e455dbd1e35e4798237d
          )
          test "${#paths[@]}" -eq 1
          test "${paths[0]}" = "src/hotspot/share/gc/shared/gcConfig.cpp"

      - name: Recipe JUnit and fixed point
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3Jep523BackportRecipeTest test

  g1-enabled:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install OpenJDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: Configure and build G1-enabled image
        shell: bash
        run: |
          set -euo pipefail
          bash configure             --with-boot-jdk="$JAVA_HOME"             --with-debug-level=release             --with-jvm-variants=server             --disable-warnings-as-errors
          make JOBS=2 images

      - name: Focused default-GC jtreg
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="test/hotspot/jtreg/gc/arguments/TestSelectDefaultGC.java"
          make JOBS=2 test TEST="test/hotspot/jtreg/gc/arguments/TestDisableDefaultGC.java"
          make JOBS=2 test TEST="test/hotspot/jtreg/gc/startup_warnings/TestSerialGC.java"
          make JOBS=2 test TEST="test/hotspot/jtreg/gc/startup_warnings/TestParallelGC.java"

      - name: Runtime smoke for both ergonomic modes and explicit Serial
        shell: bash
        run: |
          set -euo pipefail
          JAVA_BIN="$(find build -path '*/images/jdk/bin/java' -type f | head -n 1)"
          test -x "$JAVA_BIN"

          "$JAVA_BIN" -XX:-AlwaysActAsServerClassMachine -XX:+NeverActAsServerClassMachine             -XX:+PrintFlagsFinal -version > "$RUNNER_TEMP/nonserver.log" 2>&1
          grep -E 'bool[[:space:]]+UseG1GC[[:space:]]*=[[:space:]]*true' "$RUNNER_TEMP/nonserver.log"
          grep -E 'bool[[:space:]]+UseSerialGC[[:space:]]*=[[:space:]]*false' "$RUNNER_TEMP/nonserver.log"

          "$JAVA_BIN" -XX:+AlwaysActAsServerClassMachine -XX:-NeverActAsServerClassMachine             -XX:+PrintFlagsFinal -version > "$RUNNER_TEMP/server.log" 2>&1
          grep -E 'bool[[:space:]]+UseG1GC[[:space:]]*=[[:space:]]*true' "$RUNNER_TEMP/server.log"

          "$JAVA_BIN" -XX:+UseSerialGC -XX:+PrintFlagsFinal -version             > "$RUNNER_TEMP/serial.log" 2>&1
          grep -E 'bool[[:space:]]+UseSerialGC[[:space:]]*=[[:space:]]*true' "$RUNNER_TEMP/serial.log"
          grep -E 'bool[[:space:]]+UseG1GC[[:space:]]*=[[:space:]]*false' "$RUNNER_TEMP/serial.log"

  no-g1-fallback:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install OpenJDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: Configure and build image without G1
        shell: bash
        run: |
          set -euo pipefail
          bash configure             --with-boot-jdk="$JAVA_HOME"             --with-debug-level=release             --with-jvm-variants=server             --with-jvm-features=-g1gc             --disable-warnings-as-errors
          make JOBS=2 images

      - name: Preserve Java21 no-G1 fallback policy
        shell: bash
        run: |
          set -euo pipefail
          JAVA_BIN="$(find build -path '*/images/jdk/bin/java' -type f | head -n 1)"
          test -x "$JAVA_BIN"

          "$JAVA_BIN" -XX:+AlwaysActAsServerClassMachine -XX:-NeverActAsServerClassMachine             -XX:+PrintFlagsFinal -version > "$RUNNER_TEMP/server.log" 2>&1
          grep -E 'bool[[:space:]]+UseParallelGC[[:space:]]*=[[:space:]]*true' "$RUNNER_TEMP/server.log"

          "$JAVA_BIN" -XX:-AlwaysActAsServerClassMachine -XX:+NeverActAsServerClassMachine             -XX:+PrintFlagsFinal -version > "$RUNNER_TEMP/nonserver.log" 2>&1
          grep -E 'bool[[:space:]]+UseSerialGC[[:space:]]*=[[:space:]]*true' "$RUNNER_TEMP/nonserver.log"
