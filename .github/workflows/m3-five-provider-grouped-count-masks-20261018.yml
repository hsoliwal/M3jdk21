name: M3 five real-provider grouped arrays masks and JNI
on:
  push:
    branches:
      - 'm3/five-provider-grouped-count-masks-receiver-20261018'
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveProviderKeyGroups.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveProviderKeyGroupClosureTest.java'
      - 'm3/collections/interop/qualification/five-provider-grouped-count-masks-20261018/**'
      - '.github/workflows/m3-five-provider-grouped-count-masks-20261018.yml'
permissions:
  contents: read
jobs:
  actual-m3-and-five-provider:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check SHA-256 for exact reviewed recipe-source Java postimages
        shell: bash
        run: |
          set -euo pipefail
          echo '49767629cccbc847c4a66252f86ce18ce57be8aa49a685350624e570a126597f  m3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveProviderKeyGroups.java' | sha256sum -c -
          echo '97debdc8af2e48e695191daa9a5ad872b9d16131556b9372441ad75c3185a30a  m3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveProviderKeyGroupClosureTest.java' | sha256sum -c -
      - name: Strict Java21 compile ACTUAL M3 core and verify java.base boundary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-classes"
          find m3/collections/src/main/java -name '*.java' | sort > "$RUNNER_TEMP/m3-sources.txt"
          test -s "$RUNNER_TEMP/m3-sources.txt"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -d "$RUNNER_TEMP/m3-classes" @"$RUNNER_TEMP/m3-sources.txt"
          jar --create --file "$RUNNER_TEMP/m3-core.jar" -C "$RUNNER_TEMP/m3-classes" .
          jdeps --print-module-deps "$RUNNER_TEMP/m3-core.jar" | tee "$RUNNER_TEMP/module-closure.txt"
          test "$(cat "$RUNNER_TEMP/module-closure.txt")" = java.base
      - name: Run original JDK21 core group/mask standalone behavior oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/core-tests"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -cp "$RUNNER_TEMP/m3-classes" -d "$RUNNER_TEMP/core-tests" \
            m3/collections/src/test/java/com/m3/collections/M3CollectionSdkSortedFactorySelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexPathMasksSelfTest.java
          java -ea -cp "$RUNNER_TEMP/m3-classes:$RUNNER_TEMP/core-tests" \
            com.m3.collections.M3CollectionSdkSortedFactorySelfTest
          java -ea -cp "$RUNNER_TEMP/m3-classes:$RUNNER_TEMP/core-tests" \
            com.m3.collections.M3IndexPathMasksSelfTest
      - name: Install real source-built M3 core for optional provider Maven artifact
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$RUNNER_TEMP/m3-core.jar" -DgroupId=com.m3 \
            -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT \
            -Dpackaging=jar -DgeneratePom=true
      - name: Execute ACTUAL JDK Guava Eclipse Spring Apache provider contracts
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveProviderKeyGroupClosureTest,M3FiveProviderKeyGroupsTest,M3FiveLibraryState32Test \
            test
      - name: Build unchanged existing C17/JNI primitive mask backends
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Rerun true provider JUnit and core JNI under -Xcheck:jni
        shell: bash
        run: |
          set -euo pipefail
          java -ea -Xcheck:jni -Djava.library.path="$RUNNER_TEMP" \
            -cp "$RUNNER_TEMP/m3-classes:$RUNNER_TEMP/core-tests" \
            com.m3.collections.M3IndexPathMasksSelfTest --native
          mvn -B -ntp -f m3/collections/interop/pom.xml \
            -Dtest=M3FiveProviderKeyGroupClosureTest,M3FiveProviderKeyGroupsTest \
            -DargLine="-ea -Xcheck:jni -Djava.library.path=$RUNNER_TEMP" test
      - name: Preserve test evidence and failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-actual-five-group-index-${{ github.sha }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            m3/collections/interop/target/surefire-reports/
