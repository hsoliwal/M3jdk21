# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 sparse range source-built image and jtreg acceptance
on:
  pull_request:
    paths:
      - 'src/jdk.m3.collections/share/classes/jdk/m3/arrays/IntLaneAlgorithms.java'
      - 'test/jdk/jdk/m3/arrays/IntLaneSparseRangeJtreg.java'
      - '.github/workflows/m3jdk-intlane-sparse-full-image-20261125.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actual-jdk-image:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Check out actual M3JDK21 receiver source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Refuse source-seal or receiving-test drift
        shell: bash
        run: |
          set -euo pipefail
          owner='src/jdk.m3.collections/share/classes/jdk/m3/arrays/IntLaneAlgorithms.java'
          jtreg='test/jdk/jdk/m3/arrays/IntLaneSparseRangeJtreg.java'
          test "$(git hash-object "$owner")" = 9155a8dd98834d41f7f5d94e14dec4c74964a569
          test "$(git hash-object "$jtreg")" = 3549ca0a14a0dbf6a95cf5e3ffa3708dbb1d6be0
          printf '%s  %s\n' d3f78a046a3ff1d1bc27dfebdfd0e82f34de3bc8e9b604fb722c9a728ab77fd8 "$owner" | sha256sum --check -
          printf '%s  %s\n' 6b65303601e9a23543eb97cd7aff5f67cd4034da946dc5e07cf4b04e7201624e "$jtreg" | sha256sum --check -
          grep -Fq 'exports jdk.m3.arrays;' src/jdk.m3.collections/share/classes/module-info.java
          echo 'M3_INTLANE_IMAGE_SOURCE_SEAL_PASS exact existing class and create-only jtreg'
      - name: Prepare BootJDK and jtreg using established JDK actions
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      # First admission stage: identify a public, pinned jtreg 8.2.1+1 binary
      # without executing it. The repository's get-jtreg action expects an
      # artifact in this SAME Actions run, but standalone PR runs have none.
      - name: Resolve pinned JTReg distribution (discovery only; fail closed)
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/jtreg-8.2.1+1.tar.gz"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 180 \
            --output "$archive" \
            'https://anduin.linuxfromscratch.org/BLFS/OpenJDK/OpenJDK-21.0.12.1/jtreg-8.2.1+1.tar.gz'
          # The Linux From Scratch published checksum is an independent
          # discovery check; future executable admission requires pinned SHA-256.
          printf '%s  %s\n' e5f9bac8e929180a6b1643f498755844 "$archive" | md5sum --check -
          echo "JTREG_8_2_1_PLUS_1_SHA256=$(sha256sum "$archive" | cut -d' ' -f 1)"
          tar -tzf "$archive" > "$RUNNER_TEMP/m3jdk-jtreg-archive-list.txt"
          sed -n '1,35p' "$RUNNER_TEMP/m3jdk-jtreg-archive-list.txt"
          echo 'HOLD: discovery only; pin the exact SHA-256 before unpacking or running JTReg' >&2
          exit 78
      - name: Install existing supported JDK-image build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-10 g++-10 make autoconf zip unzip \
            libxrandr-dev libxtst-dev libcups2-dev libasound2-dev \
            libfreetype6-dev libffi-dev zlib1g-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-10 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-10
      - name: Configure exact source-built release JDK21 image
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          test -x bootjdk/jdk/bin/java
          test -x jtreg/installed/bin/jtreg
          bash configure --with-conf-name=m3jdk21-intlane-sparse \
            --with-boot-jdk=bootjdk/jdk \
            --with-jtreg=jtreg/installed \
            --with-debug-level=release --with-zlib=system --with-jobs=2
      - name: Build actual M3JDK21 image including jdk.m3.collections
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          make CONF=m3jdk21-intlane-sparse JOBS=2 LOG=info images
          image=build/m3jdk21-intlane-sparse/images/jdk
          test -x "$image/bin/java"
          test -x "$image/bin/javac"
          "$image/bin/java" --list-modules | tee "$RUNNER_TEMP/m3jdk-intlane-modules.txt"
          grep -Eq '^jdk\.m3\.collections($|@)' "$RUNNER_TEMP/m3jdk-intlane-modules.txt"
      - name: Execute new sparse-range jtreg on installed M3JDK21 image
        shell: bash
        run: |
          set -euo pipefail
          unset JAVA_TOOL_OPTIONS JDK_JAVA_OPTIONS _JAVA_OPTIONS
          make CONF=m3jdk21-intlane-sparse JOBS=2 LOG=info test \
            TEST='test/jdk/jdk/m3/arrays/IntLaneSparseRangeJtreg.java'
      - name: Replay existing array self-test on the source-built image
        shell: bash
        run: |
          set -euo pipefail
          image="$GITHUB_WORKSPACE/build/m3jdk21-intlane-sparse/images/jdk"
          work="$RUNNER_TEMP/m3jdk-intlane-image"
          mkdir -p "$work/classes"
          "$image/bin/javac" --patch-module \
            jdk.m3.collections=test/jdk/jdk/m3/arrays \
            -d "$work/classes" \
            test/jdk/jdk/m3/arrays/IntLaneAlgorithmsSelfTest.java
          for mode in jit xint serial g1; do
            options=(-Xcheck:jni -Xverify:all -Xmx256m)
            case "$mode" in
              xint) options+=(-Xint) ;;
              serial) options+=(-XX:+UseSerialGC) ;;
              g1) options+=(-XX:+UseG1GC) ;;
            esac
            "$image/bin/java" "${options[@]}" \
              --patch-module jdk.m3.collections="$work/classes" \
              -m jdk.m3.collections/jdk.m3.arrays.IntLaneAlgorithmsSelfTest \
              | tee "$work/$mode.log"
            grep -Fxq 'M3_LEETCODIFY_ARRAY_KERNELS PASS checks=151009 native=false' "$work/$mode.log"
          done
          printf '%s\n' 'M3_INTLANE_INSTALLED_IMAGE_PASS actual M3JDK21 JMOD, jtreg and 4 image-backed array checks'
      - name: Preserve actual image, build and jtreg evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3jdk21-intlane-sparse-full-image-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            build/m3jdk21-intlane-sparse/configure.log
            build/m3jdk21-intlane-sparse/build.log
            build/m3jdk21-intlane-sparse/test-results/
            build/m3jdk21-intlane-sparse/test-support/
            ${{ runner.temp }}/m3jdk-intlane-image/*.log
            ${{ runner.temp }}/m3jdk-intlane-modules.txt
