name: M3 primitive map empty-value source-sealed recipe
on:
  pull_request:
    paths:
      - "src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongLongHashMap.java"
      - "test/jdk/jdk/m3/collections/M3LongLongHashMapEmptyValue*"
      - "m3/collections/qualification/leetcodify-empty-value-20261105/**"
      - "m3/collections/recipe/pom.xml"
      - "m3/collections/recipe/src/test/java/jdk/internal/m3/rewrite/M3LongLongHashMapEmptyValueRecipeTest.java"
      - "m3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-empty-value-scan-20261105/**"
      - "m3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-empty-value-scan-20261105.yml"
      - ".github/workflows/m3-collections-empty-value-recipe-20261105.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-source-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "21"
      - name: Exact source SHA and full-owner Java21 baseline/receiver differential
        shell: bash
        run: bash m3/collections/qualification/leetcodify-empty-value-20261105/verify_java21.sh
      - name: Install existing pinned Synexia/OpenRewrite closure
        shell: bash
        run: bash m3/m3-import/pure-int-recipe-custody/install.sh "$GITHUB_WORKSPACE" --dependencies-only
      - name: Real original Maven/OpenRewrite hash-sealed replay, fixed point and refusal
        run: mvn -B -ntp -f m3/collections/recipe/pom.xml -Dtest=M3LongLongHashMapEmptyValueRecipeTest test
      - name: Original module Maven JUnit integration
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongLongHashMapEmptyValueTest test
