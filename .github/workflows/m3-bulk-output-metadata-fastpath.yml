name: M3 Bulk Output Metadata Fast Path

on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/vm/parallel/BulkExecution.java'
      - 'src/java.base/share/classes/jdk/internal/vm/parallel/BulkScheduler.java'
      - 'test/jdk/jdk/internal/vm/parallel/BulkOutputMetadataTest.java'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3BulkOutputMetadataFastPathRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3BulkOutputMetadataFastPathRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-output-metadata-fastpath/**'
      - 'm3/tooling/migration-recipes/tasks/bulk-output-metadata-fastpath/**'
      - '.github/workflows/m3-bulk-output-metadata-fastpath.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-receiver:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check source-built OpenRewrite coordinates
        run: python3 -S m3/synexia-import/pure-int-recipe-custody/verify-source-rewrite-coordinate.py
      - name: Install source-built recipe and JUnit custody
        run: bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - name: Execute receiver recipe and fixed point over actual JDK source paths
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3BulkOutputMetadataFastPathRecipeTest test

  patch-smoke:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile isolated java.base scheduler patch and execute jtreg bodies
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/m3-bulk-source"
          classes="$RUNNER_TEMP/m3-bulk-classes"
          tests="$RUNNER_TEMP/m3-bulk-tests"
          mkdir -p "$src/jdk/internal/vm/parallel" "$classes" "$tests"
          for name in BulkTask BulkExecutor BulkExecution BulkExecutorProvider BulkScheduler; do
            cp "src/java.base/share/classes/jdk/internal/vm/parallel/$name.java" \
              "$src/jdk/internal/vm/parallel/$name.java"
          done
          javac -Xlint:all -Werror --patch-module "java.base=$src" \
            -d "$classes" "$src"/jdk/internal/vm/parallel/*.java
          javac -Xlint:all -Werror --patch-module "java.base=$classes" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -d "$tests" \
            test/jdk/jdk/internal/vm/parallel/BulkExecutorTest.java \
            test/jdk/jdk/internal/vm/parallel/BulkSchedulerTest.java \
            test/jdk/jdk/internal/vm/parallel/BulkOutputMetadataTest.java
          for test in BulkExecutorTest BulkSchedulerTest BulkOutputMetadataTest; do
            java --patch-module "java.base=$classes" \
              --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
              -cp "$tests" "$test"
          done

  jdk-image-jtreg:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: Get JTReg
        id: jtreg
        uses: ./.github/actions/get-jtreg
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libxrandr-dev libxtst-dev libcups2-dev libasound2-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-12
      - name: Configure
        run: |
          bash configure --with-conf-name=linux-x64-bulk-metadata \
            --with-debug-level=release \
            --with-boot-jdk="${{ steps.bootjdk.outputs.path }}" \
            --with-jtreg="${{ steps.jtreg.outputs.path }}" \
            --with-zlib=system
      - name: Build release image
        run: make CONF=linux-x64-bulk-metadata images
      - name: Run focused jtreg
        run: |
          make CONF=linux-x64-bulk-metadata test \
            TEST="test/jdk/jdk/internal/vm/parallel/BulkExecutorTest.java test/jdk/jdk/internal/vm/parallel/BulkSchedulerTest.java test/jdk/jdk/internal/vm/parallel/BulkOutputMetadataTest.java"
