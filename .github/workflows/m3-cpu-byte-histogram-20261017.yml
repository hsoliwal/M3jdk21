# SPDX-License-Identifier: Apache-2.0
name: M3 CPU byte histogram Java21 JNI 20261017

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm3/ports/capability-runtime/**'
      - 'm3/tooling/jmod-recipes/CPU_TOOL_CATEGORY_MATRIX_20261017.tsv'
      - 'm3/tooling/jmod-recipes/CPU_TOOL_HISTOGRAM_ADMISSION_20261017.md'
      - 'm3/docs/name-mapping.d/m3-cpu-byte-histogram-20261017.json'
      - '.github/workflows/m3-cpu-byte-histogram-20261017.yml'

permissions:
  contents: read

jobs:
  java21-histogram:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute actual source/JNI differential oracle
        shell: bash
        run: |
          python3 m3/ports/capability-runtime/verify_byte_histogram.py \
            --out "$RUNNER_TEMP/m3-histogram-${{ github.run_id }}" \
            ${{ matrix.os == 'windows-latest' && '--java-only' || '' }}
      - name: Java21 Maven tool checks
        shell: bash
        run: mvn -B -ntp -f m3/ports/capability-runtime/pom.xml verify
