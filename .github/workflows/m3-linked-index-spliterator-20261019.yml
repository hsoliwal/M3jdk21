# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 linked-index no-copy spliterator
# Former triggers (below, as of the move) now start job(s) 'm3-linked-index-spliterator-20261019__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LinkedList.java'
#         - 'test/jdk/jdk/m3/collections/M3LinkedIndexSplit*'
#         - 'm3/collections/qualification/m3-linked-index-spliterator-20261019/**'
#         - '.github/workflows/m3-linked-index-spliterator-20261019.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-real-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile existing M3LinkedList actual Java21 source and run strict oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-linked-index-proof
          javac --release 21 -Xlint:all -Werror -d /tmp/m3-linked-index-proof \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SlotArrays.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SlotSpliterators.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LinkedList.java \
            test/jdk/jdk/m3/collections/M3LinkedIndexSplitContract.java
          java -ea -cp /tmp/m3-linked-index-proof \
            jdk.m3.collections.M3LinkedIndexSplitContract

  owning-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run owning collection Maven/JUnit checks
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3LinkedIndexSplitTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
