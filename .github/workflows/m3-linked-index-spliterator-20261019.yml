# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 linked-index no-copy spliterator
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LinkedList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LinkedIndexSplit*'
      - 'm3/collections/qualification/m3-linked-index-spliterator-20261019/**'
      - '.github/workflows/m3-linked-index-spliterator-20261019.yml'
  workflow_dispatch:

jobs:
  java21-real-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile existing M3LinkedList actual Java21 source and run strict oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-linked-index-proof
          javac --release 21 -Xlint:all -Werror -d /tmp/m3-linked-index-proof \
            m3/collections/src/main/java/com/m3/collections/M3SlotArrays.java \
            m3/collections/src/main/java/com/m3/collections/M3SlotSpliterators.java \
            m3/collections/src/main/java/com/m3/collections/M3LinkedList.java \
            m3/collections/src/test/java/com/m3/collections/M3LinkedIndexSplitContract.java
          java -ea -cp /tmp/m3-linked-index-proof \
            com.m3.collections.M3LinkedIndexSplitContract

  owning-maven:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run owning collection Maven/JUnit checks
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3LinkedIndexSplitTest \
            -Dsurefire.failIfNoSpecifiedTests=false test
