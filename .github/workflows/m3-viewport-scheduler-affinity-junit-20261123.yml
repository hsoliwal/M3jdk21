# SPDX-License-Identifier: Apache-2.0
name: M3 viewport scheduler CPU/UI affinity real JUnit5
on:
  push:
    branches:
      - 'ci/m3-viewport-scheduler-affinity-junit-20261123'
      - 'ci/m3-viewport-current-module-requal-20261124'
  pull_request:
    paths:
      - 'm3/viewport-core/src/main/java/jdk/m3/viewport/M3ViewportScheduler.java'
      - 'm3/viewport-core/src/test/java/jdk/m3/viewport/M3ViewportSchedulerTest.java'
      - 'm3/viewport-core/**'
      - 'm3/arrays/pom.xml'
      - 'm3/collections/pom.xml'
      - 'm3/vendor/third_party/pom.xml'
      - 'm3/vendor/third_party/junit-jupiter-5.10.2/**'
      - 'm3/vendor/third_party/junit-platform-launcher-1.10.2/**'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStream.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStreamLanguageKernels.java'
      - 'src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStreamLoopKernels.java'
      - '.github/workflows/m3-viewport-scheduler-affinity-junit-20261123.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: m3-viewport-affinity-${{ github.ref }}
  cancel-in-progress: false
jobs:
  exact-source-junit5:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact source recipe postimage blobs and no source drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object m3/viewport-core/src/main/java/jdk/m3/viewport/M3ViewportScheduler.java)" = 004a8474138931da92ce36ee6c9f6b6a7b338c95
          test "$(git hash-object m3/viewport-core/src/test/java/jdk/m3/viewport/M3ViewportSchedulerTest.java)" = 2fcf6fb7247b0b54c21590ca462e4cb4b3b93c7e
          echo M3_VIEWPORT_AFFINITY_EXACT_INPUT_PASS
      - name: Execute all eight original JUnit5 test bodies in isolated source closure
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/m3-viewport-affinity"
          mkdir -p "$B/src/main/java/jdk/m3/viewport" "$B/src/test/java/jdk/m3/viewport"
          cp m3/viewport-core/src/main/java/jdk/m3/viewport/M3ViewportScheduler.java "$B/src/main/java/jdk/m3/viewport/"
          cp m3/viewport-core/src/test/java/jdk/m3/viewport/M3ViewportSchedulerTest.java "$B/src/test/java/jdk/m3/viewport/"
          cat > "$B/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>com.m3.verification</groupId><artifactId>m3-viewport-affinity-source-only</artifactId><version>1</version>
            <properties><maven.compiler.release>21</maven.compiler.release><project.build.sourceEncoding>UTF-8</project.build.sourceEncoding></properties>
            <dependencies>
              <dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter</artifactId><version>5.11.4</version><scope>test</scope></dependency>
            </dependencies>
            <build><plugins>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId>
                <version>3.13.0</version><configuration><compilerArgs><arg>-Xlint:all</arg><arg>-Werror</arg></compilerArgs></configuration></plugin>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId>
                <version>3.5.2</version><configuration><useModulePath>false</useModulePath><failIfNoTests>true</failIfNoTests></configuration></plugin>
            </plugins></build>
          </project>
          POM
          for mode in mixed interpreted; do
            rm -rf "$B/target/surefire-reports"
            opts=()
            if [[ "$mode" == interpreted ]]; then opts=(-DargLine=-Xint); fi
            mvn -B -ntp -f "$B/pom.xml" "-Dtest=M3ViewportSchedulerTest" "${opts[@]}" test | tee "$B/$mode.log"
            python3 - "$B/target/surefire-reports" "$mode" <<'PY'
          from pathlib import Path
          import sys,xml.etree.ElementTree as ET
          directory=Path(sys.argv[1]); mode=sys.argv[2]
          path=directory/"TEST-jdk.m3.viewport.M3ViewportSchedulerTest.xml"
          if not path.is_file():raise SystemExit("FAIL missing original JUnit XML: "+str(path))
          root=ET.parse(path).getroot()
          counts=tuple(int(root.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
          if counts!=(8,0,0,0):raise SystemExit("FAIL JUnit counters: "+str(counts))
          expected={
            "burstCoalescesCpuAndUiWork",
            "invalidatesComputedButNotPresentedFrame",
            "invalidatesInFlightCpuComputation",
            "closeDiscardsPendingAndRejectsRequests",
            "computesFailureOnWorkerButDeliversOnUi",
            "checkedCpuExecutorRejectsUiCallerRunsFallback",
            "checkedUiExecutorRefusesOffThreadPresentation",
            "checkedCpuAndUiExecutorsPreserveLatestGeneration"
          }
          actual={case.get("name") for case in root.findall(".//testcase")}
          if actual!=expected:raise SystemExit("FAIL executed JUnit method set: "+repr(actual^expected))
          print("M3_VIEWPORT_AFFINITY_REAL_JUNIT_PASS mode="+mode+" tests=8")
          PY
            cp "$B/target/surefire-reports/TEST-jdk.m3.viewport.M3ViewportSchedulerTest.xml" "$B/junit-$mode.xml"
          done
      - name: Preserve executed original test XML and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-viewport-affinity-exact-source-junit5-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/m3-viewport-affinity/*.xml
          if-no-files-found: warn

  original-m3-module-junit:
    needs: exact-source-junit5
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact target source Git objects
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object m3/viewport-core/src/main/java/jdk/m3/viewport/M3ViewportScheduler.java)" = 004a8474138931da92ce36ee6c9f6b6a7b338c95
          test "$(git hash-object m3/viewport-core/src/test/java/jdk/m3/viewport/M3ViewportSchedulerTest.java)" = 2fcf6fb7247b0b54c21590ca462e4cb4b3b93c7e
      - name: Refuse non-public Java 21 Streams dependency
        shell: bash
        run: |
          set -euo pipefail
          path=src/jdk.m3.collections/share/classes/jdk/m3/collections/ObjectStream.java
          test -s "$path"
          if grep -Fq 'import java.util.stream.Streams;' "$path"; then
            echo 'Host stock JDK21 cannot access java.util.stream.Streams' >&2
            exit 1
          fi
          grep -Fq 'ObjectStreamLanguageKernels.pairwise' "$path"
          grep -Fq 'ObjectStreamLoopKernels.mapWhile' "$path"
          echo M3_VIEWPORT_HOST_JDK21_STREAMS_ADMISSION_PASS
      - name: Build existing source-vendored JUnit and original M3 dependencies
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/vendor/third_party/pom.xml -pl junit-jupiter-5.10.2,junit-platform-launcher-1.10.2 -am -DskipTests install
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Execute M3 original viewport-core Maven/JUnit5 source tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/viewport-core/pom.xml -Dtest=M3ViewportSchedulerTest,M3ViewportSnapshotTest test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path("m3/viewport-core/target/surefire-reports")
          expected={
            "M3ViewportSchedulerTest":{
              "burstCoalescesCpuAndUiWork",
              "invalidatesComputedButNotPresentedFrame",
              "invalidatesInFlightCpuComputation",
              "closeDiscardsPendingAndRejectsRequests",
              "computesFailureOnWorkerButDeliversOnUi",
              "checkedCpuExecutorRejectsUiCallerRunsFallback",
              "checkedUiExecutorRefusesOffThreadPresentation",
              "checkedCpuAndUiExecutorsPreserveLatestGeneration"},
            "M3ViewportSnapshotTest":{
              "ownsPrimitiveLanesInsteadOfAliasingCpuArrays",
              "copiesOnlyResidentWindowToCallerScratch",
              "rejectsInvalidLaneSizesAndGeometry"}}
          for suite,methods in expected.items():
              file=base/("TEST-jdk.m3.viewport."+suite+".xml")
              if not file.is_file():raise SystemExit("FAIL missing original JUnit "+suite)
              report=ET.parse(file).getroot()
              counts=tuple(int(report.get(k,"-1")) for k in ("tests","failures","errors","skipped"))
              if counts!=(len(methods),0,0,0):
                  raise SystemExit("FAIL original-module JUnit counters "+suite+" "+repr(counts))
              actual={c.get("name") for c in report.findall(".//testcase")}
              if actual!=methods:raise SystemExit("FAIL original-module method selection "+suite+" "+repr(actual^methods))
          print("M3_VIEWPORT_ORIGINAL_MODULE_CPU_UI_JUNIT_PASS tests=11 suites=2")
          PY
      - name: Preserve original module JUnit XML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-viewport-affinity-original-module-junit-${{ github.event.pull_request.head.sha || github.sha }}
          path: m3/viewport-core/target/surefire-reports/**
          if-no-files-found: warn
