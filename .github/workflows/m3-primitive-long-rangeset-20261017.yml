name: M3 primitive long RangeSet real array/mask owner Java21
on:
  push:
    branches: ['m3/primitive-long-rangeset-receiver-20261017']
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3LongRangeSet.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3LongRangeSet*'
      - 'm3/collections/algorithm-catalog/long-range-set-20261017/**'
      - '.github/workflows/m3-primitive-long-rangeset-20261017.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-java21-indexed-masks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source postimage exact SHA256
        shell: bash
        run: |
          echo '11a1001d54bbd39d25102dab36b9ee7a9125713f8a1496598655f41f9c47652e  m3/collections/src/main/java/jdk/m3/collections/M3LongRangeSet.java' | sha256sum -c -
          echo '420496cf602f3f08f8aef10a9ff73d1e104d7582a19be18d697f1898025595cb  m3/collections/src/test/java/jdk/m3/collections/M3LongRangeSetSelfTest.java' | sha256sum -c -
          echo 'b57500ea01b78f1db7c5deb809758116ec27c99f23d108b04431c3fbdadf6b4d  m3/collections/src/test/java/jdk/m3/collections/M3LongRangeSetTest.java' | sha256sum -c -
      - name: Compile actual M3 Java 21 owners and run differential
        shell: bash
        run: |
          mkdir -p /tmp/m3-rangeset-classes
          javac --release 21 -proc:none -Xlint:all -Werror -d /tmp/m3-rangeset-classes \
            m3/collections/src/main/java/jdk/m3/collections/M3LongLongConsumer.java \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/main/java/jdk/m3/collections/M3LongRangeSet.java \
            m3/collections/src/test/java/jdk/m3/collections/M3LongRangeSetSelfTest.java
          java -ea -Xmx64m -cp /tmp/m3-rangeset-classes jdk.m3.collections.M3LongRangeSetSelfTest
      - name: Full m3-collections Maven/JUnit contract proof
        shell: bash
        run: |
          mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongRangeSetTest test
