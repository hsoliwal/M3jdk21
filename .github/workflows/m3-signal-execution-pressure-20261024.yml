# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 exact Boolean query cancellation and mask fusion Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalBooleanQuery.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalExactRangeIndex.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalExecutionPressure*.java'
      - 'm3/collections/qualification/signal-execution-pressure-20261024/**'
      - '.github/workflows/m3-signal-execution-pressure-20261024.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-owning-java21-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build unchanged first-party source-vendored Jupiter
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Build actual M3 array dependency before owning collections tests
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Original collections compiler, existing regressions and JUnit pressure test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3SignalExecutionPressureTest,M3SignalBooleanQueryTest,M3SignalExactRangeIndexTest test
      - name: Original interpreted Java21 selftests using actual compiled product sources
        shell: bash
        run: |
          set -euo pipefail
          java -Xint -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3SignalExecutionPressureSelfTest
          java -Xint -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3SignalBooleanQuerySelfTest
