# SPDX-License-Identifier: Apache-2.0
name: M3 long direct address kernel

on:
  pull_request:
    paths:
      - 'm3/collections/**'
      - '.github/workflows/m3-long-direct-address-kernel.yml'
  workflow_dispatch:

jobs:
  java-jni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Historical recipe self-test and fixed point (isolated fixture)
        run: |
          mvn -B -ntp -f m3/collections/qualification/m3-long-direct-address-kernel-20261017/recipe/pom.xml verify
      - name: Compile and install original arrays Maven dependency
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          ARRAYS_JAR="$HOME/.m2/repository/com/m3/m3-arrays/0.1.0-SNAPSHOT/m3-arrays-0.1.0-SNAPSHOT.jar"
          test -s "$ARRAYS_JAR"
          jar --describe-module --file "$ARRAYS_JAR" | grep -q '^com.m3.arrays'
      - name: Java owner tests
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongAddressKernelTest,M3LongAddressBoundedTest test
      - name: Current owner compiled address-kernel contract
        shell: bash
        run: |
          set -euo pipefail
          # Historical snapshot Recipe.run was already self-tested on frozen inputs.
          # Current M3LongIndexProjection has since acquired new source atoms;
          # do not re-apply the historical exact postimage over that product.
          # Verify the actual current Java21 bytecode still calls every owned
          # primitive leaf, then retain the normal and checked-JNI owner tests.
          python3 - <<'PYCODE'
          import re
          import subprocess
          from pathlib import Path
          code = subprocess.check_output([
              'javap', '-c', '-p', '-classpath', 'm3/collections/target/classes',
              'com.m3.collections.M3LongIndexProjection'], text=True)
          lines = code.splitlines()
          method = re.compile(r'^  (?:public|private|protected) .+? ([A-Za-z_$][\w$]*)\([^)]*\);$')
          declarations = [(i, match.group(1)) for i, line in enumerate(lines)
                          if (match := method.match(line))]
          bodies = {}
          for n, (begin, name) in enumerate(declarations):
              end = declarations[n + 1][0] if n + 1 < len(declarations) else len(lines)
              bodies.setdefault(name, []).append('\n'.join(lines[begin:end]))
          required = {
              'physicalIndex': 'M3LongAddressKernel.addressUnchecked:',
              'get': 'M3LongAddressKernel.loadUnchecked:',
              'toArray': 'M3LongAddressKernel.gatherJavaUnchecked:',
              'alreadyOrdered': 'M3LongAddressKernel.loadPhysicalUnchecked:',
              'sorted': 'M3LongAddressKernel.loadPhysicalUnchecked:',
          }
          for name, invocation in required.items():
              if not any(invocation in body for body in bodies.get(name, [])):
                  raise SystemExit('CURRENT_ADDRESS_ATOM_REFUSED: ' + name + ' -> ' + invocation)
          if not Path('m3/collections/src/main/java/com/m3/collections/M3LongIndexProjection.java').is_file():
              raise SystemExit('CURRENT_ADDRESS_ATOM_REFUSED: missing original Java owner')
          print('CURRENT_ADDRESS_ATOM_PASS compiled_methods=' + str(len(required)))
          PYCODE
      - name: Build optional JNI batch gather
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p /tmp/m3address
          cc -std=c17 -fPIC -shared -Wall -Wextra -Werror             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_long_address_kernel.c             -o /tmp/m3address/libm3_collections_address.so
      - name: JNI parity
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongAddressKernelTest,M3LongAddressBoundedTest -DargLine="-Xcheck:jni -Dm3.address.required=true -Djava.library.path=/tmp/m3address" test
