# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original ranked Boolean signal Top-K Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalTopK.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalExactIntegerDistance.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalBooleanQuery.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalRankedQuery*.java'
      - 'm3/collections/qualification/signal-ranked-topk-20261025/**'
      - '.github/workflows/m3-signal-ranked-topk-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  actual-original-source-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict original source javac and exact ranked Boolean differential
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-signal-ranked-topk"
          mkdir -p "$out/classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalDependencyEpochs.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalQualitySchema.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressMonitor.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressState.java \
            m3/collections/src/main/java/com/m3/collections/M3ChildProgressMonitor.java \
            m3/collections/src/main/java/com/m3/collections/M3ShadowStreams.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalExactRangeIndex.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalTopK.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalExactIntegerDistance.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalBooleanQuery.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalRankedQuerySelfTest.java
          java -cp "$out/classes" com.m3.collections.M3SignalRankedQuerySelfTest
          java -Xint -cp "$out/classes" com.m3.collections.M3SignalRankedQuerySelfTest

  original-owning-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build unchanged source-vendored Jupiter
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
      - name: Build existing arrays and execute all relevant original JUnit oracles
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3SignalRankedQueryTest,M3SignalTopKTest,M3SignalBooleanQueryTest,M3SignalViewportWindowTest,M3SignalExecutionPressureTest test
      - name: Repeat original ranked proof in interpreted mode
        shell: bash
        run: |
          set -euo pipefail
          java -Xint -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3SignalRankedQuerySelfTest
