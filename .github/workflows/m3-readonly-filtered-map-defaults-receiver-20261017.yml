name: M3 filtered Map default-method receiver Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ReadOnlyMapDefaults*.java'
      - 'm3/collections/qualification/m3-readonly-filtered-map-defaults-20261017/**'
      - '.github/workflows/m3-readonly-filtered-map-defaults-receiver-20261017.yml'
  workflow_dispatch:
jobs:
  source-and-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify canonical manifest, source and recipe-template bytes
        run: python3 m3/collections/qualification/m3-readonly-filtered-map-defaults-20261017/verify.py
      - name: Original exact source must fail the new strict UOE oracle
        shell: bash
        run: |
          set -euo pipefail
          mirror=m3/collections/qualification/m3-readonly-filtered-map-defaults-20261017/recipe-mirror
          mkdir -p "$RUNNER_TEMP/m3-old-src" "$RUNNER_TEMP/m3-old-classes"
          cp "$mirror/pre/M3FilteredViews.java.txt" "$RUNNER_TEMP/m3-old-src/M3FilteredViews.java"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-old-classes" \
            "$RUNNER_TEMP/m3-old-src/M3FilteredViews.java" \
            m3/collections/src/test/java/com/m3/collections/M3ReadOnlyMapDefaultsContract.java
          if java -cp "$RUNNER_TEMP/m3-old-classes" com.m3.collections.M3ReadOnlyMapDefaultsContract >"$RUNNER_TEMP/red.log" 2>&1; then
            echo "The original source unexpectedly passed the new oracle"
            exit 1
          fi
          grep -F 'NO_UOE: absent putIfAbsent' "$RUNNER_TEMP/red.log"
      - name: Generated source must pass new and existing JDK contract oracles
        run: |
          mkdir -p "$RUNNER_TEMP/m3-new-classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-new-classes" \
            m3/collections/src/main/java/com/m3/collections/M3FilteredViews.java \
            m3/collections/src/test/java/com/m3/collections/M3ReadOnlyMapDefaultsContract.java \
            m3/collections/src/test/java/com/m3/collections/M3FilteredViewsContract.java
          java -cp "$RUNNER_TEMP/m3-new-classes" com.m3.collections.M3ReadOnlyMapDefaultsContract
          java -cp "$RUNNER_TEMP/m3-new-classes" com.m3.collections.M3FilteredViewsContract
  owning-module:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual owning-module Maven/JUnit gate
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3ReadOnlyMapDefaultsTest test
