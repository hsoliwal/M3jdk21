# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 writable Map AVL source and ABI proof
on:
  push:
    branches: ["m3/writable-filtered-map-avl-receiver-20261017"]
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/M3FilteredMaps.java"
      - "m3/collections/src/main/java/com/m3/collections/M3WritableFilteredMaps.java"
      - "m3/collections/src/main/java/com/m3/collections/M3PendingSortedKeys.java"
      - "m3/collections/src/test/java/com/m3/collections/M3WritableFilteredMapsTest.java"
      - "m3/collections/src/test/java/com/m3/collections/M3SortedBatchPutAllProof.java"
      - "m3/collections/wrappers/writable-map-avl-20261017/**"
      - "m3/collections/wrappers/recipe/**"
      - ".github/workflows/m3-writable-map-avl-20261017.yml"
jobs:
  exact-java21-avl-and-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: SHA source custody, strict Java21, old public ABI and comparator JDK differential
        run: sh m3/collections/wrappers/writable-map-avl-20261017/verify.sh
      - name: Inherited unchanged signed primitive JNI and five-collector proof
        run: sh m3/collections/wrappers/filtered-mat-receiver-20261017/verify.sh
  exact-openrewrite-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Reuse retained OpenRewrite source LST provider, ensure drift-refusal and fixed point
        run: mvn -B -ntp -f m3/collections/wrappers/recipe/pom.xml -Dtest=M3Jdk21WritableMapAvlRecipeTest test
