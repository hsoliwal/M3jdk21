# SPDX-License-Identifier: Apache-2.0
name: M3 object state array masks Java JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectStateSlots28.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ObjectStateSlots28SelfTest.java'
      - 'm3/collections/qualification/object-state-slots-28/**'
      - '.github/workflows/m3-object-state-slots-28.yml'
permissions:
  contents: read
jobs:
  primitive-slots-and-native-peer:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${github.event.pull_request.head.sha || github.sha}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify seals and compile Java21
        shell: bash
        run: |
          set -euxo pipefail
          python3 m3/collections/qualification/object-state-slots-28/verify.py
          mkdir -p target/m3-object-state/classes target/m3-object-state/headers
          S=m3/collections/src/main/java/com/m3/collections
          T=m3/collections/src/test/java/com/m3/collections
          javac --release 21 -proc:none -Xlint:all -Werror \
            -h target/m3-object-state/headers -d target/m3-object-state/classes \
            "$S/M3Address28.java" "$S/M3IntLane28.java" \
            "$S/M3BitLane28.java" "$S/M3SlotAllocator28.java" \
            "$S/M3ObjectStateSlots28.java" "$T/M3ObjectStateSlots28SelfTest.java" \
            "$S/M3StateMaskArrays.java" "$T/M3StateMaskArraysSelfTest.java" \
            "$S/M3IndexMaskCompactor.java"
          java -Xmx256m -cp target/m3-object-state/classes \
            com.m3.collections.M3ObjectStateSlots28SelfTest | tee target/m3-object-state/object-state.log
          java -Xmx256m -cp target/m3-object-state/classes \
            com.m3.collections.M3StateMaskArraysSelfTest | tee target/m3-object-state/state-mask-java.log
      - name: Reuse exact incumbent JNI mask backend
        shell: bash
        run: |
          set -euxo pipefail
          INC="$JAVA_HOME/include"
          gcc -std=c17 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -fPIC -shared -I"$INC" -I"$INC/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o target/m3-object-state/libm3_collections_mask.so
          UBSAN_OPTIONS=halt_on_error=1:print_stacktrace=1 \
          java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/target/m3-object-state" \
            -cp target/m3-object-state/classes com.m3.collections.M3StateMaskArraysSelfTest \
            > target/m3-object-state/state-mask-jni.log \
            2> target/m3-object-state/state-mask-jni.err
          test ! -s target/m3-object-state/state-mask-jni.err
          grep 'JNI=true' target/m3-object-state/state-mask-jni.log
          grep 'checks=1209244 randomized_operations=98304' target/m3-object-state/object-state.log
      - name: Preserve actual proof including failed gates
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-object-state-masks-${github.event.pull_request.head.sha || github.sha}
          retention-days: 30
          path: target/m3-object-state/*.log
