name: M3JDK21 JDK-8364182 source lineage proof

# Former triggers (below, as of the move) now start job(s) 'm3jdk8364182-superseded-vmsymbols__*' in
# .github/workflows/checks-superset-04.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/backports/recipes/jdk-8364182/adaptation.tsv'
#         - 'm3/backports/verify.py'
#         - 'm3/backports/test_jdk8364182_source_lineage.py'
#         - 'm3/docs/jdk8364182-vmsymbols-superseded-state-20261011.md'
#         - '.github/workflows/m3jdk8364182-superseded-vmsymbols.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-lineage:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: 1 - Diff and Python syntax
        run: |
          set -euo pipefail
          git diff --check
          python3 -m py_compile m3/backports/verify.py m3/backports/test_jdk8364182_source_lineage.py
      - name: 2 - JDK-8364182 exact source lineage differential tests
        run: |
          set -euo pipefail
          python3 -m unittest -v m3.backports.test_jdk8364182_source_lineage
      - name: 3 - Existing full backport catalogue/implementation integrity gate
        run: |
          set -euo pipefail
          python3 m3/backports/verify.py --root .
