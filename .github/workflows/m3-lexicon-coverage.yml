name: M3 lexicon coverage gate

on:
  push:
    branches:
      - develop
      - codex/m3jdk-precompute-coverage-invariant-20261010

permissions:
  contents: read

jobs:
  lexicon-coverage:
    name: M3LexiconCoverageInvariantTest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile and run manifest coverage invariant
        working-directory: m3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/lexicon-coverage-gate
          mkdir -p build/lexicon-coverage-gate
          javac --release 21 -d build/lexicon-coverage-gate \
            core/test/M3LexiconCoverageInvariantTest.java
          java -ea -cp build/lexicon-coverage-gate M3LexiconCoverageInvariantTest

      - name: Compile and run number receiver contract
        working-directory: m3
        shell: bash
        run: |
          set -euo pipefail
          javac --release 21 -d build/lexicon-coverage-gate \
            core/src/com/m3/text/M3StringPiece.java \
            core/src/com/m3/text/JoinedM3StringPiece.java \
            core/src/com/m3/text/StorageIdentity.java \
            core/src/com/m3/text/LocalM3Arena.java \
            core/src/com/m3/text/LocalM3StringPiece.java \
            core/src/com/m3/text/M3NumberSpace.java \
            core/test/M3NumberSpaceContractTest.java
          java -ea -cp build/lexicon-coverage-gate M3NumberSpaceContractTest

      - name: Compile and run java.lang.M3StringFacts receiver contract
        working-directory: m3
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build/m3-string-facts-patch
          mkdir -p build/m3-string-facts-patch
          javac --release 21 \
            --patch-module java.base=../src/java.base \
            -d build/m3-string-facts-patch \
            ../src/java.base/share/classes/java/lang/M3StringFacts.java \
            core/test/M3StringFactsContractTest.java
          java --patch-module java.base=build/m3-string-facts-patch \
            -ea java.lang.M3StringFactsContractTest
