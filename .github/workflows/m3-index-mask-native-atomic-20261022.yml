# SPDX-License-Identifier: Apache-2.0
name: M3 original JNI index-mask atomic output Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexMaskWindow.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3MaskWindowNativeStagingContract.java'
      - 'm3/collections/src/test/native/m3_mask_fault.c'
      - '.github/workflows/m3-index-mask-native-atomic-20261022.yml'
      - 'm3/collections/qualification/mask-window-atomic-20261022/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-c17-original-owner:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact-head patch hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check "origin/${{ github.base_ref }}...HEAD"
      - name: Refuse drifted original-owner postimage
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum m3/collections/src/main/java/com/m3/collections/M3IndexMaskWindow.java | awk '{print $1}')"
          test "$actual" = "ca85b13d1fb115ca6ff0a3b39cb6dc185000a78911f6a4db818afb0e9d1b46ec"
      - name: Build original Java21 owners and isolated test JNI library
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          mkdir -p "$work/classes"
          javac --release 21 -Xlint:all -Werror -d "$work/classes" \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskWindow.java \
            m3/collections/src/test/java/com/m3/collections/M3MaskWindowNativeStagingContract.java
          cc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o "$work/libm3_collections_mask.so" \
            m3/collections/src/test/native/m3_mask_fault.c
          java -Xcheck:jni -Djava.library.path="$work" \
            -cp "$work/classes" com.m3.collections.M3MaskWindowNativeStagingContract
          java -Xint -Xcheck:jni -Djava.library.path="$work" \
            -cp "$work/classes" com.m3.collections.M3MaskWindowNativeStagingContract
