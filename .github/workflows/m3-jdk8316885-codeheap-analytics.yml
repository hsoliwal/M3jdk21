name: M3 JDK-8316885 CodeHeap diagnostics proof

on:
  pull_request:
    paths:
      - "m3/backports/recipes/jdk-8316885/**"
      - "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv"
      - "m3/tooling/recipe-catalogue.tsv"
      - "m3/tooling/backport-dag/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jdk8316885CodeHeapAnalyticsBackportRecipe.java"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/jdk22-codeheap-analytics-8316885-*/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk22-codeheap-analytics-8316885-java/**"
      - "m3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jdk8316885CodeHeapAnalyticsBackportRecipeTest.java"
      - "m3/tooling/migration-recipes/src/test/resources/com/m3/rewrite/backport/jdk22-codeheap-analytics-8316885/**"
      - "src/hotspot/share/code/codeHeapState.cpp"
      - "src/hotspot/share/code/codeHeapState.hpp"
      - "test/hotspot/jtreg/serviceability/dcmd/compiler/CodeHeapAnalyticsMissingAggregate.java"
      - ".github/workflows/m3-jdk8316885-codeheap-analytics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-dag-and-static-proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify packet hashes and diagnostics contract
        run: python3 m3/backports/recipes/jdk-8316885/verify_recovery.py
      - name: Prove OpenRewrite FILE atoms and MODULE fixed point
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3Jdk8316885CodeHeapAnalyticsBackportRecipeTest test
      - name: Validate and project packet DAG
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/target/jdk-8316885-orchestration"
          mkdir -p "$OUT"
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=com.m3.tooling.dag.M3OrchestrationProjectionMain \
            -Dexec.args="$PWD/m3/backports/recipes/jdk-8316885/packet.tsv $OUT" \
            exec:java
          test -s "$OUT/M3BackportRoutes.java"
          test -s "$OUT/m3_backport_dag.py"
          test -s "$OUT/m3_backport_rules.drl"
          test -s "$OUT/projection.tsv"
          ROOT="$(tail -n 1 "$OUT/projection.tsv" | cut -f2)"
          test "${#ROOT}" -eq 64
          grep -F "$ROOT" "$OUT/M3BackportRoutes.java"
          grep -F "$ROOT" "$OUT/m3_backport_dag.py"
          grep -F "$ROOT" "$OUT/m3_backport_rules.drl"
      - name: Upload orchestration projections
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdk-8316885-orchestration-${{ github.run_id }}
          path: target/jdk-8316885-orchestration/**
          if-no-files-found: error
          retention-days: 14

  hotspot-image-and-jtreg:
    runs-on: ubuntu-22.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install OpenJDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev
      - name: Configure
        run: bash configure --with-boot-jdk="$JAVA_HOME" --with-debug-level=release --with-jvm-variants=server --disable-warnings-as-errors
      - name: Build image
        run: make JOBS=2 images
      - name: Run focused CodeHeap analytics jtreg
        run: |
          make JOBS=2 test TEST="test/hotspot/jtreg/serviceability/dcmd/compiler/CodeHeapAnalyticsMissingAggregate.java"
          make JOBS=2 test TEST="test/hotspot/jtreg/serviceability/dcmd/compiler/CodeHeapAnalyticsParams.java"
          make JOBS=2 test TEST="test/hotspot/jtreg/serviceability/dcmd/compiler/CodeHeapAnalyticsMethodNames.java"
