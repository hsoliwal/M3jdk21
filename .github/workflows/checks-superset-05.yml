    name: "M3JDK21 arrayified five-library Java21 var grammar and receipt / exact-java21-receiver"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-interop-arrayification-var-20261022'] }}"
