    permissions:
      contents: read
    concurrency:
      group: "M3 Guava ListMultimap source-closed zero vendor runtime-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source postimage SHA256 seals from Synexia
