  m3-sparse-viewport-geometry__baseline-candidate:
    name: "M3 sparse viewport geometry Java21 oracle / baseline-candidate"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-sparse-viewport-geometry'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 sparse viewport geometry Java21 oracle-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit exact original-owner bytes and separate test fixture
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git cat-file -e '9dd1df62f3d5406760427cb5e840a36c9e7a59ea^{commit}'
          SOURCE=src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SparseExtents.java
          HEAP=src/jdk.m3.collections/share/classes/jdk/m3/collections/M3HeapGrowth.java
          WINDOW=src/jdk.m3.collections/share/classes/jdk/m3/collections/M3WindowPlan.java
          FIXTURE=m3/collections/viewport-proof/fixtures/M3ViewportGeometryTest.txt
          test "$(git hash-object "$SOURCE")" = ea42717003948d450a606b827628964c58896a23
          test "$(git hash-object "$HEAP")" = bee6711572ebc905a3a14cca303acf2491fed1b2
          test "$(git hash-object "$WINDOW")" = 3af2f3ff5f3941e481eb5e09f3e0570262fda8ba
          printf '%s  %s\n' 'b34dbbf23de35d596938579287fdf79a5c9386d0c2e5af025aa253c2974bb3b9' "$FIXTURE" | sha256sum --check -
          git show '9dd1df62f3d5406760427cb5e840a36c9e7a59ea:'"$SOURCE" > "$RUNNER_TEMP/M3SparseExtents-before.java"
          test "$(git hash-object "$RUNNER_TEMP/M3SparseExtents-before.java")" = 650356bcdffa372328e5a79f4f596a887fe5f447
          git diff --check "$BASE_SHA...HEAD"
          echo M3_GEOMETRY_SOURCE_ADMISSION_PASS
      - name: Build isolated actual-owner baseline and candidate test projects
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m3-geometry"
          for state in before after; do
            MODULE="$ROOT/$state"
            mkdir -p "$MODULE/src/main/java/jdk/m3/collections" "$MODULE/src/test/java/jdk/m3/collections"
            cp src/jdk.m3.collections/share/classes/jdk/m3/collections/M3HeapGrowth.java "$MODULE/src/main/java/jdk/m3/collections/"
            cp src/jdk.m3.collections/share/classes/jdk/m3/collections/M3WindowPlan.java "$MODULE/src/main/java/jdk/m3/collections/"
            cp m3/collections/viewport-proof/fixtures/M3ViewportGeometryTest.txt "$MODULE/src/test/java/jdk/m3/collections/M3ViewportGeometryTest.java"
            if [[ "$state" == before ]]; then
              cp "$RUNNER_TEMP/M3SparseExtents-before.java" "$MODULE/src/main/java/jdk/m3/collections/M3SparseExtents.java"
            else
              cp src/jdk.m3.collections/share/classes/jdk/m3/collections/M3SparseExtents.java "$MODULE/src/main/java/jdk/m3/collections/M3SparseExtents.java"
            fi
            cat > "$MODULE/pom.xml" <<'POM'
          <project xmlns="http://maven.apache.org/POM/4.0.0" xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
            xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion><groupId>com.m3.verification</groupId>
            <artifactId>m3-sparse-geometry-oracle</artifactId><version>1</version>
            <properties><maven.compiler.release>21</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding><argLine></argLine></properties>
            <dependencies><dependency><groupId>org.junit.jupiter</groupId><artifactId>junit-jupiter</artifactId>
              <version>5.10.2</version><scope>test</scope></dependency></dependencies>
            <build><plugins>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-compiler-plugin</artifactId>
                <version>3.13.0</version><configuration>
                <compilerArgs><arg>-Xlint:all</arg><arg>-Werror</arg></compilerArgs>
                </configuration></plugin>
              <plugin><groupId>org.apache.maven.plugins</groupId><artifactId>maven-surefire-plugin</artifactId>
                <version>3.2.5</version><configuration><failIfNoTests>true</failIfNoTests>
                <useModulePath>false</useModulePath><argLine>${argLine}</argLine></configuration></plugin>
            </plugins></build>
          </project>
          POM
          done
      - name: Reproduce exact baseline failure and prove candidate twice
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/m3-geometry"
          if mvn -B -ntp -f "$ROOT/before/pom.xml" -Dtest=M3ViewportGeometryTest test > "$ROOT/baseline.log" 2>&1; then
            echo 'Baseline incorrectly passed the overflow oracle' >&2; exit 1
          fi
          python3 - "$ROOT/before/target/surefire-reports" 10 3 <<'PY'
          import sys,xml.etree.ElementTree as ET
          from pathlib import Path
          files=list(Path(sys.argv[1]).glob('TEST-jdk.m3.collections.M3ViewportGeometryTest.xml'))
          if len(files)!=1:raise SystemExit('JUnit baseline report absent')
          root=ET.parse(files[0]).getroot()
          got=tuple(int(root.get(n,'-1')) for n in ('tests','failures','errors','skipped'))
          expected=(int(sys.argv[2]),int(sys.argv[3]),0,0)
          if got!=expected:raise SystemExit('JUnit baseline differs: '+str(got))
          print('M3_GEOMETRY_BASELINE_REJECTED tests=10 failures=3')
          PY
          mvn -B -ntp -f "$ROOT/after/pom.xml" -Dtest=M3ViewportGeometryTest test | tee "$ROOT/candidate.log"
          python3 - "$ROOT/after/target/surefire-reports" <<'PY'
          import sys,xml.etree.ElementTree as ET
          from pathlib import Path
          path=Path(sys.argv[1])/'TEST-jdk.m3.collections.M3ViewportGeometryTest.xml'
          r=ET.parse(path).getroot()
          got=tuple(int(r.get(n,'-1')) for n in ('tests','failures','errors','skipped'))
