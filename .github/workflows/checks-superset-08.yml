    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-signal-nearest-boolean-20261025'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 consolidated source-sealed signal acceptance-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact result-only source blobs (no recipe mirror)
        shell: bash
        run: |
          set -euo pipefail
          receipt="m3/collections/qualification/signal-consolidation-20261025/RECEIVER.tsv"
          test -s "$receipt"
          count=0
          previous=""
          while IFS=$'\t' read -r relative expected strong; do
            [[ -z "$relative" || "$relative" == \#* ]] && continue
            [[ "$relative" =~ ^m3/collections/src/(main|test)/java/jdk/m3/collections/[A-Za-z0-9_]+[.]java$ ]] || exit 1
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$strong" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ -z "$previous" || "$relative" > "$previous" ]] || exit 1
            test -f "$relative"
            actual="$(git hash-object -- "$relative")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Source drift: $relative expected=$expected observed=$actual" >&2
              exit 1
            fi
            observed256="$(sha256sum -- "$relative")"
            observed256="${observed256%% *}"
            if [[ "$observed256" != "$strong" ]]; then
              echo "Strong source drift: $relative expected=$strong observed=$observed256" >&2
              exit 1
            fi
            previous="$relative"
            count=$((count + 1))
          done < "$receipt"
          test "$count" -eq 29
      - name: Strict original Java 21 source compilation and all deterministic signal oracles
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-signal-consolidated"
