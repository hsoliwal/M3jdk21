          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_OWNED_CP" GuavaEvictingQueueMaskProjectionProof jdk.m3.collections.guava.M3EvictingQueue java > "$M3_TASK_OUT/owned-projection-java.json"
