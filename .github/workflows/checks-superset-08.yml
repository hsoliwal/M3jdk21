          total = 0
          for suite in suites:
              path = report_dir / ("TEST-jdk.m3.collections." + suite + "Test.xml")
              if not path.is_file():
                  raise SystemExit("Missing owning JUnit XML: " + str(path))
              element = ET.parse(path).getroot()
