          mkdir -p "$RUNNER_TEMP/m3-required-ngram-jtreg"
          javac --release 21 -proc:none -Xlint:all,-serial -Werror \
              -d "$RUNNER_TEMP/m3-required-ngram-jtreg" \
              test/jdk/java/lang/String/M3StringRegexDpTest.java
      # Full modified M3JDK 21 source build, jtreg and native/GC/JIT parity not run here.

  m3-runtime-bitlane-count-skip-20261019__canonical-generation-then-receiver:
    name: "M3JDK21 java.base bitmap canonical generation and receiving / canonical-generation-then-receiver"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-runtime-bitlane-count-skip-20261019'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3JDK21 java.base bitmap canonical generation and receiving-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      Q: m3/runtime-integration/qualification/bitlane-count-skip-20261019
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            m3/runtime-integration/qualification/bitlane-count-skip-20261019
            src/java.base/share/classes/jdk/internal/mindex
            src/java.base/share/native/libjava
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Seal current runtime dependencies and canonical recipe
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git hash-object "$Q/src/main/java/jdk/internal/m3/rewrite/M3HashPinnedJavaSnapshotRecipe.java")" = 3bdeeaea9a212fe0c7d1f544510f87c4cd49eb40
