  m3-order-statistics-java-jni__java-and-recipe:
    name: "M3 order-statistics Java21 JNI recipe / java-and-recipe"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-order-statistics-java-jni'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 order-statistics Java21 JNI recipe-${{ github.ref }}-${{ strategy.job-index }}"
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        # Configure Git before the first checkout without changing runner-global settings.
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: core.longpaths
          GIT_CONFIG_VALUE_0: 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Source/diff custody
        shell: bash
        run: |
          git diff --check HEAD^ HEAD
          mvn -B -ntp -f m3/collections/recipe/order-statistics/pom.xml verify
      - name: Compile independent Java 21 rank contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/rank-classes"
          S=src/jdk.m3.collections/share/classes/jdk/m3/collections
          T=test/jdk/jdk/m3/collections
          javac --release 21 -Xlint:all -Werror -encoding UTF-8 \
            -d "${{ runner.temp }}/rank-classes" \
            "$S/M3LongIterator.java" "$S/M3LongCollection.java" \
            "$S/M3LongRankIndex.java" "$S/M3LongRankBatchNative.java" \
            "$T/M3LongRankIndexSelfTest.java"
          java -cp "${{ runner.temp }}/rank-classes" \
            jdk.m3.collections.M3LongRankIndexSelfTest
      - name: Optional JNI C and native differential parity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            src/jdk.m3.collections/share/native/libm3collections/collections/m3_long_rank_batch_jni.c \
            -o "${{ runner.temp }}/libm3rankbatch.so"
          java -Dm3.collections.rank.native=true \
            -Djava.library.path="${{ runner.temp }}" \
            -cp "${{ runner.temp }}/rank-classes" \
            jdk.m3.collections.M3LongRankIndexSelfTest

  m3-owned-apache-bidimap__qualify:
    name: "M3 owned Apache BidiMap / qualify"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-owned-apache-bidimap'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 owned Apache BidiMap-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify exact source receiving recipe
        run: |
          set -euxo pipefail
          python3 -I -S -B m3/collections/qualification/owned-apache-bidimap-20261017/verify.py
          mvn -B -ntp -f m3/collections/recipe/owned-apache-bidimap-20261017/pom.xml test
      - name: Build required M3 arrays JNI allocator from source
        run: |
          set -euxo pipefail
          cmake -S make/m3/arrays \
            -B proof/array-native-build -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_TESTING=ON -DJAVA_HOME="$JAVA_HOME"
          cmake --build proof/array-native-build --config Release --parallel 2
          ctest --test-dir proof/array-native-build --output-on-failure -C Release
          NATIVE="$GITHUB_WORKSPACE/proof/array-native-build/libm3_arrays.so"
          test -s "$NATIVE"
          sha256sum "$NATIVE" > proof/arrays-native-sha256.txt
      - name: Compile current core and actual provider-owned protocol
        run: |
          set -euxo pipefail
          mkdir -p proof/arrays proof/core proof/owned
          mvn -B -ntp -f m3/collections/recipe/owned-apache-bidimap-20261017/pom.xml org.apache.maven.plugins:maven-dependency-plugin:3.6.1:get -Dartifact=org.apache.commons:commons-collections4:4.5.0 -Dtransitive=false
          PROVIDER="$HOME/.m2/repository/org/apache/commons/commons-collections4/4.5.0/commons-collections4-4.5.0.jar"
          find m3/arrays/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/arrays -name '*.java' -print0 | sort -z | xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/arrays
          find m3/collections/src/main/java src/jdk.m3.collections/share/classes/jdk/m3/collections src/jdk.m3.collections/share/classes/jdk/internal/m3/collections -name '*.java' -print0 | sort -z | xargs -0 javac --release 21 --module-path proof/arrays -proc:none -Xlint:all,-module -Werror -d proof/core
          NATIVE="$GITHUB_WORKSPACE/proof/array-native-build/libm3_arrays.so"
          test -s "$NATIVE"
          CP="proof/owned:proof/core:proof/arrays:$PROVIDER"
          javac --release 21 -proc:none -Xlint:all -Werror -cp "$CP" -d proof/owned m3/collections/implementations/apache/src/main/java/jdk/m3/collections/apache/M3BidiMap.java m3/collections/implementations/apache/src/test/java/jdk/m3/collections/apache/M3BidiMapSelfTest.java m3/collections/qualification/owned-apache-bidimap-20261017/BidiViewTraversalDiscriminator.java m3/collections/qualification/owned-apache-bidimap-20261017/BidiProviderDiscriminator.java m3/collections/qualification/owned-apache-bidimap-20261017/BidiValueReplacementDiscriminator.java
          java -Xmx512m -Xcheck:jni "-Dm3.arrays.native.path=$NATIVE" -cp "$CP" jdk.m3.collections.apache.M3BidiMapSelfTest
          java -Xmx512m -Xcheck:jni "-Dm3.arrays.native.path=$NATIVE" -cp "$CP" BidiProviderDiscriminator
          java -Xmx512m -Xcheck:jni "-Dm3.arrays.native.path=$NATIVE" -cp "$CP" BidiValueReplacementDiscriminator
          java -Xmx512m -Xcheck:jni "-Dm3.arrays.native.path=$NATIVE" -cp "$CP" BidiViewTraversalDiscriminator >proof/view-traversal.jsonl
          python3 -I -S -B -c 'import json; p=json.loads(open("proof/view-traversal.jsonl").read().splitlines()[-1]); assert p["cases"]==66 and p["equivalent"]==66 and p["different"]==0,p'
          python3 -I -S -B m3/collections/qualification/owned-apache-bidimap-20261017/verify.py
          git diff --exit-code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-owned-bidimap-${{ github.event.pull_request.head.sha }}
          path: |
            proof/
            m3/collections/recipe/owned-apache-bidimap-20261017/target/surefire-reports/

