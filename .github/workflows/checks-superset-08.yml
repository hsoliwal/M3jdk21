      - name: Qualify emitted sparse and forced-portable numeric C11 JNI variants
        shell: bash
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-state-relation-sparse-c11-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-state-relation-sparse-c11-source
          TMPDIR: ${{ runner.temp }}/m3-state-relation-sparse-c11-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-state-relation-sparse-c11-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-state-relation-sparse-c11-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-state-relation-sparse-c11-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-state-relation-sparse-c11-${{ github.run_id }}-${{ github.run_attempt }}/config
