    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/runtime-integration/regex-required-ngrams/
            m3/runtime-integration/regex-plan-amalgamation/
            src/java.base/share/classes/java/lang/M3String.java
