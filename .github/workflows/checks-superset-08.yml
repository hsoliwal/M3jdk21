  m3-index-mask-window-20261017__java21-jni-contract:
    name: "M3 Index Mask Window Java21/JNI / java21-jni-contract"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-index-mask-window-20261017'] }}"
    concurrency:
      group: "M3 Index Mask Window Java21/JNI-${{ github.ref }}"
