          java -Xmx256m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_OWNED_CP" GuavaEvictingQueueSerializationProof jdk.m3.collections.guava.M3EvictingQueue > "$M3_TASK_OUT/owned-serialization.jsonl"
          python -I -S -B "$M3_Q/compare.py" "$M3_TASK_OUT"
