name: M3 Full-Width Signal Masks Java21 JNI

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalOrder.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalDimensions.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalMask32*.java'
      - 'm3/collections/qualification/signal-mask32-20261018/**'
      - '.github/workflows/m3-signal-mask32-20261018.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-source-and-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict diff hygiene
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - name: Java21 differential and C11 JNI parity
        shell: bash
        run: bash m3/collections/qualification/signal-mask32-20261018/verify.sh

  maven-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: MAT collections JUnit and source compilation
        shell: bash
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3SignalMask32Test test
