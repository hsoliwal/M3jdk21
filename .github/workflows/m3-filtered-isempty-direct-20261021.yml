# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 filtered-sorted short-circuit Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3FilteredIsEmptyContract.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3FilteredIsEmptyTest.java'
      - 'm3/collections/qualification/filtered-isempty-20261021/**'
      - 'm3/collections/algorithm-catalog/filtered-isempty-20261021/**'
      - '.github/workflows/m3-filtered-isempty-direct-20261021.yml'
  workflow_dispatch:
jobs:
  original-owner-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source + strict Java21 + baseline/candidate differential
        run: bash m3/collections/qualification/filtered-isempty-20261021/verify.sh
