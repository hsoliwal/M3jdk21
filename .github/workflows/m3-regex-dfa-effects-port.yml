# SPDX-License-Identifier: Apache-2.0
name: M3 regex DFA effects exact port
# Former triggers (below, as of the move) now start job(s) 'm3-regex-dfa-effects-port__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - '.github/workflows/m3-regex-dfa-effects-port.yml'
#         - 'm3/ports/precompute/src/main/java/jdk/m3/precompute/M3RegexDfaEffects.java'
#         - 'm3/ports/precompute/src/test/java/jdk/m3/precompute/M3RegexDfaEffects*.java'
#         - 'm3/ports/precompute/docs/M3_REGEX_EFFECTS_PORT*'
#         - 'm3/docs/name-mapping.d/m3-regex-effects-precompute.json'
#         - 'm3/docs/m3-string-precompute-port-map.tsv'
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-seals-and-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact pull-request receiver
        uses: actions/checkout@v4
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse any source-recipe postimage drift
        run: sha256sum -c m3/ports/precompute/docs/M3_REGEX_EFFECTS_PORT_SHA256.txt
      - name: Execute M3 owned DFA-effect JUnit oracle
        run: mvn -B -ntp -f m3/ports/precompute/pom.xml -Dtest=M3RegexDfaEffectsPortTest test
