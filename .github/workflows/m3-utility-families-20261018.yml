# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 utility families
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/java/io/IOUtils.java'
      - 'src/java.base/share/classes/java/lang/reflect/Reflections.java'
      - 'src/java.base/share/classes/java/util/Streams.java'
      - 'src/java.base/share/classes/java/util/Strings.java'
      - 'm3/docs/utilities/**'
      - 'm3/verification/utilities/**'
      - '.github/workflows/m3-utility-families-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  utilities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify actual utility sources and contracts
        run: python3 m3/verification/utilities/verify.py --output-dir "$RUNNER_TEMP/m3-utility-proof"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3-utility-proof
          path: |
            ${{ runner.temp }}/m3-utility-proof/EXECUTION.json
            ${{ runner.temp }}/m3-utility-proof/logs/
