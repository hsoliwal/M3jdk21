name: M3 primitive sorted-set algebra master receipt

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongCompositeViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongSortedAlgebra*.java'
      - 'm3/collections/JDK_FAMILY_MAP.tsv'
      - 'm3/collections/qualification/*sorted*algebra*'
      - '.github/workflows/m3-sorted-algebra-master-receive-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-java21-module:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail closed on any unsealed generated Java or missing source
        shell: bash
        run: python3 m3/collections/qualification/verify_sorted_set_algebra.py
      - name: Compile complete current primitive collection owners under Java21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/collections/target/sorted-algebra-classes
          find m3/collections/src/main/java/com/m3/collections -name '*.java' -type f | LC_ALL=C sort > m3/collections/target/sorted-algebra-sources.txt
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -d m3/collections/target/sorted-algebra-classes \
            @m3/collections/target/sorted-algebra-sources.txt
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -cp m3/collections/target/sorted-algebra-classes \
            -d m3/collections/target/sorted-algebra-classes \
            m3/collections/src/test/java/com/m3/collections/M3LongSortedAlgebraSelfTest.java
      - name: Execute independent JDK TreeSet and live-wrapper differential oracle
        shell: bash
        run: |
          java -ea -Xmx96m -Xss512k -Xcheck:jni \
            -cp m3/collections/target/sorted-algebra-classes \
            com.m3.collections.M3LongSortedAlgebraSelfTest

  focused-junit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute Maven JUnit against actual module; do not suppress resolution failures
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongSortedAlgebraTest test
