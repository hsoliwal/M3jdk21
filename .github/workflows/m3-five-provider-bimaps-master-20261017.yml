# SPDX-License-Identifier: Apache-2.0
name: M3 five-library SDK Apache BidiMap current master
on:
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3ApacheBidiMap.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3LibraryCollections.java'
      - 'm3/collections/interop/sdk-family-bindings.tsv'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3ApacheBidiMapContractTest.java'
      - 'm3/collections/qualification/m3-five-provider-bimaps-master-20261017/**'
      - '.github/workflows/m3-five-provider-bimaps-master-20261017.yml'
  workflow_dispatch:
jobs:
  source-sealed-recipe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual Maven OpenRewrite SDK JUnit - source generation and fixed point
        run: mvn -B -ntp -f m3/collections/qualification/m3-five-provider-bimaps-master-20261017/recipe/pom.xml clean verify
      - name: Verify all 6 exact generated targets against SHA256 resource manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path(".")
          recipe=root/"m3/collections/qualification/m3-five-provider-bimaps-master-20261017/recipe/src/main/resources/com/synexia/rewrite/m3-five-provider-bimaps-master-20261017"
          count=0
          for line in (recipe/"manifest.tsv").read_text(encoding="utf-8").splitlines():
              path,before,after,resource=line.split("\t")
              template=(recipe/resource).read_bytes()
              receiver=(root/path).read_bytes()
              assert sha256(template).hexdigest()==after,(path,"bad resource seal")
              assert receiver==template,(path,"receiver drift")
              count+=1
          assert count==6,count
          print("PASS six exact sealed receiver outputs")
          PY
  five-provider-real-apis:
    runs-on: ubuntu-latest
    needs: source-sealed-recipe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build real M3 flat array index owners
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Run real JDK Guava Eclipse Spring Apache tests and Apache BidiMap oracle
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Reuse unchanged bounded C17 JNI mask selector with fatal UBSan
        run: |
          set -eu
          C="$RUNNER_TEMP/m3-apache-bidi/classes"
          N="$RUNNER_TEMP/m3-apache-bidi/native"
          mkdir -p "$C" "$N"
          javac --release 21 -Xlint:all -Werror -d "$C" \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$N/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$N" -cp "$C" \
            com.m3.collections.M3IndexMaskCompactorSelfTest
