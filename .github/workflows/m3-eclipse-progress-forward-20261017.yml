name: M3 Eclipse progress forward receiver (Java 21)
on:
  pull_request:
    branches: [master]
    paths:
      - 'm3/eclipse/core-runtime/**'
      - 'm3/collections/src/main/java/**'
      - 'm3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java'
      - '.github/workflows/m3-eclipse-progress-forward-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  m3-eclipse-progress-receiver:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Record exact head and verify postimage source hashes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof
          git rev-parse HEAD > proof/head.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          base = Path('m3/eclipse/core-runtime/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/eclipse-m3-progress-forward')
          rows = [s.split('\t') for s in (base / 'manifest.tsv').read_text().splitlines() if s and not s.startswith('#')]
          assert len(rows) == 2
          for relative, before, digest, name in rows:
              assert before == 'ABSENT'
              for candidate in (Path(relative), base / name):
                  assert candidate.is_file() and not candidate.is_symlink(), candidate
                  assert hashlib.sha256(candidate.read_bytes()).hexdigest() == digest, candidate
          print('ADMITTED_TWO_EXACT_POSTIMAGES')
          PY
      - name: Verify scheduled-task recipe custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("m3/eclipse/core-runtime/recipe/src/test/resources/com/synexia/rewrite/hash-pinned-java/eclipse-m3-scheduled-tasks-20261021")
          rows = [line.split("\t") for line in (root / "manifest.tsv").read_text(encoding="utf-8").splitlines()
                  if line and not line.startswith("#")]
          assert len(rows) == 2, rows
          assert [row[0] for row in rows] == sorted(row[0] for row in rows)
          for relative, before, expected, template in rows:
              assert before == "ABSENT", relative
              assert len(expected) == 64, expected
              for item in (Path(relative), root / template):
                  assert item.is_file() and not item.is_symlink(), item
                  actual = hashlib.sha256(item.read_bytes()).hexdigest()
                  assert actual == expected, (item, expected, actual)
          print("M3_ECLIPSE_SCHEDULED_TASKS_SEALED", len(rows))
          PY
      - name: Run hash-pinned Java LST recipe and refusal/fixed-point tests
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/core-runtime/recipe/pom.xml test 2>&1 | tee proof/recipe.txt
      - name: Compile unchanged M3 collections and install runtime dependency
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes
          find m3/collections/src/main/java -name '*.java' | sort > proof/m3-sources.txt
          javac --release 21 -Xlint:all,-module -Werror -d proof/classes @proof/m3-sources.txt 2>&1 | tee proof/m3-compile.txt
          jar --create --file proof/m3-collections.jar -C proof/classes .
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$GITHUB_WORKSPACE/proof/m3-collections.jar" \
            -DgroupId=com.m3 -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT \
            -Dpackaging=jar -DgeneratePom=true
      - name: Compile and test real Eclipse API forwarding
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/core-runtime/pom.xml verify 2>&1 | tee proof/maven-bridge.txt
          git diff --exit-code -- m3/collections/src/main/java m3/eclipse/core-runtime/src
      - name: Require scheduled-task product and recipe JUnit receipts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          cases = {
              Path("m3/eclipse/core-runtime/recipe/target/surefire-reports/"
                   "TEST-com.synexia.rewrite.M3EclipseScheduledTasksRecipeTest.xml"): 4,
              Path("m3/eclipse/core-runtime/target/surefire-reports/"
                   "TEST-com.m3.eclipse.runtime.M3EclipseScheduledTasksTest.xml"): 9
          }
          for path, count in cases.items():
              assert path.is_file(), f"missing execution receipt {path}"
              root = ET.parse(path).getroot()
              actual = {k: int(root.attrib.get(k, "0"))
                        for k in ("tests", "errors", "failures", "skipped")}
              assert actual == dict(tests=count, errors=0, failures=0, skipped=0), (path, actual)
          print("M3_ECLIPSE_SCHEDULED_TASKS_RECEIPTS_PASS")
          PY
      - name: Preserve receipts and JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-progress-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/eclipse/core-runtime/recipe/target/surefire-reports/
            m3/eclipse/core-runtime/target/surefire-reports/
