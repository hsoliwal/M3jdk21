# SPDX-License-Identifier: Apache-2.0
name: M3 donor catalogue

# Former triggers (below, as of the move) now start job(s) 'm3-donor-catalogue__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/tooling/donor-catalogue/**'
#         - '.github/workflows/m3-donor-catalogue.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-donor-catalogue:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate verification script syntax
        run: bash -n m3/tooling/donor-catalogue/verify.sh
      - name: Compile, test, validate and prove fixed point
        run: bash m3/tooling/donor-catalogue/verify.sh
      - name: Upload deterministic donor plan and receipts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-donor-catalogue-${{ github.sha }}
          path: build/m3-donor-catalogue/
          if-no-files-found: error
          retention-days: 14
