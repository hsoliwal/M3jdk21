# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 first-party purpose wrappers Maven recipe Java21 JNI

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3AdmissionWrappers.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3BoundedLists.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionWrappers.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3ConcatenatedViews.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3FixedSizeLists.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3MappedViews.java'
      - 'm3/collections/wrappers/src/test/java/com/m3/collections/M3CollectionWrappers*.java'
      - 'm3/collections/wrappers/src/test/java/com/m3/collections/M3PurposeReceiverProof*.java'
      - 'm3/collections/wrappers/src/test/java/com/m3/collections/M3MapCursorNativeProof.java'
      - 'm3/collections/wrappers/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-purpose-wrapper-receiver-20261017/**'
      - 'm3/collections/wrappers/recipe/src/main/resources/META-INF/rewrite/m3-purpose-wrapper-receiver-20261017.yml'
      - 'm3/collections/wrappers/recipe/src/test/java/com/synexia/rewrite/M3PurposeWrapperReceiverRecipeTest.java'
      - 'm3/collections/wrappers/purpose-receiver-20261017/**'
      - '.github/workflows/m3jdk-purpose-wrapper-receiver-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-jni-purpose-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact eleven target SHA256 pre/post recipe and first-party lineage
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          recipe=Path('m3/collections/wrappers/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-purpose-wrapper-receiver-20261017')
          lines=[line.split('\t') for line in (recipe/'manifest.tsv').read_text().splitlines() if line]
          assert len(lines)==11 and len({line[0] for line in lines})==11
          assert sum(line[1]=='ABSENT' for line in lines)==10
          assert lines==sorted(lines,key=lambda line:line[0])
          sha=lambda file:hashlib.sha256(file.read_bytes()).hexdigest()
          for path,before,after,name in lines:
              target=Path(path)
              assert name.endswith('.java.txt')
              assert sha(recipe/name)==after,(path,'recipe drift')
              assert target.is_file() and sha(target)==after,(path,'product/source drift')
              if before!='ABSENT':assert sha(recipe/'pre'/name)==before,(path,'donor preimage drift')
          print('M3_PURPOSE_WRAPPER_SOURCE_SEAL_PASS targets=11')
          PY
      - name: Strict Java21 compile actual M3 owners and original/extended contract oracles
        shell: bash
        run: |
          set -euo pipefail
          B=build/m3-purpose-receiver
          mkdir -p "$B"
          javac --release 21 -proc:none -Xlint:all -Werror -h "$B" -d "$B" \
            m3/collections/src/main/java/com/m3/collections/M3CollectionViews.java \
            m3/collections/src/main/java/com/m3/collections/M3FilteredMaps.java \
            m3/collections/src/main/java/com/m3/collections/M3AdmissionWrappers.java \
            m3/collections/src/main/java/com/m3/collections/M3BoundedLists.java \
            m3/collections/src/main/java/com/m3/collections/M3CollectionWrappers.java \
            m3/collections/src/main/java/com/m3/collections/M3ConcatenatedViews.java \
            m3/collections/src/main/java/com/m3/collections/M3FixedSizeLists.java \
            m3/collections/src/main/java/com/m3/collections/M3MappedViews.java \
            m3/collections/wrappers/src/test/java/com/m3/collections/M3CollectionWrappersSelfTest.java \
            m3/collections/wrappers/src/test/java/com/m3/collections/M3PurposeReceiverProof.java \
            m3/collections/wrappers/src/test/java/com/m3/collections/M3MapCursorNativeProof.java
          java -ea -Xmx384m -cp "$B" com.m3.collections.M3CollectionWrappersSelfTest
          java -ea -Xmx384m -cp "$B" com.m3.collections.M3PurposeReceiverProof
      - name: Reuse existing unchanged bounded JNI C17 peer with fatal UBSan and Xcheck
        shell: bash
        run: |
          set -euo pipefail
          B=build/m3-purpose-receiver
          C=m3/collections/wrappers/direct-projection-20261017/m3_map_cursor_jni.c
          grep -q Java_com_m3_collections_M3MapCursorNativeProof_fold "$B/com_m3_collections_M3MapCursorNativeProof.h"
          gcc -std=c17 -O2 -Wall -Wextra -Werror -pedantic -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            "$C" -o "$B/libm3_map_cursor_jni.so"
          java -ea -Xcheck:jni \
            -Dm3.cursor.native.library="$PWD/$B/libm3_map_cursor_jni.so" \
            -cp "$B" com.m3.collections.M3MapCursorNativeProof
      - name: Review diff hygiene
        run: git diff --check HEAD^ HEAD

  reusable-maven-openrewrite-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Actual eleven-target Java LST source generation and fail-closed replay
        run: >-
          mvn -B -ntp -f m3/collections/wrappers/recipe/pom.xml test
          -Dtest=M3PurposeWrapperReceiverRecipeTest
