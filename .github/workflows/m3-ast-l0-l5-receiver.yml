name: M3AST L0-L5 selected-source proof
on:
  pull_request:
    paths:
      - 'm3/ports/compiletime/src/main/java/com/m3/compiletime/M3ASTLeafIndex.java'
      - 'm3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTLeafIndexSelfTest.java'
      - 'm3/ports/compiletime/qualification/ast-leaf-l0-l5-20261017/**'
      - '.github/workflows/m3-ast-l0-l5-receiver.yml'
  workflow_dispatch:
jobs:
  selected-java21:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact sealed recipient blobs
        shell: bash
        run: |
          set -euo pipefail
          echo '0194ab2afa7c0a7ace8b8cb4e28aa142a44cf623176dce5feaa5e6c271173f8b  m3/ports/compiletime/src/main/java/com/m3/compiletime/M3ASTLeafIndex.java' | sha256sum -c -
          echo 'b1303aa343f542cf6339d907369eb08bec68025eb41c43eaf6500abbb84998aa  m3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTLeafIndexSelfTest.java' | sha256sum -c -
      - name: Compile, run and verify source only (not full JDK)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3ast-leaf-classes
          javac --release 21 -proc:none -Xlint:all -Werror -d /tmp/m3ast-leaf-classes \
            m3/ports/compiletime/src/main/java/com/m3/compiletime/M3ASTLeafIndex.java \
            m3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTLeafIndexSelfTest.java
          java -cp /tmp/m3ast-leaf-classes com.m3.compiletime.M3ASTLeafIndexSelfTest
