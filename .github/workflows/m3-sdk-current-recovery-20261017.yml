name: M3 SDK historical partition + primitive bag recovery
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3CollectionSdk.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexPartitions.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongBag.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SdkRecovery*.java'
      - 'm3/collections/qualification/sdk-current-recovery-20261017/**'
      - '.github/workflows/m3-sdk-current-recovery-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict SHA-256 source admission and refusal tests
        run: |
          python3 -m unittest discover -s m3/collections/qualification/sdk-current-recovery-20261017 -p 'test_*.py' -v
      - name: Compile all actual collection owners and run JUnit
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3SdkRecoveryTest test
      - name: Compile existing C17 path-mask native implementation
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -O2 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -fPIC -shared             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_path_masks.c             -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
          java -Xcheck:jni -Djava.library.path="$RUNNER_TEMP"             -cp "m3/collections/target/classes:m3/collections/target/test-classes"             com.m3.collections.M3SdkRecoverySelfTest --native
