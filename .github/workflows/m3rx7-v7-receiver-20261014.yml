# SPDX-License-Identifier: Apache-2.0
name: M3RX7 v7 DFA Receiver
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/mindex/M3RX7.java'
      - 'test/jdk/java/util/regex/M3RX7Test.java'
      - 'm3/docs/name-mapping.d/m3-regex-v7-dfa.json'
      - 'm3/runtime-integration/check-m3rx7-v7-receiver.sh'
      - '.github/workflows/m3rx7-v7-receiver-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  standalone-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact Synexia recipe receiver bytes and executable Java21 oracle
        run: sh m3/runtime-integration/check-m3rx7-v7-receiver.sh
