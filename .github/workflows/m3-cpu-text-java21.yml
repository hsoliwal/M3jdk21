# SPDX-License-Identifier: Apache-2.0
name: M3 CPU text donor Java 21 oracle

on:
  pull_request:
    paths:
      - '.github/workflows/m3-cpu-text-java21.yml'
      - 'm3/tooling/module-packs/cpu-tools/src/**'
      - 'm3/tooling/module-packs/cpu-tools/fixtures/M3DonorToolsTest.java'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-donor-oracle:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact PR revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Use Java 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strictly compile all 16 donor modules and independent oracle
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/m3-cpu-text-donor-classes"
          mkdir -p "$classes"
          find m3/tooling/module-packs/cpu-tools/src -type f -name '*.java' \
            ! -name module-info.java ! -path '*/com.m3.tools.cpu/*' -print0 \
            | LC_ALL=C sort -z \
            | xargs -0 -r javac --release 21 -Xlint:all,-module -Werror -d "$classes" \
                m3/tooling/module-packs/cpu-tools/fixtures/M3DonorToolsTest.java
      - name: Run independent Java 21 UTF-16 and signature oracle
        shell: bash
        run: java -cp "$RUNNER_TEMP/m3-cpu-text-donor-classes" M3DonorToolsTest
      - name: Declare limited proof scope
        run: |
          echo 'PASS means Java 21 donor compilation and fixture execution only.'
          echo 'Custom M3JDK21 image, JMOD, JNI, M3String-storage and M3AST acceptance remain separate pending gates.'
