# SPDX-License-Identifier: Apache-2.0
name: M3 collection port wave one

# Former triggers (below, as of the move) now start job(s) 'm3-collection-port-wave1__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/ports/collections/**'
#         - 'm3/collections/src/**'
#         - '.github/workflows/m3-collection-port-wave1.yml'
#         - 'm3/tooling/standalone/LINEAGE_SOURCES.tsv'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Diff hygiene
        run: git diff --check
      - name: Provenance and isolation gate
        run: python3 m3/ports/collections/verify_collection_port_wave1.py
      - name: Install the vendored JUnit 5.10.2 family the port tests use
        run: >
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl junit-jupiter-5.10.2,junit-platform-launcher-1.10.2
          -am -DskipTests install
      - name: Java 21 compile and contract tests
        run: mvn -B -ntp -f m3/ports/collections/pom.xml clean test
