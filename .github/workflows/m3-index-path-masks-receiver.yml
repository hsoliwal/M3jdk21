# SPDX-License-Identifier: Apache-2.0
# Synexia source-sealed recipe: jdk.internal.m3.Jdk21IndexPathMasks20261017
name: M3 indexed 32-bit mask paths Java21 and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexPathMasks.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexPathMasks*'
      - 'm3/collections/src/main/native/collections/m3_index_path_masks.c'
      - 'm3/collections/recipe/index-path-masks-20261017/**'
      - 'm3/collections/verify_donation.py'
      - 'm3/collections/test_verify_index_path_masks.py'
      - 'm3/collections/qualification/INDEX_PATH_MASKS_RECEIVER_20261017.md'
      - '.github/workflows/m3-index-path-masks-receiver.yml'
  push:
    branches:
      - m3/index-path-masks-receiver-20261017
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-java-jni:
    name: Sealed Java21 and real JNI path-mask parity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify pinned Synexia receiver files and Python admission regression
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check <<'DIGESTS'
          11a04c1382f9358f9bb49da6df98fdb988144a649db30638965bfb25333b4be9  m3/collections/src/main/java/jdk/m3/collections/M3IndexPathMasks.java
          4883466fcc73cea1aaa7b443abbb5612a1e9f0c06166f0576b091b273653c02e  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathMasksSelfTest.java
          3ba12ceee31693b3c202a3867f42a4fdc5acba5f9c7d96f919e4f88155af71b8  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathMasksTest.java
          072e6c3d30b1fd54d8ce883ed18fde75aa6c1809a1dc0c9a2de7b7e5f571f824  m3/collections/src/main/native/collections/m3_index_path_masks.c
          c3af2d443d0c79ee375f6ac0399a874fd5662123e4ef1af52b358c2a6f8ea28f  m3/collections/recipe/index-path-masks-20261017/manifest.tsv
          094ec75e59efa040b5d21f5f4bbf893125c1d57ee394a3c57d9ae7a902017d52  m3/collections/test_verify_index_path_masks.py
          ecd2bc317fa630f4519025f2c687b59186981278fc963a7eb471dcf910819c49  m3/collections/verify_donation.py
          DIGESTS
          python3 -m unittest discover -s m3/collections -p 'test_verify_*.py' -v
      - name: Compile Java21 module owner and actual mask proof
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-path-mask-classes" "$RUNNER_TEMP/m3-path-mask-native"
          find m3/collections/src/main/java/jdk/m3/collections -name '*.java' -print | sort > "$RUNNER_TEMP/m3-collection-sources.txt"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-path-mask-classes" @"$RUNNER_TEMP/m3-collection-sources.txt"
          javac --release 21 -proc:none -Xlint:all -Werror -cp "$RUNNER_TEMP/m3-path-mask-classes" -h "$RUNNER_TEMP/m3-path-mask-native" -d "$RUNNER_TEMP/m3-path-mask-classes" \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathMasksSelfTest.java \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexPathMasks.java
          test -s "$RUNNER_TEMP/m3-path-mask-native/jdk_m3_collections_M3IndexPathMasks.h"
          java -Xcheck:jni -cp "$RUNNER_TEMP/m3-path-mask-classes" jdk.m3.collections.M3IndexPathMasksSelfTest
      - name: C17 compile and real JNI differential
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$RUNNER_TEMP/m3-path-mask-native/libm3_collections_pathmask.so"
          java -Xcheck:jni -Djava.library.path="$RUNNER_TEMP/m3-path-mask-native" \
            -cp "$RUNNER_TEMP/m3-path-mask-classes" jdk.m3.collections.M3IndexPathMasksSelfTest --native
  maven-junit:
    name: Owning M3 collections Maven / JUnit proof
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Full owner compilation and exact new JUnit adapter
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3IndexPathMasksTest test
