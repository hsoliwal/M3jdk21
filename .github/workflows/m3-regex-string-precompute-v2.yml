# SPDX-License-Identifier: Apache-2.0
name: M3 Regex String Precompute V2

on:
  pull_request:
    paths:
      - 'm3/ports/precompute/**'
      - 'm3/docs/M3JDK21_PORTING_INVARIANT.md'
      - 'm3/docs/M3JDK_SYNEXIA_PORTING_INVARIANT.md'
      - 'm3/docs/m3jdk-synexia-porting-policy.tsv'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3RegexStringPrecomputeSupersetRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3RegexStringPrecomputeSupersetRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-regex-string-precompute-v2.yml'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-regex-string-precompute-v2/**'
      - '.github/workflows/m3-regex-string-precompute-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diff and invariant custody
        run: |
          set -euo pipefail
          git diff --check
          python3 m3/ports/precompute/verify_regex_string_v2.py
          python3 -m json.tool m3/ports/precompute/recipe-regex-string-v2.json >/dev/null

      - name: Java regex String precompute proof
        run: |
          mvn -B -ntp -f m3/ports/precompute/pom.xml             -Dtest=M3RegexStringSignalsTest,M3RegexStringTrialImageTest test

      - name: Existing M3 JNI provider parity
        run: |
          mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative             -Dtest=M3RegexStringTrialImageTest,M3NativeParityTest test

      - name: OpenRewrite crate fixed point
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3RegexStringPrecomputeSupersetRecipeTest test
