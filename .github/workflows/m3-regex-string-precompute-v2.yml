name: M3 Regex String Precompute V2

# Former triggers (below, as of the move) now start job(s) 'm3-regex-string-precompute-v2__*' in
# .github/workflows/checks-superset-06.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/ports/precompute/**'
#         - 'src/java.base/share/classes/jdk/m3/precompute/**'
#         - 'test/jdk/jdk/m3/precompute/**'
#         - 'm3/docs/M3JDK21_PORTING_INVARIANT.md'
#         - 'm3/docs/M3JDK_M3_PORTING_INVARIANT.md'
#         - 'm3/docs/m3jdk-m3-porting-policy.tsv'
#         - 'm3/tooling/migration-recipes/src/main/java/jdk/m3/rewrite/backport/M3RegexStringPrecomputeSupersetRecipe.java'
#         - 'm3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/backport/M3RegexStringPrecomputeSupersetRecipeTest.java'
#         - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-regex-string-precompute-v2.yml'
#         - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/m3-regex-string-precompute-v2/**'
#         - '.github/workflows/m3-regex-string-precompute-v2.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diff and invariant custody
        run: |
          set -euo pipefail
          git diff --check
          python3 m3/ports/precompute/verify_regex_string_v2.py
          python3 -m json.tool m3/ports/precompute/recipe-regex-string-v2.json >/dev/null

      - name: Java regex String precompute proof
        run: |
          mvn -B -ntp -f m3/ports/precompute/pom.xml             -Dtest=M3RegexStringSignalsTest,M3RegexStringTrialImageTest test

      - name: Existing M3 JNI provider parity
        run: |
          mvn -B -ntp -f m3/ports/precompute/pom.xml -Pnative             -Dtest=M3RegexStringTrialImageTest,M3NativeParityTest test

