name: M3 OpenRewrite recipe proof

on:
  push:
    branches:
      - "m3/**"
    paths:
      - "m3/pom.xml"
      - "m3/indexdb/**"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/recipe-catalogue.tsv"
      - "m3/tooling/verification/**"
      - "m3/docs/atom-pattern-admission-and-tooling-boundary.md"
      - "m3/docs/m3indexdb-semantic-atom-index.md"
      - ".github/workflows/m3-tooling-recipes.yml"
  pull_request:
    paths:
      - "m3/pom.xml"
      - "m3/indexdb/**"
      - "m3/tooling/migration-recipes/**"
      - "m3/tooling/recipe-catalogue.tsv"
      - "m3/docs/atom-pattern-admission-and-tooling-boundary.md"
      - "m3/docs/m3indexdb-semantic-atom-index.md"
      - ".github/workflows/m3-tooling-recipes.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recipes:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Fetch exact PR head without reusable actions
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          curl --fail --location --retry 3             "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}"             -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"

      - name: Fetch immutable JDK21 verbatim baseline
        shell: bash
        run: |
          set -euo pipefail
          BASELINE_SHA="$(awk -F '\t' '$1 == "baseline_commit" { print $2 }' "$REPO/m3/tooling/verbatim/JDK21_BASELINE.tsv")"
          test "$BASELINE_SHA" = "7a3f9c49d71a62c5ee2a398f4607d446dce518b8"
          curl --fail --location --retry 3             "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${BASELINE_SHA}"             -o "$RUNNER_TEMP/jdk21-baseline.tar.gz"
          mkdir -p "$RUNNER_TEMP/jdk21-baseline"
          tar -xzf "$RUNNER_TEMP/jdk21-baseline.tar.gz"             -C "$RUNNER_TEMP/jdk21-baseline" --strip-components=1
          printf 'JDK21_BASELINE=%s\n' "$RUNNER_TEMP/jdk21-baseline" >> "$GITHUB_ENV"

      - name: Prepare isolated pinned JDK 21
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz'             -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n'             '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6'             "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"

      - name: Prepare pinned Maven 3.9.11
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz' \
            -o "$RUNNER_TEMP/maven.tar.gz"
          printf '%s  %s\n' \
            'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978' \
            "$RUNNER_TEMP/maven.tar.gz" | sha512sum --check -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

      - name: Maven JUnit OpenRewrite proof
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          mvn -B -f "$REPO/m3/pom.xml" -P m3-recipes verify

      - name: Verify JDK-8357439 Bash completion payload
        shell: bash
        run: |
          set -euo pipefail
          bash "$REPO/m3/backports/recipes/verify-JDK-8357439.sh"             "$REPO/m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-text/jdk-8357439-jcmd-completion/jcmd.txt"

      - name: Byte-exact JDK21 product-tree gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-verbatim"
          java -cp "$REPO/m3/tooling/migration-recipes/target/classes"             com.m3.rewrite.verbatim.M3Jdk21VerbatimCompare             "$JDK21_BASELINE"             "$REPO"             "$REPO/m3/tooling/verbatim/approved-product-delta.tsv"             "$RUNNER_TEMP/m3-verbatim/JDK21_VERBATIM_DIFF.tsv"
          test -s "$RUNNER_TEMP/m3-verbatim/JDK21_VERBATIM_DIFF.tsv"
          awk -F '\t' 'NR == 1 || $2 != "SAME"'             "$RUNNER_TEMP/m3-verbatim/JDK21_VERBATIM_DIFF.tsv"
