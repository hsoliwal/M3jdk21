# SPDX-License-Identifier: Apache-2.0
name: M3 object state batch receiver Java JNI
on:
  pull_request:
    paths:
      - "m3/collections/src/main/java/com/m3/collections/M3ObjectStateBatch28.java"
      - "m3/collections/src/test/java/com/m3/collections/M3ObjectStateBatch28SelfTest.java"
      - "m3/collections/qualification/object-state-batch-28/**"
      - "m3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/object-state-batch-28/**"
      - ".github/workflows/m3-object-state-batch28-receiver.yml"
  push:
    branches: [m3/object-state-batch-offsets-receiver-20261017]
permissions:
  contents: read
jobs:
  source-sdk-and-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Exact source custody
        shell: bash
        run: |
          set -euxo pipefail
          python3 -S m3/collections/qualification/object-state-batch-28/verify.py
      - name: Real Maven OpenRewrite recipe SDK, output and refusal checks
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/qualification/object-state-batch-28/pom.xml test
          diff -u m3/collections/qualification/object-state-batch-28/evidence/QUALIFIED.tsv \
            m3/collections/qualification/object-state-batch-28/target/sdk-batch-28/QUALIFIED.tsv
      - name: Original M3 core compile and Java/JNI regression
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z | \
            xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          javac --release 21 -proc:none -Xlint:all -Werror -cp proof/classes \
            -d proof/classes \
            m3/collections/src/test/java/com/m3/collections/M3ObjectStateBatch28SelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          java -Xmx256m -cp proof/classes com.m3.collections.M3ObjectStateBatch28SelfTest
          java -Xmx256m -cp proof/classes com.m3.collections.M3IndexMaskCompactorSelfTest
          javac --release 21 -proc:none -h proof/native -cp proof/classes \
            -d proof/classes m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java
          gcc -std=c17 -Wall -Wextra -Wpedantic -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so
          UBSAN_OPTIONS=halt_on_error=1 java -Xmx256m -Xcheck:jni \
            -Djava.library.path="$PWD/proof/native" -cp proof/classes \
            com.m3.collections.M3IndexMaskCompactorSelfTest --native
          python3 -S m3/collections/qualification/object-state-batch-28/verify.py
          git diff --exit-code
      - name: Preserve receipt and failed-gate logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-state-batch-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            m3/collections/qualification/object-state-batch-28/target/surefire-reports/
            m3/collections/qualification/object-state-batch-28/target/sdk-batch-28/
            proof/native/
