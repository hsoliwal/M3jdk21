# SPDX-License-Identifier: Apache-2.0
name: M3 progressive signal evidence Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ProgressiveSignalEvidence.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ProgressiveSignalEvidenceContract.java'
      - 'm3/collections/qualification/progressive-signal-evidence-20261018/**'
      - '.github/workflows/m3-progressive-signal-evidence-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  focused-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Source and differential test compile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-progressive-signal-evidence
          javac --release 21 -proc:none -Xlint:all -Werror \
            -d /tmp/m3-progressive-signal-evidence \
            m3/collections/src/main/java/com/m3/collections/M3SignalOrder.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalOrderNative.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressiveSignalEvidence.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalOrderContract.java \
            m3/collections/src/test/java/com/m3/collections/M3ProgressiveSignalEvidenceContract.java
      - name: Existing native-capable signal sorter Java oracle
        run: java -cp /tmp/m3-progressive-signal-evidence com.m3.collections.M3SignalOrderContract
      - name: Progressive multidimensional differential oracle
        run: java -cp /tmp/m3-progressive-signal-evidence com.m3.collections.M3ProgressiveSignalEvidenceContract
      - name: Source fence against duplicate engines and dependency
        shell: bash
        run: |
          set -euo pipefail
          file=m3/collections/src/main/java/com/m3/collections/M3ProgressiveSignalEvidence.java
          grep -F 'long[] evaluated' "$file"
          grep -F 'Double.compare(a, b)' "$file"
          ! grep -F 'System.loadLibrary(' "$file"
          ! grep -F 'java.lang.reflect.' "$file"
          ! grep -F 'com.synexia.' "$file"
