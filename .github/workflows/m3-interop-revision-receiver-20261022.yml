# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 exact 76-file interop source revision and vendor contracts

on:
  pull_request:
    paths:
      - 'm3/collections/interop/qualification/current-census-superset-20261022/**'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryArrayificationTest.java'
      - '.github/workflows/m3-interop-revision-receiver-20261022.yml'
  push:
    branches:
      - m3/interop-var-receipt-receiver-20261022
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-epochs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: hsoliwal/M3jdk21
          ref: a720780b1a5ab41ea27182b9b7ad873efdf533b4
          path: historical-product
          sparse-checkout: |
            m3/collections/interop
          persist-credentials: false
      - name: Preserve historical 36 and seven revisions, then 40 additions and one grammar repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C historical-product rev-parse HEAD)" = a720780b1a5ab41ea27182b9b7ad873efdf533b4
          python3 -m unittest discover -s m3/collections/interop/qualification/current-census-20261017 -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/old-proofs.log"
          python3 -m unittest discover -s m3/collections/interop/qualification/current-census-superset-20261022 -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/successor-proofs.log"
          grep -F 'Ran 4 tests' "$RUNNER_TEMP/old-proofs.log"
          grep -F 'Ran 11 tests' "$RUNNER_TEMP/successor-proofs.log"
          python3 m3/collections/interop/qualification/current-census-superset-20261022/verify_superset.py \
            --product . --historical-product historical-product \
            | tee "$RUNNER_TEMP/m3-76-source-epochs.log"
          grep -F 'M3_FIVE_LIBRARY_SOURCE_SUPERSET_PASS original=36 revised=7 additive=40 total=76' \
            "$RUNNER_TEMP/m3-76-source-epochs.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-original-76-source-epochs-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/old-proofs.log
            ${{ runner.temp }}/successor-proofs.log
            ${{ runner.temp }}/m3-76-source-epochs.log
          if-no-files-found: warn

  java21-vendor-contracts:
    runs-on: ubuntu-24.04
    needs: source-epochs
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile original M3JDK21 dynamic-array/index/mask core with proven strict javac
        shell: bash
        run: |
          set -euo pipefail
          C="$RUNNER_TEMP/m3-interop-core/classes"
          mkdir -p "$C/META-INF"
          find m3/collections/src/main/java -name '*.java' | sort > "$RUNNER_TEMP/m3-core-sources.txt"
          javac --release 21 -Xlint:all,-module -Werror \
            -d "$C" @"$RUNNER_TEMP/m3-core-sources.txt"
          cp m3/collections/{LICENSE,NOTICE,provenance.json,name-mapping.json} "$C/META-INF/"
          jar --create --file "$RUNNER_TEMP/m3-collections.jar" -C "$C" .
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$RUNNER_TEMP/m3-collections.jar" \
            -DgroupId=com.m3 -DartifactId=m3-collections \
            -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Execute original JDK Apache Guava Eclipse Spring interop Java 21 tests
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Preserve real Maven/JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-interop-vendor-tests-${{ github.event.pull_request.head.sha || github.sha }}
          path: m3/collections/interop/target/surefire-reports/
          if-no-files-found: warn
