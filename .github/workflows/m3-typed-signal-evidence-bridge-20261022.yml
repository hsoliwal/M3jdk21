# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 exact typed progressive signal evidence Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalColumns.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SignalEvidenceBridge.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3SignalEvidenceBridge*.java'
      - 'm3/collections/qualification/typed-signal-evidence-bridge-20261022/**'
      - '.github/workflows/m3-typed-signal-evidence-bridge-20261022.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-java21-compiler-and-progressive-oracles:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source custody and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/m3/typed-signal-topk-20261022...HEAD
          bash m3/collections/qualification/typed-signal-evidence-bridge-20261022/verify.sh
      - name: Strict Java21 original typed sources, existing progressive engine and bridge
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-evidence-bridge"
          mkdir -p "$out/classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressiveSignalEvidence.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalEvidenceBridge.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalEvidenceBridgeSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3ProgressiveSignalEvidenceContract.java
          java -cp "$out/classes" com.m3.collections.M3SignalEvidenceBridgeSelfTest
          java -cp "$out/classes" com.m3.collections.M3ProgressiveSignalEvidenceContract
          java -Xint -cp "$out/classes" com.m3.collections.M3SignalEvidenceBridgeSelfTest

  original-custom-junit-reactor:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build unchanged original JUnit source and exact custom test dependency
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py \
            m3/vendor/third_party/junit-jupiter-5.10.2/target/junit-jupiter-5.10.2-m3-source-1.jar
      - name: Original owning Maven/JUnit tests (unchanged collections POM)
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3SignalEvidenceBridgeTest,M3SignalColumnsTest,M3SignalTopKTest
          test

  portable-test-only-original-owners:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Independent JUnit 5.11.4 against actual M3JDK21 source (not fork acceptance)
        run: >
          mvn -B -ntp -f
          m3/collections/qualification/typed-signal-evidence-bridge-20261022/pom.xml
          -Dtest=M3SignalEvidenceBridgeTest test
