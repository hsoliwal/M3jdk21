name: M3JDK21 native indexed-mask stage-cache proof
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'm3/collections/src/main/native/collections/m3_index_path_masks.c'
      - 'm3/collections/qualification/pathmask-stage-cache-20261020/**'
      - 'm3/tooling/migration-recipes/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/synexia/rewrite/M3NativeRecipePathAdmissionTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-native-*/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-native-*.yml'
      - '.github/workflows/m3-pathmask-stagecache-20261020.yml'
jobs:
  focused-native-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: C17 UBSan + Java21 CheckJNI owner parity with exact recipe seals
        run: bash m3/collections/qualification/pathmask-stage-cache-20261020/verify.sh
  recipe-maven-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build/test qualified OpenRewrite native-path admission source
        run: mvn -B -ntp -f m3/pom.xml -pl tooling/migration-recipes -am -Dtest=M3NativeRecipePathAdmissionTest -Dsurefire.failIfNoSpecifiedTests=false test
