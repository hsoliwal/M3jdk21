# SPDX-License-Identifier: GPL-2.0-with-classpath-exception
name: M3 JEP 510 KDF materialized candidate

on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/com/sun/crypto/provider/HKDFKeyDerivation.java'
      - 'src/java.base/share/classes/com/sun/crypto/provider/SunJCE.java'
      - 'src/java.base/share/classes/java/security/Provider.java'
      - 'src/java.base/share/classes/javax/crypto/KDF.java'
      - 'src/java.base/share/classes/javax/crypto/KDFParameters.java'
      - 'src/java.base/share/classes/javax/crypto/KDFSpi.java'
      - 'src/java.base/share/classes/javax/crypto/spec/HKDFParameterSpec.java'
      - 'src/java.base/share/classes/sun/security/util/Debug.java'
      - 'test/jdk/com/sun/crypto/provider/KDF/**'
      - 'test/jdk/javax/crypto/KDF/**'
      - 'm3/backports/recipes/j510/**'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3Jep510Kdf*.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3Jep510Kdf*.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk25-jep510-kdf/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/jdk25-jep510-kdf-tests/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-jep510-kdf.yml'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/scope/M3RecipeScopeRegistry.java'
      - '.github/workflows/m3-jep510-kdf-materialized.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recipe-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check

      - name: 2 - Compile and prove product plus security-test recipe DAG
        run: >-
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3Jep510KdfBackportRecipeTest,M3Jep510KdfCandidateRecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  a3-preparation:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Prove A3 / recipe dependency closure through the M3 reactor
        run: >-
          mvn -B -ntp
          -f m3/pom.xml
          -pl tooling/a3,tooling/migration-recipes
          -am
          -Dsurefire.failIfNoSpecifiedTests=false
          test

  jdk-security-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Install focused OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev

      - name: Configure Java 21 receiver
        shell: bash
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: Build JDK image
        run: make JOBS=2 images

      - name: RFC 5869 and provider HKDF jtreg
        run: >-
          make JOBS=2 test
          TEST="test/jdk/com/sun/crypto/provider/KDF/HKDFKnownAnswerTests.java
          test/jdk/com/sun/crypto/provider/KDF/HKDFBasicFunctionsTest.java
          test/jdk/com/sun/crypto/provider/KDF/HKDFDelayedPRK.java"

      - name: Delayed-provider synchronization and threading jtreg
        run: >-
          make JOBS=2 test
          TEST="test/jdk/javax/crypto/KDF/KDFDelayedProviderSyncTest.java
          test/jdk/javax/crypto/KDF/KDFDelayedProviderThreadingTest.java"

      - name: Existing JCE provider smoke
        run: >-
          make JOBS=2 test
          TEST="test/jdk/com/sun/crypto/provider/Cipher test/jdk/javax/crypto"

      - name: Candidate tree remains clean after proof
        run: git diff --exit-code --check
