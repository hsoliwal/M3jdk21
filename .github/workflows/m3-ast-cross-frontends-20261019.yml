# SPDX-License-Identifier: Apache-2.0
name: M3 AST Eclipse Maven Gradle Jackson cross-frontends

on:
  push:
    branches:
      - m3/ast-eclipse-maven-gradle-jackson-20261019
  pull_request:
    paths:
      - m3/tooling/module-packs/parser/**
      - .github/workflows/m3-ast-cross-frontends-20261019.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-java21-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict standalone compile using original M3File owner
        shell: bash
        run: |
          set -euo pipefail
          BASE=m3/tooling/module-packs/parser/src
          OUT="$RUNNER_TEMP/m3-ast-classes"
          mkdir -p "$OUT"
          javac --release 21 -Xlint:all -Werror -proc:none -implicit:none -d "$OUT" \
            "$BASE/main/java/jdk/m3/parser/M3File.java" \
            "$BASE/main/java/jdk/m3/parser/M3ASTIndex.java" \
            "$BASE/main/java/jdk/m3/parser/M3ASTIngress.java" \
            "$BASE/test/java/jdk/m3/parser/test/M3CrossFrontendContract.java" \
            "$BASE/test/java/org/eclipse/jdt/core/dom/StructuralPropertyDescriptor.java" \
            "$BASE/test/java/org/eclipse/jdt/core/dom/ASTNode.java" \
            "$BASE/test/java/org/eclipse/jdt/core/dom/CompilationUnit.java" \
            "$BASE/test/java/org/eclipse/jdt/core/dom/NameNode.java" \
            "$BASE/test/java/jdk/m3/jackson/M3ASTAtom.java" \
            "$BASE/test/java/jdk/m3/jackson/M3AST.java"
          mkdir -p m3-ast-proof
          java -ea -cp "$OUT" jdk.m3.parser.test.M3CrossFrontendContract \
            | tee m3-ast-proof/RESULT.txt
          grep '^M3_AST_MULTIFRONTEND_PASS checks=' m3-ast-proof/RESULT.txt
      - name: Confirm parser JMOD and contract admission
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'requires java.xml;' m3/tooling/module-packs/parser/src/main/java/module-info.java
          grep -F 'M3CrossFrontendContract", "M3_AST_MULTIFRONTEND_PASS"' \
            m3/tooling/module-packs/parser/build.py
      - name: Upload proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-ast-cross-frontend-contract
          path: m3-ast-proof/
          retention-days: 14
          if-no-files-found: warn
