name: M3 long range array and JNI mask parity
on:
  push:
    branches:
      - 'm3/long-range-array-state-receiver-20261017'
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3LongRangeSet.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3LongRangeSet*'
      - 'm3/collections/qualification/m3-long-range-arrays-20261017/**'
      - '.github/workflows/m3-long-range-array-state-20261017.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-m3-jni-and-array-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify canonical immutable recipe-generated Java
        shell: bash
        run: |
          set -euo pipefail
          echo '11a1001d54bbd39d25102dab36b9ee7a9125713f8a1496598655f41f9c47652e  m3/collections/src/main/java/jdk/m3/collections/M3LongRangeSet.java' | sha256sum -c -
          echo '420496cf602f3f08f8aef10a9ff73d1e104d7582a19be18d697f1898025595cb  m3/collections/src/test/java/jdk/m3/collections/M3LongRangeSetSelfTest.java' | sha256sum -c -
          echo 'b57500ea01b78f1db7c5deb809758116ec27c99f23d108b04431c3fbdadf6b4d  m3/collections/src/test/java/jdk/m3/collections/M3LongRangeSetTest.java' | sha256sum -c -
      - name: Compile actual Java21 M3 array and mask owners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/range-classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/range-classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3LongLongConsumer.java \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/main/java/jdk/m3/collections/M3LongRangeSet.java \
            m3/collections/src/test/java/jdk/m3/collections/M3LongRangeSetSelfTest.java
          java -ea -Xmx64m -cp "$RUNNER_TEMP/range-classes" jdk.m3.collections.M3LongRangeSetSelfTest
      - name: Compile existing C17 JNI kernel and check real mask selection
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
          java -ea -Xmx64m -Xcheck:jni -Djava.library.path="$RUNNER_TEMP" \
            -cp "$RUNNER_TEMP/range-classes" jdk.m3.collections.M3LongRangeSetSelfTest
      - name: Actual M3 collections Maven/JUnit
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongRangeSetTest test
