name: M3 long range array and JNI mask parity
on:
  push:
    branches:
      - 'm3/long-range-array-state-receiver-20261017'
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRangeSet.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongRangeSet*'
      - 'm3/collections/qualification/m3-long-range-arrays-20261017/**'
      - '.github/workflows/m3-long-range-array-state-20261017.yml'
permissions:
  contents: read
jobs:
  real-m3-jni-and-array-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify canonical immutable recipe-generated Java
        shell: bash
        run: |
          set -euo pipefail
          echo 'f865b006888f1d4554b51cf69e7f4d6bac67458982f957f9151af0b4f09eaec8  m3/collections/src/main/java/com/m3/collections/M3LongRangeSet.java' | sha256sum -c -
          echo '3b4ba4e2542ebbc607710f183f231d7c1bbe3e94ef4aa4fe6de49f0f9242ac29  m3/collections/src/test/java/com/m3/collections/M3LongRangeSetSelfTest.java' | sha256sum -c -
          echo '1768a8be759b46ae24678ce089cdf328ef6c83f335bd3f5582cda813819261a5  m3/collections/src/test/java/com/m3/collections/M3LongRangeSetTest.java' | sha256sum -c -
      - name: Compile actual Java21 M3 array and mask owners
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/range-classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/range-classes" \
            m3/collections/src/main/java/com/m3/collections/M3LongLongConsumer.java \
            m3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/main/java/com/m3/collections/M3LongRangeSet.java \
            m3/collections/src/test/java/com/m3/collections/M3LongRangeSetSelfTest.java
          java -ea -Xmx64m -cp "$RUNNER_TEMP/range-classes" com.m3.collections.M3LongRangeSetSelfTest
      - name: Compile existing C17 JNI kernel and check real mask selection
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
          java -ea -Xmx64m -Xcheck:jni -Djava.library.path="$RUNNER_TEMP" \
            -cp "$RUNNER_TEMP/range-classes" com.m3.collections.M3LongRangeSetSelfTest
      - name: Actual M3 collections Maven/JUnit
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3LongRangeSetTest test
