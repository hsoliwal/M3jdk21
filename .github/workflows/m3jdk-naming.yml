name: M3 JDK naming standard
on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  naming:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Recipe tests (rename, reseal)
        run: |
          python3 -I m3/tooling/jdk-naming/test_jdk_naming.py
          python3 -I m3/tooling/jdk-naming/test_reseal.py
      - name: Recipe fixed point on the tree
        run: |
          python3 -I m3/tooling/jdk-naming/jdk_naming.py plan --tree HEAD --tsv naming-plan.tsv | tee naming-plan.txt
          grep -q 'moves=0 rewrites=0 refusals=0' naming-plan.txt
      - name: JUnit conformance
        run: mvn -B -ntp -f m3/tooling/jdk-naming/conformance/pom.xml test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: naming-plan
          path: naming-plan.tsv
