# SPDX-License-Identifier: GPL-2.0-with-classpath-exception
name: M3 JEP 496 ML-KEM candidate

on:
  push:
    branches:
      - 'm3/materialize-jep496-mlkem-*'
      - 'm3/jep496-*'
    paths:
      - 'src/java.base/share/classes/com/sun/crypto/provider/ML_KEM.java'
      - 'src/java.base/share/classes/com/sun/crypto/provider/ML_KEM_Impls.java'
      - 'src/java.base/share/classes/com/sun/crypto/provider/SunJCE.java'
      - 'src/java.base/share/classes/java/security/spec/NamedParameterSpec.java'
      - 'src/java.base/share/classes/sun/security/provider/SHA3Parallel.java'
      - 'src/java.base/share/classes/sun/security/util/KnownOIDs.java'
      - 'test/jdk/com/sun/crypto/provider/MLKEMProviderSmoke.java'
      - 'test/jdk/sun/security/provider/acvp/MLKEMKnownAnswer.java'
      - 'test/jdk/sun/security/provider/acvp/data/ML-KEM-*/internalProjection.json'
      - 'm3/backports/recipes/j496/**'
      - 'm3/backports/JEP_RESIDUE_QUEUE.tsv'
      - 'm3/backports/test_jep_residue.py'
      - 'm3/tooling/migration-recipes/**'
      - '.github/workflows/m3-jep496-mlkem.yml'
  pull_request:
    paths:
      - 'src/java.base/share/classes/com/sun/crypto/provider/ML_KEM.java'
      - 'src/java.base/share/classes/com/sun/crypto/provider/ML_KEM_Impls.java'
      - 'src/java.base/share/classes/com/sun/crypto/provider/SunJCE.java'
      - 'src/java.base/share/classes/java/security/spec/NamedParameterSpec.java'
      - 'src/java.base/share/classes/sun/security/provider/SHA3Parallel.java'
      - 'src/java.base/share/classes/sun/security/util/KnownOIDs.java'
      - 'test/jdk/com/sun/crypto/provider/MLKEMProviderSmoke.java'
      - 'test/jdk/sun/security/provider/acvp/MLKEMKnownAnswer.java'
      - 'test/jdk/sun/security/provider/acvp/data/ML-KEM-*/internalProjection.json'
      - 'm3/backports/recipes/j496/**'
      - 'm3/backports/JEP_RESIDUE_QUEUE.tsv'
      - 'm3/backports/test_jep_residue.py'
      - 'm3/tooling/migration-recipes/**'
      - '.github/workflows/m3-jep496-mlkem.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-gate:
    if: ${{ !contains(github.event.head_commit.message || '', '[m3-jep496-proofed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Require proven named-key and SHAKE prerequisites
        shell: bash
        run: |
          set -euo pipefail
          named=m3/backports/recipes/jdk-8340327-java21-internal/CURRENT_TREE_RECEIPT.tsv
          shake=m3/backports/recipes/jdk-8338587-shake-xof/CURRENT_TREE_RECEIPT.tsv
          grep -F $'current_tree_state\tCANDIDATE_MATERIALIZED_PROVED' "$named"
          grep -F $'recipe_fixed_point\tPASS' "$named"
          grep -F $'named_key_jtreg\tPASS' "$named"
          grep -F $'promotion\tNOT_AUTHORIZED' "$named"
          grep -F $'current_tree_state\tCANDIDATE_MATERIALIZED_PROVED' "$shake"
          grep -F $'recipe_fixed_point\tPASS' "$shake"
          grep -F $'shake_jtreg\tPASS' "$shake"
          grep -F $'promotion\tNOT_AUTHORIZED' "$shake"

  recipe-proof:
    needs: dependency-gate
    if: ${{ !contains(github.event.head_commit.message || '', '[m3-jep496-proofed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Diff hygiene
        run: git diff --check
      - name: SHAKE and JEP 496 recipe proofs
        run: >-
          mvn -B -ntp
          -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3Jdk8338587ShakeXofBackportRecipeTest,M3Jep496MlKemBackportRecipeTest,M3RecipeScopeDeclarationTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test
      - name: Released JEP residue stays derived
        run: python3 -m unittest m3/backports/test_jep_residue.py

  jdk-proof:
    needs: dependency-gate
    if: ${{ !contains(github.event.head_commit.message || '', '[m3-jep496-proofed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Install focused OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
      - name: Configure Java 21 receiver
        shell: bash
        run: |
          set -euo pipefail
          bash configure             --with-boot-jdk="$JAVA_HOME"             --with-debug-level=release             --with-jvm-variants=server             --disable-warnings-as-errors
      - name: Build JDK image
        run: make JOBS=2 images
      - name: Prove SHAKE prerequisite
        run: >-
          make JOBS=2 test
          TEST="test/jdk/sun/security/provider/MessageDigest/SHAKEXofCompatibility.java"
      - name: Prove FIPS 203 ML-KEM vectors
        run: >-
          make JOBS=2 test
          TEST="test/jdk/sun/security/provider/acvp/MLKEMKnownAnswer.java"
      - name: Prove ML-KEM provider names OIDs and opt-in API constants
        run: >-
          make JOBS=2 test
          TEST="test/jdk/com/sun/crypto/provider/MLKEMProviderSmoke.java"
      - name: Existing KEM API regression
        run: >-
          make JOBS=2 test
          TEST="test/jdk/javax/crypto/KEM/KemTest.java"
      - name: Named-key prerequisite regressions
        run: >-
          make JOBS=2 test
          TEST="test/jdk/sun/security/provider/NamedEdDSA.java test/jdk/sun/security/provider/NamedKeyFactoryTest.java"
      - name: Built image provider smoke
        shell: bash
        run: |
          set -euo pipefail
          JDK="$(find build -type f -path '*/images/jdk/bin/java' -print -quit)"
          test -n "$JDK"
          "$JDK" -version
          "$JDK" --list-modules >/dev/null
      - name: Candidate tree remains clean after proof
        run: |
          git diff --check
          git diff --exit-code

  current-tree-receipt:
    if: ${{ github.event_name == 'push' && !contains(github.event.head_commit.message || '', '[m3-jep496-proofed]') }}
    needs:
      - dependency-gate
      - recipe-proof
      - jdk-proof
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Ratify ML-KEM proof into current-tree receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os

          receipt = Path("m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv")
          dependency = Path("m3/backports/recipes/j496/CURRENT_DEPENDENCY_STATE.tsv")
          updates = {
              "current_tree_state": "CANDIDATE_MATERIALIZED_PROVED",
              "blocking_dependency": "NONE",
              "promotion": "NOT_AUTHORIZED",
              "next_action": "CANONICAL_READBACK_THEN_SECURITY_LIBRARY_API_ACCEPTANCE_REVIEW",
              "recipe_fixed_point": "PASS",
              "openjdk_image_build": "PASS",
              "shake_prerequisite": "PASS",
              "fips203_jtreg": "PASS",
              "provider_oid_api_smoke": "PASS",
              "kem_regression": "PASS",
              "named_key_regression": "PASS",
              "proof_head": os.environ["GITHUB_SHA"],
              "proof_run": os.environ["GITHUB_RUN_ID"],
              "proof_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
          }

          rows = []
          seen = set()
          for line in receipt.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              key, value = line.split("\t", 1)
              if key in updates:
                  value = updates[key]
                  seen.add(key)
              rows.append((key, value))
          for key in (
              "recipe_fixed_point",
              "openjdk_image_build",
              "shake_prerequisite",
              "fips203_jtreg",
              "provider_oid_api_smoke",
              "kem_regression",
              "named_key_regression",
              "proof_head",
              "proof_run",
              "proof_attempt",
          ):
              if key not in seen:
                  rows.append((key, updates[key]))
          receipt.write_text(
              "".join(f"{key}\t{value}\n" for key, value in rows),
              encoding="utf-8")

          dep_rows = []
          for line in dependency.read_text(encoding="utf-8").splitlines():
              if not line:
                  continue
              cells = line.split("\t")
              if cells[0] == "JDK-8338587 SHAKE/XOF":
                  cells[1] = "CANDIDATE_MATERIALIZED_PROVED"
                  cells[3] = "REUSE_PROVEN_CURRENT_PRODUCT"
              elif cells[0] == "JDK-8340327 named-key framework":
                  cells[1] = "CANDIDATE_MATERIALIZED_PROVED"
                  cells[3] = "REUSE_PROVEN_CURRENT_PRODUCT"
              elif cells[0] == "JEP 496 ML-KEM":
                  cells[1] = "CANDIDATE_MATERIALIZED_PROVED"
                  cells[3] = "CANONICAL_READBACK_AND_SECURITY_LIBRARY_API_REVIEW"
              dep_rows.append("\t".join(cells))
          dependency.write_text("\n".join(dep_rows) + "\n", encoding="utf-8")
          PY
          git diff --check
          grep -F $'current_tree_state\tCANDIDATE_MATERIALIZED_PROVED' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
          grep -F $'blocking_dependency\tNONE' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
          grep -F $'fips203_jtreg\tPASS' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
          grep -F $'provider_oid_api_smoke\tPASS' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
          grep -F $'promotion\tNOT_AUTHORIZED' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
      - name: Commit only security proof receipts
        shell: bash
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git add             m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv             m3/backports/recipes/j496/CURRENT_DEPENDENCY_STATE.tsv
          git diff --cached --check
          git config user.name "m3-recipe-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "m3: ratify JEP496 proof [m3-jep496-proofed]"
          git push origin "HEAD:$BRANCH_NAME"

  canonical-readback:
    if: ${{ contains(github.event.head_commit.message || '', '[m3-jep496-proofed]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Re-prove source-bound recipe and non-promoting receipt
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp             -f m3/tooling/migration-recipes/pom.xml             -Dtest=M3Jdk8338587ShakeXofBackportRecipeTest,M3Jep496MlKemBackportRecipeTest,M3RecipeScopeDeclarationTest             -Dsurefire.failIfNoSpecifiedTests=false             test
          grep -F $'current_tree_state\tCANDIDATE_MATERIALIZED_PROVED' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
          grep -F $'blocking_dependency\tNONE' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
          grep -F $'promotion\tNOT_AUTHORIZED' m3/backports/recipes/j496/CURRENT_TREE_RECEIPT.tsv
          git diff --exit-code
          test -z "$(git status --porcelain=v1 -uall)"
