name: M3 JEP 423 FILE-atomic materialization

on:
  push:
    branches:
      - "m3/jep423-file-atomic-materialization-*"
    paths:
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/materialize_generated_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/backports/test_materialize_generated_crates.py"
      - "m3/backports/recipes/jep-423-region-pinning/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-jep423-region-pinning-materialize.yml"
  pull_request:
    paths:
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/generate_recipe_crates.py"
      - "m3/backports/materialize_generated_crates.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/backports/test_generate_recipe_crates.py"
      - "m3/backports/test_materialize_generated_crates.py"
      - "m3/backports/recipes/jep-423-region-pinning/**"
      - "m3/tooling/backport-dag/**"
      - ".github/workflows/m3-jep423-region-pinning-materialize.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generated-file-atom-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check

      - name: 2 - Unit-test delta generator and exact executor
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile             m3/backports/file_delta_inventory.py             m3/backports/generate_recipe_crates.py             m3/backports/materialize_generated_crates.py
          cd m3/backports
          python3 -m unittest -v             test_file_delta_inventory.py             test_generate_recipe_crates.py             test_materialize_generated_crates.py

      - name: 3 - Fetch pinned OpenJDK 21 and 22 GA trees
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             "refs/tags/jdk-21+35:refs/tags/jdk-21+35"             "refs/tags/jdk-22+36:refs/tags/jdk-22+36"
          printf 'UPSTREAM=%s\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: 4 - Prove required JEP423 repair lineage exists in JDK22 GA
        shell: bash
        run: |
          set -euo pipefail
          git -C "$UPSTREAM" grep -n "G1RegionPinCache" jdk-22+36 -- src/hotspot/share/gc/g1
          git -C "$UPSTREAM" show             jdk-22+36:src/hotspot/share/gc/g1/heapRegion.hpp             | grep -E 'size_t.*pin|pin.*size_t'
          git -C "$UPSTREAM" show             jdk-22+36:src/hotspot/share/gc/g1/g1CollectedHeap.inline.hpp             | grep -E 'pin_count_cache|G1RegionPinCache'

      - name: 5 - Generate 57 exact one-file Java text native recipe atoms
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/jep423"
          python3 m3/backports/file_delta_inventory.py             --repo "$UPSTREAM"             --release 22             --out "$RUNNER_TEMP/jep423/JDK21_TO_JDK22.tsv"
          python3 m3/backports/generate_recipe_crates.py             --repo "$UPSTREAM"             --release 22             --paths-file m3/backports/recipes/jep-423-region-pinning/ADMIT_PATHS.txt             --crate-size 1             --include-text             --include-native             --out "$RUNNER_TEMP/jep423/file-atoms"

      - name: 6 - Prove 57-path accounting and preserved deletions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import os
          from pathlib import Path

          selected = [
              line.strip()
              for line in Path("m3/backports/recipes/jep-423-region-pinning/ADMIT_PATHS.txt")
                  .read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          assert len(selected) == 57, len(selected)
          assert len(set(selected)) == 57

          root = Path(os.environ["RUNNER_TEMP"]) / "jep423"
          with (root / "JDK21_TO_JDK22.tsv").open(encoding="utf-8", newline="") as handle:
              delta = {
                  row["path"]: row["status"]
                  for row in csv.DictReader(handle, delimiter="\t")
                  if row["path"] in set(selected)
              }
          assert set(delta) == set(selected), sorted(set(selected) - set(delta))
          same = {path for path, status in delta.items() if status == "SAME"}

          with (root / "file-atoms" / "CRATES.tsv").open(encoding="utf-8", newline="") as handle:
              crates = list(csv.DictReader(handle, delimiter="\t"))
          assert crates, "no generated JEP423 crates"
          assert all(int(row["target_count"]) == 1 for row in crates), crates
          generated = sum(int(row["target_count"]) for row in crates)

          with (root / "file-atoms" / "EXCLUSIONS.tsv").open(encoding="utf-8", newline="") as handle:
              exclusions = list(csv.DictReader(handle, delimiter="\t"))
          if exclusions:
              raise SystemExit(f"JEP423 typed exclusions require review: {exclusions}")

          if generated + len(same) != 57:
              raise SystemExit(
                  f"JEP423 accounting mismatch generated={generated} same={len(same)} selected=57"
              )

          preserved = {
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/TestJNIBlockFullGC.java",
              "test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/libTestJNIBlockFullGC.c",
          }
          for path in preserved:
              if delta.get(path) is not None:
                  raise SystemExit(f"preserved deletion escaped admitted path set: {path}")

          print(f"JEP423_ACCOUNTED generated={generated} same={len(same)} exclusions=0")
          PY

      - name: 7 - Validate canonical JEP423 recipe DAG
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml             -Dexec.mainClass=com.m3.tooling.dag.M3BackportPacketMain             -Dexec.args="$PWD/m3/backports/recipes/jep-423-region-pinning/packet.tsv $PWD/m3/backports/recipes/jep-423-region-pinning/atom-evidence.tsv"             exec:java

      - name: 8 - Verify current-tree preimages before mutation
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode check             --require-one-target-per-crate             --receipt "$RUNNER_TEMP/jep423/preimage.tsv"
          test -z "$(git status --porcelain=v1 -uall)"

      - name: 9 - Materialize candidate and prove fixed point
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode apply             --require-one-target-per-crate             --receipt "$RUNNER_TEMP/jep423/apply.tsv"
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode verify-post             --require-one-target-per-crate             --receipt "$RUNNER_TEMP/jep423/postimage.tsv"
          git diff --check
          before="$(git diff --binary | sha256sum | awk '{print $1}')"
          python3 m3/backports/materialize_generated_crates.py             --root "$PWD"             --generated "$RUNNER_TEMP/jep423/file-atoms"             --mode apply             --require-one-target-per-crate
          after="$(git diff --binary | sha256sum | awk '{print $1}')"
          test "$before" = "$after"

      - name: 10 - Prove only generated crate targets changed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          import subprocess

          generated = Path(os.environ["RUNNER_TEMP"]) / "jep423" / "file-atoms"
          expected = set()
          for root in (
              generated / "src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned",
              generated / "src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text",
          ):
              if not root.exists():
                  continue
              for manifest in root.glob("*/manifest.tsv"):
                  for line in manifest.read_text(encoding="utf-8").splitlines():
                      if line and not line.startswith("#"):
                          expected.add(line.split("\t", 1)[0])

          status = subprocess.check_output(
              ["git", "status", "--porcelain=v1", "-uall"], text=True
          )
          actual = {line[3:] for line in status.splitlines() if line}
          if actual != expected:
              raise SystemExit(
                  "JEP423 changed-path fence failed\n"
                  f"expected={sorted(expected)}\nactual={sorted(actual)}"
              )
          print(f"JEP423_CHANGED_PATHS {len(actual)}")
          PY

      - name: 11 - Install OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: 12 - Configure fastdebug JDK
        shell: bash
        run: |
          set -euo pipefail
          bash configure             --with-boot-jdk="$JAVA_HOME"             --with-debug-level=fastdebug             --with-jvm-variants=server             --disable-warnings-as-errors

      - name: 13 - Build JDK image
        run: make JOBS=2 images

      - name: 14 - Run JEP423 pinned-object and G1 regressions
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="          test/hotspot/jtreg/gc/g1/pinnedobjs           test/hotspot/jtreg/gc/g1/plab/TestPLABEvacuationFailure.java           test/hotspot/jtreg/gc/g1/TestEvacuationFailure.java           test/hotspot/jtreg/gc/g1/TestGCLogMessages.java           test/hotspot/jtreg/gc/stress/gclocker/TestExcessGCLockerCollections.java           test/hotspot/jtreg/gc/stress/TestJNIBlockFullGC/TestJNIBlockFullGC.java"

      - name: 15 - Run JFR and WhiteBox consistency regressions
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="          test/jdk/jdk/jfr/event/gc/collection/TestG1ParallelPhases.java           test/jdk/jdk/jfr/event/gc/collection/TestGCCauseWithG1ConcurrentMark.java           test/jdk/jdk/jfr/event/gc/collection/TestGCCauseWithG1FullCollection.java           test/jdk/jdk/jfr/event/gc/detailed/TestGCLockerEvent.java"

      - name: 16 - Upload generated crates and proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jep423-file-atom-proof-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/jep423
            build/*/test-results/**
          if-no-files-found: warn
          retention-days: 30
