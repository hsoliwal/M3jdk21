# SPDX-License-Identifier: Apache-2.0
name: M3 regex workspace receiver
on:
  pull_request:
    paths:
      - 'test/jdk/java/util/regex/M3RegexWorkspaceContractTest.java'
      - 'm3/runtime-integration/REGEX_WORKSPACE_RECEIVER_20261014.md'
      - '.github/workflows/m3-regex-workspace-receiver-20261014.yml'
jobs:
  host-jdk-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile exact jtreg source on host JDK21
        run: javac --release 21 -Xlint:all -Werror -d "${RUNNER_TEMP}/m3-regex" test/jdk/java/util/regex/M3RegexWorkspaceContractTest.java
      - name: Reference JDK matcher contract
        run: java -Xcheck:jni -cp "${RUNNER_TEMP}/m3-regex" M3RegexWorkspaceContractTest
      - name: Interpreter reference JDK matcher contract
        run: java -Xint -Xcheck:jni -cp "${RUNNER_TEMP}/m3-regex" M3RegexWorkspaceContractTest
