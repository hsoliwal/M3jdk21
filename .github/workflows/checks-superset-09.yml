            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongArrayList.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongArrayDeque.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexMaskCompactor.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongAddressKernel.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3IndexPathMasks.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongIndexProjection.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongBitmapFilteredSnapshot.java \
            src/jdk.m3.collections/share/classes/jdk/m3/collections/M3StateMaskArrays.java \
            test/jdk/jdk/m3/collections/M3LongIndexProjectionSelfTest.java \
            test/jdk/jdk/m3/collections/M3LongBitmapFilteredSnapshotSelfTest.java \
            test/jdk/jdk/m3/collections/M3StateMaskArraysSelfTest.java \
            test/jdk/jdk/m3/collections/M3IndexMaskCompactorSelfTest.java
      - name: Run Java differential and metamorphic owners
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/primitive-indexed-collections"
          run_contracts() {
          java "$@" -cp "$OUT/classes" jdk.m3.collections.M3LongIndexProjectionSelfTest > "$OUT/M3LongIndexProjectionSelfTest.log" 2>&1
          grep -Fq 'PASS M3LongIndexProjectionSelfTest checks=' "$OUT/M3LongIndexProjectionSelfTest.log"
          cat "$OUT/M3LongIndexProjectionSelfTest.log"
          java "$@" -cp "$OUT/classes" jdk.m3.collections.M3LongBitmapFilteredSnapshotSelfTest > "$OUT/M3LongBitmapFilteredSnapshotSelfTest.log" 2>&1
          grep -Fq 'PASS M3LongBitmapFilteredSnapshotSelfTest checks=' "$OUT/M3LongBitmapFilteredSnapshotSelfTest.log"
          cat "$OUT/M3LongBitmapFilteredSnapshotSelfTest.log"
          java "$@" -cp "$OUT/classes" jdk.m3.collections.M3StateMaskArraysSelfTest > "$OUT/M3StateMaskArraysSelfTest.log" 2>&1
          grep -Fq 'PASS M3StateMaskArrays checks=' "$OUT/M3StateMaskArraysSelfTest.log"
          cat "$OUT/M3StateMaskArraysSelfTest.log"
          }
          run_contracts
          run_contracts -Xint
          java -cp "$OUT/classes" jdk.m3.collections.M3IndexMaskCompactorSelfTest \
            > "$OUT/M3IndexMaskCompactorSelfTest.log" 2>&1
          grep -Fq 'PASS M3IndexMaskCompactorSelfTest checks=' "$OUT/M3IndexMaskCompactorSelfTest.log"
          cat "$OUT/M3IndexMaskCompactorSelfTest.log"
      - name: Compile and require original JNI mask selection parity
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/primitive-indexed-collections"
          cc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            src/jdk.m3.collections/share/native/libm3collections/collections/m3_index_mask_compactor.c \
            -o "$OUT/native/libm3_collections_mask.so"
          test -s "$OUT/native/libm3_collections_mask.so"
          export LD_LIBRARY_PATH="$OUT/native:${LD_LIBRARY_PATH:-}"
          for cls in jdk.m3.collections.M3LongIndexProjectionSelfTest jdk.m3.collections.M3LongBitmapFilteredSnapshotSelfTest jdk.m3.collections.M3StateMaskArraysSelfTest; do
            java -Xcheck:jni -Djava.library.path="$OUT/native" -cp "$OUT/classes" "$cls" \
              > "$OUT/native-${cls##*.}.log" 2>&1
            grep -Eq 'PASS M3LongIndexProjectionSelfTest checks=|PASS M3LongBitmapFilteredSnapshotSelfTest checks=|PASS M3StateMaskArrays checks=' "$OUT/native-${cls##*.}.log"
            cat "$OUT/native-${cls##*.}.log"
          done
          # The existing first-party oracle requires successful native admission:
          # a Java-only fallback MUST NOT satisfy this qualification gate.
          java -Xcheck:jni -Djava.library.path="$OUT/native" -cp "$OUT/classes" \
            jdk.m3.collections.M3IndexMaskCompactorSelfTest --native \
            > "$OUT/native-required.log" 2>&1
          grep -Fq 'PASS M3IndexMaskCompactorSelfTest checks=' "$OUT/native-required.log"
          cat "$OUT/native-required.log"

