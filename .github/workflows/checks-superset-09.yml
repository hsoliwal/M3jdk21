        with:
          distribution: temurin
          java-version: '21'
      - name: Verify all four original Synexia recipe postimage SHA-256 values
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' 'bd06a2d6c5a0df86fc402be506c0eb6a6656fa9e8ea93c1f49b906152358464f' 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3LongArrayList.java' | sha256sum -c -
          printf '%s  %s\n' '6c21752b4a73bc110a5f6b7aebc808d216e5df157cd67f0542065627cc88cefc' 'src/jdk.m3.collections/share/classes/jdk/m3/collections/M3StateMaskArrays.java' | sha256sum -c -
          printf '%s  %s\n' '1b1507df4fb800ed6ce450512371982c80bae357f1b5d9ddafb5de077c23d4e3' 'test/jdk/jdk/m3/collections/M3ZeroMaskArrayFastPathProof.java' | sha256sum -c -
          printf '%s  %s\n' '8b5398e9bf1d649ba0618338ccfc98d9785d586cc0dc61157c66b5ce2e1bdaf5' 'test/jdk/jdk/m3/collections/M3ZeroMaskArrayFastPathTest.java' | sha256sum -c -
          echo M3_ZERO_MASK_TARGET_SOURCE_SEAL_PASS
      - name: Compile actual full M3 module tests and compare public JVM descriptors
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests test-compile
          B="$(mktemp -d)"
          trap 'rm -rf "$B"' EXIT
          mkdir -p "$B/original/jdk/m3/collections" "$B/old-classes"
          for name in M3LongArrayList M3StateMaskArrays; do
            path="src/jdk.m3.collections/share/classes/jdk/m3/collections/${name}.java"
            git show '4e29dc9d4141261e8763fbe9ffd6a20e017b1aff':"$path" > "$B/original/jdk/m3/collections/${name}.java"
          done
          javac --release 21 -proc:none -Xlint:all -Werror \
            -cp m3/collections/target/classes \
            -d "$B/old-classes" "$B/original/jdk/m3/collections/"*.java
          for name in M3LongArrayList M3StateMaskArrays; do
            javap -public -s -classpath "$B/old-classes" jdk.m3.collections."$name" > "$B/${name}.before"
            javap -public -s -classpath m3/collections/target/classes jdk.m3.collections."$name" > "$B/${name}.after"
            diff -u "$B/${name}.before" "$B/${name}.after"
          done
          # The old and new code must pass the same independent behavioral oracle.
          java -ea -Xmx384m \
            -cp "$B/old-classes:m3/collections/target/classes:m3/collections/target/test-classes" \
            jdk.m3.collections.M3ZeroMaskArrayFastPathProof
          java -ea -Xmx384m \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            jdk.m3.collections.M3ZeroMaskArrayFastPathProof
          java -Xint -ea -Xmx384m \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            jdk.m3.collections.M3ZeroMaskArrayFastPathProof
          git diff --check '4e29dc9d4141261e8763fbe9ffd6a20e017b1aff' HEAD
      - name: Preserve exact scope and existing native ABI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --name-only '4e29dc9d4141261e8763fbe9ffd6a20e017b1aff' HEAD | \
             grep -E '(^src/java\.base/|^src/hotspot/|\.(c|cc|cpp|h)$)'; then
            echo 'Unexpected JDK/HotSpot/native source mutation'
            exit 1
          fi

