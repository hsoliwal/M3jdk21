name: M3 filtered view late-bind union Java21 and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongFilteredView.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongFilteredViewUnion*.java'
      - 'm3/collections/qualification/filtered-view-late-union-postimages-20261017.tsv'
      - '.github/workflows/m3-filtered-view-late-union-20261017.yml'
  push:
    branches: [m3/filtered-view-late-bind-union-20261017]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-module-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify all inherited and newly received source identities
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/collections/qualification/verify_mask_selection.py
          python3 m3/collections/qualification/verify_mask_keyed.py
          python3 m3/collections/qualification/verify_mask_priority.py
          python3 m3/collections/qualification/verify_filtered_sorted.py
          python3 m3/collections/qualification/verify_filtered_view_late_union.py
      - name: Compile every current M3 primitive collection owner and run real Java21 oracles
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-filtered-union
          find m3/collections/src/main/java/com/m3/collections -name '*.java' -print | sort > /tmp/m3-union-core-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror             -d /tmp/m3-filtered-union @/tmp/m3-union-core-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror             -cp /tmp/m3-filtered-union -d /tmp/m3-filtered-union             m3/collections/src/test/java/com/m3/collections/M3LongFilteredViewUnionSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3FilteredSortedCompositionSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskKeyedSelfTest.java             m3/collections/src/test/java/com/m3/collections/M3IndexMaskPrioritySelfTest.java
          java -Xcheck:jni -cp /tmp/m3-filtered-union com.m3.collections.M3LongFilteredViewUnionSelfTest
          java -Xcheck:jni -cp /tmp/m3-filtered-union com.m3.collections.M3FilteredSortedCompositionSelfTest
          java -Xcheck:jni -cp /tmp/m3-filtered-union com.m3.collections.M3IndexMaskCompactorSelfTest
          java -Xcheck:jni -cp /tmp/m3-filtered-union com.m3.collections.M3IndexMaskKeyedSelfTest
          java -Xcheck:jni -cp /tmp/m3-filtered-union com.m3.collections.M3IndexMaskPrioritySelfTest
      - name: Rebuild and call the existing target C17 native mask kernel
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror             -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_mask_compactor.c             -o /tmp/libm3_collections_mask.so
          java -Xcheck:jni -Djava.library.path=/tmp -cp /tmp/m3-filtered-union             com.m3.collections.M3IndexMaskCompactorSelfTest --native
