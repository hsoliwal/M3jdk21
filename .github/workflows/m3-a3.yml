name: M3 A3 absorption proof

on:
  push:
    branches:
      - master
      - "m3/**"
    paths:
      - "m3/tooling/migration-recipes/**"
      - "m3/backports/JEP_CATALOGUE.tsv"
      - "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv"
      - "m3/backports/COMMUNITY_CAPABILITY_CANDIDATES.tsv"
      - "m3/backports/ALGORITHM_CATALOGUE.tsv"
      - "m3/docs/a3.md"
      - "m3/docs/a3-lab.md"
      - "m3/docs/a3-alg.md"
      - "m3/docs/atom-pattern-admission-and-tooling-boundary.md"
      - "m3/pom.xml"
      - ".github/workflows/m3-a3.yml"
  pull_request:
    paths:
      - "m3/tooling/migration-recipes/**"
      - "m3/backports/JEP_CATALOGUE.tsv"
      - "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv"
      - "m3/backports/COMMUNITY_CAPABILITY_CANDIDATES.tsv"
      - "m3/backports/ALGORITHM_CATALOGUE.tsv"
      - "m3/docs/a3.md"
      - "m3/docs/a3-lab.md"
      - "m3/docs/a3-alg.md"
      - "m3/docs/atom-pattern-admission-and-tooling-boundary.md"
      - "m3/pom.xml"
      - ".github/workflows/m3-a3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a3-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Fetch exact workflow head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          curl --fail --location --retry 3             "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}"             -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"

      - name: Prepare pinned JDK 21
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz'             -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n'             '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6'             "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"

      # Standalone (2026-10-31): the A3 recipe export is absorbed. Its eight manifest-listed
      # sources, the export manifest and the export's seven unit tests are byte-identical under
      # m3/vendor/ (provenance: m3/vendor/m3/README.md); the reactor module
      # tooling/m3jdk-a3-recipes builds them into the same coordinate in the reactor step
      # below (-am) and runs the tests in its own step. No other repository is fetched
      # (decisions: m3/tooling/standalone/M3_REFS.tsv).
      - name: Verify absorbed A3 recipe export closure
        shell: bash
        run: |
          set -euo pipefail
          cd "$REPO/m3/vendor/m3/m3-openrewrite-recipes"
          sha256sum --check --strict - <<'CLOSURE'
          69104cee94e06e9d87aadac208140eddf585e0404385e9ee7ca40bc635a8eeba  src/main/java/jdk/internal/m3/rewrite/M3RecipeMasteryPortableReceipt.java
          4367a662ef19efd9193934778dae9ef6a58c31f45e76e9c8f3607e6f7dfa962e  src/main/java/jdk/internal/m3/rewrite/atom/M3AtomizePureIntReturnRecipe.java
          c8b90be60cace5aba0e00d438be09cb6348273a8229adf7b5df490a5c3ec6a50  src/main/java/jdk/internal/m3/rewrite/atom/M3DocumentPureIntAtomRecipe.java
          3f11b266e4bf7bb9a08cf43f6692ce3209f310059462dfe70eca56048809b01f  src/main/java/jdk/internal/m3/rewrite/atom/M3FileAtomCandidateTable.java
          923f15cef4b6b0ecc575cf1ad95a1fac3607f77bb111b9b87bd924b76d4b2c06  src/main/java/jdk/internal/m3/rewrite/atom/M3InventoryPureIntAtomCandidates.java
          eabca39453edaebc5b7f0e9aaaf12b900ba181e21dc5c8a08640abc7f0d0b6f7  src/main/java/jdk/internal/m3/rewrite/atom/M3PatternizePureIntAtomRecipe.java
          32b98c2eafaa8e4231dcded464a88f1560cebc71fb39d5d28934482af61b0043  src/main/java/jdk/internal/m3/rewrite/atom/M3PureIntAtomEligibility.java
          a6587bcc76d05b006757f8ded6da2c7d46bb23b521e2030b8b9d657b6a31cdf8  src/main/java/jdk/internal/m3/rewrite/atom/M3PureIntConvergenceRecipe.java
          2470fa652697645b0895b42eeca8c75e8df79e8f8637210a82bb2b20f4759303  src/main/resources/META-INF/m3/jdk-a3-recipe-export.tsv
          b2cceacde86886a6339ff1df9dcfb267bee589e23e800864b5507dea603a1f72  src/test/java/jdk/internal/m3/rewrite/M3JdkA3RecipeExportTest.java
          120e5cf7fa921edfdd4da13d755af70b47d8d6d0adc4fef70233a42a7d3250a5  src/test/java/jdk/internal/m3/rewrite/M3RecipeMasteryPortableReceiptTest.java
          01916ea53538347cbd5e582626ae665825f94cdeda75de272318f58f2bd10c40  src/test/java/jdk/internal/m3/rewrite/atom/M3AtomCoverageClosureTest.java
          b3f9036517edf1bdda2859cbb82dc7b1d56521bac1f00e9466bc160e2391a7f0  src/test/java/jdk/internal/m3/rewrite/atom/M3AtomDefensiveBranchTest.java
          348f31279d286d0925fea94b504e782e36aee39ca84269de068be26493dcc542  src/test/java/jdk/internal/m3/rewrite/atom/M3AtomizePureIntReturnRecipeTest.java
          77c27fefd1b1a27dbd3234b10466b5017f123d424777f5ee0cba0f7b2bf4bf37  src/test/java/jdk/internal/m3/rewrite/atom/M3InventoryPureIntAtomCandidatesTest.java
          0c235f23a2c6c7cd2eb3c5d81ea9bf7002a23a69bc1ada5dd1e3fd5acfb57160  src/test/java/jdk/internal/m3/rewrite/atom/M3PureIntConvergenceRecipeTest.java
          CLOSURE

      - name: Bootstrap pinned source-built OpenRewrite and JUnit closure
        shell: bash
        run: |
          set -euo pipefail
          bash "$REPO/m3/m3-import/pure-int-recipe-custody/install.sh" "$REPO" --dependencies-only

      - name: Compile and install retained A3 recipe dependencies
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          # The shared migration-recipes module currently has independent String/LST
          # regression failures. Compile/install its exact sources without converting
          # those unrelated tests into an A3Lab verdict.
          mvn -B -ntp -f "$REPO/m3/pom.xml" \
            -pl tooling/m3jdk-a3-recipes -am -DskipTests install

      - name: Run absorbed A3 export unit tests
        shell: bash
        run: |
          set -euo pipefail
          # The reactor step above skips tests. The export's own unit tests run here against
          # the absorbed sources; one method is a recorded HOLD (surefire-hold-excludes.txt).
          mvn -B -ntp -f "$REPO/m3/pom.xml" -pl tooling/m3jdk-a3-recipes test
