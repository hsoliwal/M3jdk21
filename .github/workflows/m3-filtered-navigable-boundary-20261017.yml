# SPDX-License-Identifier: Apache-2.0
name: M3 filtered NavigableSet bounded navigation Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredNavigableSet.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3NavigableBoundaryProof.java'
      - 'm3/collections/wrappers/navigable-bounds-20261017/**'
      - 'm3/collections/algorithm-catalog/order-statistics.tsv'
      - '.github/workflows/m3-filtered-navigable-boundary-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipe-and-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven recipe fixed point, refusal, receiver compile and differential oracle
        run: mvn -B -ntp -f m3/collections/wrappers/navigable-bounds-20261017/pom.xml verify
      - name: Check source unchanged by default recipe verification
        run: git diff --exit-code -- m3/collections/src/main/java/com/m3/collections/M3FilteredNavigableSet.java
