name: M3 Tornado Bulk Compiler Repair

on:
  pull_request:
    paths:
      - 'm3/ports/tornadovm-bulk/pom.xml'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3TornadoBulkCompilerRepairReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3TornadoBulkCompilerRepairReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/m3-tornado-bulk-compiler-20261014/**'
      - 'm3/tooling/migration-recipes/tasks/tornado-bulk-compiler-20261014/**'
      - '.github/workflows/m3-tornado-bulk-compiler-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-pom-contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Verify exact pre/post image and unchanged contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import xml.etree.ElementTree as ET

          root = Path("m3/tooling/migration-recipes/src/main/resources/"
                      "com/m3/rewrite/backport/jdk21-hash-pinned-text/"
                      "m3-tornado-bulk-compiler-20261014")
          path, before_sha, after_sha, resource = root.joinpath("manifest.tsv").read_text().strip().split("\t")
          before = root.joinpath("before-pom.xml.txt").read_bytes()
          after = root.joinpath(resource).read_bytes()
          actual = Path(path).read_bytes()
          assert sha256(before).hexdigest() == before_sha
          assert sha256(after).hexdigest() == after_sha
          assert actual == after, "target differs from the sealed canonical recipe resource"
          before_text = before.decode("utf-8")
          expected = before_text.replace(
              "<artifactId>maven-compiler-plugin</artifactId>\n        <version>3.13.0</version>",
              "<artifactId>maven-compiler-plugin</artifactId>\n        <version>3.15.0</version>")
          expected = expected.replace(
              "<source>21</source>\n          <target>21</target>\n          <enablePreview>true</enablePreview>",
              "<source>21</source>\n          <target>21</target>\n          <proc>none</proc>\n          <fork>true</fork>\n          <enablePreview>true</enablePreview>")
          assert expected.encode("utf-8") == actual, "unreviewed POM modifications"
          tree = ET.fromstring(actual)
          ns = {"m": "http://maven.apache.org/POM/4.0.0"}
          plugins = tree.findall(".//m:plugin", ns)
          compiler = [p for p in plugins if p.findtext("m:artifactId", namespaces=ns) == "maven-compiler-plugin"]
          assert len(compiler) == 1
          p = compiler[0]
          assert p.findtext("m:version", namespaces=ns) == "3.15.0"
          config = p.find("m:configuration", ns)
          for tag,value in {"source":"21","target":"21","fork":"true",
                            "proc":"none","enablePreview":"true"}.items():
              assert config.findtext("m:"+tag, namespaces=ns) == value
          names = [x.text for x in tree.findall("./m:profiles/m:profile/m:id",ns)]
          assert "m3-synexia-atom-pattern" in names
          assert "m3-synexia-atom-pattern-mastery" in names
          print("PASS: exact POM sha256, contract delta, XML parse, preview and both recipe profiles")
          PY

  recipe-fixed-point:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Install source-built OpenRewrite and JUnit runtime
        run: >-
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl rewrite-java-21,rewrite-test,junit-jupiter-5.10.2,junit-platform-launcher-1.10.2
          -am -DskipTests install
      - name: Validate canonical source rewrite and install custody
        run: |
          python3 -S m3/synexia-import/pure-int-recipe-custody/verify-source-rewrite-coordinate.py
          bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - name: Compile and test exact receiver
        run: >-
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3TornadoBulkCompilerRepairReceiverRecipeTest test
      - name: Install receiver recipe artifact
        run: mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml -DskipTests install
      - name: Verify OpenRewrite fixed point
        run: >-
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Drewrite.recipeArtifactCoordinates=com.m3.tooling:migration-recipes:0.1.0-SNAPSHOT
          -Drewrite.activeRecipes=com.m3.rewrite.backport.M3TornadoBulkCompilerRepairReceiverRecipe
          rewrite:dryRun
