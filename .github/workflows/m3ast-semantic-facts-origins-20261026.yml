# SPDX-License-Identifier: Apache-2.0
name: M3 AST typed facts and source origins Java 21
on:
  pull_request:
    paths:
      - 'm3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTFacts.java'
      - 'm3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTSourceOrigins.java'
      - 'm3/tooling/module-packs/parser/src/test/java/jdk/m3/parser/test/M3ASTFactsContract.java'
      - 'm3/tooling/module-packs/parser/src/test/java/jdk/m3/parser/test/M3ASTSourceOriginsContract.java'
      - 'm3/tooling/module-packs/parser/build.py'
      - '.github/workflows/m3ast-semantic-facts-origins-20261026.yml'
  workflow_dispatch:
jobs:
  strict-original-java21:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original owners and execute both source contracts
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/m3-ast-facts"
          mkdir -p "$classes"
          root=m3/tooling/module-packs/parser/src
          javac --release 21 -Xlint:all -Werror -d "$classes" \
            "$root/main/java/jdk/m3/parser/M3File.java" \
            "$root/main/java/jdk/m3/parser/M3ASTIndex.java" \
            "$root/main/java/jdk/m3/parser/M3ASTFacts.java" \
            "$root/main/java/jdk/m3/parser/M3ASTSourceOrigins.java" \
            "$root/test/java/jdk/m3/parser/test/M3ASTFactsContract.java" \
            "$root/test/java/jdk/m3/parser/test/M3ASTSourceOriginsContract.java"
          java -cp "$classes" jdk.m3.parser.test.M3ASTFactsContract
          java -cp "$classes" jdk.m3.parser.test.M3ASTSourceOriginsContract
