          import pathlib,xml.etree.ElementTree as ET
          root=pathlib.Path('m3/collections/recipes/native-index-range-20261017/target/surefire-reports')
          suites=[ET.parse(p).getroot() for p in root.glob('TEST-*.xml')]
          assert sum(int(s.get('tests','0')) for s in suites)==5, 'expected four SDK tests and one product test'
          assert all(int(s.get(k,'0'))==0 for s in suites for k in ['errors','failures','skipped'])
