# SPDX-License-Identifier: Apache-2.0
# Canonical Synexia LC315 primitive inversion-count source; product owner M3JDK21.
name: M3JDK21 LC315 count-smaller JNI Java21

on:
  pull_request:
    paths:
      - '.github/workflows/m3-lc315-count-smaller-jni-java21.yml'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRankIndex.java'
      - 'm3/collections/src/main/native/collections/m3_long_rank_batch_jni.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongCountSmallerRightContract.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongCountSmallerRightTest.java'
      - 'm3/collections/qualification/lc315-count-smaller-20261026/**'

permissions:
  contents: read

jobs:
  original-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind original product sources to exact reviewed postimage and PR head
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java)" = '7871ab51e2ec8c3e4fb990817f5fbdb7ec9845cb'
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3LongRankIndex.java)" = 'ce7f53f1a4c69c9f5a990f26944519b1194dfe6e'
          test "$(git hash-object m3/collections/src/main/native/collections/m3_long_rank_batch_jni.c)" = '442630c291ce9ba4c9c4490dca4076e7f09558c3'
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3LongCountSmallerRightContract.java)" = '90995dfabb36d7d3dc639867270f91723de2b8da'
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3LongCountSmallerRightTest.java)" = 'ce53d077c93db272d9fdaa510bb61e8e22f9e5b9'
      - name: Strict compile original Java21 owner and independent quadratic oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-lc315/classes" "$RUNNER_TEMP/m3-lc315/native" "$RUNNER_TEMP/m3-lc315/legacy"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/m3-lc315/classes" \
            m3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java \
            m3/collections/src/test/java/com/m3/collections/M3LongCountSmallerRightContract.java
      - name: Build original C17 JNI owner with UBSan and strict compiler warnings
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_long_rank_batch_jni.c \
            -o "$RUNNER_TEMP/m3-lc315/native/libm3rankbatch.so"
          nm -D "$RUNNER_TEMP/m3-lc315/native/libm3rankbatch.so" | grep -q 'Java_com_m3_collections_M3LongRankBatchNative_countSmallerRight0'
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/test/native/legacy_m3rankbatch.c \
            -o "$RUNNER_TEMP/m3-lc315/legacy/libm3rankbatch.so"
      - name: Java, native, interpreted, legacy-ABI and missing-native parity
        shell: bash
        run: |
          set -euo pipefail
          base="com.m3.collections.M3LongCountSmallerRightContract"
          classes="$RUNNER_TEMP/m3-lc315/classes"
          java -ea -cp "$classes" "$base" | tee "$RUNNER_TEMP/m3-lc315/java.txt"
          grep -Fxq 'PASS M3_LC315_COUNT_SMALLER mode=java checks=2864' "$RUNNER_TEMP/m3-lc315/java.txt"
          java -Xcheck:jni -ea \
            -Djava.library.path="$RUNNER_TEMP/m3-lc315/native" \
            -Dm3.collections.rank.native=true -cp "$classes" "$base" --native \
            | tee "$RUNNER_TEMP/m3-lc315/native.txt"
          grep -Fxq 'PASS M3_LC315_COUNT_SMALLER mode=native checks=4296' "$RUNNER_TEMP/m3-lc315/native.txt"
          java -Xint -Xcheck:jni -ea \
            -Djava.library.path="$RUNNER_TEMP/m3-lc315/native" \
            -Dm3.collections.rank.native=true -cp "$classes" "$base" --native \
            | tee "$RUNNER_TEMP/m3-lc315/interpreted.txt"
          cmp "$RUNNER_TEMP/m3-lc315/native.txt" "$RUNNER_TEMP/m3-lc315/interpreted.txt"
          java -Xcheck:jni -ea \
            -Djava.library.path="$RUNNER_TEMP/m3-lc315/legacy" \
            -Dm3.collections.rank.native=true -cp "$classes" "$base" --old-native \
            | tee "$RUNNER_TEMP/m3-lc315/legacy.txt"
          grep -Fxq 'PASS M3_LC315_COUNT_SMALLER mode=old-native checks=2865' "$RUNNER_TEMP/m3-lc315/legacy.txt"
          java -ea -Djava.library.path="$RUNNER_TEMP/m3-lc315/absent" \
            -Dm3.collections.rank.native=true -cp "$classes" "$base" --missing-native \
            | tee "$RUNNER_TEMP/m3-lc315/missing.txt"
          grep -Fxq 'PASS M3_LC315_COUNT_SMALLER mode=missing-native checks=2865' "$RUNNER_TEMP/m3-lc315/missing.txt"
      - name: Preserve executable CI receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3-lc315-jni-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-lc315/*.txt
          if-no-files-found: warn
          retention-days: 14
