name: M3 Synexia public-target policy

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "doc/m3/name-mapping.json"
      - "doc/m3/m3jdk21-porting-invariant.md"
      - "doc/m3/M3_CONVERGENCE_MODEL.md"
      - "make/m3/compatibility/m3-public-target-policy.tsv"
      - "make/m3/compatibility/m3-apache-handoff-pin.tsv"
      - "make/m3/compatibility/check_m3_public_target.py"
      - "make/m3/compatibility/test_m3_public_target_policy.py"
      - "doc/m3/m3-mindex-precompute-inventory.tsv"
      - "doc/m3/m3-full-family-catalogue.json"
      - "make/m3/compatibility/test_m3_full_family.py"
      - "make/m3/compatibility/check_m3_full_family.py"
      - "make/m3/compatibility/m3-full-family-pin.tsv"
      - "src/java.base/share/legal/synexia.md"
      - ".github/workflows/m3-public-target-policy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile validators
        run: |
          python3 -m compileall -q \
            make/m3/compatibility/check_m3_public_target.py \
            make/m3/compatibility/test_m3_public_target_policy.py \
            make/m3/compatibility/check_m3_full_family.py \
            make/m3/compatibility/test_m3_full_family.py

      - name: Validate checked-in policy
        run: python3 make/m3/compatibility/check_m3_public_target.py

      - name: Validate full-family Synexia ownership pin
        run: python3 make/m3/compatibility/check_m3_full_family.py

      - name: Run policy tests
        working-directory: make/m3/compatibility
        run: |
          python3 -m unittest -v \
            test_m3_public_target_policy.py \
            test_m3_full_family.py

      - name: Verify java.base legal anchor
        run: |
          set -euo pipefail
          grep -F "First-party and independently authored Synexia components admitted into M3JDK21 retain their" src/java.base/share/legal/synexia.md
          grep -F "Apache-2.0 identity" src/java.base/share/legal/synexia.md
