# SPDX-License-Identifier: Apache-2.0
name: M3SDK JMOD Receiver Proof

on:
  pull_request:
    paths:
      - 'm3/tooling/jmod-recipes/**'
      - 'm3/vendor/third_party-m3/**'
      - 'm3/tooling/module-packs/nlp-search/**'
      - 'm3/tooling/module-packs/text-tools/**'
      - 'm3/tooling/module-packs/jackson/**'
      - 'm3/vendor/third_party/jackson-annotations-2.19.2/**'
      - 'm3/vendor/third_party/jackson-core-2.19.2/**'
      - 'm3/vendor/third_party/jackson-databind-2.19.2/**'
      - 'm3/vendor/third_party/fastdoubleparser-1.0.90/**'
      - 'src/java.base/share/classes/java/lang/String.java'
      - 'src/java.base/share/classes/java/lang/M3String.java'
      - 'src/jdk.compiler/share/classes/com/sun/source/util/M3AST.java'
      - 'src/jdk.compiler/share/classes/com/sun/tools/javac/m3/M3ASTPC.java'
      - 'src/jdk.compiler/share/classes/com/sun/tools/javac/m3/M3PrimitiveImageCompiler.java'
      - 'src/jdk.compiler/share/classes/com/sun/tools/javac/main/JavaCompiler.java'
      - 'm3/vendor/synexia/nlp-search/**'
      - 'm3/vendor/third_party/opennlp-tools/**'
      - 'm3/vendor/third_party/lucene-core/**'
      - 'm3/vendor/third_party/lucene-analysis-common/**'
      - 'm3/vendor/third_party/lucene-queries/**'
      - 'm3/vendor/third_party/lucene-sandbox/**'
      - 'm3/vendor/third_party/lucene-queryparser/**'
      - 'm3/vendor/third_party/slf4j-api-2.0.12/**'
      - 'm3/vendor/third_party/slf4j-simple/**'
      - '.github/workflows/m3sdk-jmod-receiver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 1 - Diff hygiene
        run: git diff --check
      - name: 2 - Exact Git blob receiver proof
        run: python3 m3/tooling/jmod-recipes/tools/verify_sdk_receiver.py --repo .
      - name: 3 - SDK receiver and preflight refusal tests
        run: >-
          python3 -m unittest discover
          -s m3/tooling/jmod-recipes/tools
          -p 'test_*.py' -v
      - name: 4 - Java 21 vendor smoke source compiles without donor classpath
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3sdk-smoke-classes"
          javac --release 21 -Xlint:all -Werror \
            -d "$RUNNER_TEMP/m3sdk-smoke-classes" \
            m3/tooling/jmod-recipes/tools/fixtures/M3SdkImageSmoke.java
      - name: 5 - Product acceptance remains independently proof-gated
        run: |
          set -euo pipefail
          test -f m3/release/release-contract.json
          echo 'SDK source and Java smoke compilation proof only; no linked image executed in this job.'

  openrewrite-recipe-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run original hash-pinned JMOD descriptor OpenRewrite JUnit
        run: >-
          mvn -B -ntp -f m3/tooling/jmod-recipes/pom.xml
          -Dtest=M3ModuleDescriptorRecipeTest test


  full-tool-images:
    name: Full OpenNLP Lucene and JNI images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - name: Build and execute full OpenNLP and Lucene from local source
        run: >-
          python3 m3/tooling/module-packs/nlp-search/build.py
          --jdk-home "$JAVA_HOME" --out build/m3-nlp-search
      - name: Build and execute text and POSIX JNI tools
        run: |
          set -euo pipefail
          owner="$PWD/m3/tooling/module-packs/text-tools"
          python3 "$owner/build.py" --jdk-home "$JAVA_HOME" \
            --sources "$owner/src" --native-source "$owner/native/m3textio.c" \
            --smoke "$owner/fixtures/src/test/java/M3TextSmoke.java" \
            --legal-notices "$owner/legal" \
            --packager "$PWD/m3/tooling/jmod-recipes/tools/jmod_pack.py" \
            --out "$PWD/build/m3-text-tools"
          image="$PWD/build/m3-text-tools/pack/image"
          mkdir -p build/m3-text-tools/utf8
          "$image/bin/javac" --patch-module "jdk.m3.text=$owner/fixtures/src/test/java" \
            -d build/m3-text-tools/utf8 "$owner/fixtures/src/test/java/Utf8SegmentsProbe.java"
          "$image/bin/java" --patch-module jdk.m3.text=build/m3-text-tools/utf8 \
            -m jdk.m3.text/jdk.m3.text.Utf8SegmentsProbe | tee build/m3-text-tools/utf8.log
      - name: Retain image proof and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-full-tool-images
          if-no-files-found: error
          path: |
            build/m3-nlp-search/**/*.log
            build/m3-nlp-search/**/*.json
            build/m3-text-tools/**/*.log

  jackson-source-jmods:
    name: Jackson source runtime and M3AST compiler JMODs
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      M3_JACKSON_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - name: Record exact source revision
        run: |
          set -euo pipefail
          mkdir -p build/m3-jackson-ci
          git rev-parse HEAD > build/m3-jackson-ci/HEAD.txt
          test "$(cat build/m3-jackson-ci/HEAD.txt)" = "$M3_JACKSON_HEAD"
      - name: Build Jackson sources and execute host and linked runtime contracts
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/build.py \
            --jdk-home "$JAVA_HOME" --repo-root "$PWD" --maven mvn \
            --maven-repo "$RUNNER_TEMP/m3-jackson-maven" --resolve-build-tools \
            --out build/m3-jackson
      - name: Build compiler JMOD and execute actual M3AST host and linked contracts
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/compiler-build.py \
            --jdk-home "$JAVA_HOME" --repo-root "$PWD" \
            --jars build/m3-jackson/jars --out build/m3-jackson-compiler
      - name: Verify executed contracts and source-built artifact identity
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import re

          def require(value, message):
              if not value:
                  raise SystemExit(message)

          def content(path):
              require(path.is_file() and path.stat().st_size > 0, "Missing evidence: " + str(path))
              return path.read_bytes()

          def load(path):
              return json.loads(content(path))

          def digest(path):
              return hashlib.sha256(content(path)).hexdigest()

          base = Path("build/m3-jackson")
          compiler = Path("build/m3-jackson-compiler")
          result = load(base / "RESULT.json")
          source = load(base / "SOURCE_BUILD.json")
          receipt = load(compiler / "COMPILER_RECEIPT.json")
          modules = {
              "com.fasterxml.jackson.annotation", "com.fasterxml.jackson.core",
              "com.fasterxml.jackson.databind", "jdk.m3.jackson",
          }
          require(result.get("status") == "PASS" and result.get("source_build") == "PASS",
                  "Runtime source/JMOD proof did not pass")
          require(source.get("status") == "PASS"
                  and source.get("runtime_dependency_policy") == "VENDORED_SOURCE_ONLY",
                  "Runtime inputs were not qualified from the selected sources")
          donors = source.get("donors", [])
          require(len(donors) == 4
                  and all(item.get("maven_source_build") == "PASS" for item in donors),
                  "Four successful donor source builds are required")
          require(set(result.get("jars", {})) == modules
                  and sorted(result.get("jmods", [])) == sorted(name + ".jmod" for name in modules),
                  "Runtime module closure must contain exactly four modules")
          require(receipt.get("status") == "PASS"
                  and receipt.get("proof") == "ACTUAL_M3AST_COMPILER_PATCH_AND_FIVE_JMOD_IMAGE"
                  and sorted(receipt.get("modules", [])) == sorted(modules | {"jdk.m3.jackson.compiler"}),
                  "Actual compiler proof must contain exactly five modules")
          require(receipt.get("runtime_result_sha256") == digest(base / "RESULT.json")
                  and set(receipt.get("runtime_input_jars", {})) == modules,
                  "Compiler proof does not refer to this runtime result")
          for module in sorted(modules):
              jar_hash = digest(base / "jars" / (module + ".jar"))
              require(jar_hash == result["jars"][module].get("sha256")
                      == receipt["runtime_input_jars"][module].get("sha256"),
                      "Runtime/compiler JAR identity mismatch: " + module)
              require(digest(base / "pack/jmods" / (module + ".jmod"))
                      == result.get("jmod_sha256", {}).get(module + ".jmod"),
                      "Runtime JMOD identity mismatch: " + module)
          require(digest(compiler / "jdk.m3.jackson.compiler.jar") == receipt.get("jar_sha256")
                  and digest(compiler / "pack/jmods/jdk.m3.jackson.compiler.jmod") == receipt.get("jmod_sha256"),
                  "Compiler output artifact identity mismatch")
          owners = receipt.get("compiler_source_inputs", [])
          required_owners = {
              "src/jdk.compiler/share/classes/com/sun/source/util/M3AST.java",
              "src/jdk.compiler/share/classes/com/sun/tools/javac/m3/M3ASTPC.java",
              "src/jdk.compiler/share/classes/com/sun/tools/javac/m3/M3PrimitiveImageCompiler.java",
              "src/jdk.compiler/share/classes/com/sun/tools/javac/main/JavaCompiler.java",
          }
          require(len(owners) == 4 and {item.get("path") for item in owners} == required_owners,
                  "Compiler proof must use the four actual M3 compiler source owners")
          for owner in owners:
              require(digest(Path(owner["path"])) == owner.get("sha256"),
                      "Compiler source identity mismatch: " + owner["path"])
          counts = {}
          for lane, key in (("host", "host_contracts"), ("linked", "linked_contracts")):
              contracts = result.get(key, {})
              for name, marker in (("JacksonContract", "JACKSON_CONTRACT_PASS"),
                                   ("M3FileContract", "M3_FILE_CONTRACT_PASS")):
                  contract = contracts.get("jdk.m3.jackson." + name, {})
                  pattern = r"(?m)^" + marker + r" checks=([1-9][0-9]*)(?:\s|$)"
                  logged = re.search(pattern, content(base / "logs" / (lane + "-" + name + ".log")).decode())
                  recorded = re.search(pattern, contract.get("stdout", ""))
                  require(contract.get("status") == "PASS" and logged and recorded
                          and logged.group(1) == recorded.group(1),
                          "Nonzero executed contract missing: " + lane + "/" + name)
                  command = load(base / "logs" / (lane + "-" + name + ".result.json"))
                  require(command.get("exit_code") == 0, "Runtime contract process failed: " + lane + "/" + name)
                  counts[lane + "/" + name] = int(logged.group(1))
          for name in ("host-ast.log", "image-ast.log"):
              log = content(compiler / name).decode()
              matched = re.search(r"(?m)^M3_AST_BINDINGS_PASS shapes=([1-9][0-9]*)"
                                  r" projections=([1-9][0-9]*) hits=([1-9][0-9]*)\s*$", log)
              require(matched and log.rstrip().endswith("EXIT 0"),
                      "Nonzero actual M3AST contract missing: " + name)
              counts[name] = [int(value) for value in matched.groups()]
          head = content(Path("build/m3-jackson-ci/HEAD.txt")).decode().strip()
          require(head == os.environ["M3_JACKSON_HEAD"], "Evidence revision differs from selected head")
          evidence = {
              "status": "PASS", "head": head, "runtime_modules": sorted(modules),
              "compiler_modules": sorted(receipt["modules"]), "executed_counts": counts,
              "runtime_result_sha256": digest(base / "RESULT.json"),
              "compiler_receipt_sha256": digest(compiler / "COMPILER_RECEIPT.json"),
              "m3_vm_string_storage": result.get("m3_string_runtime", {}),
              "scope": "Source-built JMOD and actual compiler-patch proof; full M3 VM qualification is separate.",
          }
          Path("build/m3-jackson-ci/CI_RECEIPT.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("JACKSON_SOURCE_JMOD_CI_PASS head=" + head + " runtimeModules=4 compilerModules=5")
          PY
      - name: Retain head-specific Jackson source and JMOD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-jackson-source-jmods-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/m3-jackson-ci/*
            build/m3-jackson/*.json
            build/m3-jackson/*.tsv
            build/m3-jackson/toolchain-release.txt
            build/m3-jackson/logs/*
            build/m3-jackson/legal/**
            build/m3-jackson/jars/*.jar
            build/m3-jackson/pack/*.json
            build/m3-jackson/pack/*.tsv
            build/m3-jackson/pack/*.log
            build/m3-jackson/pack/jmods/*.jmod
            build/m3-jackson-compiler/*.json
            build/m3-jackson-compiler/*.tsv
            build/m3-jackson-compiler/*.log
            build/m3-jackson-compiler/jdk.m3.jackson.compiler.jar
            build/m3-jackson-compiler/pack/*.json
            build/m3-jackson-compiler/pack/*.tsv
            build/m3-jackson-compiler/pack/*.log
            build/m3-jackson-compiler/pack/jmods/*.jmod
