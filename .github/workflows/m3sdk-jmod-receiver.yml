# SPDX-License-Identifier: Apache-2.0
name: M3SDK JMOD Receiver Proof

on:
  pull_request:
    paths:
      - 'm3/tooling/jmod-recipes/**'
      - 'm3/vendor/third_party-m3/**'
      - 'm3/tooling/module-packs/nlp-search/**'
      - 'm3/tooling/module-packs/text-tools/**'
      - 'm3/tooling/module-packs/jackson/**'
      - 'm3/vendor/third_party/jackson-annotations-2.19.2/**'
      - 'm3/vendor/third_party/jackson-core-2.19.2/**'
      - 'm3/vendor/third_party/jackson-databind-2.19.2/**'
      - 'm3/vendor/third_party/fastdoubleparser-1.0.90/**'
      - 'src/java.base/share/classes/java/lang/String.java'
      - 'src/java.base/share/classes/java/lang/M3String.java'
      - 'src/jdk.compiler/share/classes/com/sun/source/util/M3AST.java'
      - 'src/jdk.compiler/share/classes/com/sun/tools/javac/m3/M3ASTPC.java'
      - 'src/jdk.compiler/share/classes/com/sun/tools/javac/m3/M3PrimitiveImageCompiler.java'
      - 'src/jdk.compiler/share/classes/com/sun/tools/javac/main/JavaCompiler.java'
      - 'm3/vendor/synexia/nlp-search/**'
      - 'm3/vendor/third_party/opennlp-tools/**'
      - 'm3/vendor/third_party/lucene-core/**'
      - 'm3/vendor/third_party/lucene-analysis-common/**'
      - 'm3/vendor/third_party/lucene-queries/**'
      - 'm3/vendor/third_party/lucene-sandbox/**'
      - 'm3/vendor/third_party/lucene-queryparser/**'
      - 'm3/vendor/third_party/slf4j-api-2.0.12/**'
      - 'm3/vendor/third_party/slf4j-simple/**'
      - '.github/workflows/m3sdk-jmod-receiver.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: 1 - Diff hygiene
        run: git diff --check
      - name: 2 - Exact Git blob receiver proof
        run: python3 m3/tooling/jmod-recipes/tools/verify_sdk_receiver.py --repo .
      - name: 3 - SDK receiver and preflight refusal tests
        run: >-
          python3 -m unittest discover
          -s m3/tooling/jmod-recipes/tools
          -p 'test_*.py' -v
      - name: 4 - Java 21 vendor smoke source compiles without donor classpath
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3sdk-smoke-classes"
          javac --release 21 -Xlint:all -Werror \
            -d "$RUNNER_TEMP/m3sdk-smoke-classes" \
            m3/tooling/jmod-recipes/tools/fixtures/M3SdkImageSmoke.java
      - name: 5 - Product acceptance remains independently proof-gated
        run: |
          set -euo pipefail
          test -f m3/release/release-contract.json
          echo 'SDK source and Java smoke compilation proof only; no linked image executed in this job.'

  openrewrite-recipe-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run original hash-pinned JMOD descriptor OpenRewrite JUnit
        run: >-
          mvn -B -ntp -f m3/tooling/jmod-recipes/pom.xml
          -Dtest=M3ModuleDescriptorRecipeTest test


  full-tool-images:
    name: Full OpenNLP Lucene and JNI images
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - name: Build and execute full OpenNLP and Lucene from local source
        run: >-
          python3 m3/tooling/module-packs/nlp-search/build.py
          --jdk-home "$JAVA_HOME" --out build/m3-nlp-search
      - name: Build and execute text and POSIX JNI tools
        run: |
          set -euo pipefail
          owner="$PWD/m3/tooling/module-packs/text-tools"
          python3 "$owner/build.py" --jdk-home "$JAVA_HOME" \
            --sources "$owner/src" --native-source "$owner/native/m3textio.c" \
            --smoke "$owner/fixtures/src/test/java/M3TextSmoke.java" \
            --legal-notices "$owner/legal" \
            --packager "$PWD/m3/tooling/jmod-recipes/tools/jmod_pack.py" \
            --out "$PWD/build/m3-text-tools"
          image="$PWD/build/m3-text-tools/pack/image"
          mkdir -p build/m3-text-tools/utf8
          "$image/bin/javac" --patch-module "jdk.m3.text=$owner/fixtures/src/test/java" \
            -d build/m3-text-tools/utf8 "$owner/fixtures/src/test/java/Utf8SegmentsProbe.java"
          "$image/bin/java" --patch-module jdk.m3.text=build/m3-text-tools/utf8 \
            -m jdk.m3.text/jdk.m3.text.Utf8SegmentsProbe | tee build/m3-text-tools/utf8.log
      - name: Retain image proof and failure logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-full-tool-images
          if-no-files-found: error
          path: |
            build/m3-nlp-search/**/*.log
            build/m3-nlp-search/**/*.json
            build/m3-text-tools/**/*.log

  jackson-source-jmods:
    name: Jackson source runtime, M3AST JMODs and full upstream suites
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      M3_JACKSON_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21.0.8+9'
      - name: Record exact source revision
        run: |
          set -euo pipefail
          mkdir -p build/m3-jackson-ci
          git rev-parse HEAD > build/m3-jackson-ci/HEAD.txt
          test "$(cat build/m3-jackson-ci/HEAD.txt)" = "$M3_JACKSON_HEAD"
      - name: Check out pinned jackson-annotations fork test oracle
        uses: actions/checkout@v5
        with:
          repository: hsoliwal/jackson-annotations
          ref: e84b2adf8f4bb9d881d02a1ec4a0c70dcc9c5a00
          fetch-depth: 0
          path: build/m3-jackson-upstream-sources/jackson-annotations
          persist-credentials: false
      - name: Check out pinned jackson-core fork test oracle
        uses: actions/checkout@v5
        with:
          repository: hsoliwal/jackson-core
          ref: 1fb76534cd69a94ecbfb23ed6dce334109c1230c
          fetch-depth: 0
          path: build/m3-jackson-upstream-sources/jackson-core
          persist-credentials: false
      - name: Check out pinned jackson-databind fork test oracle
        uses: actions/checkout@v5
        with:
          repository: hsoliwal/jackson-databind
          ref: 1a506043e0644c9cf60c0905474459605fc751d0
          fetch-depth: 0
          path: build/m3-jackson-upstream-sources/jackson-databind
          persist-credentials: false
      - name: Build Jackson sources and execute host and linked runtime contracts
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/build.py \
            --jdk-home "$JAVA_HOME" --repo-root "$PWD" --maven mvn \
            --maven-repo "$RUNNER_TEMP/m3-jackson-maven" --resolve-build-tools \
            --out build/m3-jackson
      - name: Build compiler JMOD and execute actual M3AST host and linked contracts
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/compiler-build.py \
            --jdk-home "$JAVA_HOME" --repo-root "$PWD" \
            --jars build/m3-jackson/jars --out build/m3-jackson-compiler
      - name: Run complete pinned fork suites and exact generated-library replays
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/upstream-qualification-regression.py 2>&1 | tee build/m3-jackson-ci/upstream-admission-regression.log
          python3 m3/tooling/module-packs/jackson/upstream-qualification.py \
            --annotations-root build/m3-jackson-upstream-sources/jackson-annotations \
            --core-root build/m3-jackson-upstream-sources/jackson-core \
            --databind-root build/m3-jackson-upstream-sources/jackson-databind \
            --runtime-jars build/m3-jackson/jars --java-home "$JAVA_HOME" \
            --maven "$(command -v mvn)" --cache "$RUNNER_TEMP/m3-jackson-test-maven" \
            --out build/m3-jackson-upstream-proof
      - name: Verify executed contracts, exact source hashes and all eight upstream lanes
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/jackson/verify-qualification.py \
            --runtime build/m3-jackson --compiler build/m3-jackson-compiler \
            --upstream build/m3-jackson-upstream-proof --repo-root "$PWD" \
            --expected-head "$M3_JACKSON_HEAD" --out build/m3-jackson-ci/CI_RECEIPT.json
      - name: Retain head-specific Jackson source and JMOD evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-jackson-source-jmods-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/m3-jackson-ci/*
            build/m3-jackson/*.json
            build/m3-jackson/*.tsv
            build/m3-jackson/toolchain-release.txt
            build/m3-jackson/logs/*
            build/m3-jackson/legal/**
            build/m3-jackson/jars/*.jar
            build/m3-jackson/pack/*.json
            build/m3-jackson/pack/*.tsv
            build/m3-jackson/pack/*.log
            build/m3-jackson/pack/jmods/*.jmod
            build/m3-jackson-compiler/*.json
            build/m3-jackson-compiler/*.tsv
            build/m3-jackson-compiler/*.log
            build/m3-jackson-compiler/jdk.m3.jackson.compiler.jar
            build/m3-jackson-compiler/pack/*.json
            build/m3-jackson-compiler/pack/*.tsv
            build/m3-jackson-compiler/pack/*.log
            build/m3-jackson-compiler/pack/jmods/*.jmod
            build/m3-jackson-upstream-proof/**/*.json
            build/m3-jackson-upstream-proof/**/*.xml
            build/m3-jackson-upstream-proof/**/*.log
            build/m3-jackson-upstream-proof/**/test-classes/**
            build/m3-jackson-upstream-proof/**/test-classpath.txt
            build/m3-jackson-upstream-proof/**/release.txt
