name: M3 post-21 JEP compatibility policy

# Former triggers (below, as of the move) now start job(s) 'm3-post21-jep-compatibility-policy__*' in
# .github/workflows/checks-superset-04.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     push:
#       branches:
#         - "m3/post21-jep-compat-reconcile-20261005"
#       paths:
#         - "m3/backports/POST21_PRIORITY_COMPATIBILITY.tsv"
#         - "m3/backports/compatibility_policy.py"
#         - "m3/backports/test_compatibility_policy.py"
#         - ".github/workflows/m3-post21-jep-compatibility-policy.yml"
#     pull_request:
#       paths:
#         - "m3/backports/POST21_PRIORITY_COMPATIBILITY.tsv"
#         - "m3/backports/compatibility_policy.py"
#         - "m3/backports/test_compatibility_policy.py"
#         - ".github/workflows/m3-post21-jep-compatibility-policy.yml"
#     workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compile policy
        run: python3 -m compileall -q m3/backports/compatibility_policy.py m3/backports/test_compatibility_policy.py

      - name: Validate checked-in compatibility ledger
        run: python3 m3/backports/compatibility_policy.py

      - name: Run compatibility-policy tests
        working-directory: m3/backports
        run: python3 -m unittest -v test_compatibility_policy.py
