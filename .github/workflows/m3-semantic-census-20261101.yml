name: M3JDK21 semantic atom census Java21 and Maven admission
# Former triggers (below, as of the move) now start job(s) 'm3-semantic-census-20261101__*' in
# .github/workflows/checks-superset-10.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/tooling/atom-census/**'
#         - '.github/workflows/m3-semantic-census-20261101.yml'
#     push:
#       paths:
#         - 'm3/tooling/atom-census/**'
#         - '.github/workflows/m3-semantic-census-20261101.yml'
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  semantic-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit exact source SHA256 postimages and unchanged ABI contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          receipt=json.loads(Path('m3/tooling/atom-census/contract/M3_SEMANTIC_CENSUS_V2_RECEIPT.json').read_text())
          if receipt['external_api_changed'] or receipt['jni_abi_changed']:
              raise SystemExit('REFUSED: ABI unlock')
          # The V2 receipt stays as written. Its postimages moved on afterwards; the append-only carry receipt
          # chains each V2 postimage to its live file. A step sealed by a later receipt is checked against it; a
          # rename step (M3 prefix dropped, path and bytes) is the reviewed carry record itself.
          carry=json.loads(Path('m3/tooling/atom-census/contract/M3_SEMANTIC_CENSUS_V2_CARRY_RECEIPT.json').read_text())
          if carry['schema']!='M3_SEMANTIC_CENSUS_V2_CARRY/1':
              raise SystemExit('REFUSED: carry schema')
          for key in ('source_change','test_change'):
              row=receipt[key]
              chain=carry[key]
              first=chain[0]
              if (first['path'],first['blob'],first['sha256'])!=(row['path'],row['post_blob'],row['post_sha256']):
                  raise SystemExit('REFUSED: carry does not start at the V2 postimage '+key)
              for before,after in zip(chain,chain[1:]):
                  if after['step']=='receipt':
                      sealed={t['path']:t for t in json.loads(Path(after['receipt']).read_text())['targets']}.get(before['path'])
                      if after['path']!=before['path'] or sealed is None or (sealed['pre'],sealed['post'])!=(before['sha256'],after['sha256']):
                          raise SystemExit('REFUSED: carry step not sealed by '+after['receipt'])
                  elif after['step']=='drop-product-prefix':
                      head,_,name=before['path'].rpartition('/')
                      if not name.startswith('M3') or after['path']!=head+'/'+name[2:]:
                          raise SystemExit('REFUSED: rename step is not the M3 prefix drop '+before['path'])
                  else:
                      raise SystemExit('REFUSED: unattested carry step '+key)
              path=Path(chain[-1]['path'])
              if path.is_symlink() or not path.is_file():
                  raise SystemExit('REFUSED: missing or linked postimage '+str(path))
              sha=hashlib.sha256(path.read_bytes()).hexdigest()
              if sha!=chain[-1]['sha256']:
                  raise SystemExit('REFUSED: postimage drift '+str(path))
          print('M3_SEMANTIC_CENSUS_V2_SOURCE_SEALS_PASS')
          PY
      - name: Strict Java21 source compile and 154 executed assertions
        shell: bash
        run: |
          set -euo pipefail
          root=m3/tooling/atom-census
          mkdir -p "$RUNNER_TEMP/m3-semantic"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-semantic" \
            "$root/src/main/java/jdk/m3/tooling/atoms/contract/AtomKind.java" \
            "$root/src/main/java/jdk/m3/tooling/atoms/AtomCensus.java" \
            "$root/src/main/java/jdk/m3/tooling/atoms/JniDeclarationProjection.java" \
            "$root/src/test/java/jdk/m3/tooling/atoms/AtomCensusSemanticSelfTest.java"
          java -cp "$RUNNER_TEMP/m3-semantic" jdk.m3.tooling.atoms.AtomCensusSemanticSelfTest \
            | tee "$RUNNER_TEMP/m3-semantic.log"
          grep -q $'M3_SEMANTIC_CENSUS_PROOF\tchecks=154\tstatus=PASS' "$RUNNER_TEMP/m3-semantic.log"
      - name: Verify canonical atom contract and fail-closed admission
        shell: bash
        run: |
          set -euo pipefail
          bash m3/tooling/atom-census/verify-contract.sh
      - name: Execute actual JUnit tests in M3JDK21 atom census module
        shell: bash
        run: mvn -B -ntp -f m3/tooling/atom-census/pom.xml clean test
      - name: Require Surefire cases without failure or skip
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          reports=Path('m3/tooling/atom-census/target/surefire-reports')
          files=sorted(reports.glob('TEST-*.xml'))
          if not files: raise SystemExit('HOLD: no JUnit XML')
          count=0
          for path in files:
              if path.is_symlink() or path.stat().st_size>2*1024*1024:
                  raise SystemExit('HOLD: unsafe XML')
              raw=path.read_bytes()
              if b'<!DOCTYPE' in raw.upper() or b'<!ENTITY' in raw.upper():
                  raise SystemExit('HOLD: XML entity')
              suite=ET.fromstring(raw)
              if suite.tag!='testsuite': raise SystemExit('HOLD: suite')
              for attr in ('errors','failures','skipped'):
                  if int(suite.get(attr,'-1'))!=0: raise SystemExit('HOLD: '+attr)
              cases=suite.findall('testcase')
              if len(cases)!=int(suite.get('tests','-1')):
                  raise SystemExit('HOLD: nested/hidden testcase')
              count+=len(cases)
          if count<4: raise SystemExit('HOLD: mandatory atom tests absent')
          print('M3_SEMANTIC_CENSUS_JUNIT_PASS',count)
          PY
      - name: Explicit product hold
        run: echo 'TOOLING_CI_DOES_NOT_PROVE_FULL_JDK21_JTREG_C1_C2_JNI_ABI_CROSS_PLATFORM'
