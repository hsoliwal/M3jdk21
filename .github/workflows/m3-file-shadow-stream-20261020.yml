# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original M3File shadow streams and subprogress
on:
  pull_request:
    paths:
      - 'm3/file/**'
      - 'm3/tooling/shared-frontend/recipe-custody/datasets/m3-file-shadow-20261020/**'
      - '.github/workflows/m3-file-shadow-stream-20261020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-provider-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Qualify exact original OpenRewrite Java snapshot source
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/m3/tooling/shared-frontend/recipe-custody"
          mvn -B -ntp -f "$root/pom.xml" -Pcontract \
            -Dm3.dataset=m3-file-shadow-20261020 \
            "-Drecipe.owner.root=$root/sdk-owner" verify
          python3 "$root/receive.py" --dataset m3-file-shadow-20261020 \
            --recipe-owner "$root/sdk-owner" --target "$PWD" --check
      - name: Strict Java21 original M3File plus bounded shadow contracts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-shadow-file"
          mkdir -p "$out"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out" \
            m3/file/src/main/java/com/m3/file/M3File.java \
            m3/file/src/main/java/com/m3/file/M3FileStreams.java \
            m3/file/src/test/java/com/m3/file/M3FileStreamsContract.java
          java -cp "$out" com.m3.file.M3FileStreamsContract
          java -Xint -cp "$out" com.m3.file.M3FileStreamsContract
