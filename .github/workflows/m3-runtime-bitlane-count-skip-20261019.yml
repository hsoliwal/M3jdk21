name: M3JDK21 java.base bitmap canonical generation and receiving
on:
  push:
    branches: ['m3/java-base-bitlane-count-skip-20261019-01']
  pull_request:
    paths:
      - '.github/workflows/m3-runtime-bitlane-count-skip-20261019.yml'
      - 'm3/runtime-integration/qualification/bitlane-count-skip-20261019/**'
      - 'src/java.base/share/classes/jdk/internal/mindex/M3BitLane28.java'
      - 'src/java.base/share/classes/jdk/internal/mindex/M3Address28.java'
      - 'src/java.base/share/classes/jdk/internal/mindex/M3Bits.java'
      - 'src/java.base/share/native/libjava/M3BitLane28.c'
permissions:
  contents: read
jobs:
  canonical-generation-then-receiver:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      Q: m3/runtime-integration/qualification/bitlane-count-skip-20261019
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
          sparse-checkout: |
            m3/runtime-integration/qualification/bitlane-count-skip-20261019
            src/java.base/share/classes/jdk/internal/mindex
            src/java.base/share/native/libjava
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Seal current runtime dependencies and canonical recipe
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          test "$(git hash-object "$Q/src/main/java/com/synexia/rewrite/M3HashPinnedJavaSnapshotRecipe.java")" = 3bdeeaea9a212fe0c7d1f544510f87c4cd49eb40
          test "$(git hash-object "$Q/src/main/java/com/synexia/rewrite/M3ScopeInference.java")" = d24729950508857280ea1b56d4e930f05137ec85
          test "$(git hash-object "$Q/src/main/java/com/synexia/rewrite/M3EditScope.java")" = 274360816db1e44a2f1796a3bc5cdeff6b0ce6db
          test "$(git hash-object src/java.base/share/classes/jdk/internal/mindex/M3Address28.java)" = 14cdb999f5eab5be443044bff2d273fb4e4113fb
          test "$(git hash-object src/java.base/share/classes/jdk/internal/mindex/M3Bits.java)" = 2ad46058a5325483647af4af16858c329ae24665
          test "$(git hash-object src/java.base/share/native/libjava/M3BitLane28.c)" = e68e05555efbe2dbf1355e6820cc7795d9c33942
      - name: Actual canonical Maven OpenRewrite generation and seven SDK gates
        run: mvn -B -ntp -f "$Q/recipes/m3jdk21-bitlane-runtime-count-skip-20261019/pom.xml" clean test
      - name: Generated java.base and unchanged real JNI parity
        run: bash "$Q/recipes/m3jdk21-bitlane-runtime-count-skip-20261019/verify-generated.sh"
      - name: Require exact generated production receiver before green admission
        shell: bash
        run: |
          set -euo pipefail
          GENERATED="$Q/recipes/m3jdk21-bitlane-runtime-count-skip-20261019/target/generated-receiver/src/java.base/share/classes/jdk/internal/mindex/M3BitLane28.java"
          cmp "$GENERATED" src/java.base/share/classes/jdk/internal/mindex/M3BitLane28.java
          test "$(git hash-object src/java.base/share/classes/jdk/internal/mindex/M3BitLane28.java)" = 731a7b63a8fc0c5f234e68f459b3b67080cc6101
          echo EXACT_GENERATED_RUNTIME_RECEIVER_PASS
