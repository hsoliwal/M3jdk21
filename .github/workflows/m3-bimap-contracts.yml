name: M3 bidirectional collection contracts
on:
  push:
    branches: [aix/m3-bimap-contracts-20261016]
  pull_request:
    paths:
      - 'm3/collections/**'
      - '.github/workflows/m3-bimap-contracts.yml'
permissions:
  contents: read
concurrency:
  group: m3-bimap-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  recipe-and-java-jni:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      PYTHONOPTIMIZE: '0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: m3/collections
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Identify exact source and canonical recipe mirror
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/deps proof/core
          { git rev-parse HEAD; uname -m; java -version 2>&1; mvn -version; gcc --version; } > proof/identity.txt
          test "$(git rev-parse HEAD:m3/collections/bimap/recipe)" = 34fa2a9ddf55237b0fb564492db98bc178ef03c6
          test "$(git hash-object m3/collections/bimap/verify.py)" = f1b8ff89afb8e8ec108a88a9fd3402c6be148607
          cp m3/collections/bimap/canonical-source.json proof/
      - name: Execute existing and new Maven OpenRewrite suites
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/counts/recipe/pom.xml test 2>&1 | tee proof/counted-recipe.log
          cp -R m3/collections/counts/recipe/target/surefire-reports proof/counted-recipe-reports
          mvn -B -ntp -f m3/collections/counts/totals/recipe/pom.xml test 2>&1 | tee proof/totals-recipe.log
          cp -R m3/collections/counts/totals/recipe/target/surefire-reports proof/totals-recipe-reports
          mvn -B -ntp -f m3/collections/bimap/recipe/pom.xml test 2>&1 | tee proof/bimap-recipe.log
          cp -R m3/collections/bimap/recipe/target/surefire-reports proof/bimap-recipe-reports
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as E
          for name, count in [('counted',8),('totals',8),('bimap',9)]:
              reports=list(Path('proof/'+name+'-recipe-reports').glob('TEST-*.xml'))
              assert reports, 'missing '+name+' reports'
              actual={k:sum(int(E.parse(p).getroot().attrib.get(k,0)) for p in reports) for k in ('tests','failures','errors','skipped')}
              assert actual=={'tests':count,'failures':0,'errors':0,'skipped':0}, (name,actual)
              print(name,actual)
          PY
          mvn -B -ntp -f m3/collections/bimap/recipe/pom.xml -Dm3.bimap.target="$GITHUB_WORKSPACE" test 2>&1 | tee proof/bimap-replay.log
          git diff --exit-code -- m3/collections
      - name: Compile unchanged core and resolve existing library dependencies
        shell: bash
        run: |
          set -euo pipefail
          find m3/collections/src/main/java -name '*.java' | sort > proof/core-sources.txt
          javac --release 21 -Xlint:all,-module -Werror -d proof/core @proof/core-sources.txt
          jar --create --file proof/m3-collections.jar -C proof/core .
          JAR="$GITHUB_WORKSPACE/proof/m3-collections.jar"
          (cd "$RUNNER_TEMP" && mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile="$JAR" -DgroupId=com.m3 -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true)
          mvn -B -ntp -f m3/collections/interop/pom.xml verify org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=runtime -DoutputDirectory="$GITHUB_WORKSPACE/proof/deps" 2>&1 | tee proof/interop-maven.log
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar -o proof/junit-platform-console-standalone-1.12.2.jar
          echo '329bd10288875a74d04c9ca6b7c9889c265ddf87b21a9ea42a7f7392f391472a  proof/junit-platform-console-standalone-1.12.2.jar' | sha256sum --check -
      - name: Verify all retained runtime proofs and new Java JNI contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/collections/bimap/verify.py --root "$GITHUB_WORKSPACE" --deps proof/deps --junit proof/junit-platform-console-standalone-1.12.2.jar 2>&1 | tee proof/verification.log
          git diff --exit-code -- m3/collections
          find proof m3/collections/bimap m3/collections/counts/target/verification m3/collections/counts/totals/target/evidence -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > proof/SHA256SUMS
      - name: Preserve actual source and evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-bimap-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/collections/bimap/
            m3/collections/counts/target/verification/
            m3/collections/counts/totals/target/evidence/
            m3/collections/interop/src/main/java/com/m3/collections/interop/M3BiMap.java
            m3/collections/interop/src/main/java/com/m3/collections/interop/M3BiMaps.java
            m3/collections/src/test/native/collections/m3_bimap_consumer.c
