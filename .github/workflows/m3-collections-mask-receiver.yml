name: M3 collections primitive-mask receiver Java21 and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongArrayList.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongArrayDeque.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java'
      - 'm3/collections/qualification/mask-selection-postimages-20261016.tsv'
      - 'm3/collections/qualification/mask-zero-20261017/**'
      - '.github/workflows/m3-collections-mask-receiver.yml'
  push:
    branches:
      - m3/mask-family-receiver-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-java-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact canonical proof custody
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          home=Path('m3/collections/qualification/mask-zero-20261017')
          handoff=json.loads((home/'handoff.json').read_text())
          commit=handoff['canonical_commit']
          assert len(commit)==40 and all(c in '0123456789abcdef' for c in commit)
          for line in (home/'MIRROR_RECEIPT.tsv').read_text().splitlines():
              if not line or line.startswith('#'): continue
              path,expected=line.split('\t')
              assert hashlib.sha256((home/'recipe'/path).read_bytes()).hexdigest()==expected,path
          print('CANONICAL_MASK_ZERO_MIRROR_SEAL_PASS')
          PY
      - name: Replay historical receiver and exact current successor through the real SDK
        shell: bash
        env:
          MAVEN_OPTS: -Xmx384m
        run: |
          set -euo pipefail
          crate=m3/collections/qualification/mask-zero-20261017/recipe
          mvn -B -ntp -f "$crate/pom.xml" -Dm3.mask.output="$RUNNER_TEMP/m3-mask-sdk" test
      - name: Qualify emitted Java owners and actual checked JNI with finite resource evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/collections/qualification/mask-zero-20261017/recipe/verify.py \
            --jdk "$JAVA_HOME" --target "$GITHUB_WORKSPACE" \
            --sdk "$RUNNER_TEMP/m3-mask-sdk" --work "$RUNNER_TEMP/m3-mask-proof"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-mask-zero-java-jni-proof
          path: |
            ${{ runner.temp }}/m3-mask-proof/
            m3/collections/qualification/mask-zero-20261017/recipe/target/surefire-reports/
          retention-days: 7
