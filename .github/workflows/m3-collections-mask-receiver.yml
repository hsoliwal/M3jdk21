name: M3 collections primitive-mask receiver Java21 and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongArrayList.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongArrayDeque.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java'
      - 'm3/collections/qualification/mask-selection-postimages-20261016.tsv'
      - '.github/workflows/m3-collections-mask-receiver.yml'
  push:
    branches:
      - m3/mask-family-receiver-20261016
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-java-native:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Reject tampered native64 source receipt before compilation
        run: python3 -m unittest discover -s m3/collections -p 'test_long_mask_successor.py' -v
      - name: Verify sealed postimages before compilation
        run: python3 m3/collections/qualification/verify_mask_selection.py
      - name: Compile current M3 core and actual mask tests as Java 21
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-mask-classes
          find m3/collections/src/main/java/com/m3/collections -name '*.java' -print | sort > /tmp/m3-mask-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror -d /tmp/m3-mask-classes @/tmp/m3-mask-sources.txt
          javac --release 21 -proc:none -Xlint:all -Werror -cp /tmp/m3-mask-classes -d /tmp/m3-mask-classes             m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          java -Xcheck:jni -cp /tmp/m3-mask-classes com.m3.collections.M3IndexMaskCompactorSelfTest
      - name: Build and execute target-owned JNI C17 kernel
        shell: bash
        run: |
          set -euo pipefail
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Werror -fPIC -shared             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux"             m3/collections/src/main/native/collections/m3_index_mask_compactor.c             -o /tmp/libm3_collections_mask.so
          java -Xcheck:jni -Djava.library.path=/tmp -cp /tmp/m3-mask-classes             com.m3.collections.M3IndexMaskCompactorSelfTest --native
