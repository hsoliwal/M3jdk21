# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 second-pass review DAG admission

on:
  pull_request:
    paths:
      - 'm3/tooling/backport-dag/**'
      - 'm3/backports/README.md'
      - '.github/workflows/m3-jdk21-second-pass-review-dag.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-dag:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check

      - name: 2 - Compile and test canonical backport DAG
        run: >-
          mvn -B -ntp
          -f m3/pom.xml
          -pl tooling/backport-dag -am
          -Dtest=M3RecipeDagTest,M3SecondPassReviewBindingTest
          -Dsurefire.failIfNoSpecifiedTests=false
          test

      - name: 3 - Full M3 backport DAG proof including 99 percent semantic gate
        run: >-
          mvn -B -ntp
          -f m3/pom.xml
          -pl tooling/backport-dag -am
          -Dsurefire.failIfNoSpecifiedTests=false
          verify

  # Standalone (2026-10-31): the former upstream-dag job cloned the donor repository at
  # 5369fdc8c076 and ran that repository's own tests (M3SecondPassReviewDagPlanTest and the
  # atom-pattern signal-chain verification pom). Those proofs belong to the donor's CI (MOVE);
  # this workflow keeps the local DAG proof above (m3/tooling/standalone/SYNEXIA_REFS.tsv).
