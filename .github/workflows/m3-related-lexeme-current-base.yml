# SPDX-License-Identifier: Apache-2.0
name: M3 related lexeme current-base

on:
  pull_request:
    paths:
      - "m3/core/src/com/m3/text/SharedLexiconCatalog.java"
      - "m3/core/src/com/m3/text/M3LexiconPrecompute.java"
      - "m3/core/src/com/m3/text/SynexiaPrecomputePayload.java"
      - "m3/core/src/com/m3/text/LocalM3Arena.java"
      - "m3/core/src/com/m3/text/M3StringPiece.java"
      - "m3/core/src/com/m3/text/StorageIdentity.java"
      - "m3/core/src/com/m3/text/LocalM3StringPiece.java"
      - "m3/core/src/com/m3/text/SharedLexiconImage.java"
      - "m3/core/src/com/m3/text/SharedRelatedLexemeCatalog.java"
      - "m3/core/test/SharedRelatedLexemeCatalogTest.java"
      - "m3/lexicon/synexia-source-manifest.tsv"
      - "m3/lexicon/synexia-precompute-field-map.tsv"
      - "m3/runtime-integration/FOSS_REUSE_DECISION.tsv"
      - ".github/workflows/m3-related-lexeme-current-base.yml"
  push:
    branches:
      - codex/m3-related-lexeme-current-base-20261011

permissions:
  contents: read

jobs:
  receiver:
    name: M3RelatedLexemeCatalog
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Compile and run directed relation proof
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m3/build/related-lexeme-current-base
          mkdir -p m3/build/related-lexeme-current-base/classes m3/build/related-lexeme-current-base/tests
          javac --release 21 -Xlint:all -Werror             -d m3/build/related-lexeme-current-base/classes             m3/core/src/com/m3/text/M3LexiconPrecompute.java             m3/core/src/com/m3/text/SynexiaPrecomputePayload.java             m3/core/src/com/m3/text/LocalM3Arena.java             m3/core/src/com/m3/text/LocalM3StringPiece.java             m3/core/src/com/m3/text/M3StringPiece.java             m3/core/src/com/m3/text/StorageIdentity.java             m3/core/src/com/m3/text/SharedLexiconImage.java             m3/core/src/com/m3/text/SharedLexiconCatalog.java             m3/core/src/com/m3/text/SharedLexiconFamilySidecarCatalog.java             m3/core/src/com/m3/text/SharedRelatedLexemeCatalog.java
          javac --release 21 -Xlint:all -Werror             -cp m3/build/related-lexeme-current-base/classes             -d m3/build/related-lexeme-current-base/tests             m3/core/test/SharedRelatedLexemeCatalogTest.java
          (cd m3 && java -ea -cp build/related-lexeme-current-base/classes:build/related-lexeme-current-base/tests SharedRelatedLexemeCatalogTest)
          grep -F 'SharedLexiconCatalog + SharedRelatedLexemeCatalog' m3/lexicon/synexia-source-manifest.tsv
          grep -F 'SharedRelatedLexemeCatalog.Relation' m3/lexicon/synexia-precompute-field-map.tsv
          grep -F 'synexia-related-lexeme-sidecar-receiver' m3/runtime-integration/FOSS_REUSE_DECISION.tsv
