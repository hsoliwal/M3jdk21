# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 consolidated source-sealed signal acceptance
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3Signal*.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SourceSignalQualityFactory.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3Signal*.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongTreeSetMaskCompactionContract.java'
      - 'm3/collections/qualification/signal-*/**'
      - '.github/workflows/m3-signal-nearest-boolean-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  consolidated-original-source-and-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify exact result-only source blobs (no recipe mirror)
        shell: bash
        run: |
          set -euo pipefail
          receipt="m3/collections/qualification/signal-consolidation-20261025/RECEIVER.tsv"
          test -s "$receipt"
          count=0
          previous=""
          while IFS=$'\t' read -r relative expected strong; do
            [[ -z "$relative" || "$relative" == \#* ]] && continue
            [[ "$relative" =~ ^m3/collections/src/(main|test)/java/com/m3/collections/[A-Za-z0-9_]+[.]java$ ]] || exit 1
            [[ "$expected" =~ ^[0-9a-f]{40}$ ]] || exit 1
            [[ "$strong" =~ ^[0-9a-f]{64}$ ]] || exit 1
            [[ -z "$previous" || "$relative" > "$previous" ]] || exit 1
            test -f "$relative"
            actual="$(git hash-object -- "$relative")"
            if [[ "$actual" != "$expected" ]]; then
              echo "Source drift: $relative expected=$expected observed=$actual" >&2
              exit 1
            fi
            observed256="$(sha256sum -- "$relative")"
            observed256="${observed256%% *}"
            if [[ "$observed256" != "$strong" ]]; then
              echo "Strong source drift: $relative expected=$strong observed=$observed256" >&2
              exit 1
            fi
            previous="$relative"
            count=$((count + 1))
          done < "$receipt"
          test "$count" -eq 29
      - name: Strict original Java 21 source compilation and all deterministic signal oracles
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-signal-consolidated"
          mkdir -p "$out/classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/com/m3/collections/M3ChildProgressMonitor.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressMonitor.java \
            m3/collections/src/main/java/com/m3/collections/M3ProgressState.java \
            m3/collections/src/main/java/com/m3/collections/M3ShadowStreams.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalBooleanQuery.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalColumns.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalDependencyEpochs.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalExactIntegerDistance.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalExactRangeIndex.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalQualitySchema.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalRelations.java \
            m3/collections/src/main/java/com/m3/collections/M3SignalTopK.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalImage.java \
            m3/collections/src/main/java/com/m3/collections/M3SourceSignalQualityFactory.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalColumnsSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalTopKSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SourceSignalImageSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalDependencyEpochsSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalQualitySchemaSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SourceSignalQualityFactorySelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalExactRangeIndexSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalBooleanQuerySelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalExecutionPressureSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalViewportWindowSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalRankedQuerySelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalExactIntegerDistanceSelfTest.java \
            m3/collections/src/test/java/com/m3/collections/M3SignalNearestBooleanSelfTest.java
          for test in M3SignalColumnsSelfTest M3SignalTopKSelfTest M3SourceSignalImageSelfTest M3SignalDependencyEpochsSelfTest M3SignalQualitySchemaSelfTest M3SourceSignalQualityFactorySelfTest M3SignalExactRangeIndexSelfTest M3SignalBooleanQuerySelfTest M3SignalExecutionPressureSelfTest M3SignalViewportWindowSelfTest M3SignalRankedQuerySelfTest M3SignalExactIntegerDistanceSelfTest M3SignalNearestBooleanSelfTest; do
            java -Xss256k -cp "$out/classes" "com.m3.collections.$test"
            java -Xint -Xss256k -cp "$out/classes" "com.m3.collections.$test"
          done
      - name: Build original source-vendored JUnit 5.10.2 and first-party arrays
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2 -am -DskipTests install
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Execute one original collections Maven/JUnit contract suite
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3SignalColumnsTest,M3SignalTopKTest,M3SourceSignalImageTest,M3SignalDependencyEpochsTest,M3SignalQualitySchemaTest,M3SourceSignalQualityFactoryTest,M3SignalExactRangeIndexTest,M3SignalBooleanQueryTest,M3SignalExecutionPressureTest,M3SignalViewportWindowTest,M3SignalRankedQueryTest,M3SignalExactIntegerDistanceTest,M3SignalNearestBooleanTest test
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          report_dir = Path("m3/collections/target/surefire-reports")
          suites = "M3SignalColumns,M3SignalTopK,M3SourceSignalImage,M3SignalDependencyEpochs,M3SignalQualitySchema,M3SourceSignalQualityFactory,M3SignalExactRangeIndex,M3SignalBooleanQuery,M3SignalExecutionPressure,M3SignalViewportWindow,M3SignalRankedQuery,M3SignalExactIntegerDistance,M3SignalNearestBoolean".split(",")
          total = 0
          for suite in suites:
              path = report_dir / ("TEST-com.m3.collections." + suite + "Test.xml")
              if not path.is_file():
                  raise SystemExit("Missing owning JUnit XML: " + str(path))
              element = ET.parse(path).getroot()
              tests = int(element.attrib.get("tests", "0"))
              failures = int(element.attrib.get("failures", "0"))
              errors = int(element.attrib.get("errors", "0"))
              skipped = int(element.attrib.get("skipped", "0"))
              if tests < 1 or failures or errors or skipped:
                  raise SystemExit(f"JUnit not qualified: {path}, tests={tests}, failures={failures}, errors={errors}, skipped={skipped}")
              total += tests
          print(f"PASS original signal JUnit classes={len(suites)} executed_tests={total}")
          PY
