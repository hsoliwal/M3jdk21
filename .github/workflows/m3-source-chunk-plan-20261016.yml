# SPDX-License-Identifier: Apache-2.0
name: M3 bounded source chunk windows Java21 and existing JNI
on:
  pull_request:
    paths:
      - 'm3/ports/capability-runtime/src/main/java/com/m3/runtime/capability/SourceChunkPlan.java'
      - 'm3/ports/capability-runtime/src/test/java/com/m3/runtime/capability/SourceChunkPlanChecks.java'
      - 'm3/ports/capability-runtime/src/test/java/com/m3/runtime/proof/SourceChunkPlanImageSmoke.java'
      - 'm3/ports/capability-runtime/source-chunk-plan/**'
      - '.github/workflows/m3-source-chunk-plan-20261016.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-java-c11-jni-existing-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: m3/ports/capability-runtime
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Preserve existing ABI; run independent chunk geometry and linked JDK image
        run: |
          python3 m3/ports/capability-runtime/source-chunk-plan/verify.py --root m3/ports/capability-runtime --out "$RUNNER_TEMP/m3-chunk-geometry"
          grep -q M3_SOURCE_CHUNK_PLAN_PASS "$RUNNER_TEMP/m3-chunk-geometry/chunk-java-oracle.log"
          grep -q M3_SOURCE_CHUNK_PLAN_PASS "$RUNNER_TEMP/m3-chunk-geometry/chunk-jni-oracle.log"
          grep -q M3_SOURCE_CHUNK_PLAN_IMAGE_PASS "$RUNNER_TEMP/m3-chunk-geometry/linked-image-chunk-smoke.log"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-source-chunk-geometry-jni
          path: ${{ runner.temp }}/m3-chunk-geometry/
          if-no-files-found: error
  windows-java21-no-wsl:
    runs-on: windows-2022
    timeout-minutes: 50
    steps:
      - name: Admit OpenJDK long paths
        shell: pwsh
        run: git config --global core.longpaths true
      - uses: actions/checkout@v4
        with:
          sparse-checkout: m3/ports/capability-runtime
          sparse-checkout-cone-mode: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Java21 source, fixed policy, image proof, no WSL
        shell: pwsh
        run: |
          python m3/ports/capability-runtime/source-chunk-plan/verify.py --root m3/ports/capability-runtime --out "${{ runner.temp }}/m3-source-chunk-java" --java-only
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
