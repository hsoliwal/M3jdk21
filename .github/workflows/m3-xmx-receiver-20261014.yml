name: M3 Actual Xmx Source Receiver

on:
  pull_request:
    paths:
      - 'm3/collections/src/test/java/com/m3/collections/M3ObjectResidencyRuntimePressureTest.java'
      - 'm3/compatibility/synexia-xmx-memory-receiver-20261014.tsv'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3XmxReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3XmxReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-xmx-receiver/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/m3-xmx-receiver/**'
      - 'm3/tooling/migration-recipes/tasks/xmx-receiver-20261014/**'
      - '.github/workflows/m3-xmx-receiver-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-custody:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify byte-identical Synexia postimages
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          r=Path('.')
          pairs=[
              ('m3/collections/src/test/java/com/m3/collections/M3ObjectResidencyRuntimePressureTest.java',
               'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-xmx-receiver/M3ObjectResidencyRuntimePressureTest.java.txt',
               'bf05ea2b323a83f5c1569bc88d0d5417093df8d1e7f88c00f6831e27e276a4b5'),
              ('m3/compatibility/synexia-xmx-memory-receiver-20261014.tsv',
               'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned-text/m3-xmx-receiver/receiver.tsv.txt',
               'ab5ee0eb73ffb562402b9f6eabd73551a677330c64a24f4d23d89e52081c325f')
          ]
          for a,b,sha in pairs:
              data=(r/a).read_bytes()
              assert data==(r/b).read_bytes(), a+' differs from recipe template'
              assert hashlib.sha256(data).hexdigest()==sha, a+' SHA mismatch'
          print('PASS: 2 target-only postimages exactly match recipe templates')
          PY

  target-collection-junit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3ObjectResidencyRuntimePressureTest test

  receiver-recipe-junit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3XmxReceiverRecipeTest test
      - run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Drewrite.activeRecipes=com.m3.rewrite.backport.M3XmxReceiverRecipe \
            rewrite:dryRun
