name: M3 Actual Xmx Source Receiver

on:
  pull_request:
    paths:
      - 'm3/collections/src/test/java/jdk/m3/collections/M3ObjectResidencyRuntimePressureTest.java'
      - 'm3/compatibility/m3-xmx-memory-receiver-20261014.tsv'
      - 'm3/tooling/migration-recipes/src/main/java/jdk/m3/rewrite/backport/M3XmxReceiverRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/backport/M3XmxReceiverRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/m3-xmx-receiver/**'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text/m3-xmx-receiver/**'
      - 'm3/tooling/migration-recipes/tasks/xmx-receiver-20261014/**'
      - '.github/workflows/m3-xmx-receiver-20261014.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-custody:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify byte-identical Synexia postimages
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          r=Path('.')
          pairs=[
              ('m3/collections/src/test/java/jdk/m3/collections/M3ObjectResidencyRuntimePressureTest.java',
               'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned/m3-xmx-receiver/M3ObjectResidencyRuntimePressureTest.java.txt',
               'a1853edb4d5cc50bb06febea0b6d3ad80552e331820dd89cd577cea1caae13bf'),
              ('m3/compatibility/m3-xmx-memory-receiver-20261014.tsv',
               'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text/m3-xmx-receiver/receiver.tsv.txt',
               '29db93e78a99586cf08921f0a87643ccf854aef4f91d6bfac55ec704207ad902')
          ]
          for a,b,sha in pairs:
              data=(r/a).read_bytes()
              assert data==(r/b).read_bytes(), a+' differs from recipe template'
              assert hashlib.sha256(data).hexdigest()==sha, a+' SHA mismatch'
          print('PASS: 2 target-only postimages exactly match recipe templates')
          PY

  target-collection-junit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: |
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3ObjectResidencyRuntimePressureTest test

