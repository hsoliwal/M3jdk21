name: M3 counted collection continuation
on:
  push:
    branches: [aix/m3-counted-continuation-20261016]
  pull_request:
    paths:
      - 'm3/collections/**'
      - '.github/workflows/m3-counted-continuation.yml'
permissions:
  contents: read
concurrency:
  group: m3-counted-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  prepare-existing-proof-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            m3/collections
            m3/tooling/migration-recipes
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute existing recipe and retain exact receiver development inputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p proof/source/receiver proof/deps
          { git rev-parse HEAD; java -version 2>&1; mvn -version; } > proof/identity.txt
          mvn -B -ntp -f m3/collections/interop/recipe/pom.xml test org.apache.maven.plugins:maven-dependency-plugin:3.8.1:copy-dependencies -DincludeScope=test -DoutputDirectory="$GITHUB_WORKSPACE/proof/deps" 2>&1 | tee proof/existing-recipe.log
          cp -R m3/collections proof/source/receiver/
          cp -R m3/tooling/migration-recipes proof/source/receiver/
          curl --fail --location --retry 3 https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar -o proof/deps/junit-platform-console-standalone-1.12.2.jar
          echo '329bd10288875a74d04c9ca6b7c9889c265ddf87b21a9ea42a7f7392f391472a  proof/deps/junit-platform-console-standalone-1.12.2.jar' | sha256sum --check -
          find proof -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > proof/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: m3-counted-inputs-${{ github.event.pull_request.head.sha || github.sha }}
          path: proof/
          retention-days: 14
