name: M3 physical-state additive recovery Java21 JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexedListSnapshot.java'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3ObjectIndexSnapshot.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3PhysicalStateSnapshot*.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3ObjectPhysicalMask*.java'
      - '.github/workflows/m3-physical-state-superset-20261019.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current-owner-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify source-sealed exact additive postimages
        shell: bash
        run: |
          set -euo pipefail
          check() { actual=$(git hash-object "$2"); test "$actual" = "$1" || { echo "SOURCE DRIFT: $2 expected=$1 actual=$actual"; exit 1; }; }
          check cd26677723b21ad6ea425f2cb72d992101466476 m3/collections/src/main/java/jdk/m3/collections/M3IndexedListSnapshot.java
          check c32bb82f8348dcfe960794984b93a5ddc6823833 m3/collections/src/main/java/jdk/m3/collections/M3ObjectIndexSnapshot.java
          check 53b115468935270c0b03702b89b3fe84ee712068 m3/collections/src/test/java/jdk/m3/collections/M3ObjectPhysicalMaskSelfTest.java
          check 81a781a90a22fba34a6723b5fe2cf0cf83ec8208 m3/collections/src/test/java/jdk/m3/collections/M3ObjectPhysicalMaskTest.java
          check 623ba1592db286cbf6f138279be16a5536ac9909 m3/collections/src/test/java/jdk/m3/collections/M3PhysicalStateSnapshotProof.java
          check d8146199d8821c51380149cbdc128136106f4120 m3/collections/src/test/java/jdk/m3/collections/M3PhysicalStateSnapshotTest.java
      - name: Strict compile the current M3 collection owners and both direct proofs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-physical-additive/classes"
          mkdir -p "$out"
          find m3/collections/src/main/java/jdk/m3/collections -name '*.java' -print | sort > "$RUNNER_TEMP/m3-physical-additive-sources"
          javac --release 21 -proc:none -Xlint:all -Werror -encoding UTF-8 -d "$out" @"$RUNNER_TEMP/m3-physical-additive-sources"
          javac --release 21 -proc:none -Xlint:all -Werror -encoding UTF-8 -cp "$out" -d "$out" \
            m3/collections/src/test/java/jdk/m3/collections/M3ObjectPhysicalMaskSelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3PhysicalStateSnapshotProof.java
          java -Xcheck:jni -cp "$out" jdk.m3.collections.M3ObjectPhysicalMaskSelfTest
          java -Xcheck:jni -cp "$out" jdk.m3.collections.M3PhysicalStateSnapshotProof
      - name: Strict C17 JNI build and native-required differential
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-physical-additive/classes"
          native="$RUNNER_TEMP/m3-physical-additive/native"
          mkdir -p "$native"
          gcc -std=c17 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$native/libm3_collections_pathmask.so"
          java -Xcheck:jni -Djava.library.path="$native" -cp "$out" jdk.m3.collections.M3ObjectPhysicalMaskSelfTest --native
          java -Xcheck:jni -Djava.library.path="$native" -cp "$out" jdk.m3.collections.M3PhysicalStateSnapshotProof --native
