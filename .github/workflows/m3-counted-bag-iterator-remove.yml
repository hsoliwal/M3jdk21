name: M3 counted bag delivery and receiving contracts
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3CountedBag.java'
      - 'm3/collections/qualification/counted-bag-iterator-remove-20261018/**'
      - 'm3/collections/recipe/counted-bag-iterator-remove-20261018/**'
      - '.github/workflows/m3-counted-bag-iterator-remove.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: m3/collections
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile M3 owner and run Java and native contracts
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-counted-bag"
          mkdir -p "$M3_TASK_OUT/core" "$M3_TASK_OUT/proof" "$M3_TASK_OUT/native" "$M3_TASK_OUT/tmp"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          python -I -S -B m3/collections/qualification/counted-bag-iterator-remove-20261018/verify.py
          find m3/collections/src/main/java -name '*.java' | sort > "$M3_TASK_OUT/core.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -encoding UTF-8 -proc:none -Xlint:all,-module -Werror -d "$M3_TASK_OUT/core" @"$M3_TASK_OUT/core.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -proc:none -Xlint:all,-module -Werror -cp "$M3_TASK_OUT/core" -d "$M3_TASK_OUT/proof" m3/collections/qualification/counted-bag-iterator-remove-20261018/CountedBagIteratorProof.java m3/collections/src/test/java/com/m3/collections/M3CountedBagSelfTest.java
          gcc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" m3/collections/src/main/native/collections/m3_index_mask_compactor.c -o "$M3_TASK_OUT/native/libm3_collections_mask.so"
          M3_CP="$M3_TASK_OUT/proof:$M3_TASK_OUT/core"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_CP" CountedBagIteratorProof
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_CP" com.m3.collections.M3CountedBagSelfTest
          java -Xmx512m -XX:-UsePerfData -Xcheck:jni -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/native" -cp "$M3_CP" CountedBagIteratorProof native
          java -Xmx512m -XX:-UsePerfData -Xcheck:jni -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/native" -cp "$M3_CP" com.m3.collections.M3CountedBagSelfTest
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: m3/collections
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate exact inputs and run receiving Maven host
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-counted-bag-receiving"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/m2"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          export MAVEN_OPTS="-Xmx512m -XX:-UsePerfData -Djava.io.tmpdir=$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          python -I -S -B m3/collections/qualification/counted-bag-iterator-remove-20261018/verify.py
          mvn -B -ntp -f m3/collections/recipe/counted-bag-iterator-remove-20261018/pom.xml -Dmaven.repo.local="$M3_TASK_OUT/m2" -Dm3.recipe.output="$M3_TASK_OUT/target" test
