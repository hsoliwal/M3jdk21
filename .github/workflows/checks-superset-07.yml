  m3jdk8284315-doctrees__recipe-dag-proof:
    name: "M3 JDK-8284315 DocTrees bug-fix proof / recipe-dag-proof"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk8284315-doctrees'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JDK-8284315 DocTrees bug-fix proof-${{ github.ref }}-recipe-dag-proof"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: 1 - Diff hygiene
        run: git diff --check


      - name: 3 - Validate and project FILE -> MODULE -> LIBRARY_API packet
        shell: bash
        run: |
          set -euo pipefail
          OUT="$PWD/target/jdk-8284315-orchestration"
          mkdir -p "$OUT"
          mvn -B -ntp -f m3/tooling/backport-dag/pom.xml \
            -Dexec.mainClass=jdk.m3.tooling.dag.OrchestrationProjectionMain \
            -Dexec.args="$PWD/m3/backports/recipes/jdk-8284315/packet.tsv $OUT" \
            exec:java
          test -s "$OUT/M3BackportRoutes.java"
          test -s "$OUT/m3_backport_dag.py"
          test -s "$OUT/m3_backport_rules.drl"
          test -s "$OUT/projection.tsv"
          ROOT="$(tail -n 1 "$OUT/projection.tsv" | cut -f2)"
          test "${#ROOT}" -eq 64
          grep -F "$ROOT" "$OUT/M3BackportRoutes.java"
          grep -F "$ROOT" "$OUT/m3_backport_dag.py"
          grep -F "$ROOT" "$OUT/m3_backport_rules.drl"
          grep -F $'library-api-join\tLIBRARY_API' m3/backports/recipes/jdk-8284315/packet.tsv

      - name: Upload orchestration projections
        uses: actions/upload-artifact@v4
        with:
          name: jdk-8284315-orchestration-${{ github.run_id }}
          path: target/jdk-8284315-orchestration/**
          if-no-files-found: error
          retention-days: 14

  m3jdk8284315-doctrees__langtools-image-and-jtreg:
    name: "M3 JDK-8284315 DocTrees bug-fix proof / langtools-image-and-jtreg"
    needs: ["gate", "m3jdk8284315-doctrees__recipe-dag-proof"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3jdk8284315-doctrees'] }}"
    permissions:
      contents: read
    concurrency:
      group: "M3 JDK-8284315 DocTrees bug-fix proof-${{ github.ref }}-langtools-image-and-jtreg"
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Install OpenJDK build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: Configure Java 21-compatible M3JDK image
        run: |
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: Build image
