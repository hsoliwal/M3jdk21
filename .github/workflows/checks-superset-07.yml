  m3-smart-build-receiver__receiver:
    name: "M3JDK21 SmartBuild receiver / receiver"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-smart-build-receiver'] }}"
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Diff
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
      - name: Java 21 zero-runtime-dependency receiver tests
        run: mvn -B -ntp -f m3/tooling/smart-build/pom.xml verify
      - name: Verify 3 executed unskipped JUnit cases
        shell: bash
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          p = Path('m3/tooling/smart-build/target/surefire-reports/TEST-jdk.m3.tooling.smartbuild.SmartBuildReceiverTest.xml')
          if not p.is_file():
              raise SystemExit(f'missing receiver test report: {p}')
          suite = ET.parse(p).getroot()
          fields = {k: int(suite.get(k, '0')) for k in ('tests', 'errors', 'failures', 'skipped')}
          if fields != {'tests': 3, 'errors': 0, 'failures': 0, 'skipped': 0}:
              raise SystemExit(f'unclean receiver receipt: {fields}')
          print('M3_SMART_BUILD_RECEIVER_JAVA21_PASS', fields)
          PY
      - name: Preserve receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-smart-build-receiver-junit
          retention-days: 14
          if-no-files-found: warn
          path: m3/tooling/smart-build/target/surefire-reports/

