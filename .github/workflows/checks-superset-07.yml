          XDG_DATA_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/data
          M3_JAVA_HOME: ${{ steps.preflight.outputs.java }}
          M3_PYTHON: ${{ steps.preflight.outputs.python }}
          M3_PYTHON_BIN: ${{ steps.preflight.outputs.python-bin }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_OPTIONAL_LOCKS: '0'
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import hashlib,json,os,pathlib,re,shutil,signal,subprocess,time
          reserve,cap=8*1024**3,512*1024**2
          root=pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source=pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          start=time.monotonic()
          def traversal_error(error):raise RuntimeError("storage census failed") from error
          def gate(limit=480*1024**2):
              used=0
              for base in (pathlib.Path(os.environ["RUNNER_TEMP"]),source):
                  if not base.is_dir() or base.is_symlink():raise RuntimeError("missing/redirected storage")
                  for folder,names,files in os.walk(base,followlinks=False,onerror=traversal_error):
                      for name in names+files:
                          try:info=os.lstat(pathlib.Path(folder)/name)
                          except FileNotFoundError:continue
                          used+=max(info.st_size,info.st_blocks*512)
              if used>limit:raise RuntimeError("512MiB aggregate task limit (32MiB artifact reserve)")
              for base in (root,source):
                  st=os.statvfs(base)
                  if st.f_bavail*st.f_frsize<reserve+cap-used:raise RuntimeError("8GiB-after-output reserve")
              return used
          def getgit(*args):
              return subprocess.check_output(["git",*args],cwd=source,text=True,timeout=15).strip()
          gate()
          head=getgit("rev-parse","HEAD")
          if head!=os.environ["EXPECTED_SOURCE_SHA"] or not re.fullmatch("[0-9a-f]{40}",head):raise RuntimeError("checkout is not exact candidate head")
          env=os.environ.copy()
          for name in list(env):
              if name in ("GITHUB_TOKEN","GH_TOKEN") or name.startswith(("PIP_","PYTHON","MAVEN_","JAVA_TOOL_OPTIONS","JDK_JAVA_OPTIONS")):env.pop(name,None)
          env.update(HOME=str(root/"home"),USERPROFILE=str(root/"home"),MAVEN_USER_HOME=str(root/"home/.m2"),TMPDIR=str(root/"tmp"),TEMP=str(root/"tmp"),TMP=str(root/"tmp"),JAVA_HOME=os.environ["M3_JAVA_HOME"],PATH=os.environ["M3_PYTHON_BIN"]+os.pathsep+os.environ["M3_JAVA_HOME"]+"/bin"+os.pathsep+env["PATH"],MAVEN_OPTS="-Xmx512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir="+str(root/"tmp")+" -Duser.home="+str(root/"home"),JAVA_TOOL_OPTIONS="-Dfile.encoding=UTF-8 -Djava.io.tmpdir="+str(root/"tmp")+" -Duser.home="+str(root/"home")+" -XX:+PerfDisableSharedMem",PIP_CONFIG_FILE=os.devnull,PIP_DISABLE_PIP_VERSION_CHECK="1",PIP_NO_CACHE_DIR="1",PYTHONDONTWRITEBYTECODE="1",GIT_OPTIONAL_LOCKS="0",GIT_NO_LAZY_FETCH="1",GIT_TERMINAL_PROMPT="0")
          records=[]
          log=root/"qualification.log"
          def cleanup(child):
              # Every descendant inherits this owned session; bootstrap creates no nested sessions.
              for sig,seconds in ((signal.SIGTERM,2),(signal.SIGKILL,3)):
                  try:os.killpg(child.pid,sig)
                  except ProcessLookupError:pass
                  end=time.monotonic()+seconds
                  while time.monotonic()<end:
                      try:os.killpg(child.pid,0)
                      except ProcessLookupError:return
                      time.sleep(.05)
              raise RuntimeError("owned process group terminal state unproved")
          def run(name,command,deadline=300):
              if time.monotonic()-start>720:raise RuntimeError("global deadline before launch")
              gate()
              child=None;code=None
              with log.open("ab") as out:
                  try:
                      child=subprocess.Popen(command,cwd=source,env=env,stdin=subprocess.DEVNULL,stdout=out,stderr=subprocess.STDOUT,start_new_session=True)
                      command_start=time.monotonic()
                      while child.poll() is None:
                          gate()
                          if time.monotonic()-command_start>deadline or time.monotonic()-start>720:raise RuntimeError("owned command deadline")
                          time.sleep(.5)
                      code=child.wait()
                      if time.monotonic()-start>720:raise RuntimeError("global deadline after child exit")
                  finally:
                      if child is not None:
                          if child.poll() is None:
                              try:os.killpg(child.pid,signal.SIGTERM)
                              except ProcessLookupError:pass
                              try:child.wait(timeout=2)
                              except subprocess.TimeoutExpired:
                                  try:os.killpg(child.pid,signal.SIGKILL)
                                  except ProcessLookupError:pass
                                  child.wait(timeout=5)
                          cleanup(child)
                          records.append({"name":name,"returncode":child.returncode,"parentReaped":True,"ownedSessionAbsent":True})
              gate()
              if code:raise RuntimeError(name+" failed with "+str(code))
          py=[os.environ["M3_PYTHON"],"-I","-S","-B"]
          env["M3_QUALIFICATION_ROOT"]=str(root)
          try:
              run("actual-offline-maven-model-contract",py+[str(source/"m3/tooling/tq-sync/source-reactor/test_reactor.py")],deadline=300)
              receipt=json.loads((root/"model-receipt.json").read_bytes())
              if receipt["tests"]!=6 or receipt["failures"] or receipt["errors"] or receipt["skips"] or receipt["successful"] is not True:raise RuntimeError("nonzero exact six method qualification required")
              if any(receipt[key] is not False for key in ("compiled","tqJUnitQualified","originalModelQualified","runtimeJniQualified","matchedJdkQualified","phaseAdvanced")):raise RuntimeError("model-only scope drift")
              hosted={"schema":"M3_SOURCE_QUALIFIED_TQ_HOSTED_V1","checkoutCommit":head,"commands":records,"modelReceiptSha256":hashlib.sha256((root/"model-receipt.json").read_bytes()).hexdigest(),"mavenOffline":True,"aggregateBytes":gate(),"compiled":False,"phaseAdvanced":False}
              (root/"hosted-receipt.json").write_text(json.dumps(hosted,indent=2)+"\n",encoding="utf-8")
          finally:
              tail=b""
              if log.is_file() and not log.is_symlink():
                  with log.open("rb") as f:f.seek(max(0,log.stat().st_size-32768));tail=f.read(32768)
              before=gate(496*1024**2)
              selected=[root/"model-receipt.json",root/"hosted-receipt.json",root/"toolchain.log"]
              selected+=sorted(root.glob("selected57.log"))+sorted(root.glob("missing-*.log"))+sorted(root.glob("stale-producer.log"))
              selected=[p for p in selected if p.is_file()]
              if len(selected)>16 or any(p.is_symlink() for p in selected):raise RuntimeError("artifact source fence")
              planned=sum(p.stat().st_size for p in selected)+len(tail)
              if planned>1024**2 or before+planned+1024**2>496*1024**2:raise RuntimeError("artifact budget")
              bundle=root/"artifacts";bundle.mkdir(exist_ok=False)
              for path in selected:
                  gate(496*1024**2);shutil.copyfile(path,bundle/path.name)
              (bundle/"log-tail.txt").write_bytes(tail)
              (bundle/"commands.json").write_text(json.dumps(records,indent=2)+"\n",encoding="utf-8")
              print(tail.decode("utf-8",errors="replace"))
              print("Final aggregate bytes before artifact upload:",gate(496*1024**2))
          PY
      - name: Retain bounded Maven model receipts and failure tail
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-source-qualified-tq-model-source
          TMPDIR: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/data
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-source-qualified-tq-model-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          include-hidden-files: true
          compression-level: 0
          retention-days: 90
          if-no-files-found: error

  m3-caller-visible-damage-20261112__qualification:
    name: "M3 caller visible-damage qualification / ${{ matrix.lane }}"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['m3-caller-visible-damage-20261112'] }}"
    permissions:
      contents: read
    env:
      MODULE: "m3/ports/swing-viewport"
      RECIPE: "m3/ports/swing-viewport/webwidgets/recipes/caller-visible-damage-20261112"
    concurrency:
      group: "m3-caller-visible-damage-${{ github.ref }}-${{ strategy.job-index }}"
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane: [caller, frozen18]
    steps:
      - name: Admit storage and establish bounded output
        shell: bash
        run: |
          set -euo pipefail
          test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -n1)" -ge $((8589934592 + 536870912))
          root="$RUNNER_TEMP/m3-caller-${{ matrix.lane }}"
          test ! -e "$root"
          mkdir -p "$root"/{logs,tmp,home,cache,repository}
          {
            echo "ROOT=$root"
            echo "OUT=$root/classes"
            echo "JUNIT_OUT=$root/junit"
            echo "XDG_CACHE_HOME=$root/cache"
            echo "JAVA_TOOL_OPTIONS=-Duser.home=$root/home -Djava.io.tmpdir=$root/tmp"
            echo "BASH_ENV=$root/guard.bash"
          } >> "$GITHUB_ENV"
          cat > "$root/guard.bash" <<'BASH'
          budget_ok() {
            local used free
            used=$(du -s -B1 "$ROOT" | cut -f1)
            free=$(df --output=avail -B1 "$ROOT" | tail -n1)
            test "$used" -le 536870912 &&
              test "$free" -ge "$((8589934592 + 536870912 - used))"
          }
          run_budgeted() {
            local name=$1 owned code
            shift
            budget_ok || return 75
            setsid "$@" > "$ROOT/logs/$name.log" 2>&1 &
            owned=$!
            while kill -0 "$owned" 2>/dev/null; do
              if ! budget_ok; then
                echo "Storage budget breach: owned group $owned" >> "$ROOT/logs/budget.log"
                kill -TERM -- "-$owned" 2>/dev/null || true
                sleep 1
                kill -KILL -- "-$owned" 2>/dev/null || true
                wait "$owned" 2>/dev/null || true
                echo 75 > "$ROOT/logs/$name.exit"
                cat "$ROOT/logs/$name.log"
                return 75
              fi
              sleep 1
            done
            if wait "$owned"; then code=0; else code=$?; fi
            echo "$code" > "$ROOT/logs/$name.exit"
            cat "$ROOT/logs/$name.log" || return 76
            budget_ok || return 75
            return "$code"
          }
          BASH
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/ports/swing-viewport/
            /m3/vendor/third_party/opentest4j/
            /m3/vendor/third_party/apiguardian-api/
            /m3/vendor/third_party/junit-platform-commons-1.10.2/
            /m3/vendor/third_party/junit-platform-engine-1.10.2/
            /m3/vendor/third_party/junit-platform-launcher-1.10.2/
            /m3/vendor/third_party/junit-jupiter-api-5.10.2/
            /m3/vendor/third_party/junit-jupiter-engine-5.10.2/
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Record exact receiving source
        shell: bash
        run: |
          set -euo pipefail
          budget_ok
          echo "M3JDK21=$JAVA_HOME" >> "$GITHUB_ENV"
          {
            git rev-parse HEAD
            git rev-parse "HEAD:$MODULE"
          } > "$ROOT/logs/source.txt"
      - name: Qualify producer, strict compilation, protected API and replay
        if: matrix.lane == 'caller'
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted producer-qualify mvn -B -ntp -f "$RECIPE/pom.xml" \
            "-Dmaven.repo.local=$ROOT/repository" \
            "-Dm3.caller.receiverRoot=$GITHUB_WORKSPACE" \
            "-Dm3.caller.recipeRoot=$GITHUB_WORKSPACE/$RECIPE" \
            "-Dm3.caller.outputRoot=$ROOT/qualify" \
            -Dm3.caller.mode=qualify verify
      - name: Refuse changed context before generation
        if: matrix.lane == 'caller'
        shell: bash
        run: |
          set -euo pipefail
          cp -R "$RECIPE" "$ROOT/negative-recipe"
          python3 -I -S -B - "$ROOT/negative-recipe/bindings.tsv" <<'PY'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          rows = p.read_text().splitlines()
          for i, row in enumerate(rows):
              cols = row.split("\t")
              if cols[0] == "context":
                  cols[2] = cols[3] = "0" * 64
                  rows[i] = "\t".join(cols)
                  break
          else:
              raise AssertionError("context binding missing")
          p.write_text("\n".join(rows) + "\n")
          PY
          if run_budgeted context-drift mvn -B -ntp -f "$ROOT/negative-recipe/pom.xml" \
            "-Dmaven.repo.local=$ROOT/repository" \
            "-Dm3.caller.receiverRoot=$GITHUB_WORKSPACE" \
            "-Dm3.caller.recipeRoot=$ROOT/negative-recipe" \
            "-Dm3.caller.outputRoot=$ROOT/negative-output" \
            -Dm3.caller.mode=qualify verify
          then
            echo "Drift was incorrectly admitted" >&2
            exit 1
          else
            status=$?
          fi
          test "$status" -ne 75
          test ! -e "$ROOT/negative-output/selected-producer"
          grep -q 'input drift' "$ROOT/negative-output/jshell.stderr.log"
      - name: Refuse ledger drift before generating Java
        if: matrix.lane == 'caller'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$ROOT/ledger-drift-receiver"
          ledger="$MODULE/webwidgets/GENERATED.tsv"
          main="$MODULE/src/main/java/jdk/m3/swing/web/model/M3WebLanes.java"
          checks="$MODULE/src/test/java/jdk/m3/swing/web/model/M3WebChecks.java"
          for file in "$ledger" "$main" "$checks"; do
            mkdir -p "$fixture/$(dirname "$file")"
            cp "$file" "$fixture/$file"
          done
          printf '# deliberate unrelated-byte drift\n' >> "$fixture/$ledger"
          sha256sum "$fixture/$main" "$fixture/$checks" > "$ROOT/logs/ledger-drift-source-before.sha256"
          if run_budgeted ledger-preflight mvn -B -ntp -f "$RECIPE/pom.xml" \
            "-Dmaven.repo.local=$ROOT/repository" \
            "-Dm3.caller.receiverRoot=$fixture" \
            "-Dm3.caller.recipeRoot=$GITHUB_WORKSPACE/$RECIPE" \
            "-Dm3.caller.outputRoot=$ROOT/ledger-drift-output" \
            -Dm3.caller.mode=apply verify
          then
            echo "Drifted ledger was incorrectly admitted" >&2
            exit 1
          else
            status=$?
          fi
          test "$status" -ne 75
          grep -q 'Unadmitted GENERATED.tsv preimage' "$ROOT/logs/ledger-preflight.log"
          test ! -e "$ROOT/ledger-drift-output/selected-producer"
          sha256sum -c "$ROOT/logs/ledger-drift-source-before.sha256"
      - name: Apply selected outputs through the existing producer
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted producer-apply mvn -B -ntp -f "$RECIPE/pom.xml" \
            "-Dmaven.repo.local=$ROOT/repository" \
            "-Dm3.caller.receiverRoot=$GITHUB_WORKSPACE" \
            "-Dm3.caller.recipeRoot=$GITHUB_WORKSPACE/$RECIPE" \
            "-Dm3.caller.outputRoot=$ROOT/apply" \
            -Dm3.caller.mode=apply verify
          main="$MODULE/src/main/java/jdk/m3/swing/web/model/M3WebLanes.java"
          checks="$MODULE/src/test/java/jdk/m3/swing/web/model/M3WebChecks.java"
          mkdir -p "$ROOT/generated-known"
          cp "$main" "$ROOT/generated-known/M3WebLanes.java"
          cp "$checks" "$ROOT/generated-known/M3WebChecks.java"
          cmp "$main" "$ROOT/generated-known/M3WebLanes.java"
          cmp "$checks" "$ROOT/generated-known/M3WebChecks.java"
          cp "$MODULE/webwidgets/GENERATED.tsv" "$ROOT/generated-known/GENERATED.tsv"
          cmp "$MODULE/webwidgets/GENERATED.tsv" "$ROOT/generated-known/GENERATED.tsv"
          sha256sum "$ROOT/generated-known/"*.java "$ROOT/generated-known/GENERATED.tsv" > "$ROOT/logs/generated-sha256.txt"
          git hash-object "$main" "$checks" > "$ROOT/logs/generated-git-blobs.txt"
          cat "$ROOT/logs/generated-sha256.txt"
          budget_ok
      - name: Expose bounded producer controller reports
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          for dir in qualify apply negative-output; do
            for name in jshell.stdout.log jshell.stderr.log ledger.stdout.log ledger.stderr.log selected-producer/RESULT.tsv manifest/RESULT.tsv; do
              file="$ROOT/$dir/$name"
              if test -f "$file"; then
                echo "$dir/$name"
                head -c 65536 "$file"
              fi
            done
          done
      - name: Compile existing source JUnit and generated module
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted source-compile bash "$MODULE/run-tests.sh" compile
      - name: Execute seven existing caller tests
        if: matrix.lane == 'caller'
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted caller7 "$JAVA_HOME/bin/java" -Xmx768m -Djava.awt.headless=true \
            -cp "$OUT/main:$OUT/test:$JUNIT_OUT" jdk.m3.swing.testkit.M3JUnitLauncher \
            --select-class jdk.m3.swing.web.model.M3CollectionModesTest
          grep -Eq '^\[[[:space:]]*7 tests found[[:space:]]*\]$' "$ROOT/logs/caller7.log"
          grep -Eq '^\[[[:space:]]*7 tests successful[[:space:]]*\]$' "$ROOT/logs/caller7.log"
      - name: Execute full public suite and retain actual failures
        if: always() && matrix.lane == 'caller' && steps.compile.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          run_budgeted public-suite "$JAVA_HOME/bin/java" -Xmx768m -Djava.awt.headless=true \
            -cp "$OUT/main:$OUT/test:$JUNIT_OUT" jdk.m3.swing.testkit.M3JUnitLauncher --scan "$OUT/test"
      - name: Compile unchanged approved eighteen-test fixture separately
        if: matrix.lane == 'frozen18'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RECIPE/fixtures/M3ViewportCoreApiTest.approved18.java.txt"
          seal=ba22b2bf42b059ab93d906383d52c16b96be6f2cdbd3e49bade4ed3d473e8522
          printf '%s  %s\n' "$seal" "$fixture" | sha256sum -c -
          mkdir -p "$ROOT/oracle-src" "$ROOT/oracle"
          cp "$fixture" "$ROOT/oracle-src/M3ViewportCoreApiTest.java"
          printf '%s  %s\n' "$seal" "$ROOT/oracle-src/M3ViewportCoreApiTest.java" | sha256sum -c -
          run_budgeted oracle-compile "$JAVA_HOME/bin/javac" --release 21 -proc:none \
            -cp "$OUT/main:$OUT/test:$JUNIT_OUT" -d "$ROOT/oracle" "$ROOT/oracle-src/M3ViewportCoreApiTest.java"
      - name: Execute all eighteen unchanged expectations
        if: matrix.lane == 'frozen18'
        shell: bash
        run: |
          set -euo pipefail
          if run_budgeted approved18 "$JAVA_HOME/bin/java" -Xmx768m -Djava.awt.headless=true \
            -cp "$ROOT/oracle:$OUT/main:$OUT/test:$JUNIT_OUT" jdk.m3.swing.testkit.M3JUnitLauncher \
            --select-class jdk.m3.swing.viewport.M3ViewportCoreApiTest
          then
            status=0
          else
            status=$?
          fi
          grep -Eq '^\[[[:space:]]*18 tests found[[:space:]]*\]$' "$ROOT/logs/approved18.log"
          if test "$status" -eq 0; then
            grep -Eq '^\[[[:space:]]*18 tests successful[[:space:]]*\]$' "$ROOT/logs/approved18.log"
          fi
          exit "$status"
      - name: Require committed generator postimages after behavioral tests
        if: always() && matrix.lane == 'caller' && steps.apply.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          run_budgeted committed-postimages git diff --exit-code -- \
            "$MODULE/src/main/java/jdk/m3/swing/web/model/M3WebLanes.java" \
            "$MODULE/src/test/java/jdk/m3/swing/web/model/M3WebChecks.java" \
            "$MODULE/webwidgets/GENERATED.tsv"
      - name: Retain actual generated files, receipts and failure status
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-caller-${{ matrix.lane }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/logs/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/generated-known/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/qualify/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/apply/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/negative-output/
            ${{ runner.temp }}/m3-caller-${{ matrix.lane }}/ledger-drift-output/

  collection-views-convergence__actual-java-base-classes:
    name: "Collection views contracts / actual-java-base-classes"
    needs: ["gate"]
    if: "${{ fromJSON(needs.gate.outputs.run || '{}')['collection-views-convergence'] }}"
    permissions:
      contents: read
    concurrency:
      group: "Collection views contracts-${{ github.ref }}"
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: |
            src/java.base/share/classes/java/util/CollectionViews.java
            test/jdk/java/util/CollectionViews
          sparse-checkout-cone-mode: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile actual modified java.base source using Java 21 module patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH_SOURCE="${RUNNER_TEMP}/m3-java-base-source"
