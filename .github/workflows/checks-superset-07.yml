            jdk.m3.tools.cpu.M3RunLengthPostingIndex \
            jdk.m3.tools.cpu.M3RunLengthPostingIndexNative \
            jdk.m3.tools.cpu.M3IntIntervalSet \
            jdk.m3.tools.cpu.M3IntIntervalSetNative | tee "$OUT/logs/public-api.log"
          grep -F 'Java_jdk_m3_tools_cpu_M3RunLengthPostingIndexNative_batchCounts0' "$OUT/headers/"*.h
          grep -F 'Java_jdk_m3_tools_cpu_M3IntIntervalSetNative_contains0' "$OUT/headers/"*.h
          echo 'M3JDK21_WAVE21_JAVA21_HEADER_COMPILE_PASS'
