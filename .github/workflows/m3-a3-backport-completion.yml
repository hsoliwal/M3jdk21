name: M3 A3 backport completion fan-in

on:
  pull_request:
    paths:
      - "m3/tooling/a3/**"
      - "m3/backports/inventory.py"
      - "m3/backports/compatibility_queue.py"
      - "m3/docs/a3-backport-completion.md"
      - ".github/workflows/m3-a3-backport-completion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  completion:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Bootstrap pinned source-built OpenRewrite and JUnit closure
        shell: bash
        run: |
          set -euo pipefail
          bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"

      - name: Install canonical Synexia A3 recipe export
        shell: bash
        env:
          SYNEXIA_A3_COMMIT: 66684406873953ee7ffa8ba9cd5058338fce10d7
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            "https://codeload.github.com/hsoliwal/com.synexia/tar.gz/${SYNEXIA_A3_COMMIT}" \
            -o "$RUNNER_TEMP/synexia-a3.tar.gz"
          mkdir -p "$RUNNER_TEMP/synexia-a3"
          tar -xzf "$RUNNER_TEMP/synexia-a3.tar.gz" \
            -C "$RUNNER_TEMP/synexia-a3" --strip-components=1
          mvn -B -ntp \
            -f "$RUNNER_TEMP/synexia-a3/synexia-openrewrite-recipes/pom-jdk-a3-export.xml" \
            install

      - name: Verify A3 fan-in implementation
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/pom.xml -pl tooling/a3 -am clean verify

      - name: Fetch OpenJDK 21-27 GA tags
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM="$RUNNER_TEMP/upstream-jdk"
          git init -q "$UPSTREAM"
          git -C "$UPSTREAM" remote add origin https://github.com/openjdk/jdk.git
          git -C "$UPSTREAM" -c protocol.version=2 fetch \
            --filter=blob:none --no-tags origin \
            refs/tags/jdk-21+35:refs/tags/jdk-21+35 \
            refs/tags/jdk-22+36:refs/tags/jdk-22+36 \
            refs/tags/jdk-23+37:refs/tags/jdk-23+37 \
            refs/tags/jdk-24+36:refs/tags/jdk-24+36 \
            refs/tags/jdk-25+36:refs/tags/jdk-25+36 \
            refs/tags/jdk-26+35:refs/tags/jdk-26+35 \
            refs/tags/jdk-27+35:refs/tags/jdk-27+35
          printf 'UPSTREAM=%s\n' "$UPSTREAM" >> "$GITHUB_ENV"

      - name: Generate complete upstream inventory and compatibility queue
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/build/backports
          python3 m3/backports/inventory.py \
            --repo "$UPSTREAM" \
            --out m3/build/backports/UPSTREAM_CHANGES.tsv
          python3 m3/backports/compatibility_queue.py \
            --inventory m3/build/backports/UPSTREAM_CHANGES.tsv \
            --out m3/build/backports/COMPATIBILITY_QUEUE.tsv
          ROWS="$(awk -F '\t' 'NR > 1 {n++} END {print n+0}' m3/build/backports/UPSTREAM_CHANGES.tsv)"
          test "$ROWS" -eq 14948

      - name: Mavenize current tree and fan in complete queue
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/tooling/a3/pom.xml \
            -Pm3-a3-backport-completion \
            -Dm3.a3.root="$PWD" \
            -Dm3.a3.queue=m3/build/backports/COMPATIBILITY_QUEUE.tsv \
            -Dm3.a3.completion.out=m3/build/a3/completion \
            verify
          test -s m3/build/a3/completion/work.tsv
          test -s m3/build/a3/completion/receipt.tsv
          test -f m3/build/a3/completion/java-preparation-paths.txt
          test -s m3/build/a3/completion/scope-holds.tsv
          grep -F $'\tfalse\tfalse' m3/build/a3/completion/receipt.tsv

      - name: Upload complete preparation frontier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-a3-backport-completion-${{ github.run_id }}
          path: |
            m3/build/backports/UPSTREAM_CHANGES.tsv
            m3/build/backports/COMPATIBILITY_QUEUE.tsv
            m3/build/a3/inventory.tsv
            m3/build/a3/completion/**
          if-no-files-found: error
          retention-days: 30
