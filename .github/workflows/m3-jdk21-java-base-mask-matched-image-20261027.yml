# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 java.base mask source-built image and jtreg
# Build the actual M3JDK21 image for changes to this java.base owner.
# No successful host-JDK --patch-module run substitutes for this acceptance gate.
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/mindex/M3CollectionMaskCompactor.java'
      - 'test/jdk/java/util/ArrayList/M3CollectionMaskCompactorContract.java'
      - 'test/jdk/java/util/ArrayList/M3ArrayListVectorRemoveIfContract.java'
      - '.github/workflows/m3-jdk21-java-base-mask-matched-image-20261027.yml'
  workflow_dispatch:
concurrency:
  group: m3jdk21-mask-full-image-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  matched-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      M3_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install complete X11 build headers and required jtreg 7.3.1
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential autoconf zip unzip curl \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
          # Ubuntu 24.04 apt jtreg is 5.1. OpenJDK configure demands >=7.2.
          # Fetch a named 7.3.1+1 distribution and check the published digest.
          mkdir -p "$RUNNER_TEMP/jtreg-dist"
          curl -fsSL --retry 3 \
            'https://builds.shipilev.net/jtreg/jtreg-7.3.1+1.zip' \
            -o "$RUNNER_TEMP/jtreg-dist/jtreg-7.3.1+1.zip"
          curl -fsSL --retry 3 \
            'https://builds.shipilev.net/jtreg/SHA1SUMS' \
            -o "$RUNNER_TEMP/jtreg-dist/SHA1SUMS"
          # The upstream manifest may also contain a SHA1SUMS self-entry.
          # Verify exactly one named archive record, not unrelated manifest rows.
          archive_receipt=$(grep -E \
            '^[[:xdigit:]]{40} [ *]jtreg-7[.]3[.]1[+]1[.]zip$' \
            "$RUNNER_TEMP/jtreg-dist/SHA1SUMS")
          test "$(printf '%s\n' "$archive_receipt" | wc -l)" -eq 1
          ( cd "$RUNNER_TEMP/jtreg-dist" && printf '%s\n' "$archive_receipt" | sha1sum -c - )
          unzip -q "$RUNNER_TEMP/jtreg-dist/jtreg-7.3.1+1.zip" -d "$RUNNER_TEMP/jtreg-unpacked"
          mapfile -t jtreg_jars < <(find "$RUNNER_TEMP/jtreg-unpacked" \
            -type f -path '*/lib/jtreg.jar' | sort)
          if [[ "${#jtreg_jars[@]}" -ne 1 ]]; then
            echo "REFUSAL expected one jtreg.jar, found ${#jtreg_jars[@]}" >&2
            exit 1
          fi
          JT_HOME=$(dirname "$(dirname "${jtreg_jars[0]}")")
          echo "JT_HOME=$JT_HOME" >> "$GITHUB_ENV"
          "$JAVA_HOME/bin/java" -jar "$JT_HOME/lib/jtreg.jar" -version
          java -version
      - name: Recheck sealed in-JDK owner and current java.util callers
        shell: bash
        run: bash m3/collections/qualification/java-base-mask-current-master-20261027/verify.sh
      - name: Build full M3JDK21 fastdebug source image
        shell: bash
        run: |
          set -euo pipefail
          export M3_BOOT_JDK="$JAVA_HOME"
          bash m3/build-openjdk.sh
          mapfile -t images < <(find build -type f -path '*/images/jdk/bin/java' -print | sort)
          if [[ "${#images[@]}" -ne 1 ]]; then
            echo "REFUSAL expected exactly one product JDK image, got ${#images[@]}" >&2
            exit 1
          fi
          "${images[0]}" -version
          printf '%s\n' "${images[0]}" > m3/build/logs/matched-image-java-path.txt
      - name: Run real product-image jtreg public and internal compaction tests
        shell: bash
        run: |
          set -euo pipefail
          image=$(cat m3/build/logs/matched-image-java-path.txt)
          test -x "$image" || { echo "No verified matched-image Java" >&2; exit 1; }
          make test TEST="test/jdk/java/util/ArrayList/M3CollectionMaskCompactorContract.java test/jdk/java/util/ArrayList/M3ArrayListVectorRemoveIfContract.java"
      - name: Publish reproducible build and jtreg evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3jdk21-java-base-mask-matched-image
          path: |
            m3/build/logs/native-configure.log
            m3/build/logs/native-build.log
            m3/build/logs/matched-image-java-path.txt
            build/*/test-results/**
          if-no-files-found: warn
          retention-days: 14
