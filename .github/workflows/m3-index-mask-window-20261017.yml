# SPDX-License-Identifier: Apache-2.0
name: M3 Index Mask Window Java21/JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexMaskWindow.java'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexMaskCompactor.java'
      - 'm3/collections/src/main/native/collections/m3_index_mask_window.c'
      - 'm3/collections/src/main/native/collections/m3_index_mask_compactor.c'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexMaskWindow*.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3MaskSpansContract.java'
      - 'm3/collections/qualification/m3-index-mask-window-20261017/**'
      - 'm3/collections/pom-m3-index-mask-window-20261017.xml'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-index-mask-window-20261017/**'
      - '.github/workflows/m3-index-mask-window-20261017.yml'
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-jni-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Admit current product source and replay historical recipe in isolation
        shell: bash
        run: |
          set -euo pipefail
          # The historical ADD-only recipe is immutable. Its original templates
          # differ from the subsequently optimized product files; do not weaken
          # its source drift guard or overwrite the current production sources.
          python3 - <<'PYCODE'
          from pathlib import Path
          import subprocess
          expected = {
              'm3/collections/src/main/java/jdk/m3/collections/M3IndexMaskCompactor.java': '8155fad4828e982e30f7d66a18f6fe0a4c372105',
              'm3/collections/src/main/java/jdk/m3/collections/M3IndexMaskWindow.java': 'c92a2dcf63175aef84731e099658c8ec08883146',
              'm3/collections/src/main/native/collections/m3_index_mask_compactor.c': 'bedd442346de5b7dd9d5f1965c510950e0c45ea1',
              'm3/collections/src/main/native/collections/m3_index_mask_window.c': 'baa23467163a0e9344fe3c1d78dcc87cb707fd56',
              'm3/collections/src/test/java/jdk/m3/collections/M3IndexMaskWindowSelfTest.java': '4357fc6ea97e0f94ed0bfbc0375ee3ea21aedb0c',
              'm3/collections/src/test/java/jdk/m3/collections/M3IndexMaskWindowTest.java': 'b4f06a6a324c26132d0d7dfb676a7c4bba6e3010',
              'm3/collections/src/test/java/jdk/m3/collections/M3MaskSpansContract.java': '646dd3350101b925d0e2cad5a1ab19eb4e873650',
          }
          for source, pinned in sorted(expected.items()):
              path = Path(source)
              if not path.is_file() or path.is_symlink():
                  raise SystemExit('M3_CURRENT_OWNER_REFUSED missing or symlink: ' + source)
              result = subprocess.run(['git', 'hash-object', '--', source],
                                      check=True, stdout=subprocess.PIPE, text=True)
              if result.stdout.strip() != pinned:
                  raise SystemExit('M3_CURRENT_OWNER_REFUSED source drift: ' + source)
          print('M3_CURRENT_OWNER_PASS owners=7 historical_recipe=separate')
          PYCODE
          historical="$(mktemp -d "$RUNNER_TEMP/m3-mask-replay.XXXXXX")"
          trap 'rm -rf "$historical"' EXIT
          # Verify original additions and fixed point in a fresh disjoint tree.
          # The existing verifier also proves tampered source refusal.
          python3 m3/collections/qualification/m3-index-mask-window-20261017/verify.py \
            --apply --workspace "$historical"
          python3 m3/collections/qualification/m3-index-mask-window-20261017/verify.py \
            --workspace "$historical"
      - name: Compile and execute strict Java21 and native differential
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-index-mask-window"
          mkdir -p "$out/classes" "$out/native"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexMaskWindow.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexMaskWindowSelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3MaskSpansContract.java
          java -cp "$out/classes" jdk.m3.collections.M3IndexMaskWindowSelfTest
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$out/native/libm3_collections_mask.so"
          java -Djava.library.path="$out/native" -cp "$out/classes" \
            jdk.m3.collections.M3IndexMaskWindowSelfTest --native
          # The owning 12,000-case mask-span oracle must execute the actual
          # JNI path (NATIVE_REQUIRED), never a transparent Java fallback.
          for mode in mixed interpreted; do
            opts=(); if [[ "$mode" == interpreted ]]; then opts=(-Xint); fi
            java "${opts[@]}" -ea -Xcheck:jni -Djava.library.path="$out/native" \
              -cp "$out/classes" jdk.m3.collections.M3MaskSpansContract native \
              | tee "$out/mask-spans-$mode.log"
            grep -qx 'MASK_SPANS_PASS cases=12000 backend=NATIVE_REQUIRED' \
              "$out/mask-spans-$mode.log"
          done
          cmp "$out/mask-spans-mixed.log" "$out/mask-spans-interpreted.log"
      - name: Focused Maven/JUnit and actual OpenRewrite SDK
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom-m3-index-mask-window-20261017.xml test
          mvn -B -ntp -f m3/collections/qualification/m3-index-mask-window-20261017/pom.xml test
