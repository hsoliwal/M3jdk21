name: M3 Synexia full delivery A3

on:
  pull_request:
    paths:
      - 'm3/m3-import/**'
      - 'm3/docs/m3-full-delivery-a3.md'
      - 'm3/docs/a3-vendored-build-prerequisite-20261015.md'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-full-delivery-a3/**'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/m3/rewrite/backport/jdk21-hash-pinned-text/m3-full-delivery-a3-doc/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-full-delivery-a3.yml'
      - 'm3/tooling/migration-recipes/src/test/java/jdk/m3/rewrite/M3FullDeliveryA3RecipeTest.java'
      - 'm3/tooling/migration-recipes/src/test/resources/jdk/m3/rewrite/m3-full-delivery-a3/**'
      - 'm3/tooling/migration-recipes/tasks/m3-full-delivery-a3/**'
      - '.github/workflows/m3-full-delivery-a3.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Diff hygiene
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA...HEAD"
      - name: Build source-vendored A3 OpenRewrite and JUnit closure
        run: >
          mvn -B -ntp -f m3/vendor/third_party/pom.xml
          -pl rewrite-java,rewrite-java-21,rewrite-test,junit-jupiter-5.10.2
          -am -DskipTests install
      - name: Recipe replay and fixed point
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl tooling/migration-recipes -am
          -Dtest=M3FullDeliveryA3RecipeTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Import planner focused tests
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl m3-import -am
          -Dtest=M3ImportPlanTest,M3ImporterTest,M3SeedSnapshotTest
          -Dsurefire.failIfNoSpecifiedTests=false test
      - name: Import module full verify and 99 percent coverage gate
        run: >
          mvn -B -ntp -f m3/pom.xml
          -pl m3-import -am verify
