# SPDX-License-Identifier: Apache-2.0
name: M3 order-statistics Java21 JNI recipe

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRank*.java'
      - 'm3/collections/src/main/native/collections/m3_long_rank_batch_jni.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongRankIndex*.java'
      - 'm3/collections/recipe/order-statistics/**'
      - 'm3/collections/algorithm-catalog/order-statistics.tsv'
      - '.github/workflows/m3-order-statistics-java-jni.yml'
  push:
    branches:
      - 'feat/m3-long-rank-snapshot-jni-recipe-20261017'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java-and-recipe:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Source/diff custody
        shell: bash
        run: |
          git diff --check HEAD^ HEAD
          mvn -B -ntp -f m3/collections/recipe/order-statistics/pom.xml verify
      - name: Compile independent Java 21 rank contract
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/rank-classes"
          S=m3/collections/src/main/java/com/m3/collections
          T=m3/collections/src/test/java/com/m3/collections
          javac --release 21 -Xlint:all -Werror -encoding UTF-8 \
            -d "${{ runner.temp }}/rank-classes" \
            "$S/M3LongIterator.java" "$S/M3LongCollection.java" \
            "$S/M3LongRankIndex.java" "$S/M3LongRankBatchNative.java" \
            "$T/M3LongRankIndexSelfTest.java"
          java -cp "${{ runner.temp }}/rank-classes" \
            com.m3.collections.M3LongRankIndexSelfTest
      - name: Optional JNI C and native differential parity
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_long_rank_batch_jni.c \
            -o "${{ runner.temp }}/libm3rankbatch.so"
          java -Dm3.collections.rank.native=true \
            -Djava.library.path="${{ runner.temp }}" \
            -cp "${{ runner.temp }}/rank-classes" \
            com.m3.collections.M3LongRankIndexSelfTest
