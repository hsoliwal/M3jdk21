name: M3 Object Slot Index Snapshot Java21 JNI

on:
  push:
    branches:
      - 'm3/object-slot-index-snapshot-20261017'
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectIndexSnapshot.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectSlotStore28.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ObjectSlotIndex*.java'
      - 'm3/collections/qualification/m3-object-slot-index-snapshot-20261017/**'
      - 'm3/tooling/migration-recipes/src/main/resources/com/synexia/rewrite/hash-pinned-java/m3-object-slot-index-snapshot-20261017/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-object-slot-index-snapshot-20261017.yml'
      - 'm3/tooling/migration-recipes/src/test/java/com/synexia/rewrite/M3ObjectSlotIndexSnapshot20261017RecipeTest.java'
      - '.github/workflows/m3-object-slot-index-snapshot-20261017.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-jni-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Diff and exact receiver seal
        run: |
          set -euo pipefail
          git diff --check
          python3 m3/collections/qualification/m3-object-slot-index-snapshot-20261017/verify.py

      - name: Canonical OpenRewrite mirror fixed point and refusal
        run: >
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml
          -Dtest=M3ObjectSlotIndexSnapshot20261017RecipeTest test

      - name: Owning M3 Collections Maven/JUnit contract
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3ObjectSlotIndexTest test

      - name: Strict existing JNI mask kernel and Xcheck parity
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-object-slot-index"
          mkdir -p "$out/native"
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$out/native/libm3_collections_mask.so"
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_signal_order_jni.c \
            -o "$out/native/libm3signalorder.so"
          java -Xcheck:jni -Dm3.collections.signal.native=true \
            -Djava.library.path="$out/native" \
            -cp "m3/collections/target/classes:m3/collections/target/test-classes" \
            com.m3.collections.M3ObjectSlotIndexSelfTest

      - name: Preserve non-promotion boundary
        shell: bash
        run: |
          set -euo pipefail
          grep -F $'M3_OBJECT_SLOT_INDEX_RECEIVER_V1\treceiving_state\tWAITING_FOR_STRING' \
            m3/collections/qualification/m3-object-slot-index-snapshot-20261017/RECEIPT.tsv
          grep -F $'M3_OBJECT_SLOT_INDEX_RECEIVER_V1\truntime_promotion\tfalse' \
            m3/collections/qualification/m3-object-slot-index-snapshot-20261017/RECEIPT.tsv
