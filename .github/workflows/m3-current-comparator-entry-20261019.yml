# SPDX-License-Identifier: Apache-2.0
name: M3 Current Comparator Entry Contract Java21

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3FilteredViews.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3StoredRepresentativeContract.java'
      - 'm3/collections/qualification/comparator-entry-20261019/**'
      - '.github/workflows/m3-current-comparator-entry-20261019.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/collections/src/main/java/com/m3/collections/M3FilteredViews.java
            m3/collections/src/main/java/com/m3/collections/M3MutableFilteredViews.java
            m3/collections/src/test/java/com/m3/collections/M3StoredRepresentativeContract.java
            m3/collections/qualification/comparator-entry-20261019/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Pin existing production owner, without resetting it
        shell: bash
        run: |
          set -euo pipefail
          owner=m3/collections/src/main/java/com/m3/collections/M3FilteredViews.java
          actual=$(git hash-object "$owner")
          expected=34fca25ba45467567213ed7a170bf4b27d6427e3
          test "$actual" = "$expected" || { echo "CURRENT_OWNER_SOURCE_DRIFT actual=$actual expected=$expected"; exit 1; }
      - name: Java 21 strict compilation and dual-mode test
        shell: bash
        run: |
          set -euo pipefail
          tmp=$(mktemp -d)
          trap 'rm -rf "$tmp"' EXIT
          src=m3/collections/src
          javac --release 21 -proc:none -Xlint:all,-serial -Werror -d "$tmp" \
            "$src/main/java/com/m3/collections/M3FilteredViews.java" \
            "$src/main/java/com/m3/collections/M3MutableFilteredViews.java" \
            "$src/test/java/com/m3/collections/M3StoredRepresentativeContract.java"
          java -ea -cp "$tmp" com.m3.collections.M3StoredRepresentativeContract
          java -Xint -ea -cp "$tmp" com.m3.collections.M3StoredRepresentativeContract
