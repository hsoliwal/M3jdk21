name: M3 Eclipse composite mask and sorted-index receiver
on:
  pull_request:
    branches:
      - master
      - m3/eclipse-framework-index-forward-20261017
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongIndexProjection.java'
      - 'm3/eclipse/framework/**'
      - 'm3/collections/algorithm-catalog/eclipse-m3-mask-sort-20261017.tsv'
      - 'm3/docs/name-mapping.d/eclipse-m3-mask-sort-20261017.tsv'
      - '.github/workflows/m3-eclipse-mask-sort-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-openrewrite-jni:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind exact checked-out PR head and postimage hashes
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof
          git rev-parse HEAD | tee proof/head.txt
          java -version 2>&1 | tee proof/java-version.txt
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          import subprocess
          root = Path('m3/eclipse/framework/recipe/src/main/resources/com/synexia/rewrite/hash-pinned-java/eclipse-m3-mask-sort')
          lines = [line.split('\t') for line in (root / 'manifest.tsv').read_text().splitlines() if line and not line.startswith('#')]
          assert len(lines) == 3, ('unexpected admitted source list', lines)
          assert [line[0] for line in lines] == sorted(line[0] for line in lines)
          for rel, before, after, template in lines:
              assert len(before) == 64 or before == 'ABSENT'
              target = Path(rel)
              candidate = root / template
              assert target.is_file() and not target.is_symlink(), rel
              assert candidate.is_file() and not candidate.is_symlink(), template
              for file in (target, candidate):
                  digest = hashlib.sha256(file.read_bytes()).hexdigest()
                  assert digest == after, (file, digest, after)
          print('ADMITTED_THREE_EXACT_JAVA_POSTIMAGES')
          PY
      - name: Execute canonical OpenRewrite fixed-point and refusal proofs
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/framework/recipe/pom.xml \
            -Dtest=M3EclipseMaskSortRecipeTest test 2>&1 | tee proof/recipe-test.txt
          cp -R m3/eclipse/framework/recipe/target/surefire-reports proof/recipe-reports
      - name: Compile unchanged M3 owners plus qualified new index overload
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes
          find m3/collections/src/main/java -name '*.java' | sort > proof/core-sources.txt
          javac --release 21 -Xlint:all,-module -Werror -d proof/classes @proof/core-sources.txt 2>&1 | tee proof/core-compile.txt
          jar --create --file proof/m3-collections.jar -C proof/classes .
          jdeps --print-module-deps proof/m3-collections.jar | tee proof/core-module-deps.txt
          test "$(cat proof/core-module-deps.txt)" = java.base
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$GITHUB_WORKSPACE/proof/m3-collections.jar" \
            -DgroupId=com.m3 -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT \
            -Dpackaging=jar -DgeneratePom=true
      - name: Recompile existing canonical index-mask JNI (no new ABI)
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/native
          cc -std=c17 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o proof/native/libm3_collections_mask.so 2>&1 | tee proof/native-build.txt
          sha256sum proof/native/libm3_collections_mask.so > proof/native-sha256.txt
      - name: Run real Eclipse API JUnit and required native mask parity
        shell: bash
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/eclipse/framework/pom.xml \
            -Dtest=M3EclipseBundleOrderedViewTest \
            "-DargLine=-Djava.library.path=$GITHUB_WORKSPACE/proof/native -Xcheck:jni" \
            test 2>&1 | tee proof/eclipse-jni-tests.txt
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          reports = list(Path('m3/eclipse/framework/target/surefire-reports').glob('TEST-*.xml'))
          assert reports, 'missing real JUnit report'
          roots = [ET.parse(path).getroot() for path in reports]
          totals = {k: sum(int(r.attrib.get(k, 0)) for r in roots)
                    for k in ('tests','failures','errors','skipped')}
          assert totals == {'tests':6,'failures':0,'errors':0,'skipped':0}, totals
          print('JAVA_JNI_DIFFERENTIAL_PASS', totals)
          PY
          git diff --exit-code -- m3/collections/src/main/java m3/eclipse/framework/src
      - name: Preserve actual compiler, recipe and JNI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-mask-sort-${{ github.event.pull_request.head.sha || github.sha }}
          retention-days: 30
          path: |
            proof/
            m3/eclipse/framework/recipe/target/surefire-reports/
            m3/eclipse/framework/target/surefire-reports/
