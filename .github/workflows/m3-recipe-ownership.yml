name: M3 recipe ownership

on:
  push:
    branches:
      - "m3/recipe-ownership-*"
    paths:
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/**"
      - "m3/tooling/migration-recipes/tasks/**/RECIPE_MEMORY.tsv"
      - "m3/runtime-integration/verify-recipe-memory.py"
      - "m3/docs/synexia-recipe-ownership-classification.tsv"
      - "m3/runtime-integration/verify-recipe-ownership.py"
      - ".github/workflows/m3-recipe-ownership.yml"
  pull_request:
    paths:
      - "src/**"
      - "m3/**/src/main/**"
      - "m3/tooling/migration-recipes/src/main/java/com/m3/rewrite/**"
      - "m3/tooling/migration-recipes/tasks/**/RECIPE_MEMORY.tsv"
      - "m3/runtime-integration/verify-recipe-memory.py"
      - "m3/docs/synexia-recipe-ownership-classification.tsv"
      - "m3/runtime-integration/verify-recipe-ownership.py"
      - ".github/workflows/m3-recipe-ownership.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify every M3JDK21 recipe owner
        run: python3 m3/runtime-integration/verify-recipe-ownership.py
      - name: Verify append-only recipe learning memory
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 m3/runtime-integration/verify-recipe-memory.py \
              --base "${{ github.event.pull_request.base.sha }}"
          else
            python3 m3/runtime-integration/verify-recipe-memory.py
          fi
