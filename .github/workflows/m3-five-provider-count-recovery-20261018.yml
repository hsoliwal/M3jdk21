# SPDX-License-Identifier: Apache-2.0
name: M3 five-provider shared counts and full-width JNI recovery
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectCounts.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ObjectCountsTest.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3GuavaMultiset.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3EclipseBag.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3ApacheMultiSet.java'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveProviderFlagSelection.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveProviderCountSharingRegressionTest.java'
      - 'm3/collections/qualification/five-provider-count-recovery-20261018/**'
      - '.github/workflows/m3-five-provider-count-recovery-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-sdk-java-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail-closed exact Synexia source/template/admission preflight
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path('m3/collections/qualification/five-provider-count-recovery-20261018/recipe')
          resources = root / 'src/main/resources/com/synexia/rewrite/five-provider-count-recovery-20261018'
          for line in (resources/'manifest.tsv').read_text().splitlines():
              path,before,after,name = line.split('\t')
              payload = (resources/name).read_bytes()
              actual = Path(path)
              assert hashlib.sha256(payload).hexdigest() == after, (path, 'tampered-template')
              assert actual.is_file() and not actual.is_symlink(), (path, 'missing-or-link')
              assert actual.read_bytes() == payload, (path, 'generated-drift')
          print('PASS 7 exact generated source outputs')
          PY
      - name: Execute original OpenRewrite recipe, adversarial refusal and fixed point
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/qualification/five-provider-count-recovery-20261018/recipe/pom.xml verify
      - name: Compile complete installed M3 core sources at strict Java 21 warning gate
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p proof/classes proof/native
          find m3/collections/src/main/java -name '*.java' -print0 | sort -z | xargs -0 javac --release 21 -proc:none -Xlint:all,-module -Werror -d proof/classes
          jar --create --file proof/m3-collections.jar -C proof/classes .
          jdeps --print-module-deps proof/m3-collections.jar | tee proof/core-module-deps.txt
          test "$(cat proof/core-module-deps.txt)" = java.base
          mvn -B -ntp org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file -Dfile="$PWD/proof/m3-collections.jar" -DgroupId=com.m3 -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Compile actual Guava Eclipse Commons Spring providers and execute entire interop JUnit
        run: |
          set -euxo pipefail
          mvn -B -ntp -f m3/collections/interop/pom.xml verify
      - name: Execute same full-width selected-provider tests against existing real C17 JNI
        shell: bash
        run: |
          set -euxo pipefail
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fPIC -shared -fsanitize=undefined -fno-sanitize-recover=all -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" m3/collections/src/main/native/collections/m3_index_path_masks.c -o "$RUNNER_TEMP/libm3_collections_pathmask.so"
          UBSAN_OPTIONS=halt_on_error=1 JAVA_TOOL_OPTIONS="-Xcheck:jni -Djava.library.path=$RUNNER_TEMP" mvn -B -ntp -f m3/collections/interop/pom.xml '-Dtest=M3FiveProviderFlagSelectionTest,M3FiveProviderCountSharingRegressionTest' -Dm3.interop.requireNative=true test
          git diff --exit-code
      - name: Retain exact-head Maven, source and JNI receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-five-provider-count-recovery
          retention-days: 30
          path: |
            proof/
            m3/collections/qualification/five-provider-count-recovery-20261018/recipe/target/surefire-reports/
            m3/collections/interop/target/surefire-reports/
