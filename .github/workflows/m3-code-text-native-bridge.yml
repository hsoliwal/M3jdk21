# SPDX-License-Identifier: GPL-2.0-only WITH Classpath-exception-2.0
name: M3 code-text native bridge

on:
  push:
    branches:
      - codex/m3jdk-precompute-coverage-invariant-20261010
  pull_request:
    paths:
      - 'src/java.base/share/classes/java/lang/M3CodeTextFacts.java'
      - 'src/java.base/share/classes/java/lang/M3CodeTextSignalBatch.java'
      - 'src/java.base/share/classes/java/lang/M3CodeTextNativeContract.java'
      - 'src/java.base/share/classes/java/lang/M3CodeTextNativeBridge.java'
      - 'm3/core/test/M3CodeTextPrecomputeCoverageTest.java'
      - 'm3/core/test/java/lang/M3CodeTextNativeBridgeTest.java'
      - 'm3/core/test/java/lang/M3CodeTextFactsReceiverTest.java'
      - 'm3/core/test/java/lang/M3CodeTextNativeBridgeNativeTest.java'
      - 'm3/lexicon/synexia-code-text-*.tsv'
      - '.github/workflows/m3-code-text-native-bridge.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fallback:
    name: Java 21 bridge fallback and custody
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Check out pinned Synexia JNI donor
        uses: actions/checkout@v5
        with:
          repository: hsoliwal/com.synexia
          ref: ff3329e06763820930f98d5d30123b1c37a44b34
          path: m3/build/synexia-donor
          sparse-checkout: |
            synexia-indexstring/native/include/mindex_code_text_signal.h
            synexia-indexstring/native/src/mindex_code_text_signal.c
            synexia-indexstring/native/src/mindex_code_text_signal_jni.c
          sparse-checkout-cone-mode: false

      - name: Build pinned Synexia JNI donor
        shell: bash
        run: |
          set -euo pipefail
          donor=m3/build/synexia-donor/synexia-indexstring/native
          mkdir -p m3/build/m3-code-text-native
          gcc -std=c11 -Wall -Wextra -Wpedantic -fPIC -shared -O2             -I "$JAVA_HOME/include"             -I "$JAVA_HOME/include/linux"             -I "$donor/include"             "$donor/src/mindex_code_text_signal.c"             "$donor/src/mindex_code_text_signal_jni.c"             -o m3/build/m3-code-text-native/libsynexia_m3bridge.so
          nm -D --defined-only m3/build/m3-code-text-native/libsynexia_m3bridge.so             | grep -Fx '0000000000000000 T Java_java_lang_M3CodeTextNativeBridge_nativeAnalyzeRange'             || nm -D --defined-only m3/build/m3-code-text-native/libsynexia_m3bridge.so             | grep -F 'Java_java_lang_M3CodeTextNativeBridge_nativeAnalyzeRange'

      - name: Compile patched java.base bridge
        shell: bash
        run: |
          set -euo pipefail
          rm -rf m3/build/m3-code-text-native-bridge
          mkdir -p m3/build/m3-code-text-native-bridge
          javac --release 21 \
            --patch-module java.base=src/java.base \
            -d m3/build/m3-code-text-native-bridge \
            src/java.base/share/classes/java/lang/M3CodeTextFacts.java \
            src/java.base/share/classes/java/lang/M3CodeTextSignalBatch.java \
            src/java.base/share/classes/java/lang/M3CodeTextNativeContract.java \
            src/java.base/share/classes/java/lang/M3CodeTextNativeBridge.java \
            m3/core/test/java/lang/M3CodeTextNativeBridgeTest.java \
            m3/core/test/java/lang/M3CodeTextFactsReceiverTest.java \
            m3/core/test/java/lang/M3CodeTextNativeBridgeNativeTest.java

      - name: Run host-Java fallback and validation proof
        shell: bash
        run: |
          set -euo pipefail
          java --patch-module java.base=m3/build/m3-code-text-native-bridge \
            -ea java.lang.M3CodeTextNativeBridgeTest

      - name: Run loaded native bridge proof
        shell: bash
        run: |
          set -euo pipefail
          java             -Dm3.code.text.native.path="$PWD/m3/build/m3-code-text-native/libsynexia_m3bridge.so"             -Dm3.code.text.native.required=true             -Dm3.code.text.native.verify=true             --patch-module java.base=m3/build/m3-code-text-native-bridge             -ea java.lang.M3CodeTextNativeBridgeNativeTest

      - name: Run typed precomputed facts receiver proof
        shell: bash
        run: |
          set -euo pipefail
          java --patch-module java.base=m3/build/m3-code-text-native-bridge \
            -ea java.lang.M3CodeTextFactsReceiverTest


      - name: Run source and receipt coverage gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p m3/build/m3-code-text-native-coverage
          javac --release 21 \
            -d m3/build/m3-code-text-native-coverage \
            m3/core/test/M3CodeTextPrecomputeCoverageTest.java
          java -cp m3/build/m3-code-text-native-coverage \
            M3CodeTextPrecomputeCoverageTest
