name: M3JDK21 filtered sorted physical viewport page
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedListSnapshot.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexedPhysicalWindowContract.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexedPhysicalWindowTest.java'
      - 'm3/collections/qualification/viewport-frame-20261021/**'
      - '.github/workflows/m3-indexed-physical-window-20261021.yml'
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Original owner filtered/sorted Maven test
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3IndexedPhysicalWindowTest test
