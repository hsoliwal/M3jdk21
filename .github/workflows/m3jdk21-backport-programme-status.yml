# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 backport programme status

on:
  pull_request:
    paths:
      - 'make/m3/backports/JEP_CATALOGUE.tsv'
      - 'make/m3/backports/backport_recipe_dag.py'
      - 'make/m3/backports/backport_execution_waves.py'
      - 'make/m3/backports/backport_programme_status.py'
      - 'make/m3/backports/pom.xml'
      - 'make/m3/backports/test_backport_programme_status.py'
      - 'make/m3/backports/BACKPORT_PROGRAMME_STATUS.md'
      - '.github/workflows/m3jdk21-backport-programme-status.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  status:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Diff hygiene
        run: git diff --check

      - name: Backport status unit tests
        run: python3 -m unittest m3.backports.test_backport_programme_status

      - name: Compile live programme status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p make/m3/backports/target
          python3 make/m3/backports/backport_programme_status.py \
            --root . \
            --tsv-out make/m3/backports/target/backport-programme-status.tsv \
            --json-out make/m3/backports/target/backport-programme-status.json

      - name: Verify authority-free output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("make/m3/backports/target/backport-programme-status.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          assert payload["schema"] == "M3JDK21_BACKPORT_PROGRAMME_STATUS_V1"
          assert payload["jeps"] > 0
          assert payload["mutation_authority"] is False
          assert payload["promotion_authority"] is False
          assert payload["compatibility_authority"] is False
          assert len(payload["root"]) == 64
          print("PASS", payload["jeps"], payload["states"], payload["root"])
          PY

      - name: Upload read-only programme evidence
        uses: actions/upload-artifact@v4
        with:
          name: m3jdk21-backport-programme-status
          path: |
            make/m3/backports/target/backport-programme-status.tsv
            make/m3/backports/target/backport-programme-status.json
