name: M3 java.base internals
# Product code moved from the m3/ side tree into java.base (jdk.internal.m3.<area>), approved layout 2026-11-08.
# One step per moved area runs make/m3/<area>/test-java-base.sh on a host JDK 21.
# Former triggers (below, as of the move) now start job(s) 'm3-java-base-internals__*' in
# .github/workflows/checks-superset-02.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       branches: [master]
#       paths:
#         - 'src/java.base/share/classes/jdk/internal/m3/**'
#         - 'src/java.base/share/classes/jdk/m3/**'
#         - 'src/java.base/share/native/libm3*/**'
#         - 'test/jdk/jdk/internal/m3/**'
#         - 'make/m3/**'
#         - '.github/workflows/m3-java-base-internals.yml'
#     push:
#       branches: [master]
#       paths:
#         - 'src/java.base/share/classes/jdk/internal/m3/**'
#         - 'src/java.base/share/classes/jdk/m3/**'
#         - 'src/java.base/share/native/libm3*/**'
#         - 'test/jdk/jdk/internal/m3/**'
#         - 'make/m3/**'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  internals:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: JUnit console launcher
        run: mvn -B -ntp -q dependency:get -Dartifact=org.junit.platform:junit-platform-console-standalone:1.11.4
      - name: compression (jdk.internal.m3.compression)
        run: |
          bash make/m3/compression/test-java-base.sh \
            "$HOME/.m2/repository/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar" \
            "$RUNNER_TEMP/m3-compression"
      - name: intern (jdk.internal.m3.intern)
        run: |
          bash make/m3/intern/test-java-base.sh \
            "$HOME/.m2/repository/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar" \
            "$RUNNER_TEMP/m3-intern"
      - name: indexstring (jdk.internal.m3.indexstring, with jdk.m3.precompute)
        run: bash make/m3/indexstring/test-java-base.sh "$RUNNER_TEMP/m3-indexstring"
      - name: M3DB (jdk.m3.db, jdk.internal.m3.db)
        run: |
          bash make/m3/indexdb/test-java-base.sh \
            "$HOME/.m2/repository/org/junit/platform/junit-platform-console-standalone/1.11.4/junit-platform-console-standalone-1.11.4.jar" \
            "$RUNNER_TEMP/m3-db"
