name: M3 full-width zero mask identity over strided physical index paths
on:
  pull_request:
    paths:
      - '.github/workflows/m3-index-path-zero-stages-receiver-20261017.yml'
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexPathZeroStages*.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-java21-original-and-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify three SHA256 postimages from Synexia canonical recipe
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' '710270d795601ee1846d519ed6534260d07255af9a6811f37c8baab50622ff4b' 'm3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java' | sha256sum -c -
          printf '%s  %s\n' '3e53be1799c78795cb5bc45ba0b3857116464566eda05b65a7a6d0649e97d303' 'm3/collections/src/test/java/com/m3/collections/M3IndexPathZeroStagesSelfTest.java' | sha256sum -c -
          printf '%s  %s\n' '9bcfb70ef5a5553031f44bca89ac372799ee3330c7d9adf134117f165189ea6b' 'm3/collections/src/test/java/com/m3/collections/M3IndexPathZeroStagesTest.java' | sha256sum -c -
      - name: Original and candidate actual sources compile and keep behavior and ABI
        shell: bash
        run: |
          set -euo pipefail
          B="$(mktemp -d)"
          trap 'rm -rf "$B"' EXIT
          mkdir -p "$B/old/com/m3/collections" "$B/old-classes" "$B/new-classes"
          SOURCE=m3/collections/src/main/java/com/m3/collections/M3IndexPathMasks.java
          PROOF=m3/collections/src/test/java/com/m3/collections/M3IndexPathZeroStagesSelfTest.java
          git show '221e3d4edfa928e6ca17768396b2ba3e224bc70a':"$SOURCE" > "$B/old/com/m3/collections/M3IndexPathMasks.java"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$B/old-classes" "$B/old/com/m3/collections/M3IndexPathMasks.java" "$PROOF"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$B/new-classes" "$SOURCE" "$PROOF"
          for variant in old new; do
            for mode in '' '-Xint' '-XX:TieredStopAtLevel=1'; do
              java -ea $mode -Xmx384m -cp "$B/$variant-classes" com.m3.collections.M3IndexPathZeroStagesSelfTest
            done
          done
          javap -public -s -classpath "$B/old-classes" com.m3.collections.M3IndexPathMasks > "$B/old.api"
          javap -public -s -classpath "$B/new-classes" com.m3.collections.M3IndexPathMasks > "$B/new.api"
          diff -u "$B/old.api" "$B/new.api"
          git diff --check '221e3d4edfa928e6ca17768396b2ba3e224bc70a' HEAD
  module-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Actual full M3 collections module and inherited mask contract JUnit
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3IndexPathZeroStagesTest,M3IndexPathMasksTest test
          for name in M3IndexPathZeroStagesTest M3IndexPathMasksTest; do
            REPORT="m3/collections/target/surefire-reports/com.m3.collections.$name.txt"
            test -s "$REPORT"
            grep -E 'Tests run: [1-9][0-9]*, Failures: 0, Errors: 0, Skipped: 0' "$REPORT"
          done
