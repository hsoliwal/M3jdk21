name: M3 JDK21 upstream inventory

on:
  push:
    branches:
      - master
      - "m3/**"
    paths:
      - ".github/workflows/m3-jdk21-upstream-inventory.yml"
      - "m3/backports/inventory.py"
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/test_inventory.py"
      - "m3/backports/test_file_delta_inventory.py"
      - "m3/backports/COMPATIBILITY_ADMISSION.md"
  pull_request:
    paths:
      - ".github/workflows/m3-jdk21-upstream-inventory.yml"
      - "m3/backports/inventory.py"
      - "m3/backports/file_delta_inventory.py"
      - "m3/backports/test_inventory.py"
      - "m3/backports/test_file_delta_inventory.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Fetch pinned OpenJDK GA history without blobs
        shell: bash
        run: |
          mkdir upstream-jdk
          git -C upstream-jdk init -q
          git -C upstream-jdk remote add origin https://github.com/openjdk/jdk.git

          refs=(
            "refs/tags/jdk-21+35:refs/tags/jdk-21+35"
            "refs/tags/jdk-22+36:refs/tags/jdk-22+36"
            "refs/tags/jdk-23+37:refs/tags/jdk-23+37"
            "refs/tags/jdk-24+36:refs/tags/jdk-24+36"
            "refs/tags/jdk-25+36:refs/tags/jdk-25+36"
            "refs/tags/jdk-26+35:refs/tags/jdk-26+35"
            "refs/tags/jdk-27+35:refs/tags/jdk-27+35"
          )
          git -C upstream-jdk -c protocol.version=2 fetch             --filter=blob:none             --no-tags             origin             "${refs[@]}"

          tags=(
            jdk-21+35
            jdk-22+36
            jdk-23+37
            jdk-24+36
            jdk-25+36
            jdk-26+35
            jdk-27+35
          )
          for tag in "${tags[@]}"; do
            git -C upstream-jdk rev-parse --verify "$tag^{commit}"
          done

      - name: Materialize complete commit JBS path denominator
        shell: bash
        run: |
          mkdir -p inventory-output
          python3 m3/backports/inventory.py             --repo upstream-jdk             --out inventory-output/UPSTREAM_CHANGES.tsv

      - name: Materialize verbatim JDK21-to-donor file comparisons
        shell: bash
        run: |
          python3 m3/backports/file_delta_inventory.py \
            --repo upstream-jdk \
            --out inventory-output/JDK21_FILE_DELTAS.tsv

      - name: Verify and summarize inventory
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          import hashlib
          import json
          from collections import Counter
          from pathlib import Path

          path = Path("inventory-output/UPSTREAM_CHANGES.tsv")
          data = path.read_bytes()
          with path.open("r", encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))

          by_release = Counter(int(row["release"]) for row in rows)
          by_disposition = Counter(row["disposition"] for row in rows)
          by_domain = Counter(row["domain"] for row in rows)
          jbs_rows = sum(bool(row["jbs_ids"]) for row in rows)

          expected_release_counts = {
              22: 2384,
              23: 2355,
              24: 2562,
              25: 2678,
              26: 2611,
              27: 2358,
          }
          if dict(sorted(by_release.items())) != expected_release_counts:
              raise SystemExit(
                  f"release commit counts differ: {dict(sorted(by_release.items()))}"
              )
          expected_total = sum(expected_release_counts.values())
          if len(rows) != expected_total:
              raise SystemExit(
                  f"expected complete released denominator {expected_total}, found {len(rows)}"
              )
          for row in rows:
              if row["backport_policy"] != "BACKPORT_IF_JAVA21_COMPATIBLE":
                  raise SystemExit(
                      f"{row['commit']}: missing complete backport policy"
                  )
              if row["compatibility_state"] != "PENDING_COMPATIBILITY_PROOF":
                  raise SystemExit(
                      f"{row['commit']}: unexpected initial compatibility state "
                      f"{row['compatibility_state']}"
                  )

          commits = [row["commit"] for row in rows]
          if len(commits) != len(set(commits)):
              raise SystemExit("duplicate commit across GA interval inventory")

          summary = {
              "schema": 1,
              "source_repo": "openjdk/jdk",
              "ga_intervals": {
                  "22": ["jdk-21+35", "jdk-22+36"],
                  "23": ["jdk-22+36", "jdk-23+37"],
                  "24": ["jdk-23+37", "jdk-24+36"],
                  "25": ["jdk-24+36", "jdk-25+36"],
                  "26": ["jdk-25+36", "jdk-26+35"],
                  "27": ["jdk-26+35", "jdk-27+35"],
              },
              "total_commits": len(rows),
              "backport_policy": "BACKPORT_IF_JAVA21_COMPATIBLE",
              "initial_compatibility_state": "PENDING_COMPATIBILITY_PROOF",
              "rows_with_jbs_id": jbs_rows,
              "by_release": dict(sorted(by_release.items())),
              "by_disposition": dict(sorted(by_disposition.items())),
              "by_domain": dict(sorted(by_domain.items())),
              "sha256": hashlib.sha256(data).hexdigest(),
              "bytes": len(data),
          }
          Path("inventory-output/UPSTREAM_CHANGES.summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )

          file_path = Path("inventory-output/JDK21_FILE_DELTAS.tsv")
          file_data = file_path.read_bytes()
          with file_path.open("r", encoding="utf-8", newline="") as handle:
              file_rows = list(csv.DictReader(handle, delimiter="\t"))
          file_status = Counter(row["status"] for row in file_rows)
          file_lanes = Counter(row["recipe_lane"] for row in file_rows)
          file_summary = {
              "schema": 1,
              "baseline": "jdk-21+35",
              "donors": {
                  "22": "jdk-22+36",
                  "23": "jdk-23+37",
                  "24": "jdk-24+36",
                  "25": "jdk-25+36",
                  "26": "jdk-26+35",
                  "27": "jdk-27+35",
              },
              "rows": len(file_rows),
              "status": dict(sorted(file_status.items())),
              "recipe_lanes": dict(sorted(file_lanes.items())),
              "sha256": hashlib.sha256(file_data).hexdigest(),
              "bytes": len(file_data),
          }
          Path("inventory-output/JDK21_FILE_DELTAS.summary.json").write_text(
              json.dumps(file_summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, sort_keys=True))
          print(json.dumps(file_summary, sort_keys=True))
          PY
          gzip -9 -k inventory-output/UPSTREAM_CHANGES.tsv
          gzip -9 -k inventory-output/JDK21_FILE_DELTAS.tsv

      - name: Upload complete upstream inventory
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jdk22-27-upstream-change-inventory
          path: inventory-output/
          if-no-files-found: error
          retention-days: 7
