name: M3 Scope Registry API Repair

on:
  pull_request:
    paths:
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/scope-registry-api-repair/**'
      - '.github/workflows/m3-scope-registry-api-repair.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-recipe-and-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Restore sealed legacy recipe custody from Synexia
        uses: ./.github/actions/legacy-recipe-custody
        with:
          token: ${{ secrets.SYNEXIA_READ_TOKEN || github.token }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3ScopeRegistryApiRepairRecipeTest,M3ScopeCoverageClosureTest test
