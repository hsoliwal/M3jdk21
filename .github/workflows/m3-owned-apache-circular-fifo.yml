name: Owned M3 Apache circular FIFO contracts
on:
  pull_request:
    paths:
      - 'm3/collections/implementations/apache-circular-fifo/**'
      - 'm3/collections/qualification/owned-apache-circular-fifo-20261018/**'
      - 'm3/collections/recipe/owned-apache-circular-fifo-20261018/**'
      - '.github/workflows/m3-owned-apache-circular-fifo.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify sources and run provider, owned Java, JNI and subclass protocols
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-circular-fifo"
          mkdir -p "$M3_TASK_OUT/core" "$M3_TASK_OUT/classes" "$M3_TASK_OUT/native" "$M3_TASK_OUT/tmp"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          M3_PROVIDER="$M3_TASK_OUT/commons-collections4-4.5.0.jar"
          curl --fail --location --silent --show-error --output "$M3_PROVIDER" https://repo.maven.apache.org/maven2/org/apache/commons/commons-collections4/4.5.0/commons-collections4-4.5.0.jar
          M3_Q="m3/collections/qualification/owned-apache-circular-fifo-20261018"
          python -I -S -B "$M3_Q/verify.py" --jar "$M3_PROVIDER"
          find m3/collections/src/main/java -name '*.java' | sort > "$M3_TASK_OUT/core.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -g -proc:none -Xlint:all,-module -Werror -d "$M3_TASK_OUT/core" @"$M3_TASK_OUT/core.args"
          javac -J-Djava.io.tmpdir="$M3_TASK_OUT/tmp" --release 21 -g -proc:none -Xlint:all,-module -Werror -cp "$M3_TASK_OUT/core:$M3_PROVIDER" -d "$M3_TASK_OUT/classes" m3/collections/implementations/apache-circular-fifo/src/main/java/com/m3/collections/apache/M3CircularFifoQueue.java "$M3_Q/CircularFifoProtocolProof.java" "$M3_Q/CircularFifoSubclassProof.java" "$M3_Q/CircularFifoMutationProbe.java"
          gcc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" m3/collections/src/main/native/collections/m3_index_mask_compactor.c -o "$M3_TASK_OUT/native/libm3_collections_mask.so"
          M3_CP="$M3_TASK_OUT/classes:$M3_TASK_OUT/core:$M3_PROVIDER"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_CP" CircularFifoProtocolProof org.apache.commons.collections4.queue.CircularFifoQueue > "$M3_TASK_OUT/provider.json"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/absent" -cp "$M3_CP" CircularFifoProtocolProof com.m3.collections.apache.M3CircularFifoQueue > "$M3_TASK_OUT/java.json"
          java -Xmx512m -XX:-UsePerfData -Xcheck:jni -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -Djava.library.path="$M3_TASK_OUT/native" -cp "$M3_CP" CircularFifoProtocolProof com.m3.collections.apache.M3CircularFifoQueue native > "$M3_TASK_OUT/native.json"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" CircularFifoSubclassProof
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" CircularFifoMutationProbe org.apache.commons.collections4.queue.CircularFifoQueue > "$M3_TASK_OUT/provider-mutation.json"
          java -Xmx512m -XX:-UsePerfData -Djava.io.tmpdir="$M3_TASK_OUT/tmp" -cp "$M3_CP" CircularFifoMutationProbe com.m3.collections.apache.M3CircularFifoQueue > "$M3_TASK_OUT/owned-mutation.json"
          python -I -S -B "$M3_Q/compare.py" "$M3_TASK_OUT"
  receiving:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run exact receiving Maven host
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-circular-fifo-receiving"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/m2"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          export MAVEN_OPTS="-Xmx512m -XX:-UsePerfData -Djava.io.tmpdir=$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          python -I -S -B m3/collections/qualification/owned-apache-circular-fifo-20261018/verify.py
          mvn -B -ntp -f m3/collections/recipe/owned-apache-circular-fifo-20261018/pom.xml -Dmaven.repo.local="$M3_TASK_OUT/m2" -Dm3.recipe.output="$M3_TASK_OUT/target" test
  module:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            m3/collections
            .github/workflows
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Package standalone owned module with retained licenses
        shell: bash
        run: |
          set -euo pipefail
          M3_TASK_OUT="$RUNNER_TEMP/m3-circular-fifo-module"
          mkdir -p "$M3_TASK_OUT/tmp" "$M3_TASK_OUT/m2"
          export TMPDIR="$M3_TASK_OUT/tmp" TEMP="$M3_TASK_OUT/tmp" TMP="$M3_TASK_OUT/tmp"
          export MAVEN_OPTS="-Xmx512m -XX:-UsePerfData -Djava.io.tmpdir=$M3_TASK_OUT/tmp"
          python -I -S -B -c 'import os,shutil; assert shutil.disk_usage(os.environ["TMPDIR"]).free >= 8*1024**3+512*1024**2'
          python -I -S -B m3/collections/qualification/owned-apache-circular-fifo-20261018/verify.py
          mvn -B -ntp -f m3/collections/implementations/apache-circular-fifo/pom.xml -Dmaven.repo.local="$M3_TASK_OUT/m2" -Dm3.module.output="$M3_TASK_OUT/target" package
          python -I -S -B m3/collections/qualification/owned-apache-circular-fifo-20261018/verify_module.py "$M3_TASK_OUT/target/m3-owned-apache-circular-fifo-0.1.0-SNAPSHOT.jar"
