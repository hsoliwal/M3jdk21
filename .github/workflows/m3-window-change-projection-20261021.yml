name: M3JDK21 indexed viewport delta CPU proof

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3WindowPlan.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3WindowPlanChangeContract.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3WindowPlanChangeTest.java'
      - 'm3/collections/qualification/window-delta-20261021/**'
      - 'm3/docs/eclipse-jdk-gap-20261021/**'
      - '.github/workflows/m3-window-change-projection-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-window-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 3
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Refuse output drift against canonical source SHA-256
        shell: bash
        run: |
          printf '%s  %s\n' \
            '31a8b654dca812675747883911c334b8386bacdcc4c5ffb40cd25dcd456c8acb' 'm3/collections/src/main/java/jdk/m3/collections/M3WindowPlan.java' \
            '1ce0e438254fad6c34f4a8b470c3034fb0b753ac34d604840368ab9136051f13' 'm3/collections/src/test/java/jdk/m3/collections/M3WindowPlanChangeContract.java' \
            'fe8d7aa768d60dca2890ffa48bcfd8d7bd3a36445f2ad3c412538c84023d42ef' 'm3/collections/src/test/java/jdk/m3/collections/M3WindowPlanChangeTest.java' | sha256sum -c -
      - name: Compile real owner and execute seeded strict contract
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/window-current"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/window-current" \
            m3/collections/src/main/java/jdk/m3/collections/M3WindowPlan.java \
            m3/collections/src/test/java/jdk/m3/collections/M3WindowPlanChangeContract.java
          java -cp "$RUNNER_TEMP/window-current" jdk.m3.collections.M3WindowPlanChangeContract \
            | tee "$RUNNER_TEMP/window-proof.txt"
          grep -Fx 'M3_WINDOW_DELTA_PROJECTION_PASS checks=349502' "$RUNNER_TEMP/window-proof.txt"
