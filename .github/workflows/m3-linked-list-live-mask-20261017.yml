name: M3 linked-list physical-slot state masks Java21
on:
  push:
    branches: ['m3/linked-list-live-mask-20261017']
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LinkedList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LinkedListLiveMaskContract.java'
      - 'm3/collections/qualification/m3-linked-list-live-mask-20261017/**'
      - '.github/workflows/m3-linked-list-live-mask-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recipe-and-real-owner:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Canonical postimage and fixed-point/refusal proof
        run: |
          mvn -B -ntp -f m3/collections/qualification/m3-linked-list-live-mask-20261017/recipe/pom.xml verify
          java -cp m3/collections/qualification/m3-linked-list-live-mask-20261017/recipe/target/classes \
            com.synexia.m3.M3LinkedListLiveMaskRecipe --check "$PWD"
      - name: Strict source Java21 and 25k seeded JDK LinkedList oracle
        shell: bash
        run: |
          set -euo pipefail
          pkg=m3/collections/src/main/java/com/m3/collections
          test=m3/collections/src/test/java/com/m3/collections
          classes="$RUNNER_TEMP/m3-linked-list-classes"
          mkdir -p "$classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$classes" \
            "$pkg/M3SlotArrays.java" "$pkg/M3SlotSpliterators.java" \
            "$pkg/M3LinkedList.java" "$test/M3LinkedListLiveMaskContract.java"
          java -ea -cp "$classes" com.m3.collections.M3LinkedListLiveMaskContract
      - name: Existing JNI C17 syntax preservation (native implementation unchanged)
        shell: bash
        run: |
          set -euo pipefail
          for c in m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
                   m3/collections/src/main/native/collections/m3_index_mask_window.c; do
            gcc -std=c17 -Wall -Wextra -Werror -pedantic -fsyntax-only \
              -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" "$c"
          done
      - name: Owning M3 collections compilation (full JDK/image admission separate)
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests compile
