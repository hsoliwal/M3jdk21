# SPDX-License-Identifier: Apache-2.0
name: M3 result-only array map receiver
on:
  pull_request:
    paths:
      - 'm3/collections/implementations/apache-*-map/src/main/java/jdk/m3/collections/apache/M3*Map.java'
      - 'make/m3/collections/qualification/array-map-receiver-20261102/**'
      - '.github/workflows/m3-array-map-result-only.yml'
  workflow_dispatch:
jobs:
  java21-array-map-receiver:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile each exact generated class in its member module
        shell: bash
        run: |
          set -euo pipefail
          for module in apache-hashed-map apache-linked-map apache-lru-map m3-long-object-linked-hash-map; do
            mvn -B -ntp -f "m3/collections/implementations/$module/pom.xml" -DskipTests package
          done
      - name: Run Java 21 / interpreter contract and storage-lane probes
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/implementations/apache-hashed-map/pom.xml \
            dependency:build-classpath "-Dmdep.outputFile=$RUNNER_TEMP/m3-apache-provider.cp"
          CP="$(cat "$RUNNER_TEMP/m3-apache-provider.cp")"
          for module in apache-hashed-map apache-linked-map apache-lru-map m3-long-object-linked-hash-map; do
            CP="$CP:$GITHUB_WORKSPACE/m3/collections/implementations/$module/target/classes"
          done
          mkdir -p "$RUNNER_TEMP/m3-receiver"
          javac --release 21 -Xlint:all -Werror -cp "$CP" -d "$RUNNER_TEMP/m3-receiver" \
            make/m3/collections/qualification/array-map-receiver-20261102/M3ArrayMapReceiverSmoke.java
          java -ea -cp "$CP:$RUNNER_TEMP/m3-receiver" jdk.m3.collections.receiver.M3ArrayMapReceiverSmoke
          java -Xint -ea -cp "$CP:$RUNNER_TEMP/m3-receiver" jdk.m3.collections.receiver.M3ArrayMapReceiverSmoke
      - name: Verify source blobs match qualified generated output
        shell: bash
        run: |
          set -euo pipefail
          cd m3/collections/implementations
          test "$(git hash-object apache-hashed-map/src/main/java/jdk/m3/collections/apache/M3HashedMap.java)" = 2887f69d2280458c7a8e1390eb84eb3e73570ac5
          test "$(git hash-object apache-linked-map/src/main/java/jdk/m3/collections/apache/M3LinkedMap.java)" = e3649a952f27268a8291a38c92e7d1149a734b5d
          test "$(git hash-object apache-lru-map/src/main/java/jdk/m3/collections/apache/M3LRUMap.java)" = 401bf0e56d0ab18b377b14d4de7b3432d46395fb
          test "$(git hash-object m3-long-object-linked-hash-map/src/main/java/jdk/m3/collections/id/M3LongObjectLinkedHashMap.java)" = bc8b45e9337fc1fadd139827d1197b357dbee3a3
