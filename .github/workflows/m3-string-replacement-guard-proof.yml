name: M3 String replacement guard proof
on:
  push:
    branches: ['m3/string-replacement-guard-20261012']
    paths:
      - '.github/workflows/m3-string-replacement-guard-proof.yml'
      - 'm3/runtime-integration/**'
      - 'm3/vendor/synexia/synexia-openrewrite-recipes/**'
      - 'src/java.base/share/classes/java/lang/String.java'
  pull_request:
    paths:
      - '.github/workflows/m3-string-replacement-guard-proof.yml'
      - 'm3/runtime-integration/**'
      - 'm3/vendor/synexia/synexia-openrewrite-recipes/**'
      - 'src/java.base/share/classes/java/lang/String.java'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  route-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify exact Synexia proof-tooling custody
        run: sha256sum -c m3/runtime-integration/string-replacement-guard-sha256.txt
      - name: Verify recipe refusal tests and fixed point
        run: bash m3/vendor/synexia/synexia-openrewrite-recipes/crates/m3-string-replacement-guard/verify.sh --check "$PWD"
      - name: Run replacement route mutation tests on exact String source
        run: python3 m3/runtime-integration/test_string_replacement_routes.py
      - name: Run complete M3 String source invariants without bypass
        run: python3 m3/runtime-integration/check-m3string-invariants.py
