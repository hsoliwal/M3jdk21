# SPDX-License-Identifier: Apache-2.0
name: M3 DOOP generation-safe borrow contract
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ObjectResidency.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ObjectResidencyBorrowTest.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3SlotAllocator28.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3IntLane28.java'
      - '.github/workflows/m3-doop-borrow-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  doop-borrow:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Download exact standalone JUnit console
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar' \
            -o "$RUNNER_TEMP/m3-junit-console.jar"
          printf '%s  %s\n' \
            '329bd10288875a74d04c9ca6b7c9889c265ddf87b21a9ea42a7f7392f391472a' \
            "$RUNNER_TEMP/m3-junit-console.jar" | sha256sum --check -
      - name: Compile exact M3 residency owner and original/new JUnit tests
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-doop-borrow"
          MAIN="m3/collections/src/main/java/com/m3/collections"
          TEST="m3/collections/src/test/java/com/m3/collections"
          mkdir -p "$OUT/main" "$OUT/test"
          javac --release 21 -Xlint:all -Werror -d "$OUT/main" \
            "$MAIN/M3Address28.java" \
            "$MAIN/M3IntLane28.java" \
            "$MAIN/M3BitLane28.java" \
            "$MAIN/M3SlotAllocator28.java" \
            "$MAIN/M3ObjectResidency.java"
          javac --release 21 -Xlint:all -Werror \
            -cp "$OUT/main:$RUNNER_TEMP/m3-junit-console.jar" \
            -d "$OUT/test" \
            "$TEST/M3ObjectResidencyTest.java" \
            "$TEST/M3ObjectResidencyBorrowTest.java"
      - name: Execute unchanged and new contract under small heap
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/m3-doop-borrow"
          java -ea -Xms16m -Xmx128m -jar "$RUNNER_TEMP/m3-junit-console.jar" \
            execute --disable-banner --fail-if-no-tests \
            --class-path "$OUT/main:$OUT/test" \
            --select-class com.m3.collections.M3ObjectResidencyTest \
            --select-class com.m3.collections.M3ObjectResidencyBorrowTest
