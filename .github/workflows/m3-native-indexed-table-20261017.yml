name: M3 Native Indexed Table Java and JNI
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedTable.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexedTable*'
      - 'm3/collections/qualification/m3-native-indexed-table-20261017/**'
      - '.github/workflows/m3-native-indexed-table-20261017.yml'
  workflow_dispatch:
jobs:
  real-m3-java-jni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail closed on noncanonical generated Java
        run: python3 m3/collections/qualification/m3-native-indexed-table-20261017/verify.py
      - name: Maven generated-source recipe fixed point and refusals
        run: |
          mvn -B -ntp -f m3/collections/qualification/m3-native-indexed-table-20261017/recipe-mirror/pom.xml verify
          java -cp m3/collections/qualification/m3-native-indexed-table-20261017/recipe-mirror/target/classes \
            com.synexia.m3.M3NativeIndexedTableRecipe --check "$GITHUB_WORKSPACE"
      - name: Strict Java21 compile with actual first-party M3 owners
        run: |
          mkdir -p "$RUNNER_TEMP/classes"
          javac --release 21 -proc:none -Xlint:all,-serial,-module -Werror \
            -sourcepath m3/collections/src/main/java \
            -d "$RUNNER_TEMP/classes" \
            m3/collections/src/main/java/com/m3/collections/M3IndexedTable.java \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexedTableSelfTest.java
      - name: Seeded real-owner Java differential, no adapters
        run: |
          java -cp "$RUNNER_TEMP/classes" com.m3.collections.M3IndexedTableSelfTest
          java -Xint -cp "$RUNNER_TEMP/classes" com.m3.collections.M3IndexedTableSelfTest
      - name: Build existing C17 JNI backend with fatal UBSan
        run: |
          JDK_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          gcc -std=c17 -fPIC -shared -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JDK_HOME/include" -I"$JDK_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Checked real JNI state selection, normal and interpreted
        run: |
          java -Xcheck:jni -Djava.library.path="$RUNNER_TEMP" -cp "$RUNNER_TEMP/classes" \
            com.m3.collections.M3IndexedTableSelfTest --native
          java -Xcheck:jni -Xint -Djava.library.path="$RUNNER_TEMP" -cp "$RUNNER_TEMP/classes" \
            com.m3.collections.M3IndexedTableSelfTest --native
      - name: Full owning m3/collections Maven JUnit method and original module
        run: mvn -B -ntp -f m3/collections/pom.xml -Dtest=M3IndexedTableTest test
