# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 historical receipt lineage and current filtered successor
on:
  pull_request:
    paths:
      - 'm3/collections/qualification/filtered-plan-current-master-20261027/**'
      - '.github/workflows/m3-filtered-receipt-lineage-20261027.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  historical-custody:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify immutable predecessor receipts independently of successor files
        run: python3 m3/collections/qualification/filtered-plan-current-master-20261027/verify_historical_lineage.py
      - name: Compile and test actual current-master filtered implementation
        run: bash m3/collections/qualification/filtered-plan-current-master-20261027/verify.sh
