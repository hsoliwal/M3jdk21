name: M3 Bulk Output Isolation

on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/jdk/internal/vm/parallel/BulkExecution.java'
      - 'test/jdk/jdk/internal/vm/parallel/BulkExecutionIsolationTest.java'
      - 'm3/tooling/migration-recipes/src/main/java/com/m3/rewrite/backport/M3BulkOutputIsolationRecipe.java'
      - 'm3/tooling/migration-recipes/src/test/java/com/m3/rewrite/backport/M3BulkOutputIsolationRecipeTest.java'
      - 'm3/tooling/migration-recipes/src/main/resources/com/m3/rewrite/backport/jdk21-hash-pinned/m3-bulk-output-isolation/**'
      - 'm3/tooling/migration-recipes/tasks/bulk-output-isolation/**'
      - 'm3/compatibility/bulk-output-isolation-20261013.md'
      - '.github/workflows/m3-bulk-output-isolation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  focused-patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict patched java.base and regression replay
        shell: bash
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/m3-bulk-output"
          src="$dir/source/jdk/internal/vm/parallel"
          out="$dir/classes"
          tests="$dir/tests"
          mkdir -p "$src" "$out" "$tests"
          cp src/java.base/share/classes/jdk/internal/vm/parallel/{BulkTask,BulkExecution}.java "$src/"
          javac -source 21 -target 21 -proc:none -Xlint:all,-module -Werror \
            --patch-module "java.base=$dir/source" -d "$out" "$src"/*.java
          javac -source 21 -target 21 -proc:none -Xlint:all,-module -Werror \
            --patch-module "java.base=$out" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -d "$tests" test/jdk/jdk/internal/vm/parallel/BulkExecutionIsolationTest.java
          java --patch-module "java.base=$out" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -cp "$tests" BulkExecutionIsolationTest
          java -Xint --patch-module "java.base=$out" \
            --add-exports java.base/jdk.internal.vm.parallel=ALL-UNNAMED \
            -cp "$tests" BulkExecutionIsolationTest

  recipe-receiver:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install canonical source-built recipe custody
        run: bash m3/synexia-import/pure-int-recipe-custody/install.sh "$PWD"
      - name: Execute target receiver fixed-point test
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3BulkOutputIsolationRecipeTest test
      - name: Re-run receipt recipe for no-diff admission
        run: |
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Drewrite.activeRecipes=com.m3.rewrite.backport.M3BulkOutputIsolationRecipe \
            rewrite:dryRun

  jdk-build-jtreg:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Get BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: Get JTReg
        id: jtreg
        uses: ./.github/actions/get-jtreg
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-12 g++-12 libxrandr-dev libxtst-dev libcups2-dev libasound2-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-12
      - name: Configure
        run: |
          bash configure --with-conf-name=linux-x64-bulk-isolation \
            --with-debug-level=release \
            --with-boot-jdk='${{ steps.bootjdk.outputs.path }}' \
            --with-jtreg='${{ steps.jtreg.outputs.path }}' \
            --with-zlib=system
      - name: Build release image
        run: make CONF=linux-x64-bulk-isolation images
      - name: Run focused jtreg
        run: |
          make CONF=linux-x64-bulk-isolation test \
            TEST="test/jdk/jdk/internal/vm/parallel/BulkExecutionIsolationTest.java"
