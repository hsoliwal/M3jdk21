name: M3JDK21 tree sibling index preflight

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3TreeWindowShiftContract.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3TreeWindowShiftTest.java'
      - 'm3/collections/qualification/tree-shift-20261021/**'
      - '.github/workflows/m3-tree-shift-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  original-java21-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the canonical emitted source identities
        shell: bash
        run: |
          printf '%s  %s\n' \
            '837aeb592e797902f9c50bcdbf4f85db3f9dbf97ee7537b5d6e85a9fa4a4e41a' 'm3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java' \
            'b9de04251293b7f376346083d644e241a3c63fd7b79b3b0044c4d10e42fe519e' 'm3/collections/src/test/java/com/m3/collections/M3TreeWindowShiftContract.java' \
            'c90296c22e121e0d7934bb74ccc30121438cbe47dd498a1f7ae489e6dcb0b679' 'm3/collections/src/test/java/com/m3/collections/M3TreeWindowShiftTest.java' | sha256sum -c -
      - name: Compile actual M3 owner and existing primitive index map
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/src/com/m3/collections" "$RUNNER_TEMP/classes"
          cat > "$RUNNER_TEMP/src/com/m3/collections/M3TreeProjection.java" <<'STUB'
          package com.m3.collections;
          final class M3TreeProjection {
              static final class Residency {
                  int size() { throw new UnsupportedOperationException(); }
                  int parentId(int index) { throw new UnsupportedOperationException(); }
                  int childIndex(int index) { throw new UnsupportedOperationException(); }
                  int physicalParent(int index) { throw new UnsupportedOperationException(); }
              }
          }
          STUB
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/classes" \
            "$RUNNER_TEMP/src/com/m3/collections/M3TreeProjection.java" \
            m3/collections/src/main/java/com/m3/collections/M3LongLongHashMap.java \
            m3/collections/src/main/java/com/m3/collections/M3TreeWindowPlan.java \
            m3/collections/src/test/java/com/m3/collections/M3TreeWindowShiftContract.java
          for mode in default interpreter c1 non-tiered; do
            case "$mode" in
              default) java_opts=() ;;
              interpreter) java_opts=(-Xint) ;;
              c1) java_opts=(-XX:TieredStopAtLevel=1) ;;
              non-tiered) java_opts=(-XX:-TieredCompilation) ;;
            esac
            java "${java_opts[@]}" -cp "$RUNNER_TEMP/classes" \
              com.m3.collections.M3TreeWindowShiftContract | tee "$RUNNER_TEMP/proof-$mode.txt"
            grep -Fx 'M3_TREE_WINDOW_SHIFT_PASS checks=2591918' "$RUNNER_TEMP/proof-$mode.txt"
          done
