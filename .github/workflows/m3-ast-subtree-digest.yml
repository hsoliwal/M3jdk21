name: M3AST subtree digest Java21
on:
  pull_request:
    paths:
      - 'm3/ast/src/main/java/com/m3/ast/M3SyntaxIndex.java'
      - 'm3/ast/src/main/java/com/m3/ast/M3SyntaxTree.java'
      - 'm3/ast/src/test/java/com/m3/ast/M3SyntaxIndexContract.java'
      - '.github/workflows/m3-ast-subtree-digest.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original primitive AST owners and run strict differential contracts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3ast-classes"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3ast-classes" \
            m3/ast/src/main/java/com/m3/ast/M3SyntaxTree.java \
            m3/ast/src/main/java/com/m3/ast/M3SyntaxIndex.java \
            m3/ast/src/test/java/com/m3/ast/M3SyntaxTreeContract.java \
            m3/ast/src/test/java/com/m3/ast/M3SyntaxIndexContract.java
          java -Xmx256m -cp "$RUNNER_TEMP/m3ast-classes" com.m3.ast.M3SyntaxTreeContract
          java -Xmx256m -cp "$RUNNER_TEMP/m3ast-classes" com.m3.ast.M3SyntaxIndexContract
          java -Xint -Xmx256m -cp "$RUNNER_TEMP/m3ast-classes" com.m3.ast.M3SyntaxIndexContract
