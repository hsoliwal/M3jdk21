# SPDX-License-Identifier: Apache-2.0
name: M3 typed signals focused public JUnit Java21 proof
# Former triggers (below, as of the move) now start job(s) 'm3-typed-signals-focused-junit-20261022__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/collections/qualification/typed-signals-junit-20261022/**'
#         - '.github/workflows/m3-typed-signals-focused-junit-20261022.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-maven:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify original Maven POM remains unmodified
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/m3/typed-signal-topk-20261022...HEAD
          git diff --quiet origin/m3/typed-signal-topk-20261022...HEAD -- m3/collections/pom.xml
      - name: Compile actual typed columns, image/CSR and TopK; run public JUnit suite
        run: >
          mvn -B -ntp
          -f m3/collections/qualification/typed-signals-junit-20261022/pom.xml
          test
