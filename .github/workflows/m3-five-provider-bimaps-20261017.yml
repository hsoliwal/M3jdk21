# SPDX-License-Identifier: Apache-2.0
name: M3 five-library SDK Guava and Apache BiMap
on:
  pull_request:
    paths:
      - 'm3/collections/interop/**'
      - 'm3/collections/qualification/m3-five-provider-bimaps-20261017/**'
      - '.github/workflows/m3-five-provider-bimaps-20261017.yml'
  workflow_dispatch:
jobs:
  source-sealed-sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual OpenRewrite Maven JUnit fixed-point/drift/9-postimage proof
        run: mvn -B -ntp -f m3/collections/qualification/m3-five-provider-bimaps-20261017/recipe/pom.xml clean verify
      - name: Check installed bytes against canonical SHA256 templates
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          root=Path(".")
          template=root/"m3/collections/qualification/m3-five-provider-bimaps-20261017/recipe/src/main/resources/com/synexia/rewrite/m3-five-provider-bimaps-20261017"
          for line in (template/"manifest.tsv").read_text(encoding="utf-8").splitlines():
              path,before,after,resource=line.split("\t")
              expected=(template/resource).read_bytes()
              installed=(root/path).read_bytes()
              assert hashlib.sha256(expected).hexdigest()==after,(path,"unsealed template")
              assert expected==installed,(path,"product drift")
              assert hashlib.sha256(installed).hexdigest()==after,(path,"postimage mismatch")
          print("PASS sealed OpenRewrite product postimages")
          PY
  five-provider-contracts:
    runs-on: ubuntu-latest
    needs: source-sealed-sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile/install actual M3 core
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Compile with Guava 33.4.8-jre, Apache 4.5.0, Eclipse 11.1.0 and Spring 6.2.0 real jars
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Exercise retained bounded C17/JNI primitive mask backend
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m3-bimap/classes" "$RUNNER_TEMP/m3-bimap/native"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/m3-bimap/classes" \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$RUNNER_TEMP/m3-bimap/native/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$RUNNER_TEMP/m3-bimap/native" \
            -cp "$RUNNER_TEMP/m3-bimap/classes" com.m3.collections.M3IndexMaskCompactorSelfTest
