permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Lint backport artifacts
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          paths = (
              "m3/backports/README.md",
              "m3/backports/JEP_CATALOGUE.tsv",
              "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv",
              "m3/backports/inventory.py",
              "m3/backports/pom.xml",
              "m3/backports/recipes/jdk-8357439/manifest.tsv",
              "m3/backports/recipes/jdk-8347112/adaptation.tsv",
              "m3/backports/recipes/jdk-8347112/README.md",
              "m3/backports/recipes/jdk-8364182/adaptation.tsv",
              "m3/backports/recipes/jdk-8364182/README.md",
              "m3/backports/recipes/jdk-8374808/adaptation.tsv",
              "m3/backports/recipes/jdk-8374808/README.md",
              "m3/backports/test_inventory.py",
              "m3/backports/verify.py",
              "make/modules/jdk.jcmd/Copy.gmk",
              "src/jdk.jcmd/share/conf/bash-completion/jcmd",
          )

          for name in paths:
              path = Path(name)
              data = path.read_bytes()
              if b"\r" in data:
                  raise SystemExit(f"{name}: CR byte")
              if b"\0" in data:
                  raise SystemExit(f"{name}: NUL byte")

              text = data.decode("utf-8")
              if path.suffix == ".tsv":
                  rows = list(csv.reader(text.splitlines(), delimiter="\t"))
                  if not rows:
                      raise SystemExit(f"{name}: empty TSV")
                  width = len(rows[0])
                  for line_no, row in enumerate(rows, 1):
                      if len(row) != width:
                          raise SystemExit(
                              f"{name}:{line_no}: expected {width} fields, found {len(row)}"
                          )
                      for field in row:
                          if field != field.strip(" "):
                              raise SystemExit(
                                  f"{name}:{line_no}: field has edge spaces"
                              )
              else:
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if line.rstrip(" \t") != line:
                          raise SystemExit(f"{name}:{line_no}: trailing whitespace")

          print("PASS: lint")
          PY

      - name: Compile and syntax checks
        shell: bash
        run: |
          python3 -m py_compile \
            m3/backports/inventory.py \
            m3/backports/jep_residue.py \
            m3/backports/test_inventory.py \
            m3/backports/test_jep_residue.py \
            m3/backports/verify.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("m3/backports/pom.xml")
          print("PASS: pom.xml")
          PY
          bash -n src/jdk.jcmd/share/conf/bash-completion/jcmd
          echo "PASS: compile/syntax"

      - name: Tests and Maven recipe crate
        shell: bash
        run: |
          python3 -m unittest -v \
            m3/backports/test_inventory.py \
            m3/backports/test_jep_residue.py
          python3 m3/backports/verify.py --root .
          mvn -B -f m3/backports/pom.xml test
          mvn -B -ntp -f m3/tooling/migration-recipes/pom.xml \
            -Dtest=M3Jdk8347112BackportRecipeTest,M3Jdk8364182BackportRecipeTest,M3Jdk8374808BackportRecipeTest test

      - name: jcmd completion runtime smoke
        shell: bash
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/jcmd" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "-l" ]]; then
            printf '%s\n' '123 app.Main' '456 other.Main'
          elif [[ "${2:-}" == "help" ]]; then
            printf '%s\n'               'The following commands are available:'               'VM.info'               'GC.heap_info'               'For more information about a specific command use help <command>.'
          fi
          EOF
          chmod +x "$tmp/jcmd"
          export PATH="$tmp:$PATH"

          source src/jdk.jcmd/share/conf/bash-completion/jcmd

          COMP_WORDS=(jcmd 12)
          COMP_CWORD=1
          _jcmd_completion
          [[ " ${COMPREPLY[*]} " == *" 123 "* ]]

          COMP_WORDS=(jcmd 123 VM.)
          COMP_CWORD=2
          _jcmd_completion
          [[ " ${COMPREPLY[*]} " == *" VM.info "* ]]

          echo "PASS: jcmd completion runtime smoke"

  javadoc-8347112:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install focused OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf make gcc g++ zip unzip \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxtst-dev libxt-dev

      - name: Configure Java 21-compatible JDK
        shell: bash
        run: |
          set -euo pipefail
          bash configure \
            --with-boot-jdk="$JAVA_HOME" \
            --with-debug-level=release \
            --with-jvm-variants=server \
            --disable-warnings-as-errors

      - name: Build jdk.javadoc module and launcher
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 jdk.javadoc-java jdk.javadoc-launchers

      - name: Run focused javadoc jtreg proof
        shell: bash
        run: |
          set -euo pipefail
          make JOBS=2 test TEST="test/langtools/jdk/javadoc/doclet/testCopyFiles/TestCopyFiles.java"

