name: M3 JDK21 backport admission

on:
  push:
    branches:
      - "aix/**"
      - "m3/**"
    paths:
      - "m3/backports/**"
      - "make/modules/jdk.jcmd/Copy.gmk"
      - "src/jdk.jcmd/share/conf/bash-completion/jcmd"
      - ".github/workflows/m3-jdk21-backports.yml"
  pull_request:
    paths:
      - "m3/backports/**"
      - "make/modules/jdk.jcmd/Copy.gmk"
      - "src/jdk.jcmd/share/conf/bash-completion/jcmd"
      - ".github/workflows/m3-jdk21-backports.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch exact branch/PR head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          curl --fail --location --retry 3 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}" \
            -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"

      - name: Prepare pinned JDK 21
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz' \
            -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n' \
            '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6' \
            "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"

      - name: Prepare pinned Maven 3.9.11
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            'https://archive.apache.org/dist/maven/maven-3/3.9.11/binaries/apache-maven-3.9.11-bin.tar.gz' \
            -o "$RUNNER_TEMP/maven.tar.gz"
          printf '%s  %s\n' \
            'bcfe4fe305c962ace56ac7b5fc7a08b87d5abd8b7e89027ab251069faebee516b0ded8961445d6d91ec1985dfe30f8153268843c89aa392733d1a3ec956c9978' \
            "$RUNNER_TEMP/maven.tar.gz" | sha512sum --check -
          tar -xzf "$RUNNER_TEMP/maven.tar.gz" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/apache-maven-3.9.11/bin" >> "$GITHUB_PATH"

      - name: Lint backport artifacts
        working-directory: ${{ env.REPO }}
        shell: bash
        run: |
          python3 - <<'PY'
          import csv
          from pathlib import Path

          paths = (
              "m3/backports/README.md",
              "m3/backports/JEP_CATALOGUE.tsv",
              "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv",
              "m3/backports/BACKPORT_PASSES.tsv",
              "m3/backports/BACKPORT_WORK_QUEUE.tsv",
              "m3/backports/inventory.py",
              "m3/backports/plan.py",
              "m3/backports/pom.xml",
              "m3/backports/recipes/jdk-8357439/manifest.tsv",
              "m3/backports/test_inventory.py",
              "m3/backports/test_plan.py",
              "m3/backports/verify.py",
              "make/modules/jdk.jcmd/Copy.gmk",
              "src/jdk.jcmd/share/conf/bash-completion/jcmd",
          )

          for name in paths:
              path = Path(name)
              data = path.read_bytes()
              if b"\r" in data:
                  raise SystemExit(f"{name}: CR byte")
              if b"\0" in data:
                  raise SystemExit(f"{name}: NUL byte")

              text = data.decode("utf-8")
              if path.suffix == ".tsv":
                  rows = list(csv.reader(text.splitlines(), delimiter="\t"))
                  if not rows:
                      raise SystemExit(f"{name}: empty TSV")
                  width = len(rows[0])
                  for line_no, row in enumerate(rows, 1):
                      if len(row) != width:
                          raise SystemExit(
                              f"{name}:{line_no}: expected {width} fields, found {len(row)}"
                          )
                      for field in row:
                          if field != field.strip(" "):
                              raise SystemExit(
                                  f"{name}:{line_no}: field has edge spaces"
                              )
              else:
                  for line_no, line in enumerate(text.splitlines(), 1):
                      if line.rstrip(" \t") != line:
                          raise SystemExit(f"{name}:{line_no}: trailing whitespace")

          print("PASS: lint")
          PY

      - name: Compile and syntax checks
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          python3 -m py_compile \
            m3/backports/inventory.py \
            m3/backports/plan.py \
            m3/backports/test_inventory.py \
            m3/backports/test_plan.py \
            m3/backports/verify.py
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse("m3/backports/pom.xml")
          print("PASS: pom.xml")
          PY
          bash -n src/jdk.jcmd/share/conf/bash-completion/jcmd
          echo "PASS: compile/syntax"

      - name: Tests and Maven recipe crate
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          java -version
          mvn -version
          python3 -m unittest discover -v -s m3/backports -p 'test_*.py'
          python3 m3/backports/verify.py --root .
          diff -u \
            m3/backports/BACKPORT_WORK_QUEUE.tsv \
            <(python3 m3/backports/plan.py --root .)
          mvn -B -f m3/backports/pom.xml test

      - name: jcmd completion runtime smoke
        shell: bash
        working-directory: ${{ env.REPO }}
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cat > "$tmp/jcmd" <<'EOF'
          #!/usr/bin/env bash
          if [[ "${1:-}" == "-l" ]]; then
            printf '%s\n' '123 app.Main' '456 other.Main'
          elif [[ "${2:-}" == "help" ]]; then
            printf '%s\n'               'The following commands are available:'               'VM.info'               'GC.heap_info'               'For more information about a specific command use help <command>.'
          fi
          EOF
          chmod +x "$tmp/jcmd"
          export PATH="$tmp:$PATH"

          source src/jdk.jcmd/share/conf/bash-completion/jcmd

          COMP_WORDS=(jcmd 12)
          COMP_CWORD=1
          _jcmd_completion
          [[ " ${COMPREPLY[*]} " == *" 123 "* ]]

          COMP_WORDS=(jcmd 123 VM.)
          COMP_CWORD=2
          _jcmd_completion
          [[ " ${COMPREPLY[*]} " == *" VM.info "* ]]

          echo "PASS: jcmd completion runtime smoke"
