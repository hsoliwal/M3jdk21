# SPDX-License-Identifier: Apache-2.0
name: M3AST original JDT Maven Gradle Kotlin provider checks

on:
  push:
    branches: [m3/ast-original-providers-20261019]
  pull_request:
    paths:
      - m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTAuthoritativeModels.java
      - m3/tooling/module-packs/parser/real-providers/**
      - .github/workflows/m3-ast-real-providers-20261019.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Resolve pinned test-only original provider libraries
        shell: bash
        run: |
          set -euo pipefail
          PACK=m3/tooling/module-packs/parser/real-providers
          mkdir -p "$RUNNER_TEMP/m3-real"
          mvn -B -ntp -f "$PACK/pom.xml" \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:build-classpath \
            "-Dmdep.outputFile=$RUNNER_TEMP/m3-real/classpath.txt"
          test -s "$RUNNER_TEMP/m3-real/classpath.txt"
      - name: Strict Java 21 compile of M3AST and real-provider probes
        shell: bash
        run: |
          set -euo pipefail
          PACK=m3/tooling/module-packs/parser
          CP="$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          mkdir -p "$RUNNER_TEMP/m3-real/classes"
          javac --release 21 -Xlint:all,-deprecation,-removal -Werror -proc:none \
            -cp "$CP" -d "$RUNNER_TEMP/m3-real/classes" \
            "$PACK/src/main/java/jdk/m3/parser/M3File.java" \
            "$PACK/src/main/java/jdk/m3/parser/M3ASTIndex.java" \
            "$PACK/src/main/java/jdk/m3/parser/M3ASTIngress.java" \
            "$PACK/src/main/java/jdk/m3/parser/M3ASTAuthoritativeModels.java" \
            "$PACK/real-providers/src/test/java/jdk/m3/parser/tests/M3RealProvidersSmoke.java" \
            "$PACK/real-providers/src/test/java/jdk/m3/parser/tests/M3GradleToolingSmoke.java" \
            "$PACK/real-providers/src/test/java/jdk/m3/parser/tests/M3KotlinPsiSmoke.java"
      - name: Actual JDT ASTParser, Maven ModelBuilder and Groovy SourceUnit
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/m3-real/classes:$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          java -ea -cp "$CP" jdk.m3.parser.tests.M3RealProvidersSmoke \
            "$RUNNER_TEMP/m3-real/model-proof" | tee "$RUNNER_TEMP/m3-real/providers.log"
          grep '^M3_AST_REAL_PROVIDERS_PASS checks=' "$RUNNER_TEMP/m3-real/providers.log"
      - name: Actual Gradle Tooling API 8.12 and project hierarchy
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/m3-real/classes:$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          java -ea -cp "$CP" jdk.m3.parser.tests.M3GradleToolingSmoke \
            "$RUNNER_TEMP/m3-real/gradle-project" | tee "$RUNNER_TEMP/m3-real/gradle.log"
          grep '^M3_AST_REAL_GRADLE_TOOLING_PASS ' "$RUNNER_TEMP/m3-real/gradle.log"
      - name: Original Kotlin embeddable compiler PSI and source TextRange
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/m3-real/classes:$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          java -ea -Xmx2g -cp "$CP" jdk.m3.parser.tests.M3KotlinPsiSmoke \
            | tee "$RUNNER_TEMP/m3-real/kotlin.log"
          grep '^M3_AST_REAL_KOTLIN_PSI_PASS ' "$RUNNER_TEMP/m3-real/kotlin.log"
      - name: Upload small proof receipts only
        if: always()
        shell: bash
        run: |
          mkdir -p real-providers-proof
          for f in providers.log gradle.log kotlin.log; do
            if test -f "$RUNNER_TEMP/m3-real/$f"; then
              cp "$RUNNER_TEMP/m3-real/$f" real-providers-proof/
            fi
          done
          if test -f "$RUNNER_TEMP/m3-real/model-proof/RESULT.txt"; then
            cp "$RUNNER_TEMP/m3-real/model-proof/RESULT.txt" real-providers-proof/model.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-real-model-provider-receipts
          path: real-providers-proof/
          retention-days: 14
          if-no-files-found: warn
