name: M3JDK21 live filtered/sorted physical viewport page
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3IndexedLiveView.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3IndexedLivePhysicalPage*.java'
      - 'm3/collections/qualification/indexed-live-physical-page-20261021/**'
      - '.github/workflows/m3-indexed-live-physical-page-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-owner-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact source-recipe postimages
        shell: bash
        run: |
          set -euo pipefail
          cat <<'HASHES' | sha256sum --check
          5af79b8408cd3f14e300a8f274e74ec539d3f945a0d03655b55ddc03eb351b70  m3/collections/src/main/java/com/m3/collections/M3IndexedLiveView.java
          e3fd3faa89389b150b1bb9fae967e79732873f4cd2494196246407131541391e  m3/collections/src/test/java/com/m3/collections/M3IndexedLivePhysicalPageContract.java
          330bbcac884527af49fa36f124830c653393c8477da1196c54f0b73f9235f56f  m3/collections/src/test/java/com/m3/collections/M3IndexedLivePhysicalPageTest.java
          HASHES
          git diff --check
      - name: Owning Maven JUnit and existing live view contracts
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml \
            -Dtest=M3IndexedLivePhysicalPageTest,M3IndexedLiveViewTest test
