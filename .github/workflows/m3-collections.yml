on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  historical-lane-recipe:
    name: Historical lane recipe with real SDK
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Prepare pinned Java 21 compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz' -o "$RUNNER_TEMP/m3jdk21.tar.gz"
          printf '%s  %s\n' 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94' "$RUNNER_TEMP/m3jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/m3jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
      - name: Install the source-built OpenRewrite closure
        shell: bash
        run: |
          set -euo pipefail
          # org.openrewrite:rewrite-java-21:8.17.1-m3-source-1 is built from the vendored source
          # reactor (m3/vendor/third_party/pom.xml); no registry publishes it.
          bash m3/m3-import/pure-int-recipe-custody/install.sh "$GITHUB_WORKSPACE" --dependencies-only
      - name: Verify frozen lane recipe and fixed point
        run: mvn --batch-mode --no-transfer-progress --file m3/collections/recipe/pom.xml verify
      - name: Retain historical recipe reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-collections-historical-recipe-${{ github.event.pull_request.head.sha || github.sha }}
          path: m3/collections/recipe/target/surefire-reports/
          if-no-files-found: warn

  installed-collections:
    name: Installed Java 21 collections and JNI
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Verify unambiguous collection donation metadata
        run: python3 -m unittest discover -s m3/collections -p 'test_verify_*.py' -v
      - name: Prepare pinned Java 21 compiler and JUnit console
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz' -o "$RUNNER_TEMP/m3jdk21.tar.gz"
          printf '%s  %s\n' 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94' "$RUNNER_TEMP/m3jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/m3jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 'https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar' -o "$RUNNER_TEMP/m3-junit-console.jar"
          printf '%s  %s\n' '329bd10288875a74d04c9ca6b7c9889c265ddf87b21a9ea42a7f7392f391472a' "$RUNNER_TEMP/m3-junit-console.jar" | sha256sum --check -
          printf 'JUNIT_CONSOLE_JAR=%s\n' "$RUNNER_TEMP/m3-junit-console.jar" >> "$GITHUB_ENV"
      - name: Verify installed module, contracts, packaging, JNI, and allocation
        run: python3 m3/collections/verify_donation.py --cost-probe
      - name: Retain installed module evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-collections-installed-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            m3/collections/target/donation-verification/evidence/
            m3/collections/target/donation-verification/junit-reports/
          if-no-files-found: warn

  filtered-splits-mask-spans:
    name: Full collection Java and JNI at exact head
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Record exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Prepare pinned Java 21 compiler
        shell: bash
        run: |
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz' -o "$RUNNER_TEMP/m3jdk21.tar.gz"
          printf '%s  %s\n' 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94' "$RUNNER_TEMP/m3jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/m3jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
      - name: Build source dependencies and run owning Java and all-native contracts
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 m3/collections/qualification/full-java-jni-20261018/verify.py
      - name: Retain actual head proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: full-collection-java-jni-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            m3/collections/target/full-java-jni/PROOF.json
            m3/collections/target/full-java-jni/java-reports/
            m3/collections/target/full-java-jni/native-reports/
            m3/collections/target/surefire-reports/
          if-no-files-found: warn

  vavr-bitset-prefix:
    name: BitSet prefix allocation and compatibility at exact head
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Prepare pinned Java 21 and JUnit
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12.1%2B1/OpenJDK21U-jdk_x64_linux_hotspot_21.0.12.1_1.tar.gz' -o "$RUNNER_TEMP/bitset-jdk.tar.gz"
          printf '%s  %s\n' 'ce79869e1307ed8ee1e2baa86a412b1eb5b75d10a01006d788a6f968bcfaee94' "$RUNNER_TEMP/bitset-jdk.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/bitset-jdk.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21.0.12.1+1/bin" >> "$GITHUB_PATH"
          curl --fail --location --retry 3 'https://repo.maven.apache.org/maven2/org/junit/platform/junit-platform-console-standalone/1.12.2/junit-platform-console-standalone-1.12.2.jar' -o "$RUNNER_TEMP/bitset-junit.jar"
          printf '%s  %s\n' '329bd10288875a74d04c9ca6b7c9889c265ddf87b21a9ea42a7f7392f391472a' "$RUNNER_TEMP/bitset-junit.jar" | sha256sum --check -
      - name: Compile actual collection sources and execute BitSet contracts
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/bitset-proof"
          mkdir -p "$proof"/{patch-source/java/util/stream,patch-source/java/util/function/ext,patch,classes,tests}
          git rev-parse HEAD > "$proof/head.txt"
          java -version > "$proof/runtime.txt" 2>&1
          # Compile the real M3 java.base dependencies; this bounded patch is not a full JDK build.
          cp src/java.base/share/classes/java/util/stream/Streams.java "$proof/patch-source/java/util/stream/"
          cp src/java.base/share/classes/java/util/function/ext/ObjLongFunction.java "$proof/patch-source/java/util/function/ext/"
          javac --patch-module java.base="$proof/patch-source" -d "$proof/patch" \
            "$proof/patch-source/java/util/stream/Streams.java" "$proof/patch-source/java/util/function/ext/ObjLongFunction.java" > "$proof/base-compile.log" 2>&1
          find src/jdk.m3.collections/share/classes src/jdk.m3.collections/providers/classes -name '*.java' ! -name module-info.java | sort > "$proof/sources.txt"
          while IFS= read -r source; do sha256sum "$source"; done < "$proof/sources.txt" > "$proof/sources.sha256"
          javac -J-Xmx1200m --patch-module java.base="$proof/patch" --add-exports java.base/java.util.function.ext=ALL-UNNAMED \
            -proc:none -d "$proof/classes" @"$proof/sources.txt" > "$proof/collection-compile.log" 2>&1
          javac -Xlint:all -Werror -proc:none -cp "$proof/classes" -d "$proof/classes" \
            src/jdk.m3.collections/providers/classes/jdk/m3/collections/vavr/collection/BitSet.java > "$proof/bitset-compile.log" 2>&1
          testroot=test/jdk/jdk/m3/collections/vavr/collection
          javac -Xlint:all -Werror -proc:none -cp "$proof/classes:$RUNNER_TEMP/bitset-junit.jar" -d "$proof/tests" \
            "$testroot/BitSetOracleKit.java" "$testroot/BitSetOracleOps.java" "$testroot/RefBitSetModule.java" \
            "$testroot/BitSetWordOpsOracleTest.java" "$testroot/BitSetPrefixAllocationTest.java" > "$proof/test-compile.log" 2>&1
          # Preserve the original oracle's exception-message checks across JIT warmup.
          java -Xmx768m -XX:-OmitStackTraceInFastThrow --patch-module java.base="$proof/patch" \
            --add-exports java.base/java.util.function.ext=ALL-UNNAMED -jar "$RUNNER_TEMP/bitset-junit.jar" execute \
            --class-path "$proof/tests:$proof/classes" --fail-if-no-tests \
            --select-class jdk.m3.collections.vavr.collection.BitSetWordOpsOracleTest \
            --select-class jdk.m3.collections.vavr.collection.BitSetPrefixAllocationTest \
            --reports-dir "$proof/reports" --disable-banner --details=summary | tee "$proof/tests.log"
          python3 - "$proof/reports" <<'PY'
          import pathlib, sys, xml.etree.ElementTree as ET
          reports = [ET.parse(p).getroot() for p in pathlib.Path(sys.argv[1]).glob('TEST-*.xml')]
          assert reports and sum(int(r.attrib['tests']) for r in reports) > 0, 'no executed tests'
          assert all(int(r.attrib.get(k, 0)) == 0 for r in reports for k in ('failures', 'errors', 'skipped')), 'incomplete BitSet proof'
          PY
      - name: Retain exact-head BitSet results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bitset-prefix-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/bitset-proof/*.txt
            ${{ runner.temp }}/bitset-proof/*.log
            ${{ runner.temp }}/bitset-proof/*.sha256
            ${{ runner.temp }}/bitset-proof/reports/
          if-no-files-found: warn
