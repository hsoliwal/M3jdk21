name: M3JDK Synexia MIndex rename delta receiver
# Former triggers (below, as of the move) now start job(s) 'm3-mindex-source-delta-receiver__*' in
# .github/workflows/checks-superset-05.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - 'm3/compatibility/mindex-rename-m3-source-delta-20261016.tsv'
#         - 'm3/compatibility/check_mindex_rename_m3_delta.py'
#         - 'm3/docs/m3index-migration-receiver-delta-20261016.md'
#         - '.github/workflows/m3-mindex-source-delta-receiver.yml'
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
      - name: Verify exact source-only pinned MIndex migration delta
        run: python3 m3/compatibility/check_mindex_rename_m3_delta.py --self-test
