# SPDX-License-Identifier: Apache-2.0
name: M3JDK Synexia MIndex rename delta receiver
on:
  pull_request:
    paths:
      - 'm3/compatibility/mindex-rename-synexia-source-delta-20261016.tsv'
      - 'm3/compatibility/check_mindex_rename_synexia_delta.py'
      - 'm3/docs/m3index-migration-receiver-delta-20261016.md'
      - '.github/workflows/m3-mindex-source-delta-receiver.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Diff hygiene
        run: git diff --check HEAD^ HEAD
      - name: Verify exact source-only pinned MIndex migration delta
        run: python3 m3/compatibility/check_mindex_rename_synexia_delta.py --self-test
