name: M3 Backport Patch Atom Custody

on:
  pull_request:
    paths:
      - 'm3/backports/commit_patch_atoms.py'
      - 'm3/backports/patch_atom_io.py'
      - 'm3/backports/test_commit_patch_atoms.py'
      - 'm3/backports/test_patch_atom_io.py'
      - 'm3/backports/PATCH_ATOM_CUSTODY_20261015.md'
      - '.github/workflows/m3-backport-patch-atom-custody.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  file-atom-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Source diff hygiene
        run: git diff --check
      - name: Exact patch recipe integration and second-run proof
        run: python3 -m unittest discover -s m3/backports -p test_commit_patch_atoms.py -v
      - name: Alias, traversal and idempotent output refusal proof
        run: python3 -m unittest discover -s m3/backports -p test_patch_atom_io.py -v
      - name: Retain the independent full JDK gate
        run: |
          echo 'Patch custody tests are not Java21 compatibility admission.'
          echo 'Full Maven/A3, OpenRewrite/JUnit, jtreg and runtime gates are unchanged.'
