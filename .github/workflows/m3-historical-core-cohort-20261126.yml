name: M3 historical core closed 81-source cohort
on:
  pull_request:
    paths:
      - 'm3/tooling/core-contract-matrix/**'
      - '.github/workflows/m3-historical-core-cohort-20261126.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-core-cohort:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      M3_CONTROL_ROOT: ${{ github.workspace }}/m3-core-cohort-control
      M3_SOURCE_ROOT: ${{ github.workspace }}/m3-core-cohort-original
      M3_ORIGINAL_COMMIT: 0f80ed69a89a8d0a32f04f0824fab2f0c1457525
    steps:
      - name: Checkout current qualification control plane only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3-core-cohort-control
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/tooling/core-contract-matrix/
      - name: Checkout the exact coherent historical sources
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3-core-cohort-original
          ref: 0f80ed69a89a8d0a32f04f0824fab2f0c1457525
          fetch-depth: 1
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /m3/core/
            /m3/build.sh
            /m3/lexicon/english-demo.txt
            /m3/lexicon/m3-number-target-map.tsv
            /m3/lexicon/m3-precompute-field-map.tsv
            /m3/lexicon/m3-source-manifest.tsv
            /m3/lexicon/m3-word-source-revisions.tsv
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Reserve independent proof output and fail closed on low storage
        shell: bash
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, shutil
          source = pathlib.Path(os.environ['M3_SOURCE_ROOT'])
          controls = pathlib.Path(os.environ['M3_CONTROL_ROOT'])
          output = pathlib.Path(os.environ['M3_PROOF_ROOT'])
          if not source.is_dir() or not controls.is_dir() or output.exists():
              raise SystemExit('expected disjoint, fresh source/control/proof roots')
          for parent in (source, controls):
              if parent.is_symlink():
                  raise SystemExit('redirected checkout root')
          if shutil.disk_usage(output.parent).free < 9 * 1024**3:
              raise SystemExit('8GiB reserve + 512MiB proof cap is not available')
          output.mkdir()
          for name in ('tmp', 'home', 'cache', 'config', 'data'):
              (output/name).mkdir()
          PY
      - name: Admit all 81 exact original source blobs and 75 Java owners
        shell: bash
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 -I -S -B "$M3_CONTROL_ROOT/m3/tooling/core-contract-matrix/verify_historical_cohort.py" \
            --source "$M3_SOURCE_ROOT" \
            --manifest "$M3_CONTROL_ROOT/m3/tooling/core-contract-matrix/CURRENT_INPUTS.json" \
            --expected-commit "$M3_ORIGINAL_COMMIT" \
            --report "$M3_PROOF_ROOT/HISTORICAL_SOURCESET.json"
          python3 -I -S -B "$M3_CONTROL_ROOT/m3/tooling/core-contract-matrix/test_verify_historical_cohort.py"
      - name: Execute original complete 18-by-4 core build from historical source
        shell: bash
        timeout-minutes: 14
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}
          TMPDIR: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/data
        run: |
          set -euo pipefail
          python3 -I -S -B "$M3_CONTROL_ROOT/m3/tooling/core-contract-matrix/qualify.py" \
            --source "$M3_SOURCE_ROOT" \
            --manifest "$M3_CONTROL_ROOT/m3/tooling/core-contract-matrix/CURRENT_INPUTS.json" \
            --out "$M3_PROOF_ROOT" --jdk "$JAVA_HOME"
      - name: Preserve original source identities and real execution logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-historical-core-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/HISTORICAL_SOURCESET.json
            ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/contract/RESULT.json
            ${{ runner.temp }}/m3-core-historical-${{ github.run_id }}-${{ github.run_attempt }}/contract/original-build.log
