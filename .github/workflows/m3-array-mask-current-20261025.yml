name: M3JDK21 current-head array mask contract gate
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3ArrayList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ArrayListShortWordMaskContract.java'
      - 'm3/arrays/pom.xml'
      - 'm3/collections/qualification/array-mask-current-20261025/**'
      - '.github/workflows/m3-array-mask-current-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  current-head-collections:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            m3/collections/**
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install real M3 arrays substrate
        run: mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Compile and test real M3 collections
        run: mvn -B -ntp -f m3/collections/pom.xml test
      - name: Differential against JDK ArrayList including 128-129 boundary
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListShortWordMaskContract
      - name: Existing exception, serialization and iterator oracle
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListRemoveIfProof
