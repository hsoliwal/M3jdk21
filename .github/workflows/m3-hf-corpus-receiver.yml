# SPDX-License-Identifier: Apache-2.0
name: M3 HF corpus receiver Java 21
on:
  pull_request:
    paths:
      - ".github/workflows/m3-hf-corpus-receiver.yml"
      - "m3/core/src/com/m3/text/M3CorpusProjectionDigest.java"
      - "m3/core/src/com/m3/text/M3CorpusSourceReceipt.java"
      - "m3/core/src/com/m3/text/M3LanguageCorpusManifest.java"
      - "m3/core/test/M3LanguageCorpusManifestTest.java"
      - "m3/lexicon/run-hf-corpus-receiver-proof.sh"
      - "m3/lexicon/hf-language-corpus-source-candidates.tsv"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-sealed-corpus-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict Java 21 and four runtime-mode refusal oracles
        run: bash m3/lexicon/run-hf-corpus-receiver-proof.sh
