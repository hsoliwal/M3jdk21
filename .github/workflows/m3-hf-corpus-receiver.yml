name: M3 HF corpus receiver Java 21
# Former triggers (below, as of the move) now start job(s) 'm3-hf-corpus-receiver__*' in
# .github/workflows/checks-superset-07.yml, gated by the same filters (.github/checks-superset/filters.json).
# This file keeps the jobs as the source of truth and runs by hand; after editing them run
#   python3 .github/checks-superset/generate.py build
#   on:
#     pull_request:
#       paths:
#         - ".github/workflows/m3-hf-corpus-receiver.yml"
#         - "src/java.base/share/classes/jdk/m3/text/M3CorpusProjectionDigest.java"
#         - "src/java.base/share/classes/jdk/m3/text/M3CorpusSourceReceipt.java"
#         - "src/java.base/share/classes/jdk/m3/text/M3LanguageCorpusManifest.java"
#         - "m3/core/test/M3LanguageCorpusManifestTest.java"
#         - "m3/lexicon/run-hf-corpus-receiver-proof.sh"
#         - "m3/lexicon/hf-language-corpus-source-candidates.tsv"
#     workflow_dispatch:
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java21-sealed-corpus-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Strict Java 21 and four runtime-mode refusal oracles
        run: bash m3/lexicon/run-hf-corpus-receiver-proof.sh
