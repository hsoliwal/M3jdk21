# Example only. Copy to .m3/recipe-boot.properties AFTER installing the pinned tool
# and replacing every pin. Paths below are relative to the .m3 directory.
# Installation census: product 3055b76e294423da047c0a2ee030045bca97ef00.
# The runtime target/base/head/patch pins still require the specific reviewed PR.
format=M3_RECIPE_BOOT_V1
mode=check
repository=hsoliwal/M3jdk21
targetBranch=master
targetSha=REPLACE_WITH_40_HEX_REVIEWED_TARGET_COMMIT
sourceRepository=..
outputDirectory=../../m3-recipe-boot-runs
pullRequests=123
pr.123.baseSha=REPLACE_WITH_40_HEX_CURRENT_PR_BASE
pr.123.headSha=REPLACE_WITH_40_HEX_REVIEWED_PR_HEAD
pr.123.patchSha256=REPLACE_WITH_64_HEX_REVIEWED_ORIGINAL_PATCH
pr.123.parent=0
reviewCandidates=false
pomPath=m3/pom.xml
buildTimeoutSeconds=300
tokenEnvironment=GITHUB_TOKEN
# For a separate pre-build config, mode=build also requires:
# mavenExecutable=/absolute/path/to/apache-maven/bin/mvn
