---
type: specs.openrewrite.org/v1beta/recipe
name: com.m3.openrewrite.M3SegmentedStringProjectionBoundaries
displayName: Harden M3 segmented String projection boundaries
description: >
  Applies the mechanical projection-boundary changes that let ordinary
  java.lang.String keep segmented canonical storage while contiguous Java/JNI
  array APIs materialize or copy only when their contracts require it.
recipeList:
  - org.openrewrite.text.FindAndReplace:
      find: |-
        byte[] value() {
                return value;
            }
      replace: |-
        byte[] value() {
                return m3Storage == null ? value : m3Storage.materialize();
            }
      caseSensitive: true
      filePattern: 'src/java.base/share/classes/java/lang/String.java'
  - org.openrewrite.text.FindAndReplace:
      find: |-
        if (s2.isEmpty()) {
                    // newly created string required, see JLS 15.18.1
                    return new String(s1);
                }
                // start "mixing" in length and coder or arguments, order is not
      replace: |-
        if (s2.isEmpty()) {
                    // newly created string required, see JLS 15.18.1
                    return new String(s1);
                }
                if (String.m3JoinedStringsEnabled()) {
                    String joined = String.m3Concat(s1, s2);
                    if (joined != null) {
                        return joined;
                    }
                }
                // start "mixing" in length and coder or arguments, order is not
      caseSensitive: true
      filePattern: 'src/java.base/share/classes/java/lang/StringConcatHelper.java'
  - org.openrewrite.text.FindAndReplace:
      find: |-
        if (s_len > 0) {
                if (!is_latin1) {
                  ArrayAccess<>::arraycopy_to_native(s_value, (size_t) typeArrayOopDesc::element_offset<jchar>(0),
                                                     buf, s_len);
                } else {
                  for (int i = 0; i < s_len; i++) {
                    buf[i] = ((jchar) s_value->byte_at(i)) & 0xff;
                  }
                }
              }
      replace: |-
        if (s_len > 0) {
                if (java_lang_String::is_m3_joined(s)) {
                  for (int i = 0; i < s_len; i++) {
                    buf[i] = java_lang_String::char_at(s, i);
                  }
                } else if (!is_latin1) {
                  ArrayAccess<>::arraycopy_to_native(s_value, (size_t) typeArrayOopDesc::element_offset<jchar>(0),
                                                     buf, s_len);
                } else {
                  for (int i = 0; i < s_len; i++) {
                    buf[i] = ((jchar) s_value->byte_at(i)) & 0xff;
                  }
                }
              }
      caseSensitive: true
      filePattern: 'src/hotspot/share/prims/jni.cpp'
  - org.openrewrite.text.FindAndReplace:
      find: |-
        if (paramCount == 2 && !mt.hasPrimitives() && suffix == null
                && constants[0] == null && constants[1] == null) {
            // Two reference arguments, no surrounding constants
            return simpleConcat();
        }
        // else... fall-through to slow-path
      replace: |-
        if (paramCount == 2 && !mt.hasPrimitives() && suffix == null
                && constants[0] == null && constants[1] == null) {
            // Two reference arguments, no surrounding constants
            return simpleConcat();
        }
        // Correctness-first segmented fallback. The existing fast paths above
        // remain allocation-minimal; complex indy shapes avoid the flat byte[]
        // builder while M3 storage is enabled. Specialized segment combinators
        // can replace this collector without changing the call-site contract.
        if (JLA.stringConcatUsesM3Storage()) {
            return generateM3Concat(mt, constants);
        }
        // else... fall-through to stock inline-copy slow-path
      caseSensitive: true
      filePattern: 'src/java.base/share/classes/java/lang/invoke/StringConcatFactory.java'
  - org.openrewrite.text.FindAndReplace:
      find: |-
        acceptMode = NOANCHOR;
        boolean result = parentPattern.root.match(this, from, text);
      replace: |-
        acceptMode = NOANCHOR;
        if (!parentPattern.m3MayMatch(text)) {
            this.first = -1;
            this.oldLast = this.last;
            this.modCount++;
            return false;
        }
        boolean result = parentPattern.root.match(this, from, text);
      caseSensitive: true
      filePattern: 'src/java.base/share/classes/java/util/regex/Matcher.java'
