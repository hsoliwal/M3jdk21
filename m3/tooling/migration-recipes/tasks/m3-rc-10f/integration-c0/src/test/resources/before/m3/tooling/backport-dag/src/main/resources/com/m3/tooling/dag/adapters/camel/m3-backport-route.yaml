        - to: { uri: "direct:recipe-junit" }
        - to: { uri: "direct:diff" }
        - to: { uri: "direct:lint" }
        - to: { uri: "direct:compile" }
        - to: { uri: "direct:jtreg" }
        - to: { uri: "direct:runtime" }
        - to: { uri: "direct:promote" }
