name: M3 JEP 474 ZGC capability equivalence

on:
  push:
    branches:
      - "m3/jep474-generational-zgc-equivalence-20261006"
    paths:
      - "m3/backports/recipes/jep-474-generational-zgc/**"
      - ".github/workflows/m3-jep474-zgc-equivalence.yml"
  pull_request:
    paths:
      - "m3/backports/recipes/jep-474-generational-zgc/**"
      - ".github/workflows/m3-jep474-zgc-equivalence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  equivalence:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Fetch exact JEP474 implementation commit
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/upstream-jdk"
          git -C "$RUNNER_TEMP/upstream-jdk" init -q
          git -C "$RUNNER_TEMP/upstream-jdk" remote add origin https://github.com/openjdk/jdk.git
          git -C "$RUNNER_TEMP/upstream-jdk" -c protocol.version=2 fetch             --filter=blob:none --no-tags origin             "4ba74475d44831c1fe49359458163cd1567e9619"
          printf 'UPSTREAM=%s\\n' "$RUNNER_TEMP/upstream-jdk" >> "$GITHUB_ENV"

      - name: Prove exact seven-path denominator and compatibility split
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import csv
          import os
          import subprocess
          from pathlib import Path

          packet = Path("m3/backports/recipes/jep-474-generational-zgc")
          expected = [
              line.strip()
              for line in (packet / "PATHS.txt").read_text(encoding="utf-8").splitlines()
              if line.strip()
          ]
          actual = subprocess.check_output(
              [
                  "git", "-C", os.environ["UPSTREAM"], "diff-tree",
                  "--no-commit-id", "--name-only", "-r",
                  "4ba74475d44831c1fe49359458163cd1567e9619",
              ],
              text=True,
          ).splitlines()
          if len(expected) != 7 or sorted(expected) != sorted(actual):
              raise SystemExit(
                  f"JEP474 denominator drift expected={len(expected)} actual={len(actual)} "
                  f"missing={sorted(set(actual)-set(expected))} "
                  f"extra={sorted(set(expected)-set(actual))}"
              )

          with (packet / "COMPATIBILITY_SPLIT.tsv").open(
              encoding="utf-8", newline=""
          ) as handle:
              split = {row["path"]: row for row in csv.DictReader(handle, delimiter="	")}
          if set(split) != set(expected):
              raise SystemExit("JEP474 compatibility split does not cover denominator")
          if split["src/hotspot/share/gc/shared/gc_globals.hpp"]["disposition"] != "REJECT_DEFAULT_JAVA21":
              raise SystemExit("JEP474 default-flip classification drift")
          diagnostics = {
              "src/hotspot/share/gc/x/xArguments.cpp",
              "src/hotspot/share/gc/x/xInitialize.cpp",
              "src/hotspot/share/runtime/arguments.cpp",
          }
          if any(split[path]["disposition"] != "OPT_IN_DIAGNOSTIC_REVIEW" for path in diagnostics):
              raise SystemExit("JEP474 diagnostic split drift")
          print("JEP474_DENOMINATOR=7")
          PY

      - name: Prove Java21 source keeps ZGenerational default false
        shell: bash
        run: |
          set -euo pipefail
          grep -F 'product(bool, ZGenerational, false,'             src/hotspot/share/gc/shared/gc_globals.hpp
          ! grep -F '{ "ZGenerational",' src/hotspot/share/runtime/arguments.cpp
          grep -F 'Using legacy single-generation mode'             src/hotspot/share/gc/x/xInitialize.cpp

      - name: Install OpenJDK build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             autoconf make gcc g++ zip unzip             libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev             libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev

      - name: Configure and build current M3JDK21 image
        shell: bash
        run: |
          set -euo pipefail
          bash configure             --with-boot-jdk="$JAVA_HOME"             --with-debug-level=release             --with-jvm-variants=server             --disable-warnings-as-errors
          make JOBS=2 images
          JAVA_BIN="$(find build -path '*/images/jdk/bin/java' -type f | head -n 1)"
          test -x "$JAVA_BIN"
          printf 'M3_JAVA=%s\\n' "$JAVA_BIN" >> "$GITHUB_ENV"

      - name: Prove Java21 ZGC default remains non-generational
        shell: bash
        run: |
          set -euo pipefail
          "$M3_JAVA" -XX:+UseZGC -XX:+PrintFlagsFinal -Xlog:gc+init -version             > target/jep474-default.log 2>&1
          grep -E 'bool[[:space:]]+ZGenerational[[:space:]]*=[[:space:]]*false'             target/jep474-default.log
          grep -F 'Using legacy single-generation mode' target/jep474-default.log
          ! grep -F 'Option ZGenerational was deprecated' target/jep474-default.log

      - name: Prove generational ZGC capability already exists by explicit opt-in
        shell: bash
        run: |
          set -euo pipefail
          "$M3_JAVA" -XX:+UseZGC -XX:+ZGenerational -XX:+PrintFlagsFinal -Xlog:gc+init -version             > target/jep474-generational.log 2>&1
          grep -E 'bool[[:space:]]+ZGenerational[[:space:]]*=[[:space:]]*true'             target/jep474-generational.log
          ! grep -F 'Using legacy single-generation mode' target/jep474-generational.log
          ! grep -F 'Option ZGenerational was deprecated' target/jep474-generational.log

      - name: Prove non-generational ZGC remains explicitly available
        shell: bash
        run: |
          set -euo pipefail
          "$M3_JAVA" -XX:+UseZGC -XX:-ZGenerational -XX:+PrintFlagsFinal -Xlog:gc+init -version             > target/jep474-nongenerational.log 2>&1
          grep -E 'bool[[:space:]]+ZGenerational[[:space:]]*=[[:space:]]*false'             target/jep474-nongenerational.log
          grep -F 'Using legacy single-generation mode' target/jep474-nongenerational.log
          ! grep -F 'Option ZGenerational was deprecated' target/jep474-nongenerational.log

      - name: Write equivalence receipt evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/jep474
          cp target/jep474-default.log target/jep474/default.log
          cp target/jep474-generational.log target/jep474/generational.log
          cp target/jep474-nongenerational.log target/jep474/nongenerational.log
          cat > target/jep474/result.tsv <<'EOF'
          field	value
          generational_capability	ALREADY_PRESENT_BY_EQUIVALENCE
          nongenerational_capability	PRESERVED
          java21_default	PRESERVED_NON_GENERATIONAL
          jep474_default_flip	NOT_IMPORTED
          deprecation_policy	NOT_IMPORTED_DEFAULT
          EOF

      - name: Upload JEP474 equivalence evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: jep474-equivalence-${{ github.run_id }}
          path: target/jep474
          if-no-files-found: error
          retention-days: 30
