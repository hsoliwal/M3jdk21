name: com.m3.rewrite.MIndexStringBulkCharBoundary
displayName: Bulk materialize MIndexString UTF-16 at compatibility boundaries
description: >-
  Applies the reviewed hash-pinned java.lang.MIndexString bulk UTF-16 range copy
  so String.toCharArray/getChars allocate only their required destination and
  traverse canonical joined atoms sequentially instead of resolving every code unit.
