name: com.synexia.m3.NeedleWindowLane
displayName: M3JDK21 M3 needles over M3 haystacks through the flat needle's window lane
description: >-
  M3String.indexOf and lastIndexOf with an M3 needle ran the A14 skip and KMP searches unit by unit
  over the owner after the trigram gates (cold, a 16384-unit Latin-1 source 21 us against 5 flat;
  a hit at the end of a hot source the same). The needle now comes out once in its compact value
  and the haystack takes the flat needle's window lane (A27, graded by A33): bulk windows in the
  haystack's coder and the stock vectorized searches, the window loops shared by both lanes; the
  gates, the plans and the facts are untouched. Java step: M3String and the jtreg proof; no
  upstream file changed. Stacks on crate m3-trigram-facts-repeat (branch order); the M3String
  preimage is the A33 postimage.
