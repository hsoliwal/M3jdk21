type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.m3.MeasuredRope
displayName: M3JDK21 M3MeasuredRope measured-node contract
description: >-
  Adds com.m3.precompute.M3MeasuredRope with its M3RopeArena, M3RopeMeasure, M3RopeMetric and
  M3RopeMeasures to the M3JDK21 precompute port: a persistent AVL rope over immutable String slices whose
  nodes carry pluggable monoid measures in primitive arena lanes (no stored node objects), with
  persistent insert/remove/replace/slice/concat, range summaries and metric seek. Built-in measures:
  String hash, code points and UTF-8 length with surrogate seam repair (node form of M3TextMetrics, from
  Synexia IndexTextMetrics), CR|LF-aware lines, whitespace runs and a packed DFA transfer element.
  Tests transpile the apple/swift-collections RopeModuleTests scenarios (pattern only) and add a
  40,000-operation StringBuilder differential. No java.lang type is replaced or modified.
recipeList:
  - com.synexia.rewrite.M3HashPinnedJavaSnapshotRecipe:
      crateName: m3-measured-rope
