type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.m3.FrozenLongMultimapTable
displayName: M3JDK21 M3FrozenLongMultimap + M3FrozenLongTable received owners (LS3)
description: >-
  Receives com.m3.collections.M3FrozenLongMultimap (CSR: sorted key lane, offset lane, value lane in per-key
  insertion order) and com.m3.collections.M3FrozenLongTable (CSR: sorted row lane, offset lane, column and
  value lanes sorted by column) over their exact five-library scaffold preimages: immutable, shared FROZEN
  owner state word, no stored nodes (no per-key collections, no Table.Cell), per-element allocation 0 for
  queries, adapted from the first-party Synexia donors PackedLongLongMultiMap and foss/FrozenLongTable. Adds
  self-differentials and Guava provider differentials (ImmutableListMultimap, ImmutableTable with natural
  ordering; test scope of m3/collections/interop only). No java.util type is replaced.
recipeList:
  - com.synexia.rewrite.M3HashPinnedJavaSnapshotRecipe:
      crateName: m3-frozen-long-multimap-table
