type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.m3.LongArrayListUnion
displayName: M3JDK21 M3LongArrayList union owner
description: >-
  Resolves the three competing com.m3.collections.M3LongArrayList claims (JDK-shaped backend v1,
  PackedLongList lineage, Synexia-collections lineage) into one semantic owner: the JDK-shaped class
  already on M3JDK21 master gains the PackedLongList surface (addIf, filterInPlace, sort, binarySearch,
  deduplicateSorted, copyOf, stack operations, owner-indirected spliterator) with fail-fast modCount on
  every structural mutation. Adds M3LongList (boolean add/addAll; insert/removeValue defaulted aliases),
  M3LongStack, M3LongListSpliterator, two M3Collections factories and the adapted lineage test from
  exact hash-pinned preimages. Proving-ground only; java.util.ArrayList remains authority.
recipeList:
  - com.synexia.rewrite.M3HashPinnedJavaSnapshotRecipe:
      crateName: m3-long-array-list-union
