name: com.synexia.m3.LongLongLinkedHashMap
displayName: M3JDK21 M3LongLongLinkedHashMap proving-ground owner
description: >-
  Adds com.m3.collections.M3LongLongLinkedHashMap, an insertion-ordered primitive long-to-long
  map: the M3LongLongHashMap open-addressed table (parallel key/value lanes, byte occupancy) plus
  previous/next slot link lanes with first/last endpoints (no per-entry node), adapted from the
  first-party Synexia donor PackedLongLongOrderedMap under the LongLongOrderedMap contract, with
  the java.util.LinkedHashMap SequencedMap surface over primitives and its differential test.
  Proving ground only (wave 2 of the COLLECTIONS family); no java.util type is replaced.
recipeList:
  - com.synexia.rewrite.M3HashPinnedJavaSnapshotRecipe:
      crateName: m3-linked-hash-map
