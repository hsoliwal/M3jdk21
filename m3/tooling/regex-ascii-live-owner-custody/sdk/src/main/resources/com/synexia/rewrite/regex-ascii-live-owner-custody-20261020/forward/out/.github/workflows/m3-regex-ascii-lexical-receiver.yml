          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-regex-ascii-lexical-receiver-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-regex-ascii-lexical-receiver-${{ github.run_id }}-${{ github.run_attempt }}/data
        if: ${{ always() && steps.artifact_payload.outputs.allowed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-regex-ascii-lexical-receiver-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-regex-ascii-lexical-receiver-${{ github.run_id }}-${{ github.run_attempt }}/artifacts/
          include-hidden-files: true
