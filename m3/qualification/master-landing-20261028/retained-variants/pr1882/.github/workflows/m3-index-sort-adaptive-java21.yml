# SPDX-License-Identifier: Apache-2.0
# Canonical CI candidate: Synexia PR #13224; target: original M3JDK21 PR #1882.
name: M3JDK21 original adaptive index-sort Java21 proof

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexSort.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexSortAdaptiveContract.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexSortAdaptiveTest.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexSortStrictContract.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexSortStrictTest.java'
      - 'm3/collections/qualification/index-sort-adaptive/**'
      - '.github/workflows/m3-index-sort-adaptive-java21.yml'

permissions:
  contents: read

jobs:
  source-sealed-java21:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind exact PR head and original product source
        shell: bash
        env:
          M3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_EXPECTED_HEAD"
          test "$(git hash-object m3/collections/src/main/java/jdk/m3/collections/M3IndexSort.java)" = '9fdb435f3212a165262cb18ae11fcb1e9e56ae3e'
          test "$(git hash-object m3/collections/src/test/java/jdk/m3/collections/M3IndexSortAdaptiveContract.java)" = '60041005c55cfaf8e9f65ff3d83ad53ed2f4f1b9'
          test "$(git hash-object m3/collections/src/test/java/jdk/m3/collections/M3IndexSortAdaptiveTest.java)" = '8c1f4d0e1e1862e432be2b85bcc542ae4d80925a'
          test "$(git hash-object m3/collections/src/test/java/jdk/m3/collections/M3IndexSortStrictContract.java)" = '50483be714e2fc8436729241a57ab941c73b4709'
          test "$(git hash-object m3/collections/src/test/java/jdk/m3/collections/M3IndexSortStrictTest.java)" = '52df18993bcde6be7509fbbb441149a880dda149'
      - name: Strict compile of original M3JDK21 index owner and oracle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-index-sort"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/m3-index-sort" \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexSort.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexSortAdaptiveContract.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexSortStrictContract.java
      - name: Execute exact Java21 normal and interpreter contract
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/m3-index-sort" \
            jdk.m3.collections.M3IndexSortAdaptiveContract \
            | tee "$RUNNER_TEMP/m3-index-sort-normal.txt"
          java -Xint -cp "$RUNNER_TEMP/m3-index-sort" \
            jdk.m3.collections.M3IndexSortAdaptiveContract \
            | tee "$RUNNER_TEMP/m3-index-sort-interpreter.txt"
          grep -Fxq 'PASS M3_INDEX_SORT_ADAPTIVE checks=6576' "$RUNNER_TEMP/m3-index-sort-normal.txt"
          cmp "$RUNNER_TEMP/m3-index-sort-normal.txt" "$RUNNER_TEMP/m3-index-sort-interpreter.txt"
          java -cp "$RUNNER_TEMP/m3-index-sort" \
            jdk.m3.collections.M3IndexSortStrictContract \
            | tee "$RUNNER_TEMP/m3-index-sort-strict-normal.txt"
          java -Xint -cp "$RUNNER_TEMP/m3-index-sort" \
            jdk.m3.collections.M3IndexSortStrictContract \
            | tee "$RUNNER_TEMP/m3-index-sort-strict-interpreter.txt"
          grep -Fxq 'PASS M3_INDEX_SORT_STRICT checks=9' "$RUNNER_TEMP/m3-index-sort-strict-normal.txt"
          cmp "$RUNNER_TEMP/m3-index-sort-strict-normal.txt" "$RUNNER_TEMP/m3-index-sort-strict-interpreter.txt"
      - name: Preserve bounded proof receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3-index-sort-adaptive-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-index-sort-*.txt
          if-no-files-found: warn
          retention-days: 14

  whole-module-java21:
    needs: source-sealed-java21
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build original jdk.m3.arrays then jdk.m3.collections on module path
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          bash m3/collections/qualification/index-sort-adaptive/verify-module-java21.sh "$PWD"
