# SPDX-License-Identifier: Apache-2.0
name: M3 JNI rank-run LeetCode Java 21

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRankIndex.java'
      - 'm3/collections/src/main/native/collections/m3_long_rank_batch_jni.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongRunStatisticsContract.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongRunStatisticsTest.java'
      - 'm3/collections/qualification/rank-run-jni-20261026/**'
      - '.github/workflows/m3-rank-run-jni-java21.yml'

permissions:
  contents: read

jobs:
  original-java-jni-rank-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact PR HEAD and canonical generated Java/C source seals
        env:
          M3_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$M3_EXPECTED_HEAD"
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java)" = '3617962b12e314cc60670171c923b4bbca78da48'
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3LongRankIndex.java)" = '6a8cf91eb78b6e77fb53b73d55cea0a214a33dd7'
          test "$(git hash-object m3/collections/src/main/native/collections/m3_long_rank_batch_jni.c)" = 'fab1b17dc529b81a401dd1d3d77fcb8035dc33c7'
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3LongRunStatisticsContract.java)" = 'c2b46e696d6a55b03632651d4d43d4f05e398bb2'
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3LongRunStatisticsTest.java)" = '7d1083709ae5a7107003752157c002295908b53a'
      - name: Compile actual original rank source and source-owned executable differential
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-rank-run/classes" "$RUNNER_TEMP/m3-rank-run/native"
          src=m3/collections/src/main/java/com/m3/collections
          tests=m3/collections/src/test/java/com/m3/collections
          javac --release 21 -Xlint:all,-module -Werror -d "$RUNNER_TEMP/m3-rank-run/classes" \
            "$src/M3LongCollection.java" "$src/M3LongIterator.java" \
            "$src/M3LaneSearch.java" "$src/M3LongRankBatchNative.java" \
            "$src/M3LongRankIndex.java" "$tests/M3LongRunStatisticsContract.java"
      - name: Compile whole existing m3rankbatch C17 JNI owner under UBSan
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -fsanitize=undefined \
            -fno-sanitize-recover=undefined -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_long_rank_batch_jni.c \
            -o "$RUNNER_TEMP/m3-rank-run/native/libm3rankbatch.so"
          nm -D "$RUNNER_TEMP/m3-rank-run/native/libm3rankbatch.so" \
            | grep -Fq 'Java_com_m3_collections_M3LongRankBatchNative_runStatistics0'
      - name: Java fallback and native required parity, ordinary and interpreted JVM
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/m3-rank-run/classes"
          lib="$RUNNER_TEMP/m3-rank-run/native"
          java -ea -cp "$classes" \
            com.m3.collections.M3LongRunStatisticsContract \
            | tee "$RUNNER_TEMP/m3-rank-run/java.txt"
          grep -Fxq 'PASS M3_LONG_RUN_STATISTICS checks=9792 nativeRequired=false' \
            "$RUNNER_TEMP/m3-rank-run/java.txt"
          java -ea -Xcheck:jni -Dm3.collections.rank.native=true \
            -Djava.library.path="$lib" -cp "$classes" \
            com.m3.collections.M3LongRunStatisticsContract --native-required \
            | tee "$RUNNER_TEMP/m3-rank-run/native.txt"
          java -ea -Xint -Xcheck:jni -Dm3.collections.rank.native=true \
            -Djava.library.path="$lib" -cp "$classes" \
            com.m3.collections.M3LongRunStatisticsContract --native-required \
            | tee "$RUNNER_TEMP/m3-rank-run/interpreted.txt"
          grep -Fxq 'PASS M3_LONG_RUN_STATISTICS checks=11031 nativeRequired=true' \
            "$RUNNER_TEMP/m3-rank-run/native.txt"
          cmp "$RUNNER_TEMP/m3-rank-run/native.txt" "$RUNNER_TEMP/m3-rank-run/interpreted.txt"
      - name: Retain actual JNI proof receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3-rank-run-jni-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-rank-run/*.txt
          if-no-files-found: warn
          retention-days: 14
