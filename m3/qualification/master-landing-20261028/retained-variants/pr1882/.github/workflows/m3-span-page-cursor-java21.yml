# SPDX-License-Identifier: Apache-2.0
# Product result from canonical Synexia C/Java hash-pinned recipes.
name: M3 Span JNI persistent page cursor Java 21

on:
  pull_request:
    paths:
      - '.github/workflows/m3-span-page-cursor-java21.yml'
      - 'm3/collections/src/main/native/collections/m3_span_index_jni.c'
      - 'm3/collections/src/test/native/m3_span_page_cursor_contract.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3SpanIndexSelfTest.java'

permissions:
  contents: read

jobs:
  original-java-and-native-page-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Bind exact PR head and three canonical result blobs
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object m3/collections/src/main/native/collections/m3_span_index_jni.c)" = 'ebfc70cb030aa62a0197caf6dcb4990a37820e45'
          test "$(git hash-object m3/collections/src/test/native/m3_span_page_cursor_contract.c)" = '3025ce6129fbba4e4b97291cb82cd61e9a655c64'
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3SpanIndexSelfTest.java)" = '521a80c189cb12722d2836d7d413a2e398ff72c5'
      - name: Compile and run real production C page helper and oracle under UBSan
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-span"
          cc -std=c17 -O2 -Wall -Wextra -Werror -pedantic \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/test/native/m3_span_page_cursor_contract.c \
            -o "$RUNNER_TEMP/m3-span/span-cursor-test"
          "$RUNNER_TEMP/m3-span/span-cursor-test" | tee "$RUNNER_TEMP/m3-span/cursor.txt"
          grep -Eq '^PASS M3_SPAN_PAGE_CURSOR assertions=[1-9][0-9]*$' "$RUNNER_TEMP/m3-span/cursor.txt"
      - name: Compile original JNI export and exact Java21 owners
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -fPIC -shared \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_span_index_jni.c \
            -o "$RUNNER_TEMP/m3-span/libm3_collections_span.so"
          mkdir -p "$RUNNER_TEMP/m3-span/classes"
          javac --release 21 -Xlint:all,-module -Werror \
            -d "$RUNNER_TEMP/m3-span/classes" \
            m3/collections/src/main/java/com/m3/collections/M3SlotArrays.java \
            m3/collections/src/main/java/com/m3/collections/M3SpanIndex.java \
            m3/collections/src/test/java/com/m3/collections/M3SpanIndexSelfTest.java
      - name: Actual Java/JNI integration and -Xcheck:jni page boundary oracle
        shell: bash
        run: |
          set -euo pipefail
          java -Xcheck:jni -Dm3.span.paging.native.required=true \
            -Djava.library.path="$RUNNER_TEMP/m3-span" \
            -cp "$RUNNER_TEMP/m3-span/classes" \
            com.m3.collections.M3SpanIndexSelfTest | tee "$RUNNER_TEMP/m3-span/jni.txt"
          grep -Eq '^M3SpanIndex Java21/JNI oracle: PASS [1-9][0-9]* assertions, JNI=true$' "$RUNNER_TEMP/m3-span/jni.txt"
      - name: Preserve all native and Java oracle receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3-span-cursor-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-span/*.txt
          if-no-files-found: warn
          retention-days: 14
