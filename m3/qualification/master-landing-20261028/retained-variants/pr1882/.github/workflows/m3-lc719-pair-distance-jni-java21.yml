# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 LC719 native pair-distance Java21

on:
  pull_request:
    paths:
      - '.github/workflows/m3-lc719-pair-distance-jni-java21.yml'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3LongRankIndex.java'
      - 'm3/collections/src/main/native/collections/m3_long_rank_batch_jni.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongPairDistanceContract.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3LongPairDistanceTest.java'
      - 'm3/collections/qualification/lc719-pair-distance-jni-20261026/**'

permissions:
  contents: read

jobs:
  exact-original-java-c-jni:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Require exact PR HEAD and five canonical original product source blobs
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java)" = '8106997f17e17fa584f1b3437360f31d85609188'
          test "$(git hash-object m3/collections/src/main/java/com/m3/collections/M3LongRankIndex.java)" = '0f9763abfa67046490f344abfe620ae086d833c2'
          test "$(git hash-object m3/collections/src/main/native/collections/m3_long_rank_batch_jni.c)" = '294447e6fe84c37a7b7bdbc3492a9bf62a78a731'
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3LongPairDistanceContract.java)" = 'a28b679781123efa0b4c3ae4721d1e03de69a435'
          test "$(git hash-object m3/collections/src/test/java/com/m3/collections/M3LongPairDistanceTest.java)" = '7dbc1c1bc8f78766492cd04252ba75fb4c2603e9'
      - name: Strict compile original Java owner, contract and JNI header
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/m3-lc719/classes" "$RUNNER_TEMP/m3-lc719/headers" "$RUNNER_TEMP/m3-lc719/native"
          javac --release 21 -Xlint:all -Werror \
            -h "$RUNNER_TEMP/m3-lc719/headers" \
            -d "$RUNNER_TEMP/m3-lc719/classes" \
            m3/collections/src/main/java/com/m3/collections/M3LongRankBatchNative.java \
            m3/collections/src/test/java/com/m3/collections/M3LongPairDistanceContract.java
      - name: Compile original C17 rank JNI with generated Java ABI and UBSan
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -fPIC \
            -fsanitize=undefined -fno-sanitize-recover=undefined \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -include "$RUNNER_TEMP/m3-lc719/headers/com_m3_collections_M3LongRankBatchNative.h" \
            -shared m3/collections/src/main/native/collections/m3_long_rank_batch_jni.c \
            -o "$RUNNER_TEMP/m3-lc719/native/libm3rankbatch.so"
      - name: Compare Java-only original owner against checked JNI and interpreter
        shell: bash
        run: |
          set -euo pipefail
          java -cp "$RUNNER_TEMP/m3-lc719/classes" \
            com.m3.collections.M3LongPairDistanceContract \
            | tee "$RUNNER_TEMP/m3-lc719-java.txt"
          java -Xcheck:jni \
            -Dm3.collections.rank.native=true \
            -Djava.library.path="$RUNNER_TEMP/m3-lc719/native" \
            -cp "$RUNNER_TEMP/m3-lc719/classes" \
            com.m3.collections.M3LongPairDistanceContract \
            | tee "$RUNNER_TEMP/m3-lc719-native.txt"
          java -Xint -Xcheck:jni \
            -Dm3.collections.rank.native=true \
            -Djava.library.path="$RUNNER_TEMP/m3-lc719/native" \
            -cp "$RUNNER_TEMP/m3-lc719/classes" \
            com.m3.collections.M3LongPairDistanceContract \
            | tee "$RUNNER_TEMP/m3-lc719-interpreter.txt"
          grep -Fxq 'PASS M3_LONG_PAIR_DISTANCE_719 checks=10893 native=false' "$RUNNER_TEMP/m3-lc719-java.txt"
          grep -Fxq 'PASS M3_LONG_PAIR_DISTANCE_719 checks=11047 native=true' "$RUNNER_TEMP/m3-lc719-native.txt"
          cmp "$RUNNER_TEMP/m3-lc719-native.txt" "$RUNNER_TEMP/m3-lc719-interpreter.txt"
      - name: Preserve exact-head execution receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: m3-lc719-jni-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/m3-lc719-*.txt
          if-no-files-found: warn
          retention-days: 14
