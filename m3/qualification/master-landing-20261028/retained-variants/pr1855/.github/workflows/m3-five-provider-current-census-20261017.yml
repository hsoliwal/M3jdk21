# SPDX-License-Identifier: Apache-2.0
name: M3 SDK exact 34-owner interop source census
on:
  pull_request:
    paths:
      - 'm3/collections/interop/qualification/current-census-20261017/**'
      - 'm3/collections/interop/qualification/compiler-three-test-successor-20261022/**'
      - 'm3/collections/interop/qualification/apache-bag-450-successor-20261022/**'
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3ApacheBag.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3ApacheCollectionsTest.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryKeyRangesTest.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveProviderFlagSelectionTest.java'
      - 'm3/collections/qualification/m3-five-provider-current-census-20261017/**'
      - '.github/workflows/m3-five-provider-current-census-20261017.yml'
  workflow_dispatch:
jobs:
  source-sealed-current-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # First reproduce the exact previous 76-owner and three-test source generation.
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/M3jdk21
          ref: m3/interop-three-test-compile-receiver-20261022
          path: previous-product
          sparse-checkout: |
            m3/collections/interop
          persist-credentials: false
      # Run the unchanged 36+7+40 source verifier against its real predecessor,
      # then compare exactly three changes in the new product source generation.
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/M3jdk21
          ref: 4bd27a6fc78ba3f7ca019125c096c33d8a324cee
          path: predecessor-product
          sparse-checkout: |
            m3/collections/interop
          persist-credentials: false
      # Prove the 36 historical owners at their real authoring commit, without
      # relaxing the immutable current-census-20261017 source verifier.
      - uses: actions/checkout@v4
        with:
          repository: hsoliwal/M3jdk21
          ref: a720780b1a5ab41ea27182b9b7ad873efdf533b4
          path: historical-product
          sparse-checkout: |
            m3/collections/interop
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual Maven/OpenRewrite named recipe, fixed point, drift refusal
        run: mvn -B -ntp -f m3/collections/qualification/m3-five-provider-current-census-20261017/recipe/pom.xml clean verify
      - name: Check exact four installed Python/TSV/doc postimages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path(".")
          r=root/"m3/collections/qualification/m3-five-provider-current-census-20261017/recipe/src/main/resources/com/synexia/rewrite/m3-five-provider-current-census-20261017"
          rows=(r/"manifest.tsv").read_text(encoding="utf-8").splitlines()
          assert len(rows)==4,len(rows)
          for line in rows:
              target,before,after,template=line.split("\t")
              expected=(r/template).read_bytes()
              actual=(root/target).read_bytes()
              assert sha256(expected).hexdigest()==after,(target,"template seal")
              assert actual==expected,(target,"receiver not generated")
          print("PASS four source-sealed census postimages")
          PY
      - name: Preserve synthetic negative tests and verify installed 34-file census
        run: |
          cd m3/collections/interop/qualification/current-census-20261017
          python3 -m unittest discover -p 'test_*.py' -v
          cd "$GITHUB_WORKSPACE"
          python3 -m unittest discover -s m3/collections/interop/qualification/current-census-superset-20261022 -p 'test_*.py' -v
          python3 -m unittest discover -s m3/collections/interop/qualification/compiler-three-test-successor-20261022 -p 'test_*.py' -v
          python3 -m unittest discover -s m3/collections/interop/qualification/apache-bag-450-successor-20261022 -p 'test_*.py' -v
          python3 m3/collections/interop/qualification/apache-bag-450-successor-20261022/verify_apache_bag_successor.py --product . --previous-product previous-product --predecessor predecessor-product --historical-product historical-product
  five-real-provider-runtime:
    runs-on: ubuntu-latest
    needs: source-sealed-current-census
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile all current M3 indexed-array owners
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Run real Guava Eclipse Apache Spring and JDK interop contracts
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Retained primitive JNI mask regression with checked JNI and UBSan
        run: |
          set -eu
          C="$RUNNER_TEMP/m3-interop-census/classes"
          N="$RUNNER_TEMP/m3-interop-census/native"
          mkdir -p "$C" "$N"
          javac --release 21 -Xlint:all -Werror -d "$C" \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$N/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$N" -cp "$C" \
            com.m3.collections.M3IndexMaskCompactorSelfTest
