name: M3 indexed viewport page Java 21 proof

on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3MaskViewportKernel.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3MaskViewportPageContract.java'
      - 'm3/collections/qualification/mask-viewport-page-20261021/**'
      - '.github/workflows/m3-mask-viewport-page-20261021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  java21-source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
      - name: Select Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Fail on candidate-source hash drift
        shell: bash
        run: |
          printf '%s  %s\n' \
            '5af5cb6fed85fa0803384ec4374be4b96659844bd547788be8805bbfe942635f' 'm3/collections/src/main/java/jdk/m3/collections/M3MaskViewportKernel.java' \
            'ac37f8f9733e2c0eef1a22f88d12515171fe85e7327a8dea3e26a5adfad411bb' 'm3/collections/src/test/java/jdk/m3/collections/M3MaskViewportPageContract.java' | sha256sum -c -
      - name: Compile source owners and run visible-page oracle
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/m3-page-classes"
          javac --release 21 -Xlint:all -Werror -d "$RUNNER_TEMP/m3-page-classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3MaskViewportKernel.java \
            m3/collections/src/main/java/jdk/m3/collections/M3MaskViewportNative.java \
            m3/collections/src/test/java/jdk/m3/collections/M3MaskViewportPageContract.java
          java -cp "$RUNNER_TEMP/m3-page-classes" jdk.m3.collections.M3MaskViewportPageContract \
            | tee "$RUNNER_TEMP/m3-page-oracle.txt"
          grep -Fx 'M3_MASK_VIEWPORT_PAGE_PASS checks=121831 existingJni=false' "$RUNNER_TEMP/m3-page-oracle.txt"
      - name: Build C17 JNI and compare native visible pages with the Java owner
        shell: bash
        run: |
          JDK_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          gcc -std=c17 -Wall -Wextra -Wconversion -Wshadow -Wpedantic -Werror \
            -O2 -fPIC -shared -I"$JDK_HOME/include" -I"$JDK_HOME/include/linux" \
            m3/collections/src/main/c/m3maskviewport.c \
            -o "$RUNNER_TEMP/libm3maskviewport.so"
          nm -D --defined-only "$RUNNER_TEMP/libm3maskviewport.so" \
            | grep -F 'Java_jdk_m3_collections_M3MaskViewportNative_projectPage'
          java -Xcheck:jni -Dm3.native.path="$RUNNER_TEMP/libm3maskviewport.so" \
            -cp "$RUNNER_TEMP/m3-page-classes" \
            jdk.m3.collections.M3MaskViewportPageContract --native \
            | tee "$RUNNER_TEMP/m3-native-page-oracle.txt"
          grep -F 'M3_MASK_VIEWPORT_PAGE_PASS checks=' "$RUNNER_TEMP/m3-native-page-oracle.txt"
          grep -F 'existingJni=true' "$RUNNER_TEMP/m3-native-page-oracle.txt"
