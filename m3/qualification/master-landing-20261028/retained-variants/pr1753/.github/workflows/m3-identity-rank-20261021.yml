name: M3 identity-rank Java21 JNI source-sealed qualification
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexPathRank.java'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3LongStateArray.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentity*.java'
      - 'm3/collections/algorithm-catalogue/identity-index-rank-20261021/**'
      - '.github/workflows/m3-identity-rank-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-native-identity-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Source seal and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat <<'SHA' | sha256sum --check
          277deb05359acef248972a3b7b4d5a6c4c3eed6d7c2e27c6fb613b6956664975  m3/collections/src/main/java/jdk/m3/collections/M3IndexPathRank.java
          e67c66803343afa6fb59236247642e0727d19472a9b50fc57ce3f49b8bf3713b  m3/collections/src/main/java/jdk/m3/collections/M3LongStateArray.java
          8dec52f9a5c596aa04d2e4927209ddd10bee211fe55e7250e90ac19b2d0c0659  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentitySelfTest.java
          08e41bc22e79270bcfe99e6a08907c7e61ea6935d24b5c4f8f20a0bcbe2a9180  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentityTest.java
          SHA
      - name: Compile exact Java21 identity rank and existing JNI parity probe
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-identity-rank"
          mkdir -p "$out/classes" "$out/native"
          javac --release 21 -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexPathRank.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentitySelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankSelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankNativeSelfTest.java
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$out/native/libm3_collections_pathmask.so"
          java -cp "$out/classes" jdk.m3.collections.M3IndexPathIdentitySelfTest
          java -cp "$out/classes" jdk.m3.collections.M3IndexPathRankSelfTest
          java -Xcheck:jni -Djava.library.path="$out/native" -cp "$out/classes" \
            jdk.m3.collections.M3IndexPathRankNativeSelfTest
      - name: Original owner and new identity-rank JUnit regressions
        run: >
          mvn -B -ntp -f m3/collections/pom.xml
          -Dtest=M3IndexPathIdentityTest,M3LongStateArrayTest,M3IndexPathRankTest test
