# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original Eclipse recipe and MIndexAST primitive views
on:
  pull_request:
    paths:
      - 'm3/tooling/module-packs/parser/**'
      - 'm3/tooling/shared-frontend/recipe-custody/datasets/m3-ast-select-20261021/**'
      - 'm3/qualification/eclipse-ast-extension-20261021/**'
      - '.github/workflows/m3-eclipse-ast-extension-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-source-and-original-ancestry:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Independently verify original five-donor Git superset
        shell: bash
        run: |
          set -euo pipefail
          scratch="$(mktemp -d)"
          trap 'git worktree remove --force "$scratch/old" >/dev/null 2>&1 || true' EXIT
          git worktree add --detach "$scratch/old" d7b9e65241b717a387b25234df4cf21531f07d9f
          (cd "$scratch/old" && python3 m3/qualification/unified-superset-20261021/verify_superset.py)
      - name: Verify 12 exact Eclipse recipe files and 3 original parser stage postimages
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/qualification/eclipse-ast-extension-20261021/verify_extension.py
  original-javac-owner-and-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Execute three serial source-sealed original OpenRewrite recipes
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/m3/tooling/shared-frontend/recipe-custody"
          mvn -B -ntp -f "$root/pom.xml" -Pcontract \
            -Dm3.dataset=m3-ast-select-20261021 \
            "-Drecipe.owner.root=$root/sdk-owner" verify
          python3 "$root/receive.py" \
            --dataset m3-ast-select-20261021 \
            --recipe-owner "$root/sdk-owner" --target "$PWD" --check
      - name: Compile and exercise original javac-indexed AST and JMOD phases
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-indexed-ast"
          for phase in lint compile test runtime; do
            python3 m3/tooling/module-packs/parser/build.py \
              --jdk-home "$JAVA_HOME" --out "$out" --phase "$phase"
          done
