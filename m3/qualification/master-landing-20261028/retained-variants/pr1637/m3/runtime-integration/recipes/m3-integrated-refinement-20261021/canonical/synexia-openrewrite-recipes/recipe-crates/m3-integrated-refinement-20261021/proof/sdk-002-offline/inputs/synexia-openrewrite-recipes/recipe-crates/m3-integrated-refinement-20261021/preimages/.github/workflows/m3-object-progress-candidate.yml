name: M3 Object adapter/progress candidate proof
on:
  pull_request:
    paths:
      - 'src/java.base/share/classes/java/lang/Object.java'
      - 'src/java.base/share/classes/java/lang/Runnable.java'
      - 'src/java.base/share/classes/java/util/concurrent/ProgressMonitor.java'
      - 'src/java.base/share/classes/java/util/concurrent/ProgressMonitors.java'
      - 'src/java.base/share/classes/java/util/concurrent/Executor*.java'
      - 'src/java.base/share/classes/java/util/function/*.java'
      - 'm3/compatibility/*object*progress*'
      - 'm3/compatibility/M3ObjectProgressStandaloneProbe.java'
      - '.github/workflows/m3-object-progress-candidate.yml'
  workflow_dispatch:
jobs:
  bounded-progress-subset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check exact source handoff and isolated progress implementation
        run: bash m3/compatibility/verify-object-progress-standalone.sh
      - name: Scope disclaimer
        run: echo 'This is not modified JDK compilation, jtreg, HotSpot, JNI or Maven/OpenRewrite qualification.'
