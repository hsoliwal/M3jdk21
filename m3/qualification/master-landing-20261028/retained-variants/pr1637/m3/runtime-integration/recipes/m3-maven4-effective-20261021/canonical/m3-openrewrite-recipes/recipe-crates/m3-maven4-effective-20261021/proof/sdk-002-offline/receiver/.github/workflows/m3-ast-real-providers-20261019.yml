# SPDX-License-Identifier: Apache-2.0
name: M3AST original JDT Maven Gradle Kotlin provider checks

on:
  push:
    branches: [m3/ast-original-providers-20261019]
  pull_request:
    paths:
      - m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser/M3ASTAuthoritativeModels.java
      - m3/tooling/module-packs/parser/real-providers/**
      - .github/workflows/m3-ast-real-providers-20261019.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-providers:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'
      - name: Resolve pinned test-only original provider libraries
        shell: bash
        run: |
          set -euo pipefail
          PACK=m3/tooling/module-packs/parser/real-providers
          mkdir -p "$RUNNER_TEMP/m3-real"
          mvn -B -ntp -f "$PACK/pom.xml" \
            org.apache.maven.plugins:maven-dependency-plugin:3.9.0:build-classpath \
            "-Dmdep.outputFile=$RUNNER_TEMP/m3-real/classpath.txt"
          test -s "$RUNNER_TEMP/m3-real/classpath.txt"
      - name: Strict Java 21 compile of M3AST and real-provider probes
        shell: bash
        run: |
          set -euo pipefail
          PACK=m3/tooling/module-packs/parser
          CP="$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          mkdir -p "$RUNNER_TEMP/m3-real/classes"
          javac --release 21 -Xlint:all,-deprecation,-removal -Werror -proc:none \
            -cp "$CP" -d "$RUNNER_TEMP/m3-real/classes" \
            "$PACK/src/main/java/jdk/m3/parser/M3File.java" \
            "$PACK/src/main/java/jdk/m3/parser/M3ASTIndex.java" \
            "$PACK/src/main/java/jdk/m3/parser/M3ASTIngress.java" \
            "$PACK/src/main/java/jdk/m3/parser/M3ASTAuthoritativeModels.java" \
            "$PACK/src/main/java/jdk/m3/parser/M3ASTJacksonEvents.java" \
            "$PACK/real-providers/src/test/java/jdk/m3/parser/tests/M3RealProvidersSmoke.java" \
            "$PACK/real-providers/src/test/java/jdk/m3/parser/tests/M3GradleToolingSmoke.java" \
            "$PACK/real-providers/src/test/java/jdk/m3/parser/tests/M3KotlinPsiSmoke.java" \
            "$PACK/real-providers/src/test/java/jdk/m3/parser/tests/M3JacksonIndexScale.java"
      - name: Actual JDT ASTParser, Maven ModelBuilder and Groovy SourceUnit
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/m3-real/classes:$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          java -ea -cp "$CP" jdk.m3.parser.tests.M3RealProvidersSmoke \
            "$RUNNER_TEMP/m3-real/model-proof" | tee "$RUNNER_TEMP/m3-real/providers.log"
          grep '^M3_AST_REAL_PROVIDERS_PASS checks=' "$RUNNER_TEMP/m3-real/providers.log"
      - name: Actual Gradle Tooling API 8.12 and project hierarchy
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/m3-real/classes:$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          java -ea -cp "$CP" jdk.m3.parser.tests.M3GradleToolingSmoke \
            "$RUNNER_TEMP/m3-real/gradle-project" | tee "$RUNNER_TEMP/m3-real/gradle.log"
          grep '^M3_AST_REAL_GRADLE_TOOLING_PASS ' "$RUNNER_TEMP/m3-real/gradle.log"
      - name: Original Kotlin embeddable compiler PSI and source TextRange
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/m3-real/classes:$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          java -ea -Xmx2g -cp "$CP" jdk.m3.parser.tests.M3KotlinPsiSmoke \
            | tee "$RUNNER_TEMP/m3-real/kotlin.log"
          grep '^M3_AST_REAL_KOTLIN_PSI_PASS ' "$RUNNER_TEMP/m3-real/kotlin.log"
      - name: Actual Jackson parser into primitive M3AST index at exactly 100MB and 100MiB
        shell: bash
        run: |
          set -euo pipefail
          CP="$RUNNER_TEMP/m3-real/classes:$(cat "$RUNNER_TEMP/m3-real/classpath.txt")"
          java -ea -Xmx2g -cp "$CP" jdk.m3.parser.tests.M3JacksonIndexScale             "$RUNNER_TEMP/m3-real/json100mb" 100000000             | tee "$RUNNER_TEMP/m3-real/json100mb.log"
          grep '^M3_AST_JACKSON_INDEX_SCALE_PASS bytes=100000000 ' "$RUNNER_TEMP/m3-real/json100mb.log"
          java -ea -Xmx2g -cp "$CP" jdk.m3.parser.tests.M3JacksonIndexScale             "$RUNNER_TEMP/m3-real/json100mib" 104857600             | tee "$RUNNER_TEMP/m3-real/json100mib.log"
          grep '^M3_AST_JACKSON_INDEX_SCALE_PASS bytes=104857600 ' "$RUNNER_TEMP/m3-real/json100mib.log"
      - name: Upload small proof receipts only
        if: always()
        shell: bash
        run: |
          mkdir -p real-providers-proof
          for f in providers.log gradle.log kotlin.log json100mb.log json100mib.log; do
            if test -f "$RUNNER_TEMP/m3-real/$f"; then
              cp "$RUNNER_TEMP/m3-real/$f" real-providers-proof/
            fi
          done
          if test -f "$RUNNER_TEMP/m3-real/model-proof/RESULT.txt"; then
            cp "$RUNNER_TEMP/m3-real/model-proof/RESULT.txt" real-providers-proof/model.txt
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-real-model-provider-receipts
          path: real-providers-proof/
          retention-days: 14
          if-no-files-found: warn

  maven4-fork:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Checkout exact Maven 4 implementation source
        uses: actions/checkout@v4
        with:
          repository: hsoliwal/maven
          ref: 2993571eedbe96e06a737eaa8ae47cf112b255de
          path: maven4-source
      - name: Freeze the exact incumbent M3AST owners
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 2779aba3f98f31c324be43f731be7914e1a05935
          BASELINE="$RUNNER_TEMP/m3-maven4-baseline"
          SOURCE=m3/tooling/module-packs/parser/src/main/java/jdk/m3/parser
          mkdir -p "$BASELINE/$SOURCE"
          for OWNER in M3File.java M3ASTIndex.java M3ASTIngress.java M3ASTAuthoritativeModels.java; do
            git show "2779aba3f98f31c324be43f731be7914e1a05935:$SOURCE/$OWNER" > "$BASELINE/$SOURCE/$OWNER"
          done
      - name: Source-built Maven 4 and real Maven 3/JDT compatibility
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/tooling/module-packs/parser/real-providers/maven4/verify.py \
            --repo-root . --baseline-root "$RUNNER_TEMP/m3-maven4-baseline" \
            --fork-root maven4-source --jdk-home "$JAVA_HOME" \
            --maven "$(command -v mvn)" --cache "$RUNNER_TEMP/m3-maven4-m2" \
            --out "$RUNNER_TEMP/m3-maven4-proof" --online-bootstrap
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m3-maven4-source-provider-receipts
          path: |
            ${{ runner.temp }}/m3-maven4-proof/*.json
            ${{ runner.temp }}/m3-maven4-proof/*.log
            ${{ runner.temp }}/m3-maven4-proof/*.xml
          retention-days: 14
          if-no-files-found: warn
