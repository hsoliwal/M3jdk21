name: M3 identity-rank Java21 JNI source-sealed qualification
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexPathRank.java'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3LongStateArray.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentity*.java'
      - 'm3/collections/src/main/java/jdk/m3/collections/M3IndexedLiveView.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewContract.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankBulk*.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankNativeSelfTest.java'
      - 'm3/collections/algorithm-catalogue/identity-index-rank-20261021/**'
      - '.github/workflows/m3-identity-rank-20261021.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-native-identity-rank:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Source seal and whitespace checks
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          cat <<'SHA' | sha256sum --check
          7cd1301ff79253e66a102464a9bc4fec8d386ada4498d155ddbedea5852a78a6  m3/collections/src/main/java/jdk/m3/collections/M3IndexPathRank.java
          e67c66803343afa6fb59236247642e0727d19472a9b50fc57ce3f49b8bf3713b  m3/collections/src/main/java/jdk/m3/collections/M3LongStateArray.java
          9e35312ed62396dcdf90de83be0e30e3645336fd445382ed7a874693f0e063ac  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentitySelfTest.java
          08e41bc22e79270bcfe99e6a08907c7e61ea6935d24b5c4f8f20a0bcbe2a9180  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentityTest.java
          65e5c350adb03ce2db176337ff2034b8253b5d5e258dd383a6500ddef01f2ecd  m3/collections/src/main/java/jdk/m3/collections/M3IndexedLiveView.java
          281f673e65e0f90b52dd7780358b5cbac2fe4d91d272d1433dd6d270ed983c1d  m3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewContract.java
          7dce94d3df940e00ba7a72418fe581c765fbee2d0db8c77834b5100513312aed  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankNativeSelfTest.java
          57cef7c22d238d7efbac8552ce636bc6aad62124ad54580e0ea3726fd4b16e96  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankBulkSelfTest.java
          d35a3d80eb881cf73a024d38b8898d5f2169f28b5d1edf69117d2edd4f4ecf95  m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankBulkTest.java
          SHA
      - name: Compile exact Java21 identity rank and existing JNI parity probe
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-identity-rank"
          mkdir -p "$out/classes" "$out/native"
          javac --release 21 -Xlint:all -Werror -d "$out/classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexPathMasks.java \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexPathRank.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentitySelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankBulkSelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankSelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankNativeSelfTest.java
          gcc -std=c11 -Wall -Wextra -Werror -Wconversion -Wshadow -pedantic \
            -fPIC -shared -I "$JAVA_HOME/include" -I "$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_path_masks.c \
            -o "$out/native/libm3_collections_pathmask.so"
          java -cp "$out/classes" jdk.m3.collections.M3IndexPathIdentitySelfTest
          java -cp "$out/classes" jdk.m3.collections.M3IndexPathRankBulkSelfTest
          java -cp "$out/classes" jdk.m3.collections.M3IndexPathRankSelfTest
          java -Xcheck:jni -Djava.library.path="$out/native" -cp "$out/classes" \
            jdk.m3.collections.M3IndexPathRankNativeSelfTest
      - name: Original Java21 state, rank and filtered-live contracts
        shell: bash
        run: |
          set -euo pipefail
          classes="$RUNNER_TEMP/m3-identity-live-classes"
          mkdir -p "$classes"
          javac --release 21 -proc:none -Xlint:all,-module -Werror \
            -sourcepath m3/collections/src/main/java:m3/collections/src/test/java \
            -d "$classes" \
            m3/collections/src/main/java/jdk/m3/collections/M3IndexedLiveView.java \
            m3/collections/src/main/java/jdk/m3/collections/M3LongStateArray.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexedLiveViewContract.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathRankBulkSelfTest.java \
            m3/collections/src/test/java/jdk/m3/collections/M3IndexPathIdentitySelfTest.java
          java -ea -cp "$classes" jdk.m3.collections.M3IndexedLiveViewContract
          java -ea -cp "$classes" jdk.m3.collections.M3IndexPathRankBulkSelfTest
          java -ea -cp "$classes" jdk.m3.collections.M3IndexPathIdentitySelfTest
