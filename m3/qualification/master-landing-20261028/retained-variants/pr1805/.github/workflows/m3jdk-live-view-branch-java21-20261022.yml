name: M3JDK21 original live filtered/sorted Java21 branch proof
on:
  push:
    branches:
      - 'm3/viewport-proof-gates-20261022'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java21-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Source SHA identity of original live array-index owner
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' '5af79b8408cd3f14e300a8f274e74ec539d3f945a0d03655b55ddc03eb351b70  m3/collections/src/main/java/com/m3/collections/M3IndexedLiveView.java' | sha256sum -c -
      - name: Compile real Java21 collection-owner dependency closure
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-live-classes"
          mkdir -p "$out"
          javac --release 21 -proc:none -Xlint:all -Werror \
            -sourcepath "m3/collections/src/main/java:m3/collections/src/test/java" \
            -d "$out" \
            m3/collections/src/test/java/com/m3/collections/M3IndexedLivePhysicalPageContract.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexedLiveViewContract.java
          java -cp "$out" com.m3.collections.M3IndexedLivePhysicalPageContract
          java -cp "$out" com.m3.collections.M3IndexedLiveViewContract
      - name: Keep mandatory custom forked JUnit Maven gate separate
        shell: bash
        run: |
          echo 'Java21 source proof is not full M3JDK21 Maven/JUnit acceptance'
          echo 'Full owning Maven gate still requires junit-jupiter:5.10.2-m3-source-1'
