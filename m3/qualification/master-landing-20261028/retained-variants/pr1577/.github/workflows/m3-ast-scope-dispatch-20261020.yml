# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 original MIndexAST scope dispatch
on:
  pull_request:
    paths:
      - 'm3/ports/compiletime/src/main/java/com/m3/compiletime/M3ASTLeafIndex.java'
      - 'm3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTScopeDispatchProof.java'
      - 'm3/ports/compiletime/qualification/ast-scope-dispatch-20261020/**'
      - 'm3/tooling/shared-frontend/recipe-custody/datasets/ast-scope-dispatch-20261020/**'
      - '.github/workflows/m3-ast-scope-dispatch-20261020.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-index-and-recipe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/workflows/m3-ast-scope-dispatch-20261020.yml
            m3/ports/compiletime/src/main/java/com/m3/compiletime/M3ASTLeafIndex.java
            m3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTLeafIndexSelfTest.java
            m3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTScopeDispatchProof.java
            m3/ports/compiletime/qualification/ast-scope-dispatch-20261020/
            m3/tooling/shared-frontend/recipe-custody/
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Compile original M3AST owner and historical/new Java21 contracts
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/m3-scope-classes"
          mkdir -p "$out"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$out" \
            m3/ports/compiletime/src/main/java/com/m3/compiletime/M3ASTLeafIndex.java \
            m3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTLeafIndexSelfTest.java \
            m3/ports/compiletime/src/test/java/com/m3/compiletime/M3ASTScopeDispatchProof.java
          java -cp "$out" com.m3.compiletime.M3ASTLeafIndexSelfTest
          java -cp "$out" com.m3.compiletime.M3ASTScopeDispatchProof
          java -Xint -cp "$out" com.m3.compiletime.M3ASTScopeDispatchProof
      - name: Execute original reusable OpenRewrite SDK and recipe refusal
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/m3/tooling/shared-frontend/recipe-custody"
          mvn -B -ntp -f "$root/pom.xml" \
            -Dm3.dataset=ast-scope-dispatch-20261020 \
            "-Drecipe.owner.root=$root/sdk-owner" -Pcontract verify
          python3 "$root/receive.py" \
            --crate "$root" --dataset ast-scope-dispatch-20261020 \
            --recipe-owner "$root/sdk-owner" --target "$PWD" --check
