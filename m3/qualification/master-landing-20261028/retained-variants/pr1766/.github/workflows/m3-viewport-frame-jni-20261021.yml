name: M3JDK21 viewport CPU/JNI frame (original source)
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3MaskViewportNative.java'
      - 'm3/collections/src/main/c/m3maskviewport.c'
      - 'm3/collections/src/test/java/com/m3/collections/M3ViewportFrameContract.java'
      - 'm3/collections/qualification/viewport-frame-20261021/**'
      - '.github/workflows/m3-viewport-frame-jni-20261021.yml'
  workflow_dispatch:
jobs:
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Strict Java21 original-source CPU projection
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/m3-viewport-frame
          javac --release 21 -Xlint:all -Werror -d /tmp/m3-viewport-frame \
            m3/collections/src/main/java/com/m3/collections/M3MaskViewportKernel.java \
            m3/collections/src/main/java/com/m3/collections/M3MaskViewportNative.java \
            m3/collections/src/test/java/com/m3/collections/M3ViewportFrameContract.java
          java -cp /tmp/m3-viewport-frame com.m3.collections.M3ViewportFrameContract
      - name: Native C JNI build and parity with live -Xcheck:jni
        shell: bash
        run: |
          set -euo pipefail
          cc -std=c11 -Wall -Wextra -Werror -fPIC -shared \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            -o /tmp/m3-viewport-frame/libm3viewportframe.so \
            m3/collections/src/main/c/m3maskviewport.c
          java -Xcheck:jni \
            -Dm3.native.path=/tmp/m3-viewport-frame/libm3viewportframe.so \
            -cp /tmp/m3-viewport-frame com.m3.collections.M3ViewportFrameContract --native
