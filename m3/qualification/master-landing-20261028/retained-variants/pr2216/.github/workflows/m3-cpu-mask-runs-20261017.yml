# SPDX-License-Identifier: Apache-2.0
name: M3 CPU mask run tool Java21
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/jdk/m3/collections/M3CpuMaskRuns.java'
      - 'm3/collections/src/test/java/jdk/m3/collections/M3CpuMaskRunsSelfTest.java'
      - 'm3/collections/recipe/cpu-mask-runs-20261017/**'
      - 'm3/collections/algorithm-catalog/cpu-mask-runs-20261017.tsv'
      - 'm3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-cpu-mask-runs-20261017/**'
      - 'm3/tooling/migration-recipes/src/main/resources/META-INF/rewrite/m3-cpu-mask-runs-20261017.yml'
      - '.github/workflows/m3-cpu-mask-runs-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collection:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Check the collection receiver and compile tool
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests package
      - name: Execute bounded CPU tool self-test
        run: >
          java -cp m3/collections/target/classes:m3/collections/target/test-classes
          jdk.m3.collections.M3CpuMaskRunsSelfTest
      - name: Verify source equals recipe postimage exactly
        shell: bash
        run: |
          set -euo pipefail
          ROOT=m3/tooling/migration-recipes/src/main/resources/jdk/internal/m3/rewrite/hash-pinned-java/m3-cpu-mask-runs-20261017
          cmp -s m3/collections/src/main/java/jdk/m3/collections/M3CpuMaskRuns.java "$ROOT/M3CpuMaskRuns.java.txt"
          cmp -s m3/collections/src/test/java/jdk/m3/collections/M3CpuMaskRunsSelfTest.java "$ROOT/M3CpuMaskRunsSelfTest.java.txt"
          echo 'fa64e9322f239a45cd63223dd12f6396222382021d88b8f0263dc393f9eb7dbc  m3/collections/src/main/java/jdk/m3/collections/M3CpuMaskRuns.java' | sha256sum -c -
          echo 'd4a9fce7399db2b69d09cb334ef2479eca0ba821641f330dff173659d8664b5c  m3/collections/src/test/java/jdk/m3/collections/M3CpuMaskRunsSelfTest.java' | sha256sum -c -
      - name: Compile existing Maven/OpenRewrite recipe provider
        run: mvn -B -ntp -f m3/collections/recipe/cpu-mask-runs-20261017/pom.xml -DskipTests package
      - name: Execute named OpenRewrite candidate recipe dry-run
        run: >
          mvn -B -ntp -f m3/collections/recipe/cpu-mask-runs-20261017/pom.xml
          org.openrewrite.maven:rewrite-maven-plugin:5.23.1:dryRun
          -Drewrite.activeRecipes=jdk.internal.m3.CpuMaskRuns20261017
