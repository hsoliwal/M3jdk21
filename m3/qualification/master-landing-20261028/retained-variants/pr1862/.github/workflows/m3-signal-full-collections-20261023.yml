# SPDX-License-Identifier: Apache-2.0
name: M3JDK21 full original collections JUnit compatibility
on:
  pull_request:
    paths:
      - 'm3/compiler/source-signals/pom.xml'
      - 'm3/collections/src/main/java/**'
      - 'm3/collections/src/test/java/**'
      - 'm3/qualification/signal-original-gates-20261023/**'
      - '.github/workflows/m3-signal-full-collections-20261023.yml'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  original-complete-collections-junit:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Current target original-source receipt and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/master...HEAD
          bash m3/qualification/signal-original-gates-20261023/verify.sh
      - name: Verify actual JUnit Jupiter and Launcher source vendor licensing and file identity
        shell: bash
        run: |
          set -euo pipefail
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py
          python3 m3/vendor/third_party/junit-platform-launcher-1.10.2/verify_source.py
      - name: Install the exact JUnit source-vendored original Maven dependency closure
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/vendor/third_party/pom.xml \
            -pl junit-jupiter-5.10.2,junit-platform-launcher-1.10.2 \
            -am -DskipTests install
          python3 m3/vendor/third_party/junit-jupiter-5.10.2/verify_source.py \
            m3/vendor/third_party/junit-jupiter-5.10.2/target/junit-jupiter-5.10.2-m3-source-1.jar
          python3 m3/vendor/third_party/junit-platform-launcher-1.10.2/verify_source.py \
            m3/vendor/third_party/junit-platform-launcher-1.10.2/target/junit-platform-launcher-1.10.2-m3-source-1.jar
      - name: Build unchanged original M3 array substrate required by current collections owner
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/arrays/pom.xml -DskipTests install
      - name: Run ALL original M3 collections Maven JUnit cases without exclusions
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f m3/collections/pom.xml test
