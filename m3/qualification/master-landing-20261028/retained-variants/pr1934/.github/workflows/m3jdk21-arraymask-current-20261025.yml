name: M3JDK21 current-source array-first collection qualification
on:
  pull_request:
    paths:
      - 'm3/arrays/pom.xml'
      - 'm3/collections/src/main/java/com/m3/collections/M3ArrayList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ArrayListShortWordMaskContract.java'
      - 'm3/collections/algorithm-catalog/arraylist-dual-word-mask-20261023.tsv'
      - 'm3/collections/qualification/arraylist-dual-word-current-20261025/**'
      - '.github/workflows/m3jdk21-arraymask-current-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-built-collections:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            m3/collections/**
            m3/native/include/m3_jni_core.h
            .github/workflows/m3jdk21-arraymask-current-20261025.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify original owner/JNI Git blobs and current source SHA-256
        run: |
          python3 m3/collections/qualification/arraylist-dual-word-current-20261025/verify_receipt.py
          python3 -m unittest discover \
            -s m3/collections/qualification/arraylist-dual-word-current-20261025 \
            -p 'test_*.py' -v
      - name: Build unchanged native M3 array substrate and install Maven artifact
        run: mvn -B -ntp -f m3/arrays/pom.xml -Pnative-linux -DskipTests install
      - name: Bind existing native M3 array library for the module tests
        run: |
          test -s "$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so"
          echo "JAVA_TOOL_OPTIONS=-Dm3.arrays.native.path=$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so" >> "$GITHUB_ENV"
      - name: Compile real M3 collections and run its existing JUnit suite
        run: mvn -B -ntp -f m3/collections/pom.xml test
      - name: Prove stable logical offsets, nulls, duplicate identities and iterator epochs
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListShortWordMaskContract
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3ArrayListRemoveIfProof
      - name: Check bounded Java selection against scalar reference
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3BudgetedMaskWindowContract
      - name: Compile existing JNI mask kernels under Java21 headers without modifications
        run: |
          gcc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Check actual JNI bounded-mask parity against Java reference
        run: |
          java -ea -Djava.library.path="$RUNNER_TEMP" \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3BudgetedMaskWindowContract --native
