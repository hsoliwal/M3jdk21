name: M3 A3 absorption proof

on:
  push:
    branches:
      - master
      - "m3/**"
    paths:
      - "m3/tooling/a3/**"
      - "m3/tooling/migration-recipes/**"
      - "m3/backports/JEP_CATALOGUE.tsv"
      - "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv"
      - "m3/backports/COMMUNITY_CAPABILITY_CANDIDATES.tsv"
      - "m3/backports/ALGORITHM_CATALOGUE.tsv"
      - "m3/docs/a3.md"
      - "m3/docs/a3-lab.md"
      - "m3/docs/a3-alg.md"
      - "m3/docs/atom-pattern-admission-and-tooling-boundary.md"
      - "m3/pom.xml"
      - ".github/workflows/m3-a3.yml"
  pull_request:
    paths:
      - "m3/tooling/a3/**"
      - "m3/tooling/migration-recipes/**"
      - "m3/backports/JEP_CATALOGUE.tsv"
      - "m3/backports/UPSTREAM_CHANGE_SEEDS.tsv"
      - "m3/backports/COMMUNITY_CAPABILITY_CANDIDATES.tsv"
      - "m3/backports/ALGORITHM_CATALOGUE.tsv"
      - "m3/docs/a3.md"
      - "m3/docs/a3-lab.md"
      - "m3/docs/a3-alg.md"
      - "m3/docs/atom-pattern-admission-and-tooling-boundary.md"
      - "m3/pom.xml"
      - ".github/workflows/m3-a3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  a3-proof:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    env:
      SYNEXIA_A3_COMMIT: a062661e91e769a00c2d027e1f04a7a0c8f9dc28
    steps:
      - name: Fetch exact workflow head
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          curl --fail --location --retry 3             "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${HEAD_SHA}"             -o "$RUNNER_TEMP/repo.tar.gz"
          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" -C "$RUNNER_TEMP/repo" --strip-components=1
          printf 'REPO=%s\n' "$RUNNER_TEMP/repo" >> "$GITHUB_ENV"

      - name: Prepare pinned JDK 21
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             'https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21%2B35/OpenJDK21U-jdk_x64_linux_hotspot_21_35.tar.gz'             -o "$RUNNER_TEMP/jdk21.tar.gz"
          printf '%s  %s\n'             '82f64c53acaa045370d6762ebd7441b74e6fda14b464d54d1ff8ca941ec069e6'             "$RUNNER_TEMP/jdk21.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/jdk21.tar.gz" -C "$RUNNER_TEMP"
          printf 'JAVA_HOME=%s\n' "$RUNNER_TEMP/jdk-21+35" >> "$GITHUB_ENV"
          printf '%s\n' "$RUNNER_TEMP/jdk-21+35/bin" >> "$GITHUB_PATH"

      # hsoliwal/com.synexia is a private repository: unauthenticated codeload tarballs
      # answer 404 for every commit (streak 13, run 40159100017). The pinned commit is
      # reachable (ancestor of develop); fetch exactly it with a read token and only the
      # sealed A3 export closure, then verify the closure bytes before building.
      # Successor pin record: hsoliwal/com.synexia
      # synexia-openrewrite-recipes/recipes/m3jdk21-a3-export-pin-20261030/PIN_SUCCESSOR.tsv
      - name: Fetch pinned Synexia canonical A3 recipe export closure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: hsoliwal/com.synexia
          ref: ${{ env.SYNEXIA_A3_COMMIT }}
          token: ${{ secrets.SYNEXIA_READ_TOKEN || github.token }}
          path: synexia-a3
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /synexia-openrewrite-recipes/pom-jdk-a3-export.xml
            /synexia-openrewrite-recipes/src/main/resources/META-INF/m3/jdk-a3-recipe-export.tsv
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/M3RecipeMasteryPortableReceipt.java
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3AtomizePureIntReturnRecipe.java
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3DocumentPureIntAtomRecipe.java
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3FileAtomCandidateTable.java
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3InventoryPureIntAtomCandidates.java
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3PatternizePureIntAtomRecipe.java
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3PureIntAtomEligibility.java
            /synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3PureIntConvergenceRecipe.java
            /synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/M3JdkA3RecipeExportTest.java
            /synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/M3RecipeMasteryPortableReceiptTest.java
            /synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3AtomCoverageClosureTest.java
            /synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3AtomDefensiveBranchTest.java
            /synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3AtomizePureIntReturnRecipeTest.java
            /synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3InventoryPureIntAtomCandidatesTest.java
            /synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3PureIntConvergenceRecipeTest.java

      - name: Verify and install pinned Synexia canonical A3 recipe export
        shell: bash
        working-directory: synexia-a3
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SYNEXIA_A3_COMMIT"
          # Sealed closure of SYNEXIA_A3_COMMIT (17 files, 102164 bytes); manifest sha256
          # eb71d2b0169458cea295c3052cf04a6b9a6ef6fc20da8b44c78965def51204e0.
          sha256sum --check --strict - <<'CLOSURE'
          c3be01bc3d5391e36c9e9982471029cc10b66a2adf6ceaf30a8cb8307568ad67  synexia-openrewrite-recipes/pom-jdk-a3-export.xml
          0c8b6e58942bb3ba5739e7fa060b20237c056ef36ffd1a84b25016314e9f0dca  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/M3RecipeMasteryPortableReceipt.java
          ee74b358c97ab2dadb899df3b9c342ff80a78ccb44b8dda73be4937397e9e712  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3AtomizePureIntReturnRecipe.java
          a0b5d68d2f08fea262e8e5fd234ab7223641192e93d04e70c86eead1a9005b9f  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3DocumentPureIntAtomRecipe.java
          7419befbae77f9d3c400149bd0913d978c16d02a2cd76dd080f7988fc92c519d  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3FileAtomCandidateTable.java
          9bf408c86263311669209189ae39a177ee99a8711c215bae42cfabea00223c0f  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3InventoryPureIntAtomCandidates.java
          4e80e3d733bd89d91c3b673446f46da4ccdd171725489bdbe89700eaea118dd2  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3PatternizePureIntAtomRecipe.java
          89c62be14f9e2d49c372cf490a186e0c9ca88e82ac5f8f14fd76515a25a5e1e0  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3PureIntAtomEligibility.java
          8f261fa815f20bc60362bb2c416aad864ea8f6f041f7ffb292c1591f141454e2  synexia-openrewrite-recipes/src/main/java/com/synexia/rewrite/atom/M3PureIntConvergenceRecipe.java
          19c68d1684fc8011f5d6b8ed1afaf91398c444e7b7d469dae9003f270e9c3905  synexia-openrewrite-recipes/src/main/resources/META-INF/m3/jdk-a3-recipe-export.tsv
          e0bd1341a8c39871cbf9713a8f2e099d908c355b4663fc817440c4186953cc90  synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/M3JdkA3RecipeExportTest.java
          1004fd03646ea42477fcf52416969023014f97e98c69a98f55bb12d0adc220e5  synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/M3RecipeMasteryPortableReceiptTest.java
          0e7a04b5007e26aae4a3fe16b77110eadcef0d84ef27eefe2056ddbee0163e64  synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3AtomCoverageClosureTest.java
          febb034719ae311bca587dac84a7d3fa69e1d571db2b8b0d97adc0bf60814304  synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3AtomDefensiveBranchTest.java
          15e43fbcce124a3f8575161a82e5431f281ad40000c79dbd4424c0244f7fea1f  synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3AtomizePureIntReturnRecipeTest.java
          e38f88b619a00774873b575f180ebd525645c6891934d04909a46dd4560b05b9  synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3InventoryPureIntAtomCandidatesTest.java
          3d847226ad678800e0896c46a5b4c0556f70ef22f6101e3ddb6cf55e44c48326  synexia-openrewrite-recipes/src/test/java/com/synexia/rewrite/atom/M3PureIntConvergenceRecipeTest.java
          CLOSURE
          mvn -B -ntp \
            -f synexia-openrewrite-recipes/pom-jdk-a3-export.xml \
            install

      - name: Compile and install retained A3 recipe dependencies
        shell: bash
        run: |
          set -euo pipefail
          java -version
          mvn -version
          # The shared migration-recipes module currently has independent String/LST
          # regression failures. Compile/install its exact sources without converting
          # those unrelated tests into an A3Lab verdict.
          mvn -B -ntp -f "$REPO/m3/pom.xml" \
            -pl tooling/a3 -am -DskipTests install

      - name: Run focused A3 JUnit and recipe replay proof
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f "$REPO/m3/tooling/a3/pom.xml" test
          mvn -B -ntp -f "$REPO/m3/tooling/migration-recipes/pom.xml" \
            -Dtest=M3A3LabDeliveryRecipeTest,M3A3MasteryWorkflowRecipeTest \
            -Dsurefire.failIfNoSpecifiedTests=false test

      - name: Master hostile Atomize Patternize corpus
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f "$REPO/m3/tooling/a3/pom.xml" exec:java \
            -Dexec.mainClass=com.m3.a3.A3 \
            -Dexec.args="lab --root $REPO --out m3/build/a3/lab"
          LAB="$REPO/m3/build/a3/lab/results.tsv"
          test -s "$LAB"
          ROWS="$(awk -F '\t' 'NR > 1 {n++} END {print n+0}' "$LAB")"
          AP="$(awk -F '\t' 'NR > 1 && $2 == "A>P" {n++} END {print n+0}' "$LAB")"
          PA="$(awk -F '\t' 'NR > 1 && $2 == "P>A" {n++} END {print n+0}' "$LAB")"
          APA="$(awk -F '\t' 'NR > 1 && $2 == "A>P>A" {n++} END {print n+0}' "$LAB")"
          PAP="$(awk -F '\t' 'NR > 1 && $2 == "P>A>P" {n++} END {print n+0}' "$LAB")"
          PASS="$(awk -F '\t' 'NR > 1 && $9 == "true" && $10 == "true" && $11 == "true" && $12 == "true" && $13 == "true" {n++} END {print n+0}' "$LAB")"
          test "$ROWS" -eq 288
          test "$AP" -eq 48
          test "$PA" -eq 48
          test "$APA" -eq 48
          test "$PAP" -eq 48
          test "$PASS" -eq "$ROWS"
          printf 'A3Lab: rows=%s A>P=%s P>A=%s A>P>A=%s P>A>P=%s all-gates+regex=%s\n' "$ROWS" "$AP" "$PA" "$APA" "$PAP" "$PASS" >> "$GITHUB_STEP_SUMMARY"

      - name: Inventory whole JDK source and test corpus
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f "$REPO/m3/tooling/a3/pom.xml" exec:java             -Dexec.mainClass=com.m3.a3.A3             -Dexec.args="inv --root $REPO --out m3/build/a3/inventory.tsv"
          test -s "$REPO/m3/build/a3/inventory.tsv"
          JAVA_ROWS="$(awk -F '\t' 'NR > 1 && $5 == "JAVA" {n++} END {print n+0}' "$REPO/m3/build/a3/inventory.tsv")"
          NATIVE_ROWS="$(awk -F '\t' 'NR > 1 && $5 == "NATIVE" {n++} END {print n+0}' "$REPO/m3/build/a3/inventory.tsv")"
          test "$JAVA_ROWS" -gt 1000
          test "$NATIVE_ROWS" -gt 100
          printf 'A3 inventory: Java=%s Native=%s\n' "$JAVA_ROWS" "$NATIVE_ROWS" >> "$GITHUB_STEP_SUMMARY"

      - name: Validate algorithm evidence catalogue
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f "$REPO/m3/tooling/a3/pom.xml" exec:java             -Dexec.mainClass=com.m3.a3.A3             -Dexec.args="alg --root $REPO --out m3/build/a3/algorithms.tsv"
          ALG="$REPO/m3/build/a3/algorithms.tsv"
          test -s "$ALG"
          ALG_ROWS="$(awk -F '\t' 'NR > 1 {n++} END {print n+0}' "$ALG")"
          STRICT_ROWS="$(awk -F '\t' 'NR > 1 && ($4 == "admitted" || $4 == "candidate" || $4 == "candidate-adapted") {n++} END {print n+0}' "$ALG")"
          STRICT_TRI="$(awk -F '\t' 'NR > 1 && ($4 == "admitted" || $4 == "candidate" || $4 == "candidate-adapted") && $7 == "true" {n++} END {print n+0}' "$ALG")"
          test "$ALG_ROWS" -ge 7
          test "$STRICT_ROWS" -eq "$STRICT_TRI"
          awk -F '\t' 'NR > 1 && $9 != "false" {bad++} END {exit bad ? 1 : 0}' "$ALG"
          printf 'A3 algorithms: rows=%s strict-triplatform=%s\n' "$ALG_ROWS" "$STRICT_TRI" >> "$GITHUB_STEP_SUMMARY"

      - name: Plan every current JEP JBS community and algorithm row
        shell: bash
        run: |
          set -euo pipefail
          mvn -B -ntp -f "$REPO/m3/tooling/a3/pom.xml" exec:java             -Dexec.mainClass=com.m3.a3.A3             -Dexec.args="plan --root $REPO --out m3/build/a3/plan.tsv"
          PLAN="$REPO/m3/build/a3/plan.tsv"
          test -s "$PLAN"
          JEP_ROWS="$(awk -F '\t' 'NR > 1 && $1 == "JEP" {n++} END {print n+0}' "$PLAN")"
          JBS_ROWS="$(awk -F '\t' 'NR > 1 && $1 == "JBS" {n++} END {print n+0}' "$PLAN")"
          CAP_ROWS="$(awk -F '\t' 'NR > 1 && $1 == "CAP" {n++} END {print n+0}' "$PLAN")"
          ALG_ROWS="$(awk -F '\t' 'NR > 1 && $1 == "ALG" {n++} END {print n+0}' "$PLAN")"
          test "$JEP_ROWS" -ge 82
          test "$JBS_ROWS" -ge 13
          test "$CAP_ROWS" -ge 10
          test "$ALG_ROWS" -ge 7
          printf 'A3 plan: JEP=%s JBS=%s CAP=%s ALG=%s\n' "$JEP_ROWS" "$JBS_ROWS" "$CAP_ROWS" "$ALG_ROWS" >> "$GITHUB_STEP_SUMMARY"

      - name: Expand real tree paths into serial FILE work atoms
        shell: bash
        run: |
          set -euo pipefail
          QUEUE="$REPO/m3/build/a3/work-queue.tsv"
          WORK="$REPO/m3/build/a3/work.tsv"
          cat > "$QUEUE" <<'TSV'
          order	release	commit	jbs_ids	subject	domain	inventory_disposition	risk	scope_floor	proof_lane	recipe_strategy	priority	compatibility_state	next_action	paths
          0	27	1111111111111111111111111111111111111111	JDK-A3-WORK	A3 serial work integration	core-libs	candidate	HIGH	MULTI_MODULE	CORE_LIBRARY	MIXED_PACKET_OPENREWRITE_PLUS_VERBATIM	35	PENDING_COMPATIBILITY_PROOF	PROVE_CORE_LIBRARY_BACKPORT	src/java.base/share/classes/java/lang/String.java,src/hotspot/share/runtime/os.cpp,make/autoconf/flags.m4
          TSV

          mvn -B -ntp -f "$REPO/m3/tooling/a3/pom.xml" exec:java \
            -Dexec.mainClass=com.m3.a3.A3 \
            -Dexec.args="work --root $REPO --inventory m3/build/a3/inventory.tsv --queue m3/build/a3/work-queue.tsv --out m3/build/a3/work.tsv"

          test -s "$WORK"
          grep -F $'src/java.base/share/classes/java/lang/String.java\tPRESENT\tJAVA\t' "$WORK"
          grep -F $'\tA3_JAVA_ATOMIZE_PATTERNIZE\tFILE' "$WORK"
          grep -F $'src/hotspot/share/runtime/os.cpp\tPRESENT\tNATIVE\t' "$WORK"
          grep -F $'\tNATIVE_ATOM_REVIEW\tFILE' "$WORK"
          grep -F $'make/autoconf/flags.m4\tOUTSIDE_A3\tOTHER\tUNSCANNED\tOUTSIDE_A3_REVIEW\tFILE' "$WORK"
          grep -F $'\tMULTI_MODULE\t' "$WORK"
          printf 'A3 serial FILE work rows=%s\n' "$(($(wc -l < "$WORK") - 1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove guarded fixed-point candidate application
        shell: bash
        run: |
          set -euo pipefail
          FIX="$RUNNER_TEMP/a3-fixture"
          SRC="$FIX/src/java.base/share/classes/example/Sample.java"
          mkdir -p "$(dirname "$SRC")"
          cat > "$SRC" <<'JAVA'
          package example;
          final class Sample {
              private static int compute(int a, int b) {
                  return (a + b) * 31;
              }
          }
          JAVA
          cp "$SRC" "$RUNNER_TEMP/Sample.before"

          mvn -B -ntp -f "$REPO/m3/tooling/a3/pom.xml" exec:java             -Dexec.mainClass=com.m3.a3.A3             -Dexec.args="apply --root $FIX --out m3/build/a3/apply --file src/java.base/share/classes/example/Sample.java"

          cmp "$SRC" "$RUNNER_TEMP/Sample.before"
          CANDIDATE="$FIX/m3/build/a3/apply/candidate/src/java.base/share/classes/example/Sample.java"
          RECEIPT="$FIX/m3/build/a3/apply/receipt.tsv"
          grep -F 'm3$pureIntAtom' "$CANDIDATE"
          grep -F 'M3-IOP: PURE_INT_EXPRESSION' "$CANDIDATE"
          grep -F $'\ttrue\ttrue' "$RECEIPT"
          cp "$RECEIPT" "$REPO/m3/build/a3/apply-receipt.tsv"

      - name: Upload A3 proof
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-a3-proof-${{ github.run_id }}
          path: |
            ${{ env.REPO }}/m3/build/a3/inventory.tsv
            ${{ env.REPO }}/m3/build/a3/algorithms.tsv
            ${{ env.REPO }}/m3/build/a3/plan.tsv
            ${{ env.REPO }}/m3/build/a3/work.tsv
            ${{ env.REPO }}/m3/build/a3/apply-receipt.tsv
            ${{ env.REPO }}/m3/build/a3/lab/results.tsv
          if-no-files-found: error
          retention-days: 30
