name: M3JDK21 current-source dual-word List and JNI qualification
on:
  pull_request:
    paths:
      - 'm3/arrays/pom.xml'
      - 'm3/collections/src/main/java/com/m3/collections/M3ArrayList.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ArrayListShortWordMaskContract.java'
      - 'm3/collections/algorithm-catalog/arraylist-dual-word-current-20261025.tsv'
      - 'm3/collections/qualification/arraylist-dual-word-current-20261025/**'
      - '.github/workflows/m3jdk21-arraylist-current-20261025.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  module-and-native-differential:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 2
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            m3/arrays/**
            m3/native/include/m3_jni_core.h
            m3/collections/**
            .github/workflows/m3jdk21-arraylist-current-20261025.yml
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify received Java/POM hashes, catalogue and unchanged JNI sources
        run: |
          python3 m3/collections/qualification/arraylist-dual-word-current-20261025/verify_receiver.py
          python3 -m unittest discover -s m3/collections/qualification/arraylist-dual-word-current-20261025 -p 'test_*.py' -v
      - name: Build native M3 arrays substrate and install
        run: mvn -B -ntp -f m3/arrays/pom.xml -Pnative-linux -DskipTests install
      - name: Export the tested M3 arrays native library to JVM tests
        run: |
          test -s "$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so"
          echo "JAVA_TOOL_OPTIONS=-Dm3.arrays.native.path=$GITHUB_WORKSPACE/m3/arrays/target/native/libm3_arrays.so" >> "$GITHUB_ENV"
      - name: Compile real M3 collections and run Maven/JUnit tests
        run: mvn -B -ntp -f m3/collections/pom.xml test
      - name: Compile original public JVM descriptors and refuse ABI drift
        if: github.event_name == 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/m3-baseline/src/com/m3/collections" "$RUNNER_TEMP/m3-baseline/classes"
          git show "HEAD^1:m3/collections/src/main/java/com/m3/collections/M3ArrayList.java" \
            > "$RUNNER_TEMP/m3-baseline/src/com/m3/collections/M3ArrayList.java"
          test "$(git hash-object "$RUNNER_TEMP/m3-baseline/src/com/m3/collections/M3ArrayList.java")" \
            = "c43ca5578521b8f0a2ab1305f5d4becdeabc772e"
          javac --release 21 -cp m3/collections/target/classes \
            -d "$RUNNER_TEMP/m3-baseline/classes" \
            "$RUNNER_TEMP/m3-baseline/src/com/m3/collections/M3ArrayList.java"
          javap -public -s -classpath "$RUNNER_TEMP/m3-baseline/classes" \
            com.m3.collections.M3ArrayList > "$RUNNER_TEMP/m3-abi-before.txt"
          javap -public -s -classpath m3/collections/target/classes \
            com.m3.collections.M3ArrayList > "$RUNNER_TEMP/m3-abi-after.txt"
          diff -u "$RUNNER_TEMP/m3-abi-before.txt" "$RUNNER_TEMP/m3-abi-after.txt"
      - name: Original and expanded M3 ArrayList behavioral oracles
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes com.m3.collections.M3ArrayListShortWordMaskContract
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes com.m3.collections.M3ArrayListRemoveIfProof
      - name: Run unchanged bounded Java mask window differential
        run: |
          java -ea -cp m3/collections/target/classes:m3/collections/target/test-classes com.m3.collections.M3BudgetedMaskWindowContract
      - name: Compile unchanged C JNI mask selectors with JDK21 headers
        run: |
          gcc -std=c11 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            m3/collections/src/main/native/collections/m3_index_mask_window.c \
            -o "$RUNNER_TEMP/libm3_collections_mask.so"
      - name: Run actual JNI mask-window differential with no Java callbacks in C
        run: |
          java -ea -Djava.library.path="$RUNNER_TEMP" \
            -cp m3/collections/target/classes:m3/collections/target/test-classes \
            com.m3.collections.M3BudgetedMaskWindowContract --native
