name: 'Upload bundles'
description: 'Upload resulting JDK bundles'
inputs:
  platform:
    description: 'Platform name'
    required: true
  debug-suffix:
    description: 'File name suffix denoting debug level, possibly empty'
    required: false

runs:
  using: composite
  steps:

    - name: 'Determine bundle names'
      id: bundles
      run: |
        # Rename bundles to consistent names
        jdk_bundle_zip="$(ls build/*/bundles/jdk-*_bin${{ inputs.debug-suffix }}.zip 2> /dev/null || true)"
        jdk_bundle_tar_gz="$(ls build/*/bundles/jdk-*_bin${{ inputs.debug-suffix }}.tar.gz 2> /dev/null || true)"
        symbols_bundle="$(ls build/*/bundles/jdk-*_bin${{ inputs.debug-suffix }}-symbols.tar.gz 2> /dev/null || true)"
        tests_bundle="$(ls build/*/bundles/jdk-*_bin-tests${{ inputs.debug-suffix }}.tar.gz 2> /dev/null || true)"

        mkdir bundles

        if [[ "$jdk_bundle_zip" != "" ]]; then
          mv "$jdk_bundle_zip" "bundles/jdk-${{ inputs.platform }}${{ inputs.debug-suffix }}.zip"
        fi
        if [[ "$jdk_bundle_tar_gz" != "" ]]; then
          mv "$jdk_bundle_tar_gz" "bundles/jdk-${{ inputs.platform }}${{ inputs.debug-suffix }}.tar.gz"
        fi
        if [[ "$symbols_bundle" != "" ]]; then
          mv "$symbols_bundle" "bundles/symbols-${{ inputs.platform }}${{ inputs.debug-suffix }}.tar.gz"
        fi
        if [[ "$tests_bundle" != "" ]]; then
          mv "$tests_bundle" "bundles/tests-${{ inputs.platform }}${{ inputs.debug-suffix }}.tar.gz"
        fi

        if [[ "$jdk_bundle_zip$jdk_bundle_tar_gz$symbols_bundle$tests_bundle" != "" ]]; then
          echo 'bundles-found=true' >> $GITHUB_OUTPUT
        else
          echo 'bundles-found=false' >> $GITHUB_OUTPUT
        fi
      shell: bash

    - name: 'Record development preview identity'
      if: steps.bundles.outputs.bundles-found == 'true'
      env:
        M3_PREVIEW_REPOSITORY: ${{ github.repository }}
        M3_PREVIEW_REVISION: ${{ github.sha }}
        M3_PREVIEW_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        M3_PREVIEW_PLATFORM: ${{ inputs.platform }}
        M3_PREVIEW_SUFFIX: ${{ inputs.debug-suffix }}
      run: |
        # Digest the actual build archives before upload, on each build host.
        (
          cd bundles
          for bundle in *.zip *.tar.gz; do
            [[ -f "$bundle" ]] || continue
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$bundle"
            else
              shasum -a 256 "$bundle"
            fi
          done > SHA256SUMS
        )
        printf 'M3JDK21 DEVELOPMENT BUILD PREVIEW\nRepository: %s\nRevision: %s\nWorkflow: %s\nPlatform: %s\nDebug suffix: %s\nQualification: BUILD OUTPUT ONLY; inspect the linked tests and release-contract gates.\n' \
          "$M3_PREVIEW_REPOSITORY" "$M3_PREVIEW_REVISION" "$M3_PREVIEW_RUN" \
          "$M3_PREVIEW_PLATFORM" "$M3_PREVIEW_SUFFIX" > bundles/BUILD-PREVIEW.txt
      shell: bash

    - name: 'Upload bundles artifact'
      uses: actions/upload-artifact@v4
      with:
        name: bundles-${{ inputs.platform }}${{ inputs.debug-suffix }}
        path: bundles
        retention-days: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.keep-bundles == 'true' && 14 || 1 }}
      if: steps.bundles.outputs.bundles-found == 'true'
