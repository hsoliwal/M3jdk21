# SPDX-License-Identifier: Apache-2.0
name: M3 JDK21 array-only LFU facades (OpenRewrite + Java/JNI)
on:
  pull_request:
    paths:
      - 'm3/collections/src/main/java/com/m3/collections/M3LFUCache.java'
      - 'm3/collections/src/main/java/com/m3/collections/M3ApiEntryFacades.java'
      - 'm3/collections/src/test/java/com/m3/collections/M3ArrayOnlyFacadeSelfTest.java'
      - 'm3/collections/qualification/jdk21-array-only-entry-facades-20261018/**'
      - '.github/workflows/m3-jdk21-array-only-entry-facades-20261018.yml'
  workflow_dispatch:
jobs:
  m3-array-only-entry-facades:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run real Maven OpenRewrite source-seal and fixed-point tests
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/qualification/jdk21-array-only-entry-facades-20261018/recipe/pom.xml verify
      - name: Check actual generated files against canonical recipe templates
        run: |
          set -eu
          BASE=m3/collections/qualification/jdk21-array-only-entry-facades-20261018/recipe/src/main/resources/com/synexia/rewrite/jdk21-array-only-entry-facades-20261018
          cmp "$BASE/M3LFUCache.java.txt" m3/collections/src/main/java/com/m3/collections/M3LFUCache.java
          cmp "$BASE/M3ApiEntryFacades.java.txt" m3/collections/src/main/java/com/m3/collections/M3ApiEntryFacades.java
          cmp "$BASE/M3ArrayOnlyFacadeSelfTest.java.txt" m3/collections/src/test/java/com/m3/collections/M3ArrayOnlyFacadeSelfTest.java
          sha256sum m3/collections/src/main/java/com/m3/collections/M3LFUCache.java \
            m3/collections/src/main/java/com/m3/collections/M3ApiEntryFacades.java \
            m3/collections/src/test/java/com/m3/collections/M3ArrayOnlyFacadeSelfTest.java
      - name: Compile and run exact Java21 array-only facade owner/oracle
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m3-lfu"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-lfu" \
            m3/collections/src/main/java/com/m3/collections/M3LFUCache.java \
            m3/collections/src/main/java/com/m3/collections/M3ApiEntryFacades.java \
            m3/collections/src/test/java/com/m3/collections/M3ArrayOnlyFacadeSelfTest.java
          java -cp "$RUNNER_TEMP/m3-lfu" com.m3.collections.M3ArrayOnlyFacadeSelfTest
      - name: Retain unchanged M3 Java JNI bulk mask compatibility
        run: |
          set -eu
          mkdir -p "$RUNNER_TEMP/m3-mask" "$RUNNER_TEMP/m3-native"
          javac --release 21 -proc:none -Xlint:all -Werror -d "$RUNNER_TEMP/m3-mask" \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          cc -std=c17 -O2 -fPIC -shared -Wall -Wextra -Werror \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$RUNNER_TEMP/m3-native/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$RUNNER_TEMP/m3-native" \
            -cp "$RUNNER_TEMP/m3-mask" com.m3.collections.M3IndexMaskCompactorSelfTest --native
      - name: Full M3 collection owner Maven tests
        run: mvn -B -ntp -f m3/collections/pom.xml test
