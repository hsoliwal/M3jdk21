# SPDX-License-Identifier: Apache-2.0
name: M3 Apache array storage and original source parity
on:
  pull_request:
    paths:
      - 'src/main/java/com/m3/collections/apache/BoundedCollection.java'
      - 'src/main/java/com/m3/collections/apache/queue/CircularFifoQueue.java'
      - 'src/main/java/com/m3/collections/apache/iterators/IteratorChain.java'
      - 'src/main/java/com/m3/collections/apache/iterators/PermutationIterator.java'
      - 'src/test/java/com/m3/collections/apache/M3ArrayStorageOracle.java'
      - 'src/test/java/com/m3/collections/apache/iterators/*ArrayStorageTest.java'
      - 'src/test/java/com/m3/collections/apache/queue/*ArrayStorageTest.java'
      - 'src/test/resources/m3/array-storage-20261019/**'
      - 'm3/array-storage-20261019/**'
      - 'src/test/java/com/m3/collections/apache/queue/M3ApacheCircularFifoRelocationProof.java'
      - 'm3/package-first/apache-circular-20261018/**'
      - '.github/workflows/m3-apache-circular-package-first-20261018.yml'
  workflow_dispatch:
jobs:
  exact-java21-relocation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Exact original, historical relocation and current SDK output hashes
        run: |
          set -eu
          SRC=target/m3-original-source/src/main/java/org/apache/commons/collections4
          OUT=src/main/java/com/m3/collections/apache
          Q=m3/package-first/apache-circular-20261018/recipe
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import subprocess
          pin='6404dfdfe553097bb934e044034abcec5a4dbdd0'
          predecessor='13586e6bbbfed0f946c03ddaac62c8a1853ce12b'
          legacy=Path('target/m3-original-source')
          source_paths=[
              'src/main/java/org/apache/commons/collections4/BoundedCollection.java',
              'src/main/java/org/apache/commons/collections4/queue/CircularFifoQueue.java',
              'src/test/java/com/m3/collections/apache/queue/M3ApacheCircularFifoRelocationProof.java']
          for relative in source_paths:
              output=legacy/relative
              output.parent.mkdir(parents=True,exist_ok=True)
              output.write_bytes(subprocess.check_output(['git','show',pin+':'+relative]))
          src=legacy/'src/main/java/org/apache/commons/collections4'
          out=Path('src/main/java/com/m3/collections/apache')
          a=(src/'BoundedCollection.java').read_text(encoding='utf-8')
          b=(src/'queue/CircularFifoQueue.java').read_text(encoding='utf-8')
          assert (out/'BoundedCollection.java').read_text(encoding='utf-8') == a.replace(
              'package org.apache.commons.collections4;', 'package com.m3.collections.apache;')
          historical_queue=subprocess.check_output(['git','show',predecessor+':'+str(out/'queue/CircularFifoQueue.java')])
          assert historical_queue.decode('utf-8') == b.replace(
              'package org.apache.commons.collections4.queue;', 'package com.m3.collections.apache.queue;'
          ).replace('import org.apache.commons.collections4.BoundedCollection;',
                    'import com.m3.collections.apache.BoundedCollection;')
          q=Path('m3/package-first/apache-circular-20261018/recipe')
          for line in (q/'manifest.tsv').read_text().splitlines():
              target,before_hash,after_hash,template=line.split('\t')
              if target.endswith('M3ApacheCircularFifoRelocationProof.java'):
                  historical=(legacy/target).read_bytes()
              else:
                  historical=subprocess.check_output(['git','show',predecessor+':'+target])
              assert hashlib.sha256(historical).hexdigest()==after_hash,target
          receipt=Path('m3/array-storage-20261019/SOURCE_SHA256.tsv')
          for line in receipt.read_text(encoding='utf-8').splitlines():
              if not line or line.startswith('#'):
                  continue
              target,before_hash,after_hash=line.split('\t')
              assert hashlib.sha256(Path(target).read_bytes()).hexdigest()==after_hash,target
              if before_hash != 'ABSENT':
                  before=subprocess.check_output(['git','show',predecessor+':'+target])
                  assert hashlib.sha256(before).hexdigest()==before_hash,target
          print('PASS immutable original and historical relocation; exact current array-storage source seals')
          PY
          awk -F '\t' -v q="$Q" '{print $3 "  " q "/" $4}' "$Q/manifest.tsv" | sha256sum -c -
      - name: Compile actual original plus received Java21 owners
        run: |
          set -eu
          SRC=target/m3-original-source/src/main/java/org/apache/commons/collections4
          OUT=src/main/java/com/m3/collections/apache
          TST=target/m3-original-source/src/test/java/com/m3/collections/apache/queue
          mkdir -p target/m3-relocation/classes
          javac --release 21 -proc:none -Xlint:all,-this-escape,-serial -Werror \
            -d target/m3-relocation/classes \
            "$SRC/BoundedCollection.java" "$SRC/queue/CircularFifoQueue.java" \
            "$OUT/BoundedCollection.java" "$OUT/queue/CircularFifoQueue.java" \
            "$TST/M3ApacheCircularFifoRelocationProof.java"
          java -ea -cp target/m3-relocation/classes \
            com.m3.collections.apache.queue.M3ApacheCircularFifoRelocationProof
      - name: Strict Apache RAT license gate
        env:
          MAVEN_OPTS: -Xmx768m
        run: mvn -B -ntp apache-rat:check
      - name: Original owning behavior tests and independent retained-storage oracles
        if: always()
        env:
          MAVEN_OPTS: -Xmx768m
        run: |
          mvn -B -ntp -Drat.skip=true -Dmaven.compiler.testRelease=21 -DforkCount=1 -DreuseForks=true \
            -DargLine=-Xmx768m \
            -Dtest=IteratorChainTest,IteratorChainArrayStorageTest,PermutationIteratorTest,PermutationIteratorArrayStorageTest,CircularFifoQueueTest,CircularFifoQueueArrayStorageTest \
            test
