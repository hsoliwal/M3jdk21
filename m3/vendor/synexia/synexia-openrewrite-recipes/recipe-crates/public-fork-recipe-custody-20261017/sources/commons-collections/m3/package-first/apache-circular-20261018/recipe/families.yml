type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.m3.donors.RelocateApacheCollectionsFamily20261018
displayName: Relocate Apache Commons Collections into the M3 donor namespace
description: Apply only to an isolated donor working copy, not the public original API.
recipeList:
  - org.openrewrite.java.ChangePackage:
      oldPackageName: org.apache.commons.collections4
      newPackageName: com.m3.collections.apache
      recursive: true
