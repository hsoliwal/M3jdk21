# SPDX-License-Identifier: Apache-2.0
name: M3 runtime current source custody

on:
  pull_request:
    paths:
      - '.github/workflows/m3-runtime-current-custody.yml'
      - 'm3/runtime-integration/**'
      - 'm3/docs/name-mapping.d/m3-pattern-ascii-frontier.json'
      - 'm3/compatibility/m3-pattern-ascii-receive-20261014.json'
      - 'src/**'
      - 'test/jdk/java/util/regex/**'
      - 'make/**'
  push:
    branches: ['master', 'codex/runtime-current-custody-receiver-20261017']
    paths:
      - '.github/workflows/m3-runtime-current-custody.yml'
      - 'm3/runtime-integration/**'
      - 'm3/docs/name-mapping.d/m3-pattern-ascii-frontier.json'
      - 'm3/compatibility/m3-pattern-ascii-receive-20261014.json'
      - 'src/**'
      - 'test/jdk/java/util/regex/**'
      - 'make/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-current-custody-qualification:
    name: sealed runtime source custody and historical replay
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Reserve storage and require preinstalled Temurin JDK 21
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os, pathlib, re
          reserve, cap = 8 * 1024**3, 512 * 1024**2
          for name in ("RUNNER_TEMP", "GITHUB_WORKSPACE"):
              path = pathlib.Path(os.environ[name])
              if not path.is_dir() or path.is_symlink():
                  raise SystemExit("missing or redirected runner storage")
              facts = os.statvfs(path)
              if facts.f_bavail * facts.f_frsize < reserve + cap:
                  raise SystemExit("HOLD_STORAGE: reserve after planned 512 MiB")
          root = pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source = pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          if root.exists() or source.exists():
              raise SystemExit("owned output paths must be fresh")
          for path in (root, source):
              if not path.is_absolute() or any(char.isspace() for char in str(path)):
                  raise SystemExit("invalid explicit output path")
          cache = pathlib.Path(os.environ["RUNNER_TOOL_CACHE"]) / "Java_Temurin-Hotspot_jdk"
          candidates = []
          for version in cache.glob("21.*"):
              jdk = version / "x64"
              if re.fullmatch(r"21\.\d+\.\d+-\d+(?:\.\d+)*", version.name) and (version / "x64.complete").is_file() and all(os.access(jdk / "bin" / tool, os.X_OK) for tool in ("java", "javac")):
                  candidates.append((version.name, jdk))
          if not candidates:
              raise SystemExit("HOLD_TOOLCHAIN: preinstalled Temurin 21 required; no download")
          version, jdk = sorted(candidates)[-1]
          for relative in ("tmp", "home/.m2", "m2", "target", "generated-atom", "cache", "config", "data"):
              (root / relative).mkdir(parents=True, exist_ok=False)
          empty = '<settings xmlns="http://maven.apache.org/SETTINGS/1.2.0"/>\n'
          for name in ("settings.xml", "global-settings.xml"):
              (root / "home" / ".m2" / name).write_text(empty, encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("java-version=" + version.replace("-", "+", 1) + "\n")
              output.write("java-path=" + str(jdk.resolve()) + "\n")
          PY
      - name: Narrow shallow source checkout
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: m3-bounded-read-source
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1
          fetch-tags: false
          lfs: false
          submodules: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/workflows/m3-runtime-current-custody.yml
            /.gitattributes
            /m3/runtime-integration/current-custody-20261017/
            /m3/runtime-integration/recipe/
            /src/hotspot/share/cds/archiveHeapWriter.cpp
            /src/hotspot/share/classfile/javaClasses.cpp
            /src/hotspot/share/classfile/javaClasses.hpp
            /src/hotspot/share/classfile/javaClasses.inline.hpp
            /src/hotspot/share/classfile/stringTable.cpp
            /src/hotspot/share/classfile/vmClassMacros.hpp
            /src/hotspot/share/classfile/vmIntrinsics.cpp
            /src/hotspot/share/classfile/vmSymbols.hpp
            /src/hotspot/share/gc/shared/stringdedup/stringDedup.cpp
            /src/hotspot/share/gc/shared/stringdedup/stringDedupTable.cpp
            /src/hotspot/share/jfr/recorder/jfrRecorder.cpp
            /src/hotspot/share/opto/stringopts.cpp
            /src/hotspot/share/prims/jni.cpp
            /src/hotspot/share/prims/jvmtiTagMap.cpp
