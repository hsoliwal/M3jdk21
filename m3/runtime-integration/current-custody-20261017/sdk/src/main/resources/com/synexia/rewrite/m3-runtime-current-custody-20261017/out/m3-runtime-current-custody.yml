            /src/java.base/share/classes/jdk/internal/mindex/M3BitLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Bits.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Boundary.java
            /src/java.base/share/classes/jdk/internal/mindex/M3CB.java
            /src/java.base/share/classes/jdk/internal/mindex/M3CI.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Class.java
            /src/java.base/share/classes/jdk/internal/mindex/M3ClassFlags.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Constructor.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Descriptor.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Field.java
            /src/java.base/share/classes/jdk/internal/mindex/M3IntLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3LongLane28.java
            /src/java.base/share/classes/jdk/internal/mindex/M3MappedStringBacking.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Member.java
            /src/java.base/share/classes/jdk/internal/mindex/M3MemberFlags.java
            /src/java.base/share/classes/jdk/internal/mindex/M3MemberKind.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Method.java
            /src/java.base/share/classes/jdk/internal/mindex/M3PC.java
            /src/java.base/share/classes/jdk/internal/mindex/M3RecordComponent.java
            /src/java.base/share/classes/jdk/internal/mindex/M3Release.java
            /src/java.base/share/classes/jdk/internal/mindex/M3StringBacking.java
            /src/java.base/share/classes/jdk/internal/mindex/M3TQ.java
            /src/java.base/share/classes/jdk/internal/mindex/M3VI.java
            /src/java.base/share/legal/synexia.md
            /src/java.base/share/native/libjava/M3BitLane28.c
            /src/java.base/share/native/libjava/String.c
            /src/java.base/share/native/libjava/jni_util.c
            /src/jdk.hotspot.agent/share/classes/sun/jvm/hotspot/oops/OopUtilities.java
            /src/java.base/share/classes/java/lang/M3StringRegexDp.java
            /src/java.base/share/native/libjava/M3StringRegexDp.c
            /test/jdk/java/util/regex/M3PatternAsciiFrontierTest.java
            /test/jdk/java/util/regex/libM3PatternAsciiFrontierTest.c
            /m3/docs/name-mapping.d/m3-pattern-ascii-frontier.json
            /m3/compatibility/m3-pattern-ascii-receive-20261014.json
            /make/modules/java.base/Lib.gmk
            /make/modules/java.base/lib/CoreLibraries.gmk
            /make/common/modules/LibCommon.gmk
            /make/common/JdkNativeCompilation.gmk
            /make/CompileJavaModules.gmk
            /make/common/JavaCompilation.gmk
            /make/modules/java.base/Java.gmk
      # Sparse checkout is capacity-checked before and after; every proof child is continuously monitored.
      - name: Fresh post-checkout storage gate before JDK settings output
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
        shell: bash
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os, pathlib
          reserve, cap = 8 * 1024**3, 512 * 1024**2
          roots = (pathlib.Path(os.environ["RUNNER_TEMP"]), pathlib.Path(os.environ["M3_SOURCE_ROOT"]))
          def traversal_error(error):
              raise RuntimeError("HOLD_STORAGE: footprint traversal failed") from error
          used = 0
          for folder in roots:
              if not folder.is_dir() or folder.is_symlink():
                  raise SystemExit("HOLD_STORAGE: destination missing or redirected")
              for directory, names, files in os.walk(folder, followlinks=False, onerror=traversal_error):
                  for name in names + files:
                      try:
                          info = os.lstat(pathlib.Path(directory) / name)
                      except FileNotFoundError:
                          continue
                      used += max(info.st_size, info.st_blocks * 512)
          if used > cap:
              raise SystemExit("HOLD_STORAGE: aggregate source/cache/output exceeds 512 MiB")
          for folder in roots:
              facts = os.statvfs(folder)
              if facts.f_bavail * facts.f_frsize < reserve + cap - used:
                  raise SystemExit("HOLD_STORAGE: 8 GiB reserve after remaining output")
          print("Post-checkout aggregate bytes:", used)
          PY
      - name: Select the preinstalled JDK without network or Maven credentials
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          no_proxy: ''
        with:
          distribution: temurin
          java-version: ${{ steps.preflight.outputs.java-version }}
          java-package: jdk
          architecture: x64
          check-latest: false
          settings-path: ${{ env.M3_PROOF_ROOT }}/home/.m2
          overwrite-settings: false
          token: ''
      - name: Sealed runtime recipes and actual Python custody tests with storage guard
        shell: bash
        env:
          M3_PROOF_ROOT: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}
          M3_SOURCE_ROOT: ${{ github.workspace }}/m3-bounded-read-source
          TMPDIR: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TEMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          TMP: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/tmp
          XDG_CACHE_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/cache
          XDG_CONFIG_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/config
          XDG_DATA_HOME: ${{ runner.temp }}/m3-bounded-read-${{ github.run_id }}-${{ github.run_attempt }}/data
          EXPECTED_JAVA_HOME: ${{ steps.preflight.outputs.java-path }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GIT_NO_LAZY_FETCH: '1'
          GIT_TERMINAL_PROMPT: '0'
          GCM_INTERACTIVE: never
        run: |
          set -euo pipefail
          python3 -I -S -B - <<'PY'
          import os, pathlib, signal, subprocess, time
          reserve, cap = 8 * 1024**3, 512 * 1024**2
          root = pathlib.Path(os.environ["M3_PROOF_ROOT"])
          source = pathlib.Path(os.environ["M3_SOURCE_ROOT"])
          if pathlib.Path(os.environ["JAVA_HOME"]).resolve() != pathlib.Path(os.environ["EXPECTED_JAVA_HOME"]):
              raise SystemExit("unexpected JDK route")
          # Count all job temp, including checkout/setup-java temporary metadata, once.
          roots = (pathlib.Path(os.environ["RUNNER_TEMP"]), source)
          def traversal_error(error):
              raise RuntimeError("HOLD_STORAGE: footprint traversal failed") from error
          def gate():
              used = 0
              for folder in roots:
                  if not folder.is_dir() or folder.is_symlink():
                      raise RuntimeError("HOLD_STORAGE: owned destination missing or redirected")
                  for directory, names, files in os.walk(folder, followlinks=False, onerror=traversal_error):
                      for name in names + files:
                          try:
                              info = os.lstat(pathlib.Path(directory) / name)
                          except FileNotFoundError:
                              continue
                          used += max(info.st_size, info.st_blocks * 512)
              if used > cap:
                  raise RuntimeError("HOLD_STORAGE: aggregate source/cache/output exceeds 512 MiB")
              remaining = cap - used
              for folder in roots:
                  facts = os.statvfs(folder)
                  if facts.f_bavail * facts.f_frsize < reserve + remaining:
                      raise RuntimeError("HOLD_STORAGE: 8 GiB reserve after remaining output")
              return used
          gate()
          env = os.environ.copy()
          env.pop("GITHUB_TOKEN", None)
          env.pop("GH_TOKEN", None)
          env["MAVEN_OPTS"] = "-Xmx512m -Dfile.encoding=UTF-8 -Djava.io.tmpdir=" + str(root / "tmp") + " -Duser.home=" + str(root / "home")
          env["MAVEN_USER_HOME"] = str(root / "home" / ".m2")
          env["JAVA_TOOL_OPTIONS"] = "-Dfile.encoding=UTF-8 -Djava.io.tmpdir=" + str(root / "tmp") + " -Duser.home=" + str(root / "home") + " -XX:+PerfDisableSharedMem"
          import hashlib, json, re
          receiving = source / "m3/runtime-integration/current-custody-20261017"
          sdk = receiving / "sdk"
          metadata = json.loads((receiving / "source-binding.json").read_bytes())
          if metadata["repository"] != "hsoliwal/com.synexia" or metadata["sourcePath"] != "synexia-openrewrite-recipes/recipes/m3-runtime-current-custody-20261017/sdk" or metadata["receiverCorePath"] != "m3/runtime-integration/current-custody-20261017/sdk":
              raise SystemExit("runtime custody SDK source metadata drift")
          if not re.fullmatch(r"[0-9a-f]{40}", metadata["sourceCommit"]):
              raise SystemExit("runtime custody canonical source commit missing")
          if metadata["runtimeApplied"] is not False or metadata["phaseAdvanced"] is not False:
              raise SystemExit("runtime custody metadata cannot advance runtime or phase")
          if metadata["openrewriteAdapterGitBlob"] != "1c1b1b568d369f688f6953161636bf36b484bf5a" or metadata["manifestKernelGitBlob"] != "38df5f97bbeec8a8a8cfc77091d56bda925c07f2":
              raise SystemExit("runtime custody SDK provider identity drift")
          checkout = subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=source, text=True).strip()
          if checkout != os.environ["EXPECTED_SOURCE_SHA"]:
              raise SystemExit("runtime custody checkout is not the exact candidate head")
          sdk_tree = subprocess.check_output(["git", "rev-parse", "HEAD:" + metadata["receiverCorePath"]], cwd=source, text=True).strip()
          if sdk_tree != metadata["moduleGitTree"] or hashlib.sha256((sdk / "pins.json").read_bytes()).hexdigest() != metadata["pinsSha256"]:
              raise SystemExit("runtime custody SDK tree or pins drift")
          actual_workflow = source / ".github/workflows/m3-runtime-current-custody.yml"
          sealed_workflow = sdk / "src/main/resources/com/synexia/rewrite/m3-runtime-current-custody-20261017/out/m3-runtime-current-custody.yml"
          if hashlib.sha256(actual_workflow.read_bytes()).digest() != hashlib.sha256(sealed_workflow.read_bytes()).digest():
              raise SystemExit("runtime custody workflow differs from sealed recipe output")
          maven = ["mvn", "-B", "-ntp", "-s", str(root / "home" / ".m2" / "settings.xml"), "-gs", str(root / "home" / ".m2" / "global-settings.xml"), "-Dmaven.repo.local=" + str(root / "m2")]
          python = ["python3", "-I", "-S", "-B"]
          runtime_driver = "import hashlib, importlib.util, json, pathlib, sys, unittest\nsource = pathlib.Path(sys.argv[1]).resolve()\noutput = pathlib.Path(sys.argv[2]).resolve()\nsdk = source / \"m3/runtime-integration/current-custody-20261017/sdk\"\npins_data = (sdk / \"pins.json\").read_bytes()\npins = json.loads(pins_data)\nexpected = sorted(name + \".\" + method for name, methods in pins[\"runtimeTests\"].items() for method in methods)\nif not expected or len(expected) != len(set(expected)):\n    raise SystemExit(\"missing or duplicate pinned runtime test inventory\")\ntest_file = source / \"m3/runtime-integration/recipe/test_recipe.py\"\nspec = importlib.util.spec_from_file_location(\"m3_runtime_current_custody_tests\", test_file)\nmodule = importlib.util.module_from_spec(spec)\nspec.loader.exec_module(module)\nsuite = unittest.defaultTestLoader.loadTestsFromModule(module)\ndef cases(suite):\n    for case in suite:\n        if isinstance(case, unittest.TestSuite):\n            yield from cases(case)\n        else:\n            yield case\nactual = sorted(case.id().split(\".\", 1)[1] for case in cases(suite))\nif actual != expected:\n    raise SystemExit(\"actual runtime test inventory differs from pinned named methods\")\nresult = unittest.TextTestRunner(verbosity=2).run(suite)\ncounts = {\"tests\": result.testsRun, \"failures\": len(result.failures), \"errors\": len(result.errors), \"skipped\": len(result.skipped), \"expectedFailures\": len(result.expectedFailures), \"unexpectedSuccesses\": len(result.unexpectedSuccesses)}\nif result.testsRun != len(expected) or any(value for name, value in counts.items() if name != \"tests\") or not result.wasSuccessful():\n    raise SystemExit(\"runtime source custody test gate failed\")\ncohort_data = (source / \"m3/runtime-integration/recipe/current-cohort-20261017.json\").read_bytes()\ncohort = json.loads(cohort_data)\nif cohort[\"sourceCustodyOnly\"] is not True or any(cohort[name] is not False for name in (\"runtimeQualified\", \"jniQualified\", \"jdkQualified\", \"performanceQualified\", \"phaseAdvanced\")):\n    raise SystemExit(\"runtime source custody receipt cannot advance behavioral acceptance\")\nreceipt = {\"schema\": \"M3_RUNTIME_CURRENT_SOURCE_CUSTODY_TEST_RECEIPT_V1\", \"scope\": \"SOURCE_CUSTODY_AND_HISTORICAL_PATCH_REPLAY_ONLY\", \"counts\": counts, \"testIds\": actual, \"testSourceSha256\": hashlib.sha256(test_file.read_bytes()).hexdigest(), \"inputPinsSha256\": hashlib.sha256(pins_data).hexdigest(), \"cohortSha256\": hashlib.sha256(cohort_data).hexdigest(), \"sourceCustodyOnly\": True, \"matchedJdkJtreg\": \"NOT_RUN\", \"jniExecution\": \"NOT_RUN\", \"performanceAndRetention\": \"NOT_RUN\", \"runtimeApplied\": False, \"phaseAdvanced\": False}\noutput.write_text(json.dumps(receipt, indent=2) + \"\\n\", encoding=\"utf-8\")\nprint(\"M3_RUNTIME_CURRENT_SOURCE_CUSTODY_TESTS=PASS tests=\" + str(result.testsRun) + \" scope=SOURCE_CUSTODY_ONLY\")\n"
          commands = [
              python + [str(sdk / "verify.py"), "--self-test", "--repository", str(source)],
              maven + ["-f", str(sdk / "pom.xml"), "test"],
              python + [str(sdk / "verify.py"), "--reports", "--repository", str(source)],
              python + ["-c", runtime_driver, str(source), str(root / "runtime-custody-tests.json")],
          ]
          child = None
          log = root / "maven.log"
          try:
              with log.open("wb") as output:
                  for owned_command in commands:
                      gate()
                      child = subprocess.Popen(owned_command, cwd=source, env=env, stdin=subprocess.DEVNULL, stdout=output, stderr=subprocess.STDOUT, start_new_session=True)
                      while child.poll() is None:
                          gate()
                          time.sleep(1)
                      result = child.wait()
                      if result != 0:
                          raise SystemExit(result)
              used = gate()
