target_evidence:
  source_manifest_blob: 0ab05ad3f890035c15747d6f641ce31d5eaf2e11
  field_map_blob: 25f248060e6490fba5a088b34c1be83f83a3da4c
  owner_blob: d5b46507a2a7d693ab02adfc8299211283823b7d
  test_blob: 3bf9528136193f5298666d411b9df0e088b00d99
  build_blob: 5db3dcaf033af0efabb6e31acdf6bb8a65ad1564
  recipe_manifest_blob: 5bc51b2dc42a9b8ce509d4a6c1208631842734e8

phases:
  - SEARCH: pin the donor commit/path/blob and exact receiver head.
  - INVENTORY: retain vocabulary scope, source/replacement token order, and target fields.
  - CLASSIFY: ADAPT_COMPOSE; token IDs are the receiver representation.
  - FILTER: reject foreign vocabulary fingerprints, empty source phrases, duplicate ambiguity, and String-owned phrase payloads.
  - PROVE: run M3PhrasePrecomputeTest in jit, int, nocompact, and c2.
  - CHECKPOINT: keep OPEN_DRAFT until all four runtime markers exist.

invariants:
  - The phrase receiver is token-ID based and vocabulary scoped.
  - Left-to-right longest-prefix semantics remain authoritative.
  - Empty replacement targets remain representable.
  - No external phrase corpus or tokenizer is imported.
  - No phrase payload is stored in java.lang.String.
  - Runtime: NOT_RUN
  - Hosted CI: NOT_CLAIMED
