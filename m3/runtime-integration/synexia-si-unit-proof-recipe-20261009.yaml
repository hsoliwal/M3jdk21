schema: m3-recipe/v1
id: synexia-si-unit-proof-receipt-20261009
pattern: pinned-source-and-runtime-proof-boundary
purpose: Preserve the exact Synexia SI-unit donor and prevent promotion until the existing four-mode decoder proof executes.

inputs:
  - donor_receipt: m3/runtime-integration/synexia-si-unit-proof-receipt.tsv
  - target_map: m3/lexicon/synexia-si-unit-target-map.tsv
  - field_map: m3/lexicon/synexia-precompute-field-map.tsv
  - catalog: m3/core/src/com/m3/text/SharedLexiconPrecomputeCatalog.java
  - owner: m3/core/src/com/m3/text/M3LexiconPrecompute.java
  - catalog_test: m3/core/test/M3SiUnitPrecomputeCatalogTest.java
  - decoder_test: m3/core/test/SynexiaSiUnitDecoderTest.java
  - build: m3/build.sh

phases:
  - SEARCH: pin the Synexia SiUnit source commit, path, and blob before accepting the target map.
  - INVENTORY: retain source family, record identity, four precompute fields, owner, and proof modes.
  - CLASSIFY: ADAPT_COMPOSE; reuse the existing typed receiver and source-gated decoder.
  - FILTER: reject wrong source families, duplicate identities, non-finite offsets, out-of-range exponents, and String-owned lexical payloads.
  - PROVE: run the declared decoder in jit, int, nocompact, and c2; source checks alone cannot promote the target.
  - CHECKPOINT: keep the target state PENDING_TARGET_RECEIVER_PROOF until all four runtime markers are present.

mapping:
  source_family: dictlang.si-units
  source_record_id: unit_id
  fields: decimalExponent,dimensionPacked,offset,prefixable
  target_owner: com.m3.text.M3LexiconPrecompute.SiUnitPrecompute
  lookup: SharedLexiconPrecomputeCatalog.SiUnitIdentity
  license: Apache-2.0
  state: PENDING_TARGET_RECEIVER_PROOF

target_evidence:
  target_map_blob: 98e491cc391d212c13b732c7b7acfebf722a2f36
  field_map_blob: 6490b29ba92ae7f246f65a2b47ce85ea7be051b4
  build_blob: 3db12fd87065b99081fafd4425daf3ee02d38374
  decoder_blob: 5ca5f5d2e8833ff7c9f6f11349a289b630d9f45e
  recipe_manifest_blob: d0dd2119cfc339b09604cd2a363a84632283713a

verification:
  source_discriminator_command: python m3/runtime-integration/check-synexia-si-unit-proof-receipt.py --repo-root .
  source_discriminator: M3_SI_UNIT_PROOF_RECEIPT_SOURCE_PASS checks=41/41|runtime=NOT_RUN
  required_runtime_marker: M3JDK_SI_UNIT_PASS
  required_modes: jit,int,nocompact,c2
  runtime: NOT_RUN
  hosted_ci: NOT_CLAIMED
  benchmark: NOT_MEASURED

invariants:
  - No SI-unit payload is stored in java.lang.String.
  - The source family cannot be confused with dictlang.acronyms.
  - Runtime promotion requires all four mode markers.
  - No public M3String ABI or persisted image format changes.

storage:
  hosted_artifact_limit: 512MiB
  minimum_free_after_output: 8GiB
