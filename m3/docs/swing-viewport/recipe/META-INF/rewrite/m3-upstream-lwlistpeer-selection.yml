---
type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.M3UpstreamLWListPeerSelection
displayName: LWListPeer keeps the AWT List selection on select and setMultipleMode (JDK-8369327, upstream port)
description: >-
  Upstream port of JDK-8369327 (openjdk/jdk PR 27682, commit 8bef687f2e20e403df1f7aa4e1a47421f89ec39d;
  m3/docs/swing-viewport/UPSTREAM_PORTS.tsv). On macOS, java.awt.List is a lightweight peer over a JList. select
  replaced the selection instead of adding to it and accepted invalid indices; setMultipleMode let the JList's
  selection mode change clear the selection, so a List added to a Frame lost the items selected before. The two
  method bodies are upstream's, with fully qualified names in place of the imports upstream added. Unconditional.
  macOS only: not compiled or run on this machine (PENDING_CI, macOS). Applied by M3PerFileApply; a second pass
  must report UNCHANGED.
recipeList:
  - com.synexia.openrewrite.viewport.M3ReplaceMethodBody:
      declaringClasses: [sun.lwawt.LWListPeer]
      methodName: select
      parameterCount: 1
      bodySource: "{\n        synchronized (getDelegateLock()) {\n            javax.swing.ListModel<String> model = getDelegate().getModel();\n            if (index >= 0 && index < model.getSize()) {\n                getDelegate().setSkipStateChangedEvent(true);\n                try {\n                    getDelegate().getView().addSelectionInterval(index, index);\n                } finally {\n                    getDelegate().setSkipStateChangedEvent(false);\n                }\n            }\n        }\n    }"
  - com.synexia.openrewrite.viewport.M3ReplaceMethodBody:
      declaringClasses: [sun.lwawt.LWListPeer]
      methodName: setMultipleMode
      parameterCount: 1
      bodySource: "{\n        synchronized (getDelegateLock()) {\n            JList<String> view = getDelegate().getView();\n            int newMode = m ? javax.swing.ListSelectionModel.MULTIPLE_INTERVAL_SELECTION\n                    : javax.swing.ListSelectionModel.SINGLE_SELECTION;\n            if (view.getSelectionMode() == newMode) {\n                return;\n            }\n            int lead = view.getLeadSelectionIndex();\n            boolean wasSelected = lead != -1 && view.isSelectedIndex(lead);\n            getDelegate().setSkipStateChangedEvent(true);\n            try {\n                view.clearSelection();\n                view.setSelectionMode(newMode);\n                if (wasSelected) {\n                    view.setSelectedIndex(lead);\n                }\n            } finally {\n                getDelegate().setSkipStateChangedEvent(false);\n            }\n        }\n    }"
