  string-key-comparison-runtime:
    name: Focused String key comparison on matched VM
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    env:
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
      CODE_TOOLS_URL_BASE: https://github.com/openjdk
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact checked-out head
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
      - name: Get repository BootJDK
        id: bootjdk
        uses: ./.github/actions/get-bootjdk
        with:
          platform: linux-x64
      - name: Get repository JTReg
        id: jtreg
        uses: ./.github/actions/get-jtreg
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends autoconf make pkg-config gcc-12 g++-12 zip unzip zlib1g-dev \
            libasound2-dev libcups2-dev libfontconfig1-dev libfreetype6-dev \
            libx11-dev libxext-dev libxrender-dev libxrandr-dev libxtst-dev libxt-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 100 \
            --slave /usr/bin/g++ g++ /usr/bin/g++-12
      - name: Configure matching runtime
        run: |
          bash configure --with-conf-name=linux-x64-string-keys \
            --with-debug-level=fastdebug --with-jvm-variants=server \
            --with-boot-jdk="${{ steps.bootjdk.outputs.path }}" \
            --with-jtreg="${{ steps.jtreg.outputs.path }}" --with-zlib=system
      - name: Build matching runtime image
        run: make CONF=linux-x64-string-keys JOBS=2 images
      - name: Run focused String key and owner-lifetime jtreg
        run: |
          make CONF=linux-x64-string-keys JOBS=2 test \
            TEST="test/jdk/java/lang/String/M3StringKeyComparisonTest.java test/jdk/java/lang/String/M3StringOwnerRangeLifetimeTest.java test/jdk/java/lang/String/M3StringMixedEqualityGatesTest.java test/jdk/java/lang/String/M3StringPrecomputeBridgeTest.java test/jdk/java/lang/String/M3StringCompositeLiteralSearchCursorTest.java test/jdk/java/lang/String/M3StringCodePointRankCursorTest.java test/jdk/java/lang/String/M3StringKeyedCollectionsContractTest.java"
      - name: Run upstream keyed-collection contract with M3 storage enabled
        run: |
          "${{ steps.bootjdk.outputs.path }}/bin/java" \
            -jar "${{ steps.jtreg.outputs.path }}/lib/jtreg.jar" \
            -jdk:build/linux-x64-string-keys/images/jdk \
            -w:build/linux-x64-string-keys/test-support/string-keyed-feature-on/work \
            -r:build/linux-x64-string-keys/test-support/string-keyed-feature-on/report \
            -verbose:summary \
            -javaoption:-XX:+UnlockExperimentalVMOptions \
            -javaoption:-XX:+UseM3StringStorage \
            test/jdk/java/lang/String/M3StringKeyedCollectionsContractTest.java
      - name: Upload focused matched-runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m3-string-key-runtime-${{ github.run_id }}
          path: |
            build/linux-x64-string-keys/test-results
            build/linux-x64-string-keys/test-support
            build/linux-x64-string-keys/configure.log
          if-no-files-found: warn
          retention-days: 30
