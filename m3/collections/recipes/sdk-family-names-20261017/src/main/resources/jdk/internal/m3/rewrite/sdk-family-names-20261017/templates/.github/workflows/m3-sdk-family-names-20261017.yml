# SPDX-License-Identifier: Apache-2.0
name: M3 five-family SDK contracts
on:
  pull_request:
    paths:
      - 'm3/collections/interop/**'
      - 'm3/collections/recipes/sdk-family-names-20261017/**'
      - '.github/workflows/m3-sdk-family-names-20261017.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sdk-and-donors:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          sparse-checkout: m3/collections
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual recipe SDK and local Java/JNI gates
        run: mvn -B -f m3/collections/recipes/sdk-family-names-20261017/pom.xml clean verify
      - name: Build actual core, not substitute storage classes
        run: |
          mkdir -p /tmp/m3-core
          find m3/collections/src/main/java -name '*.java' > /tmp/m3-core-sources
          javac --release 21 -proc:none -Xlint:all,-module -Werror -d /tmp/m3-core @/tmp/m3-core-sources
          jar --create --file /tmp/m3-core.jar -C /tmp/m3-core .
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.2:install-file -Dfile=/tmp/m3-core.jar -DgroupId=com.m3 -DartifactId=m3-collections -Dversion=0.1.0-SNAPSHOT -Dpackaging=jar -DgeneratePom=true
      - name: Actual pinned donor libraries and SDK contracts
        run: mvn -B -f m3/collections/interop/pom.xml clean verify
      - name: Reject missing and skipped contract tests
        run: |
          python3 - <<'PYTEST'
          from pathlib import Path
          import xml.etree.ElementTree as E
          root=Path('m3/collections/interop/target/surefire-reports')
          reports=list(root.glob('TEST-*M3SdkFamiliesTest.xml'))
          assert len(reports)==1, 'missing new SDK contract suite'
          suite=E.parse(reports[0]).getroot()
          assert int(suite.get('tests','0'))==7, 'missing SDK methods'
          assert all(int(suite.get(k,'0'))==0 for k in ('failures','errors','skipped'))
          for report in root.glob('TEST-*.xml'):
              s=E.parse(report).getroot()
              assert all(int(s.get(k,'0'))==0 for k in ('failures','errors','skipped'))
          PYTEST
