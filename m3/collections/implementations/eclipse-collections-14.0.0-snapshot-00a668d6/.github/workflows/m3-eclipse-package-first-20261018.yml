name: M3 Eclipse namespace and pinned donor qualification
on:
  pull_request:
    paths:
      - 'eclipse-collections*/**'
      - 'unit-tests/**'
      - 'm3/package-first/eclipse-20261018/**'
      - 'm3/package-import-rename-20261018/**'
      - 'pom.xml'
      - 'checkstyle-*.xml'
      - '.github/workflows/m3-eclipse-package-first-20261018.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  namespace-and-original-differential:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      M3_DONOR_PIN: 'fbaa8605dad1a84900fd38a1f6954de31b733f07'
      MAVEN_OPTS: '-Xmx512m'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Recover immutable donor sources and independent original proof
        run: |
          set -eu
          ORIGINAL="$RUNNER_TEMP/m3-eclipse-original"
          mkdir -p "$ORIGINAL"
          git cat-file -e "$M3_DONOR_PIN^{commit}"
          git show "$M3_DONOR_PIN:eclipse-collections/src/main/java/org/eclipse/collections/impl/EmptyIterator.java" > "$ORIGINAL/EmptyIterator.java"
          git show "$M3_DONOR_PIN:eclipse-collections/src/main/java/org/eclipse/collections/impl/list/IntervalUtils.java" > "$ORIGINAL/IntervalUtils.java"
          git show "$M3_DONOR_PIN:eclipse-collections/src/test/java/com/m3/collections/eclipse/impl/M3EclipsePackageRelocationProof.java" > "$ORIGINAL/M3EclipsePackageRelocationProof.java"
          python3 - <<'PYCODE'
          import hashlib, os
          from pathlib import Path
          q = Path('m3/package-first/eclipse-20261018')
          original = Path(os.environ['RUNNER_TEMP']) / 'm3-eclipse-original'
          rows = [line.split('\t') for line in (q / 'recipe/manifest.tsv').read_text().splitlines()]
          for path, absent, expected, template in rows:
              assert hashlib.sha256((q / 'recipe' / template).read_bytes()).hexdigest() == expected
              if '/src/main/' in path:
                  assert hashlib.sha256(Path(path).read_bytes()).hexdigest() == expected
              else:
                  assert hashlib.sha256((original / 'M3EclipsePackageRelocationProof.java').read_bytes()).hexdigest() == expected
          for line in (q / 'SOURCE_HASHES.tsv').read_text().splitlines():
              if line.startswith('#') or line.startswith('Original file'):
                  continue
              relative, before, after, note = line.split('\t')
              assert hashlib.sha256((original / Path(relative).name).read_bytes()).hexdigest() == before
              live = Path('eclipse-collections/src/main/java/com/m3/collections/eclipse') / relative
              assert live.read_bytes() == (original / Path(relative).name).read_bytes().replace(
                  b'package org.eclipse.collections.', b'package com.m3.collections.eclipse.')
          print('PASS pinned original sources, immutable proof and actual relocated source hashes')
          PYCODE
      - name: Lint then compile and test actual relocated modules and consumers
        run: |
          set -eu
          mvn -version
          mvn -B -ntp -pl eclipse-collections-api,eclipse-collections,eclipse-collections-testutils,unit-tests -am \
            -Dmaven.compiler.meminitial=128m -Dmaven.compiler.maxmem=1024m \
            '-DargLine=-Xms128m -Xmx1024m' \
            -Dtest=ListsTest,SetsTest,MapsTest,AssertTest \
            -Dsurefire.failIfNoSpecifiedTests=false checkstyle:check test
      - name: Check clean compiled namespace and all factory fallback mappings
        run: |
          set -eu
          python3 - <<'PYCODE'
          from pathlib import Path
          for module in ('eclipse-collections-api', 'eclipse-collections',
                         'eclipse-collections-code-generator', 'eclipse-collections-code-generator-maven-plugin'):
              classes = Path(module) / 'target/classes'
              assert list((classes / 'com/m3/collections/eclipse').rglob('*.class')), module
              assert not list((classes / 'org/eclipse/collections').rglob('*.class')), module
          print('PASS producer and generator bytecode uses the relocated namespace')
          PYCODE
          OUT="$RUNNER_TEMP/m3-eclipse-factory/classes"
          mkdir -p "$OUT"
          javac -J-Xmx128m --release 21 -proc:none -Xlint:all -Werror -d "$OUT" \
            m3/package-import-rename-20261018/M3EclipseFactoryNamespaceProbe.java
          java -Xmx128m -ea -cp "$OUT:eclipse-collections-api/target/classes:eclipse-collections/target/classes" \
            M3EclipseFactoryNamespaceProbe
      - name: Compare actual relocated leaves against immutable independent donor oracle
        run: |
          set -eu
          ORIGINAL="$RUNNER_TEMP/m3-eclipse-original"
          SRC=eclipse-collections/src/main/java/com/m3/collections/eclipse
          OUT="$RUNNER_TEMP/m3-eclipse-differential/classes"
          mkdir -p "$OUT"
          javac -J-Xmx128m --release 21 -proc:none -Xlint:all,-unchecked -Werror -d "$OUT" \
            "$ORIGINAL/EmptyIterator.java" "$ORIGINAL/IntervalUtils.java" \
            "$SRC/impl/EmptyIterator.java" "$SRC/impl/list/IntervalUtils.java" \
            "$ORIGINAL/M3EclipsePackageRelocationProof.java"
          java -Xmx128m -ea -cp "$OUT" com.m3.collections.eclipse.impl.M3EclipsePackageRelocationProof
      - name: Retain actual target test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m3-eclipse-namespace-test-evidence
          if-no-files-found: warn
          path: |
            **/target/surefire-reports/*.xml
            **/target/checkstyle-result.xml
