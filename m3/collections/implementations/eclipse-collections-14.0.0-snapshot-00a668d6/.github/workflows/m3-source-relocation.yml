# SPDX-License-Identifier: Apache-2.0
# Historical implementation remains in Git history; this workflow cannot relocate or push source.
name: M3 Eclipse historical relocation retirement notice
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  retired-relocation-notice:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Locate applied namespace packet and authoritative verification workflow
        run: |
          set -eu
          test -f m3/package-import-rename-20261018/TASK_PACKET.json
          test -f m3/package-import-rename-20261018/FINAL_REPORT.md
          test -f .github/workflows/m3-eclipse-package-first-20261018.yml
          echo 'RETIRED: historical com.m3.sdk.eclipse.collections relocation is not applicable to this source tree.'
          echo 'Applied namespace: com.m3.collections.eclipse; see m3/package-import-rename-20261018.'
          echo 'Verification owner: .github/workflows/m3-eclipse-package-first-20261018.yml.'
          echo 'This notice does not run relocation, publish source, or certify lint/build/test results.'
