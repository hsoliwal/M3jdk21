# SPDX-License-Identifier: Apache-2.0
name: M3 SDK exact 34-owner interop source census
on:
  pull_request:
    paths:
      - 'm3/collections/interop/qualification/current-census-20261017/**'
      - 'm3/collections/qualification/m3-five-provider-current-census-20261017/**'
      - '.github/workflows/m3-five-provider-current-census-20261017.yml'
  workflow_dispatch:
jobs:
  source-sealed-current-census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Actual Maven/OpenRewrite named recipe, fixed point, drift refusal
        run: mvn -B -ntp -f m3/collections/qualification/m3-five-provider-current-census-20261017/recipe/pom.xml clean verify
      - name: Check exact four installed Python/TSV/doc postimages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          root=Path(".")
          r=root/"m3/collections/qualification/m3-five-provider-current-census-20261017/recipe/src/main/resources/com/synexia/rewrite/m3-five-provider-current-census-20261017"
          rows=(r/"manifest.tsv").read_text(encoding="utf-8").splitlines()
          assert len(rows)==4,len(rows)
          for line in rows:
              target,before,after,template=line.split("\t")
              expected=(r/template).read_bytes()
              actual=(root/target).read_bytes()
              assert sha256(expected).hexdigest()==after,(target,"template seal")
              if actual != expected:
              # The historical 34-file census can be followed only by this exact
              # reviewed source-sealed 2026-10-18 successor, not by arbitrary drift.
              successor = root/"m3/collections/qualification/m3-five-provider-indexed-projections-20261018/recipe/src/main/resources/com/synexia/rewrite/m3-five-provider-indexed-projections-20261018"
              approved = {
                  "m3/collections/interop/qualification/current-census-20261017/current-source-census.tsv": ("d439a75720ad222dff399e28d794906e1955d7c20a84bc545b8d99b29d0e7963", "daac777a08a081832436efba2a41d01a8e964b9054017ebc949cf5c36e506409"),
                  "m3/collections/interop/qualification/current-census-20261017/verify.py": ("1f7b04b3a5aa6da934c96b38518748aea692508d775a631696a0a95d41438787", "443a9bd4150a4b192bf4f14e8a618c361e63fedad31742b2868cab4f74b4fda7"),
              }
              assert target in approved, (target,"historical source changed without successor")
              source_manifest = (successor/"manifest.tsv").read_bytes()
              assert sha256(source_manifest).hexdigest()=="5aad026f5c2159aa62fe2236eb1484eff6724a1d3b56b59b11b97ab0851501d4", "unapproved successor manifest"
              successor_entries = {}
              for successor_line in source_manifest.decode("utf-8").splitlines():
                  successor_path, successor_before, successor_after, successor_template = successor_line.split("\t")
                  assert successor_path not in successor_entries, "duplicate successor"
                  successor_entries[successor_path] = (successor_before, successor_after, successor_template)
              assert len(successor_entries)==4
              assert target in successor_entries, target
              successor_before, successor_after, successor_template = successor_entries[target]
              assert (successor_before,successor_after)==approved[target], "broken source ancestry"
              assert successor_before==after, "historical/source chain mismatch"
              successor_content=(successor/successor_template).read_bytes()
              assert sha256(successor_content).hexdigest()==successor_after, "successor template drift"
              assert actual==successor_content, (target,"not qualified successor")

          print("PASS four census postimages or exact named successor")
          PY
      - name: Preserve synthetic negative tests and verify installed 34-file census
        run: |
          cd m3/collections/interop/qualification/current-census-20261017
          python3 -m unittest discover -p 'test_*.py' -v
          python3 verify.py
  five-real-provider-runtime:
    runs-on: ubuntu-latest
    needs: source-sealed-current-census
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile all current M3 indexed-array owners
        run: mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Run real Guava Eclipse Apache Spring and JDK interop contracts
        run: mvn -B -ntp -f m3/collections/interop/pom.xml clean verify
      - name: Retained primitive JNI mask regression with checked JNI and UBSan
        run: |
          set -eu
          C="$RUNNER_TEMP/m3-interop-census/classes"
          N="$RUNNER_TEMP/m3-interop-census/native"
          mkdir -p "$C" "$N"
          javac --release 21 -Xlint:all -Werror -d "$C" \
            m3/collections/src/main/java/com/m3/collections/M3IndexMaskCompactor.java \
            m3/collections/src/test/java/com/m3/collections/M3IndexMaskCompactorSelfTest.java
          cc -std=c17 -Wall -Wextra -Werror -fPIC -shared -O1 -g \
            -fsanitize=undefined -fno-sanitize-recover=all \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
            -o "$N/libm3_collections_mask.so"
          java -Xcheck:jni -Djava.library.path="$N" -cp "$C" \
            com.m3.collections.M3IndexMaskCompactorSelfTest
