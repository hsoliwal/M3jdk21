# SPDX-License-Identifier: Apache-2.0
name: M3 five-provider prepared rows Java/JNI
on:
  pull_request:
    paths:
      - 'm3/collections/interop/src/main/java/com/m3/collections/interop/M3FiveLibraryPreparedRows.java'
      - 'm3/collections/interop/src/test/java/com/m3/collections/interop/M3FiveLibraryPreparedRowsTest.java'
      - 'm3/collections/qualification/five-library-prepared-rows-20261018/**'
      - '.github/workflows/m3-five-library-prepared-rows-20261018.yml'
  workflow_dispatch:
jobs:
  five-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Run actual OpenRewrite recipe tests and fixed point
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/qualification/five-library-prepared-rows-20261018/recipe/pom.xml clean verify
      - name: Compile real M3 collection owners
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/pom.xml -DskipTests install
      - name: Execute real five-provider Java21/JUnit oracle
        run: |
          set -eu
          mvn -B -ntp -f m3/collections/interop/pom.xml -Dtest=M3FiveLibraryPreparedRowsTest test
      - name: Build production C17 indexed-mask library and repeat checked JNI
        run: |
          set -eu
          NATIVE="$RUNNER_TEMP/m3-five-provider-native"
          mkdir -p "$NATIVE"
          cc -std=c17 -O1 -g -Wall -Wextra -Werror -fPIC -shared \
             -fsanitize=undefined -fno-sanitize-recover=all \
             -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
             m3/collections/src/main/native/collections/m3_index_mask_compactor.c \
             -o "$NATIVE/libm3_collections_mask.so"
          mvn -B -ntp -f m3/collections/interop/pom.xml \
             -Dtest=M3FiveLibraryPreparedRowsTest \
             -DargLine="-Xcheck:jni -Djava.library.path=$NATIVE" test
