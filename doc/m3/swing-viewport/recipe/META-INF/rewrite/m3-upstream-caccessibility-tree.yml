type: specs.openrewrite.org/v1beta/recipe
name: com.synexia.openrewrite.viewport.M3UpstreamCAccessibilityTree
displayName: CAccessibility answers a JTree's accessible children from its rows (JDK-8317771, upstream port)
description: >-
  Upstream port of JDK-8317771 (openjdk/jdk PR 17165, commit ffa33d7b807bfef6ff05c9adba869dddf813cf68, fixed in
  JDK 23; m3/docs/swing-viewport/UPSTREAM_PORTS.tsv). On macOS 14 expanding or collapsing a JTree node from the
  keyboard froze the application: the accessibility bridge walked the tree's accessible children through the generic
  recursion. Upstream answers a JTree's children (all, or the selected ones) from its rows, one AccessibleJTreeNode per
  row, before the generic walk. The added method and the new body of getChildrenAndRolesRecursive are upstream's,
  with fully qualified names in place of the two imports upstream added. Unconditional. macOS only: not compiled
  or run on this machine (PENDING_CI, macOS). Applied by M3PerFileApply; a second pass must report UNCHANGED.
recipeList:
  - com.synexia.openrewrite.viewport.M3AddMemberIfMissing:
      declaringClasses: [sun.lwawt.macosx.CAccessibility]
      memberName: createAccessibleTreeNode
      beforeMethod: getChildrenAndRolesRecursive
      memberSource: "    private static Accessible createAccessibleTreeNode(JTree t, javax.swing.tree.TreePath p) {\n        Accessible a = null;\n\n        try {\n            Class<?> accessibleJTreeNodeClass = Class.forName(\"javax.swing.JTree$AccessibleJTree$AccessibleJTreeNode\");\n            java.lang.reflect.Constructor<?> constructor = accessibleJTreeNodeClass.getConstructor(t.getAccessibleContext().getClass(), JTree.class, javax.swing.tree.TreePath.class, Accessible.class);\n            constructor.setAccessible(true);\n            a = ((Accessible) constructor.newInstance(t.getAccessibleContext(), t, p, null));\n        } catch (Exception e) {\n            e.printStackTrace();\n        }\n\n        return a;\n    }\n"
  - com.synexia.openrewrite.viewport.M3ReplaceMethodBody:
      declaringClasses: [sun.lwawt.macosx.CAccessibility]
      methodName: getChildrenAndRolesRecursive
      parameterCount: 5
      bodySource: "{\n        if (a == null) return null;\n        return invokeAndWait(new Callable<Object[]>() {\n            public Object[] call() throws Exception {\n                ArrayList<Object> allChildren = new ArrayList<Object>();\n\n                Accessible at = null;\n                if (a instanceof CAccessible) {\n                    at = CAccessible.getSwingAccessible(a);\n                } else {\n                    at = a;\n                }\n\n                if (at instanceof JTree) {\n                    JTree tree = ((JTree) at);\n\n                    if (whichChildren == JAVA_AX_ALL_CHILDREN) {\n                        int count = tree.getRowCount();\n                        for (int i = 0; i < count; i++) {\n                            javax.swing.tree.TreePath path = tree.getPathForRow(i);\n                            Accessible an = createAccessibleTreeNode(tree, path);\n                            if (an != null) {\n                                AccessibleContext ac = an.getAccessibleContext();\n                                if (ac != null) {\n                                    allChildren.add(an);\n                                    allChildren.add(ac.getAccessibleRole());;\n                                    allChildren.add(String.valueOf((tree.isRootVisible() ? path.getPathCount() : path.getPathCount() - 1)));\n                                }\n                            }\n                        }\n                    }\n\n                    if (whichChildren == JAVA_AX_SELECTED_CHILDREN) {\n                        int count = tree.getSelectionCount();\n                        for (int i = 0; i < count; i++) {\n                            javax.swing.tree.TreePath path = tree.getSelectionPaths()[i];\n                            Accessible an = createAccessibleTreeNode(tree, path);\n                            if (an != null) {\n                                AccessibleContext ac = an.getAccessibleContext();\n                                if (ac != null) {\n                                    allChildren.add(an);\n                                    allChildren.add(ac.getAccessibleRole());\n                                    allChildren.add(String.valueOf((tree.isRootVisible() ? path.getPathCount() : path.getPathCount() - 1)));\n                                }\n                            }\n                        }\n                    }\n\n                    return allChildren.toArray();\n                }\n\n                ArrayList<Object> currentLevelChildren = new ArrayList<Object>();\n                ArrayList<Accessible> parentStack = new ArrayList<Accessible>();\n                parentStack.add(a);\n                ArrayList<Integer> indexses = new ArrayList<Integer>();\n                Integer index = 0;\n                int currentLevel = level;\n                while (!parentStack.isEmpty()) {\n                    Accessible p = parentStack.get(parentStack.size() - 1);\n\n                    currentLevelChildren.addAll(Arrays.asList(getChildrenAndRolesImpl(p, c, JAVA_AX_ALL_CHILDREN, allowIgnored, ChildrenOperations.COMMON)));\n                    if ((currentLevelChildren.size() == 0) || (index >= currentLevelChildren.size())) {\n                        if (!parentStack.isEmpty()) parentStack.remove(parentStack.size() - 1);\n                        if (!indexses.isEmpty()) index = indexses.remove(indexses.size() - 1);\n                        currentLevel -= 1;\n                        currentLevelChildren.clear();\n                        continue;\n                    }\n\n                    Accessible ca = null;\n                    Object obj = currentLevelChildren.get(index);\n                    if (!(obj instanceof Accessible)) {\n                        index += 2;\n                        currentLevelChildren.clear();\n                        continue;\n                    }\n                    ca = (Accessible) obj;\n                    Object role = currentLevelChildren.get(index + 1);\n                    currentLevelChildren.clear();\n\n                    AccessibleContext cac = ca.getAccessibleContext();\n                    if (cac == null) {\n                        index += 2;\n                        continue;\n                    }\n\n                    if ((cac.getAccessibleStateSet().contains(AccessibleState.SELECTED) && (whichChildren == JAVA_AX_SELECTED_CHILDREN)) ||\n                            (cac.getAccessibleStateSet().contains(AccessibleState.VISIBLE) && (whichChildren == JAVA_AX_VISIBLE_CHILDREN)) ||\n                            (whichChildren == JAVA_AX_ALL_CHILDREN)) {\n                        allChildren.add(ca);\n                        allChildren.add(role);\n                        allChildren.add(String.valueOf(currentLevel));\n                    }\n\n                    index += 2;\n\n                    if (cac.getAccessibleStateSet().contains(AccessibleState.EXPANDED)) {\n                        parentStack.add(ca);\n                        indexses.add(index);\n                        index = 0;\n                        currentLevel += 1;\n                        continue;\n                    }\n\n                }\n\n                return allChildren.toArray();\n            }\n        }, c);\n    }\n"
